y>は\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>がした\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>を\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じリズムで\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>させます。\u003cruby>前後\u003crt>ぜんご\u003c/rt>\u003c/ruby>まで\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいときは、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>や\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめられるようにしました。","zh":"如果前后也用不同模式，驾驶员就要边开车边想各自代表什么。我用同一节奏，在声音所在的左侧或右侧发出震动。要知道前后时，由画面或语音补充。"}]},{"id":"qa-around-4","title":"你做到了哪一步？接下来想验证什么？","page":"P59–63、P66","blocks":[{"type":"prompt","ja":"どこまで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りましたか。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめますか。","zh":"你做到了哪一步？接下来想验证什么？"},{"type":"speech","ja":"\u003cruby>走行中\u003crt>そうこうちゅう\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>から、\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>での\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>、\u003cruby>駐車\u003crt>ちゅうしゃ\u003c/rt>\u003c/ruby>\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>に\u003cruby>見返\u003crt>みかえ\u003c/rt>\u003c/ruby>すところまでを、Figmaで\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にしました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>運転\u003crt>うんてん\u003c/rt>\u003c/ruby>\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>で\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>がある\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>とない\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>をシミュレーターで\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べて、\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>の\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるかと、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>がどれくらいかを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たいです。","zh":"我用 Figma 做了行车提醒、语音确认和停车后查看的界面。下一步想在同一模拟驾驶场景比较有无提醒，同时观察方向能不能看懂，以及看屏幕花了多少时间。"}]},{"id":"qa-around-5","title":"无法判断声音方向时，界面会显示什么？","page":"P61–62","blocks":[{"type":"prompt","ja":"\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないときは、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>るんですか。","zh":"无法判断声音方向时，界面会显示什么？"},{"type":"speech","ja":"\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かっても、\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>推定\u003crt>すいてい\u003c/rt>\u003c/ruby>できないことがあります。その\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>は、\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>の\u003cruby>種類\u003crt>しゅるい\u003c/rt>\u003c/ruby>と「\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>\u003cruby>不明\u003crt>ふめい\u003c/rt>\u003c/ruby>」を\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>し、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りを\u003cruby>点線\u003crt>てんせん\u003c/rt>\u003c/ruby>で\u003cruby>囲\u003crt>かこ\u003c/rt>\u003c/ruby>みます。\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>で\u003cruby>尋\u003crt>たず\u003c/rt>\u003c/ruby>ねられたときも、\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>は\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないと\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>く\u003cruby>答\u003crt>こた\u003c/rt>\u003c/ruby>えるようにしました。","zh":"有时可以识别是什么声音，方向还无法推断。界面显示声音类型和「方向不明」，用虚线围住车身，用语音询问时也会简短说方向未知。"}]},{"id":"qa-around-6","title":"听说你最近改过这页，最主要改了什么？","page":"P61","blocks":[{"type":"prompt","ja":"\u003cruby>最近\u003crt>さいきん\u003c/rt>\u003c/ruby>このページを\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>したそうですが、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わりましたか。","zh":"听说你最近改过这页，最主要改了什么？"},{"type":"speech","ja":"\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるときと、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないときの\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いを、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>絵\u003crt>え\u003c/rt>\u003c/ruby>の\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>で\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べられるようにしました。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>はクラクションが\u003cruby>左後\u003crt>ひだりうし\u003c/rt>\u003c/ruby>ろなので、その\u003cruby>位置\u003crt>いち\u003c/rt>\u003c/ruby>に\u003cruby>波紋\u003crt>はもん\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>は\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>だけ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かった\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>で、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りを\u003cruby>点線\u003crt>てんせん\u003c/rt>\u003c/ruby>で\u003cruby>囲\u003crt>かこ\u003c/rt>\u003c/ruby>みます。どちらも\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>はそのまま\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られます。","zh":"我把已知和未知两种方向做成可以直接看车身图比较的画面。中图知道喇叭声来自左后方，在对应位置显示波纹。右图只知道响了喇叭，就用虚线圈住车身。两种情况下地图都能继续看。"}]}]}]},{"id":"reverse","label":"反问","kind":"reverse","groups":[{"id":"ordering","label":"作品排序","items":[{"id":"which-work-first","title":"哪件作品最适合放在第一件？","page":"P4","blocks":[{"type":"speech","ja":"ちょっと\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>っているのが、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>く\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>なんです。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>にして、その\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>にロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いています。\u003cruby>御社\u003crt>おんしゃ\u003c/rt>\u003c/ruby>のクリエイティブ\u003cruby>職\u003crt>しょく\u003c/rt>\u003c/ruby>に\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>するとしたら、どちらを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せると、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>の\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>え\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりやすそうですか。ほかに\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たい\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>があれば、それも\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えていただきたいです。","zh":"其实我有点犹豫第一件放什么。现在是退货作品在前，扫地机器人 App 在后。从贵司创意岗的角度看，您觉得哪件放在前面更容易看出我的思考方式？如果有别的作品更适合先展示，也想听听您的意见。"}]},{"id":"which-work-brief","title":"时间有限时，简短问作品顺序","page":"P4","blocks":[{"type":"speech","ja":"この\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せるなら、どの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>がよさそうですか。","zh":"这些作品里面，您觉得哪件最适合放第一？"}]}]},{"id":"follow-feedback","label":"顺着反馈追问","items":[{"id":"ask-followup-1","title":"如果用这件开头，您觉得从哪一页开始最容易看懂？","page":"","blocks":[{"type":"note","ja":"","zh":"他选出了第一件"},{"type":"speech","ja":"その\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>なら、どのページから\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せると\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりやすそうですか。","zh":"如果用这件开头，您觉得从哪一页开始最容易看懂？"}]},{"id":"ask-followup-2","title":"如果顺序照现在，您觉得第一件先改哪一页比较好？","page":"","blocks":[{"type":"note","ja":"","zh":"他觉得现在的顺序合适"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>でいくなら、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>はどのページから\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すとよさそうですか。","zh":"如果顺序照现在，您觉得第一件先改哪一页比较好？"}]},{"id":"ask-followup-3","title":"纸本作品可以往前放一些吗？","page":"","blocks":[{"type":"note","ja":"","zh":"他对纸本或视觉作品印象更深"},{"type":"speech","ja":"\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>は、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ってきたほうがよさそうですか。","zh":"纸本作品可以往前放一些吗？"}]},{"id":"ask-followup-4","title":"您看到哪一页时，不太容易看出我是怎么想、怎么做决定的？","page":"","blocks":[{"type":"note","ja":"","zh":"他说过程还不够清楚"},{"type":"speech","ja":"どのページで、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がどう\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めたかが\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えにくかったですか。","zh":"您看到哪一页时，不太容易看出我是怎么想、怎么做决定的？"}]},{"id":"research-to-decision","title":"调研和设计决定之间的关系看得出来吗？","page":"P8 → P14","blocks":[{"type":"speech","ja":"この\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>を\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けて\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たときに、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べたことと、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだことは、つながって\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えますか。","zh":"如果把这两页连起来看，您觉得从我查网店的退货说明，到我为什么选中间这案，中间的关系看得出来吗？"}]}]},{"id":"article-talk","label":"聊 I-STUDIO 设计师的文章","items":[{"id":"article-approach","title":"读过諏訪的文章，想问 App 和书籍设计该怎么排","page":"P4","blocks":[{"type":"note","ja":"","zh":"对方已经看过 App 和书籍设计作品，聊到作品顺序时，可以翻回 P4 的目录。问完先听他讲两种开头给他的印象。"},{"type":"speech","ja":"\u003cruby>御社\u003crt>おんしゃ\u003c/rt>\u003c/ruby>のデザイナーの\u003cruby>諏訪\u003crt>すわ\u003c/rt>\u003c/ruby>さんが、ご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>のポートフォリオについて\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれた\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>をnoteで\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>面接\u003crt>めんせつ\u003c/rt>\u003c/ruby>で「\u003cruby>自信\u003crt>じしん\u003c/rt>\u003c/ruby>のある\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>してください」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>かれたそうです。デジタルの\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>だからといって、そこに\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>まで\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせなくていい、というお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>が\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。","zh":"我在 note 上读了贵公司的设计师諏訪先生介绍自己作品集的文章。他写到，面试时对方请他介绍一件自己有信心的作品。他说，即便应聘的是做数字创意的公司，作品也不必刻意去迎合。这一点让我印象很深。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>ではグラフィックデザインを\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>んでいて、\u003cruby>特\u003crt>とく\u003c/rt>\u003c/ruby>に\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ることに\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れていました。\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ってからはUI/UXに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>を\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>って、\u003cruby>独学\u003crt>どくがく\u003c/rt>\u003c/ruby>でアプリの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>も\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るようになりました。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はUI/UXの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>がしたいので、\u003cruby>作品集\u003crt>さくひんしゅう\u003c/rt>\u003c/ruby>でもアプリを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せています。","zh":"我本科学的是平面设计，尤其在做书这件事上下过功夫。进大学院后，我对 UI/UX 产生了兴趣，开始自学，也自己做了 App 作品。因为现在想应聘 UI/UX 岗位，我就把 App 放在了作品集前面。"},{"type":"speech","ja":"ただ、ブックデザインの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>後\u003crt>うし\u003c/rt>\u003c/ruby>ろにまとめていいのか、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>っていて。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>、\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていただいて、アプリから\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たときと、ブックデザインから\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たときとで、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>の\u003cruby>強\u003crt>つよ\u003c/rt>\u003c/ruby>みってどう\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>って\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えそうですか。","zh":"不过，把书籍设计作品都放在后面，我还是有点犹豫。今天您两类作品都看过了。如果先看 App，或者先看书籍设计，您看到的我的长处会有什么不同？"}]},{"id":"article-which-page","title":"对方说完两种开头的印象，再请他选第一件","page":"","blocks":[{"type":"note","ja":"","zh":"如果对方已经解释了两种顺序各能看出什么，还没建议第一件放什么，就接这句。对方已经选了就听他讲理由。"},{"type":"speech","ja":"なるほど。では、UI/UXの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>に\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>するとしたら、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>の\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>はどの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>くのがよさそうですか。","zh":"明白了。那如果是我去应聘 UI/UX 岗位，您会建议我具体把哪件作品放在最前面？"}]},{"id":"article-confident-feedback","title":"我选 MORI 作为最有信心的作品，您还想深问哪一点？","page":"P17","blocks":[{"type":"note","ja":"","zh":"对方刚听完你讲 MORI，也看过 P17 的退款界面。若已经聊过諏訪的文章，可以直接从第二句问起。"},{"type":"speech","ja":"\u003cruby>御社\u003crt>おんしゃ\u003c/rt>\u003c/ruby>のデザイナーの\u003cruby>諏訪\u003crt>すわ\u003c/rt>\u003c/ruby>さんが、\u003cruby>面接\u003crt>めんせつ\u003c/rt>\u003c/ruby>で「\u003cruby>自信\u003crt>じしん\u003c/rt>\u003c/ruby>のある\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>してください」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>かれたと、noteに\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれていました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>MORIを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだんですが、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、どのあたりをもう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>詳\u003crt>くわ\u003c/rt>\u003c/ruby>しく\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいですか。","zh":"我读了贵公司的设计师諏訪先生在 note 上的文章。他写到，面试时对方请他介绍一件自己有信心的作品。我今天选了 MORI。听完刚才的介绍，您最想让我再展开讲哪一部分？"}]},{"id":"article-show-book","title":"只看了 UI/UX，想自然地带到书的作品","page":"P68","blocks":[{"type":"note","ja":"","zh":"还剩几分钟，对方目前只看了 App，你想带出 P68 的亚克力书。等对方同意再翻页。"},{"type":"speech","ja":"\u003cruby>御社\u003crt>おんしゃ\u003c/rt>\u003c/ruby>のデザイナーの\u003cruby>諏訪\u003crt>すわ\u003c/rt>\u003c/ruby>さんが、\u003cruby>学生時代\u003crt>がくせいじだい\u003c/rt>\u003c/ruby>に\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れたアナログの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>をnoteで\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>されているのを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>も\u003cruby>学生\u003crt>がくせい\u003c/rt>\u003c/ruby>の\u003cruby>間\u003crt>あいだ\u003c/rt>\u003c/ruby>に\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>をいくつか\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ってきたので、\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>だけお\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せしてもよろしいですか。","zh":"我在 note 上读到贵公司的设计师諏訪先生介绍了自己学生时代下过功夫的手工作品。我在学校也做了几本书，可以给您看其中一本吗？"}]},{"id":"article-book-process","title":"对方选了亚克力书，顺着问它从哪页讲最清楚","page":"P68 → P74","blocks":[{"type":"note","ja":"","zh":"对方刚指出这本书给他留下印象，再对照 P68 成品、P74 试作。此时不用再提文章。"},{"type":"speech","ja":"この\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>だと、\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>した\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せているのがこちらで、こっちは\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>でパーツがこぼれて、\u003cruby>留\u003crt>と\u003c/rt>\u003c/ruby>め\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えたところです。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にお\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せするなら、どちらのほうが、この\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>の\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>さが\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりそうですか。","zh":"这本书里，这一页是完成的封面，这一页是试作时里面的小片掉出来、我又改了固定方式。如果先给人看一页，您觉得从哪一页更能看出这本书有意思的地方？"}]},{"id":"article-studio-work","title":"想听讲评人聊聊工作中的例子","page":"","blocks":[{"type":"note","ja":"","zh":"对方聊起公司实际工作时，想顺势请他讲一个例子。若前面已经提过文章，这里直接问。"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>のお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いて、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってみたいんですが、\u003cruby>御社\u003crt>おんしゃ\u003c/rt>\u003c/ruby>のお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>で、\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>や\u003cruby>立体\u003crt>りったい\u003c/rt>\u003c/ruby>のものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ってきた\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>が、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せ\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>や\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるときに\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>きた\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>ってありますか。","zh":"听您刚才这么说，我也有点好奇。在贵公司的项目里，有没有人把做纸本或立体作品的经验，用到了画面呈现或者动效上？我很想听听这样的例子。"}]}]},{"id":"review-talk","label":"看完具体作品后，可以和讲评人聊什么","items":[{"id":"ask-mori-observe","title":"MORI｜如果找一位真的退过货的人试用，您最想观察什么？","page":"P14","blocks":[{"type":"note","ja":"","zh":"刚看过 P14 的三个方案。对方开始聊你为什么选择中间那案，或问你怎么知道使用者能看懂。"},{"type":"speech","ja":"この\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つの\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>したことのある\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>していただくとしたら、どんなところを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て「この\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>がよさそうだ」と\u003cruby>判断\u003crt>はんだん\u003c/rt>\u003c/ruby>されますか。","zh":"如果请一位真的退过衣服的人试用这三个方案，您会观察什么，来判断哪一案更合适？"}]},{"id":"ask-book-skill","title":"从做书到做 App｜您会把我的哪一种做法带到下一件作品里？","page":"P75","blocks":[{"type":"note","ja":"","zh":"对方在 P75 注意到了目录、分隔页和章首页用同一种颜色，也已经看过你的 App。适合接在对方对书的具体评价后面。"},{"type":"speech","ja":"この\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>では、\u003cruby>目次\u003crt>もくじ\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>た\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>をたどると、\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みたい\u003cruby>章\u003crt>しょう\u003c/rt>\u003c/ruby>が\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>けるようにしました。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていただいたアプリの\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、こういう\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りの\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>をもっと\u003cruby>活\u003crt>い\u003c/rt>\u003c/ruby>かせそうな\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>って、どこかありましたか。","zh":"这本书里，读者顺着目录里的颜色，就能翻到想看的章节。您今天看过的几个 App 里，有没有哪个界面，让您觉得我可以把这种做书的经验再用得更好一点？"}]},{"id":"ask-around-demo","title":"AROUND｜如果能亲自体验一个场景，您想试哪一段？","page":"P60 → P61","blocks":[{"type":"note","ja":"","zh":"看到 P60 的座椅振动和 P61 的方向提示时，对方想知道坐在车里会是什么感觉。"},{"type":"speech","ja":"この\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>は、まずシートの\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>で\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づいてもらうので、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>だけだと\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えにくいところがあるんです。もし\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>だけ\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>体験\u003crt>たいけん\u003c/rt>\u003c/ruby>できるようにするとしたら、どの\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を、どんなふうに\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してみたいですか。","zh":"这件作品首先靠座椅振动让驾驶员留意到提示，光看屏幕，有些地方很难体会。如果只能做一个场景让您亲自体验，您最想试哪一段、想怎么试？"}]},{"id":"ask-team-decision","title":"讲评人自己的工作｜两个方案各有道理，最后靠什么决定？","page":"","blocks":[{"type":"note","ja":"","zh":"对方从你的方案比较聊起自己团队的工作时。给他时间讲一个真实例子。"},{"type":"speech","ja":"お\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>で、どちらの\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>にも\u003cruby>良\u003crt>よ\u003c/rt>\u003c/ruby>さがあって、チームの\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれたことってありますか。もしあれば、そのとき\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>め\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>になったのか、\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってみたいです。","zh":"您在工作里有没有遇过两个方案各有长处，团队里大家意见不同的时候？如果有，我很想听听，当时是什么让大家最后做了决定。"}]},{"id":"ask-missing-explanation","title":"收尾前｜哪一点是听我讲了才明白，应该补进作品集？","page":"","blocks":[{"type":"note","ja":"","zh":"讲评快结束，想把意见变成一次具体修改时。问完留时间让对方想一想。"},{"type":"speech","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>の\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いて、\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて「あ、そういうことだったんだ」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったところはありましたか。あとで\u003cruby>作品集\u003crt>さくひんしゅう\u003c/rt>\u003c/ruby>だけ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>た\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にも\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるように、そこを\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>したいなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っていて。","zh":"今天有没有哪一处，是您听我讲了才觉得「啊，原来是这个意思」的？我想把那一处改一下，让以后只看到作品集的人也能看懂。"}]}]}]},{"id":"closing","label":"收尾","kind":"flow","groups":[{"id":"farewell","label":"结束时","items":[{"id":"response-to-feedback","title":"复述一条具体建议","page":"P14","blocks":[{"type":"note","ja":"","zh":"比如对方确实建议 P14 提前时。"},{"type":"speech","ja":"なるほど。P14の\u003cruby>比較\u003crt>ひかく\u003c/rt>\u003c/ruby>を\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せると、どう\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだかが\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすくなるんですね。まずそこから\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>してみます。\u003cruby>具体的\u003crt>ぐたいてき\u003c/rt>\u003c/ruby>に\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えていただいて、ありがとうございました。","zh":"原来如此。先看 P14 的方案比较，就更容易明白我为什么选这案。我会先从这里调整。谢谢您给我这么具体的意见。"}]},{"id":"thanks","title":"时间到了，向对方致谢","page":"","blocks":[{"type":"speech","ja":"\u003cruby>本日\u003crt>ほんじつ\u003c/rt>\u003c/ruby>は\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていただき、ありがとうございました。いただいたアドバイスをもとに、\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>してみます。\u003cruby>失礼\u003crt>しつれい\u003c/rt>\u003c/ruby>します。","zh":"谢谢您今天看我的作品。我会根据您的建议调整。那我先告辞了。"}]}]}]}]}</script>
<script>
'use strict';
const data = JSON.parse(document.getElementById('reader-data').textContent);
const byId = id => document.getElementById(id);
const make = (tag, cls, text) => {
  const element = document.createElement(tag);
  if (cls) element.className = cls;
  if (text !== undefined) element.textContent = text;
  return element;
};
const root = document.documentElement;
const contents = byId('contents');
const settings = byId('settings');
const sectionLabels = {opening:'开场', pages:'逐页介绍', questions:'问答', reverse:'反问', closing:'收尾'};
const settingsKey = 'istudio-reader-settings-v1';
const settingsFields = [
  {key:'font', label:'日文字号', prop:'--body-size', min:16, max:30, step:1, value:20, unit:'px'},
  {key:'leading', label:'行距', prop:'--leading', min:1.55, max:2.50, step:.05, value:2.05, unit:''},
  {key:'space', label:'字间距', prop:'--letters', min:0, max:.15, step:.01, value:.02, unit:'em'},
  {key:'rubySize', label:'假名大小', prop:'--ruby-size', min:.28, max:.75, step:.01, value:.42, unit:'em'},
  {key:'rubyGap', label:'假名与汉字间距', prop:'--ruby-gap', min:0, max:6, step:1, value:1, unit:'px'}
];
let stored = {};
try { stored = JSON.parse(localStorage.getItem(settingsKey) || '{}') || {}; } catch {}
const prefs = {zh:stored.zh !== false, ruby:stored.ruby !== false};
const fields = new Map();
let current;
let activeTab;
let opener;
const indexed = [];
const itemsById = new Map();
let settingsPosition;

function persist() {
  try { localStorage.setItem(settingsKey, JSON.stringify(prefs)); } catch {}
}
function applyPrefs() {
  root.classList.toggle('no-zh', !prefs.zh);
  root.classList.toggle('no-ruby', !prefs.ruby);
  byId('zh-button').setAttribute('aria-pressed', String(prefs.zh));
  byId('ruby-button').setAttribute('aria-pressed', String(prefs.ruby));
  settingsFields.forEach(field => {
    const val = prefs[field.key];
    root.style.setProperty(field.prop, val + field.unit);
    const {input, output} = fields.get(field.key);
    input.value = String(val);
    output.value = field.key === 'rubySize' ? Math.round(val * 100) + '%' : field.key === 'leading' ? val + ' 倍' : val + ' ' + field.unit;
  });
}
function buildControls() {
  settingsFields.forEach(field => {
    const raw = stored[field.key];
    prefs[field.key] = Number.isFinite(raw) ? Math.min(field.max, Math.max(field.min, raw)) : field.value;
    const wrap = make('div', 'control');
    const label = make('label', '', field.label);
    const input = make('input');
    input.type = 'range';
    input.id = 'setting-' + field.key;
    for (const attr of ['min','max','step']) input[attr] = String(field[attr]);
    label.htmlFor = input.id;
    const output = make('output');
    output.setAttribute('for',input.id);
    label.append(output);
    wrap.append(label,input);
    byId('settings-controls').append(wrap);
    fields.set(field.key,{input,output});
    input.addEventListener('input', () => {
      prefs[field.key] = Number(input.value);
      applyPrefs(); persist();
    });
  });
  applyPrefs();
}
function pageLinks(value) {
  const label = make('span','page');
  for (const token of String(value).split(/(P?\s*\d+)/gi)) {
    const number = /^P?\s*(\d+)$/i.exec(token);
    if (!number) { label.append(token); continue; }
    const link = make('a','',token);
    link.href = '#p' + number[1];
    link.setAttribute('aria-label','跳到第 ' + number[1] + ' 页');
    label.append(link);
  }
  return label;
}
function drawReader() {
  const fragment = document.createDocumentFragment();
  data.sections.forEach(section => {
    const outer = make('section', 'reader-section');
    const head = make('div', 'section-head');
    head.append(make('h2','',section.label));
    outer.append(head);
    section.groups.forEach(group => {
      if (!group.items.length) return;
      const groupEl = make('div', 'group');
      if (section.groups.length > 1 || group.label !== section.label) groupEl.append(make('h3','groupname',group.label));
      group.items.forEach(item => {
        const article = make('article','card');
        article.id = item.id; article.tabIndex = -1;
        const itemHead = make('div','card-head');
        const isPage = section.kind === 'pages';
        if (item.page) {
          itemHead.append(isPage ? make('span','page',item.page) : pageLinks(item.page));
        }
        itemHead.append(make('h4','',item.title));
        article.append(itemHead);
        item.blocks.forEach(block => {
          if (!block.ja && !block.zh) return;
          const row = make('div','block ' + block.type);
          if (block.page) {
            const cue = pageLinks(block.page);
            cue.classList.add('block-page');
            row.append(cue);
          }
          if (block.ja) {
            const ja = make('p','jp');
            ja.lang = 'ja';
            ja.innerHTML = block.ja;
            row.append(ja);
          }
          if (block.zh && (!block.ja || block.zh !== item.title)) {
            row.append(make('p','zh' + (block.ja ? ' translation':''),block.zh));
          }
          article.append(row);
        });
        if (item.id === 'article-approach') {
          const source = make('a','article-source','阅读原文 · 博報堂アイ・スタジオ note');
          source.href = 'https://note.com/hakuhodoi_studio/n/n74562aa71b60';
          article.append(source);
        }
        groupEl.append(article);
        const entry = {section,group,item,article};
        indexed.push(entry); itemsById.set(item.id,entry);
      });
      outer.append(groupEl);
    });
    fragment.append(outer);
  });
  byId('reader').append(fragment);
}
function identifyLocation(entry) {
  if (!entry || current === entry) return;
  current = entry;
  const sectionName = sectionLabels[entry.section.id] || entry.section.label;
  byId('where').textContent = entry.section.kind === 'pages' ? entry.item.page + ' · ' + entry.group.label : sectionName + ' · ' + entry.item.title;
}
let scrollQueued = false;
function track() {
  scrollQueued = false;
  if (!indexed.length || document.querySelector('dialog[open]')) return;
  const line = document.querySelector('.bar').getBoundingClientRect().bottom + 36;
  let lo = 0, hi = indexed.length;
  while (lo < hi) {
    const mid = (lo + hi) >>> 1;
    if (indexed[mid].article.getBoundingClientRect().top <= line) lo = mid + 1;
    else hi = mid;
  }
  const atEnd = Math.ceil(window.scrollY + window.innerHeight) >= document.documentElement.scrollHeight - 2;
  identifyLocation(indexed[atEnd ? indexed.length - 1 : Math.max(0, lo - 1)]);
}
function scheduleTrack() {
  if (!scrollQueued) { scrollQueued = true; requestAnimationFrame(track); }
}
function urlTarget() {
  try { return itemsById.get(decodeURIComponent(location.hash.slice(1))); } catch { return undefined; }
}
function goTo(entry, behavior='smooth', focus=true) {
  if (!entry) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (focus) entry.article.focus({preventScroll:true});
  entry.article.scrollIntoView({block:'start',behavior: reduce ? 'auto' : behavior});
  identifyLocation(entry);
}
function follow(id) {
  const entry = itemsById.get(id);
  if (!entry) return;
  if (contents.open) closeSheet(contents,false);
  if (urlTarget() !== entry) history.pushState(null,'','#' + encodeURIComponent(id));
  goTo(entry);
}
function openSheet(dialog, trigger) {
  opener = trigger;
  if (dialog === settings && current) settingsPosition = {entry:current, top:current.article.getBoundingClientRect().top};
  dialog.showModal();
  document.body.classList.add('modal-open');
  dialog.querySelector('[data-close]').focus({preventScroll:true});
}
function closeSheet(dialog, restore=true) {
  dialog.close();
  document.body.classList.remove('modal-open');
  if (dialog === settings && settingsPosition) {
    window.scrollBy(0, settingsPosition.entry.article.getBoundingClientRect().top - settingsPosition.top);
    settingsPosition = undefined;
  }
  if (restore && opener) opener.focus({preventScroll:true});
}
function drawToc() {
  const section = data.sections.find(s => s.id === activeTab) || data.sections[0];
  if (!section) return;
  const query = byId('toc-search').value.trim().toLowerCase();
  const list = byId('toc-list');
  list.replaceChildren();
  let matches = 0;
  section.groups.forEach((group, index) => {
    const visible = group.items.filter(item => {
      const key = [group.label,item.page,item.title].join(' ').toLowerCase();
      return !query || key.includes(query);
    });
    if (!visible.length) return;
    const details = make('details','toc-group');
    const sameGroup = current && current.section.id === section.id && current.group.id === group.id;
    details.open = Boolean(query || sameGroup || section.groups.length === 1 || index === 0 && current?.section.id !== section.id);
    details.append(make('summary','',group.label));
    visible.forEach(item => {
      const a = make('a','toc-link');
      a.href = '#' + encodeURIComponent(item.id);
      if (item.id === current?.item.id) a.setAttribute('aria-current','location');
      if (item.page) a.append(make('span','page',item.page));
      a.append(make('span','',item.title)); details.append(a); matches++;
    });
    list.append(details);
  });
  if (!matches) list.append(make('p','no-results','没有找到匹配的标题。'));
  list.scrollTop = 0;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed',String(b.dataset.section === section.id)));
}
function openContents(button) {
  activeTab = current?.section.id || data.sections[0]?.id;
  byId('toc-search').value = '';
  drawToc(); openSheet(contents,button);
  const selected = contents.querySelector('[aria-current="location"]');
  if (selected) {
    const list = byId('toc-list');
    const delta = selected.getBoundingClientRect().top - list.getBoundingClientRect().top;
    if (delta < 0 || delta + selected.offsetHeight > list.clientHeight) list.scrollTop += delta - 30;
  }
}
buildControls();
drawReader();
// Existing bookmarks lead to the combined greeting and the revised presentation cues.
itemsById.set('self-intro',itemsById.get('hello'));
itemsById.set('share-screen',itemsById.get('present-portfolio'));
itemsById.set('share-page',itemsById.get('host-asks'));
identifyLocation(indexed[0]);
data.sections.forEach(section => {
  const tab = make('button','tab',sectionLabels[section.id] || section.label);
  tab.type = 'button'; tab.dataset.section = section.id;
  tab.addEventListener('click', () => { activeTab = section.id; byId('toc-search').value = ''; drawToc(); });
  byId('toc-tabs').append(tab);
});
for (const id of ['location','toc-button']) byId(id).addEventListener('click',e => openContents(e.currentTarget));
byId('settings-button').addEventListener('click',e => openSheet(settings,e.currentTarget));
byId('toc-search').addEventListener('input',drawToc);
for (const [id,key] of [['zh-button','zh'],['ruby-button','ruby']]) {
  byId(id).addEventListener('click', () => {
    const entry = current;
    const before = entry?.article.getBoundingClientRect().top;
    prefs[key] = !prefs[key]; applyPrefs(); persist();
    if (entry) window.scrollBy(0,entry.article.getBoundingClientRect().top-before);
    scheduleTrack();
  });
}
byId('reset').addEventListener('click', () => {
  settingsFields.forEach(f => {prefs[f.key] = f.value;});
  applyPrefs(); persist();
});
for (const dialog of [contents,settings]) {
  dialog.querySelector('[data-close]').addEventListener('click',() => closeSheet(dialog));
  dialog.addEventListener('cancel', e => {e.preventDefault(); closeSheet(dialog);});
  dialog.addEventListener('click', e => {
    if (e.target !== dialog) return;
    const r = dialog.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeSheet(dialog);
  });
}
document.addEventListener('click',e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const id = decodeURIComponent(a.hash.slice(1));
  if (itemsById.has(id)) { e.preventDefault(); follow(id); }
});
window.addEventListener('scroll',scheduleTrack,{passive:true});
window.addEventListener('resize',scheduleTrack);
window.addEventListener('hashchange',() => {
  const entry = urlTarget();
  if (entry) goTo(entry,'auto');
  else if (!location.hash) window.scrollTo({top:0,behavior:'auto'});
});
requestAnimationFrame(() => {const entry=urlTarget(); if(entry) goTo(entry,'auto',false); else scheduleTrack();});
</script>
