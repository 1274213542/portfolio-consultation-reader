\u003crt>き\u003c/rt>\u003c/ruby>り、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>のページを\u003cruby>綴\u003crt>と\u003c/rt>\u003c/ruby>じています。","zh":"所以我是从买五金件和螺丝开始的。先实测画图，再去工坊自己切板，最后装入纸质内页。"}]},{"id":"p71","title":"铰链为何换成金属","page":"P71","blocks":[{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>くための\u003cruby>蝶番\u003crt>ちょうつがい\u003c/rt>\u003c/ruby>です。\u003cruby>透明\u003crt>とうめい\u003c/rt>\u003c/ruby>なものなら\u003cruby>板\u003crt>いた\u003c/rt>\u003c/ruby>になじむんですけど、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>ねてみると\u003cruby>厚\u003crt>あつ\u003c/rt>\u003c/ruby>すぎたので、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>薄\u003crt>うす\u003c/rt>\u003c/ruby>い\u003cruby>金属\u003crt>きんぞく\u003c/rt>\u003c/ruby>のものにしました。","zh":"比如用来开合封面的铰链。透明款看起来和板材很搭，实际叠起来却太厚，所以最后用了右边这款较薄的金属铰链。"}]},{"id":"p72","title":"把实测结果放进草图","page":"P72","blocks":[{"type":"speech","ja":"\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>が、そのときに\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>いたスケッチです。\u003cruby>板\u003crt>いた\u003c/rt>\u003c/ruby>をどう\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>ねるかを\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>いてから、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>金具\u003crt>かなぐ\u003c/rt>\u003c/ruby>を\u003cruby>測\u003crt>はか\u003c/rt>\u003c/ruby>って、どこに\u003cruby>穴\u003crt>あな\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>ければ\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けられるかを\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めました。","zh":"左边是当时画的草图。我先画出板材的叠放关系，再测量五金件，确定孔开在哪里才能装上。"}]},{"id":"p73","title":"彩色小片如何做出来","page":"P73","blocks":[{"type":"speech","ja":"\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>くハートや\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>は、\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>の\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うアクリル\u003cruby>板\u003crt>ばん\u003c/rt>\u003c/ruby>から\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>は\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いますが、\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きさと\u003cruby>厚\u003crt>あつ\u003c/rt>\u003c/ruby>みはそろえています。","zh":"封面里会动的爱心和花，是从不同颜色的亚克力板上切出来的。形状不同，但尺寸和厚度做得一致。"}]},{"id":"p74","title":"拿在手里试才发现的缝隙","page":"P74","blocks":[{"type":"speech","ja":"で、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>傾\u003crt>かたむ\u003c/rt>\u003c/ruby>けてみたら、パーツがこぼれたんです。\u003cruby>四隅\u003crt>よすみ\u003c/rt>\u003c/ruby>だけを\u003cruby>留\u003crt>と\u003c/rt>\u003c/ruby>めた\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>だと、\u003cruby>辺\u003crt>へん\u003c/rt>\u003c/ruby>の\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>が\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>いてしまって。そこで\u003cruby>四辺\u003crt>しへん\u003c/rt>\u003c/ruby>の\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>にも\u003cruby>留\u003crt>と\u003c/rt>\u003c/ruby>め\u003cruby>具\u003crt>ぐ\u003c/rt>\u003c/ruby>を\u003cruby>足\u003crt>た\u003c/rt>\u003c/ruby>しました。","zh":"真正拿起来倾斜时，小片掉出来了。最初只固定四个角，板边的中段会张开一点，所以我在四条边的中央各加了一个固定点。"}]},{"id":"p75","title":"打开后怎么找到作品","page":"P75","blocks":[{"type":"speech","ja":"\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>くと、\u003cruby>目次\u003crt>もくじ\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>た\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>が、そのまま\u003cruby>仕切\u003crt>しき\u003c/rt>\u003c/ruby>りと\u003cruby>章\u003crt>しょう\u003c/rt>\u003c/ruby>の\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>のページにつながります。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、UI/UXの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たいときは、ピンクの\u003cruby>仕切\u003crt>しき\u003c/rt>\u003c/ruby>りを\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>けば、その\u003cruby>章\u003crt>しょう\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れます。","zh":"打开以后，目录里的颜色和分隔页、章首页是一致的。比如想看 UI/UX 作品，翻到粉色分隔页就能进入那一章。"}]},{"id":"p76","title":"成品侧面","page":"P76","blocks":[{"type":"speech","ja":"\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>が\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いたところです。\u003cruby>閉\u003crt>と\u003c/rt>\u003c/ruby>じると\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>の\u003cruby>模様\u003crt>もよう\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えますが、\u003cruby>横\u003crt>よこ\u003c/rt>\u003c/ruby>からは\u003cruby>透明\u003crt>とうめい\u003c/rt>\u003c/ruby>な\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>と、その\u003cruby>奥\u003crt>おく\u003c/rt>\u003c/ruby>の\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>の\u003cruby>仕切\u003crt>しき\u003c/rt>\u003c/ruby>りが\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>なって\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えます。","zh":"右边是书稍微打开的样子。合上时看到的是一幅图案，从侧面看，透明封面和里面的纸质分隔页就一层层显出来了。"}]}]},{"id":"intro-seasons","label":"四季の花綴り｜P77–88","items":[{"id":"p77","title":"《四季の花綴り》封面｜本科毕业作品","page":"P77","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>の\u003cruby>卒業制作\u003crt>そつぎょうせいさく\u003c/rt>\u003c/ruby>『\u003cruby>四季\u003crt>しき\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>\u003cruby>綴\u003crt>つづ\u003c/rt>\u003c/ruby>り』です。\u003cruby>子\u003crt>こ\u003c/rt>\u003c/ruby>どもの\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>から\u003cruby>親\u003crt>した\u003c/rt>\u003c/ruby>しんできた\u003cruby>二十四節気\u003crt>にじゅうしせっき\u003c/rt>\u003c/ruby>を、\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>と\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>でたどる\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>にして、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>製本\u003crt>せいほん\u003c/rt>\u003c/ruby>しました。","zh":"接下来是我的本科毕业作品《四季の花綴り》。我用押花和汉诗讲从小就熟悉的二十四节气，做成四册手工装订的书。"}]},{"id":"p78","title":"立春的诗为什么配这一朵花","page":"P78","blocks":[{"type":"speech","ja":"\u003cruby>自然\u003crt>しぜん\u003c/rt>\u003c/ruby>と\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わりを\u003cruby>扱\u003crt>あつか\u003c/rt>\u003c/ruby>った\u003cruby>文献\u003crt>ぶんけん\u003c/rt>\u003c/ruby>や\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ながら、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に、\u003cruby>記憶\u003crt>きおく\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っている\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>の\u003cruby>景色\u003crt>けしき\u003c/rt>\u003c/ruby>を\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>い\u003cruby>浮\u003crt>う\u003c/rt>\u003c/ruby>かべてもらえたら、と\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば\u003cruby>立春\u003crt>りっしゅん\u003c/rt>\u003c/ruby>には、\u003cruby>迎春花\u003crt>げいしゅんか\u003c/rt>\u003c/ruby>を\u003cruby>詠\u003crt>よ\u003c/rt>\u003c/ruby>んだ\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、その\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てくる\u003cruby>黄色\u003crt>きいろ\u003c/rt>\u003c/ruby>を、\u003cruby>本物\u003crt>ほんもの\u003c/rt>\u003c/ruby>の\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>と\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べられるようにしています。","zh":"我看了讨论人与自然关系的文献和作品，想让读者联想到自己记忆里的季节景象。比如立春，我选了一首写迎春花的诗，读者可以把诗里写到的黄色跟真正的押花放在一起看。"}]},{"id":"p79","title":"读者拿在手上怎么读","page":"P79","blocks":[{"type":"speech","ja":"\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>にすると、\u003cruby>布\u003crt>ぬの\u003c/rt>\u003c/ruby>や\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>の\u003cruby>手触\u003crt>てざわ\u003c/rt>\u003c/ruby>りがあって、\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>めくると\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てきます。\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>の\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>が\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったら、そこから\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>の\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>に\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>を\u003cruby>移\u003crt>うつ\u003c/rt>\u003c/ruby>せる、そんな\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"书拿在手上，能感觉到布和纸的质感，每翻一页又会出现下一种花。如果先被花的颜色吸引，也可以顺势读旁边的诗。"}]},{"id":"p80","title":"原诗、日语和花怎么摆","page":"P80","blocks":[{"type":"speech","ja":"そこで、\u003cruby>古\u003crt>ふる\u003c/rt>\u003c/ruby>い\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>の\u003cruby>枠\u003crt>わく\u003c/rt>\u003c/ruby>や\u003cruby>縦\u003crt>たて\u003c/rt>\u003c/ruby>の\u003cruby>線\u003crt>せん\u003c/rt>\u003c/ruby>を\u003cruby>参考\u003crt>さんこう\u003c/rt>\u003c/ruby>にして、\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>に\u003cruby>共通\u003crt>きょうつう\u003c/rt>\u003c/ruby>する\u003cruby>紙面\u003crt>しめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>の\u003cruby>原文\u003crt>げんぶん\u003c/rt>\u003c/ruby>と、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>の\u003cruby>語順\u003crt>ごじゅん\u003c/rt>\u003c/ruby>で\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>める\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>き\u003cruby>下\u003crt>くだ\u003c/rt>\u003c/ruby>し\u003cruby>文\u003crt>ぶん\u003c/rt>\u003c/ruby>、それから\u003cruby>訳文\u003crt>やくぶん\u003c/rt>\u003c/ruby>を\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて、その\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>に\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>を\u003cruby>収\u003crt>おさ\u003c/rt>\u003c/ruby>める\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>っています。","zh":"版式参考了古籍的外框和竖线，四册都用同一套规则。原诗、按日语语序写的训读文以及日译分区排版，旁边留出放押花的位置。"}]},{"id":"p81","title":"二十四组是怎么分册的","page":"P81","blocks":[{"type":"speech","ja":"こうして\u003cruby>揃\u003crt>そろ\u003c/rt>\u003c/ruby>えた\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>と\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>が、\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>で\u003cruby>二十四\u003crt>にじゅうよん\u003c/rt>\u003c/ruby>\u003cruby>組\u003crt>くみ\u003c/rt>\u003c/ruby>です。\u003cruby>横\u003crt>よこ\u003c/rt>\u003c/ruby>\u003cruby>一列\u003crt>いちれつ\u003c/rt>\u003c/ruby>が\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つの\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>で、\u003cruby>春\u003crt>はる\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>なら、\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>の\u003cruby>立春\u003crt>りっしゅん\u003c/rt>\u003c/ruby>から\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>穀雨\u003crt>こくう\u003c/rt>\u003c/ruby>まで、\u003cruby>六\u003crt>むっ\u003c/rt>\u003c/ruby>つの\u003cruby>節気\u003crt>せっき\u003c/rt>\u003c/ruby>を\u003cruby>順\u003crt>じゅん\u003c/rt>\u003c/ruby>にめくれます。","zh":"这样配成了二十四组花和诗。横着一行就是一个季节。春册从左侧的立春排到右侧的谷雨，翻完正好经过六个节气。"}]},{"id":"p82","title":"真花怎样经得起翻阅","page":"P82","blocks":[{"type":"speech","ja":"\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>は、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めたものです。\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>の\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>きを\u003cruby>整\u003crt>ととの\u003c/rt>\u003c/ruby>えて、\u003cruby>吸水\u003crt>きゅうすい\u003c/rt>\u003c/ruby>\u003cruby>紙\u003crt>し\u003c/rt>\u003c/ruby>に\u003cruby>挟\u003crt>はさ\u003c/rt>\u003c/ruby>んで\u003cruby>乾\u003crt>かわ\u003c/rt>\u003c/ruby>かしてから、\u003cruby>薄\u003crt>うす\u003c/rt>\u003c/ruby>い\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>びらをめくるときに\u003cruby>傷\u003crt>いた\u003c/rt>\u003c/ruby>めないよう、フィルムで\u003cruby>保護\u003crt>ほご\u003c/rt>\u003c/ruby>しました。","zh":"里面是真正由我采集的花。我先调整花的朝向，夹在吸水纸中压干，再用薄膜保护，让脆弱的花瓣在翻阅时不容易受损。"}]},{"id":"p83","title":"内页纸色与外封的开窗","page":"P83","blocks":[{"type":"speech","ja":"\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>\u003cruby>見本\u003crt>みほん\u003c/rt>\u003c/ruby>を\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べてみて、\u003cruby>本文\u003crt>ほんぶん\u003c/rt>\u003c/ruby>の\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>は\u003cruby>春\u003crt>はる\u003c/rt>\u003c/ruby>から\u003cruby>冬\u003crt>ふゆ\u003c/rt>\u003c/ruby>に\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けて\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しずつ\u003cruby>黄\u003crt>き\u003c/rt>\u003c/ruby>みを\u003cruby>深\u003crt>ふか\u003c/rt>\u003c/ruby>くしました。カバーは\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>模様\u003crt>もよう\u003c/rt>\u003c/ruby>を\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>いて、インクを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>わずに\u003cruby>模様\u003crt>もよう\u003c/rt>\u003c/ruby>を\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>す\u003cruby>加工\u003crt>かこう\u003c/rt>\u003c/ruby>と、\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>の\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>に\u003cruby>抜\u003crt>ぬ\u003c/rt>\u003c/ruby>く\u003cruby>加工\u003crt>かこう\u003c/rt>\u003c/ruby>を\u003cruby>印刷\u003crt>いんさつ\u003c/rt>\u003c/ruby>\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>にお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いしています。","zh":"我把纸样摆在一起比较，让内页从春到冬逐渐加深黄色。外封纹样由我设计，没有上墨的压纹和花形镂空交给印刷公司加工。"}]},{"id":"p84","title":"镂空处露出的是刺绣","page":"P84","blocks":[{"type":"speech","ja":"で、その\u003cruby>窓\u003crt>まど\u003c/rt>\u003c/ruby>から\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えているのが、この\u003cruby>刺繍\u003crt>ししゅう\u003c/rt>\u003c/ruby>です。\u003cruby>春\u003crt>はる\u003c/rt>\u003c/ruby>の\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>なら、\u003cruby>窓\u003crt>まど\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>に\u003cruby>鳥\u003crt>とり\u003c/rt>\u003c/ruby>と\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>がちょうど\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>るように\u003cruby>下絵\u003crt>したえ\u003c/rt>\u003c/ruby>を\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>いて、\u003cruby>布\u003crt>ぬの\u003c/rt>\u003c/ruby>に\u003cruby>写\u003crt>うつ\u003c/rt>\u003c/ruby>してから、\u003cruby>糸\u003crt>いと\u003c/rt>\u003c/ruby>の\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>と\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>きを\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えながら\u003cruby>縫\u003crt>ぬ\u003c/rt>\u003c/ruby>いました。","zh":"从刚才那个开窗里露出来的是刺绣。以春册为例，我先在草图里确定鸟和花正好出现在窗口内的位置，再转印到布面，用不同颜色和方向的线来绣。"}]},{"id":"p85","title":"押花怎么装进书页","page":"P85","blocks":[{"type":"speech","ja":"\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>にするときは、フィルムで\u003cruby>保護\u003crt>ほご\u003c/rt>\u003c/ruby>した\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>を\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つ\u003cruby>折\u003crt>お\u003c/rt>\u003c/ruby>りの\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>で\u003cruby>挟\u003crt>はさ\u003c/rt>\u003c/ruby>んで、\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>ずつ\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>綴\u003crt>と\u003c/rt>\u003c/ruby>じました。\u003cruby>背\u003crt>せ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、\u003cruby>上下\u003crt>じょうげ\u003c/rt>\u003c/ruby>には\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>と\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>布\u003crt>ぬの\u003c/rt>\u003c/ruby>があって、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>には\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>の\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>なりと\u003cruby>綴\u003crt>と\u003c/rt>\u003c/ruby>じ\u003cruby>糸\u003crt>いと\u003c/rt>\u003c/ruby>がそのまま\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えます。","zh":"装书时，我把用薄膜保护好的押花夹进对折的书页，再逐册手工缝订。看书脊，上下两端用了和封面一样的布，中间露出层叠的书页和装订线。"}]},{"id":"p86","title":"花期决定制作日程","page":"P86","blocks":[{"type":"speech","ja":"\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>は\u003cruby>咲\u003crt>さ\u003c/rt>\u003c/ruby>く\u003cruby>時期\u003crt>じき\u003c/rt>\u003c/ruby>がそれぞれ\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うので、\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めるのに\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>年\u003crt>ねん\u003c/rt>\u003c/ruby>ほどかかりました。\u003cruby>印刷物\u003crt>いんさつぶつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いてからは\u003cruby>一\u003crt>いっ\u003c/rt>\u003c/ruby>か\u003cruby>月\u003crt>げつ\u003c/rt>\u003c/ruby>ほどで\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>を\u003cruby>仕上\u003crt>しあ\u003c/rt>\u003c/ruby>げて、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>のスケッチで、\u003cruby>展示\u003crt>てんじ\u003c/rt>\u003c/ruby>する\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>と\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きな\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>の\u003cruby>高\u003crt>たか\u003c/rt>\u003c/ruby>さも\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"每种花的花期不同，采集用了大约一年。印好的材料收到后，我又花了约一个月把四册手工完成，右边的草图则是我推敲书和大型花朵在展场里高度时画的。"}]},{"id":"p87","title":"四册书与花在展场里怎么摆放","page":"P87","blocks":[{"type":"speech","ja":"こちらが\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>展示\u003crt>てんじ\u003c/rt>\u003c/ruby>です。\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>を\u003cruby>高\u003crt>たか\u003c/rt>\u003c/ruby>さの\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>う\u003cruby>台\u003crt>だい\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いて、そのまわりに\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きな\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>を\u003cruby>飾\u003crt>かざ\u003c/rt>\u003c/ruby>りました。","zh":"这是实际的展场。我把四册书放在高低不同的展台上，在周围摆上了大型花朵。"}]},{"id":"p88","title":"回到手里的这一册","page":"P88","blocks":[{"type":"speech","ja":"\u003cruby>右下\u003crt>みぎした\u003c/rt>\u003c/ruby>が、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>に\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>って\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いたときの\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きさです。\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>と\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>が、ちょうど\u003cruby>手元\u003crt>てもと\u003c/rt>\u003c/ruby>で\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られます。","zh":"右下角是这本书拿在手里翻开时的大小。花和诗正好可以一起收进手边的视野里。"}]}]},{"id":"intro-ling","label":"LING 团队杂志｜P89–91","items":[{"id":"p89","title":"《LING》封面｜团队制作的杂志","page":"P89","blocks":[{"type":"speech","ja":"こちらは、\u003cruby>大学\u003crt>だいがく\u003c/rt>\u003c/ruby>の\u003cruby>授業\u003crt>じゅぎょう\u003c/rt>\u003c/ruby>でチームで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>った、\u003cruby>三宅一生\u003crt>みやけいっせい\u003c/rt>\u003c/ruby>さんを\u003cruby>特集\u003crt>とくしゅう\u003c/rt>\u003c/ruby>した\u003cruby>雑誌\u003crt>ざっし\u003c/rt>\u003c/ruby>『LING』です。\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>にはInDesign、Illustrator、Photoshopを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いました。","zh":"这是大学课程中合作完成的杂志《LING》，这一期介绍三宅一生。制作时用了 InDesign、Illustrator 和 Photoshop。"}]},{"id":"p90","title":"团队和我的分工","page":"P90","blocks":[{"type":"speech","ja":"\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めると、\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>が\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>なったり、\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>み\u003cruby>具合\u003crt>ぐあい\u003c/rt>\u003c/ruby>に\u003cruby>差\u003crt>さ\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>たりしたので、\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>なことに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>分担\u003crt>ぶんたん\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>そうと\u003cruby>提案\u003crt>ていあん\u003c/rt>\u003c/ruby>しました。\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>は\u003cruby>全員\u003crt>ぜんいん\u003c/rt>\u003c/ruby>で\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めて、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>全\u003crt>ぜん\u003c/rt>\u003c/ruby>ページのレイアウトと、\u003cruby>校正\u003crt>こうせい\u003c/rt>\u003c/ruby>\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>の\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>の\u003cruby>入稿\u003crt>にゅうこう\u003c/rt>\u003c/ruby>を\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>しました。","zh":"刚开始，有些工作被重复做，各部分的进度也不一样，我就提议按各自擅长的事重新分工。企划是大家一起定的，我负责整本排版、校对后的修改和最后交付印刷文件。"}]},{"id":"p91","title":"同一本杂志，人物和产品为什么排得不一样","page":"P91","blocks":[{"type":"speech","ja":"\u003cruby>特集\u003crt>とくしゅう\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ると、まず\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きな\u003cruby>横顔\u003crt>よこがお\u003c/rt>\u003c/ruby>と\u003cruby>名前\u003crt>なまえ\u003c/rt>\u003c/ruby>が\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えて、\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>めくると\u003cruby>年表\u003crt>ねんぴょう\u003c/rt>\u003c/ruby>で\u003cruby>三宅\u003crt>みやけ\u003c/rt>\u003c/ruby>さんの\u003cruby>歩\u003crt>あゆ\u003c/rt>\u003c/ruby>みをたどれます。\u003cruby>時計\u003crt>とけい\u003c/rt>\u003c/ruby>や\u003cruby>眼鏡\u003crt>めがね\u003c/rt>\u003c/ruby>のページでは、\u003cruby>今度\u003crt>こんど\u003c/rt>\u003c/ruby>は\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べてほしいので、\u003cruby>製品\u003crt>せいひん\u003c/rt>\u003c/ruby>の\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>を\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べるレイアウトに\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えました。","zh":"进入特辑，先看到大幅侧脸和名字，再翻一页，就是讲这个人经历的年表。到了手表和眼镜的页面，我希望读者能比较造型，就改成了并排展示产品照片的版式。"}]}]},{"id":"intro-type","label":"隷書美学｜P92–97","items":[{"id":"p92","title":"《隷書美学》封面｜隶书的历史和字形","page":"P92","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、\u003cruby>隷書\u003crt>れいしょ\u003c/rt>\u003c/ruby>の\u003cruby>歴史\u003crt>れきし\u003c/rt>\u003c/ruby>と\u003cruby>字\u003crt>じ\u003c/rt>\u003c/ruby>の\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>を\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>する\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>、『\u003cruby>隷書\u003crt>れいしょ\u003c/rt>\u003c/ruby>\u003cruby>美学\u003crt>びがく\u003c/rt>\u003c/ruby>』です。\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>には\u003cruby>竹\u003crt>たけ\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いました。","zh":"接下来是介绍隶书历史和字形的《隷書美学》，封面用的是竹子。"}]},{"id":"p93","title":"放大字形，看笔势与排版","page":"P93","blocks":[{"type":"speech","ja":"\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>では\u003cruby>隷書\u003crt>れいしょ\u003c/rt>\u003c/ruby>の\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>を\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きく\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せて、\u003cruby>払\u003crt>はら\u003c/rt>\u003c/ruby>いの\u003cruby>長\u003crt>なが\u003c/rt>\u003c/ruby>さや\u003cruby>筆\u003crt>ふで\u003c/rt>\u003c/ruby>の\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>り\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>印\u003crt>しるし\u003c/rt>\u003c/ruby>を\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けました。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>では\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>を\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>書体\u003crt>しょたい\u003c/rt>\u003c/ruby>で\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>んで、\u003cruby>縦組\u003crt>たてぐ\u003c/rt>\u003c/ruby>みと\u003cruby>横組\u003crt>よこぐ\u003c/rt>\u003c/ruby>みも\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べています。","zh":"左边放大了几个隶书字，用标记指出长捺与起笔的位置。右边用两种字体排同一首诗，也对比了竖排和横排。"}]},{"id":"p94","title":"从古籍里借来的排版规则","page":"P94","blocks":[{"type":"speech","ja":"こういう\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>と\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>をどう\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べるかは、\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>の\u003cruby>古\u003crt>ふる\u003c/rt>\u003c/ruby>い\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>を\u003cruby>参考\u003crt>さんこう\u003c/rt>\u003c/ruby>にしました。\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>も\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>も\u003cruby>縦\u003crt>たて\u003c/rt>\u003c/ruby>の\u003cruby>線\u003crt>せん\u003c/rt>\u003c/ruby>にそろえて、\u003cruby>書名\u003crt>しょめい\u003c/rt>\u003c/ruby>と\u003cruby>章\u003crt>しょう\u003c/rt>\u003c/ruby>の\u003cruby>名前\u003crt>なまえ\u003c/rt>\u003c/ruby>は\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>帯\u003crt>おび\u003c/rt>\u003c/ruby>にまとめると、\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>のページでも\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たよ\u003c/rt>\u003c/ruby>りに\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>めます。","zh":"为了安排图和字，我参考了左边的古籍。图文沿着竖线对齐，书名和章节名归在中央的竖条上，这样翻到下一页也能从熟悉的位置继续读。"}]},{"id":"p95","title":"一段长碑文需要换一种翻法","page":"P95","blocks":[{"type":"speech","ja":"\u003cruby>本文\u003crt>ほんぶん\u003c/rt>\u003c/ruby>は\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>ずつめくりますが、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の『\u003cruby>曹全碑\u003crt>そうぜんぴ\u003c/rt>\u003c/ruby>』は、\u003cruby>長\u003crt>なが\u003c/rt>\u003c/ruby>い\u003cruby>碑文\u003crt>ひぶん\u003c/rt>\u003c/ruby>の\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>びをまとめて\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せたかったんです。そこで、ここだけは\u003cruby>折\u003crt>お\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>みにして、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>広\u003crt>ひろ\u003c/rt>\u003c/ruby>げて\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>を\u003cruby>見渡\u003crt>みわた\u003c/rt>\u003c/ruby>せるようにしました。","zh":"正文是一页页翻的，而右边的《曹全碑》，我希望读者能看到长篇碑文的整体排列，所以单独设计成可以用手展开的折页。"}]},{"id":"p96","title":"竹封面怎么装订和收纳","page":"P96","blocks":[{"type":"speech","ja":"\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>に\u003cruby>竹\u003crt>たけ\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだのは、\u003cruby>昔\u003crt>むかし\u003c/rt>\u003c/ruby>、\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>を\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていた\u003cruby>竹簡\u003crt>ちくかん\u003c/rt>\u003c/ruby>がきっかけです。\u003cruby>書名\u003crt>しょめい\u003c/rt>\u003c/ruby>はレーザーで\u003cruby>刻\u003crt>きざ\u003c/rt>\u003c/ruby>んで、\u003cruby>穴\u003crt>あな\u003c/rt>\u003c/ruby>に\u003cruby>糸\u003crt>いと\u003c/rt>\u003c/ruby>を\u003cruby>通\u003crt>とお\u003c/rt>\u003c/ruby>して\u003cruby>本文\u003crt>ほんぶん\u003c/rt>\u003c/ruby>と\u003cruby>綴\u003crt>と\u003c/rt>\u003c/ruby>じました。しまうときに\u003cruby>竹\u003crt>たけ\u003c/rt>\u003c/ruby>を\u003cruby>保護\u003crt>ほご\u003c/rt>\u003c/ruby>できるよう、\u003cruby>布\u003crt>ぬの\u003c/rt>\u003c/ruby>のケースも\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っています。","zh":"竹封面的灵感来自古人用来书写的竹简。我用激光刻上书名，穿线把它和内页订在一起，也做了布质书套，在收纳时保护竹面。"}]},{"id":"p97","title":"打开和卷起的实物形态","page":"P97","blocks":[{"type":"speech","ja":"\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>した\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>です。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>のように、\u003cruby>細\u003crt>ほそ\u003c/rt>\u003c/ruby>い\u003cruby>竹\u003crt>たけ\u003c/rt>\u003c/ruby>をつないだ\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>は、くるっと\u003cruby>巻\u003crt>ま\u003c/rt>\u003c/ruby>くこともできます。","zh":"这是成品。像右边照片里这样，由细竹片连接的封面也可以卷起来。"}]}]},{"id":"intro-tokyo","label":"TOKYO SUNSET TILL DAWN 东京摄影集｜P98–100","items":[{"id":"p98","title":"东京摄影集封面｜从傍晚到清晨","page":"P98","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、\u003cruby>東京\u003crt>とうきょう\u003c/rt>\u003c/ruby>で\u003cruby>夕方\u003crt>ゆうがた\u003c/rt>\u003c/ruby>から\u003cruby>明\u003crt>あ\u003c/rt>\u003c/ruby>け\u003cruby>方\u003crt>がた\u003c/rt>\u003c/ruby>にかけて\u003cruby>撮\u003crt>と\u003c/rt>\u003c/ruby>った\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>をまとめた\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>です。\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったのはカメラと、InDesign、Illustratorです。","zh":"接下来是一本摄影集，收录了我在东京拍的从傍晚到清晨的照片。用到的是相机、InDesign 和 Illustrator。"}]},{"id":"p99","title":"封面上真的会变的光","page":"P99","blocks":[{"type":"speech","ja":"\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>の\u003cruby>丸\u003crt>まる\u003c/rt>\u003c/ruby>い\u003cruby>部分\u003crt>ぶぶん\u003c/rt>\u003c/ruby>、\u003cruby>黒\u003crt>くろ\u003c/rt>\u003c/ruby>い\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>を\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>抜\u003crt>ぬ\u003c/rt>\u003c/ruby>いて、\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>に\u003cruby>光\u003crt>ひかり\u003c/rt>\u003c/ruby>を\u003cruby>反射\u003crt>はんしゃ\u003c/rt>\u003c/ruby>する\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>を\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>ねているんです。\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>を\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>傾\u003crt>かたむ\u003c/rt>\u003c/ruby>けると、\u003cruby>街\u003crt>まち\u003c/rt>\u003c/ruby>の\u003cruby>明\u003crt>あ\u003c/rt>\u003c/ruby>かりのように、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>丸\u003crt>まる\u003c/rt>\u003c/ruby>でも\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>う\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えます。","zh":"封面的圆点，是在黑纸上挖空，让下面的反光纸透出来。稍微倾斜书本，同一个圆点就能看到不同颜色，像变化的城市灯光。"}]},{"id":"p100","title":"四段时间把照片串成一晚","page":"P100","blocks":[{"type":"speech","ja":"\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>は\u003cruby>夕方\u003crt>ゆうがた\u003c/rt>\u003c/ruby>\u003cruby>六\u003crt>ろく\u003c/rt>\u003c/ruby>\u003cruby>時\u003crt>じ\u003c/rt>\u003c/ruby>から\u003cruby>翌朝\u003crt>よくあさ\u003c/rt>\u003c/ruby>\u003cruby>六\u003crt>ろく\u003c/rt>\u003c/ruby>\u003cruby>時\u003crt>じ\u003c/rt>\u003c/ruby>まで、\u003cruby>三\u003crt>さん\u003c/rt>\u003c/ruby>\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>ずつ\u003cruby>四\u003crt>よっ\u003c/rt>\u003c/ruby>つの\u003cruby>章\u003crt>しょう\u003c/rt>\u003c/ruby>に\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けました。\u003cruby>夕方\u003crt>ゆうがた\u003c/rt>\u003c/ruby>の\u003cruby>空\u003crt>そら\u003c/rt>\u003c/ruby>にまだ\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>が\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っているところから、\u003cruby>暗\u003crt>くら\u003c/rt>\u003c/ruby>い\u003cruby>街\u003crt>まち\u003c/rt>\u003c/ruby>に\u003cruby>灯\u003crt>あか\u003c/rt>\u003c/ruby>りが\u003cruby>浮\u003crt>う\u003c/rt>\u003c/ruby>かんで、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は\u003cruby>建物\u003crt>たてもの\u003c/rt>\u003c/ruby>に\u003cruby>朝\u003crt>あさ\u003c/rt>\u003c/ruby>の\u003cruby>光\u003crt>ひかり\u003c/rt>\u003c/ruby>が\u003cruby>当\u003crt>あ\u003c/rt>\u003c/ruby>たる。\u003cruby>撮\u003crt>と\u003c/rt>\u003c/ruby>った\u003cruby>時刻\u003crt>じこく\u003c/rt>\u003c/ruby>を\u003cruby>添\u003crt>そ\u003c/rt>\u003c/ruby>えて、その\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>で\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べています。","zh":"内页从傍晚六点到次日早上六点，每三小时一章，共四章。先是天边还留着颜色，接着灯光从黑暗的街上浮现，最后晨光落到建筑上。我把拍摄时间也标出来，按这个次序编排。"}]}]},{"id":"intro-3d","label":"空中小町｜P101–103","items":[{"id":"p101","title":"《空中小町》封面｜浮岛连接起来的 3D 小镇","page":"P101","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は『\u003cruby>空中\u003crt>くうちゅう\u003c/rt>\u003c/ruby>\u003cruby>小町\u003crt>こまち\u003c/rt>\u003c/ruby>』という、\u003cruby>空\u003crt>そら\u003c/rt>\u003c/ruby>に\u003cruby>浮\u003crt>う\u003c/rt>\u003c/ruby>かぶ\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>を\u003cruby>橋\u003crt>はし\u003c/rt>\u003c/ruby>でつないだ3Dの\u003cruby>街\u003crt>まち\u003c/rt>\u003c/ruby>です。Cinema 4DとAfter Effectsを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いました。","zh":"最后是《空中小町》，一座用桥把浮岛连起来的 3D 小镇。制作时用了 Cinema 4D 和 After Effects。"}]},{"id":"p102","title":"从静止的模型到会动的场景","page":"P102","blocks":[{"type":"speech","ja":"まず、\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>と\u003cruby>橋\u003crt>はし\u003c/rt>\u003c/ruby>のつながりがよく\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>える\u003cruby>位置\u003crt>いち\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>して、\u003cruby>光\u003crt>ひかり\u003c/rt>\u003c/ruby>とカメラを\u003cruby>調整\u003crt>ちょうせい\u003c/rt>\u003c/ruby>しました。そこから\u003cruby>雲\u003crt>くも\u003c/rt>\u003c/ruby>やカメラにも\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きを\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けて、\u003cruby>映像\u003crt>えいぞう\u003c/rt>\u003c/ruby>にしています。","zh":"我先找能看清岛和桥之间关系的角度，调整灯光和相机，再给云和相机加上运动，做成影像。"}]},{"id":"p103","title":"靠近以后，每座岛各有什么","page":"P103","blocks":[{"type":"speech","ja":"\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>近\u003crt>ちか\u003c/rt>\u003c/ruby>くで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、\u003cruby>左上\u003crt>ひだりうえ\u003c/rt>\u003c/ruby>の\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>には\u003cruby>赤\u003crt>あか\u003c/rt>\u003c/ruby>い\u003cruby>観覧車\u003crt>かんらんしゃ\u003c/rt>\u003c/ruby>があって、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>には\u003cruby>風船\u003crt>ふうせん\u003c/rt>\u003c/ruby>が\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>まっています。\u003cruby>遠\u003crt>とお\u003c/rt>\u003c/ruby>くからは\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つの\u003cruby>街\u003crt>まち\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えて、\u003cruby>近\u003crt>ちか\u003c/rt>\u003c/ruby>づくと\u003cruby>看板\u003crt>かんばん\u003c/rt>\u003c/ruby>や\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>の\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つかるように\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"靠近看每一座岛，左上的岛有红色摩天轮，中间的岛聚集了许多气球。远看是一座小镇，近看还可以发现每座岛的招牌和小物件各不相同。"}]}]},{"id":"intro-end","label":"封底｜P104","items":[{"id":"p104","title":"把话交还给对方","page":"P104","blocks":[{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>からのご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>は\u003cruby>以上\u003crt>いじょう\u003c/rt>\u003c/ruby>です。ここまで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていただいて、ありがとうございます。","zh":"我的作品介绍到这里。谢谢您看完这些作品。"}]}]}]},{"id":"questions","label":"问答","kind":"questions","groups":[{"id":"general-qa","label":"整场通用问题","items":[{"id":"general-1","title":"今天主要想咨询什么？","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>は、どんなことを\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>したいですか。","zh":"今天主要想咨询什么？"},{"type":"speech","ja":"\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>の\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>で\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>っています。いくつか\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていただいたあとで、どの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>くと、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>の\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>え\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりやすいか、\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>えたらうれしいです。","zh":"我有点犹豫作品的顺序。您看过几件之后，我想听听哪一件放在最前面，更容易看出我的思考方式。"}]},{"id":"general-2","title":"你原来学平面，后来为什么也开始做 UI/UX？","page":"","blocks":[{"type":"prompt","ja":"グラフィックから、どうしてUI/UXもやるようになったんですか。","zh":"你原来学平面，后来为什么也开始做 UI/UX？"},{"type":"speech","ja":"グラフィックでは、どう\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せたら\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるかをよく\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていました。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>でアプリの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ってみると、「ここを\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>したら\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>るといいだろう」って、その\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>の\u003cruby>行動\u003crt>こうどう\u003c/rt>\u003c/ruby>まで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるのが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>かったです。","zh":"做平面时我常想怎么呈现才看得懂。自己试着做 App 界面以后，我还能接着想「点了这里，下一步应该看到什么」。能想到使用者接下来的行动，我觉得这个过程很有意思。"}]},{"id":"general-3","title":"你觉得哪件最能代表你？","page":"P9–11","blocks":[{"type":"prompt","ja":"どの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>が、\u003cruby>一番\u003crt>いちばん\u003c/rt>\u003c/ruby>\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>らしいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いますか。","zh":"你觉得哪件最能代表你？"},{"type":"speech","ja":"UI/UXの\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>では、ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>の\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えた\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>です。\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>す\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>と\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあとで、\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいことが\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わるので、その\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。そこに、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>え\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ていると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。","zh":"UI/UX 作品里，我会选网购服装退货这件。决定退之前和寄出之后，人想知道的事情会变化，我就根据这个变化安排界面顺序。我觉得这比较能体现我的做法。"}]},{"id":"general-4","title":"你是按什么流程做的？","page":"P8 → P11","blocks":[{"type":"prompt","ja":"どういう\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":"你是按什么流程做的？"},{"type":"speech","ja":"まず、いくつかの\u003cruby>通販\u003crt>つうはん\u003c/rt>\u003c/ruby>サイトの\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べました。そのうえで、スマホで\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>うことには\u003cruby>慣\u003crt>な\u003c/rt>\u003c/ruby>れていても、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>は\u003cruby>少\u003crt>すく\u003c/rt>\u003c/ruby>ない\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>しました。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えばシャツを\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>だけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すとき、\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>める\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>には\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>、\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあとには\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>み\u003cruby>具合\u003crt>ぐあい\u003c/rt>\u003c/ruby>を\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいと\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて、この\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>で\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"我先比较几家网店的退货说明，再想象一个经常用手机买衣服、却不熟悉退货的人。她退一件衬衫时，决定之前想知道金额，寄出之后想知道进度，我就按这个顺序做界面。"}]},{"id":"general-5","title":"接下来想做什么样的设计工作？","page":"","blocks":[{"type":"prompt","ja":"これから、どんな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をしてみたいですか。","zh":"接下来想做什么样的设计工作？"},{"type":"speech","ja":"Webやアプリで、\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>が\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>いときに、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すと\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>行動\u003crt>こうどう\u003c/rt>\u003c/ruby>を\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めやすいかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>える\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>に\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>があります。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>る\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、どこで\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>っているのかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるところから\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わりたいです。","zh":"我对 Web 和 App 的信息设计感兴趣。信息很多时，先展示什么，能让人比较容易决定下一步。我也想参与做画面之前的阶段，一起弄清楚使用者会在哪一步卡住。"}]},{"id":"general-6","title":"可以看看纸本作品吗？为什么选择做成书？","page":"P78–80","blocks":[{"type":"prompt","ja":"\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>も\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せてもらえますか。なぜ\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>にしたんですか。","zh":"可以看看纸本作品吗？为什么选择做成书？"},{"type":"speech","ja":"\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>と\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>を\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせた\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>です。\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>を\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>む\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>もいれば、\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>の\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>に\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>がいく\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>もいると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったんです。それで、\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>のすぐ\u003cruby>横\u003crt>よこ\u003c/rt>\u003c/ruby>に\u003cruby>本物\u003crt>ほんもの\u003c/rt>\u003c/ruby>の\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>きました。ページを\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>くと、\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>と\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べながら、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>が\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったほうから\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>めます。","zh":"这是把押花和汉诗结合在一起的书。我想，有人会先读诗，也有人先注意到花的颜色，所以把真实的押花放在诗旁边。一翻开就可以对照，从自己感兴趣的那一边看起。"}]}]},{"id":"real-questions","label":"有现场依据的问法","items":[{"id":"confident-work","title":"请介绍一件你有信心的作品。","page":"P7 → P17","blocks":[{"type":"prompt","ja":"\u003cruby>自信\u003crt>じしん\u003c/rt>\u003c/ruby>のある\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>してください。","zh":"请介绍一件你有信心的作品。"},{"type":"note","ja":"","zh":"先停在 MORI 封面，再翻到 P17。左边指衬衫和裤子，右边指退款金额和积分。"},{"type":"speech","ja":"はい。\u003cruby>一番\u003crt>いちばん\u003c/rt>\u003c/ruby>\u003cruby>自信\u003crt>じしん\u003c/rt>\u003c/ruby>があるのは、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>『MORI』です。ショッピングアプリで\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するとき、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>の\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるようにしました。","zh":"好的，我最有信心的是第一件作品 MORI。我设计了购物 App 里的服装退货流程，让买家在预约取件前就能看到预计退款。","page":"P7"},{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、このシャツとパンツは、クーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>って\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>っています。シャツだけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>したいとき、\u003cruby>値札\u003crt>ねふだ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ても、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るかは\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりませんよね。そこで、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、カードにはいくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>りそうか、ポイントはいくつ\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るかを、ここで\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようにしました。","zh":"比如这件衬衫和这条裤子是一起买的，结账时还用了优惠券和积分。只想退衬衫时，光看标价，很难知道能退回多少。所以我把预计退到卡里的金额和返还的积分分开列在这里，让买家在预约取件之前就能看到。","page":"P17"}]},{"id":"field-2","title":"希望别人看完记住你什么？","page":"P34","blocks":[{"type":"prompt","ja":"\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったとき、どんなデザイナーだと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ってもらいたいですか。","zh":"希望别人看完记住你什么？"},{"type":"speech","ja":"\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をしたいかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っている、ということが\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるとうれしいです。さっきの\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリでいうと、\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づいた\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>より、\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>き\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないスリッパのほうが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったんです。そこを\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せました。","zh":"我希望对方记得，我会去想使用者接下来想做什么，再决定怎么做界面。就拿刚才的扫地机器人来说，和整理了几件相比，人这时应该更关心拖鞋去了哪里。所以我先显示的是那双拖鞋。"}]},{"id":"field-3","title":"这本杂志里，哪些工作是你负责的？","page":"P89–90","blocks":[{"type":"prompt","ja":"この\u003cruby>雑誌\u003crt>ざっし\u003c/rt>\u003c/ruby>は、チームの\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>でどこを\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>したんですか。","zh":"这本杂志里，哪些工作是你负责的？"},{"type":"speech","ja":"\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>と\u003cruby>資料\u003crt>しりょう\u003c/rt>\u003c/ruby>\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めはチームで\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>全\u003crt>ぜん\u003c/rt>\u003c/ruby>ページのレイアウトを\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>して、\u003cruby>校正\u003crt>こうせい\u003c/rt>\u003c/ruby>のあとに\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>して、\u003cruby>入稿\u003crt>にゅうこう\u003c/rt>\u003c/ruby>データまで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>が\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>なっていたので、みんなの\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>なことに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>け\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>そうと\u003cruby>提案\u003crt>ていあん\u003c/rt>\u003c/ruby>したのも\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>です。","zh":"企划和资料收集是大家一起做的。我负责整本排版、校对后的修改，一直到交付印刷文件。中途有些工作分配重叠，我也提议按各自擅长的事重新分工。"}]},{"id":"field-4","title":"做这件作品时，有什么是查了资料才明白的？","page":"P30 → P34","blocks":[{"type":"prompt","ja":"この\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>、\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べてみて\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かったことはありましたか。","zh":"做这件作品时，有什么是查了资料才明白的？"},{"type":"speech","ja":"アーム\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>きの\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>の\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>ガイドを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んで、\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>の\u003cruby>重\u003crt>おも\u003c/rt>\u003c/ruby>さや、\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りにどれだけスペースがあるかで、\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べるかどうかが\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わると\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりました。だとすると、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>に「\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>が\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わりました」と\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ても、\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んだ\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>が\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたとは\u003cruby>限\u003crt>かぎ\u003c/rt>\u003c/ruby>りません。それで、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"我看带机械臂扫地机器人的操作指南才知道，重量和周围空间都会影响它能不能把物品搬过去。这样一来，就算界面说「任务结束」，也不能据此判断每件都到了。我于是设计了逐件查看结果的界面。"}]}]},{"id":"qa-mori","label":"MORI｜购物 App 内的服装退货流程","items":[{"id":"qa-mori-1","title":"你设想的使用者是什么样的人？","page":"P9","blocks":[{"type":"prompt","ja":"どんな\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>したんですか。","zh":"你设想的使用者是什么样的人？"},{"type":"speech","ja":"スマホでよく\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>うけれど、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>は\u003cruby>少\u003crt>すく\u003c/rt>\u003c/ruby>ない\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>です。\u003cruby>通販\u003crt>つうはん\u003c/rt>\u003c/ruby>サイトの\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べるうちに、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>の\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>には\u003cruby>慣\u003crt>な\u003c/rt>\u003c/ruby>れていても、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>になると\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をどこで\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめればいいのか\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>いそうだと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>い、この\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>にしました。","zh":"她经常用手机买衣服，但很少退货。我对比过网店的退货说明，设定这个用户是为了推演不熟悉流程的人会从哪里开始、需要看什么。"}]},{"id":"qa-mori-2","title":"为什么把流程排成这个顺序？","page":"P11 → P17","blocks":[{"type":"prompt","ja":"どうしてこの\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>にしたんですか。","zh":"为什么把流程排成这个顺序？"},{"type":"speech","ja":"その\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>で\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて、\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>を\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めました。まず、\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>したい\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>の\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すので、\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>の\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>に\u003cruby>入口\u003crt>いりぐち\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>きました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るかで\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すかどうかを\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>められるよう、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>の\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあとは、どこまで\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>んでいるかを\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>します。","zh":"我按用户当时需要做的决定排序。她先找订单，所以入口放订单详情。要先知道预计退多少，才能决定是否预约取件。寄出后，再确认走到了哪一步。"}]},{"id":"qa-mori-3","title":"为什么选了中间那个方案？","page":"P14","blocks":[{"type":"prompt","ja":"どうして\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだんですか。","zh":"为什么选了中间那个方案？"},{"type":"speech","ja":"\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>は「\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しています」がすぐ\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>めます。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>なら、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っていることが、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かることを\u003cruby>優先\u003crt>ゆうせん\u003c/rt>\u003c/ruby>して、\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かい\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>履歴\u003crt>りれき\u003c/rt>\u003c/ruby>や\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>の\u003cruby>内訳\u003crt>うちわけ\u003c/rt>\u003c/ruby>は\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>きました。","zh":"右案能马上读到店家正在确认。中间案还能让人知道包裹确实到了。我优先保留这两条状态，把详细物流和金额明细放到详情里。"}]},{"id":"qa-mori-4","title":"你实际试到了哪一步？","page":"P15 → P21","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>にどこまで\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>したんですか。","zh":"你实际试到了哪一步？"},{"type":"speech","ja":"\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>って、\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つの\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>をどう\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたところまでです。P15には、\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べ\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>示\u003crt>しめ\u003c/rt>\u003c/ruby>すために\u003cruby>各案\u003crt>かくあん\u003c/rt>\u003c/ruby>\u003cruby>50件\u003crt>ごじゅっけん\u003c/rt>\u003c/ruby>の\u003cruby>仮\u003crt>かり\u003c/rt>\u003c/ruby>の\u003cruby>回答\u003crt>かいとう\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>きました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いた\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらって、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>が\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>か、\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>ってよいかを\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>できるか\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたいです。","zh":"我完成了退货界面，并设计了三案的比较方式。P15 每案 50 条是用来演示比较方法的假设回答。下一步想让人看包裹到店后的界面，看看他能否解释自己该等、还是该联系店家。"}]},{"id":"qa-mori-5","title":"退款手续完成后，钱就已经退回来了吗？","page":"P22","blocks":[{"type":"prompt","ja":"\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きが\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったら、お\u003cruby>金\u003crt>かね\u003c/rt>\u003c/ruby>はもう\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>っているんですか。","zh":"退款手续完成后，钱就已经退回来了吗？"},{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>の\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きをしてから、カードの\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>るまでには\u003cruby>時間差\u003crt>じかんさ\u003c/rt>\u003c/ruby>があります。そこで\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きが\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わった\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>と、\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>る\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>を\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>しました。","zh":"店家处理退款和银行卡账单显示退款之间有时间差，所以我分开显示店家处理的日期和预计入账时间。"}]},{"id":"qa-mori-6","title":"你具体问过真实退货用户什么？","page":"P8 → P9","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>した\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>には、どんなことを\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>きましたか。","zh":"你具体问过真实退货用户什么？"},{"type":"speech","ja":"\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>は\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>き\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りはしていません。\u003cruby>通販\u003crt>つうはん\u003c/rt>\u003c/ruby>サイトの\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べて、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>一着\u003crt>いっちゃく\u003c/rt>\u003c/ruby>だけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>す\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>てました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>くなら、\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあとに\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になって、どこを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したかを、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>した\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいです。","zh":"这次没有做访谈。我比较了网店的退货说明，再设计只退一件衣服的情境。如果接下来访问实际退过货的人，我想问的是，寄出后最惦记什么，又去哪里确认。"}]}]},{"id":"qa-tuck","label":"TUCK T10｜机器人整理小物","items":[{"id":"qa-tuck-1","title":"谁会用它？在什么情况下用？","page":"P29–31","blocks":[{"type":"prompt","ja":"\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が、どんなときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うんですか。","zh":"谁会用它？在什么情况下用？"},{"type":"speech","ja":"\u003cruby>家\u003crt>いえ\u003c/rt>\u003c/ruby>でロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っていて、\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけたい\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びたい\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>しました。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えばリビングで、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>から\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけを\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>です。\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>は、\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだあとの\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>み\u003cruby>具合\u003crt>ぐあい\u003c/rt>\u003c/ruby>と、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないときの\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"我设想的是想让机器人帮忙整理指定物品的人。比如在客厅从地图上选中袜子和拖鞋。本次重点是选完后怎样看进度，以及没收到结果时怎么查。"}]},{"id":"qa-tuck-2","title":"你怎么设计确认结果的流程？","page":"P32、P39","blocks":[{"type":"prompt","ja":"どういう\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れで\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>するようにしたんですか。","zh":"你怎么设计确认结果的流程？"},{"type":"speech","ja":"\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>は\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめられるようにし、\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>き\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたら、どの\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>扱\u003crt>あつか\u003c/rt>\u003c/ruby>っているかを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>が\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったときには、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からない\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>だけ、\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すための\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりへ\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めます。ロボットに\u003cruby>任\u003crt>まか\u003c/rt>\u003c/ruby>せている\u003cruby>間\u003crt>あいだ\u003c/rt>\u003c/ruby>と、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>で、\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいことが\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うからです。","zh":"发出指令前先确认会搬去哪里，开始后看机器人正在处理哪件。结束后，只有结果未知的物品才需要进一步去找。因为委托期间和自己动手确认时，需要的信息不同。"}]},{"id":"qa-tuck-3","title":"既然有突出件数的方案，为什么选右边这一个？","page":"P34 → P39","blocks":[{"type":"prompt","ja":"\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>を\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きく\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>す\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>もあったのに、なぜ\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>ですか。","zh":"既然有突出件数的方案，为什么选右边这一个？"},{"type":"speech","ja":"\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>で\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>は\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりますが、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すのはスリッパなんですよね。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>では、そのスリッパを\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いて、\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だった\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>ボタンも\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>の\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>も、\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>の\u003cruby>一行\u003crt>いちぎょう\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめられます。","zh":"件数能概括整体，但下一步要找的是拖鞋。所以右案把拖鞋放前面，同卡显示预定位置和确认按钮。件数仍可以从上方一行读到。"}]},{"id":"qa-tuck-4","title":"你把哪些部分做成了能实际操作的东西？","page":"P42","blocks":[{"type":"prompt","ja":"どこまで\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>くものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":"你把哪些部分做成了能实际操作的东西？"},{"type":"speech","ja":"\u003cruby>一時停止\u003crt>いちじていし\u003c/rt>\u003c/ruby>の\u003cruby>部分\u003crt>ぶぶん\u003c/rt>\u003c/ruby>を、ブラウザーでクリックして\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>せる\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にしました。ボタンを\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>した\u003cruby>直後\u003crt>ちょくご\u003c/rt>\u003c/ruby>は\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>つ\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>にして、\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>したという\u003cruby>模擬\u003crt>もぎ\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たら、\u003cruby>再開\u003crt>さいかい\u003c/rt>\u003c/ruby>できるようにしました。\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>については、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に、この\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が、どの\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しようとするか、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にどこを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てみたいです。","zh":"我把暂停部分做成了浏览器可点的原型。按下后先显示等待停止，收到模拟的停止通知后才可继续。结果界面下一步想看初次使用的人会先确认哪件、先去哪里找。"}]},{"id":"qa-tuck-5","title":"没收到通知，就表示搬运失败了吗？","page":"P39","blocks":[{"type":"prompt","ja":"\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>こ\u003c/rt>\u003c/ruby>ないのは、\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶのに\u003cruby>失敗\u003crt>しっぱい\u003c/rt>\u003c/ruby>したということですか。","zh":"没收到通知，就表示搬运失败了吗？"},{"type":"speech","ja":"この\u003cruby>時点\u003crt>じてん\u003c/rt>\u003c/ruby>で\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるのは、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いていないことです。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>では、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけた\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だった\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>して、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめた\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>を\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>に\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>できるようにしました。","zh":"当时只知道结果通知还没收到。界面给出初始发现点和预定放置点，让人自己确认，并单独留下确认记录。"}]},{"id":"qa-tuck-6","title":"已有机器人的资料和你自己设计的部分，分别是什么？","page":"P30 → P31 → P39","blocks":[{"type":"prompt","ja":"ご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>で\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたのは、\u003cruby>製品\u003crt>せいひん\u003c/rt>\u003c/ruby>のどの\u003cruby>部分\u003crt>ぶぶん\u003c/rt>\u003c/ruby>ですか。","zh":"已有机器人的资料和你自己设计的部分，分别是什么？"},{"type":"speech","ja":"\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>をつかんで\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>機能\u003crt>きのう\u003c/rt>\u003c/ruby>は、\u003cruby>既存\u003crt>きそん\u003c/rt>\u003c/ruby>の\u003cruby>製品\u003crt>せいひん\u003c/rt>\u003c/ruby>を\u003cruby>参考\u003crt>さんこう\u003c/rt>\u003c/ruby>にしています。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたのはアプリの\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>です。\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をどこへ\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶかを\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめて、あとで\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>かなかったときに、ご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>でどこを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せばいいか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるところまでを\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にしました。","zh":"抓取和搬运物体的功能参考了现有产品。我设计的是 App 这部分，从发出指令前核对物品和去向，到结果没传回来时人可以怎样寻找，都做成了界面。"}]}]},{"id":"qa-reframe","label":"Reframe｜旧业务界面重做","items":[{"id":"qa-reframe-1","title":"这个工具是给谁用的？","page":"P43–44","blocks":[{"type":"prompt","ja":"\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うツールですか。","zh":"这个工具是给谁用的？"},{"type":"speech","ja":"\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>の\u003cruby>業務\u003crt>ぎょうむ\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すデザイナー\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けです。\u003cruby>編集\u003crt>へんしゅう\u003c/rt>\u003c/ruby>できる\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>のデータが\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っておらず、\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>い\u003cruby>期間\u003crt>きかん\u003c/rt>\u003c/ruby>に\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>くの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>をそろえる\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>しました。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>は、\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>のデザインルールに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせることが\u003cruby>前提\u003crt>ぜんてい\u003c/rt>\u003c/ruby>です。","zh":"使用者是重做公司业务界面的设计师。他手里缺少可编辑源文件，又得在短期内处理很多页，组件还要符合公司的设计规则。"}]},{"id":"qa-reframe-2","title":"为什么在导出之前安排人工确认？","page":"P45–47","blocks":[{"type":"prompt","ja":"なぜ\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>き\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>す\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、デザイナーが\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>するんですか。","zh":"为什么在导出之前安排人工确认？"},{"type":"speech","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>画像\u003crt>がぞう\u003c/rt>\u003c/ruby>から\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>や\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>の\u003cruby>役割\u003crt>やくわり\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り、AIが\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>いそうな\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>します。「\u003cruby>承認待\u003crt>しょうにんま\u003c/rt>\u003c/ruby>ち」が\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>ボタンに\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わると、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>意味\u003crt>いみ\u003c/rt>\u003c/ruby>まで\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わってしまいます。そこで\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>き\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>す\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、デザイナーが\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>役割\u003crt>やくわり\u003c/rt>\u003c/ruby>と\u003cruby>候補\u003crt>こうほ\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べ、\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なところを\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>せるようにしました。","zh":"先从旧截图中判断信息和操作的作用，让 AI 出候选。如果「等待审批」被变成可按的按钮，意思就变了，所以在导出前让人核对原用途和候选，必要时先改。"}]},{"id":"qa-reframe-3","title":"为什么让设计师选择要修改哪些页面？","page":"P49","blocks":[{"type":"prompt","ja":"なぜ\u003cruby>変更\u003crt>へんこう\u003c/rt>\u003c/ruby>する\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>べるようにしたんですか。","zh":"为什么让设计师选择要修改哪些页面？"},{"type":"speech","ja":"\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>の「\u003cruby>承認待\u003crt>しょうにんま\u003c/rt>\u003c/ruby>ち」は、\u003cruby>一覧\u003crt>いちらん\u003c/rt>\u003c/ruby>と\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>でまとめて\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>せます。\u003cruby>一方\u003crt>いっぽう\u003c/rt>\u003c/ruby>、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>のラベルでも、\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>の\u003cruby>公開\u003crt>こうかい\u003c/rt>\u003c/ruby>\u003cruby>状態\u003crt>じょうたい\u003c/rt>\u003c/ruby>を\u003cruby>示\u003crt>しめ\u003c/rt>\u003c/ruby>すものは\u003cruby>用途\u003crt>ようと\u003c/rt>\u003c/ruby>が\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>います。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>変更先\u003crt>へんこうさき\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>対象\u003crt>たいしょう\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んでから\u003cruby>適用\u003crt>てきよう\u003c/rt>\u003c/ruby>すれば、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つの\u003cruby>変更\u003crt>へんこう\u003c/rt>\u003c/ruby>が\u003cruby>意図\u003crt>いと\u003c/rt>\u003c/ruby>しない\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>に\u003cruby>広\u003crt>ひろ\u003c/rt>\u003c/ruby>がるのを\u003cruby>防\u003crt>ふせ\u003c/rt>\u003c/ruby>げると\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"订单的「等待审批」可以在列表和详情统一调整。外形一样的商品公开状态标签，用途却不同。所以先预览和选择适用页面，再批量修改，避免一次改动扩散到无关页面。"}]},{"id":"qa-reframe-4","title":"你做到哪一步了？接下来怎么验证效果？","page":"P52 → P54","blocks":[{"type":"prompt","ja":"どこまで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>って、どう\u003cruby>効果\u003crt>こうか\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめますか。","zh":"你做到哪一步了？接下来怎么验证效果？"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はツールの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>と、\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>を\u003cruby>共通\u003crt>きょうつう\u003c/rt>\u003c/ruby>の\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>で\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>した\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>まで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。AIによる\u003cruby>変換\u003crt>へんかん\u003c/rt>\u003c/ruby>とFigmaへの\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>き\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しは、ツール\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>として\u003cruby>設計\u003crt>せっけい\u003c/rt>\u003c/ruby>した\u003cruby>部分\u003crt>ぶぶん\u003c/rt>\u003c/ruby>です。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>手作業\u003crt>てさぎょう\u003c/rt>\u003c/ruby>とツールで\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べて、\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>や\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>が\u003cruby>保\u003crt>たも\u003c/rt>\u003c/ruby>たれていることを\u003cruby>条件\u003crt>じょうけん\u003c/rt>\u003c/ruby>に、\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>と\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>を\u003cruby>含\u003crt>ふく\u003c/rt>\u003c/ruby>めた\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たいです。","zh":"目前做了工具界面，以及用共用组件重做订单详情的示例。AI 转换和 Figma 导出是方案中设计的环节。下一步需要在同一批画面上比较两种做法，先保证原信息和操作保留，再看加上检查和修改之后的时间。"}]},{"id":"qa-reframe-5","title":"这 95% 表示什么？","page":"P50","blocks":[{"type":"prompt","ja":"この\u003cruby>95％\u003crt>きゅうじゅうごぱーせんと\u003c/rt>\u003c/ruby>は\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>表\u003crt>あらわ\u003c/rt>\u003c/ruby>していますか。","zh":"这 95% 表示什么？"},{"type":"speech","ja":"デモでは、\u003cruby>160画面\u003crt>ひゃくろくじゅうがめん\u003c/rt>\u003c/ruby>のうち\u003cruby>152画面\u003crt>ひゃくごじゅうにがめん\u003c/rt>\u003c/ruby>で\u003cruby>生成\u003crt>せいせい\u003c/rt>\u003c/ruby>が\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったという\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>です。\u003cruby>95％\u003crt>きゅうじゅうごぱーせんと\u003c/rt>\u003c/ruby>はその\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>み\u003cruby>具合\u003crt>ぐあい\u003c/rt>\u003c/ruby>です。\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つひとつの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>や\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>が\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っているかは、このあと\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>します。","zh":"演示设定是 160 个画面有 152 个完成生成，95% 表示处理进度。信息和操作有没有正确保留，要在下一步逐一检查。"}]},{"id":"qa-reframe-6","title":"什么情况下用了这个工具反而不划算？","page":"P53","blocks":[{"type":"prompt","ja":"ツールを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っても\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>が\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えるのは、どんな\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>ですか。","zh":"什么情况下用了这个工具反而不划算？"},{"type":"speech","ja":"\u003cruby>候補\u003crt>こうほ\u003c/rt>\u003c/ruby>を\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるのに\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>がかかる\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>です。この\u003cruby>試算\u003crt>しさん\u003c/rt>\u003c/ruby>では、\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>が\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>\u003cruby>16分\u003crt>じゅうろっぷん\u003c/rt>\u003c/ruby>なら\u003cruby>費用\u003crt>ひよう\u003c/rt>\u003c/ruby>は\u003cruby>下\u003crt>さ\u003c/rt>\u003c/ruby>がりますが、\u003cruby>32分\u003crt>さんじゅうにふん\u003c/rt>\u003c/ruby>かかると\u003cruby>利用料\u003crt>りようりょう\u003c/rt>\u003c/ruby>を\u003cruby>含\u003crt>ふく\u003c/rt>\u003c/ruby>めて\u003cruby>手作業\u003crt>てさぎょう\u003c/rt>\u003c/ruby>のほうが\u003cruby>安\u003crt>やす\u003c/rt>\u003c/ruby>くなります。\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>計\u003crt>はか\u003c/rt>\u003c/ruby>りたいのは、この\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>と\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>にかかる\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>です。","zh":"如果逐个检查候选花太久，就不划算。在这份试算里，每页检查 16 分钟可以节省费用，32 分钟时加上工具费，手动重做更便宜。接下来实际要测的是人工检查和修改要多久。"}]}]},{"id":"qa-around","label":"AROUND｜行车时的车外声音提醒","items":[{"id":"qa-around-1","title":"你设想谁会在什么情况下使用它？","page":"P56 → P60","blocks":[{"type":"prompt","ja":"どんな\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が、どんな\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>で\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うんですか。","zh":"你设想谁会在什么情况下使用它？"},{"type":"speech","ja":"\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>を\u003cruby>運転\u003crt>うんてん\u003c/rt>\u003c/ruby>している\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けて\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>車線\u003crt>しゃせん\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えようとしたときに、\u003cruby>左後\u003crt>ひだりうし\u003c/rt>\u003c/ruby>ろでクラクションが\u003cruby>鳴\u003crt>な\u003c/rt>\u003c/ruby>る\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>です。\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たままでも\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づけるように、シートの\u003cruby>左側\u003crt>ひだりがわ\u003c/rt>\u003c/ruby>が\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>く\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>回\u003crt>かい\u003c/rt>\u003c/ruby>\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>します。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>れば、クラクションが\u003cruby>左後\u003crt>ひだりうし\u003c/rt>\u003c/ruby>ろで\u003cruby>鳴\u003crt>な\u003c/rt>\u003c/ruby>ったことも\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。","zh":"我设想的是正在开车的驾驶员。比如准备变道时，左后方响起喇叭声。为了让他看着前方也能留意到，座椅左侧会短震两下，屏幕上同时提示是什么声音、从哪里来。"}]},{"id":"qa-around-2","title":"为什么行车中和停车后能做的事不同？","page":"P62 → P63","blocks":[{"type":"prompt","ja":"なぜ\u003cruby>走行中\u003crt>そうこうちゅう\u003c/rt>\u003c/ruby>と\u003cruby>駐車\u003crt>ちゅうしゃ\u003c/rt>\u003c/ruby>\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>で、できることを\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けたんですか。","zh":"为什么行车中和停车后能做的事不同？"},{"type":"speech","ja":"\u003cruby>走\u003crt>はし\u003c/rt>\u003c/ruby>っている\u003cruby>間\u003crt>あいだ\u003c/rt>\u003c/ruby>は、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>かと\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>を\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>く\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせて、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になるときに\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>で\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>ける\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れです。\u003cruby>録音\u003crt>ろくおん\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>き\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>したりカメラを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たりするには、\u003cruby>注意\u003crt>ちゅうい\u003c/rt>\u003c/ruby>を\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>ける\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>が\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なので、\u003cruby>安全\u003crt>あんぜん\u003c/rt>\u003c/ruby>な\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>に\u003cruby>停\u003crt>と\u003c/rt>\u003c/ruby>めてからにしました。","zh":"行车时简短提示是什么声音、从哪里来，还在意时可以用语音问。重听录音和查看摄像需要更多注意力，所以留到安全停车后。"}]},{"id":"qa-around-3","title":"用振动也提示前后方向，会不会更容易理解？","page":"P60","blocks":[{"type":"prompt","ja":"\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>で\u003cruby>前後\u003crt>ぜんご\u003c/rt>\u003c/ruby>も\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えるほうが\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすくないですか。","zh":"用振动也提示前后方向，会不会更容易理解？"},{"type":"speech","ja":"\u003cruby>運転\u003crt>うんてん\u003c/rt>\u003c/ruby>しながら、\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>と\u003cruby>後\u003crt>うし\u003c/rt>\u003c/ruby>ろで\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>う\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>の\u003cruby>意味\u003crt>いみ\u003c/rt>\u003c/ruby>を\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>い\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すのは\u003cruby>負担\u003crt>ふたん\u003c/rt>\u003c/ruby>になると\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。そこで、\u003cruby>左右\u003crt>さゆう\u003c/rt>\u003c/rub
