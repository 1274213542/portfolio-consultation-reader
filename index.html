<!doctype html>
<html lang="zh-CN">
<head>

<title>I-STUDIO · 作品集口述</title>
<style>
:root {
  color-scheme: dark;
  --bg: #131715; --panel: #1b211e; --raised: #26302a; --bound: #38433c;
  --ink: #f2f4ed; --soft: #c0c9c1; --muted: #a1b0a5; --accent: #a5ddba;
  --body-size: 20px; --leading: 2.05; --letters: .015em; --ruby-size: .42em; --ruby-gap: 1px;
  --shell-width: 790px; --bar-top: 62px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-top) + env(safe-area-inset-top) + 12px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","PingFang SC","Noto Sans CJK SC",sans-serif; }
button,input,output { font: inherit; }
button { color: inherit; cursor: pointer; }
a { color: var(--accent); }
button,summary,a,input { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button { border: 0; }
[hidden] { display: none !important; }
.shell,main { max-width: var(--shell-width); margin-inline: auto; }
.bar { position: sticky; top: 0; z-index: 3; padding-top: env(safe-area-inset-top); background: var(--bg); border-bottom: 1px solid var(--bound); }
.bar .shell { min-height: var(--bar-top); display: flex; align-items: center; gap: 16px; padding: 9px 20px; }
.brand-mark { width: 4px; height: 27px; background: var(--accent); border-radius: 3px; flex: none; }
.brand { flex: none; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .015em; }
.brand small { color: var(--muted); display: block; font: 600 10px/1.4 -apple-system,BlinkMacSystemFont,sans-serif; letter-spacing: .12em; }
.location { color: var(--soft); background: none; border-radius: 6px; font-size: 13px; margin-left: auto; padding: 8px 0 8px 8px; min-width: 0; display: flex; align-items: center; gap: 8px; }
.location .where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { display: inline-block; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin: -3px 3px 0 0; flex: none; }
main { padding: 20px 20px 108px; padding-bottom: calc(108px + env(safe-area-inset-bottom)); }
.section-head { margin: 0 0 13px; display: flex; align-items: baseline; gap: 12px; }
.section-head h2 { margin: 0; font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -.03em; }
.reader-section + .reader-section { margin-top: 42px; }
.group + .group { margin-top: 26px; }
.groupname { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 10px; }
.card { background: var(--panel); border: 1px solid var(--bound); border-radius: 12px; padding: 17px 20px 19px; }
.card + .card { margin-top: 12px; }
.card:focus { outline: none; }
.card:focus-visible { outline: 2px solid var(--accent); }
.card-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
.card-head h4 { font-size: 15px; line-height: 1.55; margin: 0; font-weight: 600; color: var(--soft); overflow-wrap: anywhere; }
.page { flex: none; color: var(--accent); font: 650 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; text-decoration: none; white-space: normal; max-width: 9em; }
.page a { color: inherit; text-decoration: none; border-bottom: 1px solid #698573; padding-block: 5px; }
.block + .block { margin-top: 12px; }
.block-page { display: block; margin-bottom: 6px; }
.jp { margin: 0; color: var(--ink); font-family: -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif; font-size: var(--body-size); line-height: var(--leading); font-weight: 520; letter-spacing: var(--letters); overflow-wrap: anywhere; line-break: strict; }
ruby { ruby-align: center; ruby-position: over; }
rt { font-size: var(--ruby-size); letter-spacing: 0; font-weight: 550; color: var(--accent); line-height: 1; position: relative; top: calc(0px - var(--ruby-gap)); }
html.no-ruby rt,html.no-ruby rp { display: none; }
html.no-ruby ruby { display: inline; }
.zh { font-size: clamp(14px, .80em + 2px, 18px); line-height: 1.85; color: var(--soft); margin: 10px 0 0; border-left: 2px solid #587964; padding-left: 11px; overflow-wrap: anywhere; white-space: pre-line; }
.note { color: var(--muted); font-size: 14px; }
.article-source { display: inline-block; margin-top: 14px; padding-block: 5px; font-size: 14px; text-underline-offset: 3px; }
.note .zh:only-child { margin: 0; border-left: 0; padding-left: 0; }
.prompt .jp { color: #dbecdf; font-weight: 640; }
.prompt + .speech { margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--bound); }
html.no-zh .translation { display: none; }
.dock { position: fixed; z-index: 4; bottom: 0; inset-inline: 0; background: var(--panel); border-top: 1px solid var(--bound); padding-bottom: env(safe-area-inset-bottom); }
.dock .shell { height: 62px; padding-inline: 13px; display: grid; grid-template-columns: 1.15fr 1fr 1fr 1fr; align-items: center; gap: 6px; }
.dock button { min-height: 43px; min-width: 0; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; color: var(--soft); background: transparent; }
.dock button:first-child { background: #32483a; color: #def4e5; font-weight: 650; }
.dock button[aria-pressed="true"] { color: var(--accent); }
.dock button[aria-pressed="true"] .lamp { background: var(--accent); }
.lamp { width: 6px; height: 6px; display: inline-block; border: 1px solid currentColor; border-radius: 50%; }
.line-icon { font-size: 18px; line-height: 1; }
dialog { margin: auto auto 0; width: min(100%,640px); max-height: min(84vh,810px); max-height: min(84dvh,810px); color: var(--ink); background: var(--panel); border: 1px solid var(--bound); border-bottom: none; border-radius: 18px 18px 0 0; padding: 0; overflow: hidden; }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgb(3 6 4 / .66); }
body.modal-open { overflow: hidden; }
.sheet-top { display: flex; align-items: center; padding: 15px 19px 8px; gap: 8px; }
.sheet-top h2 { flex: 1; margin: 0; font-size: 20px; }
.dismiss { align-self: center; color: var(--soft); background: var(--raised); min-height: 39px; padding: 4px 13px; border-radius: 8px; }
.sheet-tools { padding: 0 18px; }
.tabs { display: flex; gap: 5px; margin: 8px 0; flex-wrap: wrap; }
.tab { margin: 0; padding: 6px 9px; min-height: 38px; font-size: 13px; line-height: 1.4; background: transparent; color: var(--soft); border-radius: 7px; border: 1px solid var(--bound); }
.tab[aria-pressed="true"] { background: #304237; color: #d0f1db; border-color: #709581; }
.search { display: block; width: 100%; border-radius: 8px; border: 1px solid var(--bound); padding: 9px 12px; color: var(--ink); background: var(--bg); font-size: 16px; appearance: none; }
.search::placeholder { color: var(--muted); opacity: 1; }
.sheet-scroll { overflow-y: auto; overscroll-behavior: contain; padding: 12px 18px max(20px, env(safe-area-inset-bottom)); min-height: 0; }
#contents .sheet-scroll { min-height: min(26vh,220px); }
.toc-group { border-bottom: 1px solid var(--bound); }
.toc-group summary { padding: 12px 2px; font-weight: 620; color: var(--ink); cursor: pointer; }
.toc-link { display: flex; align-items: baseline; text-decoration: none; min-height: 43px; gap: 12px; padding: 10px 10px; font-size: 14px; color: var(--soft); border-radius: 5px; overflow-wrap: anywhere; }
.toc-link .page { min-width: 3em; }
.toc-link[aria-current="location"] { background: #304237; color: var(--ink); }
.no-results { color: var(--muted); margin: 14px 0; }
.control { margin: 0 0 17px; }
.control label { display: flex; align-items: baseline; justify-content: space-between; color: var(--soft); font-weight: 550; }
.control output { color: var(--accent); font: 600 13px ui-monospace,monospace; }
.control input { display: block; width: 100%; accent-color: var(--accent); min-height: 35px; margin: 3px 0; }
.sample { padding: 9px 13px; border: 1px solid var(--bound); border-radius: 8px; background: var(--bg); margin: 8px 18px 0; }
.reset { padding: 8px 13px; min-height: 40px; color: var(--soft); background: var(--raised); border-radius: 7px; }
@media (min-width: 760px) {
 main { padding-top: 35px; } .card { padding: 21px 26px 23px; }
 dialog { margin: auto; max-height: min(82vh,780px); border-bottom: 1px solid var(--bound); border-radius: 15px; }
}
@media (max-width: 390px) {
 .bar .shell { gap: 9px; padding-inline: 12px; }
 main { padding-inline: 11px; } .card { padding: 13px; }
 .dock .shell { padding-inline: 7px; gap: 2px; } .dock button { gap: 4px; }
 .sheet-tools,.sheet-scroll { padding-inline: 12px; } .tab { padding-inline: 7px; }
}
</style>
</head>

c/ruby>しますか。","zh":"你打算按什么顺序讲？"},{"type":"speech","ja":"まず\u003cruby>目次\u003crt>もくじ\u003c/rt>\u003c/ruby>をお\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せして、そのあと\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>しますね。","zh":"我先给您看一下目录，然后介绍第一件作品。"}]}]},{"id":"questions-first","label":"对方先提问","items":[{"id":"host-asks","title":"对方已经看过作品集","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>にポートフォリオを\u003cruby>拝見\u003crt>はいけん\u003c/rt>\u003c/ruby>したので、こちらからいくつか\u003cruby>質問\u003crt>しつもん\u003c/rt>\u003c/ruby>してもいいですか。","zh":"我们已经看过作品集，可以先问几个问题吗？"},{"type":"speech","ja":"\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていただいて、ありがとうございます。はい、お\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"谢谢您已经看过。好，您请问。"},{"type":"note","ja":"","zh":"对方问到某个项目时，直接翻到相关页回答。"}]},{"id":"one-project","title":"只用一件作品简单说明","page":"P7 → P17","blocks":[{"type":"prompt","ja":"\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つだけ、\u003cruby>簡単\u003crt>かんたん\u003c/rt>\u003c/ruby>にお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"请你只简短介绍一件作品"},{"type":"speech","ja":"はい、では\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に、ショッピングアプリで\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>する\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れをデザインした『MORI』をご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>します。\u003cruby>注文履歴\u003crt>ちゅうもんりれき\u003c/rt>\u003c/ruby>から\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>したい\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶと、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、カードに\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>の\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>と、\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るポイントを\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>に\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できます。","zh":"好的，那我先介绍 MORI，这是我为购物 App 设计的服装退货流程。买家从订单记录里选好要退的衣服，预约取件之前，就能分别看到预计退到卡里的金额和返还的积分。"}]},{"id":"confidence-cue","title":"请介绍你最有信心的作品","page":"P7 → P17","blocks":[{"type":"prompt","ja":"\u003cruby>自信\u003crt>じしん\u003c/rt>\u003c/ruby>のある\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>してください。","zh":"请你介绍有信心的作品"},{"type":"speech","ja":"はい。\u003cruby>一番\u003crt>いちばん\u003c/rt>\u003c/ruby>\u003cruby>自信\u003crt>じしん\u003c/rt>\u003c/ruby>があるのは、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>『MORI』です。ショッピングアプリで\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するとき、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>の\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるようにしました。","zh":"好的，我最有信心的是第一件作品 MORI。我设计了购物 App 里的服装退货流程，让买家在预约取件前就能看到预计退款。"}]}]}]},{"id":"pages","label":"逐页介绍","kind":"pages","groups":[{"id":"intro-pages","label":"开场与目录｜P1–6","items":[{"id":"p1","title":"封面｜接到介绍作品集的邀请后","page":"P1","blocks":[{"type":"speech","ja":"こちらが\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>のポートフォリオです。","zh":"这是我这次带来的作品集。"}]},{"id":"p2","title":"自我介绍页","page":"P2","blocks":[{"type":"speech","ja":"こちらは\u003cruby>自己\u003crt>じこ\u003c/rt>\u003c/ruby>\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>のページです。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>んでいるUI/UXやグラフィック、\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>のデザインを\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>しています。\u003cruby>右側\u003crt>みぎがわ\u003c/rt>\u003c/ruby>には、\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>でよく\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うツールを\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せています。","zh":"这是我的自我介绍页。上面介绍了我平时做的 UI/UX、平面和书籍设计，右边是我做作品时常用的工具。"}]},{"id":"p3","title":"学习和工作经历","page":"P3","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、これまでの\u003cruby>経歴\u003crt>けいれき\u003c/rt>\u003c/ruby>をまとめたページです。\u003cruby>左側\u003crt>ひだりがわ\u003c/rt>\u003c/ruby>に\u003cruby>大学\u003crt>だいがく\u003c/rt>\u003c/ruby>と\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>で\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>んできたことや\u003cruby>受賞\u003crt>じゅしょう\u003c/rt>\u003c/ruby>\u003cruby>歴\u003crt>れき\u003c/rt>\u003c/ruby>を、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>に\u003cruby>企業\u003crt>きぎょう\u003c/rt>\u003c/ruby>のレポート\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>など、\u003cruby>学外\u003crt>がくがい\u003c/rt>\u003c/ruby>で\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>んできた\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せています。","zh":"接下来这页是我的学习和工作经历。左边是本科和研究生阶段学的专业以及获奖经历，中间是我在校外做过的工作，比如为企业报告做设计。"}]},{"id":"p4","title":"目录","page":"P4","blocks":[{"type":"speech","ja":"こちらが\u003cruby>目次\u003crt>もくじ\u003c/rt>\u003c/ruby>です。\u003cruby>前半\u003crt>ぜんはん\u003c/rt>\u003c/ruby>はUI/UXの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>で、\u003cruby>後半\u003crt>こうはん\u003c/rt>\u003c/ruby>は\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>や\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>、3Dの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>です。では、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>から\u003cruby>順\u003crt>じゅん\u003c/rt>\u003c/ruby>にご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>しますね。","zh":"这是目录。前半是 UI/UX 作品，后半是书、摄影和 3D 作品。那我从第一件开始介绍。"}]},{"id":"p5","title":"目录续页，略过","page":"P5","blocks":[{"type":"note","ja":"","zh":"略过这一页，直接翻到 P7 的 MORI。"}]},{"id":"p6","title":"目录续页，略过","page":"P6","blocks":[{"type":"note","ja":"","zh":"略过这一页，直接翻到 P7 的 MORI。"}]}]},{"id":"intro-mori","label":"MORI｜P7–26","items":[{"id":"p7","title":"MORI 封面｜购物 App 内的服装退货流程","page":"P7","blocks":[{"type":"speech","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>『MORI』では、\u003cruby>架空\u003crt>かくう\u003c/rt>\u003c/ruby>のショッピングアプリで\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するときの\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れをデザインしました。\u003cruby>私自身\u003crt>わたしじしん\u003c/rt>\u003c/ruby>、ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をするのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、それをきっかけにFigmaで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"第一件作品叫 MORI，我为一款假想的购物 App 设计了服装退货流程。我自己很喜欢网购，就以此为契机，用 Figma 做了这个作品。"}]},{"id":"p8","title":"从现有退货说明里发现的问题","page":"P8","blocks":[{"type":"speech","ja":"まず、ユニクロとZARAの\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べました。\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>のことは\u003cruby>購入履歴\u003crt>こうにゅうりれき\u003c/rt>\u003c/ruby>やメール、お\u003cruby>金\u003crt>かね\u003c/rt>\u003c/ruby>が\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ったかどうかはカードの\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>と、\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれていたんです。","zh":"我先比较了优衣库和 ZARA 的退货说明。查包裹要看购物记录或邮件，确认钱有没有回来又要看银行卡账单，信息分散在好几个地方。"}]},{"id":"p9","title":"平时会网购、很少退货的人","page":"P9","blocks":[{"type":"speech","ja":"ここで\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>したのは、\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>帰\u003crt>かえ\u003c/rt>\u003c/ruby>って、スマホでよく\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>です。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>の\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>には\u003cruby>慣\u003crt>な\u003c/rt>\u003c/ruby>れていても、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>はめったにしないので、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>から\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めればいいか\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>う\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"我设想的人下班后经常用手机买衣服。购物和操作手机都很熟练，只是很少退货，一旦要退就不知道从哪一步开始。"}]},{"id":"p10","title":"买了两件，只想退衬衫","page":"P10","blocks":[{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、シャツとパンツを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>ってみたら、シャツだけサイズが\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わなかったとします。\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>にクーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っているので、シャツの\u003cruby>値段\u003crt>ねだん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ただけでは、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないんですね。","zh":"比如她一起买了衬衫和裤子，只有衬衫的尺码不合适。整单用过优惠券和积分，只看衬衫的标价，算不出这次会退多少。"}]},{"id":"p11","title":"沿着买家要做的事安排顺序","page":"P11","blocks":[{"type":"speech","ja":"\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れを\u003cruby>順\u003crt>じゅん\u003c/rt>\u003c/ruby>にたどると、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は「どこから\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するの？」で、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあとは「もう\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたかな？」に\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。それで、\u003cruby>入口\u003crt>いりぐち\u003c/rt>\u003c/ruby>はその\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>の\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いて、\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあとは、いつ\u003cruby>更新\u003crt>こうしん\u003c/rt>\u003c/ruby>された\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>かも\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すことにしました。","zh":"沿着她的过程走，最初想的是「从哪儿办退货」，寄出后就变成「衣服到了吗」。所以我把入口设在这件衣服的订单详情里，寄出后也让她看到信息是什么时候更新的。"}]},{"id":"p12","title":"谁在处理，找谁确认","page":"P12","blocks":[{"type":"speech","ja":"で、\u003cruby>裏側\u003crt>うらがわ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てみると、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>を\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶのは\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>するのはお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>、\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>を\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>に\u003cruby>反映\u003crt>はんえい\u003c/rt>\u003c/ruby>するのはカード\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>です。\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きの\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>ったときは、まずお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>できる\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れにしました。","zh":"再看背后，承运商负责运包裹，店家检查衣服，最后由卡公司把退款反映到账单。中间出了问题，买家可以先找店家确认。"}]},{"id":"p13","title":"什么时候才改变状态","page":"P13","blocks":[{"type":"speech","ja":"\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>かを\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けたうえで、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>の\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたら\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えるかも\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めました。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>が\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>き\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>けたら「\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>」、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したら、そこで\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>\u003cruby>額\u003crt>がく\u003c/rt>\u003c/ruby>が\u003cruby>確定\u003crt>かくてい\u003c/rt>\u003c/ruby>します。","zh":"分清各方的责任之后，我又定了界面何时更新。比如承运商揽件后显示「退回途中」，等店家确认商品，退款金额才确定。"}]},{"id":"p14","title":"为什么选中间的 B 案","page":"P14","blocks":[{"type":"speech","ja":"\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>がお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>着\u003crt>つ\u003c/rt>\u003c/ruby>いたところで、\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つの\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せ\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べました。\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>だと\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことだけ、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>だと「\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>」が\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ります。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>なら「ちゃんと\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いた。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ている」と、\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるので、この\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。","zh":"我比较了包裹到店时的三种呈现。左边只告诉人已经送到，右边最先看到的是「正在检查商品」。中间一眼就能看出「包裹到了，现在是店家在检查」，所以我选了它。"}]},{"id":"p15","title":"图表里的数字怎么读","page":"P15","blocks":[{"type":"speech","ja":"このグラフは、\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つの\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>をどう\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたものです。\u003cruby>各案\u003crt>かくあん\u003c/rt>\u003c/ruby>に\u003cruby>50件\u003crt>ごじゅっけん\u003c/rt>\u003c/ruby>ずつ\u003cruby>仮\u003crt>かり\u003c/rt>\u003c/ruby>の\u003cruby>回答\u003crt>かいとう\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いて、\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きに\u003cruby>安心\u003crt>あんしん\u003c/rt>\u003c/ruby>できそうか、またこのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>いたいかを、\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>に\u003cruby>集計\u003crt>しゅうけい\u003c/rt>\u003c/ruby>しています。","zh":"这张图是我设计的比较方法。每案用了 50 条假设回答，把「是否能安心办理」和「是否愿意再来这家店购物」分开统计。"}]},{"id":"p16","title":"界面的配色和图标","page":"P16","blocks":[{"type":"speech","ja":"\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>は\u003cruby>青\u003crt>あお\u003c/rt>\u003c/ruby>を\u003cruby>基調\u003crt>きちょう\u003c/rt>\u003c/ruby>にしています。\u003cruby>左下\u003crt>ひだりした\u003c/rt>\u003c/ruby>のアイコンは、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>箱\u003crt>はこ\u003c/rt>\u003c/ruby>や\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>状\u003crt>じょう\u003c/rt>\u003c/ruby>をもとに\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"退货界面以蓝色为主。左下角的图标取自寄回衣服时用到的包装箱和运单。"}]},{"id":"p17","title":"预约取件之前先看到预计退款","page":"P17","blocks":[{"type":"speech","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>では、\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>からシャツを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、サイズが\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わなかったことを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びます。そこで、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、カードに\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>見込\u003crt>みこ\u003c/rt>\u003c/ruby>み\u003cruby>額\u003crt>がく\u003c/rt>\u003c/ruby>と、\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るポイントを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようにしました。\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>を\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>ってから、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するか\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>められます。","zh":"看实际界面，从左往右先选衬衫，再选尺码不合适。预约取件前就能分开看到预计退回卡里的钱和返还的积分，知道金额后再决定退不退。"}]},{"id":"p18","title":"为什么卡里退 4,800 日元，积分另外退","page":"P18","blocks":[{"type":"speech","ja":"シャツは\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>の\u003cruby>合計額\u003crt>ごうけいがく\u003c/rt>\u003c/ruby>の\u003cruby>6割\u003crt>ろくわり\u003c/rt>\u003c/ruby>なので、クーポンもポイントも\u003cruby>6割\u003crt>ろくわり\u003c/rt>\u003c/ruby>をシャツの\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>にしました。\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>くと、カードには\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>、ポイントは\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>に\u003cruby>600ポイント\u003crt>ろっぴゃくぽいんと\u003c/rt>\u003c/ruby>\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>見込\u003crt>みこ\u003c/rt>\u003c/ruby>みです。","zh":"衬衫占两件衣服总价的六成，所以优惠券和积分也各按六成分给衬衫。再扣除退货运费，预计退到卡里 4,800 日元，另返 600 积分。"}]},{"id":"p19","title":"选取件时间时再确认费用","page":"P19","blocks":[{"type":"speech","ja":"そこまで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>すると\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めたら、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>の\u003cruby>日時\u003crt>にちじ\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びます。この\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にも\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>と\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いたので、\u003cruby>予約\u003crt>よやく\u003c/rt>\u003c/ruby>する\u003cruby>直前\u003crt>ちょくぜん\u003c/rt>\u003c/ruby>に、いくらかかって、どこに\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りに\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかを\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめられます。","zh":"看完并决定退货后，再选择上门取件日期和时段。这里也放了退货运费和取件地址，预约前能再核对一次费用和地点。"}]},{"id":"p20","title":"寄出后，先看这条记录是谁更新的","page":"P20","blocks":[{"type":"speech","ja":"\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>を\u003cruby>渡\u003crt>わた\u003c/rt>\u003c/ruby>したあとは、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>がこう\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。「ショップへ\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>かっています」のすぐ\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>に、\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>が\u003cruby>更新\u003crt>こうしん\u003c/rt>\u003c/ruby>した\u003cruby>時刻\u003crt>じこく\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>して、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>着\u003crt>つ\u003c/rt>\u003c/ruby>いたらここで\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせる、と\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えています。","zh":"把包裹交出去后，就变成这个界面。「正在运往店家」的下面有承运商更新时间，同时告诉买家，下次到店时可以在这里看到通知。"}]},{"id":"p21","title":"这一步该等，还是该联系店家","page":"P21","blocks":[{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>着\u003crt>つ\u003c/rt>\u003c/ruby>いてからは、\u003cruby>二通\u003crt>ふたとお\u003c/rt>\u003c/ruby>りあります。\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>なので、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>をいつまでに\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すかを\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>します。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>のようにタグの\u003cruby>同梱\u003crt>どうこん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できないときは、タグを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が、\u003cruby>梱包\u003crt>こんぽう\u003c/rt>\u003c/ruby>したときの\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>を\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えられるように、\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>ボタンを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>します。","zh":"到店以后分两种情况。左边是店家正在检查，显示下次最晚何时通知。右边是店家没确认到吊牌，买家如果确实一起寄了，可以点按钮说明当时如何打包。"}]},{"id":"p22","title":"店家办理退款和账单入账之间的时间差","page":"P22","blocks":[{"type":"speech","ja":"こちらは\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きが\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>んだ\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。この\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>だと、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きしたのは\u003cruby>9月\u003crt>くがつ\u003c/rt>\u003c/ruby>\u003cruby>19日\u003crt>じゅうくにち\u003c/rt>\u003c/ruby>で、\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>る\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>は\u003cruby>30日\u003crt>さんじゅうにち\u003c/rt>\u003c/ruby>ごろです。\u003cruby>日付\u003crt>ひづけ\u003c/rt>\u003c/ruby>を\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つに\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けると、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>カードを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ても\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>っていない\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。","zh":"这是店家办完退款后的界面。这里的例子是 9 月 19 日由店家办理，预计 30 日左右反映在账单上。把两个日期分开，人就能明白为什么现在去查可能还看不到。"}]},{"id":"p23","title":"查不到物流和查不到退款，要做的事不同","page":"P23","blocks":[{"type":"speech","ja":"うまく\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できない\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>も\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>は\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しい\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>が\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>れなかったときで、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>れた\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>を\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>して、もう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>更新\u003crt>こうしん\u003c/rt>\u003c/ruby>できます。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>は\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>のほうで、\u003cruby>反映\u003crt>はんえい\u003c/rt>\u003c/ruby>の\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>を\u003cruby>過\u003crt>す\u003c/rt>\u003c/ruby>ぎても\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>に\u003cruby>見当\u003crt>みあ\u003c/rt>\u003c/ruby>たらなければ、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できます。","zh":"我也考虑了查不到的情况。左边是没取到最新物流，保留上次的记录，还能重新刷新。右边是退款，过了预计时间仍没在账单上找到，就可以请店家核查。"}]},{"id":"p24","title":"发起咨询时自动带上记录","page":"P24","blocks":[{"type":"speech","ja":"そのまま\u003cruby>問\u003crt>と\u003c/rt>\u003c/ruby>い\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせに\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>むと、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>受付\u003crt>うけつけ\u003c/rt>\u003c/ruby>\u003cruby>番号\u003crt>ばんごう\u003c/rt>\u003c/ruby>と\u003cruby>直近\u003crt>ちょっきん\u003c/rt>\u003c/ruby>の\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>が\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>から\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>いてきます。あとは「\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたいか」だけ\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いて、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で、\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>る\u003cruby>内容\u003crt>ないよう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てから\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>れます。","zh":"接着进入咨询时，退货受理号和最近的记录已经附好了。买家只要写自己想确认什么，在中间这个界面看清一并发送的内容，就能发给店家。"}]},{"id":"p25","title":"用同一个人对照设计前后的目标","page":"P25","blocks":[{"type":"speech","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ると、シャツを\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあと、\u003cruby>何度\u003crt>なんど\u003c/rt>\u003c/ruby>も\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたくなるかもしれません。\u003cruby>目指\u003crt>めざ\u003c/rt>\u003c/ruby>したのは、\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>れば「\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しているから、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>とう」と\u003cruby>判断\u003crt>はんだん\u003c/rt>\u003c/ruby>できる\u003cruby>状態\u003crt>じょうたい\u003c/rt>\u003c/ruby>です。","zh":"回到最初设定的买家，她寄出衬衫后，可能会反复查看退货进度。我希望她看一次就能判断「现在店家在检查，我等下次通知就好」。"}]},{"id":"p26","title":"用最后一张主视觉收住","page":"P26","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>の\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>にスマホが\u003cruby>浮\u003crt>う\u003c/rt>\u003c/ruby>かぶビジュアルで\u003cruby>締\u003crt>し\u003c/rt>\u003c/ruby>めています。","zh":"最后用手机浮在手掌上方的主视觉来结束。"}]}]},{"id":"intro-tuck","label":"TUCK T10｜P27–42","items":[{"id":"p27","title":"TUCK T10 封面｜扫地机器人的 App 提案","page":"P27","blocks":[{"type":"speech","ja":"\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>いて、TUCK T10という、アームで\u003cruby>床\u003crt>ゆか\u003c/rt>\u003c/ruby>の\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>を\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけるロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>にはFigmaと、HTML、CSS、JavaScriptを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いました。","zh":"接下来是 TUCK T10，一款为能用机械臂收拾地面小物的扫地机器人设想的 App。制作时用了 Figma、HTML、CSS 和 JavaScript。"}]},{"id":"p28","title":"为什么机器人要先移开东西","page":"P28","blocks":[{"type":"speech","ja":"そもそも、\u003cruby>床\u003crt>ゆか\u003c/rt>\u003c/ruby>に\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>があると、\u003cruby>避\u003crt>よ\u003c/rt>\u003c/ruby>けたところに\u003cruby>掃除\u003crt>そうじ\u003c/rt>\u003c/ruby>\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>しができたり、コードを\u003cruby>巻\u003crt>ま\u003c/rt>\u003c/ruby>き\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>んで\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>まったりします。そこで、\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べる\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>は\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>にどかして、\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>った\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>は\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる、という\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"地面有杂物时，机器人绕开就会漏扫，卷入电线也可能停下来。我设定的场景是能搬的先移开，剩下需要确认的再由人处理。"}]},{"id":"p29","title":"聚焦「在地图上选物品」这一种操作","page":"P29","blocks":[{"type":"speech","ja":"\u003cruby>参考\u003crt>さんこう\u003c/rt>\u003c/ruby>にしたSaros Z70には、\u003cruby>自動\u003crt>じどう\u003c/rt>\u003c/ruby>で\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づける\u003cruby>方法\u003crt>ほうほう\u003c/rt>\u003c/ruby>や\u003cruby>遠隔操作\u003crt>えんかくそうさ\u003c/rt>\u003c/ruby>もあります。その\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>上\u003crt>あ\u003c/rt>\u003c/ruby>げたのは、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の「\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>で\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶ」\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>です。\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>んでほしい\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだあと、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>まで\u003cruby>追\u003crt>お\u003c/rt>\u003c/ruby>える\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"参考产品 Saros Z70 也支持自动整理和远程操控。我选了中间的「在地图上选择」，从人自己决定搬哪件东西，一直设计到事后确认。"}]},{"id":"p30","title":"操作指南里的限制怎样影响界面","page":"P30","blocks":[{"type":"speech","ja":"\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>ガイドを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>むと、\u003cruby>重\u003crt>おも\u003c/rt>\u003c/ruby>さによって\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ち\u003cruby>上\u003crt>あ\u003c/rt>\u003c/ruby>げられなかったり、\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>に\u003cruby>段差\u003crt>だんさ\u003c/rt>\u003c/ruby>があると、\u003cruby>手前\u003crt>てまえ\u003c/rt>\u003c/ruby>で\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>下\u003crt>お\u003c/rt>\u003c/ruby>ろしたりするんです。なので、\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>が\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わっても、\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>が\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>どおりに\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたとは\u003cruby>限\u003crt>かぎ\u003c/rt>\u003c/ruby>らない。そこをアプリで\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えようと\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"操作指南里写到，物品太重可能拿不起来，途中有台阶也可能提前放下。所以整项工作结束，并不代表每件物品都到达了预定位置。这就是我想在 App 上区分的两件事。"}]},{"id":"p31","title":"让袜子和拖鞋走一遍流程","page":"P31","blocks":[{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、リビングの\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、ロボットに\u003cruby>任\u003crt>まか\u003c/rt>\u003c/ruby>せたとします。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>は\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったと\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるけど、スリッパだけ\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>かない。このあと、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がどうやってスリッパの\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>き\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるかまでを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"比如在客厅选了袜子和拖鞋交给机器人。袜子已经收到搬运完成通知，只有拖鞋的结果没回来。我把人后面该怎么确认，也放在同一个场景里考虑。"}]},{"id":"p32","title":"使用者的疑问会随时间改变","page":"P32","blocks":[{"type":"speech","ja":"\u003cruby>任\u003crt>まか\u003c/rt>\u003c/ruby>せる\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>は「どこに\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>かれるの？」、\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>き\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すまでは「ちゃんと\u003cruby>指示\u003crt>しじ\u003c/rt>\u003c/ruby>は\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いた？」、\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったら「どれを\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>に\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>けばいい？」ですよね。この\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つで、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すものを\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けました。","zh":"开始前想知道「要放到哪里」，动起来之前想知道「指令收到了吗」，结束后则是「我需要去看的是哪件」。我按这三个时刻来定画面分别要给什么信息。"}]},{"id":"p33","title":"人、App 和机器人各自做什么","page":"P33","blocks":[{"type":"speech","ja":"この\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>の\u003cruby>矢印\u003crt>やじるし\u003c/rt>\u003c/ruby>は、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>から\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>に\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>が\u003cruby>渡\u003crt>わた\u003c/rt>\u003c/ruby>るかを\u003cruby>表\u003crt>あらわ\u003c/rt>\u003c/ruby>しています。\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶと、アプリが\u003cruby>指示\u003crt>しじ\u003c/rt>\u003c/ruby>を\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り、ロボットがつかんだり\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>んだりした\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>は、\u003cruby>逆向\u003crt>ぎゃくむ\u003c/rt>\u003c/ruby>きにアプリへ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>ってきます。","zh":"图里的箭头表示信息从谁传给谁。人选中物品后由 App 发出指令，机器人抓取、搬运等动作的状态则沿相反方向返回 App。"}]},{"id":"p34","title":"为什么把没有结果的拖鞋放到最前面","page":"P34","blocks":[{"type":"speech","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>ったのが、\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>のように\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>を\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きく\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すか、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>のように\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すかです。「\u003cruby>要確認\u003crt>ようかくにん\u003c/rt>\u003c/ruby>が\u003cruby>1点\u003crt>いってん\u003c/rt>\u003c/ruby>」だけだと、\u003cruby>結局\u003crt>けっきょく\u003c/rt>\u003c/ruby>どれかを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しますよね。そこで、スリッパと「\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>する」ボタンを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>して、\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>は\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>の\u003cruby>一行\u003crt>いちぎょう\u003c/rt>\u003c/ruby>に\u003cruby>収\u003crt>おさ\u003c/rt>\u003c/ruby>めました。","zh":"做结果页时，我比较了左边突出件数和右边优先显示物品两案。只知道「有一件待确认」，还得继续找是哪件，所以先显示拖鞋和「确认」按钮，总数留在上方一行。"}]},{"id":"p35","title":"从选物品到记录整理结果","page":"P35","blocks":[{"type":"speech","ja":"ホームから\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>へたどると、\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づける\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、ロボットの\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れです。\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わった\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>は\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>み、\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>まった\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>や\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>かなかった\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>は、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめに\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>きます。","zh":"从主页向右，依次是选要整理的物品、看机器人的动作、确认结果。搬完的物品进入记录，中途停止或没收到结果的物品则由人去现场确认。"}]},{"id":"p36","title":"地图上可选和不可选的物品","page":"P36","blocks":[{"type":"speech","ja":"\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>を\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>はこの\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>です。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶと、\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>に「\u003cruby>布\u003crt>ぬの\u003c/rt>\u003c/ruby>\u003cruby>類\u003crt>るい\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>へ」と\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。\u003cruby>一方\u003crt>いっぽう\u003c/rt>\u003c/ruby>、この「？」は\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>の\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>か\u003cruby>判別\u003crt>はんべつ\u003c/rt>\u003c/ruby>できていないので、\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づける\u003cruby>対象\u003crt>たいしょう\u003c/rt>\u003c/ruby>には\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>べないようにしました。","zh":"逐步看操作，先从地图开始。选袜子以后，下面会显示「放到布类收纳处」。而问号表示没能辨认是什么，这种物品不能被选进整理任务。"}]},{"id":"p37","title":"收到指令和实际开始搬运的区别","page":"P37","blocks":[{"type":"speech","ja":"\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>から\u003cruby>指示\u003crt>しじ\u003c/rt>\u003c/ruby>を\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ると、まずロボットの\u003cruby>返事\u003crt>へんじ\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>ちます。「\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けた」という\u003cruby>返事\u003crt>へんじ\u003c/rt>\u003c/ruby>のあと、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>き\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めた\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせが\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いて、\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を「\u003cruby>実行\u003crt>じっこう\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>」に\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>替\u003crt>か\u003c/rt>\u003c/ruby>えます。","zh":"从地图发送指令后，界面先等待机器人回复。收到「已接收」以后，还要等实际开始动作的通知到了，才会切换成「执行中」。"}]},{"id":"p38","title":"中断和没收到结果是两种情况","page":"P38","blocks":[{"type":"speech","ja":"\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>は、スリッパを\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>まったと\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かっている\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>です。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>は\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いていないので、どこまで\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べたかはまだ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりません。","zh":"中间是已经知道拖鞋在搬运途中停下的情况。右边是结果通知没收到，所以还不知道拖鞋究竟搬到了哪里。"}]},{"id":"p39","title":"人去哪里找，找到后怎么记","page":"P39","blocks":[{"type":"speech","ja":"じゃあ、どこを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せばいいか。この\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>では、\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>していた\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にスリッパが\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つかったソファの\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>を\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>します。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたら、「\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>にあった」と\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>できます。あとから\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ても、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたことだと\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。","zh":"那该去哪里找？这里给出原定的鞋子收纳处，以及最初发现拖鞋的沙发前。人如果自己在预定位置找到，就能记录「在预定位置」，之后回看也知道这是本人确认的。"}]},{"id":"p40","title":"清扫和底座保养也放回日常使用里","page":"P40","blocks":[{"type":"speech","ja":"\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけ\u003cruby>以外\u003crt>いがい\u003c/rt>\u003c/ruby>には、\u003cruby>掃除\u003crt>そうじ\u003c/rt>\u003c/ruby>とドックのお\u003cruby>手入\u003crt>てい\u003c/rt>\u003c/ruby>れもあります。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、タンクの\u003cruby>水\u003crt>みず\u003c/rt>\u003c/ruby>は\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れ\u003cruby>替\u003crt>か\u003c/rt>\u003c/ruby>えるので、アプリでは\u003cruby>水\u003crt>みず\u003c/rt>\u003c/ruby>の\u003cruby>状態\u003crt>じょうたい\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できます。モップの\u003cruby>洗浄\u003crt>せんじょう\u003c/rt>\u003c/ruby>や\u003cruby>乾燥\u003crt>かんそう\u003c/rt>\u003c/ruby>は、ここから\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>められます。","zh":"整理小物之外，日常还有清扫和底座保养。比如水箱要由人加水、排水，所以 App 显示水箱状态。拖布清洗和烘干则可以在这里启动。"}]},{"id":"p41","title":"品牌符号也来自「把物品归位」","page":"P41","blocks":[{"type":"speech","ja":"ロゴの\u003cruby>横\u003crt>よこ\u003c/rt>\u003c/ruby>の\u003cruby>小\u003crt>ちい\u003c/rt>\u003c/ruby>さなマークも、\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づける\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きから\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っています。\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>の\u003cruby>枠\u003crt>わく\u003c/rt>\u003c/ruby>が\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>で、\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>のひし\u003cruby>形\u003crt>がた\u003c/rt>\u003c/ruby>が、そこに\u003cruby>収\u003crt>おさ\u003c/rt>\u003c/ruby>まる\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>です。","zh":"标志旁边的小符号也来自收纳动作。下面的框代表放置位置，中间的菱形代表归位的小物。"}]},{"id":"p42","title":"用可点击原型试暂停这一步","page":"P42","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に、\u003cruby>一時停止\u003crt>いちじていし\u003c/rt>\u003c/ruby>のところだけ、ブラウザーで\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>して\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>せるようにしました。\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>すと、いったんボタンが\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えなくなります。\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>したという\u003cruby>模擬\u003crt>もぎ\u003c/rt>\u003c/ruby>\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>くと、「\u003cruby>再開\u003crt>さいかい\u003c/rt>\u003c/ruby>する」に\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。\u003cruby>指示\u003crt>しじ\u003c/rt>\u003c/ruby>を\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>度\u003crt>ど\u003c/rt>\u003c/ruby>\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>らずに\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>むかを、この\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>替\u003crt>か\u003c/rt>\u003c/ruby>わりで\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめました。","zh":"最后，我把暂停这段做成了浏览器里可以点击的原型。按下后按钮先变成不可点，等收到模拟的停止通知，再切换为「继续」。我用这个切换过程确认等待期间不会重复发送同一个指令。"}]}]},{"id":"intro-reframe","label":"Reframe｜P43–55","items":[{"id":"p43","title":"Reframe 封面｜重做旧业务界面的工具提案","page":"P43","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>はReframeという、\u003cruby>古\u003crt>ふる\u003c/rt>\u003c/ruby>い\u003cruby>業務\u003crt>ぎょうむ\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>自社\u003crt>じしゃ\u003c/rt>\u003c/ruby>のUI\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>で\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すためのツール\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>にはFigmaを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いました。","zh":"接下来是 Reframe，一个用公司自己的 UI 组件重做旧业务界面的工具提案。用到的是 Figma。"}]},{"id":"p44","title":"为什么要成批处理","page":"P44","blocks":[{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>や\u003cruby>在庫\u003crt>ざいこ\u003c/rt>\u003c/ruby>を\u003cruby>管理\u003crt>かんり\u003c/rt>\u003c/ruby>する\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>なら\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>せても、\u003cruby>似\u003crt>に\u003c/rt>\u003c/ruby>た\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>が\u003cruby>百\u003crt>ひゃく\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>以上\u003crt>いじょう\u003c/rt>\u003c/ruby>あって、\u003cruby>少人数\u003crt>しょうにんずう\u003c/rt>\u003c/ruby>で\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>い\u003cruby>期間\u003crt>きかん\u003c/rt>\u003c/ruby>に\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すとなると、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>を\u003cruby>何度\u003crt>なんど\u003c/rt>\u003c/ruby>もすることになります。","zh":"比如订单管理和库存管理。一张可以手动重做，但如果小团队要在短时间内重做一百多张相似的界面，就会反复做同样的事。"}]},{"id":"p45","title":"先弄清元素的用途","page":"P45","blocks":[{"type":"speech","ja":"そこで、\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>から、まず\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いてあって、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>できるのかを\u003cruby>拾\u003crt>ひろ\u003c/rt>\u003c/ruby>います。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば「\u003cruby>承認待\u003crt>しょうにんま\u003c/rt>\u003c/ruby>ち」は\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>状態\u003crt>じょうたい\u003c/rt>\u003c/ruby>で、「\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>を\u003cruby>承認\u003crt>しょうにん\u003c/rt>\u003c/ruby>」は\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>すボタンですよね。この\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いを\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>して、\u003cruby>社内\u003crt>しゃない\u003c/rt>\u003c/ruby>の\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>を\u003cruby>当\u003crt>あ\u003c/rt>\u003c/ruby>てはめます。","zh":"所以先识别原界面上哪些是信息、哪些是操作。比如「等待审批」是现在的状态，「批准订单」才是能点的按钮。对应公司的组件时要保留这一区别。"}]},{"id":"p46","title":"从图片到可编辑稿","page":"P46","blocks":[{"type":"speech","ja":"\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>の\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>から\u003cruby>旧\u003crt>きゅう\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>んで、AIが\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>の\u003cruby>候補\u003crt>こうほ\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>します。それをデザイナーが\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめて、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>はFigmaで\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れられる\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にする、という\u003cruby>構想\u003crt>こうそう\u003c/rt>\u003c/ruby>です。","zh":"从左到右，先导入旧界面，由 AI 提出组件候选，再由设计师核对。这个方案设想最后能得到可以在 Figma 里继续编辑的设计稿。"}]},{"id":"p47","title":"已有组件怎么选","page":"P47","blocks":[{"type":"speech","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶところがこの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。\u003cruby>一覧\u003crt>いちらん\u003c/rt>\u003c/ruby>から\u003cruby>項目\u003crt>こうもく\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶと、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>に\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>役割\u003crt>やくわり\u003c/rt>\u003c/ruby>と、その\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>を\u003cruby>勧\u003crt>すす\u003c/rt>\u003c/ruby>める\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>や\u003cruby>余白\u003crt>よはく\u003c/rt>\u003c/ruby>も\u003cruby>社内\u003crt>しゃない\u003c/rt>\u003c/ruby>の\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>うか、ここで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てから\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>められます。","zh":"这页是实际选组件时看到的界面。点选一项，右边就会列出它原来的用途和候选组件的推荐理由，还可以核对颜色与间距是否符合公司规范，再决定是否采用。"}]},{"id":"p48","title":"现有库里找不到时","page":"P48","blocks":[{"type":"speech","ja":"で、ちょうどいい\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>が\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つからない\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>もあります。ここでは、\u003cruby>複数\u003crt>ふくすう\u003c/rt>\u003c/ruby>の\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>をまとめて\u003cruby>承認\u003crt>しょうにん\u003c/rt>\u003c/ruby>するバーが\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>です。\u003cruby>一件\u003crt>いっけん\u003c/rt>\u003c/ruby>も\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んでいないときは\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>せないか、\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>候補\u003crt>こうほ\u003c/rt>\u003c/ruby>を\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>せます。","zh":"有时也找不到合适的现成组件。这里的例子是一条批量审批栏，可以检查没选订单时按钮是否禁用、选中件数是否清楚，再调整候选方案。"}]},{"id":"p49","title":"一次更改可以影响哪些页","page":"P49","blocks":[{"type":"speech","ja":"\u003cruby>今度\u003crt>こんど\u003c/rt>\u003c/ruby>は、\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>をどこまでまとめて\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えるかです。\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>\u003cruby>一覧\u003crt>いちらん\u003c/rt>\u003c/ruby>と\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>の「\u003cruby>承認待\u003crt>しょうにんま\u003c/rt>\u003c/ruby>ち」はそろえたいんですが、\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>が\u003cruby>公開中\u003crt>こうかいちゅう\u003c/rt>\u003c/ruby>かどうかを\u003cruby>示\u003crt>しめ\u003c/rt>\u003c/ruby>すラベルまで\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わると\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>ります。そこで、\u003cruby>適用\u003crt>てきよう\u003c/rt>\u003c/ruby>する\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>対象\u003crt>たいしょう\u003c/rt>\u003c/ruby>から\u003cruby>外\u003crt>はず\u003c/rt>\u003c/ruby>せるようにしました。","zh":"接下来看同一改动应用到哪里。订单列表和详情里的「等待审批」要一致，但商品是否公开是另一回事，所以执行之前可以把那类页面排除。"}]},{"id":"p50","title":"批量处理后先看哪几页","page":"P50","blocks":[{"type":"speech","ja":"\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>むと、\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>がすんなり\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>むわけでもありません。このデモでは\u003cruby>160画面\u003crt>ひゃくろくじゅうがめん\u003c/rt>\u003c/ruby>のうち、\u003cruby>六\u003crt>むっ\u003c/rt>\u003c/ruby>つはデザイナーが\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>するもの、\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つは\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>みからやり\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すものとして\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けています。","zh":"批量导入后也会有不同结果。这份演示假设一共 160 个界面，其中 6 个要人工判断，2 个要重新读取。"}]},{"id":"p51","title":"例外页面里，具体要改哪一项","page":"P51","blocks":[{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、この\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>では「\u003cruby>承認待\u003crt>しょうにんま\u003c/rt>\u003c/ruby>ち」の\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>が\u003cruby>社内\u003crt>しゃない\u003c/rt>\u003c/ruby>のルールと\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っていません。\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>と\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べて、\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>の\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>だけ\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>び\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>せるようにしました。","zh":"比如这张订单详情里，「等待审批」的颜色不符合公司的规则。对照原界面后，可以单独重新选择颜色设置。"}]},{"id":"p52","title":"做好的前后对照","page":"P52","blocks":[{"type":"speech","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がデザインした\u003cruby>見本\u003crt>みほん\u003c/rt>\u003c/ruby>がこちらです。\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>と\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>で\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いています。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>た\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>は\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わっても、\u003cruby>合計\u003crt>ごうけい\u003c/rt>\u003c/ruby>はどちらも\u003cruby>24,800円\u003crt>にまんよんせんはっぴゃくえん\u003c/rt>\u003c/ruby>で、「\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>を\u003cruby>承認\u003crt>しょうにん\u003c/rt>\u003c/ruby>」という\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>も\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。","zh":"这是我实际做的设计示例。左右是同一笔订单，界面变了，总额还是 24,800 日元，「批准订单」这个操作也保留下来。"}]},{"id":"p53","title":"人检查得越久，结论越不同","page":"P53","blocks":[{"type":"speech","ja":"じゃあ、どれくらい\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>が\u003cruby>減\u003crt>へ\u003c/rt>\u003c/ruby>りそうか。デザイナーが\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>にかける\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えて\u003cruby>試算\u003crt>しさん\u003c/rt>\u003c/ruby>しました。\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>の\u003cruby>右端\u003crt>みぎはし\u003c/rt>\u003c/ruby>のように、\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>に\u003cruby>32分\u003crt>さんじゅうにふん\u003c/rt>\u003c/ruby>かかる\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>だと、\u003cruby>利用料\u003crt>りようりょう\u003c/rt>\u003c/ruby>まで\u003cruby>含\u003crt>ふく\u003c/rt>\u003c/ruby>めた\u003cruby>費用\u003crt>ひよう\u003c/rt>\u003c/ruby>は、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すほうが\u003cruby>安\u003crt>やす\u003c/rt>\u003c/ruby>くなります。","zh":"那它到底能省多少工？这里改变人工检查耗时做了试算。看右下角，假设每页要检查 32 分钟，算上工具费用，反而是手动重做更便宜。"}]},{"id":"p54","title":"下一步怎么验证","page":"P54","blocks":[{"type":"speech","ja":"この\u003cruby>試算\u003crt>しさん\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるなら、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を、\u003cruby>手作業\u003crt>てさぎょう\u003c/rt>\u003c/ruby>とツールを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方法\u003crt>ほうほう\u003c/rt>\u003c/ruby>の\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>で\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>します。\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>と\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>が\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>って、\u003cruby>社内\u003crt>しゃない\u003c/rt>\u003c/ruby>のルールにも\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>ったところを\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>として、そこまでの\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>と\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>を\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べたいです。","zh":"要验证试算，我想让两种方法重做相同的订单界面。两边都保留原信息与操作，也都符合公司的设计规则，然后比较做到这一步的耗时和修改件数。"}]},{"id":"p55","title":"项目自己的标志","page":"P55","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に、ツールのロゴも\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>共通\u003crt>きょうつう\u003c/rt>\u003c/ruby>のルールで\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>す\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じを、\u003cruby>幅\u003crt>はば\u003c/rt>\u003c/ruby>と\u003cruby>間隔\u003crt>かんかく\u003c/rt>\u003c/ruby>をそろえた\u003cruby>緑\u003crt>みどり\u003c/rt>\u003c/ruby>の\u003cruby>線\u003crt>せん\u003c/rt>\u003c/ruby>で\u003cruby>表\u003crt>あらわ\u003c/rt>\u003c/ruby>しています。","zh":"最后是给工具做的标志。绿色线条的宽度和间距都有规则，用来表现按统一规范重组界面的想法。"}]}]},{"id":"intro-around","label":"AROUND｜P56–67","items":[{"id":"p56","title":"AROUND 封面｜车外声音提醒","page":"P56","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>はAROUNDという、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>外\u003crt>そと\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>をシートの\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>と\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせる\u003cruby>車載\u003crt>しゃさい\u003c/rt>\u003c/ruby>システムの\u003cruby>提案\u003crt>ていあん\u003c/rt>\u003c/ruby>です。\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったツールはFigmaです。","zh":"接下来是 AROUND，一套通过座椅振动和屏幕提示，让驾驶员留意车外声音的车载系统提案。用到的工具是 Figma。"}]},{"id":"p57","title":"已有做法分别告诉驾驶员什么","page":"P57","blocks":[{"type":"speech","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つの\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>を\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べました。CarPlayはクラクションなどの\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>を、トヨタの\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>は\u003cruby>緊急\u003crt>きんきゅう\u003c/rt>\u003c/ruby>\u003cruby>車両\u003crt>しゃりょう\u003c/rt>\u003c/ruby>の\u003cruby>接近\u003crt>せっきん\u003c/rt>\u003c/ruby>を\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせます。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>のヒョンデでは、ウインカーを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すと\u003cruby>死角\u003crt>しかく\u003c/rt>\u003c/ruby>が\u003cruby>映\u003crt>うつ\u003c/rt>\u003c/ruby>ります。そこから、\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>に\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づいたあと、「どこからだろう」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったときに\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"我比较了三种做法。CarPlay 提示声音，丰田的例子提示紧急车辆接近，现代的例子会在打转向灯时显示盲区。接下来我想的是，驾驶员留意到声音、想知道从哪里来时，可以怎样自己确认。"}]},{"id":"p58","title":"提醒出现时，驾驶员正在做什么","page":"P58","blocks":[{"type":"speech","ja":"ただ、\u003cruby>車線\u003crt>しゃせん\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えようとしているときって、\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>や\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていますよね。そこで\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いたり、\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>を\u003cruby>閉\u003crt>と\u003c/rt>\u003c/ruby>じたりしなくても、\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>がしたと\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づけるようにしたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>と\u003cruby>音声\u003crt>おんせい\u003c/rt>\u003c/ruby>の\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>は、それぞれ\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>べます。","zh":"比如准备变道时，驾驶员的目光在前方和周围。我希望他不用点开画面或者关掉弹窗，也能留意到车外有声音。座椅振动和语音播报可以分别设置。"}]},{"id":"p59","title":"什么情况下才发出这次提醒","page":"P59","blocks":[{"type":"speech","ja":"\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせるかどうかは、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>か、\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りの\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>とどれくらい\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うか、それから、どのくらい\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かに\u003cruby>識別\u003crt>しきべつ\u003c/rt>\u003c/ruby>できたかで\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めます。\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>が\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>くときは、\u003cruby>一件\u003crt>いっけん\u003c/rt>\u003c/ruby>にまとめます。","zh":"要不要提醒，会结合声音类型、它和背景音的差异，以及识别的把握来判断。同一声音持续响时，就合成一条提醒。"}]},{"id":"p60","title":"座椅振动怎样传递方位","page":"P60","blocks":[{"type":"speech","ja":"\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>から\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>がしたなら、シートの\u003cruby>左側\u003crt>ひだりがわ\u003c/rt>\u003c/ruby>がトン、トンと\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>く\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>回\u003crt>かい\u003c/rt>\u003c/ruby>\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>します。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>なら\u003cruby>右側\u003crt>みぎがわ\u003c/rt>\u003c/ruby>です。\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>と\u003cruby>後\u003crt>うし\u003c/rt>\u003c/ruby>ろまで\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>のリズムにすると\u003cruby>覚\u003crt>おぼ\u003c/rt>\u003c/ruby>えることが\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えるので、\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>では\u003cruby>左右\u003crt>さゆう\u003c/rt>\u003c/ruby>だけを\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えます。","zh":"声音来自左边，座椅左侧就轻轻短震两次，右边则是右侧。为了不让驾驶员另记一套前后节奏，振动只传达左右。"}]},{"id":"p61","title":"三张图｜地图遮挡、方向已知、方向未知","page":"P61","blocks":[{"type":"speech","ja":"この\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つは、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じクラクションをどう\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せるかの\u003cruby>比較\u003crt>ひかく\u003c/rt>\u003c/ruby>です。\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>のように\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>に\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>ねると\u003cruby>経路\u003crt>けいろ\u003c/rt>\u003c/ruby>が\u003cruby>隠\u003crt>かく\u003c/rt>\u003c/ruby>れます。そこで\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>では、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>絵\u003crt>え\u003c/rt>\u003c/ruby>の\u003cruby>左後\u003crt>ひだりうし\u003c/rt>\u003c/ruby>ろに\u003cruby>波紋\u003crt>はもん\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>は\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からない\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>で、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>を\u003cruby>点線\u003crt>てんせん\u003c/rt>\u003c/ruby>で\u003cruby>囲\u003crt>かこ\u003c/rt>\u003c/ruby>むだけにしています。","zh":"这三张是在比较怎样显示同一声喇叭。左图直接叠在地图上，会挡住路线。中图就把波纹画在小车的左后方。右图是方向不明的情况，只用虚线圈住车身。"}]},{"id":"p62","title":"驾驶员要不要继续确认","page":"P62","blocks":[{"type":"speech","ja":"\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>だけで\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれば、ここで\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>は\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わりです。まだ\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になれば、「\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>、どっちから？」と\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>で\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けます。\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないときには、\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>は\u003cruby>捉\u003crt>とら\u003c/rt>\u003c/ruby>えたけれど\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>は\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からない、と\u003cruby>答\u003crt>こた\u003c/rt>\u003c/ruby>えます。","zh":"如果看提醒已经明白情况，就不用再操作了。还想知道方向的话，就开口问「刚才的声音从哪儿来？」判断不了时，系统会说检测到了声音，但方向不明。"}]},{"id":"p63","title":"停车后｜刚才的录音和现在的影像","page":"P63","blocks":[{"type":"speech","ja":"で、\u003cruby>安全\u003crt>あんぜん\u003c/rt>\u003c/ruby>な\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>に\u003cruby>停\u003crt>と\u003c/rt>\u003c/ruby>めると、\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめられることが\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えます。「もう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>かせて」で\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れるのはさっきの\u003cruby>録音\u003crt>ろくおん\u003c/rt>\u003c/ruby>です。\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けて「\u003cruby>後\u003crt>うし\u003c/rt>\u003c/ruby>ろも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せて」と\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>うと、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>後方\u003crt>こうほう\u003c/rt>\u003c/ruby>カメラの\u003cruby>映像\u003crt>えいぞう\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。","zh":"在安全的地方停车以后，可以确认得更仔细。「再放一次」播放的是刚才的录音，接着说「也给我看看后面」，看到的是此刻的后视摄像画面。"}]},{"id":"p64","title":"等系统回答时能看到什么","page":"P64","blocks":[{"type":"speech","ja":"\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>でやり\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りしていると、ちゃんと\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>き\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>れたかな、と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>う\u003cruby>間\u003crt>ま\u003c/rt>\u003c/ruby>があります。そこで、\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>き\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>、\u003cruby>答\u003crt>こた\u003c/rt>\u003c/ruby>えを\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>しているとき、\u003cruby>答\u003crt>こた\u003c/rt>\u003c/ruby>えているときで、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>光\u003crt>ひか\u003c/rt>\u003c/ruby>り\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えました。","zh":"语音交互中会有一小段等待，人会想「它听清了吗？」。所以系统正在听、正在准备回答和正在回答，这三种状态分别用了不同的光效。"}]},{"id":"p65","title":"结束这次确认以后","page":"P65","blocks":[{"type":"speech","ja":"「\u003cruby>閉\u003crt>と\u003c/rt>\u003c/ruby>じて」と\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>うと、\u003cruby>録音\u003crt>ろくおん\u003c/rt>\u003c/ruby>や\u003cruby>映像\u003crt>えいぞう\u003c/rt>\u003c/ruby>を\u003cruby>閉\u003crt>と\u003c/rt>\u003c/ruby>じて、\u003cruby>音楽\u003crt>おんがく\u003c/rt>\u003c/ruby>も\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>音量\u003crt>おんりょう\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>します。そのあとも\u003cruby>車外\u003crt>しゃがい\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>は\u003cruby>検知\u003crt>けんち\u003c/rt>\u003c/ruby>します。\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>の\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>安全\u003crt>あんぜん\u003c/rt>\u003c/ruby>\u003cruby>警報\u003crt>けいほう\u003c/rt>\u003c/ruby>が\u003cruby>鳴\u003crt>な\u003c/rt>\u003c/ruby>ったら、\u003cruby>会話\u003crt>かいわ\u003c/rt>\u003c/ruby>と\u003cruby>録音\u003crt>ろくおん\u003c/rt>\u003c/ruby>の\u003cruby>再生\u003crt>さいせい\u003c/rt>\u003c/ruby>はいったん\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>めます。","zh":"说「关闭」后结束回放和摄像显示，音乐恢复原音量，车外声音仍继续检测。若确认过程中车辆安全警报响起，会暂停对话和录音播放。"}]},{"id":"p66","title":"四张完成画面｜同一块屏幕如何分工","page":"P66","blocks":[{"type":"speech","ja":"\u003cruby>左上\u003crt>ひだりうえ\u003c/rt>\u003c/ruby>は\u003cruby>走行中\u003crt>そうこうちゅう\u003c/rt>\u003c/ruby>です。\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>き\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>った「\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>、どっちから？」という\u003cruby>質問\u003crt>しつもん\u003c/rt>\u003c/ruby>が\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>て、\u003cruby>返事\u003crt>へんじ\u003c/rt>\u003c/ruby>は\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>で\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けます。\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>の\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>は\u003cruby>駐車\u003crt>ちゅうしゃ\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>で、\u003cruby>警報\u003crt>けいほう\u003c/rt>\u003c/ruby>が\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>って\u003cruby>再生\u003crt>さいせい\u003c/rt>\u003c/ruby>が\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>まっても、\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>していたカメラの\u003cruby>映像\u003crt>えいぞう\u003c/rt>\u003c/ruby>は\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>ります。","zh":"看左上这张，驾驶员说的「刚才的声音从哪儿来？」显示在屏幕下方，回答则可以直接听。右下是停车后，即使警报打断了回放，正在查看的摄像画面仍然保留。"}]},{"id":"p67","title":"AROUND 展示｜车内效果","page":"P67","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は、AROUNDの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>車内\u003crt>しゃない\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いてみたイメージです。","zh":"最后是 AROUND 的界面放进车内的效果图。"}]}]},{"id":"intro-acrylic","label":"会动的亚克力作品集｜P68–76","items":[{"id":"p68","title":"书籍设计｜亚克力作品集封面","page":"P68","blocks":[{"type":"speech","ja":"ここからはブックデザインの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>です。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>は、\u003cruby>傾\u003crt>かたむ\u003c/rt>\u003c/ruby>けると\u003cruby>模様\u003crt>もよう\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わるアクリルの\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>をつけた\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>作品集\u003crt>さくひんしゅう\u003c/rt>\u003c/ruby>で、Illustratorを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い、\u003cruby>手作業\u003crt>てさぎょう\u003c/rt>\u003c/ruby>で\u003cruby>仕上\u003crt>しあ\u003c/rt>\u003c/ruby>げました。","zh":"接下来是书籍设计。第一本是我自己的作品集，倾斜书本时，亚克力封面的图案会变。制作时用了 Illustrator，最后手工完成。"}]},{"id":"p69","title":"为什么把动感放在封面","page":"P69","blocks":[{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>まで\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ることが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>くて、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ってめくる\u003cruby>感覚\u003crt>かんかく\u003c/rt>\u003c/ruby>は\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>したかったんです。そこに\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きも\u003cruby>加\u003crt>くわ\u003c/rt>\u003c/ruby>えるなら、\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>く\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>の\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>で\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>かできないかな、というのが\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>まりです。","zh":"我以前做了不少纸本，很想保留拿在手里翻阅的感觉。当时就想，要再加一点动感，能不能从还没翻开书的封面做起？"}]},{"id":"p70","title":"从零件开始做书","page":"P70","blocks":[{"type":"speech","ja":"それで、まず\u003cruby>金具\u003crt>かなぐ\u003c/rt>\u003c/ruby>やねじを\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>うところから\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めました。\u003cruby>実物\u003crt>じつぶつ\u003c/rt>\u003c/ruby>を\u003cruby>測\u003crt>はか\u003c/rt>\u003c/ruby>って\u003cruby>図面\u003crt>ずめん\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>いて、\u003cruby>加工\u003crt>かこう\u003c/rt>\u003c/ruby>\u003cruby>場\u003crt>じょう\u003c/rt>\u003c/ruby>で\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>板\u003crt>いた\u003c/rt>\u003c/ruby>を\u003cruby>切
