たいです。","zh":"用过，我网购下单时用过。觉得方便的是，换到另一家支持 PAY ID 的店，也可以直接用已经存好的地址。东西都挑好了，接着就能下单，这一步对我挺省事的。"}],"sources":[{"label":"PAY ID 官方｜结账时复用收货资料","url":"https://payid.jp/"}]},{"id":"answers-12","title":"「買う側として、どういう使い方が自分に合っていると思いますか。」","menuTitle":"我平常怎么挑唱片","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>として、どういう\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っていると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いますか。","zh":""},{"type":"note","ja":"","zh":"问你的购物习惯，从喜欢一家唱片店说到什么时候愿意再回来。如果刚讲过关注，直接说「そのお店の品ぞろえも気になるんです」。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>なら、\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなレコード\u003cruby>屋\u003crt>や\u003c/rt>\u003c/ruby>さんにどんなものが\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったかをのぞいて、その\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶ、という\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>ですね。レコードって、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>によって\u003cruby>品\u003crt>しな\u003c/rt>\u003c/ruby>ぞろえがかなり\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うんです。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>は\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>していた\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>がなくても、「このお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>仕入\u003crt>しい\u003c/rt>\u003c/ruby>れるんだろう」と\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になる。そうやってお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>ごとの\u003cruby>品\u003crt>しな\u003c/rt>\u003c/ruby>ぞろえを\u003cruby>楽\u003crt>たの\u003c/rt>\u003c/ruby>しみながら\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きです。","zh":"我喜欢看看常逛的几家唱片店最近进了什么，再从里面挑一张。唱片这东西，每家店的选品还真不一样。即使今天没碰上想找的那一张，我也会好奇「这家下次又会进什么呢？」逛的时候能看到每家店自己的眼光，这就是我喜欢的地方。"}],"sources":[{"label":"PAY ID 官方｜店铺上新与跨店下单","url":"https://payid.jp/"}]},{"id":"answers-13","title":"「お店の方にとっては、どう役に立つと思いましたか。」","menuTitle":"PAY ID 对店主的帮助","page":"","blocks":[{"type":"prompt","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にとっては、どう\u003cruby>役\u003crt>やく\u003c/rt>\u003c/ruby>に\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>つと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いましたか。","zh":""},{"type":"note","ja":"","zh":"换到店家的位置，讲一次店家确实用过的做法。"},{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にとっては、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しくいいものが\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったときに、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>ってくれた\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせられるのがいいなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。BASE Uで、PAY IDの\u003cruby>事業責任者\u003crt>じぎょうせきにんしゃ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>とショップオーナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、アプリの\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>している\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。あるお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>では\u003cruby>毎月\u003crt>まいつき\u003c/rt>\u003c/ruby>、\u003cruby>月末\u003crt>げつまつ\u003c/rt>\u003c/ruby>の\u003cruby>金曜日\u003crt>きんようび\u003c/rt>\u003c/ruby>が\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>で、その\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせてお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせを\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>っているそうです。いつも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てくれる\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に「\u003cruby>今月\u003crt>こんげつ\u003c/rt>\u003c/ruby>も\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>りましたよ」と\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけるような\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>なんだなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"我觉得对店家来说，好处是有好东西上新时，可以告诉那些本来就喜欢自己店的人。我在 BASE U 读到一篇 PAY ID 业务负责人和店主聊 App 用法的文章。有一家店每月月底的周五进货，就趁那一天给关注的人发个通知。听起来很像是跟常来的客人打声招呼，说「这个月的新货也到了」。"}],"sources":[{"label":"BASE U｜PAY ID 业务负责人与店主谈 App 的实际用法","url":"https://baseu.jp/51399"}]},{"id":"answers-14","title":"「気になったところや、こうなったらいいと思うことは？」","menuTitle":"我希望 PAY ID 改进的地方","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったところや、こうなったらいいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うことは？","zh":""},{"type":"note","ja":"","zh":"说你在意的一个瞬间，交代读到的买家经历与现有设置，再提一个小想法。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったのは、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をフォローするときに、どんなお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせがどのくらい\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るのかというところです。そらたさんという\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がnoteの\u003cruby>日記\u003crt>にっき\u003c/rt>\u003c/ruby>で、レコード\u003cruby>店\u003crt>てん\u003c/rt>\u003c/ruby>の\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>をまとめて\u003cruby>追\u003crt>お\u003c/rt>\u003c/ruby>えるのは\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だけど、\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>は\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>く\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じると\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていました。\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>ヘルプを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>むと、マイページで\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>の\u003cruby>種類\u003crt>しゅるい\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>べるんですね。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>だったら、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をフォローしたときに、あとからどこで\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えられるのかも\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるとうれしいです。","zh":"我有点在意的是，点关注一家店时，能不能大致知道会收到哪些消息、会有多频繁。我在 note 上读到一位叫そらた的买家写的日记，他觉得集中看唱片店上新挺方便，但也觉得通知多。我看了官方帮助，知道在「我的页面」里已经可以按类型开关通知了。换作我，在关注一家店的当下，如果也能看出来以后去哪里调整通知，就很方便。"}],"sources":[{"label":"そらた在 note 上的使用日记","url":"https://note.com/sorata_note_a/n/nf25a6d71c06f"},{"label":"现行通知帮助","url":"https://help.thebase.in/hc/ja/articles/115000107921"}]},{"id":"answers-15","title":"「今、会社を選ぶときに何を大事にしていますか。」","menuTitle":"选公司时看重什么","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶときに\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしていますか。","zh":""},{"type":"note","ja":"","zh":"说选择公司的判断标准，再说明实际工作中为什么需要这个条件。"},{"type":"speech","ja":"\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じサービスに\u003cruby>継続\u003crt>けいぞく\u003c/rt>\u003c/ruby>して\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>われるかを\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしています。\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>リリースしたものでも、しばらく\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらうと、\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っているときには\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づかなかったことが\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てくると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。そういうときに、\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったエンジニアの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>と「ここ、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しよくできそうですね」と\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>せるチームで\u003cruby>働\u003crt>はたら\u003c/rt>\u003c/ruby>きたいです。","zh":"我很看重能不能持续做同一个产品。东西做出来，大家用过一阵子，才会冒出一些当时没想到的事。我希望那时候还能找之前一起做它的工程师聊一句，「这里我们应该还能再改好一点」。我想在这样的团队工作。"}],"sources":[]},{"id":"answers-16","title":"「今後、選考に進むことは考えていますか。」","menuTitle":"已决定参加本选考","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今後\u003crt>こんご\u003c/rt>\u003c/ruby>、\u003cruby>選考\u003crt>せんこう\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>むことは\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていますか。","zh":""},{"type":"note","ja":"","zh":"直接说已经决定申请。如果对方只问意向，这一句就够。"},{"type":"speech","ja":"はい。\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>\u003cruby>選考\u003crt>せんこう\u003c/rt>\u003c/ruby>には、PAY IDのデザイナー\u003cruby>職\u003crt>しょく\u003c/rt>\u003c/ruby>で\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>します。","zh":"是的，我已经决定申请 PAY ID 设计师的本选考。"},{"type":"reply","ja":"はい、ぜひ。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>もまた、お\u003cruby>二人\u003crt>ふたり\u003c/rt>\u003c/ruby>とデザインのお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>ができたらうれしいです。","zh":"好啊，我也很期待以后还有机会和两位聊设计。","cue":"如果对方说「またお話しできるといいですね。」"}],"sources":[]},{"id":"answers-17","title":"已经说过会申请，想问报名的第一步","menuTitle":"确认本选考的下一步","page":"","blocks":[{"type":"note","ja":"","zh":"对方刚说明过报名方法，就照着说明接下去。"},{"type":"speech","ja":"\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>の\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きについても、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってよろしいでしょうか。このあとは、まず\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をすればいいでしょうか。","zh":"我也想顺便确认一下报名手续。接下来我应该先做什么呢？"}],"sources":[]},{"id":"answers-18","title":"「ほかにも、使っている方の話で印象に残ったものはありますか。」","menuTitle":"印象深的买家使用案例","page":"","blocks":[{"type":"prompt","ja":"ほかにも、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っている\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>で\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>ったものはありますか。","zh":""},{"type":"note","ja":"","zh":"对方想听别人的购物体验时再讲。刚才说的是你的购物习惯，这里说的是一位店主自己购物时的经历。"},{"type":"speech","ja":"はい。M’s homelifeという\u003cruby>器\u003crt>うつわ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>のブログで、\u003cruby>店主\u003crt>てんしゅ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、ご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>の\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>について\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていました。Instagramで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にBASEを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っているところが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>くて、PAY IDがあれば、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わっても\u003cruby>何度\u003crt>なんど\u003c/rt>\u003c/ruby>も\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れずに\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>むそうです。\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>回\u003crt>まわ\u003c/rt>\u003c/ruby>る\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>には、こういうところが\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>なんだなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"有。我在一家叫 M’s homelife 的餐具店博客里，读到店主写自己当买家的经历。她在 Instagram 发现的店有不少都用 BASE，有 PAY ID 以后，换店购物也省得反复填同样的信息。对于本来就喜欢逛不同店的人，这点很实在。"}],"sources":[{"label":"M’s homelife 店主以买家身份写的使用记录","url":"https://www.mshomelife.com/blog/2025/10/12/140904"}]},{"id":"answers-19","title":"「なぜ、デザインが好きなのですか。」","menuTitle":"为什么喜欢设计","page":"","blocks":[{"type":"prompt","ja":"なぜ、デザインが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなのですか。","zh":""},{"type":"note","ja":"","zh":"可以直接用 Goodpatch 小窗里已经熟悉的回答。问到设计本身，讲你的设计观就够了。"},{"type":"speech","ja":"そうですね。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がデザインを\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>いと\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じるのは、すでにあるものを\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>分解\u003crt>ぶんかい\u003c/rt>\u003c/ruby>して、\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせ\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すことで、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しい\u003cruby>価値\u003crt>かち\u003c/rt>\u003c/ruby>を\u003cruby>生\u003crt>う\u003c/rt>\u003c/ruby>み\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>せるところです。\u003cruby>世\u003crt>よ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>には、\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>がかかっても\u003cruby>避\u003crt>さ\u003c/rt>\u003c/ruby>けられないことや、\u003cruby>複雑\u003crt>ふくざつ\u003c/rt>\u003c/ruby>な\u003cruby>仕組\u003crt>しく\u003c/rt>\u003c/ruby>みがあります。そうしたものも、デザインによって\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しでも\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れやすく、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすい\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にできると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。\u003cruby>手順\u003crt>てじゅん\u003c/rt>\u003c/ruby>の\u003cruby>効率\u003crt>こうりつ\u003c/rt>\u003c/ruby>や、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うときの\u003cruby>気持\u003crt>きも\u003c/rt>\u003c/ruby>ちまで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるところに\u003cruby>魅力\u003crt>みりょく\u003c/rt>\u003c/ruby>を\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じています。","zh":"我觉得设计有意思，是因为可以把已有的东西拆开，再重新组合，从里面创造出新的价值。生活里有些事很麻烦，可我们总得去做，也有些东西本身就很复杂。我觉得，通过设计，可以让这些事变得容易接受一点，做起来也顺手一点。我喜欢的是，除了琢磨怎样让步骤更省事，还能顾及人在使用时是什么心情。"}],"sources":[]},{"id":"answers-20","title":"「うちのサービスで、そういう面白さを感じた例はありますか。」","menuTitle":"我喜欢的 BASE 设计案例","page":"","blocks":[{"type":"prompt","ja":"うちのサービスで、そういう\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>さを\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じた\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>はありますか。","zh":""},{"type":"note","ja":"","zh":"对方顺着平面到 UI 的话题，问你在 BASE 看到过什么时再说。这一例是店家用的 BASE 网店编辑器。"},{"type":"speech","ja":"\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんがCocodaに\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれた、BASEのショップ\u003cruby>編集\u003crt>へんしゅう\u003c/rt>\u003c/ruby>\u003cruby>機能\u003crt>きのう\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>が\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。\u003cruby>以前\u003crt>いぜん\u003c/rt>\u003c/ruby>は、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にバナーを\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>足\u003crt>た\u003c/rt>\u003c/ruby>すのにもHTMLを\u003cruby>編集\u003crt>へんしゅう\u003c/rt>\u003c/ruby>する\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>があったそうですね。それが、スマホでパーツを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>がご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>で\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えられるようになった。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は「バナーを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>る」ほうにはなじみがあるんですけど、「お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が、\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せたいときに\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せられるようにする」ところもデザインできるんだ、というのが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>かったです。","zh":"我印象很深的是，北村先生在 Cocoda 写的那篇 BASE 网店编辑器改版。以前店主想给自己店里加一张横幅，还得去改 HTML。改版以后，店主用手机选好组件，自己就能改。我熟悉的是「做一张横幅」，所以读到这儿觉得特别有意思。原来「让店主能在自己想放的时候亲手把它放上去」，也是设计师能做的事。"},{"type":"reply","ja":"そういうときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるんですね。ちょっと\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>したいところがあるたびにパソコンを\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>かなくていいのは、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にはありがたいですね。","zh":"原来那个时候就用得上。对店主来说，想改一个小地方时不用每次都打开电脑，确实方便。","cue":"如果对方接着说起店主什么时候会用手机改店铺"}],"sources":[{"label":"北村本人在 Cocoda 复盘 BASE 网店编辑器","url":"https://cocoda.design/naomikun/p/p43bdf1c41f2a"}]},{"id":"answers-21","title":"「日本語でのやり取りについては、どう感じていますか。」","menuTitle":"日语听说和日常沟通","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>でのやり\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りについては、どう\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じていますか。","zh":""},{"type":"note","ja":"","zh":"对方主动问到语言时用。如果刚刚问过外籍同事、聊过自己的情况，这段就已经答过了。"},{"type":"speech","ja":"\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>でお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>く\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>にはほとんど\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>らないんですけど、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えをその\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えようとすると、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>が\u003cruby>母語\u003crt>ぼご\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>ほどすっと\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てこないことがあるんです。もちろん、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>の\u003cruby>表現力\u003crt>ひょうげんりょく\u003c/rt>\u003c/ruby>はこれからも\u003cruby>磨\u003crt>みが\u003c/rt>\u003c/ruby>いていきますし、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>から\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りの\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけて、チームで\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>し\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>うときも、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>はまず\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えるようにしています。それでも\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>ったときは、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はAIや\u003cruby>翻訳\u003crt>ほんやく\u003c/rt>\u003c/ruby>ツールも\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるので、\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたいニュアンスに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>う\u003cruby>表現\u003crt>ひょうげん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>して、きちんと\u003cruby>相手\u003crt>あいて\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたいです。","zh":"平时听大家说日语，我基本没什么困难，不过要当场表达自己的想法，有些话确实没法像日语母语者那样一下子说出来。当然，我也会继续练好日语表达。平时我会主动找人交流，团队讨论时只要有想法，我就会先试着用自己的话说出来。如果还是拿不准怎么说，现在也有 AI 和翻译工具可以用，我会借助它们找个更贴近本意的说法，把意思好好传达给对方。"}],"sources":[]},{"id":"answers-22","title":"「チームでどんな強みを生かしたいですか。」","menuTitle":"我想在团队发挥的设计强项","page":"","blocks":[{"type":"prompt","ja":"チームでどんな\u003cruby>強\u003crt>つよ\u003c/rt>\u003c/ruby>みを\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>かしたいですか。","zh":""},{"type":"note","ja":"","zh":"如果刚聊过外籍同事时已经答到了，顺着对方的下一句聊。"},{"type":"speech","ja":"\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かいところにも\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>を\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けて、\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>を\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>しながら\u003cruby>筋道\u003crt>すじみち\u003c/rt>\u003c/ruby>を\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>てて\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるところが、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ち\u003cruby>味\u003crt>あじ\u003c/rt>\u003c/ruby>かなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っています。\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>課題\u003crt>かだい\u003c/rt>\u003c/ruby>があったときに、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>ち\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>って、そもそも\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>問題\u003crt>もんだい\u003c/rt>\u003c/ruby>なのかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなんです。\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>かと\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めたり、チームで\u003cruby>課題\u003crt>かだい\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>んだりするときに、その\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>を\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>かしたいです。","zh":"我觉得自己可能比较擅长留意细节，把信息理顺，再有条理地往下想。遇到课题的时候，我喜欢回到起点，先想清楚究竟是什么出了问题。以后和别人一起工作、在团队里解决课题的时候，我希望能把这份长处发挥出来。"}],"sources":[]},{"id":"answers-23","title":"「大学で、グループで何か作ったことはありますか。」","menuTitle":"小组制作时我负责什么","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>大学\u003crt>だいがく\u003c/rt>\u003c/ruby>で、グループで\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったことはありますか。","zh":""},{"type":"note","ja":"","zh":"先说一起做了什么、自己负责哪部分。等对方感兴趣再展开分工。"},{"type":"speech","ja":"はい。\u003cruby>大学\u003crt>だいがく\u003c/rt>\u003c/ruby>の\u003cruby>授業\u003crt>じゅぎょう\u003c/rt>\u003c/ruby>で、みんなで\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>の\u003cruby>雑誌\u003crt>ざっし\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったことがあります。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>はメンバーから\u003cruby>原稿\u003crt>げんこう\u003c/rt>\u003c/ruby>や\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>を\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>って、\u003cruby>誌面\u003crt>しめん\u003c/rt>\u003c/ruby>\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>のレイアウトを\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>しました。\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は\u003cruby>全員\u003crt>ぜんいん\u003c/rt>\u003c/ruby>で\u003cruby>校正\u003crt>こうせい\u003c/rt>\u003c/ruby>して、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>して\u003cruby>印刷\u003crt>いんさつ\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>した\u003cruby>雑誌\u003crt>ざっし\u003c/rt>\u003c/ruby>は、\u003cruby>授業\u003crt>じゅぎょう\u003c/rt>\u003c/ruby>の\u003cruby>優秀\u003crt>ゆうしゅう\u003c/rt>\u003c/ruby>\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>に\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ばれました。","zh":"有。大学有门课，我们小组一起做过一本杂志。组员把稿件和照片交给我，我负责整本杂志的版面。最后我们一起校对，由我改好后交印。做出来的杂志入选了这门课的优秀作品。"}],"sources":[]},{"id":"answers-24","title":"「一緒に進める中で、難しかったことはありましたか。」","menuTitle":"小组合作时遇到的困难","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>める\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>難\u003crt>むずか\u003c/rt>\u003c/ruby>しかったことはありましたか。","zh":""},{"type":"note","ja":"","zh":"承接杂志项目，说清自己为什么注意到分工问题。"},{"type":"speech","ja":"\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>を\u003cruby>何人\u003crt>なんにん\u003c/rt>\u003c/ruby>かで\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めていたり、\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>によって\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>み\u003cruby>具合\u003crt>ぐあい\u003c/rt>\u003c/ruby>に\u003cruby>差\u003crt>さ\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>たりしたんです。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>原稿\u003crt>げんこう\u003c/rt>\u003c/ruby>を\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ってページを\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>む\u003cruby>役\u003crt>やく\u003c/rt>\u003c/ruby>だったので、そこが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になって。「\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>、\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>なことに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>分担\u003crt>ぶんたん\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>しませんか」と\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけました。それで、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をいつまでに\u003cruby>用意\u003crt>ようい\u003c/rt>\u003c/ruby>するか、みんなで\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>め\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>しました。","zh":"做了一阵子，有的工作好几个人都在做，各部分的进度也不太一样。我负责拿到稿件后排版，所以留意到了这个问题。我就跟大家提议，「我们要不要按各自擅长的事情，再看一下怎么分工？」后来大家一起重新定了谁负责什么、什么时候交。"}],"sources":[]},{"id":"answers-25","title":"「もう一度やるとしたら、何か変えたいことはありますか。」","menuTitle":"再做一次会怎么改进分工","page":"","blocks":[{"type":"prompt","ja":"もう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>やるとしたら、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えたいことはありますか。","zh":""},{"type":"note","ja":"","zh":"如果对方对合作过程有兴趣，补一句回头看学到了什么。"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>だったら、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にそれぞれ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>か、どれくらい\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>き\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>けられそうかを\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いておきたいです。あとは、\u003cruby>仕上\u003crt>しあ\u003c/rt>\u003c/ruby>げに\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>る\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>、\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>のものをみんなで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ようと\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めておきます。そうすれば、\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>が\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>なっても\u003cruby>早\u003crt>はや\u003c/rt>\u003c/ruby>めに\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づけると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うので。","zh":"现在再做的话，我会先问大家各自擅长什么、大概能承担多少工作。还会提前约一次，在进入最后收尾之前，大家一起看看各自手头做到哪里了。这样就算有工作重叠，也能早点发现。"}],"sources":[]}]},{"id":"feedback","label":"听完反馈怎么接","items":[{"id":"feedback-1","title":"作品刚讲完、还没收到具体建议","menuTitle":"请对方给作品提建议","page":"","blocks":[{"type":"speech","ja":"\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>の\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>え\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>についても、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しご\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>をいただけたらうれしいです。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>で、どうしてそのデザインにしたのか、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたかったところはありますか。","zh":"关于我刚才讲作品的方式，也想听听您的意见。有没有哪一处，您想再多听一点我为什么这么设计？"},{"type":"reply","ja":"ありがとうございます。\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がどんな\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>にいるのか、\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>にひと\u003cruby>言\u003crt>こと\u003c/rt>\u003c/ruby>あると、そのあとの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>も\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>やすくなりますね。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>にお\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せするときは、そこから\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>してみます。","zh":"谢谢。先交代一句使用者当时遇到了什么事，后面的界面就好理解多了。下次介绍时，我想从那里讲起。","cue":"如果对方建议先讲谁会在什么情况下用"},{"type":"reply","ja":"ありがとうございます。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>ではどのページが\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>るか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないので、そう\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>っていただけてうれしいです。","zh":"谢谢。我自己其实很难判断哪一页会给人留下印象，听您专门提到这一页，我很开心。","cue":"如果对方特意指出某一页讲得好"}],"sources":[]},{"id":"feedback-2","title":"比如，对方说TUCK的场景讲得太快","menuTitle":"听到场景讲得太快","page":"","blocks":[{"type":"speech","ja":"ありがとうございます。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んだところを、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しゆっくりお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しするとよさそうですね。そうすると、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>だけが\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たときに、なぜスリッパのほうを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>したのかも\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりそうです。","zh":"谢谢。我可以把一开始袜子和拖鞋两样都交给机器人的那段，稍微讲慢一点。这样后面只收到袜子的通知时，为什么要把拖鞋放在前面，听起来应该也更容易理解。"}],"sources":[]},{"id":"feedback-3","title":"如果对方建议多讲设计过程，想请对方举一处","menuTitle":"想请对方举一处具体建议","page":"","blocks":[{"type":"speech","ja":"ありがとうございます。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、テーマを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>経緯\u003crt>けいい\u003c/rt>\u003c/ruby>と、\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>だと、どちらをもう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいですか。","zh":"谢谢。比如一开始怎么选定这个主题，以及后来为什么从两种界面方案里选了这一版，这两部分，您更想多听哪一块？"},{"type":"reply","ja":"お\u003cruby>二人\u003crt>ふたり\u003c/rt>\u003c/ruby>とも、\u003cruby>丁寧\u003crt>ていねい\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てくださってありがとうございます。いただいたアドバイスをもとに、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>にお\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せするときの\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>を\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>してみます。","zh":"谢谢两位这么认真地看我的作品。我想按刚才的建议，再顺一遍下次介绍时怎么讲。","cue":"如果两位都给了具体建议"}],"sources":[]}]}],"links":[{"id":"answers-1","label":"今日はどんなことを聞いてみたいですか。"},{"id":"answers-2","label":"どうしてUI/UXを始めたんですか。"},{"id":"answers-3","label":"BASEに興味を持ったきっかけは何ですか。"},{"id":"answers-4","label":"BASEのどこに魅力を感じましたか。"},{"id":"answers-5","label":"PAY IDを使ってみて、どんなところがよかったですか。"},{"id":"answers-6","label":"UI/UXでは、今どんなことに興味がありますか。"},{"id":"answers-7","label":"どんな仕事に関わってみたいですか。"},{"id":"answers-8","label":"買い物のあとの、どんなところが気になりますか。"},{"id":"answers-9","label":"大学院では、何を研究しているんですか。"},{"id":"answers-10","label":"学生時代に力を入れたことは何ですか。"},{"id":"answers-11","label":"PAY IDは使ったことがありますか。"},{"id":"answers-12","label":"買う側として、どういう使い方が自分に合っていると思いますか。"},{"id":"answers-13","label":"お店の方にとっては、どう役に立つと思いましたか。"},{"id":"answers-14","label":"気になったところや、こうなったらいいと思うことは？"},{"id":"answers-15","label":"今、会社を選ぶときに何を大事にしていますか。"},{"id":"answers-16","label":"今後、選考に進むことは考えていますか。"},{"id":"answers-18","label":"ほかにも、使っている方の話で印象に残ったものはありますか。"},{"id":"answers-19","label":"なぜ、デザインが好きなのですか。"},{"id":"answers-20","label":"うちのサービスで、そういう面白さを感じた例はありますか。"},{"id":"answers-21","label":"日本語でのやり取りについては、どう感じていますか。"},{"id":"answers-22","label":"チームでどんな強みを生かしたいですか。"},{"id":"answers-23","label":"大学で、グループで何か作ったことはありますか。"},{"id":"answers-24","label":"一緒に進める中で、難しかったことはありましたか。"},{"id":"answers-25","label":"もう一度やるとしたら、何か変えたいことはありますか。"}]},{"id":"reverse","label":"逆質問","kind":"reverse","groups":[{"id":"company-talk","label":"逆質問","items":[{"id":"q28","title":"平常一周里，大家会一起做哪些事","menuTitle":"平常一周里，大家会一起做哪些事","page":"","blocks":[{"type":"speech","ja":"\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんがnoteに\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれたPAY IDのチーム\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>で、デザインをみんなで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>める、というお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>の\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>週間\u003crt>しゅうかん\u003c/rt>\u003c/ruby>だと、どんなときに\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>まって、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ているのか、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいです。","zh":"我读了北村先生在 note 上写的 PAY ID 团队介绍，里面提到设计是大家一起商量、一起定的。想请教一下，平常一周里，大家一般什么时候会聚在一起？到时候会一起看些什么？"},{"type":"reply","ja":"\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りかけでも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せ\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>えるのはいいですね。まだ\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>っているところをそのまま\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>できると、ほかの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>がどう\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えているかも\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けそうです。","zh":"没做完也能拿出来交流，真好。自己还拿不准的地方就能直接拿来商量，也能听听同事是怎么想的。","cue":"如果聊到大家会带上各自做到一半的东西一起看"}],"sources":[{"label":"北村的 note｜PAY ID 设计团队介绍","url":"https://note.com/naomi_kun/n/n371a828258d9"}],"followups":[{"cue":"如果对方具体介绍了会上怎样一起看设计、交换意见","ja":"\u003cruby>打\u003crt>う\u003c/rt>\u003c/ruby>ち\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせでどんなふうに\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>を\u003cruby>交\u003crt>か\u003c/rt>\u003c/ruby>わすのかまで\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えてくださって、ありがとうございます。\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>で\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>するときに、どんな\u003cruby>練習\u003crt>れんしゅう\u003c/rt>\u003c/ruby>をしておくとよさそうか、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えてきました。","zh":"谢谢您讲到大家在会上具体怎么交换意见。我对怎样提前练习用日语说明自己的方案，也有点头绪了。"}],"reverse":"28","audience":""},{"id":"q24","title":"新人发现可以改的小地方，怎么跟团队聊","menuTitle":"新人发现可以改的小地方，怎么跟团队聊","page":"","blocks":[{"type":"speech","ja":"\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんがnoteに\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれたPAY IDのデザインチームの\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>で、\u003cruby>皆\u003crt>みな\u003c/rt>\u003c/ruby>さんもご\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>でサービスを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>って、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づいたことをメモされていたと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったばかりの\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っていて\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づいたときは、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>どうやってチームに\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えているんでしょうか。","zh":"我读了北村先生在个人 note 上写的 PAY ID 设计团队介绍，里面说，团队成员自己用服务时也会把留意到的地方记下来。我想请教一下，刚进公司的人在使用产品时有什么发现，一般会怎么跟团队提起来呢？"},{"type":"reply","ja":"\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>触\u003crt>さわ\u003c/rt>\u003c/ruby>りながら\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>せるなら、まだ\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えがまとまっていなくても\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>しやすそうです。","zh":"如果能边试边聊，就算自己的想法还没完全成形，也比较容易开口。","cue":"如果聊到会先请提出想法的人演示一下当时是怎么用的"}],"sources":[{"label":"北村的 note｜PAY ID 设计团队介绍","url":"https://note.com/naomi_kun/n/n371a828258d9"}],"followups":[{"cue":"如果对方说有个想法试过了，但后来决定暂时不加","ja":"\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>した\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ただけでは、そこまで\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>されたことって\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないですね。\u003cruby>見送\u003crt>みおく\u003c/rt>\u003c/ruby>った\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>のことまで\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>かせてくださって、ありがとうございます。","zh":"光看最后的界面，真的看不出你们已经试到了这一步。谢谢您连后来决定暂时不做的方案也讲给我听。"}],"reverse":"24","audience":""},{"id":"q35","title":"新人怎么认识其他团队的同事","menuTitle":"新人怎么认识其他团队的同事","page":"","blocks":[{"type":"speech","ja":"BASE Bookで、\u003cruby>成原\u003crt>なりはら\u003c/rt>\u003c/ruby>さんがPAY.JPのチームにインタビューされた\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>どれくらいオフィスで\u003cruby>顔\u003crt>かお\u003c/rt>\u003c/ruby>を\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせるか、というお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>があって、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>のBASEではどうなのかなと\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったんです。\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しく\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、ほかのチームの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>とも\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>り\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>うきっかけって、どんなところにありますか。","zh":"我在 BASE Book 读了成原女士采访 PAY.JP 团队的文章，里面聊到大家平时有多少机会在办公室碰面。我就挺好奇，现在在 BASE，刚进公司的人通常是借着什么机会认识其他团队的同事的呢？"},{"type":"reply","ja":"\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>が\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>してくださるんですね。\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>顔\u003crt>かお\u003c/rt>\u003c/ruby>を\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせていると、あとで\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をするときも、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>から\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけやすそうです。","zh":"原来前辈会帮忙介绍。提前见过一面，以后有机会一起做事，感觉自己也更容易主动上前打招呼。","cue":"如果聊到一起工作的前辈会帮忙介绍"}],"sources":[{"label":"BASE Book｜成原采访 PAY.JP 业务团队的工作日常","url":"https://basebook.binc.jp/entry/2023/09/27/125516"}],"followups":[],"reverse":"35","audience":""},{"id":"q15","title":"团队日常工作里怎么用 AI","menuTitle":"团队日常工作里怎么用 AI","page":"","blocks":[{"type":"speech","ja":"AIの\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>についてもちょっと\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいんですが、BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>した\u003cruby>際\u003crt>さい\u003c/rt>\u003c/ruby>に、\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんと\u003cruby>宮地\u003crt>みやじ\u003c/rt>\u003c/ruby>さんがAIで\u003cruby>試作品\u003crt>しさくひん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>って、\u003cruby>開発\u003crt>かいはつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>と\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>のお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>最近\u003crt>さいきん\u003c/rt>\u003c/ruby>「こういうときにAIを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うと\u003cruby>助\u003crt>たす\u003c/rt>\u003c/ruby>かるな」と\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じた\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>があれば、ぜひ\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えてください。","zh":"我也想请教一下平时用 AI 的情况。BASE 集团官方 note 上有一篇 PAY ID 商品搜索改版访谈，里面说北村先生和宫地先生用 AI 做了原型，拿给开发同事一起看。最近大家工作时，有没有哪一次特别觉得「这件事有 AI 帮忙真方便」？我很想听听。"},{"type":"reply","ja":"\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きを\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>せる\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にしておくと、\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せながら\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>せますね。ちなみに、そういう\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>にはどのツールやモデルをよく\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>われるんでしょうか。","zh":"原来会先做成能试操作的样子，这样讨论时就有东西可以演示了。顺便想请教一下，做这类原型时，大家比较常用哪种工具或模型呢？","cue":"如果聊到用 AI 做原型、试界面，还没提工具名"}],"sources":[{"label":"BASE 集团官方 note｜PAY ID 搜索改版三人访谈","url":"https://note.com/base_group/n/n39a643caaa7d"}],"followups":[{"cue":"如果举的是整理访谈或推敲文案的例子","ja":"\u003cruby>文章\u003crt>ぶんしょう\u003c/rt>\u003c/ruby>を\u003cruby>扱\u003crt>あつか\u003c/rt>\u003c/ruby>うときにも\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>われているんですね。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>のお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>だと、どのあたりで\u003cruby>特\u003crt>とく\u003c/rt>\u003c/ruby>に\u003cruby>役\u003crt>やく\u003c/rt>\u003c/ruby>に\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>ちましたか。","zh":"原来处理文字的时候也会用。刚才说的那次，您觉得它在哪个地方特别帮得上忙呢？"},{"cue":"如果提了几种工具或模型，还没讲为什么选","ja":"いろいろあるんですね。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>お\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しくださった\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>だと、どれが\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすかったか、\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>も\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってみたいです。","zh":"原来有好几种。就刚才说的那项工作而言，您觉得哪一种用起来最顺手？我也挺想听听原因。"},{"cue":"如果平时很少用，或不便谈工具，回到团队怎么工作","ja":"ありがとうございます。では、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>の\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>め\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>についても\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し。まだ\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えがまとまりきっていない\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>かに\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらいたいときって、どんなふうに\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけるんでしょうか。","zh":"谢谢。那我也想了解一下平时怎么一起做事。一个想法还没完全成形，想先请同事看一眼的时候，大家一般会怎么开口？"}],"reverse":"15","audience":""},{"id":"q25","title":"新人头半年希望练会什么","menuTitle":"新人头半年希望练会什么","page":"","blocks":[{"type":"speech","ja":"PAY IDの\u003cruby>新卒\u003crt>しんそつ\u003c/rt>\u003c/ruby>デザイナーの\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページで、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>と\u003cruby>小\u003crt>ちい\u003c/rt>\u003c/ruby>さな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めると\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。そこから\u003cruby>半年\u003crt>はんとし\u003c/rt>\u003c/ruby>くらいたった\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>に、「これができるようになると\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>もしいな」と\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じるのは、どんなことでしょうか。","zh":"我在 PAY ID 的新卒设计师招聘页上看到，刚入职会跟前辈从小任务做起。从那时候再往后看半年，要是新人能自己做好哪件事，团队会觉得「这下可以放心交给他了」？"},{"type":"reply","ja":"まず\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>って\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>する、ということですね。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>でも\u003cruby>意識\u003crt>いしき\u003c/rt>\u003c/ruby>してみます。","zh":"先想出一个自己的方案，再去找人商量。这一点，我现在做设计时就可以试着练习。","cue":"如果聊到希望新人带着自己的想法来商量"}],"sources":[{"label":"PAY ID 28 卒设计师招聘页","url":"https://open.talentio.com/r/1/c/binc/pages/128919"}],"followups":[{"cue":"如果对方具体讲了新人先自己试、做到一半再和团队一起看","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>える\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>があって、\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で\u003cruby>皆\u003crt>みな\u003c/rt>\u003c/ruby>さんに\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらえるんですね。\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をどう\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めていくのか、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>のお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>で\u003cruby>想像\u003crt>そうぞう\u003c/rt>\u003c/ruby>しやすくなりました。","zh":"原来会先留时间让新人自己想，做到一半再拿给大家看。听您这么讲，我更能想象一项工作是怎么往下做的了。"}],"reverse":"25","audience":""},{"id":"q34","title":"BASE 社内也有外籍同事吗","menuTitle":"BASE 社内也有外籍同事吗","page":"","blocks":[{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>も\u003cruby>留学生\u003crt>りゅうがくせい\u003c/rt>\u003c/ruby>なので、\u003cruby>働\u003crt>はたら\u003c/rt>\u003c/ruby>く\u003cruby>環境\u003crt>かんきょう\u003c/rt>\u003c/ruby>について\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいんですが、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、BASEには\u003cruby>外国籍\u003crt>がいこくせき\u003c/rt>\u003c/ruby>の\u003cruby>社員\u003crt>しゃいん\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>もいらっしゃるんでしょうか。","zh":"我自己也是留学生，所以想请教一个关于工作环境的问题。请问现在 BASE 也有外籍同事吗？"},{"type":"reply","ja":"そうなんですね、ありがとうございます。","zh":"原来是这样，谢谢。","cue":"听完对方的回答，先接一句"}],"sources":[{"label":"BASE 集团官网｜社会・DE&I 的人事制度","url":"https://binc.jp/esg/esg-social"}],"followups":[{"cue":"听对方说完，再讲自己平时怎么沟通","ja":"\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>でお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>く\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>にはほとんど\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>らないんですけど、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えをその\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えようとすると、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>が\u003cruby>母語\u003crt>ぼご\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>ほどすっと\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てこないことがあるんです。だからこそ、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>の\u003cruby>勉強\u003crt>べんきょう\u003c/rt>\u003c/ruby>を\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けながら、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>は\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>から\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りの\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけていますし、チームで\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>し\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>うときも、\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>があればまず\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>で\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>すようにしています。それでも\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>ったときは、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はAIや\u003cruby>翻訳\u003crt>ほんやく\u003c/rt>\u003c/ruby>ツールも\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるので、\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたいニュアンスに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>う\u003cruby>表現\u003crt>ひょうげん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>して、きちんと\u003cruby>相手\u003crt>あいて\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたいです。","zh":"平时听大家说日语，我基本没什么困难，不过要当场表达自己的想法，有些话确实没法像日语母语者那样一下子说出来。正因为这样，我一直在学日语，平时也会主动找人交流，团队讨论时只要有想法，我就会先试着用自己的话说出来。如果还是拿不准怎么说，现在也有 AI 和翻译工具可以用，我会借助它们找个更贴近本意的说法，把意思好好传达给对方。"},{"cue":"接着说自己能为团队带来什么","ja":"もちろん、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>の\u003cruby>表現力\u003crt>ひょうげんりょく\u003c/rt>\u003c/ruby>もこれから\u003cruby>磨\u003crt>みが\u003c/rt>\u003c/ruby>いていきますし、まだ\u003cruby>足\u003crt>た\u003c/rt>\u003c/ruby>りないところがある\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>、\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>では\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ち\u003cruby>味\u003crt>あじ\u003c/rt>\u003c/ruby>をしっかり\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>かして、チームの\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>になりたいんです。\u003cruby>国籍\u003crt>こくせき\u003c/rt>\u003c/ruby>や\u003cruby>母語\u003crt>ぼご\u003c/rt>\u003c/ruby>に\u003cruby>関係\u003crt>かんけい\u003c/rt>\u003c/ruby>なく、\u003cruby>私自身\u003crt>わたしじしん\u003c/rt>\u003c/ruby>の\u003cruby>強\u003crt>つよ\u003c/rt>\u003c/ruby>みは、\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かいところにも\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>を\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けて、\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>を\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>しながら\u003cruby>筋道\u003crt>すじみち\u003c/rt>\u003c/ruby>を\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>てて\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるところかなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っていて、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>かと\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めたり、チームで\u003cruby>課題\u003crt>かだい\u003c/rt>\u003c/ruby>の\u003cruby>解決\u003crt>かいけつ\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>んだりする\u003cruby>機会\u003crt>きかい\u003c/rt>\u003c/ruby>があれば、その\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>をしっかり\u003cruby>発揮\u003crt>はっき\u003c/rt>\u003c/ruby>したいです。","zh":"当然，我也会继续练习自己的日语表达。正因为我知道自己在这方面还有差距，我更想在工作中发挥自己的长处，给团队带来实实在在的帮助。抛开国籍和母语，我觉得自己比较擅长的是留意细节，把信息理清楚，再有条理地思考问题。以后如果有机会和别人一起工作、在团队里一起解决问题，我想把这份长处充分发挥出来。"}],"reverse":"34","audience":""},{"id":"q23","title":"从哪些小事能感受到 BASE 的工作氛围","menuTitle":"从哪些小事能感受到 BASE 的工作氛围","page":"","blocks":[{"type":"speech","ja":"BASE Bookで、\u003cruby>成原\u003crt>なりはら\u003c/rt>\u003c/ruby>さんが\u003cruby>経営\u003crt>けいえい\u003c/rt>\u003c/ruby>\u003cruby>戦略\u003crt>せんりゃく\u003c/rt>\u003c/ruby>\u003cruby>室\u003crt>しつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>に「We are All Owners」という\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>の\u003cruby>由来\u003crt>ゆらい\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>かれた\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>のお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>で「あ、こういうところがBASEらしいな」と\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じたことがあれば、ちょっと\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいです。","zh":"我在 BASE Book 读到，成原女士采访经营战略室的同事，聊的是「We are All Owners」这句话怎么来的。我挺想听听，在日常工作里，有没有哪一件小事，让人觉得「嗯，这还挺像 BASE 的」？"},{"type":"reply","ja":"まずご\u003cruby>本人\u003crt>ほんにん\u003c/rt>\u003c/ruby>に「どうしたいですか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>くんですね。そういう\u003cruby>一言\u003crt>ひとこと\u003c/rt>\u003c/ruby>にも、チームの\u003cruby>雰囲気\u003crt>ふんいき\u003c/rt>\u003c/ruby>って\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>るんですね。","zh":"原来大家会先问那个人「你自己想怎么做」。这么一句平常的话，也能让人感受到团队的氛围。","cue":"如果聊到同事会先听当事人自己想怎么做"}],"sources":[{"label":"BASE Book｜成原采访经营战略室，谈 We are All Owners 的由来","url":"https://basebook.binc.jp/entry/2023/05/25/182347"}],"followups":[],"reverse":"23","audience":""},{"id":"q13","title":"平时从哪里听到买家自己的说法","menuTitle":"平时从哪里听到买家自己的说法","page":"","blocks":[{"type":"speech","ja":"BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteでPAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>した\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んで、\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>だけで\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>したい、という\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>もいたのが\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>りました。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>のこういう\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>って、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>はどういう\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>でチームに\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>くんでしょうか。","zh":"我在 BASE 集团官方 note 读了 PAY ID 商品搜索改版的文章。里面说，有些买家只想在自己喜欢的那家店里找，我对这点印象挺深的。像这样的想法，平时是怎么传到团队这里的呢？"},{"type":"reply","ja":"\u003cruby>直接\u003crt>ちょくせつ\u003c/rt>\u003c/ruby>お\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けるんですね。\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったばかりのデザイナーにも、そういう\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>に\u003cruby>同席\u003crt>どうせき\u003c/rt>\u003c/ruby>する\u003cruby>機会\u003crt>きかい\u003c/rt>\u003c/ruby>はありますか。","zh":"原来可以直接听买家自己讲。刚入职的设计师也有机会坐在旁边听吗？","cue":"如果聊到会直接和买家谈，而且还没说新人能否参加"}],"sources":[{"label":"BASE 集团官方 note｜PAY ID 搜索改版三人访谈","url":"https://note.com/base_group/n/n39a643caaa7d"}],"followups":[{"cue":"如果对方聊到有些买家就是想在喜欢的那家店里继续找","ja":"\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ている\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>なら、そのまま\u003cruby>店内\u003crt>てんない\u003c/rt>\u003c/ruby>で\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せるとうれしいですよね。\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しているかだけでなくて、どこで\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>したいかも\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>なんですね。","zh":"如果正在逛一家喜欢的店，当然会希望能接着在店里找。我现在更明白了，除了想找什么，想在哪里找也很重要。"}],"reverse":"13","audience":""},{"id":"q22","title":"学平面的经验，在团队里哪里用得上","menuTitle":"学平面的经验，在团队里哪里用得上","page":"","blocks":[{"type":"speech","ja":"BASE Bookのデザインチームのインタビューで、\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんは\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>でDTPや\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>を\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>されてから、UIの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>に\u003cruby>移\u003crt>うつ\u003c/rt>\u003c/ruby>られたと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>も\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>ではグラフィックを\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>んだので、チームの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、そういう\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>が\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>きる\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>があれば\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってみたいです。","zh":"我在 BASE Book 的设计团队访谈里读到，北村先生先在制作公司做 DTP 和企划，后来转做 UI。我本科也是学平面的，所以挺想了解，平面的经验在团队工作中，有哪些时候特别用得上？"},{"type":"reply","ja":"\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>か\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べてから\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるんですね。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>る\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>でも、アイデアを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すところはつながっているんですね。","zh":"原来会先把几个想法画在纸上，摆在一起看。即使做的是屏幕上的东西，最开始想方案的办法还是能沿用。","cue":"如果有人提到以前会先在纸上画几种草案，如今也这样开头"}],"sources":[{"label":"BASE Book｜2019 年设计团队成员访谈","url":"https://basebook.binc.jp/entry/2019/05/28/110000"}],"followups":[{"cue":"如果对方聊起自己从平面转做 UI 时的摸索","ja":"UIのお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めた\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>のお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>まで\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けて、うれしいです。\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>でご\u003cruby>経歴\u003crt>けいれき\u003c/rt>\u003c/ruby>を\u003cruby>拝見\u003crt>はいけん\u003c/rt>\u003c/ruby>して、その\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>のことを\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってみたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っていたんです。","zh":"能听您聊刚开始做 UI 时的经历，我很高兴。我在文章里读到过您的经历，当时就挺想了解那段时间的事。"}],"reverse":"22","audience":""},{"id":"q27","title":"当面聊时最想让学生知道什么","menuTitle":"当面聊时最想让学生知道什么","page":"","blocks":[{"type":"speech","ja":"BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで\u003cruby>新卒採用\u003crt>しんそつさいよう\u003c/rt>\u003c/ruby>の\u003cruby>座談会\u003crt>ざだんかい\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>学生\u003crt>がくせい\u003c/rt>\u003c/ruby>がよく\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べて\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るからこそ、\u003cruby>会\u003crt>あ\u003c/rt>\u003c/ruby>ったときに\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>から\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>える、という\u003cruby>成原\u003crt>なりはら\u003c/rt>\u003c/ruby>さんのお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>が\u003cruby>心\u003crt>こころ\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>みたいに\u003cruby>直接\u003crt>ちょくせつ\u003c/rt>\u003c/ruby>お\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しする\u003cruby>機会\u003crt>きかい\u003c/rt>\u003c/ruby>だからこそ、\u003cruby>学生\u003crt>がくせい\u003c/rt>\u003c/ruby>に\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>ってもらえたらと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うことはありますか。","zh":"我在 BASE 集团官方 note 读了新卒招聘座谈。成原女士说，学生来之前已经查过很多资料，所以公司也会想，见了面要聊什么。这句话我一直记得。像今天这样能直接聊天，有什么是你们尤其希望学生了解的吗？"},{"type":"reply","ja":"\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>と\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>められるのは\u003cruby>心強\u003crt>こころづよ\u003c/rt>\u003c/ruby>いです。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>だと、\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>と\u003cruby>役割\u003crt>やくわり\u003c/rt>\u003c/ruby>をどう\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めるのか、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってもいいでしょうか。","zh":"能跟前辈一起做，确实让人安心。我想再多了解一点，新人接到第一项工作时，一般会怎么跟前辈分工、一起往下做呢？","cue":"如果谈到新人会和前辈一起做任务"}],"sources":[{"label":"BASE 集团官方 note｜成原等人谈新卒招聘","url":"https://note.com/base_group/n/ncf1502e8af6e"}],"followups":[{"cue":"如果对方提到新人第一次参加团队讨论时会有前辈同行","ja":"\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>打\u003crt>う\u003c/rt>\u003c/ruby>ち\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせに\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>るときは、\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>も\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>なんですね。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>はそばでやり\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りを\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けると、どんなふうに\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>に\u003cruby>加\u003crt>くわ\u003c/rt>\u003c/ruby>わればいいかもつかみやすそうです。","zh":"原来新人第一次参加讨论时会有前辈一起。能先在旁边听听大家是怎么交流的，之后自己怎样参与进去，也会比较有头绪。"},{"cue":"如果聊到招聘团队为什么特意留时间让学生直接和设计师说话","ja":"\u003cruby>学生\u003crt>がくせい\u003c/rt>\u003c/ruby>がデザイナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>と\u003cruby>直接\u003crt>ちょくせつ\u003c/rt>\u003c/ruby>\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>せる\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っているのには、そういう\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>があるんですね。\u003cruby>座談会\u003crt>ざだんかい\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んで\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になっていたので、\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>えてうれしいです。","zh":"原来特意留时间让学生跟设计师直接交流，背后有这层考虑。我读那篇座谈时就很好奇，今天能听到你们的想法很开心。"}],"reverse":"27","audience":""},{"id":"q37","title":"哪处值得把中途的方案也拿出来","menuTitle":"哪处值得把中途的方案也拿出来","page":"","blocks":[{"type":"speech","ja":"\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>ほどの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>のことで、もう\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つだけご\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>を\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいです。\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>した\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、「ここはほかにどんな\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>したんだろう」と\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったところがあれば、\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えていただけるとうれしいです。","zh":"关于刚才一起看的作品，我还想听听意见。看成品的时候，有没有哪一处让人好奇「这里是不是还试过别的方案」？如果有，我很想知道是哪一处。"},{"type":"reply","ja":"はい、14ページに\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べています。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>なら、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>がお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>していることが\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるので、この\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。","zh":"好，几个方案都放在第 14 页了。中间这版能同时看到包裹已经到店，以及店家正在检查衣服，所以最后选了它。","cue":"如果聊到想看 MORI 里包裹到店后的页面为什么定成这一版"}],"sources":[],"followups":[{"cue":"如果对方建议把犹豫过的两个方案并排展示","ja":"\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つ\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べると、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>になぜこちらを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだのかが\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりやすいんですね。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、どこが\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>め\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>になったかも\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>にお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>ししてみます。","zh":"原来把两种方案并排放着看，别人会更容易明白最后为什么选这一版。下次我会把决定取舍的那一点也一起讲出来。"}],"reverse":"37","audience":""},{"id":"q29","title":"已决定申请，接下来怎么报名","menuTitle":"已决定申请，接下来怎么报名","page":"","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に、\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>について\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つだけ\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいんですが、28\u003cruby>卒\u003crt>そつ\u003c/rt>\u003c/ruby>のPAY IDのデザイナー\u003cruby>職\u003crt>しょく\u003c/rt>\u003c/ruby>には\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>すると\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めています。このあと、まず\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をすればよいか\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えていただけますか。","zh":"最后我还想请教一下报名的事。我已经决定申请 PAY ID 的 28 卒设计师岗位，接下来第一步应该怎么做呢？"},{"type":"reply","ja":"\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりました。では、\u003cruby>作品集\u003crt>さくひんしゅう\u003c/rt>\u003c/ruby>を\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>して、\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページから\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>します。ありがとうございます。","zh":"明白了，那我会准备好作品集，从招聘页申请。谢谢您。","cue":"如果聊到从招聘页提交作品集就可以"}],"sources":[],"followups":[],"reverse":"29","audience":""},{"id":"q14","title":"能动的原型怎么交给开发","menuTitle":"能动的原型怎么交给开发","page":"","blocks":[{"type":"sp <script>
'use strict';
const data = JSON.parse(document.getElementById('reader-data').textContent);
const byId = id => document.getElementById(id);
const make = (tag, cls, text) => {
  const element = document.createElement(tag);
  if (cls) element.className = cls;
  if (text !== undefined) element.textContent = text;
  return element;
};
const root = document.documentElement;
const reader = byId('reader');
const settings = byId('settings');
const directory = byId('directory');
const params = new URLSearchParams(location.search);
root.classList.toggle('compact', params.get('compact') === '1' || params.get('nativeMini') === '1');
root.classList.toggle('native-mini', params.get('nativeMini') === '1');
root.dataset.revision = data.revision;
const settingsKey = 'base-casual-reader-settings-v1';
const compact = root.classList.contains('compact');
const settingsFields = [
  {key:'alpha', label:'整窗背景不透明度', prop:'--alpha', min:0, max:1, step:.05, value:.8, unit:''},
  {key:'font', label:'日文字号', prop:'--body-size', min:10, max:30, step:1, value:compact ? 12 : matchMedia('(max-width:759px)').matches ? 15 : 18, unit:'px'},
  {key:'leading', label:'行距', prop:'--leading', min:1.2, max:2.50, step:.05, value:compact ? 1.5 : 1.75, unit:''},
  {key:'space', label:'字间距', prop:'--letters', min:0, max:.15, step:.01, value:0, unit:'em'},
  {key:'rubySize', label:'假名大小', prop:'--ruby-size', min:.28, max:.75, step:.01, value:.42, unit:'em'},
  {key:'rubyGap', label:'假名间距', prop:'--ruby-gap', min:0, max:6, step:1, value:1, unit:'px'}
];
const colors = { light:'#ffffff', dark:'#15201c', sage:'#dbe5d9', custom:'#eee4cd' };
let stored = {};
try { stored = JSON.parse(localStorage.getItem(settingsKey) || '{}') || {}; } catch {}
const prefs = {zh:stored.zh !== false, ruby:stored.ruby !== false,
  theme:Object.hasOwn(colors,stored.theme) ? stored.theme : 'dark',
  custom:/^#[\da-f]{6}$/i.test(stored.custom || '') ? stored.custom : colors.custom};
const fields = new Map();
const indexed = [];
const itemsById = new Map();
const navBySection = new Map();
let current, pinnedEntry, opener, settingsPosition;
function persist() {
  try { localStorage.setItem(settingsKey, JSON.stringify(prefs)); } catch {}
}
function applyTheme() {
  const hex = prefs.theme === 'custom' ? prefs.custom : colors[prefs.theme];
  const rgb = [1,3,5].map(i => parseInt(hex.slice(i,i+2),16));
  const linear = rgb.map(channel => {
    const n = channel / 255;
    return n <= .04045 ? n / 12.92 : ((n + .055) / 1.055) ** 2.4;
  });
  const dark = linear[0]*.2126 + linear[1]*.7152 + linear[2]*.0722 < .18;
  root.style.colorScheme = dark ? 'dark' : 'light';
  root.dataset.theme = prefs.theme;
  root.style.setProperty('--panel-rgb',rgb.join(' '));
  root.style.setProperty('--ink',dark ? '#f3f7f4' : '#181b18');
  root.style.setProperty('--muted',dark ? '#c6d3ca' : '#343b35');
  root.style.setProperty('--accent',dark ? '#9ae3b4' : '#244d3c');
  root.style.setProperty('--line',dark ? 'rgb(205 230 215 / .37)' : 'rgb(32 32 32 / .30)');
  root.style.setProperty('--soft-line',dark ? 'rgb(205 230 215 / .20)' : 'rgb(32 32 32 / .15)');
  root.style.setProperty('--web-floor',dark ? '#36423e' : '#e5e9e4');
  document.querySelector('meta[name="theme-color"]').content = hex;
  byId('setting-color').value = prefs.custom;
  for (const key of Object.keys(colors)) byId('theme-'+key).setAttribute('aria-pressed',String(prefs.theme === key));
}
function applyPrefs() {
  root.classList.toggle('no-zh', !prefs.zh);
  root.classList.toggle('no-ruby', !prefs.ruby);
  byId('zh-button').setAttribute('aria-pressed', String(prefs.zh));
  byId('ruby-button').setAttribute('aria-pressed', String(prefs.ruby));
  settingsFields.forEach(field => {
    const val = prefs[field.key];
    root.style.setProperty(field.prop, val + field.unit);
    const {input, output} = fields.get(field.key);
    input.value = String(val);
    output.value = ['alpha','rubySize'].includes(field.key) ? Math.round(val * 100) + '%' : field.key === 'leading' ? val + ' 倍' : val + ' ' + field.unit;
    input.setAttribute('aria-valuetext',output.value);
  });
  applyTheme();
}
function buildControls() {
  settingsFields.forEach(field => {
    const raw = stored[field.key];
    prefs[field.key] = Number.isFinite(raw) ? Math.min(field.max, Math.max(field.min, raw)) : field.value;
    const wrap = make('div','control'), label = make('label','',field.label), input = make('input'), output = make('output');
    input.type = 'range'; input.id = 'setting-' + field.key;
    for (const attr of ['min','max','step']) input[attr] = String(field[attr]);
    label.htmlFor = input.id; output.setAttribute('for',input.id);
    wrap.append(label,input,output); byId('settings-controls').append(wrap); fields.set(field.key,{input,output});
    input.addEventListener('input', () => { prefs[field.key] = Number(input.value); applyPrefs(); persist(); });
  });
  for (const key of Object.keys(colors)) byId('theme-'+key).addEventListener('click', () => {prefs.theme=key;applyTheme();persist();});
  byId('setting-color').addEventListener('input',e => {prefs.custom=e.target.value;prefs.theme='custom';applyTheme();persist();});
  for (const [id,key] of [['zh-button','zh'],['ruby-button','ruby']]) byId(id).addEventListener('click', () => {prefs[key]=!prefs[key];applyPrefs();persist();});
  byId('reset').addEventListener('click', () => {
    for (const f of settingsFields) prefs[f.key]=f.value;
    Object.assign(prefs,{theme:'dark',custom:colors.custom,zh:true,ruby:true});
    applyPrefs();persist();
  });
  applyPrefs();
}
function pageLinks(value) {
  const label = make('span','page');
  for (const token of String(value).split(/(P?\s*\d+)/gi)) {
    const number = /^P?\s*(\d+)$/i.exec(token);
    if (!number) { label.append(token); continue; }
    const link = make('a','',token);
    link.href = '#p' + number[1];
    link.setAttribute('aria-label','跳到第 ' + number[1] + ' 页');
    label.append(link);
  }
  return label;
}
function drawReader() {
  const fragment = document.createDocumentFragment();
  data.sections.forEach(section => {
    const outer = make('section', 'reader-section');
    outer.id = section.id;
    outer.tabIndex = -1;
    itemsById.set(section.id, {section, article:outer});
    const nav = make('a','',section.label);
    nav.href = '#' + section.id;
    byId('sections').append(nav);
    navBySection.set(section.id, nav);
    const head = make('div', 'section-head');
    head.append(make('h2','',section.label));
    outer.append(head);
    section.groups.forEach(group => {
      if (!group.items.length) return;
      const groupEl = make('div', 'group');
      if (section.groups.length > 1 || group.label !== section.label) groupEl.append(make('h3','groupname',group.label));
      group.items.forEach(item => {
        const article = make('article','card');
        article.id = item.id; article.tabIndex = -1;
        const itemHead = make('div','card-head');
        const isPage = section.kind === 'pages';
        if (item.reverse) article.dataset.reverse = item.reverse;
        if (item.page) {
          itemHead.append(isPage ? make('span','page',item.page) : pageLinks(item.page));
        }
        itemHead.append(make('h4','',item.title));
        if (item.audience) itemHead.append(make('span','audience',item.audience));
        article.append(itemHead);
        item.blocks.forEach(block => {
          if (!block.ja && !block.zh) return;
          const row = make('div','block ' + block.type);
          if (block.page) {
            const cue = pageLinks(block.page);
            cue.classList.add('block-page');
            row.append(cue);
          }
          if (block.cue) row.append(make('p','reply-cue',block.cue));
          if (block.ja) {
            const ja = make('p','jp');
            ja.lang = 'ja';
            ja.innerHTML = block.ja;
            row.append(ja);
          }
          if (block.zh && (!block.ja || block.zh !== item.title)) {
            row.append(make('p','zh' + (block.ja ? ' translation':''),block.zh));
          }
          article.append(row);
        });
        for (const branch of item.followups || []) {
          const row = make('div','block reply');
          row.append(make('p','reply-cue',branch.cue));
          const ja = make('p','jp');
          ja.lang = 'ja'; ja.innerHTML = branch.ja;
          row.append(ja,make('p','zh translation',branch.zh));
          article.append(row);
        }
        for (const reference of item.sources || []) {
          const source = make('a','article-source',reference.label);
          source.href = reference.url;
          source.target = '_blank';
          source.rel = 'noopener noreferrer';
          article.append(source);
        }
        for (const topic of item.related || []) {
          const link = make('a','article-source',topic.label);
          link.href = '#' + topic.id;
          article.append(link);
        }
        groupEl.append(article);
        const entry = {section,group,item,article};
        indexed.push(entry); itemsById.set(item.id,entry);
      });
      outer.append(groupEl);
    });
    fragment.append(outer);
  });
  byId('reader').append(fragment);
}
const normalize = value => value.normalize('NFKC').toLowerCase().trim();
function buildDirectory() {
  const list = byId('directory-list');
  for (const [index,entry] of indexed.entries()) {
    const {section,group,item} = entry;
    const title = item.menuTitle || item.title;
    const link = make('a');
    link.href = '#' + item.id;
    link.append(make('span','directory-rank',String(index+1).padStart(2,'0')),make('span','directory-title',title));
    link.firstElementChild.setAttribute('aria-hidden','true');
    const cues = item.blocks.map(block => block.cue).filter(Boolean);
    entry.search = normalize([title,item.title,item.audience,item.page,item.id,section.label,section.kind === 'pages' ? group.label : '',...cues].filter(Boolean).join(' '));
    entry.menuLink = link;
    list.append(link);
  }
  filterDirectory();
}
function filterDirectory() {
  const query = normalize(byId('directory-search').value);
  const terms = query.split(/\s+/).filter(Boolean);
  let count = 0;
  for (const entry of indexed) {
    const match = terms.every(term=>entry.search.includes(term));
    entry.menuLink.hidden = !match;
    if (match) count++;
  }
  byId('directory-count').textContent = query ? count+' / '+indexed.length+' 项' : '共 '+indexed.length+' 项';
  byId('directory-clear').disabled = !query;
  byId('directory-empty').hidden = count !== 0;
}
function identifyLocation(entry) {
  if (!entry || current === entry) return;
  current?.menuLink?.removeAttribute('aria-current');
  navBySection.get(current?.section.id)?.removeAttribute('aria-current');
  current = entry;
  entry.menuLink?.setAttribute('aria-current','location');
  navBySection.get(entry.section.id)?.setAttribute('aria-current','location');
  byId('current-label').textContent = entry.item?.menuTitle || entry.item?.title || entry.section.label;
}
let scrollQueued=false;
function track() {
  scrollQueued=false;
  if (!indexed.length || settings.open || directory.open || pinnedEntry) return;
  const line=reader.getBoundingClientRect().top+24;
  let lo=0,hi=indexed.length;
  while(lo<hi){
    const mid=(lo+hi)>>>1;
    if(indexed[mid].article.getBoundingClientRect().top<=line) lo=mid+1;else hi=mid;
  }
  const atEnd=reader.scrollTop+reader.clientHeight>=reader.scrollHeight-2;
  identifyLocation(indexed[atEnd ? indexed.length-1 : Math.max(0,lo-1)]);
}
function queueTrack() {if(!scrollQueued){scrollQueued=true;requestAnimationFrame(track);}}
function releasePinned() {pinnedEntry=undefined;queueTrack();}
function urlTarget() {
  try {
    const id=decodeURIComponent(location.hash.slice(1));
    return itemsById.get(id) || (id === 'q39' && itemsById.get('q37')) || (/^q\d+$/.test(id) ? itemsById.get('reverse') : undefined);
  } catch {return undefined;}
}
function goTo(entry,focus=true) {
  if (!entry) return;
  pinnedEntry=entry;
  if (focus) entry.article.focus({preventScroll:true});
  const top=reader.scrollTop + entry.article.getBoundingClientRect().top-reader.getBoundingClientRect().top-8;
  reader.scrollTo({top,behavior:'instant'});
  identifyLocation(entry);
}
function follow(entry) {
  if (!entry) return;
  const hash='#'+encodeURIComponent(entry.article.id);
  if(location.hash!==hash) history.pushState(null,'',hash);
  goTo(entry);
}
function openSheet(dialog,trigger) {
  opener=trigger;
  if(dialog===settings && current) settingsPosition={entry:current,top:current.article.getBoundingClientRect().top};
  document.body.classList.add('modal-open');
  dialog.showModal();trigger.setAttribute('aria-expanded','true');
  if(dialog===directory) {
    byId('directory-search').value='';filterDirectory();
    const here=current?.menuLink || indexed.find(e=>e.section===current?.section)?.menuLink;
    if(here) here.scrollIntoView({block:'nearest'});
    const focusTarget=matchMedia('(pointer:coarse)').matches ? dialog.querySelector('[data-close]') : byId('directory-search');
    focusTarget.focus({preventScroll:true});
  }else dialog.querySelector('[data-close]').focus({preventScroll:true});
}
function closeSheet(dialog,restore=true) {
  dialog.close();opener?.setAttribute('aria-expanded','false');document.body.classList.remove('modal-open');
  if(dialog===settings && settingsPosition) {
    reader.scrollTop+=settingsPosition.entry.article.getBoundingClientRect().top-settingsPosition.top;settingsPosition=undefined;
  }
  if(restore) opener?.focus({preventScroll:true});
}
buildControls();drawReader();buildDirectory();identifyLocation(indexed[0]);
for(const [dialog,id] of [[directory,'directory-button'],[settings,'settings-button']]) {
  byId(id).addEventListener('click',e=>openSheet(dialog,e.currentTarget));
  dialog.querySelector('[data-close]').addEventListener('click',()=>closeSheet(dialog));
  dialog.addEventListener('cancel',e=>{e.preventDefault();closeSheet(dialog);});
  dialog.addEventListener('click',e=>{
    if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();
    if(e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom)closeSheet(dialog);
  });
}
byId('directory-search').addEventListener('input',()=>{filterDirectory();byId('directory-list').scrollTop=0;});
byId('directory-search').addEventListener('keydown',e=>{
  const first=byId('directory-list').querySelector('a:not([hidden])');
  if(first && ['ArrowDown','Enter'].includes(e.key) && !e.isComposing) {
    e.preventDefault();if(e.key==='Enter') first.click();else first.focus();
  }
});
byId('directory-clear').addEventListener('click',()=>{
  byId('directory-search').value='';filterDirectory();byId('directory-search').focus();
});
byId('popup').addEventListener('click',()=>{
  const url=new URL(location.href);url.searchParams.set('compact','1');url.hash=current?.article.id || '';
  window.open(url.href,'base-casual-mini','popup,width=400,height=560,resizable=yes,scrollbars=yes');
});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey)return;
  const id=decodeURIComponent(a.hash.slice(1)),entry=itemsById.get(id);
  if(!entry)return;
  e.preventDefault();
  if(a.closest('#sections')) {
    byId('directory-search').value='';filterDirectory();
    const first=indexed.find(row=>row.section.id===id);
    first?.menuLink.focus({preventScroll:true});first?.menuLink.scrollIntoView({block:'start'});return;
  }
  if(directory.open)closeSheet(directory,false);
  follow(entry);
});
for(const type of ['wheel','touchstart','pointerdown']) reader.addEventListener(type,releasePinned,{passive:true});
document.addEventListener('keydown',e=>{
  if(!directory.open && !settings.open && ['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].includes(e.key))releasePinned();
});
reader.addEventListener('scroll',queueTrack,{passive:true});
window.addEventListener('resize',queueTrack);
history.scrollRestoration='manual';
window.addEventListener('hashchange',()=>{goTo(urlTarget()||indexed[0]);});
requestAnimationFrame(()=>goTo(urlTarget()||indexed[0],false));
</script>
</body>
