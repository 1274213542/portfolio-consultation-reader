<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131715">
<title>BASE · カジュアル面談</title>
<style>
:root {
  color-scheme: dark;
  --bg: #131715; --panel: #1b211e; --raised: #26302a; --bound: #38433c;
  --ink: #f2f4ed; --soft: #c0c9c1; --muted: #a1b0a5; --accent: #a5ddba;
  --body-size: 20px; --leading: 2.05; --letters: .015em; --ruby-size: .42em; --ruby-gap: 1px;
  --shell-width: 790px; --bar-top: 62px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-top) + env(safe-area-inset-top) + 12px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","PingFang SC","Noto Sans CJK SC",sans-serif; }
button,input,output { font: inherit; }
button { color: inherit; cursor: pointer; }
a { color: var(--accent); }
button,summary,a,input { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button { border: 0; }
[hidden] { display: none !important; }
.shell,main { max-width: var(--shell-width); margin-inline: auto; }
.bar { position: sticky; top: 0; z-index: 3; padding-top: env(safe-area-inset-top); background: var(--bg); border-bottom: 1px solid var(--bound); }
.bar .shell { min-height: var(--bar-top); display: flex; align-items: center; gap: 16px; padding: 9px 20px; }
.brand-mark { width: 4px; height: 27px; background: var(--accent); border-radius: 3px; flex: none; }
.brand { flex: none; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .015em; }
.brand small { color: var(--muted); display: block; font: 600 10px/1.4 -apple-system,BlinkMacSystemFont,sans-serif; letter-spacing: .12em; }
.reading-tools { margin-left: auto; display: flex; align-items: center; gap: 7px; }
.reading-tools button { min-height: 36px; border-radius: 7px; padding: 5px 9px; color: var(--soft); background: var(--raised); font-size: 13px; }
main { padding: 20px 20px 108px; padding-bottom: calc(108px + env(safe-area-inset-bottom)); }
.section-head { margin: 0 0 13px; display: flex; align-items: baseline; gap: 12px; }
.section-head h2 { margin: 0; font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -.03em; }
.reader-section + .reader-section { margin-top: 42px; }
.group + .group { margin-top: 26px; }
.groupname { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 10px; }
.card { background: var(--panel); border: 1px solid var(--bound); border-radius: 12px; padding: 17px 20px 19px; }
.card + .card { margin-top: 12px; }
.card:focus { outline: none; }
.card:focus-visible { outline: 2px solid var(--accent); }
.card-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
.card-head h4 { font-size: 15px; line-height: 1.55; margin: 0; font-weight: 600; color: var(--soft); overflow-wrap: anywhere; }
.page { flex: none; color: var(--accent); font: 650 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; text-decoration: none; white-space: normal; max-width: 9em; }
.page a { color: inherit; text-decoration: none; border-bottom: 1px solid #698573; padding-block: 5px; }
.block + .block { margin-top: 12px; }
.block-page { display: block; margin-bottom: 6px; }
.jp { margin: 0; color: var(--ink); font-family: -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif; font-size: var(--body-size); line-height: var(--leading); font-weight: 520; letter-spacing: var(--letters); overflow-wrap: anywhere; line-break: strict; }
ruby { ruby-align: center; ruby-position: over; }
rt { font-size: var(--ruby-size); letter-spacing: 0; font-weight: 550; color: var(--accent); line-height: 1; position: relative; top: calc(0px - var(--ruby-gap)); }
html.no-ruby rt,html.no-ruby rp { display: none; }
html.no-ruby ruby { display: inline; }
.zh { font-size: clamp(14px, .80em + 2px, 18px); line-height: 1.85; color: var(--soft); margin: 10px 0 0; border-left: 2px solid #587964; padding-left: 11px; overflow-wrap: anywhere; white-space: pre-line; }
.note { color: var(--muted); font-size: 14px; }
.article-source { display: inline-block; margin-top: 14px; padding-block: 5px; font-size: 14px; text-underline-offset: 3px; }
.note .zh:only-child { margin: 0; border-left: 0; padding-left: 0; }
.prompt .jp { color: #dbecdf; font-weight: 640; }
.prompt + .speech { margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--bound); }
html.no-zh .translation { display: none; }
.dock { position: fixed; z-index: 4; bottom: 0; inset-inline: 0; background: var(--panel); border-top: 1px solid var(--bound); padding-bottom: env(safe-area-inset-bottom); }
.dock .shell { height: 58px; padding-inline: 10px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; gap: 4px; }
.dock a { display: grid; place-items: center; min-height: 42px; min-width: 0; padding: 3px; border-radius: 7px; font-size: 13px; color: var(--soft); text-decoration: none; white-space: nowrap; }
.dock a[aria-current="location"] { color: #def4e5; background: #32483a; font-weight: 650; }
.jump-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 158px), 1fr)); gap: 7px; margin: 0 0 18px; }
.jump-list a { display: flex; align-items: center; min-height: 40px; padding: 7px 10px; border: 1px solid var(--bound); border-radius: 7px; background: var(--panel); text-decoration: none; color: var(--soft); font-size: 13px; overflow-wrap: anywhere; }
.jump-list a:hover { color: var(--ink); background: var(--raised); }
.display-options { display: flex; gap: 8px; margin: 8px 18px 0; }
.display-options button { min-height: 40px; padding: 5px 11px; border-radius: 7px; background: var(--raised); color: var(--soft); border: 1px solid var(--bound); }
.display-options button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
dialog { margin: auto auto 0; width: min(100%,640px); max-height: min(84vh,810px); max-height: min(84dvh,810px); color: var(--ink); background: var(--panel); border: 1px solid var(--bound); border-bottom: none; border-radius: 18px 18px 0 0; padding: 0; overflow: hidden; }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgb(3 6 4 / .66); }
body.modal-open { overflow: hidden; }
.sheet-top { display: flex; align-items: center; padding: 15px 19px 8px; gap: 8px; }
.sheet-top h2 { flex: 1; margin: 0; font-size: 20px; }
.dismiss { align-self: center; color: var(--soft); background: var(--raised); min-height: 39px; padding: 4px 13px; border-radius: 8px; }
.sheet-scroll { overflow-y: auto; overscroll-behavior: contain; padding: 12px 18px max(20px, env(safe-area-inset-bottom)); min-height: 0; }
.control { margin: 0 0 17px; }
.control label { display: flex; align-items: baseline; justify-content: space-between; color: var(--soft); font-weight: 550; }
.control output { color: var(--accent); font: 600 13px ui-monospace,monospace; }
.control input { display: block; width: 100%; accent-color: var(--accent); min-height: 35px; margin: 3px 0; }
.sample { padding: 9px 13px; border: 1px solid var(--bound); border-radius: 8px; background: var(--bg); margin: 8px 18px 0; }
.reset { padding: 8px 13px; min-height: 40px; color: var(--soft); background: var(--raised); border-radius: 7px; }
@media (min-width: 760px) {
 main { padding-top: 35px; } .card { padding: 21px 26px 23px; }
 dialog { margin: auto; max-height: min(82vh,780px); border-bottom: 1px solid var(--bound); border-radius: 15px; }
}
@media (max-width: 390px) {
 .bar .shell { gap: 9px; padding-inline: 12px; }
 main { padding-inline: 11px; } .card { padding: 13px; }
 .dock .shell { padding-inline: 6px; gap: 2px; }
 .sheet-scroll { padding-inline: 12px; }
 .jump-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.popup { display: none; flex: none; color: var(--soft); background: var(--raised); border: 1px solid var(--bound); border-radius: 7px; min-height: 40px; padding: 5px 12px; }
@media (min-width: 760px) { html:not(.compact) .popup { display: inline-block; } }
html.compact { --bar-top: 49px; }
html.compact .bar .shell { gap: 8px; padding: 6px 10px; }
html.compact .brand h1 { font-size: 14px; }
html.compact .brand small { font-size: 9px; }
html.compact main { padding: 11px 10px calc(66px + env(safe-area-inset-bottom)); }
html.compact .section-head h2 { font-size: 19px; }
html.compact .reader-section + .reader-section { margin-top: 24px; }
html.compact .card { padding: 11px 12px; border-radius: 8px; }
html.compact .dock .shell { height: 49px; }
html.compact .jump-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
html.native-mini,html.native-mini body { background: transparent; }
html.native-mini .bar,html.native-mini .dock,html.native-mini .card { background: rgb(22 30 25 / .90); }
html.native-mini main { background: rgb(20 27 22 / .80); }
.card[data-reverse] .card-head { justify-content: space-between; }
.audience { flex: none; font-size: 12px; color: var(--accent); }
.card[data-reverse] .article-source { display: block; margin: 12px 0 0; font-size: 12px; color: var(--muted); }
.card[data-reverse] .speech { margin-top: 10px; }
.card[data-reverse] .reply { border-top: 1px solid var(--bound); padding-top: 10px; }
.reply .jp { font-size: max(14px, calc(var(--body-size) * .86)); }
.reply-cue { margin: 0 0 4px; color: var(--accent); font-size: 12px; }
</style>
</head>

<script id="reader-data" type="application/json">{"sections":[{"id":"opening","label":"开场","kind":"flow","groups":[{"id":"opening","label":"问候和自我介绍","items":[{"id":"start-here","title":"开场先看对方怎么带","page":"","blocks":[{"type":"note","ja":"","zh":"上线先打招呼。对方叫到你或请你介绍时，再讲自我介绍。对方先介绍成员或安排，听完回应一句。接下来按他的话走：请看作品就开作品；先提问就直接答；把话交给你再选一个想问的。"}]},{"id":"opening-1","title":"刚上线，先问候","page":"","blocks":[{"type":"speech","ja":"こんにちは。\u003cruby>本日\u003crt>ほんじつ\u003c/rt>\u003c/ruby>はお\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>をいただき、ありがとうございます。よろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"您好，谢谢两位今天抽时间。请多关照。"}],"source":""},{"id":"opening-2","title":"对方先问声音是否正常","page":"","blocks":[{"type":"speech","ja":"はい、\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>こえています。よろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"嗯，听得见。请多关照。"}],"source":""},{"id":"opening-3","title":"轮到你自我介绍","page":"","blocks":[{"type":"speech","ja":"\u003cruby>武蔵野美術大学\u003crt>むさしのびじゅつだいがく\u003c/rt>\u003c/ruby>\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>でデザイン\u003cruby>情報学\u003crt>じょうほうがく\u003c/rt>\u003c/ruby>を\u003cruby>専攻\u003crt>せんこう\u003c/rt>\u003c/ruby>している、ZHANG ZIRUIです。\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>も\u003cruby>武蔵美\u003crt>むさび\u003c/rt>\u003c/ruby>で、グラフィックデザインを\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>びました。\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ってからは、\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>と\u003cruby>並行\u003crt>へいこう\u003c/rt>\u003c/ruby>して、UI/UXデザインも\u003cruby>独学\u003crt>どくがく\u003c/rt>\u003c/ruby>で\u003cruby>勉強\u003crt>べんきょう\u003c/rt>\u003c/ruby>しています。\u003cruby>本日\u003crt>ほんじつ\u003c/rt>\u003c/ruby>はよろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"我是ZHANG ZIRUI，现在在武藏野美术大学大学院读设计信息学。本科也在武藏美，学的是平面设计。读研后，我一边做研究，一边也开始自学UI/UX设计。今天请多关照。"}],"source":""},{"id":"opening-4","title":"对方介绍了团队或说明今天怎么聊","page":"","blocks":[{"type":"speech","ja":"はい、ありがとうございます。よろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"好的，谢谢。请多关照。"}],"source":""}]},{"id":"sharing","label":"共享与临场短讲","items":[{"id":"sharing-1","title":"共享与临场短讲","page":"","blocks":[{"type":"note","ja":"","zh":"聊到自己的制作、对方还没邀请展示时。"},{"type":"speech","ja":"よろしければ、ポートフォリオを\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>\u003cruby>共有\u003crt>きょうゆう\u003c/rt>\u003c/ruby>して、\u003cruby>簡単\u003crt>かんたん\u003c/rt>\u003c/ruby>にご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>してもいいですか。","zh":"方便的话，我可以共享一下作品集，简单介绍吗？"}],"source":""},{"id":"sharing-2","title":"对方已经邀请或者同意时","page":"","blocks":[{"type":"note","ja":"","zh":"对方已经邀请或者同意时。"},{"type":"speech","ja":"ありがとうございます。では、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>共有\u003crt>きょうゆう\u003c/rt>\u003c/ruby>しますね。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えていますか。","zh":"谢谢，那我共享一下屏幕。能看见吗？"}],"source":""},{"id":"sharing-3","title":"对方已经邀请或者同意时","page":"","blocks":[{"type":"note","ja":"","zh":"停在P4目录。"},{"type":"speech","ja":"こちらが\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>の\u003cruby>一覧\u003crt>いちらん\u003c/rt>\u003c/ruby>です。UI/UXとグラフィックデザインの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>をまとめています。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つを\u003cruby>簡単\u003crt>かんたん\u003c/rt>\u003c/ruby>にご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>します。","zh":"这里是作品目录，收录了UI/UX和平面设计的作品。我简单介绍一下前两件。"}],"source":""},{"id":"sharing-4","title":"如果对方已经看过作品集","page":"","blocks":[{"type":"speech","ja":"ご\u003cruby>覧\u003crt>らん\u003c/rt>\u003c/ruby>いただき、ありがとうございます。\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になった\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>があれば、そのページを\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>きます。","zh":"谢谢您提前看过。如果有您比较在意的作品，我可以打开那一页。"}],"source":""},{"id":"sharing-5","title":"如果对方说只够简单看一件","page":"","blocks":[{"type":"note","ja":"","zh":"直接打开P17。下面的介绍约半分钟，供练习用，尚未计时。临时没法共享屏幕时，这段也可单独讲。"},{"type":"speech","ja":"まず「MORI」です。ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>の\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えた\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>です。クーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>って\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>って、\u003cruby>一着\u003crt>いっちゃく\u003c/rt>\u003c/ruby>だけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すとしたら、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るんだろう、と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったんです。そこで、\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すと\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>める\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、カードに\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るお\u003cruby>金\u003crt>かね\u003c/rt>\u003c/ruby>とポイント、それから\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>が\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようにしました。","zh":"先讲MORI，是一个网购服装的退货方案。我想到，如果用优惠券和积分买了两件、只想退一件，实际会退多少呢？所以我让人先看到退回卡里的钱、返还的积分和退货运费，再决定退不退。"}],"source":""},{"id":"sharing-6","title":"如果他们点名看TUCK，打开P34","page":"","blocks":[{"type":"note","ja":"","zh":"如果他们点名看TUCK，打开P34。"},{"type":"speech","ja":"「TUCK T10」は、アームで\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>を\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>は\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べたと\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たけれど、スリッパの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>は\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からない。そんなときに、まず\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>す\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>があるスリッパを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>し、\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だった\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりとして\u003cruby>示\u003crt>しめ\u003c/rt>\u003c/ruby>しました。","zh":"TUCK T10是带机械臂的扫地机器人的App方案。比如，已经收到袜子搬完的通知，但拖鞋的结果还不知道。这时我先显示需要找的拖鞋，再把原来的位置和原本计划搬到的位置作为线索。"}],"source":""}]}]},{"id":"pages","label":"作品","kind":"pages","groups":[{"id":"mori","label":"第一件 MORI","items":[{"id":"p17","title":"P17，先指出成品和退款预估","page":"P17","blocks":[{"type":"speech","ja":"まず「MORI」です。ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>する\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。こちらが、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。カードにいくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るか、ポイントはいくつ\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るかを、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できます。\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>もここで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られます。","zh":"先讲MORI。我做的是网购服装的退货界面。现在这张是预约取件前的页面，可以分开看到预计退回卡里的金额和返还的积分，退货运费也在这里。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>はネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をするのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えばクーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってシャツとパンツを\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い、シャツだけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すとしたら、「\u003cruby>結局\u003crt>けっきょく\u003c/rt>\u003c/ruby>いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るんだろう？」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったんです。\u003cruby>費用\u003crt>ひよう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てから\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すか\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>められるよう、このタイミングで\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"我自己喜欢网购，于是想了个场景，比如用优惠券和积分买了衬衫和裤子，只退衬衫时，到底会退多少？所以我在这一步把预估显示出来，让人先看费用，再决定退不退。"}],"source":""},{"id":"p21","title":"P21，给对方看最终状态页","page":"P21","blocks":[{"type":"speech","ja":"こちらは、\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>したあとの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>していることが、ここで\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>に\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っていればいいので、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>がいつ\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかも\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しています。","zh":"这张是寄回以后的界面，能分别看到包裹已到店和店铺正在检查衣服。这时候只要等，所以我也把下一次通知的时间放在这里。"},{"type":"speech","ja":"「\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>は\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたけど、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っているんだろう？」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うことがありそうだったので、\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことだけでなく、いま\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>の\u003cruby>対応\u003crt>たいおう\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っているかまで\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すようにしました。","zh":"我觉得用户即使知道包裹到了，可能还是会问「我现在在等什么？」所以，我也把正在等谁处理这件事说明了。"}],"source":""},{"id":"mori-3","title":"「このテーマを選んだきっかけは何ですか。」","page":"","blocks":[{"type":"prompt","ja":"このテーマを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだきっかけは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"问从哪里发现问题。用你实际查过的公开退货说明，交代它影响了哪项设计。"},{"type":"speech","ja":"\u003cruby>既存\u003crt>きそん\u003c/rt>\u003c/ruby>のサービスの\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べたとき、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>の\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>と\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>の\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>で、\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれることに\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づきました。そこで、シャツを\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>す\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>して、いつ、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かると\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めるかを\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>しました。","zh":"我查现有服务的退货说明时，发现包裹状态和退款进度有时要到不同地方查看。我就设定了只退一件衬衫的场景，梳理在每个阶段需要知道什么，才能决定下一步。"}],"source":""},{"id":"mori-4","title":"「この4,800円は、どう計算したんですか。」","page":"","blocks":[{"type":"prompt","ja":"この\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>は、どう\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>したんですか。","zh":""},{"type":"note","ja":"","zh":"问P17的退款额怎么得出。翻P18，先交代订单和分摊比例。"},{"type":"speech","ja":"この\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>では、\u003cruby>6,600円\u003crt>ろくせんろっぴゃくえん\u003c/rt>\u003c/ruby>のシャツと4,400\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>のパンツで、\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>代\u003crt>だい\u003c/rt>\u003c/ruby>が\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて11,000\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>です。シャツが\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>の60％なので、\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>った1,000\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>のクーポンと1,000ポイントも、それぞれ60％をシャツの\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>にしました。","zh":"这笔示例订单里，衬衫6,600日元，裤子4,400日元，商品合计11,000日元。衬衫占60%，所以把订单使用的1,000日元优惠券和1,000积分也分别按60%分给衬衫。"},{"type":"speech","ja":"シャツの\u003cruby>6,600円\u003crt>ろくせんろっぴゃくえん\u003c/rt>\u003c/ruby>から、クーポンの\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>、ポイントで\u003cruby>払\u003crt>はら\u003c/rt>\u003c/ruby>った\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>の\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>、\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>の\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>くと、カードに\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>見込\u003crt>みこ\u003c/rt>\u003c/ruby>みは\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>です。\u003cruby>600ポイント\u003crt>ろっぴゃくぽいんと\u003c/rt>\u003c/ruby>は\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ります。これはこの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>で\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>した\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>ルールで、\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>してから\u003cruby>確定\u003crt>かくてい\u003c/rt>\u003c/ruby>する\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>です。","zh":"从6,600日元里扣掉优惠券分摊的600日元、积分支付的600日元和600日元退货运费，预计退回卡里4,800日元，另外返还600积分。这是作品里设定的计算规则，最终金额以店铺检查完商品为准。"}],"source":""},{"id":"mori-5","title":"「どうして、この表示にしたんですか。」","page":"","blocks":[{"type":"prompt","ja":"どうして、この\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>にしたんですか。","zh":""},{"type":"note","ja":"","zh":"对方想看你如何比较方案。翻P14。"},{"type":"speech","ja":"\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>は「\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しています」と、いま\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をしているかを\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きく\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しています。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>なら、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことも\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>を\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたい\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>だと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったので、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>履歴\u003crt>りれき\u003c/rt>\u003c/ruby>や\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かい\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>は、\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なときだけ\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>けるようにしています。","zh":"右边的方案把「正在检查商品」做得很醒目。中间的方案还能一起看见包裹已到。我觉得在这里两件事都需要知道，所以选了中间的方案。物流记录和金额细节需要时再打开看。"}],"source":""},{"id":"mori-6","title":"「待つだけでいいと、どう伝えていますか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>つだけでいいと、どう\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えていますか。","zh":""},{"type":"note","ja":"","zh":"问用户下一步如何判断。P21给两个具体情境。"},{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>つときは、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>がいつ\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しています。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、タグが\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>っていたかお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できず、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>してほしい\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>は、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>してほしいかと、\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>ボタンを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"需要等待店铺检查时，我会显示下一次通知什么时候来。比如店铺没有确认到吊牌、需要买家联系时，就把要确认什么以及联系按钮放在前面。"}],"source":""},{"id":"mori-7","title":"「P15の数字は、実際に取ったアンケートですか。」","page":"","blocks":[{"type":"prompt","ja":"P15の\u003cruby>数字\u003crt>すうじ\u003c/rt>\u003c/ruby>は、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったアンケートですか。","zh":""},{"type":"note","ja":"","zh":"问数字的来源。第一句就交代假设数据。"},{"type":"speech","ja":"P15は、\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>比較\u003crt>ひかく\u003c/rt>\u003c/ruby>する\u003cruby>方法\u003crt>ほうほう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せるために、\u003cruby>各案\u003crt>かくあん\u003c/rt>\u003c/ruby>に\u003cruby>50件\u003crt>ごじゅっけん\u003c/rt>\u003c/ruby>ずつ\u003cruby>仮\u003crt>かり\u003c/rt>\u003c/ruby>の\u003cruby>回答\u003crt>かいとう\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いたページです。B\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだのは、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>であることを、\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたかったからです。","zh":"P15是为了展示比较方案的方法，每个方案放了50条假设回答。选B案的依据是，我想在同一个界面交代包裹已到和店铺正在检查这两件事。"}],"source":""},{"id":"mori-8","title":"「実際に使ってもらって、分かりやすいか確かめましたか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらって、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすいか\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめましたか。","zh":""},{"type":"note","ja":"","zh":"问验证做到哪一步。把下一步说成一个可观察的任务。"},{"type":"speech","ja":"\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらうところまでは、まだできていません。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、この\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>がいくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るか、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>てばいいのかを、ご\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>で\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>してもらいたいです。\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いがあれば、\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>の\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>や\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>します。","zh":"还没做到请用户实际试界面。下一步，我想请他们看界面，用自己的话说明会退回什么、各是多少，以及现在是不是只需要等。如果出现误读，我会回头调整展示顺序和用词。"}],"source":""}]},{"id":"tuck","label":"第二件 TUCK T10","items":[{"id":"p34","title":"P34，先指右边采用的方案","page":"P34","blocks":[{"type":"speech","ja":"\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>いて「TUCK T10」です。アームで\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>を\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。こちらが\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>で、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>では、\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>が\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なスリッパが\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。","zh":"接下来是TUCK T10，是带机械臂的扫地机器人App方案。这是整理结果。我选了右边的方案，先显示需要确认的拖鞋。"},{"type":"speech","ja":"\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけてもらって、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>だけが\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>る。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>だったら、\u003cruby>何個\u003crt>なんこ\u003c/rt>\u003c/ruby>\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったかより、「で、スリッパはどこに\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>ったんだろう？」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。それで、\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>は\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>の\u003cruby>一行\u003crt>いちぎょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>して、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すものを\u003cruby>目立\u003crt>めだ\u003c/rt>\u003c/ruby>たせました。","zh":"让机器人去整理袜子和拖鞋，但只收到了袜子的通知。换作是我，比起已经完成几件，我会先想「那拖鞋去哪儿了？」所以我把总件数留在上面一行，重点显示接下来要找的东西。"}],"source":""},{"id":"p39","title":"P39，沿两处查找线索讲到最后的记录","page":"P39","blocks":[{"type":"speech","ja":"じゃあ、どこから\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すか。ロボットが\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にスリッパを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたのは、ソファの\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>です。\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>っていく\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だったのは、\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>です。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どこにあるかは\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないので、その\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>か\u003cruby>所\u003crt>しょ\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりとして\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"那先去哪儿找呢？机器人一开始是在沙发前发现拖鞋的，原本打算搬到放鞋的地方。现在不知道拖鞋在哪儿，所以我把这两个地方列出来，作为寻找的线索。"},{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>にあったら、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>が\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめた\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>として「\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>にあった」と\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>できます。ロボットからの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>は、まだ「\u003cruby>未\u003crt>み\u003c/rt>\u003c/ruby>\u003cruby>受信\u003crt>じゅしん\u003c/rt>\u003c/ruby>」です。\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ても、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるように、\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>を\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けました。","zh":"比如在放鞋的地方找到了，用户可以在自己的确认记录里选“在预定位置找到”。机器人那一栏仍然是“未收到”。我把两条记录分开，这样后来再看也知道是谁确认的。"}],"source":""},{"id":"tuck-3","title":"「実際の製品を調べて作ったんですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>製品\u003crt>せいひん\u003c/rt>\u003c/ruby>を\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べて\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":""},{"type":"note","ja":"","zh":"问灵感和自制范围。P27、P29支持参考产品与自己的设计内容。"},{"type":"speech","ja":"アーム\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>きのロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>を\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べるときに、Roborock Saros Z70の\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>ガイドを\u003cruby>参考\u003crt>さんこう\u003c/rt>\u003c/ruby>にしました。そのうえで、\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>で\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだあと、\u003cruby>移動\u003crt>いどう\u003c/rt>\u003c/ruby>の\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なら\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるところまでを、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>として\u003cruby>設計\u003crt>せっけい\u003c/rt>\u003c/ruby>しました。","zh":"我研究带机械臂的扫地机器人时，参考了Roborock Saros Z70的操作指南。我的方案具体做的是从地图选中物品以后，怎样查看移动结果，必要时又怎样自己确认。"}],"source":""},{"id":"tuck-4","title":"「スリッパの移動に失敗したということですか。」","page":"","blocks":[{"type":"prompt","ja":"スリッパの\u003cruby>移動\u003crt>いどう\u003c/rt>\u003c/ruby>に\u003cruby>失敗\u003crt>しっぱい\u003c/rt>\u003c/ruby>したということですか。","zh":""},{"type":"note","ja":"","zh":"问“没有结果”和“失败”的区别。给出当前确知的信息。"},{"type":"speech","ja":"この\u003cruby>時点\u003crt>じてん\u003c/rt>\u003c/ruby>で\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かっているのは、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いていないことです。\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べたかどうかはまだ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないので、\u003cruby>失敗\u003crt>しっぱい\u003c/rt>\u003c/ruby>と\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>せず、\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>す\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"当时能确定的是，结果通知没有收到。搬运是否成功还未知，所以界面提示的是查找线索。"}],"source":""},{"id":"tuck-5","title":"「どこまで動くものを作ったんですか。」","page":"","blocks":[{"type":"prompt","ja":"どこまで\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>くものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":""},{"type":"note","ja":"","zh":"问实际做了什么。翻P42，说明试作的对象与确认范围。"},{"type":"speech","ja":"\u003cruby>一時停止\u003crt>いちじていし\u003c/rt>\u003c/ruby>の\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>は、ブラウザーでクリックして\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>せるように\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。ボタンを\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>すと、まず「ロボットの\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っています」と\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>したという\u003cruby>模擬\u003crt>もぎ\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>を\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ると、「\u003cruby>再開\u003crt>さいかい\u003c/rt>\u003c/ruby>する」ボタンが\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるようになります。この\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>替\u003crt>か\u003c/rt>\u003c/ruby>わりを、プロトタイプ\u003cruby>上\u003crt>じょう\u003c/rt>\u003c/ruby>で\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しました。","zh":"我把暂停操作做成了可以在浏览器里点击的原型。按下按钮，先显示“正在等待机器人停止”。收到一条模拟的停止通知后，“继续”按钮才可用。我在原型里确认了这个状态切换。"}],"source":""},{"id":"tuck-6","title":"「結果画面も、実際に使ってもらったんですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>も、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらったんですか。","zh":""},{"type":"note","ja":"","zh":"问P34与P39是否做过试用。先给实际状态，再说验证计划。"},{"type":"speech","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらうのは、これからです。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけの\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>で\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べて、どの\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>するかが\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たいです。そのあと、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にどこへ\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>くか、\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したかを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>れるかも\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたいです。","zh":"结果界面还没请用户试过。下一步我想用同一个整理场景比较两个结果界面，看看用户能不能知道该确认哪件物品。接着再看他们能不能根据线索知道该先去哪里找，读记录时能不能看出是谁确认的。"}],"source":""},{"id":"p77","title":"P77，四季の花綴り","page":"P77","blocks":[{"type":"speech","ja":"グラフィックの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>でしたら、\u003cruby>卒業制作\u003crt>そつぎょうせいさく\u003c/rt>\u003c/ruby>の「\u003cruby>四季\u003crt>しき\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>\u003cruby>綴\u003crt>つづ\u003c/rt>\u003c/ruby>り」をご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>します。\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>ごとの\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>と\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>を、ページをめくりながら\u003cruby>楽\u003crt>たの\u003c/rt>\u003c/ruby>しめる\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>です。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>とはまた\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>って、めくったときに\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>るか、という\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるのが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>かったです。","zh":"如果想看平面设计，我可以介绍毕业作品《四季の花綴り》。这是一本翻着看四季的压花和汉诗的书。做这本书时，我觉得有意思的是，读者翻开一页会先看到什么，接下来又会看到什么。"}],"source":""},{"id":"tuck-8","title":"介绍说完","page":"","blocks":[{"type":"speech","ja":"\u003cruby>以上\u003crt>いじょう\u003c/rt>\u003c/ruby>が、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>です。\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になるところがあれば、そのページをもう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>お\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せします。","zh":"以上是前两件作品。如果有想多看一眼的地方，我可以再翻回那页。"}],"source":""}]}],"links":[{"id":"p17","label":"MORI · P17"},{"id":"p34","label":"TUCK · P34"},{"id":"p77","label":"平面设计 · P77"}]},{"id":"questions","label":"问答","kind":"flow","groups":[{"id":"answers","label":"轮到对方问你","items":[{"id":"answers-1","title":"「今日はどんなことを聞いてみたいですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>はどんなことを\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいですか。","zh":""},{"type":"note","ja":"","zh":"只有对方邀请你说时用。一句说清想听的实际工作，不重复公司介绍。"},{"type":"speech","ja":"PAY IDのデザイナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>どんな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をされているのか、チームでの\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>め\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>も\u003cruby>含\u003crt>ふく\u003c/rt>\u003c/ruby>めて\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいです。","zh":"我想了解 PAY ID 的设计师平时在做哪些工作，也想听听团队通常怎样一起做事。"}],"source":""},{"id":"answers-2","title":"「どうしてUI/UXを始めたんですか。」","page":"","blocks":[{"type":"prompt","ja":"どうしてUI/UXを\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたんですか。","zh":""},{"type":"note","ja":"","zh":"对方在问从平面转到界面的起点。用自己在读研期间开始自学的顺序讲。"},{"type":"speech","ja":"\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ってから、\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>と\u003cruby>並行\u003crt>へいこう\u003c/rt>\u003c/ruby>して、\u003cruby>動画\u003crt>どうが\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ながらアプリの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>でも\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ってみたのが\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>まりです。\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>では\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るときに、ページをめくって\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>るかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていました。アプリだと、\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>た\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>がどこを\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>すかで、その\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>も\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わりますよね。そこまで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るのが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>くて、\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けています。","zh":"我是在读研以后开始的。一边做研究，一边看视频，自己试着做App界面。本科做书时，我会想读者翻开一页最先看见什么。做App时，用户点在哪里还会改变接下来看到的内容。我觉得连这一步也能一起设计很有意思，就继续学下去了。"}],"source":""},{"id":"answers-3","title":"「BASEに興味を持ったきっかけは何ですか。」","page":"","blocks":[{"type":"prompt","ja":"BASEに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>を\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ったきっかけは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"按从前认识并使用、收到面谈机会、去读官方文章的顺序讲。"},{"type":"speech","ja":"PAY IDは\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>から\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>っていて、ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をするときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったこともあります。\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>お\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しできることになって、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>からは\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えないところで、どんなふうに\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>られているのか\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったんです。それでBASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、PAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>した\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しやすくなるようにしながら、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>の\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>が\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えないところまで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていたのが\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>りました。そこから、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>として\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>っていたサービスを、\u003cruby>今度\u003crt>こんど\u003c/rt>\u003c/ruby>は\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>る\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>から\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"我之前就知道 PAY ID，也在网购下单时用过。这次有机会和你们聊，我想弄清平时作为用户看不到的地方，这个产品是怎样做出来的。于是去看 BASE 集团官方 note，读到一篇讲 PAY ID 商品搜索改版的文章。印象很深的是，你们想让买家更好找商品，还会考虑怎样让店家不用额外多做事情。这让我想从做产品的一侧，重新认识自己用过的这个服务。BASE 集团官方 note｜PAY ID 商品搜索改版访谈"}],"source":"https://note.com/base_group/n/n39a643caaa7d"},{"id":"answers-4","title":"「BASEのどこに魅力を感じましたか。」","page":"","blocks":[{"type":"prompt","ja":"BASEのどこに\u003cruby>魅力\u003crt>みりょく\u003c/rt>\u003c/ruby>を\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じましたか。","zh":""},{"type":"note","ja":"","zh":"先说出最看重的视角，再用搜索改版的一个实际做法举证。"},{"type":"speech","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすさを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるときに、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>どんな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をしているかまで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ているところに\u003cruby>惹\u003crt>ひ\u003c/rt>\u003c/ruby>かれました。BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDの\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>\u003cruby>改善\u003crt>かいぜん\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んだんです。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>絞\u003crt>しぼ\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>みやすくするために、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>分類\u003crt>ぶんるい\u003c/rt>\u003c/ruby>してもらう\u003cruby>代\u003crt>か\u003c/rt>\u003c/ruby>わりに、おすすめ\u003cruby>機能\u003crt>きのう\u003c/rt>\u003c/ruby>で\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っていたデータを\u003cruby>活用\u003crt>かつよう\u003c/rt>\u003c/ruby>したそうですね。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>から\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ているだけでは、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>の\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>までは\u003cruby>想像\u003crt>そうぞう\u003c/rt>\u003c/ruby>していませんでした。そこまで\u003cruby>含\u003crt>ふく\u003c/rt>\u003c/ruby>めて\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるところが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>いですし、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>もそういう\u003cruby>視点\u003crt>してん\u003c/rt>\u003c/ruby>で\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をしてみたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"最吸引我的是，团队在想怎么让买家用得更顺时，也会去看店家平时要怎样工作。我在 BASE 集团官方 note 读到 PAY ID 搜索改版。为了让买家容易筛选，团队复用了推荐功能的分类数据，省得店家把商品逐件分类。我作为买家看界面时，原来没有想到背后还有店家的工作。我很喜欢你们把这些也放在一起考虑，也想用这样的视角去做设计。BASE 集团官方 note｜PAY ID 商品搜索改版访谈"}],"source":"https://note.com/base_group/n/n39a643caaa7d"},{"id":"answers-5","title":"「PAY IDならではだと思ったところは？」","page":"","blocks":[{"type":"prompt","ja":"PAY IDならではだと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったところは？","zh":""},{"type":"note","ja":"","zh":"从自己收唱片的兴趣讲，重点是下次还有理由回到同一家店。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>には、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>ったお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>と\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>のあともつながっていられるところが、PAY IDの\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなところです。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>はレコードを\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めるのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>している\u003cruby>盤\u003crt>ばん\u003c/rt>\u003c/ruby>があると、いくつかのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>軒\u003crt>けん\u003c/rt>\u003c/ruby>ずつ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>していないか\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるのは\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>ですよね。PAY IDなら、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になるお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をアプリでフォローして、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しく\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>したときにまた\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>に\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>けます。\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いを\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>ませるだけの\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べて、「あのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>、また\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>に\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>こう」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>えるところまでつながっているのが、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>のレコードの\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っていると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。","zh":"我喜欢 PAY ID 的地方是，买完之后还可以和喜欢的店保持联系。我喜欢收集唱片，想找某张唱片时，挨家打开几家店看有没有到货，挺费劲的。PAY ID 可以在 App 里关注自己在意的店，有新货时再回去看。对我来说，购物除了把钱付完，还会想到「那家店，我过一阵想再去看看」。这一点很合我的购物方式。PAY ID 官方｜关注店铺与到货提醒"}],"source":"https://payid.jp/"},{"id":"answers-6","title":"「UI/UXでは、今どんなことに興味がありますか。」","page":"","blocks":[{"type":"prompt","ja":"UI/UXでは、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どんなことに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>がありますか。","zh":""},{"type":"note","ja":"","zh":"沿用已确认的设计兴趣，用普通人能想象的日常情境展开。"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は、\u003cruby>仕組\u003crt>しく\u003c/rt>\u003c/ruby>みが\u003cruby>複雑\u003crt>ふくざつ\u003c/rt>\u003c/ruby>でも、\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>判断\u003crt>はんだん\u003c/rt>\u003c/ruby>して\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>められるようにすることに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>があります。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、オンラインで\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>かの\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きをするとき、\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>用意\u003crt>ようい\u003c/rt>\u003c/ruby>するか、\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあとは\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>てばいいかが\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるだけで、だいぶ\u003cruby>安心\u003crt>あんしん\u003c/rt>\u003c/ruby>できますよね。\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>仕組\u003crt>しく\u003c/rt>\u003c/ruby>みでも、\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>な\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>を\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて、\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたい\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せることで、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすさも、そのときの\u003cruby>気持\u003crt>きも\u003c/rt>\u003c/ruby>ちも\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わる。そこが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>いです。","zh":"我现在感兴趣的是，即使背后的流程复杂，第一次用的人也能自己判断、顺利往下办。比如第一次在网上办手续时，只要一开始就知道要准备什么，提交以后知道接下来等什么，心里就会踏实很多。同样一套流程，把信息拆开、按人需要知道的顺序呈现，操作体验和当时的心情都会变。我觉得这点很有意思。"}],"source":""},{"id":"answers-7","title":"「どんな仕事に関わってみたいですか。」","page":"","blocks":[{"type":"prompt","ja":"どんな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>に\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わってみたいですか。","zh":""},{"type":"note","ja":"","zh":"按招聘页的研修、了解产品、跟前辈做小任务，再讲本人想发展的工作。最初的具体任务可以现场请教成原。"},{"type":"speech","ja":"まずは\u003cruby>研修\u003crt>けんしゅう\u003c/rt>\u003c/ruby>と\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>との\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>通\u003crt>つう\u003c/rt>\u003c/ruby>じて、PAY IDを\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>とお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>がそれぞれどう\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っているかを\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいです。\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページで、\u003cruby>入社\u003crt>にゅうしゃ\u003c/rt>\u003c/ruby>して\u003cruby>半年\u003crt>はんとし\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>年\u003crt>ねん\u003c/rt>\u003c/ruby>ほどは、\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>のもとで\u003cruby>小\u003crt>ちい\u003c/rt>\u003c/ruby>さなデザインの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>を\u003cruby>積\u003crt>つ\u003c/rt>\u003c/ruby>むと\u003cruby>拝見\u003crt>はいけん\u003c/rt>\u003c/ruby>しました。そこで、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ることに\u003cruby>加\u003crt>くわ\u003c/rt>\u003c/ruby>えて、なぜ\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>になっているのか、\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>とどう\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>して\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めるのかも\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>びたいです。そのうえで、いずれは\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>のあとに、\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>や\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いの\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすい\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>づくりにも\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わりたいです。","zh":"我想先通过研修和跟前辈一起做事，了解买家和店家各自怎么用 PAY ID。招聘页写到，入职后的半年到一年左右，会在前辈指导下从小的设计任务做起。除了动手做界面，我也想弄懂现在为什么是这个做法，以及实际工作里怎么和同事商量、把事情推下去。在这些基础上，以后我想参与购买后用来查看订单和付款状态的界面设计。PAY ID 28 卒设计师募集页"}],"source":"https://open.talentio.com/r/1/c/binc/pages/128919"},{"id":"answers-8","title":"「買い物のあとの、どんなところが気になりますか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>のあとの、どんなところが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になりますか。","zh":""},{"type":"note","ja":"","zh":"对方愿意多听时，用平时买东西的情境讲清楚。"},{"type":"speech","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>ったあとに、「\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どうなっていて、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>は\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>かする\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>があるのか」がすぐ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かると、\u003cruby>安心\u003crt>あんしん\u003c/rt>\u003c/ruby>できると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>したあとにもう\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>つだけでいいのか、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しておくことがあるのか。その\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いが\u003cruby>自然\u003crt>しぜん\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わる\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えてみたいです。","zh":"买完之后，如果一眼就能知道「现在到哪一步，我需要做什么吗」，我觉得人会放心很多。比如下单后，是等通知就好，还是有一件事得先自己确认。我想做能把这个区别自然说清楚的界面。"}],"source":""},{"id":"answers-9","title":"「大学院では、何を研究しているんですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>では、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>しているんですか。","zh":""},{"type":"note","ja":"","zh":"先讲想传达给谁，只用一句解释研究对象，再交代自己怎么用文字与图形把它说清楚。"},{"type":"speech","ja":"\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>の\u003cruby>伝統\u003crt>でんとう\u003c/rt>\u003c/ruby>\u003cruby>文化\u003crt>ぶんか\u003c/rt>\u003c/ruby>を、\u003cruby>日本\u003crt>にっぽん\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にも\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすく\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えるためのデザインを\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>しています。\u003cruby>題材\u003crt>だいざい\u003c/rt>\u003c/ruby>は、\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>で\u003cruby>昔\u003crt>むかし\u003c/rt>\u003c/ruby>から、お\u003cruby>守\u003crt>まも\u003c/rt>\u003c/ruby>りのように\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>われてきたものです。\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>にも「\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>のために\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>われていたのか」が\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるように、\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>と\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>を\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>して、どんな\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せると\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすいかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えています。\u003cruby>最終的\u003crt>さいしゅうてき\u003c/rt>\u003c/ruby>には、\u003cruby>日本\u003crt>にっぽん\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>の\u003cruby>文化\u003crt>ぶんか\u003c/rt>\u003c/ruby>に\u003cruby>触\u003crt>ふ\u003c/rt>\u003c/ruby>れるきっかけになるような\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>にまとめたいです。","zh":"我研究的是，怎么通过设计把中国的传统文化讲给日本读者听。我的题材是中国过去用来祈愿、类似护身符的东西。我会整理文字和图形，再想先展示什么、后展示什么，才能让第一次看到它的人明白它原来是做什么用的。最后，我希望把它做成一本书，让日本读者能从这本书接触到一点中国文化。"}],"source":""},{"id":"answers-10","title":"「学生時代に力を入れたことは何ですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>学生時代\u003crt>がくせいじだい\u003c/rt>\u003c/ruby>に\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れたことは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"简短讲清从制作到你主动提出、推进策划的变化，用团队实际采取的做法收束。"},{"type":"speech","ja":"\u003cruby>美大\u003crt>びだい\u003c/rt>\u003c/ruby>\u003cruby>受験\u003crt>じゅけん\u003c/rt>\u003c/ruby>の\u003cruby>予備校\u003crt>よびこう\u003c/rt>\u003c/ruby>の\u003cruby>広報\u003crt>こうほう\u003c/rt>\u003c/ruby>で、\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>歩\u003crt>ほ\u003c/rt>\u003c/ruby>\u003cruby>踏\u003crt>ふ\u003c/rt>\u003c/ruby>み\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>んで、SNSの\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>を\u003cruby>提案\u003crt>ていあん\u003c/rt>\u003c/ruby>したことです。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>宣伝\u003crt>せんでん\u003c/rt>\u003c/ruby>\u003cruby>物\u003crt>ぶつ\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っていたんですが、\u003cruby>受験生\u003crt>じゅけんせい\u003c/rt>\u003c/ruby>と\u003cruby>保護者\u003crt>ほごしゃ\u003c/rt>\u003c/ruby>では、\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいことが\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うと\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じました。それで、それぞれに\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>けるかを\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>して、\u003cruby>運営\u003crt>うんえい\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>に\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>しました。その\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>は、チームで\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>と\u003cruby>投稿\u003crt>とうこう\u003c/rt>\u003c/ruby>を\u003cruby>分担\u003crt>ぶんたん\u003c/rt>\u003c/ruby>して、\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>したあとの\u003cruby>反応\u003crt>はんのう\u003c/rt>\u003c/ruby>を\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>に\u003cruby>反映\u003crt>はんえい\u003c/rt>\u003c/ruby>するところまで\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>しました。","zh":"我在美术升学机构做宣传时，从制作往前走了一步，主动提出做社媒策划。开始我做宣传物，后来感觉考生和家长关心的事不同。于是我先梳理分别要给他们什么信息，再去和负责人商量。之后团队分工制作和发布，我也负责看发布后的反应，再把它用到下一轮策划里。"}],"source":""},{"id":"answers-11","title":"「PAY IDは使ったことがありますか。」","page":"","blocks":[{"type":"prompt","ja":"PAY IDは\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがありますか。","zh":""},{"type":"note","ja":"","zh":"第一口先说自己在网购下单时使用过，再说结账时作为消费者看重的是什么。商家文章是另一个可核的买家经历。"},{"type":"speech","ja":"はい、ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をして、\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>するときにPAY IDを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがあります。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>としていいなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うのは、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わっても、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じアカウントで\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>できるところです。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>うものを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったあとに、また\u003cruby>住所\u003crt>じゅうしょ\u003c/rt>\u003c/ruby>を\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>から\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れる\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>が\u003cruby>減\u003crt>へ\u003c/rt>\u003c/ruby>るだけでも、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>まで\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>みやすいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。","zh":"用过。我在网购下单时用过 PAY ID。作为买家，我喜欢的一点是，换到支持 PAY ID 的另一家店，也能用同一个账号下单。东西已经挑好了，少一步从头填地址，结账就更顺一些。PAY ID 官方｜结账时复用收货资料"}],"source":"https://payid.jp/"},{"id":"answers-12","title":"「買う側として、どういう使い方が自分に合っていると思いますか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>として、どういう\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っていると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いますか。","zh":""},{"type":"note","ja":"","zh":"对方想多听时，按找唱片、下单、回去等上新的顺序讲。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>はレコードを\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めるのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなので、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたあとも、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>るかが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になるんです。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で\u003cruby>欲\u003crt>ほ\u003c/rt>\u003c/ruby>しい\u003cruby>盤\u003crt>ばん\u003c/rt>\u003c/ruby>があれば、PAY IDでそのまま\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>できる。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つからなくても、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をフォローしておけば、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しいものが\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったときにまた\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>に\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>けます。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>でいうと、M’s homelifeという\u003cruby>器\u003crt>うつわ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>のブログで、\u003cruby>店主\u003crt>てんしゅ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、ご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>もInstagramで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけた\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じアカウントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えて\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だったと\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>も、\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>品\u003crt>しな\u003c/rt>\u003c/ruby>ぞろえを\u003cruby>楽\u003crt>たの\u003c/rt>\u003c/ruby>しみながら、それぞれのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>から\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きしなくていい、というところが\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。","zh":"我喜欢收集唱片，所以找到一家有意思的店以后，也会想下次会进什么。刚好有我想要的唱片，就可以用 PAY ID 下单。现在没找到，也可以先关注这家店，等有新货再回来。结账这一步，我在餐具店 M’s homelife 的博客读到，店主自己从 Instagram 找到不同店铺买东西时，也觉得能用同一账号很方便。站在买家的角度，我可以各逛各的、看不同店的选品，真到下单时又不用每家都从头填。我觉得这一点好用。M’s homelife 店主以买家身份写的使用记录"}],"source":"https://www.mshomelife.com/blog/2025/10/12/140904"},{"id":"answers-13","title":"「お店の方にとっては、どう役に立つと思いましたか。」","page":"","blocks":[{"type":"prompt","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にとっては、どう\u003cruby>役\u003crt>やく\u003c/rt>\u003c/ruby>に\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>つと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いましたか。","zh":""},{"type":"note","ja":"","zh":"对方问到店家，给BASE对外说的做法和实际运营例子。"},{"type":"speech","ja":"BASE Uの\u003cruby>対談\u003crt>たいだん\u003c/rt>\u003c/ruby>では、\u003cruby>月末\u003crt>げつまつ\u003c/rt>\u003c/ruby>の\u003cruby>金曜日\u003crt>きんようび\u003c/rt>\u003c/ruby>に\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>して、その\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>を\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>っている\u003cruby>店主\u003crt>てんしゅ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>がいました。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>には\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>を\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>るきっかけで、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にはまた\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>に\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>てもらえるきっかけになりますよね。\u003cruby>事業責任者\u003crt>じぎょうせきにんしゃ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>も、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>のWebサイトやSNSでつながってもいいと\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>していて、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>とお\u003cruby>客\u003crt>きゃく\u003c/rt>\u003c/ruby>さんの\u003cruby>関係\u003crt>かんけい\u003c/rt>\u003c/ruby>を\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けるところを\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしていると\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じました。","zh":"BASE U的公开对谈里，一位店主会在月末周五上货，并配合那一天发通知。这样买家知道什么时候有新货，店铺也有机会让顾客回来看看。业务负责人也说，下次通过店自己的网页或社媒继续联系也好。我从这里感受到，他们看重的是店家和买家能把关系继续下去。BASE U｜业务负责人与店主对谈"}],"source":"https://baseu.jp/51399"},{"id":"answers-14","title":"「気になったところや、こうなったらいいと思うことは？」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったところや、こうなったらいいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うことは？","zh":""},{"type":"note","ja":"","zh":"对方若追问设计建议，讲有明确来源的同一个案例。给一个可试的方向。"},{"type":"speech","ja":"レコードを\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>のnoteでは、\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるのは\u003cruby>助\u003crt>たす\u003c/rt>\u003c/ruby>かるけれど、\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>いとも\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれていました。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>のヘルプでは、\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>の\u003cruby>種類\u003crt>しゅるい\u003c/rt>\u003c/ruby>ごとに\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>できると\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しました。フォローしたときに\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かって、\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なものを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>べると、\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>を\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>らずに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けやすいのかなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。まず\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけられるか、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらいたいです。","zh":"那位买唱片的人在note里说，知道店铺到货是有帮助的，同时也嫌通知多。我查到现在的帮助页说明，可以按通知类型设置。我在想，如果关注时就能知道会收到哪些通知，顺手选自己需要的，可能更容易留下有用的提醒。我会先请用户试试看，能不能找到现有设置。买家的使用日记 · 现行通知帮助"}],"source":"https://note.com/sorata_note_a/n/nf25a6d71c06f"},{"id":"answers-15","title":"「今、会社を選ぶときに何を大事にしていますか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶときに\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしていますか。","zh":""},{"type":"note","ja":"","zh":"说你衡量工作的方法。这里是比较公司时的判断，BASE的具体吸引点用前面的回答。"},{"type":"speech","ja":"\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が、どこで\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>っているかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるところから\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>われるかを\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしています。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったあとも、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っている\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>反応\u003crt>はんのう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、エンジニアなど\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>う\u003cruby>専門\u003crt>せんもん\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>と\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>せるといいなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っています。",
