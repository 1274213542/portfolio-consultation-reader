homelifeという\u003cruby>器\u003crt>うつわ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>のブログで、\u003cruby>店主\u003crt>てんしゅ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、ご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>の\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>について\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていました。Instagramで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にBASEを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っているところが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>くて、PAY IDがあれば、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わっても\u003cruby>何度\u003crt>なんど\u003c/rt>\u003c/ruby>も\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れずに\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>むそうです。\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>回\u003crt>まわ\u003c/rt>\u003c/ruby>る\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>には、こういうところが\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>なんだなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"有。我在一家叫 M’s homelife 的餐具店博客里，读到店主写自己当买家的经历。她在 Instagram 发现的店有不少都用 BASE，有 PAY ID 以后，换店购物也省得反复填同样的信息。对于本来就喜欢逛不同店的人，这点很实在。"}],"sources":[{"label":"M’s homelife 店主以买家身份写的使用记录","url":"https://www.mshomelife.com/blog/2025/10/12/140904"}]},{"id":"answers-19","title":"「なぜ、デザインが好きなのですか。」","page":"","blocks":[{"type":"prompt","ja":"なぜ、デザインが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなのですか。","zh":""},{"type":"note","ja":"","zh":"可以直接用 Goodpatch 小窗里已经熟悉的回答。问到设计本身，讲你的设计观就够了。"},{"type":"speech","ja":"そうですね。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がデザインを\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>いと\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じるのは、すでにあるものを\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>分解\u003crt>ぶんかい\u003c/rt>\u003c/ruby>して、\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせ\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すことで、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しい\u003cruby>価値\u003crt>かち\u003c/rt>\u003c/ruby>を\u003cruby>生\u003crt>う\u003c/rt>\u003c/ruby>み\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>せるところです。\u003cruby>世\u003crt>よ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>には、\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>がかかっても\u003cruby>避\u003crt>さ\u003c/rt>\u003c/ruby>けられないことや、\u003cruby>複雑\u003crt>ふくざつ\u003c/rt>\u003c/ruby>な\u003cruby>仕組\u003crt>しく\u003c/rt>\u003c/ruby>みがあります。そうしたものも、デザインによって\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しでも\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れやすく、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすい\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にできると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。\u003cruby>手順\u003crt>てじゅん\u003c/rt>\u003c/ruby>の\u003cruby>効率\u003crt>こうりつ\u003c/rt>\u003c/ruby>や、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うときの\u003cruby>気持\u003crt>きも\u003c/rt>\u003c/ruby>ちまで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるところに\u003cruby>魅力\u003crt>みりょく\u003c/rt>\u003c/ruby>を\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じています。","zh":"我觉得设计有意思，是因为可以把已有的东西拆开，再重新组合，从里面创造出新的价值。生活里有些事很麻烦，可我们总得去做，也有些东西本身就很复杂。我觉得，通过设计，可以让这些事变得容易接受一点，做起来也顺手一点。我喜欢的是，除了琢磨怎样让步骤更省事，还能顾及人在使用时是什么心情。"}],"sources":[]}]},{"id":"feedback","label":"听完反馈怎么接","items":[{"id":"feedback-1","title":"作品刚讲完、还没收到具体建议","page":"","blocks":[{"type":"speech","ja":"\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってもいいですか。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>で、どうしてこのデザインにしたのか、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>きたかったところはありましたか。","zh":"可以请教您一个问题吗？听了刚才的介绍，关于「为什么这么设计」，有没有哪一处您还想让我多讲一点？"}],"sources":[]},{"id":"feedback-2","title":"比如，对方说TUCK的场景讲得太快","page":"","blocks":[{"type":"speech","ja":"ありがとうございます。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んだところを、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しゆっくりお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しするとよさそうですね。そうすると、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>だけが\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たときに、なぜスリッパのほうを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>したのかも\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりそうです。","zh":"谢谢。我可以把一开始袜子和拖鞋两样都交给机器人的那段，稍微讲慢一点。这样后面只收到袜子的通知时，为什么要把拖鞋放在前面，听起来应该也更容易理解。"}],"sources":[]},{"id":"feedback-3","title":"如果意见已经具体，到这里就可以停。如果对方只说「もう少しプロセスがあるといい」，可以请他举一处","page":"","blocks":[{"type":"note","ja":"","zh":"如果意见已经具体，到这里就可以停。如果对方只说「もう少しプロセスがあるといい」，可以请他举一处。"},{"type":"speech","ja":"ありがとうございます。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、テーマを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>経緯\u003crt>けいい\u003c/rt>\u003c/ruby>と、\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>だと、どちらをもう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいですか。","zh":"谢谢。比如一开始怎么选定这个主题，以及后来为什么从两种界面方案里选了这一版，这两部分，您更想多听哪一块？"}],"sources":[]}]}],"links":[{"id":"answers-1","label":"今日はどんなことを聞いてみたいですか。"},{"id":"answers-2","label":"どうしてUI/UXを始めたんですか。"},{"id":"answers-3","label":"BASEに興味を持ったきっかけは何ですか。"},{"id":"answers-4","label":"BASEのどこに魅力を感じましたか。"},{"id":"answers-5","label":"PAY IDならではだと思ったところは？"},{"id":"answers-6","label":"UI/UXでは、今どんなことに興味がありますか。"},{"id":"answers-7","label":"どんな仕事に関わってみたいですか。"},{"id":"answers-8","label":"買い物のあとの、どんなところが気になりますか。"},{"id":"answers-9","label":"大学院では、何を研究しているんですか。"},{"id":"answers-10","label":"学生時代に力を入れたことは何ですか。"},{"id":"answers-11","label":"PAY IDは使ったことがありますか。"},{"id":"answers-12","label":"買う側として、どういう使い方が自分に合っていると思いますか。"},{"id":"answers-13","label":"お店の方にとっては、どう役に立つと思いましたか。"},{"id":"answers-14","label":"気になったところや、こうなったらいいと思うことは？"},{"id":"answers-15","label":"今、会社を選ぶときに何を大事にしていますか。"},{"id":"answers-16","label":"今後、選考に進むことは考えていますか。"},{"id":"answers-18","label":"ほかにも、使っている方の話で印象に残ったものはありますか。"},{"id":"answers-19","label":"なぜ、デザインが好きなのですか。"}]},{"id":"reverse","label":"逆質問","kind":"reverse","groups":[{"id":"company-talk","label":"逆質問","items":[{"id":"q24","title":"团队平时怎么过一天","page":"","blocks":[{"type":"speech","ja":"\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんがnoteに\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれた、PAY IDのデザインチームの\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。アプリで\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すところから\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いまで、\u003cruby>幅広\u003crt>はばひろ\u003c/rt>\u003c/ruby>く\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わっているんですね。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>のチームだと、デザイナーの\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>日\u003crt>にち\u003c/rt>\u003c/ruby>ってどんな\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じですか。","zh":"我读了您在 note 上写的 PAY ID 设计团队介绍。从用户在 App 里找商品到付款，设计师都会参与。现在团队里的设计师，平常一天大概是怎么过的呢？"},{"type":"reply","ja":"その\u003cruby>小\u003crt>ちい\u003c/rt>\u003c/ruby>さな\u003cruby>改善\u003crt>かいぜん\u003c/rt>\u003c/ruby>って、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>は\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>がきっかけで\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>まるんですか。","zh":"那平时这些小改动，一般是怎么提出来的呢？","cue":"如果他说做长期项目的同时也会做小改动，而且还没说改动是怎么来的"}],"sources":[{"label":"北村的 note｜PAY ID 设计团队介绍","url":"https://note.com/naomi_kun/n/n371a828258d9"}],"reverse":"24","audience":"北村"},{"id":"q13","title":"最初的方案怎么一起想","page":"","blocks":[{"type":"speech","ja":"BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>改善\u003crt>かいぜん\u003c/rt>\u003c/ruby>したときのインタビューを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>価格\u003crt>かかく\u003c/rt>\u003c/ruby>で\u003cruby>絞\u003crt>しぼ\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>む\u003cruby>機能\u003crt>きのう\u003c/rt>\u003c/ruby>は、プロダクトマネージャーの\u003cruby>宮地\u003crt>みやじ\u003c/rt>\u003c/ruby>さんが\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>られたんですね。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しい\u003cruby>機能\u003crt>きのう\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるときは、チームの\u003cruby>皆\u003crt>みな\u003c/rt>\u003c/ruby>さんでどんなふうに\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>されているんですか。","zh":"我在 BASE 集团官方 note 读了商品搜索改版的访谈。原来按价格筛选的功能，最初的原型是产品经理宫地做的。平时要做一个新功能时，大家一般是怎么一起商量最初的方案的呢？"},{"type":"reply","ja":"\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にする\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>なんですね。それなら、まだ\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>になっていないアイデアも\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>しやすそうです。","zh":"原来还没画成界面就开始聊了。这样的话，还没成形的点子也比较容易拿出来讨论。","cue":"如果他说常常在画界面之前，几个人就坐下来一起聊"}],"sources":[{"label":"BASE 集团官方 note｜PAY ID 搜索改版三人访谈","url":"https://note.com/base_group/n/n39a643caaa7d"}],"reverse":"13","audience":"北村"},{"id":"q22","title":"什么时候感觉帮到了店家或买家","page":"","blocks":[{"type":"speech","ja":"BASE DESIGNERのnoteで、PAY IDのロゴを\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しくしたときのインタビューを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>と\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が\u003cruby>主役\u003crt>しゅやく\u003c/rt>\u003c/ruby>で、PAY IDはそれを\u003cruby>支\u003crt>ささ\u003c/rt>\u003c/ruby>える\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>だというお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>が\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんが\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>の\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>で「お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>や\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>役\u003crt>やく\u003c/rt>\u003c/ruby>に\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>てたな」と\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じるのは、どんなときですか。","zh":"我在 BASE DESIGNER 的 note 读了您谈 PAY ID 换标的访谈。您说店家和买东西的人是主角，PAY ID 是在背后帮他们的。我很喜欢这个想法。在平常的工作里，什么时候您会觉得，自己的设计确实帮到了店家或者买家呢？"},{"type":"reply","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>から、どこが\u003cruby>助\u003crt>たす\u003c/rt>\u003c/ruby>かったのかまで\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けるんですね。そういう\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>くのはうれしいですね。","zh":"原来连具体帮上了什么忙，都能听到店家亲口说。收到这样的反馈会很开心。","cue":"如果他说有店主在上线后联系团队，告诉他们具体帮上了什么忙"}],"sources":[{"label":"BASE DESIGNER 的 note｜北村谈 PAY ID 换标","url":"https://note.com/base_designteam/n/n7b73c9fc1785"}],"reverse":"22","audience":"北村"},{"id":"q35","title":"到办公室时怎么一起工作","page":"","blocks":[{"type":"speech","ja":"PAY IDの\u003cruby>新卒\u003crt>しんそつ\u003c/rt>\u003c/ruby>デザイナーの\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページで、\u003cruby>週\u003crt>しゅう\u003c/rt>\u003c/ruby>に3\u003cruby>日\u003crt>か\u003c/rt>\u003c/ruby>ほど\u003cruby>出社\u003crt>しゅっしゃ\u003c/rt>\u003c/ruby>する\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>と\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。オフィスで\u003cruby>顔\u003crt>かお\u003c/rt>\u003c/ruby>を\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせる\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>は、チームでどんなことを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>にすることが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>いですか。","zh":"我在 PAY ID 新卒设计师招聘页看到，目前预计每周大约三天到办公室。大家在办公室碰面时，一般会一起做些什么呢？"},{"type":"reply","ja":"\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>で\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られると、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったところをその\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>で\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けそうですね。","zh":"能坐在旁边一起看界面，有哪里想问，当场就能开口了。","cue":"如果他说同事会坐在旁边，一起看正在做的设计"}],"sources":[{"label":"PAY ID 28 卒设计师招聘页","url":"https://open.talentio.com/r/1/c/binc/pages/128919"}],"reverse":"35","audience":"北村"},{"id":"q25","title":"研修结束会从什么做起","page":"","blocks":[{"type":"speech","ja":"PAY IDの28\u003cruby>卒\u003crt>そつ\u003c/rt>\u003c/ruby>デザイナーの\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>研修\u003crt>けんしゅう\u003c/rt>\u003c/ruby>のあと、\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>と\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>小\u003crt>ちい\u003c/rt>\u003c/ruby>さなデザインの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めるとありましたが、\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えばどんな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>されていますか。","zh":"我读了 PAY ID 的 28 卒设计师招聘页。上面提到研修之后会跟着前辈，从小的设计任务做起。这里说的小任务，您能举个例子吗？"},{"type":"reply","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>と\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>ある\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すところからなんですね。\u003cruby>働\u003crt>はたら\u003c/rt>\u003c/ruby>き\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたときのことが\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>想像\u003crt>そうぞう\u003c/rt>\u003c/ruby>できました。","zh":"原来一开始可以和前辈一起，从改现有界面的一处做起。这样我就能想象刚进团队时会做什么了。","cue":"如果成原举例说会和前辈一起改一处现有界面"}],"sources":[{"label":"PAY ID 28 卒设计师招聘页","url":"https://open.talentio.com/r/1/c/binc/pages/128919"}],"reverse":"25","audience":"成原"},{"id":"q27","title":"新人怎样认识其他业务","page":"","blocks":[{"type":"speech","ja":"TECH HIREで、BASEが\u003cruby>新卒採用\u003crt>しんそつさいよう\u003c/rt>\u003c/ruby>を\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めた\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>について、\u003cruby>成原\u003crt>なりはら\u003c/rt>\u003c/ruby>さんのインタビューを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>事業\u003crt>じぎょう\u003c/rt>\u003c/ruby>を\u003cruby>越\u003crt>こ\u003c/rt>\u003c/ruby>えて\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>ができる\u003cruby>文化\u003crt>ぶんか\u003c/rt>\u003c/ruby>を\u003cruby>育\u003crt>そだ\u003c/rt>\u003c/ruby>てたい、というお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>が\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。PAY IDに\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったら、ほかのチームの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>る\u003cruby>機会\u003crt>きかい\u003c/rt>\u003c/ruby>はありそうですか。","zh":"我在 TECH HIRE 读了您谈 BASE 为什么开始新卒招聘的访谈。您提到，希望慢慢培养不同业务能一起合作的氛围。这点我印象很深。如果进入 PAY ID，有机会了解其他团队平时在做什么吗？"},{"type":"reply","ja":"\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったばかりでもその\u003cruby>会\u003crt>かい\u003c/rt>\u003c/ruby>に\u003cruby>参加\u003crt>さんか\u003c/rt>\u003c/ruby>できるんですね。ほかのチームにどんな\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がいるかも\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>れそうです。","zh":"原来刚入职也能参加这样的分享会。这样也有机会认识别的团队都有哪些同事。","cue":"如果成原提到有团队分享会，并说新人也能参加"}],"sources":[{"label":"TECH HIRE｜成原谈 BASE 为什么开始新卒招聘","url":"https://techhire.trackrecords.co.jp/media/base"}],"reverse":"27","audience":"成原"},{"id":"q39","title":"准备作品集时该练什么","page":"","blocks":[{"type":"speech","ja":"PAY IDの\u003cruby>新卒\u003crt>しんそつ\u003c/rt>\u003c/ruby>デザイナーの\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページで、ポートフォリオには、\u003cruby>調査\u003crt>ちょうさ\u003c/rt>\u003c/ruby>や\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えた\u003cruby>過程\u003crt>かてい\u003c/rt>\u003c/ruby>も\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せてほしいとありました。\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>に\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けて\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>も\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>の\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>を\u003cruby>練習\u003crt>れんしゅう\u003c/rt>\u003c/ruby>したいのですが、\u003cruby>学生\u003crt>がくせい\u003c/rt>\u003c/ruby>からどんな\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>があると、その\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>え\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりやすいですか。","zh":"我在 PAY ID 新卒设计师招聘页看到，你们希望作品集里也写清做过哪些调研、是怎样考虑各个界面之间的衔接的。我想为申请练习一下作品介绍。从您听学生讲的角度，听到什么内容，会更容易了解这个人的想法呢？"},{"type":"reply","ja":"ありがとうございます。\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>見返\u003crt>みかえ\u003c/rt>\u003c/ruby>すときに、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>がどこで\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>って、なぜその\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだのかも\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>してみます。","zh":"谢谢。我再看自己的作品时，会把当时在哪里犹豫过、为什么最终选了这个方案也整理一下。","cue":"如果成原建议不要只讲最后选了什么，还可以讲当时为什么这么选"}],"sources":[{"label":"PAY ID 28 卒设计师招聘页","url":"https://open.talentio.com/r/1/c/binc/pages/128919"}],"reverse":"39","audience":"成原"},{"id":"q37","title":"刚才介绍作品哪里还想多听","page":"","blocks":[{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>の\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>で、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>詳\u003crt>くわ\u003c/rt>\u003c/ruby>しく\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたかったところはありますか。","zh":"刚才听我讲作品时，有没有哪一处您还想听我多讲一点？"},{"type":"reply","ja":"ありがとうございます。MORIで\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>したのは、ネットで\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>って、\u003cruby>一着\u003crt>いっちゃく\u003c/rt>\u003c/ruby>だけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>したい\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>です。クーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っているので、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るかを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたい、という\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>です。","zh":"谢谢。拿 MORI 来说，我设想的是这样一位买家，网购买了两件衣服，只打算退一件。买的时候用了优惠券和积分，所以他想先算清楚到底能退多少。","cue":"如果北村指着 MORI 说，想先知道谁会在什么情况下用"}],"sources":[],"reverse":"37","audience":"北村"},{"id":"q29","title":"想申请时，下一步怎么走","page":"","blocks":[{"type":"speech","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>お\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>って、PAY IDのデザイナーの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>にますます\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>が\u003cruby>湧\u003crt>わ\u003c/rt>\u003c/ruby>きました。28\u003cruby>卒\u003crt>そつ\u003c/rt>\u003c/ruby>の\u003cruby>選考\u003crt>せんこう\u003c/rt>\u003c/ruby>に\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>したいのですが、このあとどう\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めたらいいですか。","zh":"今天听你们聊过以后，我对 PAY ID 设计师的工作更感兴趣了。我想参加 28 卒选考，接下来应该怎么做呢？"},{"type":"reply","ja":"\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりました。\u003cruby>作品集\u003crt>さくひんしゅう\u003c/rt>\u003c/ruby>を\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>して、\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページから\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>します。ありがとうございます。","zh":"明白了，我会准备好作品集，从招聘页申请。谢谢您。","cue":"如果成原说从招聘页提交作品集就可以"}],"sources":[],"reverse":"29","audience":"成原"},{"id":"q15","title":"什么时候值得做个能动的原型","page":"","blocks":[{"type":"speech","ja":"BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>改善\u003crt>かいぜん\u003c/rt>\u003c/ruby>したときに、AIで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>った\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ながら\u003cruby>開発\u003crt>かいはつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>と\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>されたと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>の\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>では、どういうときに、\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>くものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ってから\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>することが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>いですか。","zh":"我在 BASE 集团官方 note 的 PAY ID 商品搜索改版访谈里读到，你们拿着用 AI 做的原型，和开发同事一起讨论。平时工作里，一般聊到什么事情时，您会觉得值得先做个能动的东西试试看？"},{"type":"reply","ja":"\u003cruby>指\u003crt>ゆび\u003c/rt>\u003c/ruby>で\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>かしたときの\u003cruby>感覚\u003crt>かんかく\u003c/rt>\u003c/ruby>は、\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>だけだと\u003cruby>想像\u003crt>そうぞう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれますよね。そこで\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>触\u003crt>さわ\u003c/rt>\u003c/ruby>ってみるんですね。","zh":"手指滑动时到底是什么感觉，光用语言讲，每个人想象的可能都不一样。原来这时你们会先做出来，让大家动手试试。","cue":"如果北村说像滑动手感这种细节只靠口头很难说清"}],"sources":[{"label":"BASE 集团官方 note｜PAY ID 搜索改版三人访谈","url":"https://note.com/base_group/n/n39a643caaa7d"}],"reverse":"15","audience":"北村"}]}],"links":[{"id":"q24","label":"团队平时怎么过一天"},{"id":"q13","label":"最初的方案怎么一起想"},{"id":"q22","label":"什么时候感觉帮到了店家或买家"},{"id":"q35","label":"到办公室时怎么一起工作"},{"id":"q25","label":"研修结束会从什么做起"},{"id":"q27","label":"新人怎样认识其他业务"},{"id":"q39","label":"准备作品集时该练什么"},{"id":"q37","label":"刚才介绍作品哪里还想多听"},{"id":"q29","label":"想申请时，下一步怎么走"},{"id":"q15","label":"什么时候值得做个能动的原型"}]},{"id":"closing","label":"收尾","kind":"flow","groups":[{"id":"closing","label":"临场和收尾","items":[{"id":"closing-1","title":"声音没听清","page":"","blocks":[{"type":"speech","ja":"すみません、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>のところを、もう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってもいいですか。","zh":"不好意思，最后那部分可以再说一遍吗？"}],"sources":[]},{"id":"closing-2","title":"听到了，但不确定对方问页面还是原型","page":"","blocks":[{"type":"speech","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>についてですか。それとも、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せている\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>のプロトタイプについてですか。","zh":"您问的是结果界面怎么做，还是最后展示的操作原型？"}],"sources":[]},{"id":"closing-3","title":"需要想一下","page":"","blocks":[{"type":"speech","ja":"\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えてもいいですか。","zh":"可以让我想一下吗？"}],"sources":[]},{"id":"closing-4","title":"快到时间、还有一个问题时","page":"","blocks":[{"type":"speech","ja":"あと\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つだけ、\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってもいいですか。","zh":"最后还可以问一个问题吗？"}],"sources":[]},{"id":"closing-5","title":"收尾。假如当天确实谈到用原型与开发沟通","page":"","blocks":[{"type":"speech","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>はありがとうございました。\u003cruby>特\u003crt>とく\u003c/rt>\u003c/ruby>に、\u003cruby>開発\u003crt>かいはつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>とプロトタイプを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>触\u003crt>さわ\u003c/rt>\u003c/ruby>りながら\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>されるというお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>が\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。\u003cruby>皆\u003crt>みな\u003c/rt>\u003c/ruby>さんが\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>どうやって\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をされているのか、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>想像\u003crt>そうぞう\u003c/rt>\u003c/ruby>できるようになりました。","zh":"今天谢谢两位。印象特别深的是，你们会和开发同事一起动手试原型，边试边商量。现在我更能想象大家平时是怎么一起做事的了。"}],"sources":[]}]}]}],"revision":"869272db41ce"}</script>
<script>
'use strict';
const data = JSON.parse(document.getElementById('reader-data').textContent);
const byId = id => document.getElementById(id);
const make = (tag, cls, text) => {
  const element = document.createElement(tag);
  if (cls) element.className = cls;
  if (text !== undefined) element.textContent = text;
  return element;
};
const root = document.documentElement;
const settings = byId('settings');
const params = new URLSearchParams(location.search);
root.classList.toggle('compact', params.get('compact') === '1');
root.classList.toggle('native-mini', params.get('nativeMini') === '1');
root.dataset.revision = data.revision;
const settingsKey = 'base-casual-reader-settings-v1';
const settingsFields = [
  {key:'font', label:'日文字号', prop:'--body-size', min:13, max:30, step:1, value:root.classList.contains('compact') ? 16 : 20, unit:'px'},
  {key:'leading', label:'行距', prop:'--leading', min:1.40, max:2.50, step:.05, value:root.classList.contains('compact') ? 1.75 : 2.05, unit:''},
  {key:'space', label:'字间距', prop:'--letters', min:0, max:.15, step:.01, value:.02, unit:'em'},
  {key:'rubySize', label:'假名大小', prop:'--ruby-size', min:.28, max:.75, step:.01, value:.42, unit:'em'},
  {key:'rubyGap', label:'假名与汉字间距', prop:'--ruby-gap', min:0, max:6, step:1, value:1, unit:'px'}
];
let stored = {};
try { stored = JSON.parse(localStorage.getItem(settingsKey) || '{}') || {}; } catch {}
const prefs = {zh:stored.zh !== false, ruby:stored.ruby !== false};
const fields = new Map();
let current;
let opener;
const indexed = [];
const itemsById = new Map();
const navBySection = new Map();
let settingsPosition;

function persist() {
  try { localStorage.setItem(settingsKey, JSON.stringify(prefs)); } catch {}
}
function applyPrefs() {
  root.classList.toggle('no-zh', !prefs.zh);
  root.classList.toggle('no-ruby', !prefs.ruby);
  byId('zh-button').setAttribute('aria-pressed', String(prefs.zh));
  byId('ruby-button').setAttribute('aria-pressed', String(prefs.ruby));
  settingsFields.forEach(field => {
    const val = prefs[field.key];
    root.style.setProperty(field.prop, val + field.unit);
    const {input, output} = fields.get(field.key);
    input.value = String(val);
    output.value = field.key === 'rubySize' ? Math.round(val * 100) + '%' : field.key === 'leading' ? val + ' 倍' : val + ' ' + field.unit;
  });
}
function buildControls() {
  settingsFields.forEach(field => {
    const raw = stored[field.key];
    prefs[field.key] = Number.isFinite(raw) ? Math.min(field.max, Math.max(field.min, raw)) : field.value;
    const wrap = make('div', 'control');
    const label = make('label', '', field.label);
    const input = make('input');
    input.type = 'range';
    input.id = 'setting-' + field.key;
    for (const attr of ['min','max','step']) input[attr] = String(field[attr]);
    label.htmlFor = input.id;
    const output = make('output');
    output.setAttribute('for',input.id);
    label.append(output);
    wrap.append(label,input);
    byId('settings-controls').append(wrap);
    fields.set(field.key,{input,output});
    input.addEventListener('input', () => {
      prefs[field.key] = Number(input.value);
      applyPrefs(); persist();
    });
  });
  applyPrefs();
}
function pageLinks(value) {
  const label = make('span','page');
  for (const token of String(value).split(/(P?\s*\d+)/gi)) {
    const number = /^P?\s*(\d+)$/i.exec(token);
    if (!number) { label.append(token); continue; }
    const link = make('a','',token);
    link.href = '#p' + number[1];
    link.setAttribute('aria-label','跳到第 ' + number[1] + ' 页');
    label.append(link);
  }
  return label;
}
function drawReader() {
  const fragment = document.createDocumentFragment();
  data.sections.forEach(section => {
    const outer = make('section', 'reader-section');
    outer.id = section.id;
    outer.tabIndex = -1;
    itemsById.set(section.id, {section, article:outer});
    const nav = make('a','',section.label);
    nav.href = '#' + section.id;
    byId('sections').append(nav);
    navBySection.set(section.id, nav);
    const head = make('div', 'section-head');
    head.append(make('h2','',section.label));
    outer.append(head);
    if (section.links?.length) {
      const index = make('nav','jump-list');
      index.setAttribute('aria-label', section.label + '直达');
      for (const item of section.links) {
        const link = make('a','',item.label);
        link.href = '#' + item.id;
        index.append(link);
      }
      outer.append(index);
    }
    section.groups.forEach(group => {
      if (!group.items.length) return;
      const groupEl = make('div', 'group');
      if (section.groups.length > 1 || group.label !== section.label) groupEl.append(make('h3','groupname',group.label));
      group.items.forEach(item => {
        const article = make('article','card');
        article.id = item.id; article.tabIndex = -1;
        const itemHead = make('div','card-head');
        const isPage = section.kind === 'pages';
        if (item.reverse) article.dataset.reverse = item.reverse;
        if (item.page) {
          itemHead.append(isPage ? make('span','page',item.page) : pageLinks(item.page));
        }
        itemHead.append(make('h4','',item.title));
        if (item.audience) itemHead.append(make('span','audience',item.audience));
        article.append(itemHead);
        item.blocks.forEach(block => {
          if (!block.ja && !block.zh) return;
          const row = make('div','block ' + block.type);
          if (block.page) {
            const cue = pageLinks(block.page);
            cue.classList.add('block-page');
            row.append(cue);
          }
          if (block.cue) row.append(make('p','reply-cue',block.cue));
          if (block.ja) {
            const ja = make('p','jp');
            ja.lang = 'ja';
            ja.innerHTML = block.ja;
            row.append(ja);
          }
          if (block.zh && (!block.ja || block.zh !== item.title)) {
            row.append(make('p','zh' + (block.ja ? ' translation':''),block.zh));
          }
          article.append(row);
        });
        for (const reference of item.sources || []) {
          const source = make('a','article-source',reference.label);
          source.href = reference.url;
          source.target = '_blank';
          source.rel = 'noopener noreferrer';
          article.append(source);
        }
        groupEl.append(article);
        const entry = {section,group,item,article};
        indexed.push(entry); itemsById.set(item.id,entry);
      });
      outer.append(groupEl);
    });
    fragment.append(outer);
  });
  byId('reader').append(fragment);
}
function identifyLocation(entry) {
  if (!entry || current === entry) return;
  if (current?.section !== entry.section) {
    navBySection.get(current?.section.id)?.removeAttribute('aria-current');
    navBySection.get(entry.section.id)?.setAttribute('aria-current','location');
  }
  current = entry;
}
let scrollQueued = false;
function track() {
  scrollQueued = false;
  if (!indexed.length || settings.open) return;
  const line = document.querySelector('.bar').getBoundingClientRect().bottom + 36;
  let lo = 0, hi = indexed.length;
  while (lo < hi) {
    const mid = (lo + hi) >>> 1;
    if (indexed[mid].article.getBoundingClientRect().top <= line) lo = mid + 1;
    else hi = mid;
  }
  const atEnd = Math.ceil(window.scrollY + window.innerHeight) >= document.documentElement.scrollHeight - 2;
  const entry = indexed[atEnd ? indexed.length - 1 : Math.max(0, lo - 1)];
  const next = indexed[lo];
  const nextSection = next && itemsById.get(next.section.id);
  identifyLocation(nextSection && next.section !== entry.section && nextSection.article.getBoundingClientRect().top <= line ? nextSection : entry);
}
function scheduleTrack() {
  if (!scrollQueued) { scrollQueued = true; requestAnimationFrame(track); }
}
function urlTarget() {
  try {
    const id = decodeURIComponent(location.hash.slice(1));
    return itemsById.get(id) || (/^q(?:0[1-9]|[1-3][0-9]|40)$/.test(id) ? itemsById.get('reverse') : undefined);
  } catch { return undefined; }
}
function goTo(entry, behavior='smooth', focus=true) {
  if (!entry) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (focus) entry.article.focus({preventScroll:true});
  entry.article.scrollIntoView({block:'start',behavior: reduce ? 'auto' : behavior});
  identifyLocation(entry);
}
function follow(id) {
  const entry = itemsById.get(id);
  if (!entry) return;
  if (location.hash !== '#' + encodeURIComponent(id)) history.pushState(null,'','#' + encodeURIComponent(id));
  goTo(entry);
}
function openSheet(dialog, trigger) {
  opener = trigger;
  if (dialog === settings && current) settingsPosition = {entry:current, top:current.article.getBoundingClientRect().top};
  dialog.showModal();
  document.body.classList.add('modal-open');
  dialog.querySelector('[data-close]').focus({preventScroll:true});
}
function closeSheet(dialog, restore=true) {
  dialog.close();
  document.body.classList.remove('modal-open');
  if (dialog === settings && settingsPosition) {
    window.scrollBy(0, settingsPosition.entry.article.getBoundingClientRect().top - settingsPosition.top);
    settingsPosition = undefined;
  }
  if (restore && opener) opener.focus({preventScroll:true});
}
byId('popup').addEventListener('click', () => {
  const url = new URL(location.href);
  url.searchParams.set('compact','1');
  const selected = urlTarget();
  const selectedTop = selected?.article.getBoundingClientRect().top;
  const headerBottom = document.querySelector('.bar').getBoundingClientRect().bottom;
  const dockTop = document.querySelector('.dock').getBoundingClientRect().top;
  const entry = selectedTop >= headerBottom - 2 && selectedTop < dockTop ? selected : current;
  url.hash = entry?.article.id || '';
  window.open(url.href,'base-casual-mini','popup,width=410,height=630,resizable=yes,scrollbars=yes');
});
buildControls();
drawReader();
identifyLocation(indexed[0]);
byId('settings-button').addEventListener('click',e => openSheet(settings,e.currentTarget));
for (const [id,key] of [['zh-button','zh'],['ruby-button','ruby']]) {
  byId(id).addEventListener('click', () => {
    const entry = current;
    const before = entry?.article.getBoundingClientRect().top;
    prefs[key] = !prefs[key]; applyPrefs(); persist();
    if (entry) window.scrollBy(0,entry.article.getBoundingClientRect().top-before);
    scheduleTrack();
  });
}
byId('reset').addEventListener('click', () => {
  settingsFields.forEach(f => {prefs[f.key] = f.value;});
  applyPrefs(); persist();
});
{
  const dialog = settings;
  dialog.querySelector('[data-close]').addEventListener('click',() => closeSheet(dialog));
  dialog.addEventListener('cancel', e => {e.preventDefault(); closeSheet(dialog);});
  dialog.addEventListener('click', e => {
    if (e.target !== dialog) return;
    const r = dialog.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeSheet(dialog);
  });
}
document.addEventListener('click',e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const id = decodeURIComponent(a.hash.slice(1));
  if (itemsById.has(id)) { e.preventDefault(); follow(id); }
});
window.addEventListener('scroll',scheduleTrack,{passive:true});
window.addEventListener('resize',scheduleTrack);
window.addEventListener('hashchange',() => {
  const entry = urlTarget();
  if (entry) goTo(entry,'auto');
  else if (!location.hash) window.scrollTo({top:0,behavior:'auto'});
});
requestAnimationFrame(() => {const entry=urlTarget(); if(entry) goTo(entry,'auto',false); else scheduleTrack();});
</script>
