<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131715">
<title>BASE · カジュアル面談</title>
<style>
:root {
  color-scheme: dark;
  --bg: #131715; --panel: #1b211e; --raised: #26302a; --bound: #38433c;
  --ink: #f2f4ed; --soft: #c0c9c1; --muted: #a1b0a5; --accent: #a5ddba;
  --body-size: 20px; --leading: 2.05; --letters: .015em; --ruby-size: .42em; --ruby-gap: 1px;
  --shell-width: 790px; --bar-top: 62px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-top) + env(safe-area-inset-top) + 12px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","PingFang SC","Noto Sans CJK SC",sans-serif; }
button,input,output { font: inherit; }
button { color: inherit; cursor: pointer; }
a { color: var(--accent); }
button,summary,a,input { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button { border: 0; }
[hidden] { display: none !important; }
.shell,main { max-width: var(--shell-width); margin-inline: auto; }
.bar { position: sticky; top: 0; z-index: 3; padding-top: env(safe-area-inset-top); background: var(--bg); border-bottom: 1px solid var(--bound); }
.bar .shell { min-height: var(--bar-top); display: flex; align-items: center; gap: 16px; padding: 9px 20px; }
.brand-mark { width: 4px; height: 27px; background: var(--accent); border-radius: 3px; flex: none; }
.brand { flex: none; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .015em; }
.brand small { color: var(--muted); display: block; font: 600 10px/1.4 -apple-system,BlinkMacSystemFont,sans-serif; letter-spacing: .12em; }
.reading-tools { margin-left: auto; display: flex; align-items: center; gap: 7px; }
.reading-tools button { min-height: 36px; border-radius: 7px; padding: 5px 9px; color: var(--soft); background: var(--raised); font-size: 13px; }
main { padding: 20px 20px 108px; padding-bottom: calc(108px + env(safe-area-inset-bottom)); }
.section-head { margin: 0 0 13px; display: flex; align-items: baseline; gap: 12px; }
.section-head h2 { margin: 0; font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -.03em; }
.reader-section + .reader-section { margin-top: 42px; }
.reader-section:focus { outline: none; }
.reader-section:focus-visible > .section-head h2 { outline: 2px solid var(--accent); outline-offset: 4px; }
.group + .group { margin-top: 26px; }
.groupname { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 10px; }
.card { background: var(--panel); border: 1px solid var(--bound); border-radius: 12px; padding: 17px 20px 19px; }
.card + .card { margin-top: 12px; }
.card:focus { outline: none; }
.card:focus-visible { outline: 2px solid var(--accent); }
.card-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
.card-head h4 { font-size: 15px; line-height: 1.55; margin: 0; font-weight: 600; color: var(--soft); overflow-wrap: anywhere; }
.page { flex: none; color: var(--accent); font: 650 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; text-decoration: none; white-space: normal; max-width: 9em; }
.page a { color: inherit; text-decoration: none; border-bottom: 1px solid #698573; padding-block: 5px; }
.block + .block { margin-top: 12px; }
.block-page { display: block; margin-bottom: 6px; }
.jp { margin: 0; color: var(--ink); font-family: -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif; font-size: var(--body-size); line-height: var(--leading); font-weight: 520; letter-spacing: var(--letters); overflow-wrap: anywhere; line-break: strict; }
ruby { ruby-align: center; ruby-position: over; }
rt { font-size: var(--ruby-size); letter-spacing: 0; font-weight: 550; color: var(--accent); line-height: 1; position: relative; top: calc(0px - var(--ruby-gap)); }
html.no-ruby rt,html.no-ruby rp { display: none; }
html.no-ruby ruby { display: inline; }
.zh { font-size: clamp(14px, .80em + 2px, 18px); line-height: 1.85; color: var(--soft); margin: 10px 0 0; border-left: 2px solid #587964; padding-left: 11px; overflow-wrap: anywhere; white-space: pre-line; }
.note { color: var(--muted); font-size: 14px; }
.article-source { display: inline-block; margin-top: 14px; padding-block: 5px; font-size: 14px; text-underline-offset: 3px; }
.note .zh:only-child { margin: 0; border-left: 0; padding-left: 0; }
.prompt .jp { color: #dbecdf; font-weight: 640; }
.prompt + .speech { margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--bound); }
html.no-zh .translation { display: none; }
.dock { position: fixed; z-index: 4; bottom: 0; inset-inline: 0; background: var(--panel); border-top: 1px solid var(--bound); padding-bottom: env(safe-area-inset-bottom); }
.dock .shell { height: 58px; padding-inline: 10px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; gap: 4px; }
.dock a { display: grid; place-items: center; min-height: 42px; min-width: 0; padding: 3px; border-radius: 7px; font-size: 13px; color: var(--soft); text-decoration: none; white-space: nowrap; }
.dock a[aria-current="location"] { color: #def4e5; background: #32483a; font-weight: 650; }
.jump-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 158px), 1fr)); gap: 7px; margin: 0 0 18px; }
.jump-list a { display: flex; align-items: center; min-height: 40px; padding: 7px 10px; border: 1px solid var(--bound); border-radius: 7px; background: var(--panel); text-decoration: none; color: var(--soft); font-size: 13px; overflow-wrap: anywhere; }
.jump-list a:hover { color: var(--ink); background: var(--raised); }
.display-options { display: flex; gap: 8px; margin: 8px 18px 0; }
.display-options button { min-height: 40px; padding: 5px 11px; border-radius: 7px; background: var(--raised); color: var(--soft); border: 1px solid var(--bound); }
.display-options button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
dialog { margin: auto auto 0; width: min(100%,640px); max-height: min(84vh,810px); max-height: min(84dvh,810px); color: var(--ink); background: var(--panel); border: 1px solid var(--bound); border-bottom: none; border-radius: 18px 18px 0 0; padding: 0; overflow: hidden; }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgb(3 6 4 / .66); }
body.modal-open { overflow: hidden; }
.sheet-top { display: flex; align-items: center; padding: 15px 19px 8px; gap: 8px; }
.sheet-top h2 { flex: 1; margin: 0; font-size: 20px; }
.dismiss { align-self: center; color: var(--soft); background: var(--raised); min-height: 39px; padding: 4px 13px; border-radius: 8px; }
.sheet-scroll { overflow-y: auto; overscroll-behavior: contain; padding: 12px 18px max(20px, env(safe-area-inset-bottom)); min-height: 0; }
.control { margin: 0 0 17px; }
.control label { display: flex; align-items: baseline; justify-content: space-between; color: var(--soft); font-weight: 550; }
.control output { color: var(--accent); font: 600 13px ui-monospace,monospace; }
.control input { display: block; width: 100%; accent-color: var(--accent); min-height: 35px; margin: 3px 0; }
.sample { padding: 9px 13px; border: 1px solid var(--bound); border-radius: 8px; background: var(--bg); margin: 8px 18px 0; }
.reset { padding: 8px 13px; min-height: 40px; color: var(--soft); background: var(--raised); border-radius: 7px; }
@media (min-width: 760px) {
 main { padding-top: 35px; } .card { padding: 21px 26px 23px; }
 dialog { margin: auto; max-height: min(82vh,780px); border-bottom: 1px solid var(--bound); border-radius: 15px; }
}
@media (max-width: 390px) {
 .bar .shell { gap: 9px; padding-inline: 12px; }
 main { padding-inline: 11px; } .card { padding: 13px; }
 .dock .shell { padding-inline: 6px; gap: 2px; }
 .sheet-scroll { padding-inline: 12px; }
 .jump-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.popup { display: none; flex: none; color: var(--soft); background: var(--raised); border: 1px solid var(--bound); border-radius: 7px; min-height: 40px; padding: 5px 12px; }
@media (min-width: 760px) { html:not(.compact) .popup { display: inline-block; } }
html.compact { --bar-top: 49px; }
html.compact .bar .shell { gap: 8px; padding: 6px 10px; }
html.compact .brand h1 { font-size: 14px; }
html.compact .brand small { font-size: 9px; }
html.compact main { padding: 11px 10px calc(66px + env(safe-area-inset-bottom)); }
html.compact .section-head h2 { font-size: 19px; }
html.compact .reader-section + .reader-section { margin-top: 24px; }
html.compact .card { padding: 11px 12px; border-radius: 8px; }
html.compact .dock .shell { height: 49px; }
html.compact .jump-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
html.native-mini,html.native-mini body { background: transparent; }
html.native-mini .bar,html.native-mini .dock,html.native-mini .card { background: rgb(22 30 25 / .90); }
html.native-mini main { background: rgb(20 27 22 / .80); }
.card[data-reverse] .card-head { justify-content: space-between; }
.audience { flex: none; font-size: 12px; color: var(--accent); }
.card[data-reverse] .article-source { display: block; margin: 12px 0 0; font-size: 12px; color: var(--muted); }
.card[data-reverse] .speech { margin-top: 10px; }
.card[data-reverse] .reply { border-top: 1px solid var(--bound); padding-top: 10px; }
.reply .jp { font-size: max(14px, calc(var(--body-size) * .86)); }
.reply-cue { margin: 0 0 4px; color: var(--accent); font-size: 12px; }
</style>
</head>

<script id="reader-data" type="application/json">{"sections":[{"id":"opening","label":"开场","kind":"flow","groups":[{"id":"opening","label":"问候和自我介绍","items":[{"id":"start-here","title":"开场先看对方怎么带","page":"","blocks":[{"type":"note","ja":"","zh":"上线先打招呼。对方叫到你或请你介绍时，再讲自我介绍。对方先介绍成员或安排，听完回应一句。接下来按他的话走：请看作品就开作品；先提问就直接答；把话交给你再选一个想问的。"}]},{"id":"opening-1","title":"刚上线，先问候","page":"","blocks":[{"type":"speech","ja":"こんにちは。\u003cruby>本日\u003crt>ほんじつ\u003c/rt>\u003c/ruby>はお\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>をいただき、ありがとうございます。よろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"您好，谢谢两位今天抽时间。请多关照。"}],"sources":[]},{"id":"opening-2","title":"对方先问声音是否正常","page":"","blocks":[{"type":"speech","ja":"はい、\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>こえています。よろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"嗯，听得见。请多关照。"}],"sources":[]},{"id":"opening-3","title":"轮到你自我介绍","page":"","blocks":[{"type":"speech","ja":"\u003cruby>武蔵野美術大学\u003crt>むさしのびじゅつだいがく\u003c/rt>\u003c/ruby>\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>でデザイン\u003cruby>情報学\u003crt>じょうほうがく\u003c/rt>\u003c/ruby>を\u003cruby>専攻\u003crt>せんこう\u003c/rt>\u003c/ruby>している、ZHANG ZIRUIです。\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>も\u003cruby>武蔵美\u003crt>むさび\u003c/rt>\u003c/ruby>で、グラフィックデザインを\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>びました。\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ってからは、\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>をしながらUI/UXの\u003cruby>勉強\u003crt>べんきょう\u003c/rt>\u003c/ruby>も\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めて、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>でアプリの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っています。\u003cruby>本日\u003crt>ほんじつ\u003c/rt>\u003c/ruby>はよろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"我是ZHANG ZIRUI，现在在武藏野美术大学大学院读设计信息学。本科也在武藏美，学的是平面设计。读研后，我一边做研究，一边也开始自学 UI/UX，现在会自己动手做 App 界面。今天请多关照。"}],"sources":[]},{"id":"opening-4","title":"对方介绍了团队或说明今天怎么聊","page":"","blocks":[{"type":"speech","ja":"はい、ありがとうございます。","zh":"好的，谢谢。"}],"sources":[]}]},{"id":"sharing","label":"共享与临场短讲","items":[{"id":"sharing-1","title":"共享与临场短讲","page":"","blocks":[{"type":"note","ja":"","zh":"聊到自己的制作、对方还没邀请展示时。"},{"type":"speech","ja":"よろしければ、ポートフォリオを\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>\u003cruby>共有\u003crt>きょうゆう\u003c/rt>\u003c/ruby>して、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>してもいいですか。","zh":"方便的话，我可以共享一下作品集，简单介绍一下吗？"}],"sources":[]},{"id":"sharing-2","title":"对方已经邀请或者同意时","page":"","blocks":[{"type":"note","ja":"","zh":"对方已经邀请或者同意时。"},{"type":"speech","ja":"ありがとうございます。では、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>共有\u003crt>きょうゆう\u003c/rt>\u003c/ruby>しますね。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えていますか。","zh":"谢谢，那我共享一下屏幕。能看见吗？"}],"sources":[]},{"id":"sharing-3","title":"对方已经邀请或者同意时","page":"","blocks":[{"type":"note","ja":"","zh":"停在P4目录。如果对方已经指定作品或只给一件的时间，直接翻到那件。"},{"type":"speech","ja":"こちらが\u003cruby>目次\u003crt>もくじ\u003c/rt>\u003c/ruby>です。UI/UXとグラフィックデザインの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せています。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>は、この\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つを\u003cruby>簡単\u003crt>かんたん\u003c/rt>\u003c/ruby>にご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>します。","zh":"这是目录，里面有 UI/UX 和平面设计的作品。今天我想简单讲一下前面这两件。"}],"sources":[]},{"id":"sharing-4","title":"如果对方已经看过作品集","page":"","blocks":[{"type":"speech","ja":"もうご\u003cruby>覧\u003crt>らん\u003c/rt>\u003c/ruby>くださったんですね。ありがとうございます。もし\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になった\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>があれば、そこからお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しします。","zh":"原来您已经看过了，谢谢。如果有您想听的作品，我可以从那件讲起。"}],"sources":[]},{"id":"sharing-5","title":"如果对方说只够简单看一件","page":"","blocks":[{"type":"note","ja":"","zh":"直接打开P17。只讲一个设计选择。没法共享时也能单独讲。"},{"type":"speech","ja":"\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>の「MORI」は、ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するためのアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、クーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>って\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>って、\u003cruby>一着\u003crt>いっちゃく\u003c/rt>\u003c/ruby>だけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すと、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るのかって、すぐには\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりにくいんです。そこで、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、カードに\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>とポイント、それから\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すかどうか\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>められるようにしました。","zh":"第一件 MORI 是我设计的网购服装退货 App 方案。比如用优惠券和积分买了两件衣服，只退一件时，很难一下算清能退多少。所以我把预计退回卡里的钱、返还的积分和退货运费都放在预约取件之前，让人看完再决定退不退。"}],"sources":[]},{"id":"sharing-6","title":"如果对方点名看TUCK，打开P34","page":"","blocks":[{"type":"note","ja":"","zh":"如果对方点名看TUCK，打开P34。"},{"type":"speech","ja":"「TUCK T10」は、\u003cruby>床\u003crt>ゆか\u003c/rt>\u003c/ruby>の\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>をアームで\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけるロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけてと\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んで、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>だけ「\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わりました」と\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たら、スリッパのほうが\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は「じゃあスリッパは？」と\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になります。そこで、スリッパを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>して、\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だった\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりに、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せるようにしました。","zh":"TUCK T10 是带机械臂的扫地机器人 App 方案。比如让它收拾地上的袜子和拖鞋，最后只收到袜子搬完的通知，我就会想「那拖鞋呢？」。我就把拖鞋放到前面，并给出它原先所在的位置和原定目的地，让人能自己去找。"}],"sources":[]}]}]},{"id":"pages","label":"作品","kind":"pages","groups":[{"id":"mori","label":"第一件 MORI","items":[{"id":"p17","title":"P17，先指出成品和退款预估","page":"P17","blocks":[{"type":"speech","ja":"\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>は「MORI」です。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>アプリで、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>する\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れをデザインしました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>はネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をするのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>は、クーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってシャツとパンツを\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が、シャツだけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>す\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"第一件叫 MORI，我为购物 App 设计了服装退货流程。我自己很喜欢网购。这次设想的是，有人用优惠券和积分一起买了衬衫和裤子，后来只想退衬衫。"},{"type":"speech","ja":"このとき、シャツの\u003cruby>値段\u003crt>ねだん\u003c/rt>\u003c/ruby>だけ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ても、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るかは\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりません。\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったクーポンやポイントをどう\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けるかで\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わりますし、\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>もかかります。それで、こちらの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>では、カードにいくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>か、ポイントはいくつ\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るか、\u003cruby>送料\u003crt>そうりょう\u003c/rt>\u003c/ruby>はいくらかを、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようにしました。","zh":"这时光看衬衫的价格，很难知道究竟能退多少。两件衣服怎么分摊优惠券和积分，会影响退款额，寄回去还要付运费。所以在这张页面上，预约取件之前就能看到预计退回卡里多少钱、返还多少积分，以及退货运费是多少。"}],"sources":[]},{"id":"p21","title":"P21，包裹到店后在等什么","page":"P21","blocks":[{"type":"speech","ja":"シャツを\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>した\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>は、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になることが\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>はもうお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いているのに、まだお\u003cruby>金\u003crt>かね\u003c/rt>\u003c/ruby>が\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ってこない。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>だったら「このまま\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っていていいのかな」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。そこで、この\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>には、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>がシャツを\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったことと、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>だということを\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>はいつまでに\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかも、ここで\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。","zh":"衬衫寄回去之后，关心的事情变了。包裹明明到店了，钱却还没退回来，换作是我就会想「我就这样等着可以吗？」所以在这张页面上，我把店铺已经收到衬衫、目前正在检查商品这两件事分开写了。下一次最晚什么时候会来消息，在这里也看得到。"}],"sources":[]},{"id":"mori-3","title":"「このテーマを選んだきっかけは何ですか。」","page":"","blocks":[{"type":"prompt","ja":"このテーマを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだきっかけは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"对方想知道你怎么会注意到退货。接着刚说的网购兴趣，讲自己查到的一个疑点。"},{"type":"speech","ja":"\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>した\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>、\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>までどう\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>んでいるか、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>からは\u003cruby>追\u003crt>お\u003c/rt>\u003c/ruby>いにくいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったのがきっかけです。いくつかのサービスの\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んでみると、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と、お\u003cruby>金\u003crt>かね\u003c/rt>\u003c/ruby>が\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ったかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>が\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>でした。それで、シャツを\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>す\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>立場\u003crt>たちば\u003c/rt>\u003c/ruby>で、\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ってから\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>されるまで、いつ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれば\u003cruby>安心\u003crt>あんしん\u003c/rt>\u003c/ruby>して\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>てるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"起点是我觉得，衣服寄回去后，站在买家这边很难知道退款办到哪一步了。我读了几家服务的退货说明，发现确认包裹有没有到、钱有没有退回来，得去不同的地方看。所以我站在只退一件衬衫的人的角度，把寄回到退款这一段顺了一遍，想弄清每一步知道些什么，心里才有底。"}],"sources":[]},{"id":"mori-4","title":"「この4,800円は、どう計算したんですか。」","page":"","blocks":[{"type":"prompt","ja":"この\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>は、どう\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>したんですか。","zh":""},{"type":"note","ja":"","zh":"打开P18，先说按商品价格分摊，再指着画面逐项算。"},{"type":"speech","ja":"\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>の\u003cruby>値段\u003crt>ねだん\u003c/rt>\u003c/ruby>に\u003cruby>応\u003crt>おう\u003c/rt>\u003c/ruby>じて、クーポンとポイントを\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>しました。シャツが\u003cruby>6,600円\u003crt>ろくせんろっぴゃくえん\u003c/rt>\u003c/ruby>、パンツが4,400\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>で、シャツが\u003cruby>合計\u003crt>ごうけい\u003c/rt>\u003c/ruby>11,000\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>の\u003cruby>6割\u003crt>ろくわり\u003c/rt>\u003c/ruby>です。なので、この\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>った1,000\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>のクーポンと1,000ポイントのうち、\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>と\u003cruby>600ポイント\u003crt>ろっぴゃくぽいんと\u003c/rt>\u003c/ruby>がシャツの\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>です。","zh":"我是按两件衣服各自的价格分摊优惠券和积分的。衬衫 6,600 日元，裤子 4,400 日元，合计 11,000 日元，衬衫占六成。所以这单用掉的 1,000 日元优惠券和 1,000 积分里，衬衫分到的是 600 日元优惠和 600 积分。"},{"type":"speech","ja":"シャツの\u003cruby>6,600円\u003crt>ろくせんろっぴゃくえん\u003c/rt>\u003c/ruby>から、クーポンで\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>いた\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>、ポイントで\u003cruby>払\u003crt>はら\u003c/rt>\u003c/ruby>った\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>、それに\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>の\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>くと、カードには\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>です。\u003cruby>600ポイント\u003crt>ろっぴゃくぽいんと\u003c/rt>\u003c/ruby>は\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ります。この\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>ではそういうルールにしていて、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>がシャツを\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したら\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>が\u003cruby>確定\u003crt>かくてい\u003c/rt>\u003c/ruby>します。","zh":"从 6,600 日元里扣掉优惠的 600 日元、积分支付的 600 日元，再扣 600 日元退货运费，预计退回卡里 4,800 日元，另退 600 积分。这是这个作品里设定的规则，等店铺检查过衬衫，金额才确定。"}],"sources":[]},{"id":"mori-5","title":"「どうして、この表示にしたんですか。」","page":"","blocks":[{"type":"prompt","ja":"どうして、この\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>にしたんですか。","zh":""},{"type":"note","ja":"","zh":"翻P14。问的是为什么选中间这版，先说它解决了哪个疑问，再指旁边的方案。"},{"type":"speech","ja":"\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>がお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>はまだこれからだということを、\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたくて、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>は「\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しています」と\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きく\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すので、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>していることは\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>なら、その\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>にお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったことまで\u003cruby>一目\u003crt>ひとめ\u003c/rt>\u003c/ruby>で\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>の\u003cruby>履歴\u003crt>りれき\u003c/rt>\u003c/ruby>や\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>の\u003cruby>内訳\u003crt>うちわけ\u003c/rt>\u003c/ruby>は、\u003cruby>詳\u003crt>くわ\u003c/rt>\u003c/ruby>しく\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいときに\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>けるようにしました。","zh":"我选中间这版，是想让人同时知道包裹已经到店、退款还在后面。右边这版把「正在检查商品」突出显示，能看明白店家正在做什么。中间这版则一眼就能看到，店家在这之前已经收到了衣服。物流记录和金额明细，需要时可以再打开。"}],"sources":[]},{"id":"mori-6","title":"「待つだけでいいと、どう伝えていますか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>つだけでいいと、どう\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えていますか。","zh":""},{"type":"note","ja":"","zh":"翻P21，先答正在等谁、要等到什么时候，再说明需要买家回应时会怎样。"},{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>していることと、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>がいつまでに\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しています。この\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>だと、シャツは\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>で、21\u003cruby>日\u003crt>にち\u003c/rt>\u003c/ruby>までにお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>から\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>ます。もしお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>でタグが\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つからず、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>にも\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>してほしいなら、\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>も\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。タグを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れた\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>は、そのときの\u003cruby>様子\u003crt>ようす\u003c/rt>\u003c/ruby>をお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えられるよう、\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>ボタンを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"我会写清店铺正在做什么，以及最晚什么时候会再联系。这个例子里，衬衫还在检查，店家会在 21 日前发消息。如果店家没找到吊牌，需要买家也确认一下，页面的内容就会变。如果买家记得自己把吊牌放进去了，可以点联系按钮，跟店家说明当时打包的情况。"}],"sources":[]},{"id":"mori-7","title":"「P15の数字は、実際に取ったアンケートですか。」","page":"","blocks":[{"type":"prompt","ja":"P15の\u003cruby>数字\u003crt>すうじ\u003c/rt>\u003c/ruby>は、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったアンケートですか。","zh":""},{"type":"note","ja":"","zh":"直接说数据从哪里来、它在作品里用来做什么。"},{"type":"speech","ja":"いいえ。\u003cruby>各案\u003crt>かくあん\u003c/rt>\u003c/ruby>に\u003cruby>50件\u003crt>ごじゅっけん\u003c/rt>\u003c/ruby>ずつ、\u003cruby>仮\u003crt>かり\u003c/rt>\u003c/ruby>の\u003cruby>回答\u003crt>かいとう\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れています。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せ\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うと、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たときの\u003cruby>安心感\u003crt>あんしんかん\u003c/rt>\u003c/ruby>がどう\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わるか。それを\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べる\u003cruby>方法\u003crt>ほうほう\u003c/rt>\u003c/ruby>を\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>したページです。\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>にB\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>は、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>の\u003cruby>到着\u003crt>とうちゃく\u003c/rt>\u003c/ruby>とお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>を\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せられるからです。","zh":"不是，每个方案的 50 份回答都是假设数据。这一页想说明，如果要了解不同的呈现方式会怎样影响人们看到退货指引时的安心感，可以怎样比较。我选 B 方案，实际依据是它能把包裹已经到店和店家目前的检查进度放在一起。"}],"sources":[]},{"id":"mori-8","title":"「実際に使ってもらって、分かりやすいか確かめましたか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらって、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすいか\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめましたか。","zh":""},{"type":"note","ja":"","zh":"先说做到哪一步。对方想听下一步时，再讲你要观察的具体判断。"},{"type":"speech","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらうのは、これからです。まずは\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらって、「このシャツを\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>したら、カードにはいくら、ポイントはいくつ\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>りますか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいです。\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>した\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>なら、「\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>からお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>しますか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>きます。どこを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てそう\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったかも\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けると、\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>す\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。","zh":"还没请人实际试过。我想先让人看退款页面，问「这件衬衫退了的话，会退回卡里多少钱、返还多少积分？」换到寄回后的页面，再问「现在你会主动联系店家吗？」再听听他们是看了哪里才这么判断的，就比较容易找到需要改的地方。"}],"sources":[]}]},{"id":"tuck","label":"第二件 TUCK T10","items":[{"id":"p34","title":"P34，先指右边采用的方案","page":"P34","blocks":[{"type":"speech","ja":"\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つ\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>は「TUCK T10」です。\u003cruby>床\u003crt>ゆか\u003c/rt>\u003c/ruby>にある\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>をアームで\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけてくれるロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。これは、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパの\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけを\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んだ\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>は\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったと\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たのに、スリッパの\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>だけ\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>ていません。","zh":"第二件叫 TUCK T10，是为带机械臂、能收拾地上小物的扫地机器人设计的 App。这是让机器人收拾袜子和拖鞋之后的结果页。袜子已经收到了搬完的通知，偏偏拖鞋那条还没来。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>だったら、ここで\u003cruby>一番\u003crt>いちばん\u003c/rt>\u003c/ruby>\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいのは「じゃあ、スリッパはどこにあるんだろう」ということです。それで\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>では、\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>の\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>は\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>の\u003cruby>一行\u003crt>いちぎょう\u003c/rt>\u003c/ruby>にまとめて、そのすぐ\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>に、これから\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すスリッパが\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>るようにしました。","zh":"换作是我，这时最想知道的就是「那拖鞋现在在哪儿呢？」所以你看右边这版，我把总件数放在最上面的一行，紧接着突出显示接下来要找的拖鞋。"}],"sources":[]},{"id":"p39","title":"P39，沿两处查找线索讲到最后的记录","page":"P39","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、スリッパをどこから\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せばいいかです。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>は\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりませんが、ロボットが\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたのはソファの\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>で、\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だったのは\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>です。この\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>か\u003cruby>所\u003crt>しょ\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれば、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しに\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>けます。","zh":"接下来，该从哪里找拖鞋呢？现在还不知道它在哪儿，但机器人最初是在沙发前发现它的，原本打算送到放鞋的地方。知道了这两处，人就有地方去找了。"},{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたら、「\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>にあった」と\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>できます。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたのは\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>なので、「ロボットからの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>」は「\u003cruby>未\u003crt>み\u003c/rt>\u003c/ruby>\u003cruby>受信\u003crt>じゅしん\u003c/rt>\u003c/ruby>」のままです。\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>から\u003cruby>見返\u003crt>みかえ\u003c/rt>\u003c/ruby>したときにも、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したのかが\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるようにしました。","zh":"比如我在放鞋的地方找到了，就能记下「在预定位置找到」。是我自己找到的，所以「机器人传回的结果」这一栏仍然是「未收到」。这样以后再翻回来看，也能知道当时是谁确认的。"}],"sources":[]},{"id":"tuck-3","title":"「実際の製品を調べて作ったんですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>製品\u003crt>せいひん\u003c/rt>\u003c/ruby>を\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べて\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":""},{"type":"note","ja":"","zh":"对方在问参考过什么、你自己做了哪部分。P29–30有操作指南和提案范围。"},{"type":"speech","ja":"はい。RoborockのSaros Z70という、アーム\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>きのロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>の\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>ガイドを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>の\u003cruby>重\u003crt>おも\u003c/rt>\u003c/ruby>さや\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りのスペースによっては、\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>まで\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べないことがあるんです。そこから、\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>で\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけを\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んだ\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からなかったら\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>がどう\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるか、というところまでをアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>にしました。","zh":"是的。我读了 Roborock 一款叫 Saros Z70 的机械臂扫地机器人的操作指南。物品的重量、旁边空间够不够，都可能影响它能不能把东西运到预定位置。所以我从人在地图上选好物品、交给机器人收拾，一直设计到之后没收到结果时，人可以怎样自己去确认。"}],"sources":[]},{"id":"tuck-4","title":"「スリッパの移動に失敗したということですか。」","page":"","blocks":[{"type":"prompt","ja":"スリッパの\u003cruby>移動\u003crt>いどう\u003c/rt>\u003c/ruby>に\u003cruby>失敗\u003crt>しっぱい\u003c/rt>\u003c/ruby>したということですか。","zh":""},{"type":"note","ja":"","zh":"对方在确认拖鞋是不是没搬成功。一句说明此刻知道什么，接上页面为什么这样显示。"},{"type":"speech","ja":"\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べたかどうかは、まだ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないんです。\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いていないのは\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>なので、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にもそう\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>きました。そのうえで、\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しに\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>く\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>には\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりが\u003cruby>要\u003crt>い\u003c/rt>\u003c/ruby>るので、\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>示\u003crt>しめ\u003c/rt>\u003c/ruby>しています。","zh":"现在还不知道有没有搬成功。能确定的是结果通知还没到，所以页面上也是这样写的。接下来要自己去找的人需要线索，我就标出了那两个地方。"}],"sources":[]},{"id":"tuck-5","title":"「どこまで動くものを作ったんですか。」","page":"","blocks":[{"type":"prompt","ja":"どこまで\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>くものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":""},{"type":"note","ja":"","zh":"翻P42。先说可点击的具体操作，再讲按下后能看到哪两个状态。"},{"type":"speech","ja":"ロボットが\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>んでいる\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で、\u003cruby>一時停止\u003crt>いちじていし\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>むところを、ブラウザーで\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>できるようにしました。\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>した\u003cruby>直後\u003crt>ちょくご\u003c/rt>\u003c/ruby>は、まだ\u003cruby>本当\u003crt>ほんとう\u003c/rt>\u003c/ruby>に\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>まったか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないので、「ロボットの\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っています」と\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>したという\u003cruby>模擬\u003crt>もぎ\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>くと、\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて「\u003cruby>再開\u003crt>さいかい\u003c/rt>\u003c/ruby>する」が\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>せます。この\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>替\u003crt>か\u003c/rt>\u003c/ruby>わりまで\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめました。","zh":"我把机器人搬东西途中按暂停的这段，做成了可以在浏览器里操作的原型。刚按下去，还不知道机器是否已经停住，所以先显示「正在等待机器人停止」。等模拟的停止通知到了，才可以按「继续」。我在原型里确认了这段状态切换。"}],"sources":[]},{"id":"tuck-6","title":"「結果画面も、実際に使ってもらったんですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>も、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらったんですか。","zh":""},{"type":"note","ja":"","zh":"对方在问P34、P39的设计有没有找人试过。接着刚讲过的拖鞋场景说。"},{"type":"speech","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>は、まだ\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらっていません。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、さっきの\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>をそれぞれ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらって、「この\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をしますか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいです。そこからスリッパを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>そうと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うか、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>でどこを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せばいいか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たいです。","zh":"结果页还没请人实际试过。下一步我想把刚才的两种方案分别给人看，问一句「接下来你会做什么？」看他们会不会想到去找拖鞋，再看到了下一张页面，知不知道可以从哪儿找起。"}],"sources":[]},{"id":"p77","title":"P77，四季の花綴り","page":"P77","blocks":[{"type":"speech","ja":"グラフィックの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>でしたら、\u003cruby>卒業制作\u003crt>そつぎょうせいさく\u003c/rt>\u003c/ruby>の「\u003cruby>四季\u003crt>しき\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>\u003cruby>綴\u003crt>つづ\u003c/rt>\u003c/ruby>り」をお\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せします。\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>を\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>にして、\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>と\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせた\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>です。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば\u003cruby>春\u003crt>はる\u003c/rt>\u003c/ruby>のページでは、\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てくる\u003cruby>黄色\u003crt>きいろ\u003c/rt>\u003c/ruby>を、すぐ\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>びらで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようにしました。\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>から\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>を\u003cruby>想像\u003crt>そうぞう\u003c/rt>\u003c/ruby>して、ふと\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると\u003cruby>本物\u003crt>ほんもの\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>がある。そういう\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>ができたらと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>って\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"如果想看平面设计，我想给您看毕业作品《四季の花綴り》。我自己把四季的花做成压花，再和汉诗编成了四册书。比如春天这页，诗里写到的黄色，在旁边那片花瓣上就能看到。我希望读者先从文字想象那个季节，再往旁边一看，真的有一朵花在那儿。"}],"sources":[]},{"id":"tuck-8","title":"介绍说完","page":"","blocks":[{"type":"speech","ja":"ご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>したかったのは\u003cruby>以上\u003crt>いじょう\u003c/rt>\u003c/ruby>です。ありがとうございます。","zh":"我想介绍的作品就到这里，谢谢。"}],"sources":[]}]}],"links":[{"id":"p17","label":"MORI · P17"},{"id":"p34","label":"TUCK · P34"},{"id":"p77","label":"平面设计 · P77"}]},{"id":"questions","label":"问答","kind":"flow","groups":[{"id":"answers","label":"轮到对方问你","items":[{"id":"answers-1","title":"「今日はどんなことを聞いてみたいですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>はどんなことを\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいですか。","zh":""},{"type":"note","ja":"","zh":"对方把话交给你时再用。刚才能听懂的部分就不必再请他们重讲。"},{"type":"speech","ja":"PAY IDのデザイナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>とどんなふうにお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をされているのか\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいです。","zh":"我想听听，平时做 PAY ID 的设计，会和哪些同事一起做事，大家是怎么配合的。"}],"sources":[]},{"id":"answers-2","title":"「どうしてUI/UXを始めたんですか。」","page":"","blocks":[{"type":"prompt","ja":"どうしてUI/UXを\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたんですか。","zh":""},{"type":"note","ja":"","zh":"讲学平面时喜欢做哪部分，为什么想把它用到 App 上，再说读研后怎样开始。"},{"type":"speech","ja":"\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>でグラフィックデザインを\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>ぶ\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>特\u003crt>とく\u003c/rt>\u003c/ruby>に\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きだったのが、\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>を\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>して\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすく\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えることでした。それをアプリの\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすさにも\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>かしてみたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったのが、UI/UXを\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたきっかけです。どんなに\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>な\u003cruby>機能\u003crt>きのう\u003c/rt>\u003c/ruby>でも、\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>がどこにあるか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からなかったり、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>で\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>ったりしたら、もったいないですよね。そういうところを\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>でも\u003cruby>工夫\u003crt>くふう\u003c/rt>\u003c/ruby>してみたくて、\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ってから、\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>の\u003cruby>合間\u003crt>あいま\u003c/rt>\u003c/ruby>に\u003cruby>動画\u003crt>どうが\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ながらアプリの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めました。","zh":"本科学平面设计时，我特别喜欢做的一件事，就是把信息理清楚，让人很容易看明白。我开始做 UI/UX，是因为我想把这件事也用在 App 上，让它用起来更顺手。一个功能明明很好用，可第一次用的人连它在哪儿都找不到，或者找到了也不知道该怎么用，我觉得挺可惜的。我想自己试着把这些地方做好，所以读研以后，就一边做研究，一边看视频，开始动手做 App 的界面。"}],"sources":[]},{"id":"answers-3","title":"「BASEに興味を持ったきっかけは何ですか。」","page":"","blocks":[{"type":"prompt","ja":"BASEに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>を\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ったきっかけは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"问兴趣是怎么产生的。先说明为什么这次邀请跟你有关系，再说后来主动读到什么。"},{"type":"speech","ja":"\u003cruby>以前\u003crt>いぜん\u003c/rt>\u003c/ruby>、ネットで\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>するときにPAY IDを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがあって、\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>、そのチームからスカウトをいただいたのがきっかけです。どんな\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っているんだろうと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>って、BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>したチームのインタビューを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>だけで\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>したいという\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がいたそうで、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>もレコードを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すときは、まずお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>から\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶので、よく\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったんです。そういう\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>をする\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>が、どうやって\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>のデザインにつながったのか、\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>に\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたくなりました。","zh":"以前网购下单时我用过 PAY ID，这次收到做这个产品的团队发来的邀请，就是契机。我想知道平时是什么样的人在做，于是去 BASE 集团的官方 note 读了商品搜索改版的团队访谈。里面提到，有买家想只在喜欢的那家店里找东西。我找唱片时也常常先选店，读到这里就很有共鸣。我很想听做这个项目的人聊聊，这样一种购物习惯，是怎么一步步影响他们做设计的。"}],"sources":[{"label":"BASE 集团官方 note｜PAY ID 商品搜索改版访谈","url":"https://note.com/base_group/n/n39a643caaa7d"}]},{"id":"answers-4","title":"「BASEのどこに魅力を感じましたか。」","page":"","blocks":[{"type":"prompt","ja":"BASEのどこに\u003cruby>魅力\u003crt>みりょく\u003c/rt>\u003c/ruby>を\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じましたか。","zh":""},{"type":"note","ja":"","zh":"如果紧接上一题，出处已经说过，第二句从「先ほどの検索の記事なんですが、商品を細かく…」接即可。"},{"type":"speech","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>にとって\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>なものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るときに、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>無理\u003crt>むり\u003c/rt>\u003c/ruby>なく\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けてもらえるかまで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えているところです。BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>したチームの\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かく\u003cruby>絞\u003crt>しぼ\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>めるようにするには、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>分類\u003crt>ぶんるい\u003c/rt>\u003c/ruby>が\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>だったそうです。お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>\u003cruby>入力\u003crt>にゅうりょく\u003c/rt>\u003c/ruby>してもらうのは\u003cruby>大変\u003crt>たいへん\u003c/rt>\u003c/ruby>なので、もともとおすすめ\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すために\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けていた\u003cruby>分類\u003crt>ぶんるい\u003c/rt>\u003c/ruby>を、\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>にも\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったとありました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をしていたときは、\u003cruby>絞\u003crt>しぼ\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>みが\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っても、その\u003cruby>分類\u003crt>ぶんるい\u003c/rt>\u003c/ruby>を\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けるのかまでは\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていませんでした。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>も、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>こう\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>にいる\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>まで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるようになりたいです。","zh":"吸引我的是，做一个让买家更方便的东西时，你们也会想，店家能不能不费劲地一直用下去。我在 BASE 集团官方 note 读了 PAY ID 搜索改版团队的访谈。想让买家筛得更细，就要给每一件商品分类。让店家全部手填很费工夫，所以团队把原来给商品做推荐时就有的分类用到了搜索里。我自己购物时也会觉得筛选很方便，却很少想到是谁给商品分的类。我也想学会在做设计时，多想到屏幕另一头那个要负责这件事的人。"}],"sources":[{"label":"BASE 集团官方 note｜PAY ID 商品搜索改版访谈","url":"https://note.com/base_group/n/n39a643caaa7d"}]},{"id":"answers-5","title":"「PAY IDならではだと思ったところは？」","page":"","blocks":[{"type":"prompt","ja":"PAY IDならではだと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったところは？","zh":""},{"type":"note","ja":"","zh":"说你喜欢 PAY ID 的哪种购物方式。关注店铺看上新，与收藏某件商品等它补货是两回事。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がいいなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったのは、\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>度\u003crt>ど\u003c/rt>\u003c/ruby>\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>ったお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>のときも\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>りやすいところです。レコードを\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めるのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>は「そろそろ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったかな」と、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>\u003cruby>軒\u003crt>けん\u003c/rt>\u003c/ruby>かのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>のサイトを\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていました。PAY IDだと、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になるお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をアプリでフォローしておけば、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しい\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>が\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったときに\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるんです。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>は\u003cruby>欲\u003crt>ほ\u003c/rt>\u003c/ruby>しい\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>が\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つからなくても、「このお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>、またのぞいてみよう」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>える。そこが\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>のレコードの\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>し\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っています。","zh":"我觉得它好在，喜欢上一家店之后，下次它上新时很容易再找回去。我喜欢收唱片，以前会想着「差不多该上新了吧」，一家一家打开几家店的网站看。后来发现，在 PAY ID 的 App 里关注喜欢的店，有新货就能知道。这次没找到想要的那一张，我也会想「这家店，下次还想来逛」。这一点很合我找唱片的习惯。"}],"sources":[{"label":"PAY ID 官方｜关注店铺与到货提醒","url":"https://payid.jp/"}]},{"id":"answers-6","title":"「UI/UXでは、今どんなことに興味がありますか。」","page":"","blocks":[{"type":"prompt","ja":"UI/UXでは、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どんなことに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>がありますか。","zh":""},{"type":"note","ja":"","zh":"问现在想练好的判断。说清楚什么该先告诉使用者、什么可以稍后再说。"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は、\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に、どこまで\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>するとちょうどいいのかに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>があります。\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>る\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>は\u003cruby>仕組\u003crt>しく\u003c/rt>\u003c/ruby>みを\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>っているので、あれもこれも\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたくなります。でも、\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>を\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せると、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どこを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ればいいのか、かえって\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりにくくなりますよね。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えて、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>は\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>になったときに\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せるか。そういう\u003cruby>判断\u003crt>はんだん\u003c/rt>\u003c/ruby>ができるようになりたいです。","zh":"我现在想琢磨的是，面对第一次用的人，解释到什么程度刚刚好。做产品的人熟悉背后的东西，会觉得这个也该说，那个也该说。可要是一下全摆出来，人反而不知道眼下该看哪里。我想学会判断，哪些东西一开始就要说清楚，哪些可以等人用到的时候再给他看。"}],"sources":[]},{"id":"answers-7","title":"「どんな仕事に関わってみたいですか。」","page":"","blocks":[{"type":"prompt","ja":"どんな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>に\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わってみたいですか。","zh":""},{"type":"note","ja":"","zh":"想参与哪类工作先讲清，再讲入职初期准备怎么一步步学。"},{"type":"speech","ja":"PAY IDで、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>ったあとに\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>や\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いの\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ってみたいです。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>からすると、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どうなっているかを\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたい\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>ですけど、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>がいつ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しているかを\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>が\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らないと、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすく\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えられないと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。\u003cruby>新卒\u003crt>しんそつ\u003c/rt>\u003c/ruby>デザイナーの\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページで、\u003cruby>入社\u003crt>にゅうしゃ\u003c/rt>\u003c/ruby>して\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>半年\u003crt>はんとし\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>年\u003crt>ねん\u003c/rt>\u003c/ruby>ほどは、\u003cruby>研修\u003crt>けんしゅう\u003c/rt>\u003c/ruby>を\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>けたり、\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>と\u003cruby>小\u003crt>ちい\u003c/rt>\u003c/ruby>さな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたりすると\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。まずはそういう\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>通\u003crt>とお\u003c/rt>\u003c/ruby>して、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つの\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>が\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>とお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にそれぞれどう\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えているのかを\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいです。","zh":"我想参与 PAY ID 里买完东西后查看订单和付款情况的界面设计。买家当然想知道「现在到哪儿了」，但我自己要是都不清楚店家这时在确认什么，就很难跟买家讲清楚。我在新卒设计师招聘页读到，入职后的前半年到一年左右会有研修，也会和前辈从小任务开始做。我想先借这些工作弄明白，同一笔订单，从买家和店家那边看分别是什么样的。"}],"sources":[{"label":"PAY ID 28 卒设计师招聘页","url":"https://open.talentio.com/r/1/c/binc/pages/128919"}]},{"id":"answers-8","title":"「買い物のあとの、どんなところが気になりますか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>のあとの、どんなところが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になりますか。","zh":""},{"type":"note","ja":"","zh":"上一题已经讲了订单。追问直接说明买家要作的一个判断。"},{"type":"speech","ja":"\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>したあと、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>のほうで\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>かすることが\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っているか、というところです。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いが\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>んでいれば、あとは\u003cruby>発送\u003crt>はっそう\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>てますよね。まだなら、いつまでに\u003cruby>払\u003crt>はら\u003c/rt>\u003c/ruby>えばいいかを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいです。\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いたときに、その\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いがすぐ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かると\u003cruby>安心\u003crt>あんしん\u003c/rt>\u003c/ruby>だなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。","zh":"我在意的是，下单之后，我这边还有没有什么事要做。比如已经付好了，那我就等发货。如果还没付，我就想先知道最晚什么时候得付。打开订单一眼就能分清，心里会踏实很多。"}],"sources":[]},{"id":"answers-9","title":"「大学院では、何を研究しているんですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>では、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>しているんですか。","zh":""},{"type":"note","ja":"","zh":"先讲希望谁看懂什么，再用一句日常说法解释题材，最后说你具体做的事。"},{"type":"speech","ja":"\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>の\u003cruby>伝統\u003crt>でんとう\u003c/rt>\u003c/ruby>\u003cruby>文化\u003crt>ぶんか\u003c/rt>\u003c/ruby>を、\u003cruby>日本\u003crt>にっぽん\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にも\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすく\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>するためのデザインを\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>しています。\u003cruby>扱\u003crt>あつか\u003c/rt>\u003c/ruby>っているのは、\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>で\u003cruby>昔\u003crt>むかし\u003c/rt>\u003c/ruby>、\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いを\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>めたり、\u003cruby>災\u003crt>わざわ\u003c/rt>\u003c/ruby>いをよけたりするために\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>われていた「\u003cruby>護符\u003crt>ごふ\u003c/rt>\u003c/ruby>」という、お\u003cruby>守\u003crt>まも\u003c/rt>\u003c/ruby>りのようなものです。\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、そこに\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれた\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>や\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>だけでは、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>のためのものか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりにくいんです。そこで、\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>と\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>をどんな\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せると\u003cruby>意味\u003crt>いみ\u003c/rt>\u003c/ruby>が\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えています。\u003cruby>最終的\u003crt>さいしゅうてき\u003c/rt>\u003c/ruby>には、\u003cruby>日本\u003crt>にっぽん\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>って\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>める\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>にしたいです。","zh":"我研究的是，怎样通过设计，把中国传统文化介绍给日本读者。具体的题材是中国人过去用来祈愿、避灾的护符，有点像日本的护身符。第一次看到的人，光看上面的字和图，很难知道它是做什么用的。所以我在想，图和说明该怎么安排，读的人才会慢慢看明白。最后我想把它做成一本日本读者可以拿起来读的书。"}],"sources":[]},{"id":"answers-10","title":"「学生時代に力を入れたことは何ですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>学生時代\u003crt>がくせいじだい\u003c/rt>\u003c/ruby>に\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れたことは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"讲自己主动承担了什么，为什么提议、怎么和同事做，以及团队持续运营的结果。"},{"type":"speech","ja":"\u003cruby>美大\u003crt>びだい\u003c/rt>\u003c/ruby>\u003cruby>受験\u003crt>じゅけん\u003c/rt>\u003c/ruby>の\u003cruby>予備校\u003crt>よびこう\u003c/rt>\u003c/ruby>で、SNSの\u003cruby>発信\u003crt>はっしん\u003c/rt>\u003c/ruby>を\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>したことです。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>広報\u003crt>こうほう\u003c/rt>\u003c/ruby>\u003cruby>用\u003crt>よう\u003c/rt>\u003c/ruby>の\u003cruby>画像\u003crt>がぞう\u003c/rt>\u003c/ruby>などを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っていたんですが、\u003cruby>学校\u003crt>がっこう\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>し\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めた\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>と、もう\u003cruby>出願\u003crt>しゅつがん\u003c/rt>\u003c/ruby>の\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>をしている\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>では、\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいことが\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うと\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じました。それで、\u003cruby>学校\u003crt>がっこう\u003c/rt>\u003c/ruby>\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びやポートフォリオの\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>など、\u003cruby>相手\u003crt>あいて\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>発信\u003crt>はっしん\u003c/rt>\u003c/ruby>する\u003cruby>内容\u003crt>ないよう\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えてみたいと、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>から\u003cruby>運営\u003crt>うんえい\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>に\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>しました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>と\u003cruby>投稿\u003crt>とうこう\u003c/rt>\u003c/ruby>\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>の\u003cruby>振\u003crt>ふ\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>りを\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>して、\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>や\u003cruby>投稿\u003crt>とうこう\u003c/rt>\u003c/ruby>はチームで\u003cruby>分担\u003crt>ぶんたん\u003c/rt>\u003c/ruby>しました。\u003cruby>運用\u003crt>うんよう\u003c/rt>\u003c/ruby>を\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けるうちに、ゼロから\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたアカウントのフォロワーが\u003cruby>千\u003crt>せん\u003c/rt>\u003c/ruby>\u003cruby>人\u003crt>にん\u003c/rt>\u003c/ruby>ほどになり、\u003cruby>問\u003crt>と\u003c/rt>\u003c/ruby>い\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせも\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えました。","zh":"我投入最多的一件事，是在一家美术升学机构策划社媒内容。一开始我负责做宣传图，后来发现，刚开始选学校的人和正在准备出愿的人，关心的东西不一样。于是我主动去找负责人商量，能不能按学生现在需要什么，分别做选校、作品集准备之类的内容。我负责策划和发布后的复盘，制作和发布由团队分工。大家持续运营下来，账号从零涨到了大约一千个关注，咨询也多了起来。"}],"sources":[]},{"id":"answers-11","title":"「PAY IDは使ったことがありますか。」","page":"","blocks":[{"type":"prompt","ja":"PAY IDは\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがありますか。","zh":""},{"type":"note","ja":"","zh":"先说自己在哪一步用过。对方若只想确认，用第一句就够。"},{"type":"speech","ja":"はい、ネットで\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>するときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがあります。\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うのは、PAY IDが\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>なら、\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>うときも、\u003cruby>登録\u003crt>とうろく\u003c/rt>\u003c/ruby>してある\u003cruby>住所\u003crt>じゅうしょ\u003c/rt>\u003c/ruby>をそのまま\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるところです。\u003cruby>欲\u003crt>ほ\u003c/rt>\u003c/ruby>しいものを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わって、そのまま\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めるのはありがたいです。","zh":"用过，我网购下单时用过。觉得方便的是，换到另一家支持 PAY ID 的店，也可以直接用已经存好的地址。东西都挑好了，接着就能下单，这一步对我挺省事的。"}],"sources":[{"label":"PAY ID 官方｜结账时复用收货资料","url":"https://payid.jp/"}]},{"id":"answers-12","title":"「買う側として、どういう使い方が自分に合っていると思いますか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>として、どういう\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っていると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いますか。","zh":""},{"type":"note","ja":"","zh":"问你的购物习惯，从喜欢一家唱片店说到什么时候愿意再回来。如果刚讲过关注，直接说「そのお店の品ぞろえも気になるんです」。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>には、\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなレコード\u003cruby>屋\u003crt>や\u003c/rt>\u003c/ruby>さんを\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>\u003cruby>軒\u003crt>けん\u003c/rt>\u003c/ruby>かのぞいて、その\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶような\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っています。お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>によって\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いているものが\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うので、\u003cruby>欲\u003crt>ほ\u003c/rt>\u003c/ruby>しいレコードが\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>はなくても、「ここは\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>仕入\u003crt>しい\u003c/rt>\u003c/ruby>れるんだろう」と\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になるんです。\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>は、そのたびに\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>軒\u003crt>けん\u003c/rt>\u003c/ruby>ずつサイトを\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いていました。PAY IDなら、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>ったお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をフォローして、\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>のお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせが\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたときに\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>に\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>けます。\u003cruby>欲\u003crt>ほ\u003c/rt>\u003c/ruby>しい\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>が\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つかったら、そのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>でもいつものアカウントで\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>できる。お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をめぐる\u003cruby>楽\u003crt>たの\u003c/rt>\u003c/ruby>しさはそのままで、\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>し\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>したり\u003cruby>入力\u003crt>にゅうりょく\u003c/rt>\u003c/ruby>し\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>したりする\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>が\u003cruby>減\u003crt>へ\u003c/rt>\u003c/ruby>るのが、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>にはうれしいです。","zh":"我喜欢逛几家自己喜欢的唱片店，再从里面挑一张。每家选的东西都不一样，所以即使今天没找到想要的，我也会好奇「这家店下次会进什么？」以前我得一家家点开网站查。用 PAY ID 的话，可以关注喜欢的店，有上新消息的时候再回去看。碰到想要的那张，也能用平时的账号在那家店下单。对我这个买家来说，挨家逛、发现好东西的乐趣还在，反复找店、反复填资料的麻烦却少了。"}],"sources":[{"label":"PAY ID 官方｜店铺上新与跨店下单","url":"https://payid.jp/"}]},{"id":"answers-13","title":"「お店の方にとっては、どう役に立つと思いましたか。」","page":"","blocks":[{"type":"prompt","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にとっては、どう\u003cruby>役\u003crt>やく\u003c/rt>\u003c/ruby>に\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>つと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いましたか。","zh":""},{"type":"note","ja":"","zh":"换到店家的位置，讲一次店家确实用过的做法。"},{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にとっては、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しくいいものが\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったときに、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>ってくれた\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせられるのがいいなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。BASE Uで、PAY IDの\u003cruby>事業責任者\u003crt>じぎょうせきにんしゃ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>とショップオーナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、アプリの\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>している\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。あるお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>では\u003cruby>毎月\u003crt>まいつき\u003c/rt>\u003c/ruby>、\u003cruby>月末\u003crt>げつまつ\u003c/rt>\u003c/ruby>の\u003cruby>金曜日\u003crt>きんようび\u003c/rt>\u003c/ruby>が\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>で、その\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせてお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせを\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>っているそうです。いつも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てくれる\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に「\u003cruby>今月\u003crt>こんげつ\u003c/rt>\u003c/ruby>も\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>りましたよ」と\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけるような\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>なんだなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"我觉得对店家来说，好处是有好东西上新时，可以告诉那些本来就喜欢自己店的人。我在 BASE U 读到一篇 PAY ID 业务负责人和店主聊 App 用法的文章。有一家店每月月底的周五进货，就趁那一天给关注的人发个通知。听起来很像是跟常来的客人打声招呼，说「这个月的新货也到了」。"}],"sources":[{"label":"BASE U｜PAY ID 业务负责人与店主谈 App 的实际用法","url":"https://baseu.jp/51399"}]},{"id":"answers-14","title":"「気になったところや、こうなったらいいと思うことは？」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったところや、こうなったらいいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うことは？","zh":""},{"type":"note","ja":"","zh":"说你在意的一个瞬间，交代读到的买家经历与现有设置，再提一个小想法。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったのは、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をフォローするときに、どんなお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせがどのくらい\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るのかというところです。そらたさんという\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がnoteの\u003cruby>日記\u003crt>にっき\u003c/rt>\u003c/ruby>で、レコード\u003cruby>店\u003crt>てん\u003c/rt>\u003c/ruby>の\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>をまとめて\u003cruby>追\u003crt>お\u003c/rt>\u003c/ruby>えるのは\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だけど、\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>は\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>く\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じると\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていました。PAY IDのヘルプを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>は\u003cruby>種類\u003crt>しゅるい\u003c/rt>\u003c/ruby>ごとに\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>べるんですね。だったら、フォローするところで「\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>のお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせだけ\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りたい」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったときにも、そこから\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>をすぐ\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>けたら\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"我有点在意的是，点关注一家店时，能不能大致知道会收到哪些消息、会有多频繁。我在 note 上读到一位叫そらた的买家写的日记，他觉得集中看唱片店上新挺方便，但也觉得通知多。我去查了 PAY ID 的帮助页，知道现在就能按类型设置。那么从买家的角度，如果我点关注时只想收上新消息，当下就能找到这个设置，会很方便。"}],"sources":[{"label":"そらた在 note 上的使用日记","url":"https://note.com/sorata_note_a/n/nf25a6d71c06f"},{"label":"现行通知帮助","url":"https://help.thebase.in/hc/ja/articles/115000107921"}]},{"id":"answers-15","title":"「今、会社を選ぶときに何を大事にしていますか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶときに\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしていますか。","zh":""},{"type":"note","ja":"","zh":"说选择公司的判断标准，再说明实际工作中为什么需要这个条件。"},{"type":"speech","ja":"デザイナーが、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>くところから、\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったものを\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>すところまで\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>われるかを\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしています。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>では「これで\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わる」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>って\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っても、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>は\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>のところで\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>うかもしれません。そういうときに、エンジニアの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>とも\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>起\u003crt>お\u003c/rt>\u003c/ruby>きたかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて、もう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>せる\u003cruby>環境\u003crt>かんきょう\u003c/rt>\u003c/ruby>で\u003cruby>働\u003crt>はたら\u003c/rt>\u003c/ruby>きたいです。","zh":"我选公司时很看重，设计师能不能从听用户怎么说，一直参与到产品做出来以后再回头改。因为我自己觉得「这样人家就看得懂了」，真正用的人可能会在另一个地方卡住。我想在这样的团队工作，能和工程师一起弄明白到底发生了什么，再回头改好。"}],"sources":[]},{"id":"answers-16","title":"「今後、選考に進むことは考えていますか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今後\u003crt>こんご\u003c/rt>\u003c/ruby>、\u003cruby>選考\u003crt>せんこう\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>むことは\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていますか。","zh":""},{"type":"note","ja":"","zh":"这句用于有兴趣、还想再想想的时候。如果已经决定应募，用下一句。"},{"type":"speech","ja":"はい、\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えています。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ったことを\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>してから\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めたいです。","zh":"有，我在考虑申请。我想把今天听到的内容整理一下，再做决定。"}],"sources":[]},{"id":"answers-17","title":"当天已经明确想进一步应募时。如果已经听过申请方法，说完想申请就好","page":"","blocks":[{"type":"note","ja":"","zh":"当天已经明确想进一步应募时。如果已经听过申请方法，说完想申请就好。"},{"type":"speech","ja":"はい、ぜひ\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>したいです。このあと、まず\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をすればいいか\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えていただけますか。","zh":"想，我很想申请。请问接下来第一步该做什么？"}],"sources":[]},{"id":"answers-18","title":"「ほかにも、使っている方の話で印象に残ったものはありますか。」","page":"","blocks":[{"type":"prompt","ja":"ほかにも、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っている\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>で\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>ったものはありますか。","zh":""},{"type":"note","ja":"","zh":"对方想听别人的购物体验时再讲。刚才说的是你的购物习惯，这里说的是一位店主自己购物时的经历。"},{"type":"speech","ja":"はい。M’s
