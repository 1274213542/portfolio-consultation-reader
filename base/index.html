y>少\u003crt>すこ\u003c/rt>\u003c/ruby>しでも\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れやすく、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすい\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にできると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。\u003cruby>手順\u003crt>てじゅん\u003c/rt>\u003c/ruby>の\u003cruby>効率\u003crt>こうりつ\u003c/rt>\u003c/ruby>や、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うときの\u003cruby>気持\u003crt>きも\u003c/rt>\u003c/ruby>ちまで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるところに\u003cruby>魅力\u003crt>みりょく\u003c/rt>\u003c/ruby>を\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じています。","zh":"我觉得设计有意思，是因为可以把已有的东西拆开，再重新组合，从里面创造出新的价值。生活里有些事很麻烦，可我们总得去做，也有些东西本身就很复杂。我觉得，通过设计，可以让这些事变得容易接受一点，做起来也顺手一点。我喜欢的是，除了琢磨怎样让步骤更省事，还能顾及人在使用时是什么心情。"}],"sources":[]},{"id":"answers-20","title":"「うちのサービスで、そういう面白さを感じた例はありますか。」","menuTitle":"我喜欢的 BASE 设计案例","page":"","blocks":[{"type":"prompt","ja":"うちのサービスで、そういう\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>さを\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じた\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>はありますか。","zh":""},{"type":"note","ja":"","zh":"对方顺着平面到 UI 的话题，问你在 BASE 看到过什么时再说。这一例是店家用的 BASE 网店编辑器。"},{"type":"speech","ja":"\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんがCocodaに\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれた、BASEのショップ\u003cruby>編集\u003crt>へんしゅう\u003c/rt>\u003c/ruby>\u003cruby>機能\u003crt>きのう\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>が\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。\u003cruby>以前\u003crt>いぜん\u003c/rt>\u003c/ruby>は、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にバナーを\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>足\u003crt>た\u003c/rt>\u003c/ruby>すのにもHTMLを\u003cruby>編集\u003crt>へんしゅう\u003c/rt>\u003c/ruby>する\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>があったそうですね。それが、スマホでパーツを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>がご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>で\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えられるようになった。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は「バナーを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>る」ほうにはなじみがあるんですけど、「お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が、\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せたいときに\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せられるようにする」ところもデザインできるんだ、というのが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>かったです。","zh":"我印象很深的是，北村先生在 Cocoda 写的那篇 BASE 网店编辑器改版。以前店主想给自己店里加一张横幅，还得去改 HTML。改版以后，店主用手机选好组件，自己就能改。我熟悉的是「做一张横幅」，所以读到这儿觉得特别有意思。原来「让店主能在自己想放的时候亲手把它放上去」，也是设计师能做的事。"}],"sources":[{"label":"北村本人在 Cocoda 复盘 BASE 网店编辑器","url":"https://cocoda.design/naomikun/p/p43bdf1c41f2a"}]},{"id":"answers-21","title":"「日本語でのやり取りについては、どう感じていますか。」","menuTitle":"日语听说和日常沟通","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>でのやり\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りについては、どう\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じていますか。","zh":""},{"type":"note","ja":"","zh":"对方主动问到语言时用。如果刚刚问过外籍同事、聊过自己的情况，这段就已经答过了。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>でお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>く\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>には、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>ほとんど\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>らないんです。ただ、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えをその\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えるときは、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>が\u003cruby>母語\u003crt>ぼご\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>ほどすぐには\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てこないことがあります。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>も\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>の\u003cruby>勉強\u003crt>べんきょう\u003c/rt>\u003c/ruby>は\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けていますし、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>から\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>のほうから\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しかけるようにしています。\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>ったときは、AIや\u003cruby>翻訳\u003crt>ほんやく\u003c/rt>\u003c/ruby>ツールの\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>も\u003cruby>借\u003crt>か\u003c/rt>\u003c/ruby>りて、\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたいことに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>う\u003cruby>表現\u003crt>ひょうげん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>していきたいです。","zh":"我平时听大家说日语，基本上没有什么困难。只是要当场说出自己的想法时，有些话确实没法像日语母语者那样一下子就说出来。我一直在学日语，平时跟人相处也会主动开口。碰到拿不准该怎么说的时候，我也愿意借助 AI 或翻译工具，找个更贴近自己本意的说法。"}],"sources":[]},{"id":"answers-22","title":"「チームでどんな強みを生かしたいですか。」","menuTitle":"我想在团队发挥的设计强项","page":"","blocks":[{"type":"prompt","ja":"チームでどんな\u003cruby>強\u003crt>つよ\u003c/rt>\u003c/ruby>みを\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>かしたいですか。","zh":""},{"type":"note","ja":"","zh":"如果刚讲过 TUCK，对方还记得拖鞋的例子，直接从讲评和你想为团队做的事接起。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>なのは、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>立場\u003crt>たちば\u003c/rt>\u003c/ruby>で「\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>どおりにいかなかったらどうなるかな」と、そこまで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ることです。\u003cruby>掃除\u003crt>そうじ\u003c/rt>\u003c/ruby>ロボットの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>でも、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパの\u003cruby>片付\u003crt>かたづ\u003c/rt>\u003c/ruby>けを\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んで、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>だけ\u003cruby>片付\u003crt>かたづ\u003c/rt>\u003c/ruby>いたら、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>ならまず「じゃあ、スリッパはどこ？」って\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。それで、\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>ったスリッパの\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せる\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にしました。","zh":"我比较擅长的是，站在用的人这边，多想一步「如果事情没按预想发展，会怎么样」，再把这个情况做到界面里。比如我的扫地机器人作品，让它去收袜子和拖鞋，结果只收好了袜子，换作是我，第一个反应就是「那拖鞋在哪儿？」。所以我让界面先告诉人，没收好的拖鞋留在什么地方。"},{"type":"speech","ja":"\u003cruby>先日\u003crt>せんじつ\u003c/rt>\u003c/ruby>のポートフォリオ\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>\u003cruby>会\u003crt>かい\u003c/rt>\u003c/ruby>でも、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>まで\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かく\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にできているところを\u003cruby>褒\u003crt>ほ\u003c/rt>\u003c/ruby>めていただきました。チームで\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ているときも、「この\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>はどうなるんだろう」と\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づいたら、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>から\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>上\u003crt>あ\u003c/rt>\u003c/ruby>げて、どうしたらいいか\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていきたいです。","zh":"前几天的作品集咨询会上，讲评人也肯定了我这一点，说我能把实际使用时的情况想得比较细，再落实到界面里。以后跟团队一起看方案，如果发现「那碰到这种情况会怎么样呢？」，我想主动提出来，跟大家一起想办法。"}],"sources":[]},{"id":"answers-23","title":"「大学で、グループで何か作ったことはありますか。」","menuTitle":"小组制作时我负责什么","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>大学\u003crt>だいがく\u003c/rt>\u003c/ruby>で、グループで\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったことはありますか。","zh":""},{"type":"note","ja":"","zh":"先说一起做了什么、自己负责哪部分。等对方感兴趣再展开分工。"},{"type":"speech","ja":"はい。\u003cruby>大学\u003crt>だいがく\u003c/rt>\u003c/ruby>の\u003cruby>授業\u003crt>じゅぎょう\u003c/rt>\u003c/ruby>で、みんなで\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>の\u003cruby>雑誌\u003crt>ざっし\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったことがあります。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>はメンバーから\u003cruby>原稿\u003crt>げんこう\u003c/rt>\u003c/ruby>や\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>を\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>って、\u003cruby>誌面\u003crt>しめん\u003c/rt>\u003c/ruby>\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>のレイアウトを\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>しました。\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は\u003cruby>全員\u003crt>ぜんいん\u003c/rt>\u003c/ruby>で\u003cruby>校正\u003crt>こうせい\u003c/rt>\u003c/ruby>して、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>して\u003cruby>印刷\u003crt>いんさつ\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>した\u003cruby>雑誌\u003crt>ざっし\u003c/rt>\u003c/ruby>は、\u003cruby>授業\u003crt>じゅぎょう\u003c/rt>\u003c/ruby>の\u003cruby>優秀\u003crt>ゆうしゅう\u003c/rt>\u003c/ruby>\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>に\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ばれました。","zh":"有。大学有门课，我们小组一起做过一本杂志。组员把稿件和照片交给我，我负责整本杂志的版面。最后我们一起校对，由我改好后交印。做出来的杂志入选了这门课的优秀作品。"}],"sources":[]},{"id":"answers-24","title":"「一緒に進める中で、難しかったことはありましたか。」","menuTitle":"小组合作时遇到的困难","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>める\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>難\u003crt>むずか\u003c/rt>\u003c/ruby>しかったことはありましたか。","zh":""},{"type":"note","ja":"","zh":"承接杂志项目，说清自己为什么注意到分工问题。"},{"type":"speech","ja":"\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>を\u003cruby>何人\u003crt>なんにん\u003c/rt>\u003c/ruby>かで\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めていたり、\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>によって\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>み\u003cruby>具合\u003crt>ぐあい\u003c/rt>\u003c/ruby>に\u003cruby>差\u003crt>さ\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>たりしたんです。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>原稿\u003crt>げんこう\u003c/rt>\u003c/ruby>を\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ってページを\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>む\u003cruby>役\u003crt>やく\u003c/rt>\u003c/ruby>だったので、そこが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になって。「\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>、\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>なことに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>分担\u003crt>ぶんたん\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>しませんか」と\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけました。それで、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をいつまでに\u003cruby>用意\u003crt>ようい\u003c/rt>\u003c/ruby>するか、みんなで\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>め\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>しました。","zh":"做了一阵子，有的工作好几个人都在做，各部分的进度也不太一样。我负责拿到稿件后排版，所以留意到了这个问题。我就跟大家提议，「我们要不要按各自擅长的事情，再看一下怎么分工？」后来大家一起重新定了谁负责什么、什么时候交。"}],"sources":[]},{"id":"answers-25","title":"「もう一度やるとしたら、何か変えたいことはありますか。」","menuTitle":"再做一次会怎么改进分工","page":"","blocks":[{"type":"prompt","ja":"もう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>やるとしたら、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えたいことはありますか。","zh":""},{"type":"note","ja":"","zh":"如果对方对合作过程有兴趣，补一句回头看学到了什么。"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>だったら、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にそれぞれ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>か、どれくらい\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>き\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>けられそうかを\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いておきたいです。あとは、\u003cruby>仕上\u003crt>しあ\u003c/rt>\u003c/ruby>げに\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>る\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>、\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>のものをみんなで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ようと\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めておきます。そうすれば、\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>が\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>なっても\u003cruby>早\u003crt>はや\u003c/rt>\u003c/ruby>めに\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づけると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うので。","zh":"现在再做的话，我会先问大家各自擅长什么、大概能承担多少工作。还会提前约一次，在进入最后收尾之前，大家一起看看各自手头做到哪里了。这样就算有工作重叠，也能早点发现。"}],"sources":[]}]},{"id":"feedback","label":"听完反馈怎么接","items":[{"id":"feedback-1","title":"作品刚讲完、还没收到具体建议","menuTitle":"请对方给作品提建议","page":"","blocks":[{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がどうしてこのデザインにしたのか、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>われたところがあれば、\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えていただけますか。","zh":"刚才介绍的作品里，如果有哪一处让您想多听听我为什么这么设计，能请您指出来吗？"}],"sources":[]},{"id":"feedback-2","title":"比如，对方说TUCK的场景讲得太快","menuTitle":"听到场景讲得太快","page":"","blocks":[{"type":"speech","ja":"ありがとうございます。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んだところを、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しゆっくりお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しするとよさそうですね。そうすると、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>だけが\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たときに、なぜスリッパのほうを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>したのかも\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりそうです。","zh":"谢谢。我可以把一开始袜子和拖鞋两样都交给机器人的那段，稍微讲慢一点。这样后面只收到袜子的通知时，为什么要把拖鞋放在前面，听起来应该也更容易理解。"}],"sources":[]},{"id":"feedback-3","title":"如果意见已经具体，到这里就可以停。如果对方只说「もう少しプロセスがあるといい」，可以请他举一处","menuTitle":"想请对方举一处具体建议","page":"","blocks":[{"type":"note","ja":"","zh":"如果意见已经具体，到这里就可以停。如果对方只说「もう少しプロセスがあるといい」，可以请他举一处。"},{"type":"speech","ja":"ありがとうございます。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、テーマを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>経緯\u003crt>けいい\u003c/rt>\u003c/ruby>と、\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>だと、どちらをもう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいですか。","zh":"谢谢。比如一开始怎么选定这个主题，以及后来为什么从两种界面方案里选了这一版，这两部分，您更想多听哪一块？"}],"sources":[]}]}],"links":[{"id":"answers-1","label":"今日はどんなことを聞いてみたいですか。"},{"id":"answers-2","label":"どうしてUI/UXを始めたんですか。"},{"id":"answers-3","label":"BASEに興味を持ったきっかけは何ですか。"},{"id":"answers-4","label":"BASEのどこに魅力を感じましたか。"},{"id":"answers-5","label":"PAY IDならではだと思ったところは？"},{"id":"answers-6","label":"UI/UXでは、今どんなことに興味がありますか。"},{"id":"answers-7","label":"どんな仕事に関わってみたいですか。"},{"id":"answers-8","label":"買い物のあとの、どんなところが気になりますか。"},{"id":"answers-9","label":"大学院では、何を研究しているんですか。"},{"id":"answers-10","label":"学生時代に力を入れたことは何ですか。"},{"id":"answers-11","label":"PAY IDは使ったことがありますか。"},{"id":"answers-12","label":"買う側として、どういう使い方が自分に合っていると思いますか。"},{"id":"answers-13","label":"お店の方にとっては、どう役に立つと思いましたか。"},{"id":"answers-14","label":"気になったところや、こうなったらいいと思うことは？"},{"id":"answers-15","label":"今、会社を選ぶときに何を大事にしていますか。"},{"id":"answers-16","label":"今後、選考に進むことは考えていますか。"},{"id":"answers-18","label":"ほかにも、使っている方の話で印象に残ったものはありますか。"},{"id":"answers-19","label":"なぜ、デザインが好きなのですか。"},{"id":"answers-20","label":"うちのサービスで、そういう面白さを感じた例はありますか。"},{"id":"answers-21","label":"日本語でのやり取りについては、どう感じていますか。"},{"id":"answers-22","label":"チームでどんな強みを生かしたいですか。"},{"id":"answers-23","label":"大学で、グループで何か作ったことはありますか。"},{"id":"answers-24","label":"一緒に進める中で、難しかったことはありましたか。"},{"id":"answers-25","label":"もう一度やるとしたら、何か変えたいことはありますか。"}]},{"id":"reverse","label":"逆質問","kind":"reverse","groups":[{"id":"company-talk","label":"逆質問","items":[{"id":"q28","title":"平常一周里，大家会一起做哪些事","menuTitle":"平常一周里，大家会一起做哪些事","page":"","blocks":[{"type":"speech","ja":"\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんがnoteに\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれたPAY IDのチーム\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>で、デザインをみんなで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>める、というお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>の\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>週間\u003crt>しゅうかん\u003c/rt>\u003c/ruby>だと、どんなときに\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>まって、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ているのか、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいです。","zh":"我读了北村先生在 note 上写的 PAY ID 团队介绍，里面提到设计是大家一起商量、一起定的。想请教一下，平常一周里，大家一般什么时候会聚在一起？到时候会一起看些什么？"},{"type":"reply","ja":"\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りかけでも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せ\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>えるのはいいですね。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>しながら、ほかの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>の\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えも\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けそうです。","zh":"做到一半也能拿出来交流，挺好的。既可以商量自己的方案，也能听听同事是怎么想的。","cue":"如果聊到大家会带上各自做到一半的东西一起看"}],"sources":[{"label":"北村的 note｜PAY ID 设计团队介绍","url":"https://note.com/naomi_kun/n/n371a828258d9"}],"followups":[],"reverse":"28","audience":""},{"id":"q24","title":"新人发现可以改的小地方，怎么跟团队聊","menuTitle":"新人发现可以改的小地方，怎么跟团队聊","page":"","blocks":[{"type":"speech","ja":"\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんのnoteに、チームでPAY IDを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っていて\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づいたことを\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>き\u003cruby>留\u003crt>と\u003c/rt>\u003c/ruby>めていた、というお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>がありました。\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったばかりの\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が「あれ、ここがちょっと\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になるな」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったら、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>はどんなふうにチームに\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ちかけるんでしょうか。","zh":"北村先生在那篇 note 上写到，大家自己用 PAY ID 时，会把留意到的地方记下来。我就有点好奇，刚进公司的人如果也觉得「咦，这里好像可以改改」，平时会怎么跟团队提起这件事呢？"},{"type":"reply","ja":"\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>触\u003crt>さわ\u003c/rt>\u003c/ruby>りながら\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>せるなら、まだ\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えがまとまっていなくても\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>しやすそうです。","zh":"如果能边试边聊，就算自己的想法还没完全成形，也比较容易开口。","cue":"如果聊到会先请提出想法的人演示一下当时是怎么用的"}],"sources":[{"label":"北村的 note｜PAY ID 设计团队介绍","url":"https://note.com/naomi_kun/n/n371a828258d9"}],"followups":[],"reverse":"24","audience":""},{"id":"q35","title":"新人怎么认识其他团队的同事","menuTitle":"新人怎么认识其他团队的同事","page":"","blocks":[{"type":"speech","ja":"\u003cruby>成原\u003crt>なりはら\u003c/rt>\u003c/ruby>さんがBASE BookでPAY.JPの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>たちにインタビューされた\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>で、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>オフィスでどれくらい\u003cruby>顔\u003crt>かお\u003c/rt>\u003c/ruby>を\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせるか、というお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ていましたよね。\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しく\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、ほかのチームの\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>とも\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>り\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>うきっかけって、どんなところにありますか。","zh":"我在 BASE Book 读了成原女士采访 PAY.JP 团队的文章，里面聊到大家平常有多少机会在办公室碰面。所以我也挺好奇，刚进公司的人一般是通过什么机会，慢慢认识别的团队的同事的？"},{"type":"reply","ja":"\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>が\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>してくださるんですね。\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>顔\u003crt>かお\u003c/rt>\u003c/ruby>を\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせておけると、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>からも\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけやすそうです。","zh":"原来会有前辈帮忙介绍。这样先见过一次，下次自己也比较好开口。","cue":"如果聊到一起工作的前辈会帮忙介绍"}],"sources":[{"label":"BASE Book｜成原采访 PAY.JP 业务团队的工作日常","url":"https://basebook.binc.jp/entry/2023/09/27/125516"}],"followups":[],"reverse":"35","audience":""},{"id":"q15","title":"团队日常工作里怎么用 AI","menuTitle":"团队日常工作里怎么用 AI","page":"","blocks":[{"type":"speech","ja":"AIの\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>についてもちょっと\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいんですが、BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>した\u003cruby>際\u003crt>さい\u003c/rt>\u003c/ruby>に、\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんと\u003cruby>宮地\u003crt>みやじ\u003c/rt>\u003c/ruby>さんがAIで\u003cruby>試作品\u003crt>しさくひん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>って、\u003cruby>開発\u003crt>かいはつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>と\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>のお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>最近\u003crt>さいきん\u003c/rt>\u003c/ruby>「こういうときにAIを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うと\u003cruby>助\u003crt>たす\u003c/rt>\u003c/ruby>かるな」と\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じた\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>があれば、ぜひ\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えてください。","zh":"我也想请教一下平时用 AI 的情况。BASE 集团官方 note 上有一篇 PAY ID 商品搜索改版访谈，里面说北村先生和宫地先生用 AI 做了原型，拿给开发同事一起看。最近大家工作时，有没有哪一次特别觉得「这件事有 AI 帮忙真方便」？我很想听听。"},{"type":"reply","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>触\u003crt>ふ\u003c/rt>\u003c/ruby>れるところまで\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>せるんですね。ちなみに、そういう\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>にはどのツールやモデルをよく\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>われるんでしょうか。","zh":"原来能直接试到上手操作这一步。顺便想问一句，像这样的原型，平时比较常用哪种工具或模型呢？","cue":"如果聊到用 AI 做原型、试界面，还没提工具名"}],"sources":[{"label":"BASE 集团官方 note｜PAY ID 搜索改版三人访谈","url":"https://note.com/base_group/n/n39a643caaa7d"}],"followups":[{"cue":"如果举的是整理访谈或推敲文案的例子","ja":"\u003cruby>文章\u003crt>ぶんしょう\u003c/rt>\u003c/ruby>を\u003cruby>扱\u003crt>あつか\u003c/rt>\u003c/ruby>うときにも\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うんですね。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>のお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>だと、\u003cruby>特\u003crt>とく\u003c/rt>\u003c/ruby>に\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>が\u003cruby>減\u003crt>へ\u003c/rt>\u003c/ruby>ったのはどの\u003cruby>部分\u003crt>ぶぶん\u003c/rt>\u003c/ruby>でしょうか。","zh":"原来处理文字时也用得上。像刚才说的那项工作，具体是哪一步省下的工夫最多呢？"},{"cue":"如果提了几种工具或模型，还没讲为什么选","ja":"いくつか\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けていらっしゃるんですね。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>のお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>でそのツールを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ばれた\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>も、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってみたいです。","zh":"原来会分情况用不同的工具。我也挺好奇，刚才说的这项工作，为什么特别适合用这个工具？"},{"cue":"如果平时很少用，或不便谈工具，回到团队怎么工作","ja":"ありがとうございます。では、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>の\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>め\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>についても\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し。まだ\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えがまとまりきっていない\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>かに\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらいたいときって、どんなふうに\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけるんでしょうか。","zh":"谢谢。那我也想了解一下平时怎么一起做事。一个想法还没完全成形，想先请同事看一眼的时候，大家一般会怎么开口？"}],"reverse":"15","audience":""},{"id":"q25","title":"新人头半年希望练会什么","menuTitle":"新人头半年希望练会什么","page":"","blocks":[{"type":"speech","ja":"PAY IDの\u003cruby>新卒\u003crt>しんそつ\u003c/rt>\u003c/ruby>デザイナーの\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページで、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>と\u003cruby>小\u003crt>ちい\u003c/rt>\u003c/ruby>さな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めると\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。そこから\u003cruby>半年\u003crt>はんとし\u003c/rt>\u003c/ruby>くらいたった\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>に、「これができるようになると\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>もしいな」と\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じるのは、どんなことでしょうか。","zh":"我在 PAY ID 的新卒设计师招聘页上看到，刚入职会跟前辈从小任务做起。从那时候再往后看半年，要是新人能自己做好哪件事，团队会觉得「这下可以放心交给他了」？"},{"type":"reply","ja":"まず\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>って\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>する、ということですね。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>でも\u003cruby>意識\u003crt>いしき\u003c/rt>\u003c/ruby>してみます。","zh":"先想出一个自己的方案，再去找人商量。这一点，我现在做设计时就可以试着练习。","cue":"如果聊到希望新人带着自己的想法来商量"}],"sources":[{"label":"PAY ID 28 卒设计师招聘页","url":"https://open.talentio.com/r/1/c/binc/pages/128919"}],"followups":[],"reverse":"25","audience":""},{"id":"q34","title":"BASE 社内也有外籍同事吗","menuTitle":"BASE 社内也有外籍同事吗","page":"","blocks":[{"type":"speech","ja":"\u003cruby>私自身\u003crt>わたしじしん\u003c/rt>\u003c/ruby>も\u003cruby>留学生\u003crt>りゅうがくせい\u003c/rt>\u003c/ruby>なので、\u003cruby>働\u003crt>はたら\u003c/rt>\u003c/ruby>く\u003cruby>環境\u003crt>かんきょう\u003c/rt>\u003c/ruby>のことで\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいんですが、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、BASEには\u003cruby>外国籍\u003crt>がいこくせき\u003c/rt>\u003c/ruby>の\u003cruby>社員\u003crt>しゃいん\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>もいらっしゃるんでしょうか。","zh":"我自己也是留学生，所以有个关于工作环境的问题想请教一下。请问现在 BASE 也有外籍同事吗？"},{"type":"reply","ja":"そうなんですね。ありがとうございます。","zh":"原来是这样，谢谢。","cue":"听完对方的回答，先接一句"}],"sources":[{"label":"BASE 集团官网｜社会・DE&I 的人事制度","url":"https://binc.jp/esg/esg-social"}],"followups":[{"cue":"接着说说，自己为什么会关心这件事","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>でお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>く\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>には、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>ほとんど\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>らないんです。ただ、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えをその\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えるときは、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>が\u003cruby>母語\u003crt>ぼご\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>ほどすぐには\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てこないことがあります。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>も\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>の\u003cruby>勉強\u003crt>べんきょう\u003c/rt>\u003c/ruby>は\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けていますし、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>から\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>のほうから\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しかけるようにしています。\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>ったときは、AIや\u003cruby>翻訳\u003crt>ほんやく\u003c/rt>\u003c/ruby>ツールの\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>も\u003cruby>借\u003crt>か\u003c/rt>\u003c/ruby>りて、\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたいことに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>う\u003cruby>表現\u003crt>ひょうげん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>していきたいです。","zh":"我平时听大家说日语，基本上没有什么困难。只是要当场说出自己的想法时，有些话确实没法像日语母语者那样一下子就说出来。我一直在学日语，平时跟人相处也会主动开口。碰到拿不准该怎么说的时候，我也愿意借助 AI 或翻译工具，找个更贴近自己本意的说法。"},{"cue":"顺着上句，说到自己想为团队做什么","ja":"それで、\u003cruby>国籍\u003crt>こくせき\u003c/rt>\u003c/ruby>や\u003cruby>母語\u003crt>ぼご\u003c/rt>\u003c/ruby>に\u003cruby>関係\u003crt>かんけい\u003c/rt>\u003c/ruby>なく、\u003cruby>私自身\u003crt>わたしじしん\u003c/rt>\u003c/ruby>がチームの\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>になれるのはどんなところかな、って\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるんです。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は、デザインを\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めるときに「\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>はどこで\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>っていて、どうしてそうなるんだろう」と、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていくのが\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>です。チームでも、そこを\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>して「だから、まずここを\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えてみませんか」と、\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>と\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>していきたいです。","zh":"所以我也常想，抛开国籍和母语，我自己有什么本事能帮上团队？我比较擅长在开始做设计时，把「人用到哪里会觉得困难，为什么会这样」一步一步想清楚。在团队里，我想把这些原因理清，再跟大家说「所以，我们要不要先试着改这里？」。这是我想发挥的能力。"}],"reverse":"34","audience":""},{"id":"q23","title":"从哪些小事能感受到 BASE 的工作氛围","menuTitle":"从哪些小事能感受到 BASE 的工作氛围","page":"","blocks":[{"type":"speech","ja":"BASE Bookで、\u003cruby>成原\u003crt>なりはら\u003c/rt>\u003c/ruby>さんが\u003cruby>経営\u003crt>けいえい\u003c/rt>\u003c/ruby>\u003cruby>戦略\u003crt>せんりゃく\u003c/rt>\u003c/ruby>\u003cruby>室\u003crt>しつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>に「We are All Owners」という\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>の\u003cruby>由来\u003crt>ゆらい\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>かれた\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>のお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>で「あ、こういうところがBASEらしいな」と\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じたことがあれば、ちょっと\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいです。","zh":"我在 BASE Book 读到，成原女士采访经营战略室的同事，聊的是「We are All Owners」这句话怎么来的。我挺想听听，在日常工作里，有没有哪一件小事，让人觉得「嗯，这还挺像 BASE 的」？"},{"type":"reply","ja":"まずご\u003cruby>本人\u003crt>ほんにん\u003c/rt>\u003c/ruby>に「どうしたいですか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>くんですね。そういう\u003cruby>一言\u003crt>ひとこと\u003c/rt>\u003c/ruby>にも、チームの\u003cruby>雰囲気\u003crt>ふんいき\u003c/rt>\u003c/ruby>って\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>るんですね。","zh":"原来大家会先问那个人「你自己想怎么做」。这么一句平常的话，也能让人感受到团队的氛围。","cue":"如果聊到同事会先听当事人自己想怎么做"}],"sources":[{"label":"BASE Book｜成原采访经营战略室，谈 We are All Owners 的由来","url":"https://basebook.binc.jp/entry/2023/05/25/182347"}],"followups":[],"reverse":"23","audience":""},{"id":"q13","title":"平时从哪里听到买家自己的说法","menuTitle":"平时从哪里听到买家自己的说法","page":"","blocks":[{"type":"speech","ja":"BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteでPAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>した\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んで、\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>だけで\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>したい、という\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>もいたのが\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>りました。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>のこういう\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>って、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>はどういう\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>でチームに\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>くんでしょうか。","zh":"我在 BASE 集团官方 note 读了 PAY ID 商品搜索改版的文章。里面说，有些买家只想在自己喜欢的那家店里找，我对这点印象挺深的。像这样的想法，平时是怎么传到团队这里的呢？"},{"type":"reply","ja":"\u003cruby>直接\u003crt>ちょくせつ\u003c/rt>\u003c/ruby>お\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けるんですね。\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったばかりのデザイナーにも、そういう\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>に\u003cruby>同席\u003crt>どうせき\u003c/rt>\u003c/ruby>する\u003cruby>機会\u003crt>きかい\u003c/rt>\u003c/ruby>はありますか。","zh":"原来可以直接听买家自己讲。刚入职的设计师也有机会坐在旁边听吗？","cue":"如果聊到会直接和买家谈，而且还没说新人能否参加"}],"sources":[{"label":"BASE 集团官方 note｜PAY ID 搜索改版三人访谈","url":"https://note.com/base_group/n/n39a643caaa7d"}],"followups":[],"reverse":"13","audience":""},{"id":"q22","title":"学平面的经验，在团队里哪里用得上","menuTitle":"学平面的经验，在团队里哪里用得上","page":"","blocks":[{"type":"speech","ja":"BASE Bookのデザインチームのインタビューで、\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんは\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>でDTPや\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>を\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>されてから、UIの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>に\u003cruby>移\u003crt>うつ\u003c/rt>\u003c/ruby>られたと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>も\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>ではグラフィックを\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>んだので、チームの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、そういう\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>が\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>きる\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>があれば\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってみたいです。","zh":"我在 BASE Book 的设计团队访谈里读到，北村先生先在制作公司做 DTP 和企划，后来转做 UI。我本科也是学平面的，所以挺想了解，平面的经验在团队工作中，有哪些时候特别用得上？"},{"type":"reply","ja":"\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>か\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べてから\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるんですね。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>る\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>でも、アイデアを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すところはつながっているんですね。","zh":"原来会先把几个想法画在纸上，摆在一起看。即使做的是屏幕上的东西，最开始想方案的办法还是能沿用。","cue":"如果有人提到以前会先在纸上画几种草案，如今也这样开头"}],"sources":[{"label":"BASE Book｜2019 年设计团队成员访谈","url":"https://basebook.binc.jp/entry/2019/05/28/110000"}],"followups":[],"reverse":"22","audience":""},{"id":"q27","title":"当面聊时最想让学生知道什么","menuTitle":"当面聊时最想让学生知道什么","page":"","blocks":[{"type":"speech","ja":"BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで\u003cruby>新卒採用\u003crt>しんそつさいよう\u003c/rt>\u003c/ruby>の\u003cruby>座談会\u003crt>ざだんかい\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>学生\u003crt>がくせい\u003c/rt>\u003c/ruby>がよく\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べて\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るからこそ、\u003cruby>会\u003crt>あ\u003c/rt>\u003c/ruby>ったときに\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>から\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>える、という\u003cruby>成原\u003crt>なりはら\u003c/rt>\u003c/ruby>さんのお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>が\u003cruby>心\u003crt>こころ\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>みたいに\u003cruby>直接\u003crt>ちょくせつ\u003c/rt>\u003c/ruby>お\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しする\u003cruby>機会\u003crt>きかい\u003c/rt>\u003c/ruby>だからこそ、\u003cruby>学生\u003crt>がくせい\u003c/rt>\u003c/ruby>に\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>ってもらえたらと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うことはありますか。","zh":"我在 BASE 集团官方 note 读了新卒招聘座谈。成原女士说，学生来之前已经查过很多资料，所以公司也会想，见了面要聊什么。这句话我一直记得。像今天这样能直接聊天，有什么是你们尤其希望学生了解的吗？"},{"type":"reply","ja":"\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>と\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>められるのは\u003cruby>心強\u003crt>こころづよ\u003c/rt>\u003c/ruby>いです。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>だと、\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>と\u003cruby>役割\u003crt>やくわり\u003c/rt>\u003c/ruby>をどう\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めるのか、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってもいいでしょうか。","zh":"能跟前辈一起做，确实让人安心。我想再多了解一点，新人接到第一项工作时，一般会怎么跟前辈分工、一起往下做呢？","cue":"如果谈到新人会和前辈一起做任务"}],"sources":[{"label":"BASE 集团官方 note｜成原等人谈新卒招聘","url":"https://note.com/base_group/n/ncf1502e8af6e"}],"followups":[],"reverse":"27","audience":""},{"id":"q37","title":"哪处值得把中途的方案也拿出来","menuTitle":"哪处值得把中途的方案也拿出来","page":"","blocks":[{"type":"speech","ja":"\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>ほどの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>のことで、もう\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つだけご\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>を\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいです。\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>した\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、「ここはほかにどんな\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>したんだろう」と\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったところがあれば、\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えていただけるとうれしいです。","zh":"关于刚才一起看的作品，我还想听听意见。看成品的时候，有没有哪一处让人好奇「这里是不是还试过别的方案」？如果有，我很想知道是哪一处。"},{"type":"reply","ja":"はい、14ページに\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べています。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>なら、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>がお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>していることが\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるので、この\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。","zh":"好，几个方案都放在第 14 页了。中间这版能同时看到包裹已经到店，以及店家正在检查衣服，所以最后选了它。","cue":"如果聊到想看 MORI 里包裹到店后的页面为什么定成这一版"}],"sources":[],"followups":[],"reverse":"37","audience":""},{"id":"q29","title":"想申请时，下一步怎么走","menuTitle":"想申请时，下一步怎么走","page":"","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に、\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>のことも\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つだけ\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>えたらと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>お\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いて、PAY IDのデザイナーの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>にますます\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>が\u003cruby>湧\u003crt>わ\u003c/rt>\u003c/ruby>きました。28\u003cruby>卒\u003crt>そつ\u003c/rt>\u003c/ruby>の\u003cruby>選考\u003crt>せんこう\u003c/rt>\u003c/ruby>に\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>したいのですが、このあとどう\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めるのがよいでしょうか。","zh":"最后，我还想请教一件关于申请的事。今天聊过以后，我对 PAY ID 设计师的工作更感兴趣了。我想参加 28 卒选考，接下来应该怎么申请比较好呢？"},{"type":"reply","ja":"\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりました。では、\u003cruby>作品集\u003crt>さくひんしゅう\u003c/rt>\u003c/ruby>を\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>して、\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページから\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>します。ありがとうございます。","zh":"明白了，那我会准备好作品集，从招聘页申请。谢谢您。","cue":"如果聊到从招聘页提交作品集就可以"}],"sources":[],"followups":[],"reverse":"29","audience":""},{"id":"q14","title":"能动的原型怎么交给开发","menuTitle":"能动的原型怎么交给开发","page":"","blocks":[{"type":"speech","ja":"\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>ほどの\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>のお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>で、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいことがあります。BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDの\u003cruby>価格帯\u003crt>かかくたい\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶスライダーには、\u003cruby>宮地\u003crt>みやじ\u003c/rt>\u003c/ruby>さんの\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たiOSのエンジニアの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>の\u003cruby>提案\u003crt>ていあん\u003c/rt>\u003c/ruby>で、\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>が\u003cruby>加\u003crt>くわ\u003c/rt>\u003c/ruby>わったと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。こういう\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かい\u003cruby>手触\u003crt>てざわ\u003c/rt>\u003c/ruby>りについて、デザインと\u003cruby>開発\u003crt>かいはつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>どうやって\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせているのか、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になっています。","zh":"听了刚才做原型的事，我还有一点挺好奇。我在 BASE 集团官方 note 读到，宫地先生做了 PAY ID 选价格区间的滑块原型，iOS 工程师看过以后，提出加上震动。像这种手感上的小细节，设计和开发的同事平常是怎么一起讨论、达成共识的呢？"},{"type":"reply","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>のアプリと\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べて\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>すと、\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>にしにくい\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いも、その\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>で\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめられますね。","zh":"原来会把实际 App 和原型放在一起试。这样连有点说不清的差别，大家也可以当场一起确认。","cue":"如果聊到会把原型和实际 App 摆在一起试"}],"sources":[{"label":"BASE 集团官方 note｜PAY ID 搜索改版三人访谈","url":"https://note.com/base_group/n/n39a643caaa7d"}],"followups":[],"reverse":"14","audience":""}]}],"links":[{"id":"q28","label":"平常一周里，大家会一起做哪些事"},{"id":"q24","label":"新人发现可以改的小地方，怎么跟团队聊"},{"id":"q35","label":"新人怎么认识其他团队的同事"},{"id":"q15","label":"团队日常工作里怎么用 AI"},{"id":"q25","label":"新人头半年希望练会什么"},{"id":"q34","label":"BASE 社内也有外籍同事吗"},{"id":"q23","label":"从哪些小事能感受到 BASE 的工作氛围"},{"id":"q13","label":"平时从哪里听到买家自己的说法"},{"id":"q22","label":"学平面的经验，在团队里哪里用得上"},{"id":"q27","label":"当面聊时最想让学生知道什么"},{"id":"q37","label":"哪处值得把中途的方案也拿出来"},{"id":"q29","label":"想申请时，下一步怎么走"},{"id":"q14","label":"能动的原型怎么交给开发"}]},{"id":"closing","label":"收尾","kind":"flow","groups":[{"id":"closing","label":"临场和收尾","items":[{"id":"closing-1","title":"声音没听清","menuTitle":"没听清时请对方重复","page":"","blocks":[{"type":"speech","ja":"すみません、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>のところだけ、もう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>おっしゃっていただけますか。","zh":"不好意思，最后那部分可以再说一遍吗？"}],"sources":[]},{"id":"closing-2","title":"听到了，但不确定对方问页面还是原型","menuTitle":"确认在问页面还是原型","page":"","blocks":[{"type":"speech","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>についてですか。それとも、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せている\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>のプロトタイプについてですか。","zh":"您问的是结果界面怎么做，还是最后展示的操作原型？"}],"sources":[]},{"id":"closing-3","title":"需要想一下","menuTitle":"需要一点时间想想","page":"","blocks":[{"type":"speech","ja":"\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しだけ\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるお\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>をいただいてもいいですか。","zh":"可以让我想一下吗？"}],"sources":[]},{"id":"closing-4","title":"快到时间、还有一个问题时","menuTitle":"最后想问一个问题","page":"","blocks":[{"type":"speech","ja":"お\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>があれば、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>にもう\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つだけ\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってもよろしいですか。","zh":"如果时间允许，最后还可以再请教一个问题吗？"}],"sources":[]},{"id":"closing-5","title":"收尾。假如当天确实谈到用原型与开发沟通","menuTitle":"面谈结束时致谢","page":"","blocks":[{"type":"speech","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>はありがとうございました。\u003cruby>特\u003crt>とく\u003c/rt>\u003c/ruby>に、\u003cruby>開発\u003crt>かいはつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>とプロトタイプを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>触\u003crt>さわ\u003c/rt>\u003c/ruby>りながら\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>されるというお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>が\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。\u003cruby>皆\u003crt>みな\u003c/rt>\u003c/ruby>さんが\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>どうやって\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をされているのか、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>想像\u003crt>そうぞう\u003c/rt>\u003c/ruby>できるようになりました。","zh":"今天谢谢两位。印象特别深的是，你们会和开发同事一起动手试原型，边试边商量。现在我更能想象大家平时是怎么一起做事的了。"}],"sources":[]},{"id":"thanks","title":"感谢与回应 · 20 句","menuTitle":"感谢与回应 · 20 句","page":"","blocks":[{"type":"note","ja":"","zh":"听到对应内容时，挑一句就好。谈到本选考，17 是已决定申请，18 是仍在考虑，19 适合对方也提到以后再聊时用。"},{"type":"reply","ja":"UIのお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めた\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>のお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>まで\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けて、うれしいです。\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>でご\u003cruby>経歴\u003crt>けいれき\u003c/rt>\u003c/ruby>を\u003cruby>拝見\u003crt>はいけん\u003c/rt>\u003c/ruby>して、ちょうどその\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>のことを\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってみたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っていたんです。","zh":"能听您聊刚开始做 UI 时的事，我很开心。我在文章里读到过您的经历，当时就很想听听那段时间的事。","cue":"01｜北村讲起从平面转做界面时的摸索"},{"type":"reply","ja":"スマホで\u003cruby>編集\u003crt>へんしゅう\u003c/rt>\u003c/ruby>できる\u003cruby>良\u003crt>よ\u003c/rt>\u003c/ruby>さが、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>のお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>でよく\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりました。お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にとっては、ちょっと\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>したいところがあるたびにパソコンを\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>かずに\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>むのは\u003cruby>助\u003crt>たす\u003c/rt>\u003c/ruby>かりますよね。","zh":"听您这么讲，我明白能在手机上改店铺到底好在哪里了。站在店主的角度，临时有个小地方想改，不用回回都专门打开电脑，确实省事。","cue":"02｜北村解释为什么让店主也能用手机改店铺"},{"type":"reply","ja":"「このお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>したい」っていうのも、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をする\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>には\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>なんですね。\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>のお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>から、その\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>がどんなふうにお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ているのかまで\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>えたのが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>かったです。","zh":"原来对买家来说，「我就是想在这家店里找」本身也很重要。听您聊搜索，居然能一路听到那个人到底是怎么逛店的，我觉得很有意思。","cue":"03｜北村解释买家为什么想在同一家店里接着找"},{"type":"reply","ja":"\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>をきれいに\u003cruby>仕上\u003crt>しあ\u003c/rt>\u003c/ruby>げる\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、ちょっと\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらえるのがいいなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。「ここ、まだ\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>っていて」と\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>えたら、そこから\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>し\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>められますね。","zh":"我很喜欢这一点，方案还没打磨好，就能拿出来请大家看一眼。可以直接说「这里我还没想好」，这样一下就有话可聊了。","cue":"04｜北村说大家会把做到一半的设计拿出来一起看"},{"type":"reply","ja":"\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>のところは、エンジニアの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>から\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>たアイデアだったんですね。その\u003cruby>一言\u003crt>ひとこと\u003c/rt>\u003c/ruby>で、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は\u003cruby>指先\u003crt>ゆびさき\u003c/rt>\u003c/ruby>の\u003cruby>感覚\u003crt>かんかく\u003c/rt>\u003c/ruby>まで\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わったというお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>が\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>りました。","zh":"原来滑动时的振动是工程师想到的。就这么一个提议，最后连用户手指上的感觉都变了，这个细节我很有印象。","cue":"05｜北村说起滑块的振动手感来自工程师的建议"},{"type":"reply","ja":"「こういう\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きです」ってその\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せられるのが、いいですね。AIで\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ると\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いて、そこからどんなふうに\u003cruby>皆\u003crt>みな\u003c/rt>\u003c/ruby>さんの\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>し\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>いにつながるのかが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になっていたんです。","zh":"能当场把「它是这样动的」演示给同事看，这点真好。我听到用 AI 做试作时就有点好奇，做出来以后，大家具体是怎么用它来讨论的。","cue":"06｜北村讲到用 AI 做一个大家都能上手试的原型"},{"type":"reply","ja":"\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>した\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>からは、そこまで\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>されたことって\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないですよね。\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>して\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>見送\u003crt>みおく\u003c/rt>\u003c/ruby>るか、\u003cruby>皆\u003crt>みな\u003c/rt>\u003c/ruby>さんがどう\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたのかを\u003cruby>直接\u003crt>ちょくせつ\u003c/rt>\u003c/ruby>\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けてよかったです。","zh":"从最后做好的界面上，其实看不出你们当时已经试到了这一步。能直接听您讲，团队是怎么考虑留下什么、哪些先不做的，我很高兴。","cue":"07｜北村谈到做了尝试，最后决定暂时不加某个功能"},{"type":"reply","ja":"\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えたと\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>って、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>も、\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してみたからこそ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かったことがあったのかなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。どんなことがきっかけで、\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えようという\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>になったんですか。","zh":"听您说中途换过方案，我想到，可能有些事正是试过最初那一版才发现的。当时是遇到了什么，让大家开始商量换个方向呢？","cue":"08｜北村说方案中途换了方向，你想听其中的缘由"},{"type":"reply","ja":"\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めてチームの\u003cruby>打\u003crt>う\u003c/rt>\u003c/ruby>ち\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせに\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>る\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>まで\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えてくださって、ありがとうございます。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>も\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ってくださるなら、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>も\u003cruby>落\u003crt>お\u003c/rt>\u003c/ruby>ち\u003cruby>着\u003crt>つ\u003c/rt>\u003c/ruby>いて\u003cruby>皆\u003crt>みな\u003c/rt>\u003c/ruby>さんのお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けそうです。","zh":"谢谢您连新人第一次参加团队讨论时是什么情形，都讲给我听。知道一开始会有前辈一起参加，我感觉自己也能踏实一点，先听听大家是怎么讨论的。","cue":"09｜成原说新人头一次参加团队讨论时会有前辈同行"},{"type":"reply","ja":"\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めの\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>の\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をそこまで\u003cruby>具体的\u003crt>ぐたいてき\u003c/rt>\u003c/ruby>に\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けてよかったです。まず\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて、\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>でチームの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>と\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る、という\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れが\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>のお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>でよく\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりました。","zh":"能听您这么具体地讲刚入职时的工作，我很高兴。先有时间自己想，做到一半再和团队一起看，您这么一讲，我就能想象一项工作是怎么展开的了。","cue":"10｜成原举例说明新人何时自己试、何时和团队碰面"},{"type":"reply","ja":"ほかの\u003cruby>職種\u003crt>しょくしゅ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>と\u003cruby>早\u003crt>はや\u003c/rt>\u003c/ruby>いうちに\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>り\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>えるのは\u003cruby>心強\u003crt>こころづよ\u003c/rt>\u003c/ruby>いです。あとで\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をご\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>するときにも、「あのときお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しした\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>だ」と\u003c と\u003c/rt>\u003c/ruby>あるとよかったなと\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づきました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>にご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>するときは、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>がどんな\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>で\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うのかを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>にお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>ししてみます。","zh":"您刚才这么一说，我才意识到，在给人看界面前，可以先补一句背景。下次介绍时，我会试着先说清楚谁会在什么场景用它。","cue":"14｜对方指出，介绍作品时最好先讲清谁会用它"},{"type":"reply","ja":"\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>った\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>もお\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せしたほうが、なぜこちらを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだか\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるんですね。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>はその\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べて、\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶ\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>め\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>になったところを\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>ししてみます。","zh":"原来把当时犹豫过的方案也拿出来，别人会更容易明白我为什么选了这一版。下次我会把两种方案并排放，具体讲一点最后做决定的原因。","cue":"15｜对方说想看看你当时犹豫的那两个方案"},{"type":"reply","ja":"このページは\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりやすかったと\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>っていただけて、うれしいです。ほかのページとどこが\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うのか、あとで\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>でも\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べて\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てみます。","zh":"听您说这一页容易看懂，我很高兴。我回头想把它和其他几页放在一起看看，自己找一找差别在哪儿。","cue":"16｜对方指出作品里某一页特别容易理解"},{"type":"reply","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>お\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>って、ぜひPAY IDのデザイナーの\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>\u003cruby>選考\u <script>
'use strict';
const data = JSON.parse(document.getElementById('reader-data').textContent);
const byId = id => document.getElementById(id);
const make = (tag, cls, text) => {
  const element = document.createElement(tag);
  if (cls) element.className = cls;
  if (text !== undefined) element.textContent = text;
  return element;
};
const root = document.documentElement;
const reader = byId('reader');
const settings = byId('settings');
const directory = byId('directory');
const params = new URLSearchParams(location.search);
root.classList.toggle('compact', params.get('compact') === '1' || params.get('nativeMini') === '1');
root.classList.toggle('native-mini', params.get('nativeMini') === '1');
root.dataset.revision = data.revision;
const settingsKey = 'base-casual-reader-settings-v1';
const compact = root.classList.contains('compact');
const settingsFields = [
  {key:'alpha', label:'背景不透明度', prop:'--alpha', min:0, max:1, step:.05, value:.45, unit:''},
  {key:'font', label:'日文字号', prop:'--body-size', min:10, max:30, step:1, value:compact ? 12 : matchMedia('(max-width:759px)').matches ? 15 : 18, unit:'px'},
  {key:'leading', label:'行距', prop:'--leading', min:1.2, max:2.50, step:.05, value:compact ? 1.5 : 1.75, unit:''},
  {key:'space', label:'字间距', prop:'--letters', min:0, max:.15, step:.01, value:0, unit:'em'},
  {key:'rubySize', label:'假名大小', prop:'--ruby-size', min:.28, max:.75, step:.01, value:.42, unit:'em'},
  {key:'rubyGap', label:'假名间距', prop:'--ruby-gap', min:0, max:6, step:1, value:1, unit:'px'}
];
const colors = { light:'#ffffff', dark:'#121212', sage:'#dbe5d9', custom:'#eee4cd' };
let stored = {};
try { stored = JSON.parse(localStorage.getItem(settingsKey) || '{}') || {}; } catch {}
const prefs = {zh:stored.zh !== false, ruby:stored.ruby !== false,
  theme:Object.hasOwn(colors,stored.theme) ? stored.theme : 'light',
  custom:/^#[\da-f]{6}$/i.test(stored.custom || '') ? stored.custom : colors.custom};
const fields = new Map();
const indexed = [];
const itemsById = new Map();
const navBySection = new Map();
let current, pinnedEntry, opener, settingsPosition;
function persist() {
  try { localStorage.setItem(settingsKey, JSON.stringify(prefs)); } catch {}
}
function applyTheme() {
  const hex = prefs.theme === 'custom' ? prefs.custom : colors[prefs.theme];
  const rgb = [1,3,5].map(i => parseInt(hex.slice(i,i+2),16));
  const linear = rgb.map(channel => {
    const n = channel / 255;
    return n <= .04045 ? n / 12.92 : ((n + .055) / 1.055) ** 2.4;
  });
  const dark = linear[0]*.2126 + linear[1]*.7152 + linear[2]*.0722 < .18;
  root.style.colorScheme = dark ? 'dark' : 'light';
  root.dataset.theme = prefs.theme;
  root.style.setProperty('--panel-rgb',rgb.join(' '));
  root.style.setProperty('--ink',dark ? '#ffffff' : '#181b18');
  root.style.setProperty('--muted',dark ? '#eeeeee' : '#343b35');
  root.style.setProperty('--accent',dark ? '#f2f5ed' : '#244d3c');
  root.style.setProperty('--line',dark ? 'rgb(255 255 255 / .52)' : 'rgb(32 32 32 / .30)');
  root.style.setProperty('--soft-line',dark ? 'rgb(255 255 255 / .22)' : 'rgb(32 32 32 / .15)');
  root.style.setProperty('--web-floor',dark ? '#2d3232' : '#e5e9e4');
  document.querySelector('meta[name="theme-color"]').content = hex;
  byId('setting-color').value = prefs.custom;
  for (const key of Object.keys(colors)) byId('theme-'+key).setAttribute('aria-pressed',String(prefs.theme === key));
}
function applyPrefs() {
  root.classList.toggle('no-zh', !prefs.zh);
  root.classList.toggle('no-ruby', !prefs.ruby);
  byId('zh-button').setAttribute('aria-pressed', String(prefs.zh));
  byId('ruby-button').setAttribute('aria-pressed', String(prefs.ruby));
  settingsFields.forEach(field => {
    const val = prefs[field.key];
    root.style.setProperty(field.prop, val + field.unit);
    const {input, output} = fields.get(field.key);
    input.value = String(val);
    output.value = ['alpha','rubySize'].includes(field.key) ? Math.round(val * 100) + '%' : field.key === 'leading' ? val + ' 倍' : val + ' ' + field.unit;
    input.setAttribute('aria-valuetext',output.value);
  });
  applyTheme();
}
function buildControls() {
  settingsFields.forEach(field => {
    const raw = stored[field.key];
    prefs[field.key] = Number.isFinite(raw) ? Math.min(field.max, Math.max(field.min, raw)) : field.value;
    const wrap = make('div','control'), label = make('label','',field.label), input = make('input'), output = make('output');
    input.type = 'range'; input.id = 'setting-' + field.key;
    for (const attr of ['min','max','step']) input[attr] = String(field[attr]);
    label.htmlFor = input.id; output.setAttribute('for',input.id);
    wrap.append(label,input,output); byId('settings-controls').append(wrap); fields.set(field.key,{input,output});
    input.addEventListener('input', () => { prefs[field.key] = Number(input.value); applyPrefs(); persist(); });
  });
  for (const key of Object.keys(colors)) byId('theme-'+key).addEventListener('click', () => {prefs.theme=key;applyTheme();persist();});
  byId('setting-color').addEventListener('input',e => {prefs.custom=e.target.value;prefs.theme='custom';applyTheme();persist();});
  for (const [id,key] of [['zh-button','zh'],['ruby-button','ruby']]) byId(id).addEventListener('click', () => {prefs[key]=!prefs[key];applyPrefs();persist();});
  byId('reset').addEventListener('click', () => {
    for (const f of settingsFields) prefs[f.key]=f.value;
    Object.assign(prefs,{theme:'light',custom:colors.custom,zh:true,ruby:true});
    applyPrefs();persist();
  });
  applyPrefs();
}
function pageLinks(value) {
  const label = make('span','page');
  for (const token of String(value).split(/(P?\s*\d+)/gi)) {
    const number = /^P?\s*(\d+)$/i.exec(token);
    if (!number) { label.append(token); continue; }
    const link = make('a','',token);
    link.href = '#p' + number[1];
    link.setAttribute('aria-label','跳到第 ' + number[1] + ' 页');
    label.append(link);
  }
  return label;
}
function drawReader() {
  const fragment = document.createDocumentFragment();
  data.sections.forEach(section => {
    const outer = make('section', 'reader-section');
    outer.id = section.id;
    outer.tabIndex = -1;
    itemsById.set(section.id, {section, article:outer});
    const nav = make('a','',section.label);
    nav.href = '#' + section.id;
    byId('sections').append(nav);
    navBySection.set(section.id, nav);
    const head = make('div', 'section-head');
    head.append(make('h2','',section.label));
    outer.append(head);
    section.groups.forEach(group => {
      if (!group.items.length) return;
      const groupEl = make('div', 'group');
      if (section.groups.length > 1 || group.label !== section.label) groupEl.append(make('h3','groupname',group.label));
      group.items.forEach(item => {
        const article = make('article','card');
        article.id = item.id; article.tabIndex = -1;
        const itemHead = make('div','card-head');
        const isPage = section.kind === 'pages';
        if (item.reverse) article.dataset.reverse = item.reverse;
        if (item.page) {
          itemHead.append(isPage ? make('span','page',item.page) : pageLinks(item.page));
        }
        itemHead.append(make('h4','',item.title));
        if (item.audience) itemHead.append(make('span','audience',item.audience));
        article.append(itemHead);
        item.blocks.forEach(block => {
          if (!block.ja && !block.zh) return;
          const row = make('div','block ' + block.type);
          if (block.page) {
            const cue = pageLinks(block.page);
            cue.classList.add('block-page');
            row.append(cue);
          }
          if (block.cue) row.append(make('p','reply-cue',block.cue));
          if (block.ja) {
            const ja = make('p','jp');
            ja.lang = 'ja';
            ja.innerHTML = block.ja;
            row.append(ja);
          }
          if (block.zh && (!block.ja || block.zh !== item.title)) {
            row.append(make('p','zh' + (block.ja ? ' translation':''),block.zh));
          }
          article.append(row);
        });
        for (const branch of item.followups || []) {
          const row = make('div','block reply');
          row.append(make('p','reply-cue',branch.cue));
          const ja = make('p','jp');
          ja.lang = 'ja'; ja.innerHTML = branch.ja;
          row.append(ja,make('p','zh translation',branch.zh));
          article.append(row);
        }
        for (const reference of item.sources || []) {
          const source = make('a','article-source',reference.label);
          source.href = reference.url;
          source.target = '_blank';
          source.rel = 'noopener noreferrer';
          article.append(source);
        }
        groupEl.append(article);
        const entry = {section,group,item,article};
        indexed.push(entry); itemsById.set(item.id,entry);
      });
      outer.append(groupEl);
    });
    fragment.append(outer);
  });
  byId('reader').append(fragment);
}
const normalize = value => value.normalize('NFKC').toLowerCase().trim();
function buildDirectory() {
  const list = byId('directory-list');
  for (const [index,entry] of indexed.entries()) {
    const {section,group,item} = entry;
    const title = item.menuTitle || item.title;
    const link = make('a');
    link.href = '#' + item.id;
    link.append(make('span','directory-rank',String(index+1).padStart(2,'0')),make('span','directory-title',title));
    link.firstElementChild.setAttribute('aria-hidden','true');
    entry.search = normalize([title,item.title,item.audience,item.page,item.id,section.label,section.kind === 'pages' ? group.label : ''].filter(Boolean).join(' '));
    entry.menuLink = link;
    list.append(link);
  }
  filterDirectory();
}
function filterDirectory() {
  const query = normalize(byId('directory-search').value);
  const terms = query.split(/\s+/).filter(Boolean);
  let count = 0;
  for (const entry of indexed) {
    const match = terms.every(term=>entry.search.includes(term));
    entry.menuLink.hidden = !match;
    if (match) count++;
  }
  byId('directory-count').textContent = query ? count+' / '+indexed.length+' 项' : '共 '+indexed.length+' 项';
  byId('directory-clear').disabled = !query;
  byId('directory-empty').hidden = count !== 0;
}
function identifyLocation(entry) {
  if (!entry || current === entry) return;
  current?.menuLink?.removeAttribute('aria-current');
  navBySection.get(current?.section.id)?.removeAttribute('aria-current');
  current = entry;
  entry.menuLink?.setAttribute('aria-current','location');
  navBySection.get(entry.section.id)?.setAttribute('aria-current','location');
  byId('current-label').textContent = entry.item?.menuTitle || entry.item?.title || entry.section.label;
}
let scrollQueued=false;
function track() {
  scrollQueued=false;
  if (!indexed.length || settings.open || directory.open || pinnedEntry) return;
  const line=reader.getBoundingClientRect().top+24;
  let lo=0,hi=indexed.length;
  while(lo<hi){
    const mid=(lo+hi)>>>1;
    if(indexed[mid].article.getBoundingClientRect().top<=line) lo=mid+1;else hi=mid;
  }
  const atEnd=reader.scrollTop+reader.clientHeight>=reader.scrollHeight-2;
  identifyLocation(indexed[atEnd ? indexed.length-1 : Math.max(0,lo-1)]);
}
function queueTrack() {if(!scrollQueued){scrollQueued=true;requestAnimationFrame(track);}}
function releasePinned() {pinnedEntry=undefined;queueTrack();}
function urlTarget() {
  try {
    const id=decodeURIComponent(location.hash.slice(1));
    return itemsById.get(id) || (id === 'q39' && itemsById.get('q37')) || (/^q\d+$/.test(id) ? itemsById.get('reverse') : undefined);
  } catch {return undefined;}
}
function goTo(entry,focus=true) {
  if (!entry) return;
  pinnedEntry=entry;
  if (focus) entry.article.focus({preventScroll:true});
  const top=reader.scrollTop + entry.article.getBoundingClientRect().top-reader.getBoundingClientRect().top-8;
  reader.scrollTo({top,behavior:'instant'});
  identifyLocation(entry);
}
function follow(entry) {
  if (!entry) return;
  const hash='#'+encodeURIComponent(entry.article.id);
  if(location.hash!==hash) history.pushState(null,'',hash);
  goTo(entry);
}
function openSheet(dialog,trigger) {
  opener=trigger;
  if(dialog===settings && current) settingsPosition={entry:current,top:current.article.getBoundingClientRect().top};
  document.body.classList.add('modal-open');
  dialog.showModal();trigger.setAttribute('aria-expanded','true');
  if(dialog===directory) {
    byId('directory-search').value='';filterDirectory();
    const here=current?.menuLink || indexed.find(e=>e.section===current?.section)?.menuLink;
    if(here) here.scrollIntoView({block:'nearest'});
    const focusTarget=matchMedia('(pointer:coarse)').matches ? dialog.querySelector('[data-close]') : byId('directory-search');
    focusTarget.focus({preventScroll:true});
  }else dialog.querySelector('[data-close]').focus({preventScroll:true});
}
function closeSheet(dialog,restore=true) {
  dialog.close();opener?.setAttribute('aria-expanded','false');document.body.classList.remove('modal-open');
  if(dialog===settings && settingsPosition) {
    reader.scrollTop+=settingsPosition.entry.article.getBoundingClientRect().top-settingsPosition.top;settingsPosition=undefined;
  }
  if(restore) opener?.focus({preventScroll:true});
}
buildControls();drawReader();buildDirectory();identifyLocation(indexed[0]);
for(const [dialog,id] of [[directory,'directory-button'],[settings,'settings-button']]) {
  byId(id).addEventListener('click',e=>openSheet(dialog,e.currentTarget));
  dialog.querySelector('[data-close]').addEventListener('click',()=>closeSheet(dialog));
  dialog.addEventListener('cancel',e=>{e.preventDefault();closeSheet(dialog);});
  dialog.addEventListener('click',e=>{
    if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();
    if(e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom)closeSheet(dialog);
  });
}
byId('directory-search').addEventListener('input',()=>{filterDirectory();byId('directory-list').scrollTop=0;});
byId('directory-search').addEventListener('keydown',e=>{
  const first=byId('directory-list').querySelector('a:not([hidden])');
  if(first && ['ArrowDown','Enter'].includes(e.key) && !e.isComposing) {
    e.preventDefault();if(e.key==='Enter') first.click();else first.focus();
  }
});
byId('directory-clear').addEventListener('click',()=>{
  byId('directory-search').value='';filterDirectory();byId('directory-search').focus();
});
byId('popup').addEventListener('click',()=>{
  const url=new URL(location.href);url.searchParams.set('compact','1');url.hash=current?.article.id || '';
  window.open(url.href,'base-casual-mini','popup,width=400,height=560,resizable=yes,scrollbars=yes');
});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey)return;
  const id=decodeURIComponent(a.hash.slice(1)),entry=itemsById.get(id);
  if(!entry)return;
  e.preventDefault();
  if(a.closest('#sections')) {
    byId('directory-search').value='';filterDirectory();
    const first=indexed.find(row=>row.section.id===id);
    first?.menuLink.focus({preventScroll:true});first?.menuLink.scrollIntoView({block:'start'});return;
  }
  if(directory.open)closeSheet(directory,false);
  follow(entry);
});
for(const type of ['wheel','touchstart','pointerdown']) reader.addEventListener(type,releasePinned,{passive:true});
document.addEventListener('keydown',e=>{
  if(!directory.open && !settings.open && ['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].includes(e.key))releasePinned();
});
reader.addEventListener('scroll',queueTrack,{passive:true});
window.addEventListener('resize',queueTrack);
history.scrollRestoration='manual';
window.addEventListener('hashchange',()=>{goTo(urlTarget()||indexed[0]);});
requestAnimationFrame(()=>goTo(urlTarget()||indexed[0],false));
</script>
</body>
