c/rt>\u003c/ruby>かかると\u003cruby>利用料\u003crt>りようりょう\u003c/rt>\u003c/ruby>を\u003cruby>含\u003crt>ふく\u003c/rt>\u003c/ruby>めて\u003cruby>手作業\u003crt>てさぎょう\u003c/rt>\u003c/ruby>のほうが\u003cruby>安\u003crt>やす\u003c/rt>\u003c/ruby>くなります。\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>計\u003crt>はか\u003c/rt>\u003c/ruby>りたいのは、この\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>と\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>にかかる\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>です。","zh":"如果逐个检查候选花太久，就不划算。在这份试算里，每页检查 16 分钟可以节省费用，32 分钟时加上工具费，手动重做更便宜。接下来实际要测的是人工检查和修改要多久。"}]}],"shelf":"portfolio-qa"},{"id":"folio-qa-around","label":"AROUND｜行车时的车外声音提醒","items":[{"id":"folio-qa-around-1","title":"你设想谁会在什么情况下使用它？","page":"P56 → P60","blocks":[{"type":"prompt","ja":"どんな\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が、どんな\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>で\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うんですか。","zh":"你设想谁会在什么情况下使用它？"},{"type":"speech","ja":"\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>を\u003cruby>運転\u003crt>うんてん\u003c/rt>\u003c/ruby>している\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けて\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>車線\u003crt>しゃせん\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えようとしたときに、\u003cruby>左後\u003crt>ひだりうし\u003c/rt>\u003c/ruby>ろでクラクションが\u003cruby>鳴\u003crt>な\u003c/rt>\u003c/ruby>る\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>です。\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たままでも\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づけるように、シートの\u003cruby>左側\u003crt>ひだりがわ\u003c/rt>\u003c/ruby>が\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>く\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>回\u003crt>かい\u003c/rt>\u003c/ruby>\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>します。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>れば、クラクションが\u003cruby>左後\u003crt>ひだりうし\u003c/rt>\u003c/ruby>ろで\u003cruby>鳴\u003crt>な\u003c/rt>\u003c/ruby>ったことも\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。","zh":"我设想的是正在开车的驾驶员。比如准备变道时，左后方响起喇叭声。为了让他看着前方也能留意到，座椅左侧会短震两下，屏幕上同时提示是什么声音、从哪里来。"}]},{"id":"folio-qa-around-2","title":"为什么行车中和停车后能做的事不同？","page":"P62 → P63","blocks":[{"type":"prompt","ja":"なぜ\u003cruby>走行中\u003crt>そうこうちゅう\u003c/rt>\u003c/ruby>と\u003cruby>駐車\u003crt>ちゅうしゃ\u003c/rt>\u003c/ruby>\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>で、できることを\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けたんですか。","zh":"为什么行车中和停车后能做的事不同？"},{"type":"speech","ja":"\u003cruby>走\u003crt>はし\u003c/rt>\u003c/ruby>っている\u003cruby>間\u003crt>あいだ\u003c/rt>\u003c/ruby>は、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>かと\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>を\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>く\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせて、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になるときに\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>で\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>ける\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れです。\u003cruby>録音\u003crt>ろくおん\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>き\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>したりカメラを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たりするには、\u003cruby>注意\u003crt>ちゅうい\u003c/rt>\u003c/ruby>を\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>ける\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>が\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なので、\u003cruby>安全\u003crt>あんぜん\u003c/rt>\u003c/ruby>な\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>に\u003cruby>停\u003crt>と\u003c/rt>\u003c/ruby>めてからにしました。","zh":"行车时简短提示是什么声音、从哪里来，还在意时可以用语音问。重听录音和查看摄像需要更多注意力，所以留到安全停车后。"}]},{"id":"folio-qa-around-3","title":"你希望座椅振动传达哪些信息？","page":"P60","blocks":[{"type":"prompt","ja":"シートの\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>では、どこまで\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えようと\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えましたか。","zh":"你希望座椅振动传达哪些信息？"},{"type":"speech","ja":"\u003cruby>運転\u003crt>うんてん\u003c/rt>\u003c/ruby>しながら、\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>と\u003cruby>後\u003crt>うし\u003c/rt>\u003c/ruby>ろで\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>う\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>の\u003cruby>意味\u003crt>いみ\u003c/rt>\u003c/ruby>を\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>い\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すのは\u003cruby>負担\u003crt>ふたん\u003c/rt>\u003c/ruby>になると\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。そこで、\u003cruby>左右\u003crt>さゆう\u003c/rt>\u003c/ruby>は\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>がした\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>を\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じリズムで\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>させます。\u003cruby>前後\u003crt>ぜんご\u003c/rt>\u003c/ruby>まで\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいときは、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>や\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめられるようにしました。","zh":"如果前后也用不同模式，驾驶员就要边开车边想各自代表什么。我用同一节奏，在声音所在的左侧或右侧发出震动。要知道前后时，由画面或语音补充。"}]},{"id":"folio-qa-around-4","title":"你做到了哪一步？接下来想验证什么？","page":"P59–63、P66","blocks":[{"type":"prompt","ja":"どこまで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りましたか。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめますか。","zh":"你做到了哪一步？接下来想验证什么？"},{"type":"speech","ja":"\u003cruby>走行中\u003crt>そうこうちゅう\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>から、\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>での\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>、\u003cruby>駐車\u003crt>ちゅうしゃ\u003c/rt>\u003c/ruby>\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>に\u003cruby>見返\u003crt>みかえ\u003c/rt>\u003c/ruby>すところまでを、Figmaで\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にしました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>運転\u003crt>うんてん\u003c/rt>\u003c/ruby>\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>で\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>がある\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>とない\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>をシミュレーターで\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べて、\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>の\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるかと、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>がどれくらいかを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たいです。","zh":"我用 Figma 做了行车提醒、语音确认和停车后查看的界面。下一步想在同一模拟驾驶场景比较有无提醒，同时观察方向能不能看懂，以及看屏幕花了多少时间。"}]},{"id":"folio-qa-around-5","title":"无法判断声音方向时，界面会显示什么？","page":"P61–62","blocks":[{"type":"prompt","ja":"\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないときは、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>るんですか。","zh":"无法判断声音方向时，界面会显示什么？"},{"type":"speech","ja":"\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かっても、\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>推定\u003crt>すいてい\u003c/rt>\u003c/ruby>できないことがあります。その\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>は、\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>の\u003cruby>種類\u003crt>しゅるい\u003c/rt>\u003c/ruby>と「\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>\u003cruby>不明\u003crt>ふめい\u003c/rt>\u003c/ruby>」を\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>し、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りを\u003cruby>点線\u003crt>てんせん\u003c/rt>\u003c/ruby>で\u003cruby>囲\u003crt>かこ\u003c/rt>\u003c/ruby>みます。\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>で\u003cruby>尋\u003crt>たず\u003c/rt>\u003c/ruby>ねられたときも、\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>は\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないと\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>く\u003cruby>答\u003crt>こた\u003c/rt>\u003c/ruby>えるようにしました。","zh":"有时可以识别是什么声音，方向还无法推断。界面显示声音类型和「方向不明」，用虚线围住车身，用语音询问时也会简短说方向未知。"}]},{"id":"folio-qa-around-6","title":"在设计过程中，你重点调整过哪一部分？","page":"P61","blocks":[{"type":"prompt","ja":"\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っていく\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>特\u003crt>とく\u003c/rt>\u003c/ruby>に\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>したのはどんなところですか。","zh":"在设计过程中，你重点调整过哪一部分？"},{"type":"speech","ja":"\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるときと、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないときの\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いを、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>絵\u003crt>え\u003c/rt>\u003c/ruby>の\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>で\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べられるようにしました。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>はクラクションが\u003cruby>左後\u003crt>ひだりうし\u003c/rt>\u003c/ruby>ろなので、その\u003cruby>位置\u003crt>いち\u003c/rt>\u003c/ruby>に\u003cruby>波紋\u003crt>はもん\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>は\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>だけ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かった\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>で、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りを\u003cruby>点線\u003crt>てんせん\u003c/rt>\u003c/ruby>で\u003cruby>囲\u003crt>かこ\u003c/rt>\u003c/ruby>みます。どちらも\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>はそのまま\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られます。","zh":"我把已知和未知两种方向做成可以直接看车身图比较的画面。中图知道喇叭声来自左后方，在对应位置显示波纹。右图只知道响了喇叭，就用虚线圈住车身。两种情况下地图都能继续看。"}]}],"shelf":"portfolio-qa"},{"id":"folio-qa-acrylic","label":"アクリル × Portfolio｜会动的亚克力封面与纸本内页","items":[{"id":"folio-qa-acrylic-1","title":"为什么选亚克力来做封面？","page":"P68 → P69","blocks":[{"type":"prompt","ja":"\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>にアクリルを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったのは、どうしてですか。","zh":"为什么选亚克力来做封面？"},{"type":"speech","ja":"\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったときの\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きで、\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>の\u003cruby>模様\u003crt>もよう\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わったら\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>いなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったんです。\u003cruby>透明\u003crt>とうめい\u003c/rt>\u003c/ruby>な\u003cruby>板\u003crt>いた\u003c/rt>\u003c/ruby>なら、\u003cruby>傾\u003crt>かたむ\u003c/rt>\u003c/ruby>けるだけで\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>のついたパーツが\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>くのを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらえます。\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いたあとは、\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>のページをめくって\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>めるようにしました。","zh":"我想，如果拿起书的动作就能让封面图案发生变化，会很有意思。用透明板，只要把书稍微倾斜，就能看到里面的彩色小片移动。打开以后，读者还是可以翻着纸页看作品。"}]},{"id":"folio-qa-acrylic-2","title":"有没有拿起试作之后才发现的问题？","page":"P72 → P74","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>してみて、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>から\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えたところはありますか。","zh":"有没有拿起试作之后才发现的问题？"},{"type":"speech","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>四隅\u003crt>よすみ\u003c/rt>\u003c/ruby>を\u003cruby>留\u003crt>と\u003c/rt>\u003c/ruby>めれば\u003cruby>十分\u003crt>じゅうぶん\u003c/rt>\u003c/ruby>だと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っていました。でも\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>傾\u003crt>かたむ\u003c/rt>\u003c/ruby>けると、\u003cruby>板\u003crt>いた\u003c/rt>\u003c/ruby>の\u003cruby>辺\u003crt>へん\u003c/rt>\u003c/ruby>の\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>に\u003cruby>隙間\u003crt>すきま\u003c/rt>\u003c/ruby>ができて、そこからパーツがこぼれたんです。それで、\u003cruby>四辺\u003crt>しへん\u003c/rt>\u003c/ruby>の\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>にも\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>留\u003crt>と\u003c/rt>\u003c/ruby>め\u003cruby>具\u003crt>ぐ\u003c/rt>\u003c/ruby>を\u003cruby>足\u003crt>た\u003c/rt>\u003c/ruby>しました。","zh":"最初我以为固定四个角就够了。实际倾斜试作时，板边的中间会张开一点，小片就从缝里掉了出来。所以我在四条边的中点又各加了一个固定件。"}]},{"id":"folio-qa-acrylic-3","title":"打开书以后，读者怎样找到自己想看的作品？","page":"P75","blocks":[{"type":"prompt","ja":"\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しやすくするために、どんな\u003cruby>工夫\u003crt>くふう\u003c/rt>\u003c/ruby>をしましたか。","zh":"打开书以后，读者怎样找到自己想看的作品？"},{"type":"speech","ja":"\u003cruby>目次\u003crt>もくじ\u003c/rt>\u003c/ruby>の\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>を、そのまま\u003cruby>仕切\u003crt>しき\u003c/rt>\u003c/ruby>りと\u003cruby>章\u003crt>しょう\u003c/rt>\u003c/ruby>の\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>のページにも\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っています。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えばUI/UXを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たい\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>なら、\u003cruby>目次\u003crt>もくじ\u003c/rt>\u003c/ruby>でピンクを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけて、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>の\u003cruby>仕切\u003crt>しき\u003c/rt>\u003c/ruby>りを\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>けば、その\u003cruby>章\u003crt>しょう\u003c/rt>\u003c/ruby>から\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>められます。","zh":"目录、分隔页和每章的首页都用了同一种章色。比如想看 UI/UX 的读者，在目录里找到粉色，再翻到同色的分隔页，就可以从这一章开始看。"}]}],"shelf":"portfolio-qa"},{"id":"folio-qa-seasons","label":"四季の花綴り｜用押花和汉诗编排二十四节气","items":[{"id":"folio-qa-seasons-1","title":"你怎样为一个节气选出配在一起的花和诗？","page":"P78 → P81","blocks":[{"type":"prompt","ja":"\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つの\u003cruby>節気\u003crt>せっき\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせる\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>と\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>は、どう\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだんですか。","zh":"你怎样为一个节气选出配在一起的花和诗？"},{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば\u003cruby>立春\u003crt>りっしゅん\u003c/rt>\u003c/ruby>には、オウバイを\u003cruby>詠\u003crt>よ\u003c/rt>\u003c/ruby>んだ\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>と、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>のオウバイの\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>には\u003cruby>黄色\u003crt>きいろ\u003c/rt>\u003c/ruby>い\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>びらと\u003cruby>緑\u003crt>みどり\u003c/rt>\u003c/ruby>の\u003cruby>萼\u003crt>がく\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てきます。\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んだ\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>をすぐ\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめながら、\u003cruby>春先\u003crt>はるさき\u003c/rt>\u003c/ruby>の\u003cruby>景色\u003crt>けしき\u003c/rt>\u003c/ruby>を\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>い\u003cruby>浮\u003crt>う\u003c/rt>\u003c/ruby>かべてもらいたかったんです。","zh":"比如立春，我选了一首咏迎春花的诗，旁边配真正的迎春花押花。诗里提到了黄色的花瓣和绿色的花萼。我希望读者读到这些词的时候，能对照手边这朵花，想象早春的景色。"}]},{"id":"folio-qa-seasons-2","title":"不太熟悉汉诗的人，可以从这本书的哪里读起？","page":"P79 → P80","blocks":[{"type":"prompt","ja":"\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>にあまりなじみのない\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>には、どこから\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んでほしいですか。","zh":"不太熟悉汉诗的人，可以从这本书的哪里读起？"},{"type":"speech","ja":"まず\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になった\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>から\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらえたらと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>には\u003cruby>原詩\u003crt>げんし\u003c/rt>\u003c/ruby>と\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>き\u003cruby>下\u003crt>くだ\u003c/rt>\u003c/ruby>し\u003cruby>文\u003crt>ぶん\u003c/rt>\u003c/ruby>、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>\u003cruby>訳\u003crt>やく\u003c/rt>\u003c/ruby>を\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せています。\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てから\u003cruby>訳\u003crt>わけ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んで、どんな\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>で\u003cruby>詠\u003crt>よ\u003c/rt>\u003c/ruby>まれているのか\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったら\u003cruby>原詩\u003crt>げんし\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>れるようにしました。","zh":"我希望他们可以从吸引自己的那朵花看起。旁边的原诗、日语训读文和日译分开排版。看过花以后可以先读译文，如果好奇诗人用的是什么词，再回去看原诗。"}]},{"id":"folio-qa-seasons-3","title":"为了把真花装进书里，你在制作上做了什么处理？","page":"P82 → P85","blocks":[{"type":"prompt","ja":"\u003cruby>本物\u003crt>ほんもの\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うために、\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>で\u003cruby>工夫\u003crt>くふう\u003c/rt>\u003c/ruby>したことはありますか。","zh":"为了把真花装进书里，你在制作上做了什么处理？"},{"type":"speech","ja":"\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>は\u003cruby>咲\u003crt>さ\u003c/rt>\u003c/ruby>く\u003cruby>時期\u003crt>じき\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めて、\u003cruby>吸水\u003crt>きゅうすい\u003c/rt>\u003c/ruby>\u003cruby>紙\u003crt>し\u003c/rt>\u003c/ruby>に\u003cruby>挟\u003crt>はさ\u003c/rt>\u003c/ruby>んで\u003cruby>乾\u003crt>かわ\u003c/rt>\u003c/ruby>かしました。\u003cruby>乾\u003crt>かわ\u003c/rt>\u003c/ruby>いた\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>びらはページをめくるときに\u003cruby>傷\u003crt>いた\u003c/rt>\u003c/ruby>みやすいので、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつフィルムで\u003cruby>保護\u003crt>ほご\u003c/rt>\u003c/ruby>してから、\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つ\u003cruby>折\u003crt>お\u003c/rt>\u003c/ruby>りの\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>に\u003cruby>挟\u003crt>はさ\u003c/rt>\u003c/ruby>んで\u003cruby>綴\u003crt>と\u003c/rt>\u003c/ruby>じています。","zh":"我按花期采集，把花夹在吸水纸里压干。干燥的花瓣在翻页时容易受损，所以我先把每一份押花用薄膜保护好，再夹进对折的纸页里装订。"}]}],"shelf":"portfolio-qa"},{"id":"folio-qa-ling","label":"LING｜团队做杂志与个人的版面设计","items":[{"id":"folio-qa-ling-1","title":"团队一起做杂志时，合作上遇到过什么困难？","page":"P90","blocks":[{"type":"prompt","ja":"チームで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>る\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>め\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>ったことはありましたか。","zh":"团队一起做杂志时，合作上遇到过什么困难？"},{"type":"speech","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>が\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>なって、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>を\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めてしまうことがありました。そこで、\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>なことに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>分担\u003crt>ぶんたん\u003c/rt>\u003c/ruby>し\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>そうと\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>から\u003cruby>提案\u003crt>ていあん\u003c/rt>\u003c/ruby>しました。ほかのメンバーが\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>の\u003cruby>原稿\u003crt>げんこう\u003c/rt>\u003c/ruby>をまとめ、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>はそれを\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>って\u003cruby>全\u003crt>ぜん\u003c/rt>\u003c/ruby>ページのレイアウトを\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>しました。","zh":"刚开始分工有重叠，有时几个人会各自做同一件事。我就提议按各自擅长的工作重新分工。其他成员整理日语稿件，我接过来，负责整本杂志的排版。"}]},{"id":"folio-qa-ling-2","title":"杂志的版面里，你特别花心思的是哪里？","page":"P91","blocks":[{"type":"prompt","ja":"\u003cruby>誌面\u003crt>しめん\u003c/rt>\u003c/ruby>のレイアウトで、\u003cruby>特\u003crt>とく\u003c/rt>\u003c/ruby>に\u003cruby>工夫\u003crt>くふう\u003c/rt>\u003c/ruby>したところはどこですか。","zh":"杂志的版面里，你特别花心思的是哪里？"},{"type":"speech","ja":"\u003cruby>三宅一生\u003crt>みやけいっせい\u003c/rt>\u003c/ruby>さんの\u003cruby>特集\u003crt>とくしゅう\u003c/rt>\u003c/ruby>では、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きな\u003cruby>横顔\u003crt>よこがお\u003c/rt>\u003c/ruby>の\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>と\u003cruby>名前\u003crt>なまえ\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いて、そこから\u003cruby>年表\u003crt>ねんぴょう\u003c/rt>\u003c/ruby>でどんな\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>だったのかをたどれるようにしました。\u003cruby>時計\u003crt>とけい\u003c/rt>\u003c/ruby>や\u003cruby>眼鏡\u003crt>めがね\u003c/rt>\u003c/ruby>のページでは、\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>の\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いを\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べてほしくて、\u003cruby>製品\u003crt>せいひん\u003c/rt>\u003c/ruby>の\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>を\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べています。","zh":"三宅一生特辑先用一张大的侧脸照片和名字引入，再通过年表带读者了解他的经历。到了手表和眼镜的页面，我想让读者比较造型的差异，就把产品照片并排摆在一起。"}]}],"shelf":"portfolio-qa"},{"id":"folio-qa-reisho","label":"隷書美学｜字形如何看懂、竹封面怎么来的","items":[{"id":"folio-qa-reisho-1","title":"对于不太熟悉隶书的读者，你最想让他们看到什么？","page":"P93","blocks":[{"type":"prompt","ja":"\u003cruby>隷書\u003crt>れいしょ\u003c/rt>\u003c/ruby>にあまりなじみのない\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に、どこを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てほしいですか。","zh":"对于不太熟悉隶书的读者，你最想让他们看到什么？"},{"type":"speech","ja":"まず、\u003cruby>線\u003crt>せん\u003c/rt>\u003c/ruby>の\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わり\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てほしいです。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えばこの\u003cruby>長\u003crt>なが\u003c/rt>\u003c/ruby>い\u003cruby>払\u003crt>はら\u003c/rt>\u003c/ruby>いは、\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>を\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きく\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せて、どこまで\u003cruby>線\u003crt>せん\u003c/rt>\u003c/ruby>が\u003cruby>伸\u003crt>の\u003c/rt>\u003c/ruby>びているかに\u003cruby>印\u003crt>しるし\u003c/rt>\u003c/ruby>を\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けました。その\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>では、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>を\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>書体\u003crt>しょたい\u003c/rt>\u003c/ruby>で\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>んで、\u003cruby>文章\u003crt>ぶんしょう\u003c/rt>\u003c/ruby>になったときの\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>も\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べられるようにしています。","zh":"我想让读者先看看笔画是怎么收尾的。比如这笔长捺，我把字放大，标出了它伸到哪里。旁边再用两种字体排同一首诗，让读者比较这些字排成一段文字以后，整体的感觉有什么不同。"}]},{"id":"folio-qa-reisho-2","title":"为什么用竹子做封面？","page":"P96 → P97","blocks":[{"type":"prompt","ja":"\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>に\u003cruby>竹\u003crt>たけ\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだのは、どうしてですか。","zh":"为什么用竹子做封面？"},{"type":"speech","ja":"きっかけは、\u003cruby>昔\u003crt>むかし\u003c/rt>\u003c/ruby>の\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>を\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていた\u003cruby>竹簡\u003crt>ちくかん\u003c/rt>\u003c/ruby>です。\u003cruby>隷書\u003crt>れいしょ\u003c/rt>\u003c/ruby>の\u003cruby>歴史\u003crt>れきし\u003c/rt>\u003c/ruby>を\u003cruby>扱\u003crt>あつか\u003c/rt>\u003c/ruby>う\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>なので、\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>にも、\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>が\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれていた\u003cruby>素材\u003crt>そざい\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。\u003cruby>細\u003crt>ほそ\u003c/rt>\u003c/ruby>い\u003cruby>竹\u003crt>たけ\u003c/rt>\u003c/ruby>を\u003cruby>糸\u003crt>いと\u003c/rt>\u003c/ruby>でつないでいるので、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>のように\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>を\u003cruby>巻\u003crt>ま\u003c/rt>\u003c/ruby>くこともできます。","zh":"灵感来自古人用来书写的竹简。这本书讲隶书的历史，我想让封面也用上一种古人实际写过字的材料。我用线把细竹片连接起来，所以封面也能像右边照片里那样卷起。"}]}],"shelf":"portfolio-qa"},{"id":"folio-qa-tokyo","label":"TOKYO SUNSET TILL DAWN｜东京夜景摄影集","items":[{"id":"folio-qa-tokyo-1","title":"你是怎么决定照片的编排顺序的？","page":"P100","blocks":[{"type":"prompt","ja":"\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>を\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べる\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>は、どうやって\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めたんですか。","zh":"你是怎么决定照片的编排顺序的？"},{"type":"speech","ja":"\u003cruby>撮\u003crt>と\u003c/rt>\u003c/ruby>った\u003cruby>時刻\u003crt>じこく\u003c/rt>\u003c/ruby>をもとに\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べました。まだ\u003cruby>空\u003crt>そら\u003c/rt>\u003c/ruby>に\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>が\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っている\u003cruby>夕方\u003crt>ゆうがた\u003c/rt>\u003c/ruby>から、\u003cruby>街\u003crt>まち\u003c/rt>\u003c/ruby>の\u003cruby>灯\u003crt>あか\u003c/rt>\u003c/ruby>りが\u003cruby>目立\u003crt>めだ\u003c/rt>\u003c/ruby>つ\u003cruby>夜\u003crt>よる\u003c/rt>\u003c/ruby>を\u003cruby>経\u003crt>へ\u003c/rt>\u003c/ruby>て、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は\u003cruby>建物\u003crt>たてもの\u003c/rt>\u003c/ruby>に\u003cruby>朝\u003crt>あさ\u003c/rt>\u003c/ruby>の\u003cruby>光\u003crt>ひかり\u003c/rt>\u003c/ruby>が\u003cruby>当\u003crt>あ\u003c/rt>\u003c/ruby>たるところまで。\u003cruby>撮\u003crt>と\u003c/rt>\u003c/ruby>った\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わっても、ページをめくると\u003cruby>一晩\u003crt>ひとばん\u003c/rt>\u003c/ruby>の\u003cruby>光\u003crt>ひかり\u003c/rt>\u003c/ruby>の\u003cruby>変化\u003crt>へんか\u003c/rt>\u003c/ruby>をたどれるようにしたかったんです。","zh":"我是按拍摄时刻排的。一开始是天空还留着颜色的傍晚，接着是街灯变得醒目的夜里，最后是晨光落到建筑上。我希望即使拍摄地点换了，读者也能随着翻页，看到一整夜光线的变化。"}]},{"id":"folio-qa-tokyo-2","title":"封面上这几处反光是怎么做出来的？","page":"P99","blocks":[{"type":"prompt","ja":"\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>の\u003cruby>光\u003crt>ひかり\u003c/rt>\u003c/ruby>の\u003cruby>表情\u003crt>ひょうじょう\u003c/rt>\u003c/ruby>は、どうやって\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>したんですか。","zh":"封面上这几处反光是怎么做出来的？"},{"type":"speech","ja":"\u003cruby>黒\u003crt>くろ\u003c/rt>\u003c/ruby>い\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>を\u003cruby>丸\u003crt>まる\u003c/rt>\u003c/ruby>く\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>抜\u003crt>ぬ\u003c/rt>\u003c/ruby>いて、その\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>に\u003cruby>光\u003crt>ひかり\u003c/rt>\u003c/ruby>を\u003cruby>反射\u003crt>はんしゃ\u003c/rt>\u003c/ruby>する\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>を\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>ねました。\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>って\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>傾\u003crt>かたむ\u003c/rt>\u003c/ruby>けるだけで、\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>える\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わるんです。\u003cruby>街\u003crt>まち\u003c/rt>\u003c/ruby>の\u003cruby>光\u003crt>ひかり\u003c/rt>\u003c/ruby>が\u003cruby>移\u003crt>うつ\u003c/rt>\u003c/ruby>り\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わる\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じを、\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>でも\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>したいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"我在黑色封面上挖了圆孔，下面叠了一层反光纸。拿起书稍微倾斜一下，看到的颜色就会变。我想让人在封面上也能感受到城市里变动的光。"}]}],"shelf":"portfolio-qa"},{"id":"folio-qa-komachi","label":"空中小町｜浮岛连接起来的 3D 小镇","items":[{"id":"folio-qa-komachi-1","title":"你当时想做一座什么样的小镇？","page":"P101 → P103","blocks":[{"type":"prompt","ja":"どんな\u003cruby>街\u003crt>まち\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ろうと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったんですか。","zh":"你当时想做一座什么样的小镇？"},{"type":"speech","ja":"\u003cruby>橋\u003crt>はし\u003c/rt>\u003c/ruby>を\u003cruby>渡\u003crt>わた\u003c/rt>\u003c/ruby>るたびに、\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>う\u003cruby>景色\u003crt>けしき\u003c/rt>\u003c/ruby>に\u003cruby>出会\u003crt>であ\u003c/rt>\u003c/ruby>える\u003cruby>街\u003crt>まち\u003c/rt>\u003c/ruby>にしたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>はどれも\u003cruby>雲\u003crt>くも\u003c/rt>\u003c/ruby>のような\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>でそろえて、\u003cruby>橋\u003crt>はし\u003c/rt>\u003c/ruby>でつないでいます。その\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>には、\u003cruby>赤\u003crt>あか\u003c/rt>\u003c/ruby>い\u003cruby>観覧車\u003crt>かんらんしゃ\u003c/rt>\u003c/ruby>がある\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>も、\u003cruby>風船\u003crt>ふうせん\u003c/rt>\u003c/ruby>が\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>まっている\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>もあって、\u003cruby>近\u003crt>ちか\u003c/rt>\u003c/ruby>くで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うんです。","zh":"我想做一座每过一座桥就能看到不同风景的小镇。岛屿都用了像云一样的造型，再用桥连起来。到了岛上，有的能看到红色摩天轮，有的聚着一簇气球，近看每一座都有自己的样子。"}]},{"id":"folio-qa-komachi-2","title":"这件作品里，哪些部分是你自己做的？","page":"P102 → P103","blocks":[{"type":"prompt","ja":"この\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>では、どこまでご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>で\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>られたんですか。","zh":"这件作品里，哪些部分是你自己做的？"},{"type":"speech","ja":"\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>や\u003cruby>建物\u003crt>たてもの\u003c/rt>\u003c/ruby>、それから\u003cruby>看板\u003crt>かんばん y>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>で\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>するときに、どんな\u003cruby>練習\u003crt>れんしゅう\u003c/rt>\u003c/ruby>をしておくとよさそうか、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えてきました。","zh":"谢谢您讲到大家在会上具体怎么交换意见。我对怎样提前练习用日语说明自己的方案，也有点头绪了。"}],"audience":"","reverse":"28"},{"id":"q23","title":"从哪些小事能感受到 BASE 的工作氛围","menuTitle":"从哪些小事能感受到 BASE 的工作氛围","page":"","blocks":[{"type":"speech","ja":"BASE Bookで、\u003cruby>成原\u003crt>なりはら\u003c/rt>\u003c/ruby>さんが\u003cruby>経営\u003crt>けいえい\u003c/rt>\u003c/ruby>\u003cruby>戦略\u003crt>せんりゃく\u003c/rt>\u003c/ruby>\u003cruby>室\u003crt>しつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>に「We are All Owners」という\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>の\u003cruby>由来\u003crt>ゆらい\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>かれた\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>のお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>で「あ、こういうところがBASEらしいな」と\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じたことがあれば、ちょっと\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいです。","zh":"我在 BASE Book 读到，成原女士采访经营战略室的同事，聊的是「We are All Owners」这句话怎么来的。我挺想听听，在日常工作里，有没有哪一件小事，让人觉得「嗯，这还挺像 BASE 的」？"},{"type":"reply","ja":"まずご\u003cruby>本人\u003crt>ほんにん\u003c/rt>\u003c/ruby>に「どうしたいですか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>くんですね。そういう\u003cruby>一言\u003crt>ひとこと\u003c/rt>\u003c/ruby>にも、チームの\u003cruby>雰囲気\u003crt>ふんいき\u003c/rt>\u003c/ruby>って\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>るんですね。","zh":"原来大家会先问那个人「你自己想怎么做」。这么一句平常的话，也能让人感受到团队的氛围。","cue":"如果聊到同事会先听当事人自己想怎么做"}],"followups":[],"audience":"","reverse":"23"},{"id":"q34","title":"BASE 社内也有外籍同事吗","menuTitle":"BASE 社内也有外籍同事吗","page":"","blocks":[{"type":"speech","ja":"\u003cruby>留学生\u003crt>りゅうがくせい\u003c/rt>\u003c/ruby>として\u0 u003c/rt>\u003c/ruby>えたいです。","zh":"平时听大家说日语，我基本没什么困难。不过要当场说出自己的想法，有时确实没法像日语母语者那样一下子找到合适的词。所以平时我会主动跟身边的人交流，讨论时也会先用自己的话说出想法。拿不准怎么说的时候，我也会借助 AI 或翻译工具，把细微的意思表达清楚。"},{"cue":"顺着日语表达，接到自己想在团队里发挥的长处","ja":"もちろん、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えを\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>でもっと\u003cruby>自然\u003crt>しぜん\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えられるように、これからも\u003cruby>練習\u003crt>れんしゅう\u003c/rt>\u003c/ruby>を\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けていきます。そのうえで、\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>では\u003cruby>国籍\u003crt>こくせき\u003c/rt>\u003c/ruby>や\u003cruby>母語\u003crt>ぼご\u003c/rt>\u003c/ruby>に\u003cruby>関係\u003crt>かんけい\u003c/rt>\u003c/ruby>なく、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ち\u003cruby>味\u003crt>あじ\u003c/rt>\u003c/ruby>も\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>かしていきたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っています。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>の\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>は、\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かいところにも\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>を\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けて、\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>を\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>しながら\u003cruby>筋道\u003crt>すじみち\u003c/rt>\u003c/ruby>を\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>てて\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるところかなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。チームで\u003cruby>課題\u003crt>かだい\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>むときには、そういう\u003cruby>面\u003crt>めん\u003c/rt>\u003c/ruby>で\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>になりたいです。","zh":"当然，为了能更自然地用日语说出自己的想法，我也会继续练习。在工作中，我也想发挥那些和国籍、母语无关，属于我自己的长处。我觉得自己比较能留意到细节，也习惯把信息理清楚，再一步一步想问题。以后和团队一起解决问题时，我希望能发挥这方面的长处。"}],"audience":"","reverse":"34"},{"id":"q27","title":"当面聊时最想让学生知道什么","menuTit function applyTheme() {
  const hex = prefs.theme === 'custom' ? prefs.custom : colors[prefs.theme];
  const rgb = [1,3,5].map(i => parseInt(hex.slice(i,i+2),16));
  const linear = rgb.map(channel => {
    const n = channel / 255;
    return n <= .04045 ? n / 12.92 : ((n + .055) / 1.055) ** 2.4;
  });
  const dark = linear[0]*.2126 + linear[1]*.7152 + linear[2]*.0722 < .18;
  root.style.colorScheme = dark ? 'dark' : 'light';
  root.dataset.theme = prefs.theme;
  root.style.setProperty('--panel-rgb',rgb.join(' '));
  root.style.setProperty('--ink',dark ? '#f3f7f4' : '#181b18');
  root.style.setProperty('--muted',dark ? '#c6d3ca' : '#343b35');
  root.style.setProperty('--accent',dark ? '#9ae3b4' : '#244d3c');
  root.style.setProperty('--line',dark ? 'rgb(205 230 215 / .37)' : 'rgb(32 32 32 / .30)');
  root.style.setProperty('--soft-line',dark ? 'rgb(205 230 215 / .20)' : 'rgb(32 32 32 / .15)');
  root.style.setProperty('--web-floor',dark ? '#36423e' : '#e5e9e4');
  document.querySelector('meta[name="theme-color"]').content = hex;
  byId('setting-color').value = prefs.custom;
  for (const key of Object.keys(colors)) byId('theme-'+key).setAttribute('aria-pressed',String(prefs.theme === key));
}
function applyPrefs() {
  root.classList.toggle('no-zh', !prefs.zh);
  root.classList.toggle('no-ruby', !prefs.ruby);
  byId('zh-button').setAttribute('aria-pressed', String(prefs.zh));
  byId('ruby-button').setAttribute('aria-pressed', String(prefs.ruby));
  settingsFields.forEach(field => {
    const val = prefs[field.key];
    root.style.setProperty(field.prop, val + field.unit);
    const {input, output} = fields.get(field.key);
    input.value = String(val);
    output.value = ['alpha','rubySize'].includes(field.key) ? Math.round(val * 100) + '%' : field.key === 'leading' ? val + ' 倍' : val + ' ' + field.unit;
    input.setAttribute('aria-valuetext',output.value);
  });
  applyTheme();
}
function buildControls() {
  settingsFields.forEach(field => {
    const raw = stored[field.key];
    prefs[field.key] = Number.isFinite(raw) ? Math.min(field.max, Math.max(field.min, raw)) : field.value;
    const wrap = make('div','control'), label = make('label','',field.label), input = make('input'), output = make('output');
    input.type = 'range'; input.id = 'setting-' + field.key;
    for (const attr of ['min','max','step']) input[attr] = String(field[attr]);
    label.htmlFor = input.id; output.setAttribute('for',input.id);
    wrap.append(label,input,output); byId('settings-controls').append(wrap); fields.set(field.key,{input,output});
    input.addEventListener('input', () => { prefs[field.key] = Number(input.value); applyPrefs(); persist(); });
  });
  for (const key of Object.keys(colors)) byId('theme-'+key).addEventListener('click', () => {prefs.theme=key;applyTheme();persist();});
  byId('setting-color').addEventListener('input',e => {prefs.custom=e.target.value;prefs.theme='custom';applyTheme();persist();});
  for (const [id,key] of [['zh-button','zh'],['ruby-button','ruby']]) byId(id).addEventListener('click', () => {prefs[key]=!prefs[key];applyPrefs();persist();});
  byId('reset').addEventListener('click', () => {
    for (const f of settingsFields) prefs[f.key]=f.value;
    Object.assign(prefs,{theme:'dark',custom:colors.custom,zh:true,ruby:true});
    applyPrefs();persist();
  });
  applyPrefs();
}
function pageLinks(value, shelf = false) {
  const label = make('span','page');
  for (const token of String(value).split(/(P?\s*\d+)/gi)) {
    const number = /^P?\s*(\d+)$/i.exec(token);
    if (!number) { label.append(token); continue; }
    const link = make('a','',token);
    link.href = (shelf ? '#folio-p' : '#p') + number[1];
    link.setAttribute('aria-label','跳到第 ' + number[1] + ' 页');
    label.append(link);
  }
  return label;
}
function renderCard({section,group,item}) {
  const article = make('article','card');
  article.id = item.id; article.tabIndex = -1;
  const itemHead = make('div','card-head');
  const isPage = section.kind === 'pages';
  if (item.reverse) article.dataset.reverse = item.reverse;
  if (item.page) {
    itemHead.append(isPage ? make('span','page',item.page) : pageLinks(item.page, Boolean(group.shelf)));
  }
  const heading = item.title.startsWith('「') && item.menuTitle ? item.menuTitle : item.title;
  itemHead.append(make('h4','',heading));
  if (item.audience) itemHead.append(make('span','audience',item.audience));
  article.append(itemHead);
  item.blocks.forEach(block => {
    if (!block.ja && !block.zh) return;
    const row = make('div','block ' + block.type);
    if (block.page) {
      const cue = pageLinks(block.page, Boolean(group.shelf));
      cue.classList.add('block-page');
      row.append(cue);
    }
    if (block.cue) row.append(make('p','reply-cue',block.cue));
    if (block.ja) {
      const ja = make('p','jp');
      ja.lang = 'ja';
      ja.innerHTML = block.ja;
      row.append(ja);
    }
    if (block.zh && (!block.ja || block.zh !== item.title)) {
      row.append(make('p','zh' + (block.ja ? ' translation':''),block.zh));
    }
    article.append(row);
  });
  for (const branch of item.followups || []) {
    const row = make('div','block reply');
    row.append(make('p','reply-cue',branch.cue));
    const ja = make('p','jp');
    ja.lang = 'ja'; ja.innerHTML = branch.ja;
    row.append(ja,make('p','zh translation',branch.zh));
    article.append(row);
  }
  for (const topic of item.related || []) {
    const link = make('a','related-topic',topic.label);
    link.href = '#' + topic.id;
    article.append(link);
  }
  return article;
}
function drawReader() {
  const fragment = document.createDocumentFragment();
  data.sections.forEach(section => {
    const outer = make('section', 'reader-section');
    outer.id = section.id;
    outer.tabIndex = -1;
    itemsById.set(section.id, {section, article:outer});
    const nav = make('a','',section.label);
    nav.href = '#' + section.id;
    byId('sections').append(nav);
    navBySection.set(section.id, nav);
    const head = make('div', 'section-head');
    head.append(make('h2','',section.label));
    outer.append(head);
    section.groups.forEach(group => {
      if (!group.items.length) return;
      const groupEl = make('div', 'group');
      if (section.kind === 'reverse') {
        groupEl.id=group.id;groupEl.tabIndex=-1;
        itemsById.set(group.id,{section,group,article:groupEl});
      }
      if (section.groups.length > 1 || group.label !== section.label) groupEl.append(make('h3','groupname',group.label));
      group.items.forEach(item => {
        const entry = {section,group,item,article:null};
        indexed.push(entry); itemsById.set(item.id,entry);
        if (group.shelf) {
          if (!shelves.has(group.shelf)) shelves.set(group.shelf,{id:group.shelf,entries:[],groups:[]});
          shelves.get(group.shelf).entries.push(entry);
        } else {
          entry.article=renderCard(entry);
          groupEl.append(entry.article);
          mainEntries.push(entry);
        }
      });
      if (!group.shelf) outer.append(groupEl);
    });
    fragment.append(outer);
  });
  const detail=make('section','reader-section');
  detail.id='folio-detail';detail.hidden=true;
  fragment.append(detail);reader.append(fragment);
}
const normalize = value => value.normalize('NFKC').toLowerCase().trim();
function buildDirectory() {
  const list = byId('directory-list');
  let regularNumber=0;
  const sectionStart=new Map();
  for (const entry of indexed) {
    const {section,group,item}=entry;
    const title=item.menuTitle || item.title;
    const shelf=shelves.get(group.shelf);
    let container=list;
    if (section.kind==='reverse') {
      if (!reverseDirectoryGroups.has(group.id)) {
        const wrapper=make('div','directory-group');
        const heading=make('h3','directory-group-title',group.label);
        wrapper.append(heading);list.append(wrapper);
        reverseDirectoryGroups.set(group.id,wrapper);
      }
      container=reverseDirectoryGroups.get(group.id);
    }
    if (shelf) {
      if (!shelf.toggle) {
        const toggle=make('button','shelf-toggle',shelfTitles[shelf.id]+'（'+shelf.entries.length+(shelf.id==='portfolio-pages'?'页':'题')+'）');
        toggle.id='toggle-'+shelf.id;toggle.type='button';
        shelf.panel=make('div');shelf.panel.id='list-'+shelf.id;
        toggle.setAttribute('aria-controls',shelf.panel.id);
        toggle.addEventListener('click',()=>{
          if (byId('directory-search').value.trim()) byId('directory-search').value='';
          activeShelf=activeShelf===shelf.id?'':shelf.id;
          filterDirectory();
          if (activeShelf) toggle.scrollIntoView({block:'start'});
        });
        shelf.toggle=toggle;
        const first=sectionStart.get(section);
        if (first) first.before(toggle,shelf.panel);
        else list.append(toggle,shelf.panel);
        sectionStart.set(section,toggle);
      }
      let bucket=shelf.groups.at(-1);
      if (!bucket || bucket.group!==group) {
        const heading=make('h3','shelf-group',group.label);
        bucket={group,heading,entries:[]};shelf.groups.push(bucket);shelf.panel.append(heading);
      }
      bucket.entries.push(entry);container=shelf.panel;
    }
    const link=make('a');
    link.href='#'+item.id;
    if (!shelf || shelf.id==='portfolio-pages') {
      const rank=make('span','directory-rank',shelf?item.page:String(++regularNumber).padStart(2,'0'));
      rank.setAttribute('aria-hidden','true');link.append(rank);
    }
    link.append(make('span','directory-title',title));
    const cues=item.blocks.map(block=>block.cue).filter(Boolean);
    const questions=item.blocks.filter(block=>block.type==='prompt' || (section.kind==='reverse' && block.type==='speech'));
    if (section.kind==='reverse') questions.push(...(item.followups || []));
    const prompts=questions.map(block=>block.ja.replace(/<rt>.*?<\/rt>|<[^>]+>/g,''));
    entry.search=normalize([title,item.title,item.audience,item.page,item.id,section.label,group.label,...cues,...prompts].filter(Boolean).join(' '));
    entry.menuLink=link;container.append(link);
    if(!sectionStart.has(section)) sectionStart.set(section,link);
  }
  filterDirectory();
}
function filterDirectory() {
  const query=normalize(byId('directory-search').value);
  const terms=query.split(/\s+/).filter(Boolean);
  let count=0;
  for (const entry of indexed) {
    const match=terms.every(term=>{
      if (/^p\d+$/.test(term)) {
        return entry.search.match(/\bp\d+\b/g)?.includes(term) || false;
      }
      return entry.search.includes(term);
    });
    entry.menuLink.hidden=!match;
    if (match && (query || !entry.group.shelf || activeShelf===entry.group.shelf)) count++;
  }
  for (const shelf of shelves.values()) {
    const expanded=Boolean(query) || activeShelf===shelf.id;
    for (const bucket of shelf.groups) bucket.heading.hidden=bucket.entries.every(entry=>entry.menuLink.hidden);
    const hasResults=shelf.groups.some(bucket=>!bucket.heading.hidden);
    shelf.toggle.hidden=!hasResults;
    shelf.toggle.setAttribute('aria-expanded',String(expanded && hasResults));
    shelf.panel.hidden=!expanded || !hasResults;
  }
  for (const wrapper of reverseDirectoryGroups.values()) {
    wrapper.hidden = !wrapper.querySelector('a:not([hidden])');
  }
  byId('directory-count').textContent=query?'找到 '+count+' 项':'';
  byId('directory-clear').disabled=!query;
  byId('directory-empty').hidden=count!==0;
}
function identifyLocation(entry) {
  if (!entry || current === entry) return;
  current?.menuLink?.removeAttribute('aria-current');
  navBySection.get(current?.section.id)?.removeAttribute('aria-current');
  current = entry;
  entry.menuLink?.setAttribute('aria-current','location');
  navBySection.get(entry.section.id)?.setAttribute('aria-current','location');
  const title=entry.item?.menuTitle || entry.item?.title || entry.group?.label || entry.section.label;
  byId('current-label').textContent=entry.group?.shelf==='portfolio-pages'?entry.item.page+' · '+title:title;
}
let scrollQueued=false;
function track() {
  scrollQueued=false;
  if (!mainEntries.length || settings.open || directory.open || pinnedEntry || reader.classList.contains('in-folio')) return;
  const line=reader.getBoundingClientRect().top+24;
  let lo=0,hi=mainEntries.length;
  while(lo<hi){
    const mid=(lo+hi)>>>1;
    if(mainEntries[mid].article.getBoundingClientRect().top<=line) lo=mid+1;else hi=mid;
  }
  const atEnd=reader.scrollTop+reader.clientHeight>=reader.scrollHeight-2;
  identifyLocation(mainEntries[atEnd ? mainEntries.length-1 : Math.max(0,lo-1)]);
}
function queueTrack() {if(!scrollQueued){scrollQueued=true;requestAnimationFrame(track);}}
function releasePinned() {pinnedEntry=undefined;queueTrack();}
function urlTarget() {
  try {
    const id=decodeURIComponent(location.hash.slice(1));
    return itemsById.get(id) || (id === 'q39' && itemsById.get('q37')) || (/^q\d+$/.test(id) ? itemsById.get('reverse') : undefined);
  } catch {return undefined;}
}
function showFolio(entry) {
  if (!reader.classList.contains('in-folio')) lastMain=current;
  reader.classList.add('in-folio');
  const shelf=shelves.get(entry.group.shelf);
  const detail=byId('folio-detail');
  const link=(id,label,target)=>{
    const a=make('a','',label);a.id='folio-'+id;a.href='#'+target;return a;
  };
  const tools=make('nav','folio-tools');
  tools.setAttribute('aria-label','作品阅读导航');
  tools.append(link('index','回目录',shelf.id),link('return','回主稿',lastMain?.article?.id || entry.section.id));
  const steps=make('nav','folio-tools folio-step');
  steps.setAttribute('aria-label',shelf.id==='portfolio-pages'?'翻页':'切换问答');
  const isPage=shelf.id==='portfolio-pages';
  const sequence=isPage && !entry.item.skipInPresentation
    ? shelf.entries.filter(row=>!row.item.skipInPresentation) : shelf.entries;
  const position=sequence.indexOf(entry);
  const previous=sequence[position-1]?.item, next=sequence[position+1]?.item;
  if(previous) steps.append(link('prev',isPage?'上一页 · '+previous.page:'上一题',previous.id));
  if(next) steps.append(link('next',isPage?'下一页 · '+next.page:'下一题',next.id));
  if(current?.group?.shelf && current!==entry) current.article=null;
  entry.article=renderCard(entry);
  detail.replaceChildren(tools,make('h3','groupname',entry.group.label),entry.article,steps);
  detail.hidden=false;
}
function openShelf(id) {
  activeShelf=id;
  if(!directory.open) openSheet(directory,byId('directory-button'));
  byId('directory-search').value='';activeShelf=id;filterDirectory();
  const target=current?.group?.shelf===id ? current.menuLink : shelves.get(id).toggle;
  target.scrollIntoView({block:target===current?.menuLink?'center':'start'});
  target.focus({preventScroll:true});
}
function route(focus=true) {
  const id=location.hash.slice(1);
  if(shelves.has(id)) {openShelf(id);return;}
  if(directory.open)closeSheet(directory,false);
  goTo(urlTarget() || mainEntries[0],focus);
}
function goTo(entry,focus=true) {
  if (!entry) return;
  pinnedEntry=entry;
  if(entry.group?.shelf) {
    showFolio(entry);
    if (focus) entry.article.focus({preventScroll:true});
    reader.scrollTop=0;identifyLocation(entry);return;
  }
  if (reader.classList.contains('in-folio')) {
    const detail=byId('folio-detail');
    detail.hidden=true;detail.replaceChildren();
    if (current?.group?.shelf) current.article=null;
    reader.classList.remove('in-folio');
  }
  if (focus) entry.article.focus({preventScroll:true});
  const top=reader.scrollTop + entry.article.getBoundingClientRect().top-reader.getBoundingClientRect().top-8;
  reader.scrollTo({top,behavior:'instant'});
  identifyLocation(entry);
}
function follow(entry) {
  if (!entry) return;
  const hash='#'+encodeURIComponent(entry.item?.id || entry.section.id);
  if(location.hash!==hash) history.pushState(null,'',hash);
  goTo(entry);
}
function openSheet(dialog,trigger) {
  opener=trigger;
  if(dialog===settings && current) settingsPosition={entry:current,top:current.article.getBoundingClientRect().top};
  document.body.classList.add('modal-open');
  dialog.showModal();trigger.setAttribute('aria-expanded','true');
  if(dialog===directory) {
    byId('directory-search').value='';activeShelf=current?.group?.shelf || '';filterDirectory();
    const here=current?.menuLink || reverseDirectoryGroups.get(current?.group?.id) || indexed.find(e=>e.section===current?.section)?.menuLink;
    if(here) here.scrollIntoView({block:'nearest'});
    const focusTarget=matchMedia('(pointer:coarse)').matches ? dialog.querySelector('[data-close]') : byId('directory-search');
    focusTarget.focus({preventScroll:true});
  }else dialog.querySelector('[data-close]').focus({preventScroll:true});
}
function closeSheet(dialog,restore=true) {
  dialog.close();opener?.setAttribute('aria-expanded','false');document.body.classList.remove('modal-open');
  if(dialog===settings && settingsPosition) {
    reader.scrollTop+=settingsPosition.entry.article.getBoundingClientRect().top-settingsPosition.top;settingsPosition=undefined;
  }
  if(restore && dialog===directory && shelves.has(location.hash.slice(1))) {
    const anchor=current?.item?.id || current?.section?.id;
    const url=new URL(location.href);url.hash=anchor || '';
    history.replaceState(null,'',url);
  }
  if(restore) opener?.focus({preventScroll:true});
}
buildControls();drawReader();buildDirectory();identifyLocation(indexed[0]);
for(const [dialog,id] of [[directory,'directory-button'],[settings,'settings-button']]) {
  byId(id).addEventListener('click',e=>openSheet(dialog,e.currentTarget));
  dialog.querySelector('[data-close]').addEventListener('click',()=>closeSheet(dialog));
  dialog.addEventListener('cancel',e=>{e.preventDefault();closeSheet(dialog);});
  dialog.addEventListener('click',e=>{
    if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();
    if(e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom)closeSheet(dialog);
  });
}
byId('directory-search').addEventListener('input',()=>{filterDirectory();byId('directory-list').scrollTop=0;});
byId('directory-search').addEventListener('keydown',e=>{
  const first=Array.from(byId('directory-list').querySelectorAll('a:not([hidden])')).find(a=>!a.closest('[hidden]'));
  if(first && ['ArrowDown','Enter'].includes(e.key) && !e.isComposing) {
    e.preventDefault();if(e.key==='Enter') first.click();else first.focus();
  }
});
byId('directory-clear').addEventListener('click',()=>{
  byId('directory-search').value='';filterDirectory();byId('directory-search').focus();
});
byId('popup').addEventListener('click',()=>{
  const url=new URL(location.href);url.searchParams.set('compact','1');url.hash=current?.article.id || '';
  window.open(url.href,'base-casual-mini','popup,width=400,height=560,resizable=yes,scrollbars=yes');
});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey)return;
  const id=decodeURIComponent(a.hash.slice(1));
  if(shelves.has(id)) {
    e.preventDefault();
    if(location.hash!==a.hash) history.pushState(null,'',a.hash);
    openShelf(id);return;
  }
  const entry=itemsById.get(id);
  if(!entry)return;
  e.preventDefault();
  if(a.closest('#sections')) {
    byId('directory-search').value='';activeShelf='';filterDirectory();
    const collection=Array.from(shelves.values()).find(shelf=>shelf.entries[0].section.id===id);
    const first=collection?.toggle || mainEntries.find(row=>row.section.id===id)?.menuLink;
    first?.focus({preventScroll:true});
    (first?.closest('.directory-group')?.firstElementChild || first)?.scrollIntoView({block:'start'});
    return;
  }
  if(directory.open)closeSheet(directory,false);
  follow(entry);
});
for(const type of ['wheel','touchstart','pointerdown']) reader.addEventListener(type,releasePinned,{passive:true});
document.addEventListener('keydown',e=>{
  if(!directory.open && !settings.open && ['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].includes(e.key))releasePinned();
});
reader.addEventListener('scroll',queueTrack,{passive:true});
window.addEventListener('resize',queueTrack);
history.scrollRestoration='manual';
window.addEventListener('hashchange',()=>route());
requestAnimationFrame(()=>route(false));
</script>
