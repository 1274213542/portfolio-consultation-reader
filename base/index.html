<style>
:root {
  color-scheme:light; --panel-rgb:255 255 255; --ink:#202020; --muted:#535353; --accent:#315d49; --line:rgb(32 32 32 / .30); --soft-line:rgb(32 32 32 / .15);
  --web-floor:#e6eae6; --alpha:.45; --body-size:18px; --leading:1.75; --letters:.015em; --ruby-size:.42em; --ruby-gap:1px; --content-width:760px;
}
*,::before,::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--web-floor);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Yu Gothic",sans-serif}
html.native-mini,html.native-mini body{background:transparent}
body{position:relative;isolation:isolate;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"toolbar" "reader";height:100vh;height:100dvh;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-color:rgb(var(--panel-rgb) / var(--alpha))}
[hidden]{display:none!important} button,input,output{font:inherit} button,a,input{touch-action:manipulation}
button{color:var(--ink);border:1px solid var(--line);border-radius:5px;cursor:pointer;background:transparent}
a{color:var(--accent);text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{grid-area:toolbar;z-index:1;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.shell{max-width:var(--content-width);margin:0 auto;padding:5px max(8px,env(safe-area-inset-right)) 5px max(8px,env(safe-area-inset-left));min-height:45px;display:flex;align-items:center;gap:7px}
.bar button,.dismiss,.reset{padding:4px 9px;font-size:13px;min-height:33px}
#current-label{flex:1;min-width:0;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:13px;color:var(--muted)}
#popup{display:none}
@media(min-width:760px){html:not(.compact) #popup{display:block}}
.compact .shell{min-height:36px;padding-block:3px}
.compact .bar button{min-height:27px;padding:3px 7px;font-size:12px}
.native-mini body{grid-template-areas:"reader" "toolbar";grid-template-rows:minmax(0,1fr) auto}
.native-mini .bar{border-bottom:0;border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom)}
#reader{grid-area:reader;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;scroll-padding-block:8px;scrollbar-width:thin;padding:12px max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.reader-section{max-width:var(--content-width);margin:auto}
.reader-section+.reader-section{margin-top:28px}
.reader-section:focus,.card:focus{outline:none}
.section-head h2{font-weight:650;font-size:19px;margin:0 0 10px}
.groupname{font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 5px}
.card{border:1px solid var(--soft-line);border-radius:5px;padding:11px 12px;background:transparent;overflow-wrap:anywhere}
.card+.card{margin-top:7px}
.card-head{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin:0 0 5px;color:var(--muted)}
.card-head h4,.audience,.page,.block-page{font-size:12px;line-height:1.5;margin:0;font-weight:500}
.audience{margin-left:auto}
.page{font-variant-numeric:tabular-nums;color:var(--muted)} .block-page{display:block}
.jp,.zh{margin:0;overflow-wrap:anywhere;line-break:strict}
.jp{color:var(--ink);font:500 var(--body-size)/var(--leading) -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;letter-spacing:var(--letters)}
rt{color:var(--muted);font-size:var(--ruby-size);font-weight:500;line-height:1;letter-spacing:0;position:relative;top:calc(0px - var(--ruby-gap))}
html.no-ruby rt,html.no-ruby rp,html.no-zh .translation{display:none}html.no-ruby ruby{display:inline}
.zh{font-size:max(12px,calc(var(--body-size) * .8));line-height:1.7;color:var(--muted);white-space:pre-line}
.translation{margin-top:5px}
.block+.block{margin-top:7px}
.prompt{border:1px solid var(--line);border-left-width:3px;border-radius:3px;padding:5px 7px}
.prompt .jp{font-weight:620}
.reply{padding-top:8px;border-top:1px solid var(--soft-line)}
.reply-cue{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:650}
.article-source{display:table;max-width:100%;margin-top:7px;font-size:12px}
.compact #reader{padding:6px}
.compact .reader-section+.reader-section{margin-top:16px}
.compact .section-head h2{font-size:15px;margin:2px 0 6px}
.compact .groupname{font-size:11px;margin:7px 0 3px}
.compact .card{padding:6px}.compact .card+.card{margin-top:4px}
.compact .card-head h4,.compact .audience,.compact .page{font-size:11px}
dialog{color:var(--ink);padding:0;border:1px solid var(--line);background:rgb(var(--panel-rgb));overflow:hidden}
dialog::backdrop{background:rgb(16 24 18 / .28)}
dialog[open]{display:flex;flex-direction:column}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px 6px}
.sheet-top h2{margin:0;font-size:16px;font-weight:650}
.dismiss{min-height:30px;padding:3px 8px}
#directory{position:fixed;inset:0 auto 0 0;margin:0;width:min(340px,92vw);height:100dvh;max-height:100dvh;max-width:100vw;border:0;border-right:1px solid var(--line);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.directory-filter{position:relative;margin:4px 10px 3px}
#directory-search{width:100%;min-width:0;padding:7px 32px 7px 8px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:5px;font-size:15px}
#directory-search::-webkit-search-cancel-button{display:none}
#directory-clear{position:absolute;right:1px;inset-block:1px;border:0;width:32px;font-size:18px}
#directory-clear:disabled{visibility:hidden}
#sections{display:flex;gap:3px;align-items:center;margin:2px 9px}
#sections a{flex:1;min-width:0;text-align:center;text-decoration:none;color:var(--muted);border-radius:3px;font-size:11px;padding:4px 0}
#sections a[aria-current],#sections a:hover{text-decoration:underline;color:var(--ink);text-underline-offset:4px;font-weight:600}
#directory-count{margin:1px 12px 4px;color:var(--muted);font-size:11px}
#directory-list{min-height:0;overflow:auto;overscroll-behavior:contain;padding:1px 7px 8px;flex:1}
#directory-list a{display:flex;align-items:baseline;gap:9px;border:1px solid transparent;border-radius:5px;text-decoration:none;color:var(--ink);padding:7px 6px;line-height:1.45}
#directory-list a:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
#directory-list a[aria-current]{border-color:var(--line);font-weight:650}
#directory-list a:focus-visible{outline-offset:-2px}
.directory-rank{flex:none;min-width:2ch;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.directory-title{overflow-wrap:anywhere;font-size:13px}
#directory-empty{padding:0 12px;color:var(--muted);font-size:13px}
#settings{width:min(390px,96vw);max-height:90dvh;margin:auto;border-radius:7px}
.sheet-scroll{padding:5px 12px 12px;overflow:auto;min-height:0;overscroll-behavior:contain}
.control{display:grid;grid-template-columns:95px minmax(0,1fr) 55px;gap:5px;align-items:center;min-height:32px}
.control label,.control output{font-size:12px}.control output{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.control input{width:100%;min-width:0;margin:0;accent-color:var(--accent)}
.display-options,.theme-options{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin:8px 0}
.display-options button,.theme-options button{padding:4px 8px;font-size:12px}
button[aria-pressed=true]{color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.theme-options label{font-size:12px}
#setting-color{width:28px;height:28px;padding:1px;cursor:pointer;border:1px solid var(--line);border-radius:5px;background:transparent}
.sample{padding:7px 0;border-bottom:1px solid var(--soft-line)}
.reset{margin-top:5px}
.native-mini #directory{width:min(280px,94vw)}
.native-mini dialog{background:transparent;box-shadow:none}
.native-mini dialog::backdrop{background:transparent}
.native-mini body.modal-open>.bar,.native-mini body.modal-open>#reader{visibility:hidden}
.native-mini #settings{position:fixed;inset:auto 0 0;margin:0 auto;width:100%;max-width:100%;border:0;border-top:1px solid var(--line);border-radius:0;padding-bottom:env(safe-area-inset-bottom)}
@media(max-width:759px){html:not(.native-mini) .shell{padding-block:4px}html:not(.native-mini) .bar button,html:not(.native-mini) #directory-list a,html:not(.native-mini) .dismiss{min-height:44px}html:not(.native-mini) #directory-search{min-height:44px;font-size:16px}html:not(.native-mini) #sections a{padding-block:9px}}
</style>
</head>

y>拝見\u003crt>はいけん\u003c/rt>\u003c/ruby>して、\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>お\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しできるのを\u003cruby>楽\u003crt>たの\u003c/rt>\u003c/ruby>しみにしていました。よろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"我是ZHANG ZIRUI，现在在武藏野美术大学大学院读设计信息学。本科也在武藏美，学的是平面设计。读研后，我一边做研究，一边也开始自学 UI/UX，现在也会自己动手做 App 界面。我在 BASE 集团的官方 note 上分别读过两位的访谈，所以一直很期待今天能和两位聊聊。请多关照。"}],"sources":[{"label":"北村受访｜PAY ID 商品搜索改版","url":"https://note.com/base_group/n/n39a643caaa7d"},{"label":"成原受访｜集团新卒招聘座谈","url":"https://note.com/base_group/n/ncf1502e8af6e"}]},{"id":"opening-4","title":"对方介绍了团队或说明今天怎么聊","menuTitle":"听完团队介绍","page":"","blocks":[{"type":"speech","ja":"はい、ありがとうございます。","zh":"好的，谢谢。"}],"sources":[]}]},{"id":"sharing","label":"共享与临场短讲","items":[{"id":"sharing-1","title":"共享与临场短讲","menuTitle":"询问能否共享作品集","page":"","blocks":[{"type":"note","ja":"","zh":"聊到自己的制作、对方还没邀请展示时。"},{"type":"speech","ja":"ポートフォリオを\u003cruby>用意\u003crt>ようい\u003c/rt>\u003c/ruby>してきたのですが、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>共有\u003crt>きょうゆう\u003c/rt>\u003c/ruby>して、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>してもよろしいですか。","zh":"我今天带了作品集，可以共享一下屏幕，简单介绍一下吗？"}],"sources":[]},{"id":"sharing-2","title":"对方已经邀请或者同意时","menuTitle":"确认对方看得见屏幕","page":"","blocks":[{"type":"note","ja":"","zh":"对方已经邀请或者同意时。"},{"type":"speech","ja":"ありがとうございます。では、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>共有\u003crt>きょうゆう\u003c/rt>\u003c/ruby>しますね。こちらの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>、\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えますか。","zh":"谢谢，那我共享一下屏幕。能看见吗？"}],"sources":[]},{"id":"sharing-3","title":"对方已经邀请或者同意时","menuTitle":"P4 · 介绍两件作品","page":"","blocks":[{"type":"note","ja":"","zh":"停在P4目录。如果对方已经指定作品或只给一件的时间，直接翻到那件。"},{"type":"speech","ja":"こちらが\u003cruby>目次\u003crt>もくじ\u003c/rt>\u003c/ruby>です。UI/UXとグラフィックデザインの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せています。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>は、この\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つを\u003cruby>簡単\u003crt>かんたん\u003c/rt>\u003c/ruby>にご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>します。","zh":"这是目录，里面有 UI/UX 和平面设计的作品。今天我想简单讲一下前面这两件。"}],"sources":[]},{"id":"sharing-4","title":"如果对方已经看过作品集","menuTitle":"对方已经看过作品集","page":"","blocks":[{"type":"speech","ja":"もうご\u003cruby>覧\u003crt>らん\u003c/rt>\u003c/ruby>くださったんですね。ありがとうございます。もし\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になった\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>があれば、そこからお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しします。","zh":"原来您已经看过了，谢谢。如果有您想听的作品，我可以从那件讲起。"}],"sources":[]},{"id":"sharing-5","title":"如果对方说只够简单看一件","menuTitle":"MORI · 简短介绍","page":"","blocks":[{"type":"note","ja":"","zh":"直接打开P17。只讲一个设计选择。没法共享时也能单独讲。"},{"type":"speech","ja":"\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>の「MORI」は、ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するためのアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、クーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>って\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>って、\u003cruby>一着\u003crt>いっちゃく\u003c/rt>\u003c/ruby>だけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すと、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るのかって、すぐには\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりにくいんです。そこで、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、カードに\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>とポイント、それから\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すかどうか\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>められるようにしました。","zh":"第一件 MORI 是我设计的网购服装退货 App 方案。比如用优惠券和积分买了两件衣服，只退一件时，很难一下算清能退多少。所以我把预计退回卡里的钱、返还的积分和退货运费都放在预约取件之前，让人看完再决定退不退。"}],"sources":[]},{"id":"sharing-6","title":"如果对方点名看TUCK，打开P34","menuTitle":"TUCK · 简短介绍","page":"","blocks":[{"type":"note","ja":"","zh":"如果对方点名看TUCK，打开P34。"},{"type":"speech","ja":"「TUCK T10」は、\u003cruby>床\u003crt>ゆか\u003c/rt>\u003c/ruby>の\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>をアームで\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけるロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけるように\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んで、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>だけ「\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わりました」と\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たら、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>だったら「じゃあ、スリッパは？」と\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になります。そこで、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にはスリッパを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>して、\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だった\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりに、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せるようにしました。","zh":"TUCK T10 是带机械臂的扫地机器人 App 方案。比如我让它收拾地上的袜子和拖鞋，最后只收到袜子搬完的通知，我就会想「那拖鞋呢？」所以我在结果页把拖鞋放在前面，再给出它原先的位置和原定目的地，让人能自己去找。"}],"sources":[]}]}]},{"id":"pages","label":"作品","kind":"pages","groups":[{"id":"mori","label":"第一件 MORI","items":[{"id":"p17","title":"P17，先指出成品和退款预估","menuTitle":"MORI · P17 退货前先看退款","page":"P17","blocks":[{"type":"speech","ja":"\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>は「MORI」です。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>アプリで、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>する\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れをデザインしました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>はネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をするのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>は、クーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってシャツとパンツを\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が、シャツだけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>す\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"第一件叫 MORI，我为购物 App 设计了服装退货流程。我自己很喜欢网购。这次设想的是，有人用优惠券和积分一起买了衬衫和裤子，后来只想退衬衫。"},{"type":"speech","ja":"このとき、シャツの\u003cruby>値段\u003crt>ねだん\u003c/rt>\u003c/ruby>だけ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ても、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るかは\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりません。\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったクーポンやポイントをどう\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けるかで\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わりますし、\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>もかかります。それで、こちらの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>では、カードにいくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>か、ポイントはいくつ\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るか、\u003cruby>送料\u003crt>そうりょう\u003c/rt>\u003c/ruby>はいくらかを、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようにしました。","zh":"这时光看衬衫的价格，很难知道究竟能退多少。两件衣服怎么分摊优惠券和积分，会影响退款额，寄回去还要付运费。所以在这张页面上，预约取件之前就能看到预计退回卡里多少钱、返还多少积分，以及退货运费是多少。"}],"sources":[]},{"id":"p21","title":"P21，包裹到店后在等什么","menuTitle":"MORI · P21 包裹到店后","page":"P21","blocks":[{"type":"speech","ja":"シャツを\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>した\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>は、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になることが\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>はもうお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いているのに、まだお\u003cruby>金\u003crt>かね\u003c/rt>\u003c/ruby>が\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ってこない。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>だったら「このまま\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っていていいのかな」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。そこで、この\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>には、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>がシャツを\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったことと、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>だということを\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>はいつまでに\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかも、ここで\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。","zh":"衬衫寄回去之后，关心的事情变了。包裹明明到店了，钱却还没退回来，换作是我就会想「我就这样等着可以吗？」所以在这张页面上，我把店铺已经收到衬衫、目前正在检查商品这两件事分开写了。下一次最晚什么时候会来消息，在这里也看得到。"}],"sources":[]},{"id":"mori-3","title":"「このテーマを選んだきっかけは何ですか。」","menuTitle":"MORI · 为什么做退货","page":"","blocks":[{"type":"prompt","ja":"このテーマを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだきっかけは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"对方想知道你怎么会注意到退货。接着刚说的网购兴趣，讲自己查到的一个疑点。"},{"type":"speech","ja":"\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>した\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>、\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>までどう\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>んでいるか、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>からは\u003cruby>追\u003crt>お\u003c/rt>\u003c/ruby>いにくいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったのがきっかけです。いくつかのサービスの\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んでみると、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と、お\u003cruby>金\u003crt>かね\u003c/rt>\u003c/ruby>が\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ったかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>が\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>でした。それで、シャツを\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>す\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>立場\u003crt>たちば\u003c/rt>\u003c/ruby>で、\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ってから\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>されるまで、いつ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれば\u003cruby>安心\u003crt>あんしん\u003c/rt>\u003c/ruby>して\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>てるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"起点是我觉得，衣服寄回去后，站在买家这边很难知道退款办到哪一步了。我读了几家服务的退货说明，发现确认包裹有没有到、钱有没有退回来，得去不同的地方看。所以我站在只退一件衬衫的人的角度，把寄回到退款这一段顺了一遍，想弄清每一步知道些什么，心里才有底。"}],"sources":[]},{"id":"mori-4","title":"「この4,800円は、どう計算したんですか。」","menuTitle":"MORI · 4,800 日元怎么算","page":"","blocks":[{"type":"prompt","ja":"この\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>は、どう\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>したんですか。","zh":""},{"type":"note","ja":"","zh":"打开P18，先说按商品价格分摊，再指着画面逐项算。"},{"type":"speech","ja":"\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>の\u003cruby>値段\u003crt>ねだん\u003c/rt>\u003c/ruby>に\u003cruby>応\u003crt>おう\u003c/rt>\u003c/ruby>じて、クーポンとポイントを\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>しました。シャツが\u003cruby>6,600円\u003crt>ろくせんろっぴゃくえん\u003c/rt>\u003c/ruby>、パンツが4,400\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>で、シャツが\u003cruby>合計\u003crt>ごうけい\u003c/rt>\u003c/ruby>11,000\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>の\u003cruby>6割\u003crt>ろくわり\u003c/rt>\u003c/ruby>です。なので、この\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>った1,000\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>のクーポンと1,000ポイントのうち、\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>と\u003cruby>600ポイント\u003crt>ろっぴゃくぽいんと\u003c/rt>\u003c/ruby>がシャツの\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>です。","zh":"我是按两件衣服各自的价格分摊优惠券和积分的。衬衫 6,600 日元，裤子 4,400 日元，合计 11,000 日元，衬衫占六成。所以这单用掉的 1,000 日元优惠券和 1,000 积分里，衬衫分到的是 600 日元优惠和 600 积分。"},{"type":"speech","ja":"シャツの\u003cruby>6,600円\u003crt>ろくせんろっぴゃくえん\u003c/rt>\u003c/ruby>から、クーポンで\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>いた\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>、ポイントで\u003cruby>払\u003crt>はら\u003c/rt>\u003c/ruby>った\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>、それに\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>の\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>くと、カードには\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>です。\u003cruby>600ポイント\u003crt>ろっぴゃくぽいんと\u003c/rt>\u003c/ruby>は\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ります。この\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>ではそういうルールにしていて、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>がシャツを\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したら\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>が\u003cruby>確定\u003crt>かくてい\u003c/rt>\u003c/ruby>します。","zh":"从 6,600 日元里扣掉优惠的 600 日元、积分支付的 600 日元，再扣 600 日元退货运费，预计退回卡里 4,800 日元，另退 600 积分。这是这个作品里设定的规则，等店铺检查过衬衫，金额才确定。"}],"sources":[]},{"id":"mori-5","title":"「どうして、この表示にしたんですか。」","menuTitle":"MORI · 为什么选这个方案","page":"","blocks":[{"type":"prompt","ja":"どうして、この\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>にしたんですか。","zh":""},{"type":"note","ja":"","zh":"翻P14。问的是为什么选中间这版，先说它解决了哪个疑问，再指旁边的方案。"},{"type":"speech","ja":"\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>がお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>はまだこれからだということを、\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたくて、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>は「\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しています」と\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きく\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すので、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>していることは\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>なら、その\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>にお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったことまで\u003cruby>一目\u003crt>ひとめ\u003c/rt>\u003c/ruby>で\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>の\u003cruby>履歴\u003crt>りれき\u003c/rt>\u003c/ruby>や\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>の\u003cruby>内訳\u003crt>うちわけ\u003c/rt>\u003c/ruby>は、\u003cruby>詳\u003crt>くわ\u003c/rt>\u003c/ruby>しく\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいときに\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>けるようにしました。","zh":"我选中间这版，是想让人同时知道包裹已经到店、退款还在后面。右边这版把「正在检查商品」突出显示，能看明白店家正在做什么。中间这版则一眼就能看到，店家在这之前已经收到了衣服。物流记录和金额明细，需要时可以再打开。"}],"sources":[]},{"id":"mori-6","title":"「待つだけでいいと、どう伝えていますか。」","menuTitle":"MORI · 什么时候只要等待","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>つだけでいいと、どう\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えていますか。","zh":""},{"type":"note","ja":"","zh":"翻P21，先答正在等谁、要等到什么时候，再说明需要买家回应时会怎样。"},{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>していることと、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>がいつまでに\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しています。この\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>だと、シャツは\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>で、21\u003cruby>日\u003crt>にち\u003c/rt>\u003c/ruby>までにお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>から\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>ます。もしお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>でタグが\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つからず、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>にも\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>してほしいなら、\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>も\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。タグを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れた\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>は、そのときの\u003cruby>様子\u003crt>ようす\u003c/rt>\u003c/ruby>をお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えられるよう、\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>ボタンを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"我会写清店铺正在做什么，以及最晚什么时候会再联系。这个例子里，衬衫还在检查，店家会在 21 日前发消息。如果店家没找到吊牌，需要买家也确认一下，页面的内容就会变。如果买家记得自己把吊牌放进去了，可以点联系按钮，跟店家说明当时打包的情况。"}],"sources":[]},{"id":"mori-7","title":"「P15の数字は、実際に取ったアンケートですか。」","menuTitle":"MORI · 问卷数字的来源","page":"","blocks":[{"type":"prompt","ja":"P15の\u003cruby>数字\u003crt>すうじ\u003c/rt>\u003c/ruby>は、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったアンケートですか。","zh":""},{"type":"note","ja":"","zh":"直接说数据从哪里来、它在作品里用来做什么。"},{"type":"speech","ja":"いいえ。\u003cruby>各案\u003crt>かくあん\u003c/rt>\u003c/ruby>に\u003cruby>50件\u003crt>ごじゅっけん\u003c/rt>\u003c/ruby>ずつ、\u003cruby>仮\u003crt>かり\u003c/rt>\u003c/ruby>の\u003cruby>回答\u003crt>かいとう\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れています。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せ\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うと、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たときの\u003cruby>安心感\u003crt>あんしんかん\u003c/rt>\u003c/ruby>がどう\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わるか。それを\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べる\u003cruby>方法\u003crt>ほうほう\u003c/rt>\u003c/ruby>を\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>したページです。\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>にB\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>は、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>の\u003cruby>到着\u003crt>とうちゃく\u003c/rt>\u003c/ruby>とお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>を\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せられるからです。","zh":"不是，每个方案的 50 份回答都是假设数据。这一页想说明，如果要了解不同的呈现方式会怎样影响人们看到退货指引时的安心感，可以怎样比较。我选 B 方案，实际依据是它能把包裹已经到店和店家目前的检查进度放在一起。"}],"sources":[]},{"id":"mori-8","title":"「実際に使ってもらって、分かりやすいか確かめましたか。」","menuTitle":"MORI · 用户试用情况","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらって、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすいか\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめましたか。","zh":""},{"type":"note","ja":"","zh":"先说做到哪一步。对方想听下一步时，再讲你要观察的具体判断。"},{"type":"speech","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらうのは、これからです。まずは\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらって、「このシャツを\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>したら、カードにはいくら、ポイントはいくつ\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>りますか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいです。\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>した\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>なら、「\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>からお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>しますか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>きます。どこを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てそう\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったかも\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けると、\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>す\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。","zh":"还没请人实际试过。我想先让人看退款页面，问「这件衬衫退了的话，会退回卡里多少钱、返还多少积分？」换到寄回后的页面，再问「现在你会主动联系店家吗？」再听听他们是看了哪里才这么判断的，就比较容易找到需要改的地方。"}],"sources":[]}]},{"id":"tuck","label":"第二件 TUCK T10","items":[{"id":"p34","title":"P34，先指右边采用的方案","menuTitle":"TUCK · P34 收拾拖鞋的结果","page":"P34","blocks":[{"type":"speech","ja":"\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つ\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>は「TUCK T10」です。\u003cruby>床\u003crt>ゆか\u003c/rt>\u003c/ruby>にある\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>をアームで\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけてくれるロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。これは、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパの\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけを\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んだ\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>は\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったと\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たのに、スリッパの\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>だけ\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>ていません。","zh":"第二件叫 TUCK T10，是为带机械臂、能收拾地上小物的扫地机器人设计的 App。这是让机器人收拾袜子和拖鞋之后的结果页。袜子已经收到了搬完的通知，偏偏拖鞋那条还没来。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>だったら、ここで\u003cruby>一番\u003crt>いちばん\u003c/rt>\u003c/ruby>\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいのは「じゃあ、スリッパはどこにあるんだろう」ということです。それで\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>では、\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>の\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>は\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>の\u003cruby>一行\u003crt>いちぎょう\u003c/rt>\u003c/ruby>にまとめて、そのすぐ\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>に、これから\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すスリッパが\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>るようにしました。","zh":"换作是我，这时最想知道的就是「那拖鞋现在在哪儿呢？」所以你看右边这版，我把总件数放在最上面的一行，紧接着突出显示接下来要找的拖鞋。"}],"sources":[]},{"id":"p39","title":"P39，沿两处查找线索讲到最后的记录","menuTitle":"TUCK · P39 如何找回拖鞋","page":"P39","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、スリッパをどこから\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せばいいかです。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>は\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりませんが、ロボットが\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたのはソファの\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>で、\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だったのは\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>です。この\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>か\u003cruby>所\u003crt>しょ\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれば、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しに\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>けます。","zh":"接下来，该从哪里找拖鞋呢？现在还不知道它在哪儿，但机器人最初是在沙发前发现它的，原本打算送到放鞋的地方。知道了这两处，人就有地方去找了。"},{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたら、「\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>にあった」と\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>できます。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたのは\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>なので、「ロボットからの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>」は「\u003cruby>未\u003crt>み\u003c/rt>\u003c/ruby>\u003cruby>受信\u003crt>じゅしん\u003c/rt>\u003c/ruby>」のままです。\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>から\u003cruby>見返\u003crt>みかえ\u003c/rt>\u003c/ruby>したときにも、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したのかが\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるようにしました。","zh":"比如我在放鞋的地方找到了，就能记下「在预定位置找到」。是我自己找到的，所以「机器人传回的结果」这一栏仍然是「未收到」。这样以后再翻回来看，也能知道当时是谁确认的。"}],"sources":[]},{"id":"tuck-3","title":"「実際の製品を調べて作ったんですか。」","menuTitle":"TUCK · 参考了什么产品","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>製品\u003crt>せいひん\u003c/rt>\u003c/ruby>を\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べて\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":""},{"type":"note","ja":"","zh":"对方在问参考过什么、你自己做了哪部分。P29–30有操作指南和提案范围。"},{"type":"speech","ja":"はい。RoborockのSaros Z70という、アーム\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>きのロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>の\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>ガイドを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>の\u003cruby>重\u003crt>おも\u003c/rt>\u003c/ruby>さや\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りのスペースによっては、\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>まで\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べないことがあるんです。そこから、\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>で\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけを\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んだ\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からなかったら\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>がどう\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるか、というところまでをアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>にしました。","zh":"是的。我读了 Roborock 一款叫 Saros Z70 的机械臂扫地机器人的操作指南。物品的重量、旁边空间够不够，都可能影响它能不能把东西运到预定位置。所以我从人在地图上选好物品、交给机器人收拾，一直设计到之后没收到结果时，人可以怎样自己去确认。"}],"sources":[]},{"id":"tuck-4","title":"「スリッパの移動に失敗したということですか。」","menuTitle":"TUCK · 拖鞋是否搬运成功","page":"","blocks":[{"type":"prompt","ja":"スリッパの\u003cruby>移動\u003crt>いどう\u003c/rt>\u003c/ruby>に\u003cruby>失敗\u003crt>しっぱい\u003c/rt>\u003c/ruby>したということですか。","zh":""},{"type":"note","ja":"","zh":"对方在确认拖鞋是不是没搬成功。一句说明此刻知道什么，接上页面为什么这样显示。"},{"type":"speech","ja":"\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べたかどうかは、まだ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないんです。\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いていないのは\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>なので、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にもそう\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>きました。そのうえで、\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しに\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>く\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>には\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりが\u003cruby>要\u003crt>い\u003c/rt>\u003c/ruby>るので、\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>示\u003crt>しめ\u003c/rt>\u003c/ruby>しています。","zh":"现在还不知道有没有搬成功。能确定的是结果通知还没到，所以页面上也是这样写的。接下来要自己去找的人需要线索，我就标出了那两个地方。"}],"sources":[]},{"id":"tuck-5","title":"「どこまで動くものを作ったんですか。」","menuTitle":"TUCK · 原型能操作到哪一步","page":"","blocks":[{"type":"prompt","ja":"どこまで\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>くものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":""},{"type":"note","ja":"","zh":"翻P42。先说可点击的具体操作，再讲按下后能看到哪两个状态。"},{"type":"speech","ja":"ロボットが\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>んでいる\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で、\u003cruby>一時停止\u003crt>いちじていし\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>むところを、ブラウザーで\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>できるようにしました。\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>した\u003cruby>直後\u003crt>ちょくご\u003c/rt>\u003c/ruby>は、まだ\u003cruby>本当\u003crt>ほんとう\u003c/rt>\u003c/ruby>に\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>まったか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないので、「ロボットの\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っています」と\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>したという\u003cruby>模擬\u003crt>もぎ\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>くと、\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて「\u003cruby>再開\u003crt>さいかい\u003c/rt>\u003c/ruby>する」が\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>せます。この\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>替\u003crt>か\u003c/rt>\u003c/ruby>わりまで\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめました。","zh":"我把机器人搬东西途中按暂停的这段，做成了可以在浏览器里操作的原型。刚按下去，还不知道机器是否已经停住，所以先显示「正在等待机器人停止」。等模拟的停止通知到了，才可以按「继续」。我在原型里确认了这段状态切换。"}],"sources":[]},{"id":"tuck-6","title":"「結果画面も、実際に使ってもらったんですか。」","menuTitle":"TUCK · 结果页的试用情况","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>も、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらったんですか。","zh":""},{"type":"note","ja":"","zh":"对方在问P34、P39的设计有没有找人试过。接着刚讲过的拖鞋场景说。"},{"type":"speech","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>は、まだ\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらっていません。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、さっきの\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>をそれぞれ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらって、「この\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をしますか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいです。そこからスリッパを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>そうと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うか、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>でどこを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せばいいか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たいです。","zh":"结果页还没请人实际试过。下一步我想把刚才的两种方案分别给人看，问一句「接下来你会做什么？」看他们会不会想到去找拖鞋，再看到了下一张页面，知不知道可以从哪儿找起。"}],"sources":[]},{"id":"p77","title":"P77，四季の花綴り","menuTitle":"平面作品 · P77 四季の花綴り","page":"P77","blocks":[{"type":"speech","ja":"グラフィックの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>でしたら、\u003cruby>卒業制作\u003crt>そつぎょうせいさく\u003c/rt>\u003c/ruby>の「\u003cruby>四季\u003crt>しき\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>\u003cruby>綴\u003crt>つづ\u003c/rt>\u003c/ruby>り」をお\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せします。\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>を\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>にして、\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>と\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせた\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>です。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば\u003cruby>春\u003crt>はる\u003c/rt>\u003c/ruby>のページでは、\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てくる\u003cruby>黄色\u003crt>きいろ\u003c/rt>\u003c/ruby>を、すぐ\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>びらで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようにしました。\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>から\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>を\u003cruby>想像\u003crt>そうぞう\u003c/rt>\u003c/ruby>して、ふと\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると\u003cruby>本物\u003crt>ほんもの\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>がある。そういう\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>ができたらと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>って\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"如果想看平面设计，我想给您看毕业作品《四季の花綴り》。我自己把四季的花做成压花，再和汉诗编成了四册书。比如春天这页，诗里写到的黄色，在旁边那片花瓣上就能看到。我希望读者先从文字想象那个季节，再往旁边一看，真的有一朵花在那儿。"}],"sources":[]},{"id":"tuck-8","title":"介绍说完","menuTitle":"结束作品介绍","page":"","blocks":[{"type":"speech","ja":"ご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>したかったのは\u003cruby>以上\u003crt>いじょう\u003c/rt>\u003c/ruby>です。ありがとうございます。","zh":"我想介绍的作品就到这里，谢谢。"}],"sources":[]}]}],"links":[{"id":"p17","label":"MORI · P17"},{"id":"p34","label":"TUCK · P34"},{"id":"p77","label":"平面设计 · P77"}]},{"id":"questions","label":"问答","kind":"flow","groups":[{"id":"answers","label":"轮到对方问你","items":[{"id":"answers-1","title":"「今日はどんなことを聞いてみたいですか。」","menuTitle":"今天最想了解什么","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>はどんなことを\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいですか。","zh":""},{"type":"note","ja":"","zh":"对方把话交给你时再用。刚才能听懂的部分就不必再请他们重讲。"},{"type":"speech","ja":"PAY IDのデザイナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>とどんなふうにお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をされているのか\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいです。","zh":"我想听听，平时做 PAY ID 的设计，会和哪些同事一起做事，大家是怎么配合的。"}],"sources":[]},{"id":"answers-2","title":"「どうしてUI/UXを始めたんですか。」","menuTitle":"为什么开始做 UI/UX","page":"","blocks":[{"type":"prompt","ja":"どうしてUI/UXを\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたんですか。","zh":""},{"type":"note","ja":"","zh":"先讲自己怎么动起手，最后说哪里好玩。"},{"type":"speech","ja":"\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>ではグラフィックデザインを\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>んでいて、プログラミングも\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しやっていました。\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>った\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>、AIを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってコードを\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>くのが\u003cruby>身近\u003crt>みじか\u003c/rt>\u003c/ruby>になって、「\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>でデザインしたものを\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>かしてみたいな」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったんです。それでWebページを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったり、アプリの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>も\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>でデザインして\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>かしてみたりしました。\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>触\u003crt>さわ\u003c/rt>\u003c/ruby>ると「ここはこうしたほうが\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすいな」って、また\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>したくなるんです。そうやって\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>しながら\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るのが、だんだん\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きになりました。","zh":"我本科学的是平面设计，也学过一点编程。读研那会儿，用 AI 辅助写代码变得挺普遍的，我就想，自己设计的东西，我也想亲手让它动起来。后来我就试着做网页，也自己设计 App 界面，把它做出来试用。真的用起来，就会觉得「这里这样改会更顺手」，然后又想回去改。我是慢慢喜欢上这种边做边试的过程的。"}],"sources":[]},{"id":"answers-3","title":"「BASEに興味を持ったきっかけは何ですか。」","menuTitle":"对 BASE 感兴趣的契机","page":"","blocks":[{"type":"prompt","ja":"BASEに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>を\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ったきっかけは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"问兴趣是怎么产生的。先说明为什么这次邀请跟你有关系，再说后来主动读到什么。"},{"type":"speech","ja":"\u003cruby>以前\u003crt>いぜん\u003c/rt>\u003c/ruby>、ネットで\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>するときにPAY IDを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがあって、\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>、そのチームからスカウトをいただいたのがきっかけです。どんな\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っているんだろうと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>って、BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>したチームのインタビューを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>だけで\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>したいという\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がいたそうで、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>もレコードを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すときは、まずお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>から\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶので、よく\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったんです。そういう\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>をする\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>が、どうやって\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>のデザインにつながったのか、\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>に\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたくなりました。","zh":"以前网购下单时我用过 PAY ID，这次收到做这个产品的团队发来的邀请，就是契机。我想知道平时是什么样的人在做，于是去 BASE 集团的官方 note 读了商品搜索改版的团队访谈。里面提到，有买家想只在喜欢的那家店里找东西。我找唱片时也常常先选店，读到这里就很有共鸣。我很想听做这个项目的人聊聊，这样一种购物习惯，是怎么一步步影响他们做设计的。"}],"sources":[{"label":"BASE 集团官方 note｜PAY ID 商品搜索改版访谈","url":"https://note.com/base_group/n/n39a643caaa7d"}]},{"id":"answers-4","title":"「BASEのどこに魅力を感じましたか。」","menuTitle":"BASE 的什么地方吸引我","page":"","blocks":[{"type":"prompt","ja":"BASEのどこに\u003cruby>魅力\u003crt>みりょく\u003c/rt>\u003c/ruby>を\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じましたか。","zh":""},{"type":"note","ja":"","zh":"如果紧接上一题，出处已经说过，第二句从「先ほどの検索の記事なんですが、商品を細かく…」接即可。"},{"type":"speech","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>にとって\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>なものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るときに、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>無理\u003crt>むり\u003c/rt>\u003c/ruby>なく\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けてもらえるかまで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えているところです。BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>したチームの\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かく\u003cruby>絞\u003crt>しぼ\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>めるようにするには、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>分類\u003crt>ぶんるい\u003c/rt>\u003c/ruby>が\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>だったそうです。お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>\u003cruby>入力\u003crt>にゅうりょく\u003c/rt>\u003c/ruby>してもらうのは\u003cruby>大変\u003crt>たいへん\u003c/rt>\u003c/ruby>なので、もともとおすすめ\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すために\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けていた\u003cruby>分類\u003crt>ぶんるい\u003c/rt>\u003c/ruby>を、\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>にも\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったとありました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をしていたときは、\u003cruby>絞\u003crt>しぼ\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>みが\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っても、その\u003cruby>分類\u003crt>ぶんるい\u003c/rt>\u003c/ruby>を\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けるのかまでは\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていませんでした。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>も、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>こう\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>にいる\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>まで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるようになりたいです。","zh":"吸引我的是，做一个让买家更方便的东西时，你们也会想，店家能不能不费劲地一直用下去。我在 BASE 集团官方 note 读了 PAY ID 搜索改版团队的访谈。想让买家筛得更细，就要给每一件商品分类。让店家全部手填很费工夫，所以团队把原来给商品做推荐时就有的分类用到了搜索里。我自己购物时也会觉得筛选很方便，却很少想到是谁给商品分的类。我也想学会在做设计时，多想到屏幕另一头那个要负责这件事的人。"}],"sources":[{"label":"BASE 集团官方 note｜PAY ID 商品搜索改版访谈","url":"https://note.com/base_group/n/n39a643caaa7d"}]},{"id":"answers-5","title":"「PAY IDならではだと思ったところは？」","menuTitle":"PAY ID 的独特之处","page":"","blocks":[{"type":"prompt","ja":"PAY IDならではだと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったところは？","zh":""},{"type":"note","ja":"","zh":"说你喜欢 PAY ID 的哪种购物方式。关注店铺看上新，与收藏某件商品等它补货是两回事。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がいいなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったのは、\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>度\u003crt>ど\u003c/rt>\u003c/ruby>\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>ったお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>のときも\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>りやすいところです。レコードを\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めるのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>は「そろそろ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったかな」と、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>\u003cruby>軒\u003crt>けん\u003c/rt>\u003c/ruby>かのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>のサイトを\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていました。PAY IDだと、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になるお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をアプリでフォローしておけば、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しい\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>が\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったときに\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるんです。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>は\u003cruby>欲\u003crt>ほ\u003c/rt>\u003c/ruby>しい\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>が\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つからなくても、「このお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>、またのぞいてみよう」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>える。そこが\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>のレコードの\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>し\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っています。","zh":"我觉得它好在，喜欢上一家店之后，下次它上新时很容易再找回去。我喜欢收唱片，以前会想着「差不多该上新了吧」，一家一家打开几家店的网站看。后来发现，在 PAY ID 的 App 里关注喜欢的店，有新货就能知道。这次没找到想要的那一张，我也会想「这家店，下次还想来逛」。这一点很合我找唱片的习惯。"}],"sources":[{"label":"PAY ID 官方｜关注店铺与到货提醒","url":"https://payid.jp/"}]},{"id":"answers-6","title":"「UI/UXでは、今どんなことに興味がありますか。」","menuTitle":"现在对 UI/UX 的哪部分感兴趣","page":"","blocks":[{"type":"prompt","ja":"UI/UXでは、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どんなことに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>がありますか。","zh":""},{"type":"note","ja":"","zh":"先说现在想练习如何向使用者发问。对方想听 BASE 的具体案例时，再补搜索访谈。"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っている\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>くところに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>があります。「ここ、ちょっと\u003cruby>面倒\u003crt>めんどう\u003c/rt>\u003c/ruby>で」と\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>われたら、つい「じゃあ、こう\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えたらどうかな」と\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えてしまうんですけど、その\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に「\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>はどうされてるんですか」って\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいんです。その\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>なりに\u003cruby>工夫\u003crt>くふう\u003c/rt>\u003c/ruby>していることが\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれば、こちらが\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>って\u003cruby>足\u003crt>た\u003c/rt>\u003c/ruby>そうとしていたものも、\u003cruby>実\u003crt>じつ\u003c/rt>\u003c/ruby>は\u003cruby>要\u003crt>い\u003c/rt>\u003c/ruby>らないかもしれない。そういう\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いたうえで、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るか\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるようになりたいです。","zh":"我现在对怎么听用户聊自己的经历很感兴趣。有人说「这个地方有点麻烦」，我很容易马上就想「那改成这样会不会好一点？」但我想学着先多问一句，「您平时是怎么做的呢？」要是听到他自己已经有一套顺手的办法，那我原以为很方便、想加进去的东西，也许根本用不着。我想学的是，先听到这些，再决定要做什么。"}],"sources":[]},{"id":"answers-7","title":"「どんな仕事に関わってみたいですか。」","menuTitle":"入职后想做什么工作","page":"","blocks":[{"type":"prompt","ja":"どんな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>に\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わってみたいですか。","zh":""},{"type":"note","ja":"","zh":"想参与哪类工作先讲清，再讲入职初期准备怎么一步步学。"},{"type":"speech","ja":"PAY IDで、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>ったあとに\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>や\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いの\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ってみたいです。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>からすると、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どうなっているかを\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたい\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>ですけど、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>がいつ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しているかを\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>が\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らないと、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすく\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えられないと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。\u003cruby>新卒\u003crt>しんそつ\u003c/rt>\u003c/ruby>デザイナーの\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページで、\u003cruby>入社\u003crt>にゅうしゃ\u003c/rt>\u003c/ruby>して\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>半年\u003crt>はんとし\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>年\u003crt>ねん\u003c/rt>\u003c/ruby>ほどは、\u003cruby>研修\u003crt>けんしゅう\u003c/rt>\u003c/ruby>を\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>けたり、\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>と\u003cruby>小\u003crt>ちい\u003c/rt>\u003c/ruby>さな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたりすると\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。まずはそういう\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>通\u003crt>とお\u003c/rt>\u003c/ruby>して、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つの\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>が\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>とお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にそれぞれどう\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えているのかを\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいです。","zh":"我想参与 PAY ID 里买完东西后查看订单和付款情况的界面设计。买家当然想知道「现在到哪儿了」，但我自己要是都不清楚店家这时在确认什么，就很难跟买家讲清楚。我在新卒设计师招聘页读到，入职后的前半年到一年左右会有研修，也会和前辈从小任务开始做。我想先借这些工作弄明白，同一笔订单，从买家和店家那边看分别是什么样的。"}],"sources":[{"label":"PAY ID 28 卒设计师招聘页","url":"https://open.talentio.com/r/1/c/binc/pages/128919"}]},{"id":"answers-8","title":"「買い物のあとの、どんなところが気になりますか。」","menuTitle":"购物之后最在意什么","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>のあとの、どんなところが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になりますか。","zh":""},{"type":"note","ja":"","zh":"上一题已经讲了订单。追问直接说明买家要作的一个判断。"},{"type":"speech","ja":"\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いが\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>んでいるかどうかです。\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>んでいれば、あとは\u003cruby>発送\u003crt>はっそう\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>てますし、まだだったら、いつまでに\u003cruby>払\u003crt>はら\u003c/rt>\u003c/ruby>えばいいかを\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいです。","zh":"我在意自己这边到底付完没有。付完了，我就等发货；还没付，我想知道最晚什么时候得付。"}],"sources":[]},{"id":"answers-9","title":"「大学院では、何を研究しているんですか。」","menuTitle":"大学院的研究","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>では、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>しているんですか。","zh":""},{"type":"note","ja":"","zh":"先讲希望谁看懂什么，再用一句日常说法解释题材，最后说你具体做的事。"},{"type":"speech","ja":"\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>で\u003cruby>昔\u003crt>むかし\u003c/rt>\u003c/ruby>、\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いごとや\u003cruby>厄\u003crt>やく\u003c/rt>\u003c/ruby>よけのために\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>われていた「\u003cruby>護符\u003crt>ごふ\u003c/rt>\u003c/ruby>」を\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>しています。\u003cruby>日本\u003crt>にっぽん\u003c/rt>\u003c/ruby>でいうお\u003cruby>守\u003crt>まも\u003c/rt>\u003c/ruby>りに\u003cruby>近\u003crt>ちか\u003c/rt>\u003c/ruby>いものです。もともと\u003cruby>昔\u003crt>むかし\u003c/rt>\u003c/ruby>の\u003cruby>文化\u003crt>ぶんか\u003c/rt>\u003c/ruby>や\u003cruby>歴史\u003crt>れきし\u003c/rt>\u003c/ruby>が\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、この\u003cruby>題材\u003crt>だいざい\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>護符\u003crt>ごふ\u003c/rt>\u003c/ruby>に\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>かれた\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>や\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べて、\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にどんな\u003cruby>特徴\u003crt>とくちょう\u003c/rt>\u003c/ruby>があるのかを\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べています。\u003cruby>最終的\u003crt>さいしゅうてき\u003c/rt>\u003c/ruby>には\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>にして、\u003cruby>日本\u003crt>にっぽん\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にも、\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>ではこういう\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>で\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いを\u003cruby>託\u003crt>たく\u003c/rt>\u003c/ruby>していたんだなと\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じてもらえたらと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っています。","zh":"我研究的是中国过去用来祈愿、避灾的护符，和日本的护身符有点像。我本来就喜欢历史和传统文化，所以选了这个题材。现在我会把护符上的字和图放在一起比较，看看它们在形态上有哪些特点。最后我想做成一本书，让日本读者翻看的时候，也能体会到中国人过去是怎样用这样的形式寄托心愿的。"}],"sources":[]},{"id":"answers-10","title":"「学生時代に力を入れたことは何ですか。」","menuTitle":"学生时代投入最多的事","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>学生時代\u003crt>がくせいじだい\u003c/rt>\u003c/ruby>に\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れたことは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"讲自己主动承担了什么，为什么提议、怎么和同事做，以及团队持续运营的结果。"},{"type":"speech","ja":"\u003cruby>美大\u003crt>びだい\u003c/rt>\u003c/ruby>\u003cruby>受験\u003crt>じゅけん\u003c/rt>\u003c/ruby>の\u003cruby>予備校\u003crt>よびこう\u003c/rt>\u003c/ruby>で、SNSの\u003cruby>発信\u003crt>はっしん\u003c/rt>\u003c/ruby>を\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>したことです。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>広報\u003crt>こうほう\u003c/rt>\u003c/ruby>\u003cruby>用\u003crt>よう\u003c/rt>\u003c/ruby>の\u003cruby>画像\u003crt>がぞう\u003c/rt>\u003c/ruby>などを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っていたんですが、\u003cruby>学校\u003crt>がっこう\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>し\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めた\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>と、もう\u003cruby>出願\u003crt>しゅつがん\u003c/rt>\u003c/ruby>の\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>をしている\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>では、\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいことが\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うと\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じました。それで、\u003cruby>学校\u003crt>がっこう\u003c/rt>\u003c/ruby>\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びやポートフォリオの\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>など、\u003cruby>相手\u003crt>あいて\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>発信\u003crt>はっしん\u003c/rt>\u003c/ruby>する\u003cruby>内容\u003crt>ないよう\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えてみたいと、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>から\u003cruby>運営\u003crt>うんえい\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>に\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>しました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>と\u003cruby>投稿\u003crt>とうこう\u003c/rt>\u003c/ruby>\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>の\u003cruby>振\u003crt>ふ\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>りを\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>して、\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>や\u003cruby>投稿\u003crt>とうこう\u003c/rt>\u003c/ruby>はチームで\u003cruby>分担\u003crt>ぶんたん\u003c/rt>\u003c/ruby>しました。\u003cruby>運用\u003crt>うんよう\u003c/rt>\u003c/ruby>を\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けるうちに、ゼロから\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたアカウントのフォロワーが\u003cruby>千\u003crt>せん\u003c/rt>\u003c/ruby>\u003cruby>人\u003crt>にん\u003c/rt>\u003c/ruby>ほどになり、\u003cruby>問\u003crt>と\u003c/rt>\u003c/ruby>い\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせも\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えました。","zh":"我投入最多的一件事，是在一家美术升学机构策划社媒内容。一开始我负责做宣传图，后来发现，刚开始选学校的人和正在准备出愿的人，关心的东西不一样。于是我主动去找负责人商量，能不能按学生现在需要什么，分别做选校、作品集准备之类的内容。我负责策划和发布后的复盘，制作和发布由团队分工。大家持续运营下来，账号从零涨到了大约一千个关注，咨询也多了起来。"}],"sources":[]},{"id":"answers-11","title":"「PAY IDは使ったことがありますか。」","menuTitle":"用 PAY ID 下单的体验","page":"","blocks":[{"type":"prompt","ja":"PAY IDは\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがありますか。","zh":""},{"type":"note","ja":"","zh":"先说自己在哪一步用过。对方若只想确认，用第一句就够。"},{"type":"speech","ja":"はい、ネットで\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>するときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがあります。\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うのは、PAY IDが\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>なら、\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>うときも、\u003cruby>登録\u003crt>とうろく\u003c/rt>\u003c/ruby>してある\u003cruby>住所\u003crt>じゅうしょ\u003c/rt>\u003c/ruby>をそのまま\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるところです。\u003cruby>欲\u003crt>ほ\u003c/rt>\u003c/ruby>しいものを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わって、そのまま\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めるのはありがたいです。","zh":"用过，我网购下单时用过。觉得方便的是，换到另一家支持 PAY ID 的店，也可以直接用已经存好的地址。东西都挑好了，接着就能下单，这一步对我挺省事的。"}],"sources":[{"label":"PAY ID 官方｜结账时复用收货资料","url":"https://payid.jp/"}]},{"id":"answers-12","title":"「買う側として、どういう使い方が自分に合っていると思いますか。」","menuTitle":"我平常怎么挑唱片","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>として、どういう\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っていると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いますか。","zh":""},{"type":"note","ja":"","zh":"问你的购物习惯，从喜欢一家唱片店说到什么时候愿意再回来。如果刚讲过关注，直接说「そのお店の品ぞろえも気になるんです」。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>なら、\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなレコード\u003cruby>屋\u003crt>や\u003c/rt>\u003c/ruby>さんにどんなものが\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったかをのぞいて、その\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶ、という\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>ですね。レコードって、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>によって\u003cruby>品\u003crt>しな\u003c/rt>\u003c/ruby>ぞろえがかなり\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うんです。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>は\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>していた\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>がなくても、「このお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>仕入\u003crt>しい\u003c/rt>\u003c/ruby>れるんだろう」と\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になる。そうやってお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>ごとの\u003cruby>品\u003crt>しな\u003c/rt>\u003c/ruby>ぞろえを\u003cruby>楽\u003crt>たの\u003c/rt>\u003c/ruby>しみながら\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きです。","zh":"我喜欢看看常逛的几家唱片店最近进了什么，再从里面挑一张。唱片这东西，每家店的选品还真不一样。即使今天没碰上想找的那一张，我也会好奇「这家下次又会进什么呢？」逛的时候能看到每家店自己的眼光，这就是我喜欢的地方。"}],"sources":[{"label":"PAY ID 官方｜店铺上新与跨店下单","url":"https://payid.jp/"}]},{"id":"answers-13","title":"「お店の方にとっては、どう役に立つと思いましたか。」","menuTitle":"PAY ID 对店主的帮助","page":"","blocks":[{"type":"prompt","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にとっては、どう\u003cruby>役\u003crt>やく\u003c/rt>\u003c/ruby>に\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>つと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いましたか。","zh":""},{"type":"note","ja":"","zh":"换到店家的位置，讲一次店家确实用过的做法。"},{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にとっては、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しくいいものが\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったときに、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>ってくれた\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせられるのがいいなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。BASE Uで、PAY IDの\u003cruby>事業責任者\u003crt>じぎょうせきにんしゃ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>とショップオーナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、アプリの\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>している\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。あるお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>では\u003cruby>毎月\u003crt>まいつき\u003c/rt>\u003c/ruby>、\u003cruby>月末\u003crt>げつまつ\u003c/rt>\u003c/ruby>の\u003cruby>金曜日\u003crt>きんようび\u003c/rt>\u003c/ruby>が\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>で、その\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせてお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせを\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>っているそうです。いつも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てくれる\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に「\u003cruby>今月\u003crt>こんげつ\u003c/rt>\u003c/ruby>も\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>りましたよ」と\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけるような\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>なんだなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"我觉得对店家来说，好处是有好东西上新时，可以告诉那些本来就喜欢自己店的人。我在 BASE U 读到一篇 PAY ID 业务负责人和店主聊 App 用法的文章。有一家店每月月底的周五进货，就趁那一天给关注的人发个通知。听起来很像是跟常来的客人打声招呼，说「这个月的新货也到了」。"}],"sources":[{"label":"BASE U｜PAY ID 业务负责人与店主谈 App 的实际用法","url":"https://baseu.jp/51399"}]},{"id":"answers-14","title":"「気になったところや、こうなったらいいと思うことは？」","menuTitle":"我希望 PAY ID 改进的地方","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったところや、こうなったらいいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うことは？","zh":""},{"type":"note","ja":"","zh":"说你在意的一个瞬间，交代读到的买家经历与现有设置，再提一个小想法。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったのは、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をフォローするときに、どんなお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせがどのくらい\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るのかというところです。そらたさんという\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がnoteの\u003cruby>日記\u003crt>にっき\u003c/rt>\u003c/ruby>で、レコード\u003cruby>店\u003crt>てん\u003c/rt>\u003c/ruby>の\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>をまとめて\u003cruby>追\u003crt>お\u003c/rt>\u003c/ruby>えるのは\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だけど、\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>は\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>く\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じると\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていました。PAY IDのヘルプを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>は\u003cruby>種類\u003crt>しゅるい\u003c/rt>\u003c/ruby>ごとに\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>べるんですね。だったら、フォローするところで「\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>のお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせだけ\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りたい」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったときにも、そこから\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>をすぐ\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>けたら\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"我有点在意的是，点关注一家店时，能不能大致知道会收到哪些消息、会有多频繁。我在 note 上读到一位叫そらた的买家写的日记，他觉得集中看唱片店上新挺方便，但也觉得通知多。我去查了 PAY ID 的帮助页，知道现在就能按类型设置。那么从买家的角度，如果我点关注时只想收上新消息，当下就能找到这个设置，会很方便。"}],"sources":[{"label":"そらた在 note 上的使用日记","url":"https://note.com/sorata_note_a/n/nf25a6d71c06f"},{"label":"现行通知帮助","url":"https://help.thebase.in/hc/ja/articles/115000107921"}]},{"id":"answers-15","title":"「今、会社を選ぶときに何を大事にしていますか。」","menuTitle":"选公司时看重什么","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶときに\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしていますか。","zh":""},{"type":"note","ja":"","zh":"说选择公司的判断标准，再说明实际工作中为什么需要这个条件。"},{"type":"speech","ja":"\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じサービスに\u003cruby>継続\u003crt>けいぞく\u003c/rt>\u003c/ruby>して\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>われるかを\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしています。\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>リリースしたものでも、しばらく\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらうと、\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っているときには\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づかなかったことが\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てくると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。そういうときに、\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったエンジニアの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>と「ここ、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しよくできそうですね」と\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>せるチームで\u003cruby>働\u003crt>はたら\u003c/rt>\u003c/ruby>きたいです。","zh":"我很看重能不能持续做同一个产品。东西做出来，大家用过一阵子，才会冒出一些当时没想到的事。我希望那时候还能找之前一起做它的工程师聊一句，「这里我们应该还能再改好一点」。我想在这样的团队工作。"}],"sources":[]},{"id":"answers-16","title":"「今後、選考に進むことは考えていますか。」","menuTitle":"还在考虑是否参加选考","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今後\u003crt>こんご\u003c/rt>\u003c/ruby>、\u003cruby>選考\u003crt>せんこう\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>むことは\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていますか。","zh":""},{"type":"note","ja":"","zh":"这句用于有兴趣、还想再想想的时候。如果已经决定应募，用下一句。"},{"type":"speech","ja":"はい、\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えています。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ったことを\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>してから\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めたいです。","zh":"有，我在考虑申请。我想把今天听到的内容整理一下，再做决定。"}],"sources":[]},{"id":"answers-17","title":"当天已经明确想进一步应募时。如果已经听过申请方法，说完想申请就好","menuTitle":"已决定参加选考","page":"","blocks":[{"type":"note","ja":"","zh":"当天已经明确想进一步应募时。如果已经听过申请方法，说完想申请就好。"},{"type":"speech","ja":"はい、ぜひ\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>したいです。このあと、まず\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をすればいいか\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えていただけますか。","zh":"想，我很想申请。请问接下来第一步该做什么？"}],"sources":[]},{"id":"answers-18","title":"「ほかにも、使っている方の話で印象に残ったものはありますか。」","menuTitle":"印象深的买家使用案例","page":"","blocks":[{"type":"prompt","ja":"ほかにも、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っている\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>で\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>ったものはありますか。","zh":""},{"type":"note","ja":"","zh":"对方想听别人的购物体验时再讲。刚才说的是你的购物习惯，这里说的是一位店主自己购物时的经历。"},{"type":"speech","ja":"はい。M’s homelifeという\u003cruby>器\u003crt>うつわ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>のブログで、\u003cruby>店主\u003crt>てんしゅ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、ご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>の\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>について\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていました。Instagramで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にBASEを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っているところが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>くて、PAY IDがあれば、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わっても\u003cruby>何度\u003crt>なんど\u003c/rt>\u003c/ruby>も\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れずに\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>むそうです。\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>回\u003crt>まわ\u003c/rt>\u003c/ruby>る\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>には、こういうところが\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>なんだなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"有。我在一家叫 M’s homelife 的餐具店博客里，读到店主写自己当买家的经历。她在 Instagram 发现的店有不少都用 BASE，有 PAY ID 以后，换店购物也省得反复填同样的信息。对于本来就喜欢逛不同店的人，这点很实在。"}],"sources":[{"label":"M’s homelife 店主以买家身份写的使用记录","url":"https://www.mshomelife.com/blog/2025/10/12/140904"}]},{"id":"answers-19","title":"「なぜ、デザインが好きなのですか。」","menuTitle":"为什么喜欢设计","page":"","blocks":[{"type":"prompt","ja":"なぜ、デザインが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなのですか。","zh":""},{"type":"note","ja":"","zh":"可以直接用 Goodpatch 小窗里已经熟悉的回答。问到设计本身，讲你的设计观就够了。"},{"type":"speech","ja":"そうですね。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がデザインを\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>いと\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じるのは、すでにあるものを\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>分解\u003crt>ぶんかい\u003c/rt>\u003c/ruby>して、\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせ\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すことで、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しい\u003cruby>価値\u003crt>かち\u003c/rt>\u003c/ruby>を\u003cruby>生\u003crt>う\u003c/rt>\u003c/ruby>み\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>せるところです。\u003cruby>世\u003crt>よ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>には、\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>がかかっても\u003cruby>避\u003crt>さ\u003c/rt>\u003c/ruby>けられないことや、\u003cruby>複雑\u003crt>ふくざつ\u003c/rt>\u003c/ruby>な\u003cruby>仕組\u003crt>しく\u003c/rt>\u003c/ruby>みがあります。そうしたものも、デザインによって\u003crub
