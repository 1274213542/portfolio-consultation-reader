<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>BASE · カジュアル面談</title>
<style>
:root {
  color-scheme:dark; --panel-rgb:21 32 28; --ink:#f3f7f4; --muted:#c6d3ca; --accent:#9ae3b4; --line:rgb(205 230 215 / .37); --soft-line:rgb(205 230 215 / .20);
  --web-floor:#36423e; --alpha:.8; --body-size:18px; --leading:1.75; --letters:.015em; --ruby-size:.42em; --ruby-gap:1px; --content-width:760px;
}
*,::before,::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--web-floor);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Yu Gothic",sans-serif}
html.native-mini,html.native-mini body{background:transparent}
body{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"toolbar" "reader";height:100vh;height:100dvh;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-color:rgb(var(--panel-rgb) / var(--alpha))}
[hidden]{display:none!important} button,input,output{font:inherit} button,a,input{touch-action:manipulation}
button{color:var(--ink);border:1px solid var(--line);border-radius:5px;cursor:pointer;background:transparent}
a{color:var(--accent);text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{grid-area:toolbar;min-width:0;z-index:1;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.shell{min-width:0;max-width:var(--content-width);margin:0 auto;padding:5px max(8px,env(safe-area-inset-right)) 5px max(8px,env(safe-area-inset-left));min-height:45px;display:flex;align-items:center;gap:7px}
.bar button,.dismiss,.reset{padding:4px 9px;font-size:13px;min-height:33px}
#current-label{flex:1;min-width:0;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:13px}
#popup{display:none}
@media(min-width:760px){html:not(.compact) #popup{display:block}}
.compact .shell{min-height:36px;padding-block:3px}
.compact .bar button{min-height:27px;padding:3px 7px;font-size:12px}
.native-mini body{grid-template-areas:"reader" "toolbar";grid-template-rows:minmax(0,1fr) auto;padding-top:var(--native-titlebar-height,0px)}
.native-mini .bar{border-bottom:0;border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom)}
#reader{grid-area:reader;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;scroll-padding-block:8px;scrollbar-width:thin;padding:12px max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.reader-section{max-width:var(--content-width);margin:auto}
.reader-section+.reader-section{margin-top:28px}
.reader-section:focus,.card:focus{outline:none}
.section-head h2{color:var(--accent);font-weight:650;font-size:19px;margin:0 0 10px}
.groupname{font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 5px}
.card{border:1px solid var(--soft-line);border-radius:5px;padding:11px 12px;background:transparent;overflow-wrap:anywhere}
.card+.card{margin-top:7px}
.card-head{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin:0 0 5px;color:var(--muted)}
.card-head h4,.audience,.page,.block-page{font-size:12px;line-height:1.5;margin:0;font-weight:500}
.audience{margin-left:auto}
.page{font-variant-numeric:tabular-nums;color:var(--muted)} .block-page{display:block}
.jp,.zh{margin:0;overflow-wrap:anywhere;line-break:strict}
.jp{color:var(--ink);font:500 var(--body-size)/var(--leading) -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;letter-spacing:var(--letters)}
rt{color:var(--muted);font-size:var(--ruby-size);font-weight:500;line-height:1;letter-spacing:0;position:relative;top:calc(0px - var(--ruby-gap))}
html.no-ruby rt,html.no-ruby rp,html.no-zh .translation{display:none}html.no-ruby ruby{display:inline}
.zh{font-size:max(12px,calc(var(--body-size) * .8));line-height:1.7;color:var(--muted);white-space:pre-line}
.translation{margin-top:5px}
.block+.block{margin-top:7px}
.prompt{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px;padding:5px 7px}
.prompt .jp{font-weight:620}
.reply{padding-top:8px;border-top:1px solid var(--soft-line)}
#current-label,.directory-title,.card-head h4,.reply-cue,.prompt .translation{color:var(--accent)}
.card-head h4{font-weight:650}
.reply-cue{margin:0 0 4px;font-size:12px;font-weight:650}
.related-topic{display:table;max-width:100%;margin-top:7px;font-size:12px}
.compact #reader{padding:6px}
.compact .reader-section+.reader-section{margin-top:16px}
.compact .section-head h2{font-size:15px;margin:2px 0 6px}
.compact .groupname{font-size:11px;margin:7px 0 3px}
.compact .card{padding:6px}.compact .card+.card{margin-top:4px}
.compact .card-head h4,.compact .audience,.compact .page{font-size:11px}
dialog{color:var(--ink);padding:0;border:1px solid var(--line);background:rgb(var(--panel-rgb));overflow:hidden}
dialog::backdrop{background:rgb(16 24 18 / .28)}
dialog[open]{display:flex;flex-direction:column}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px 6px}
.sheet-top h2{margin:0;font-size:16px;font-weight:650}
.dismiss{min-height:30px;padding:3px 8px}
#directory{position:fixed;inset:0 auto 0 0;margin:0;width:min(340px,92vw);height:100dvh;max-height:100dvh;max-width:100vw;border:0;border-right:1px solid var(--line);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.directory-filter{position:relative;margin:4px 10px 3px}
#directory-search{width:100%;min-width:0;padding:7px 32px 7px 8px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:5px;font-size:15px}
#directory-search::-webkit-search-cancel-button{display:none}
#directory-clear{position:absolute;right:1px;inset-block:1px;border:0;width:32px;font-size:18px}
#directory-clear:disabled{visibility:hidden}
#sections{display:flex;gap:3px;align-items:center;margin:2px 9px}
#sections a{flex:1;min-width:0;text-align:center;text-decoration:none;color:var(--muted);border-radius:3px;font-size:11px;padding:4px 0}
#sections a[aria-current],#sections a:hover{text-decoration:underline;color:var(--accent);text-underline-offset:4px;font-weight:600}
#directory-count{margin:1px 12px 4px;color:var(--muted);font-size:11px}
#directory-list{min-height:0;overflow:auto;overscroll-behavior:contain;padding:1px 7px 8px;flex:1}
#directory-list a{display:flex;align-items:baseline;gap:9px;border:1px solid transparent;border-radius:5px;text-decoration:none;color:var(--ink);padding:7px 6px;line-height:1.45}
#directory-list a:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
#directory-list a[aria-current]{border-color:var(--accent);color:var(--accent);font-weight:650}
#directory-list a:focus-visible{outline-offset:-2px}
.directory-rank{flex:none;min-width:2ch;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.directory-title{overflow-wrap:anywhere;font-size:13px}
.shelf-toggle{display:block;width:100%;text-align:left;margin:4px 0;padding:7px 8px;color:var(--accent);border:1px solid var(--soft-line);font-size:13px}
.shelf-toggle::before{content:"▸";display:inline-block;width:1.25em}.shelf-toggle[aria-expanded="true"]::before{content:"▾"}
.shelf-group{font-size:12px;color:var(--muted);margin:6px 8px 0;font-weight:600}
.directory-group-title{margin:9px 7px 2px;padding-top:5px;border-top:1px solid var(--soft-line);color:var(--accent);font-size:13px;font-weight:650}
#reader.in-folio>.reader-section:not(#folio-detail){display:none}
#folio-detail{margin:0 auto}
.folio-tools{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin:2px 0 10px;font-size:13px}
.folio-tools a{display:inline-flex;align-items:center;min-height:30px}
.folio-step{margin:8px 0 0;justify-content:space-between}
#directory-empty{padding:0 12px;color:var(--muted);font-size:13px}
#settings{width:min(390px,96vw);max-height:90dvh;margin:auto;border-radius:7px}
.sheet-scroll{padding:5px 12px 12px;overflow:auto;min-height:0;overscroll-behavior:contain}
.control{display:grid;grid-template-columns:95px minmax(0,1fr) 55px;gap:5px;align-items:center;min-height:32px}
.control label,.control output{font-size:12px}.control output{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.control input{width:100%;min-width:0;margin:0;accent-color:var(--accent)}
.display-options,.theme-options{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin:8px 0}
.display-options button,.theme-options button{padding:4px 8px;font-size:12px}
button[aria-pressed=true]{color:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.theme-options label{font-size:12px}
#setting-color{width:28px;height:28px;padding:1px;cursor:pointer;border:1px solid var(--line);border-radius:5px;background:transparent}
.sample{padding:7px 0;border-bottom:1px solid var(--soft-line)}
.reset{margin-top:5px}
.native-mini #directory{top:var(--native-titlebar-height,0px);height:calc(100dvh - var(--native-titlebar-height,0px));width:min(280px,94vw)}
.native-mini dialog{background:transparent;box-shadow:none}
.native-mini dialog::backdrop{background:transparent}
.native-mini body.modal-open>.bar,.native-mini body.modal-open>#reader{visibility:hidden}
.native-mini #settings{position:fixed;inset:auto 0 0;margin:0 auto;width:100%;max-width:100%;max-height:min(90dvh,calc(100dvh - var(--native-titlebar-height,0px)));border:0;border-top:1px solid var(--line);border-radius:0;padding-bottom:env(safe-area-inset-bottom)}
html:not(.native-mini) dialog{background:linear-gradient(rgb(var(--panel-rgb) / var(--alpha)),rgb(var(--panel-rgb) / var(--alpha))),var(--web-floor)}
@media(max-width:759px){html:not(.native-mini) .shell{padding-block:4px}html:not(.native-mini) .bar button,html:not(.native-mini) #directory-list a,html:not(.native-mini) .shelf-toggle,html:not(.native-mini) .folio-tools a,html:not(.native-mini) .dismiss{min-height:44px}html:not(.native-mini) #directory-search{min-height:44px;font-size:16px}html:not(.native-mini) #sections a{padding-block:9px}}
</style>
</head>
<body>
<header class="bar dock"><div class="shell"><button id="directory-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="directory">☰ 目录</button><span id="current-label">BASE</span><button id="settings-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings">排版</button><button id="popup" type="button">小窗</button></div></header>
<main id="reader" aria-label="BASE 面谈稿"></main>
<dialog id="directory" aria-labelledby="directory-title">
<div class="sheet-top"><h2 id="directory-title">面谈目录</h2><button class="dismiss" type="button" data-close>关闭</button></div>
<div class="directory-filter"><input type="search" id="directory-search" aria-label="搜索题目" placeholder="自我介绍、AI、MORI…" autocomplete="off"><button id="directory-clear" type="button" aria-label="清空搜索" disabled>×</button></div>
<nav id="sections" aria-label="快速定位目录"></nav><p id="directory-count" role="status"></p>
<nav id="directory-list" aria-label="全部题目"></nav><p id="directory-empty" hidden>没有找到题目，试试其他关键词。</p>
</dialog>
<dialog id="settings" aria-labelledby="settings-title">
<div class="sheet-top"><h2 id="settings-title">阅读排版</h2><button class="dismiss" type="button" data-close>关闭</button></div>
<div class="sheet-scroll"><div class="sample" lang="ja"><p class="jp"><ruby>作品<rt>さくひん</rt></ruby>を<ruby>紹介<rt>しょうかい</rt></ruby>します。</p></div>
<div class="theme-options" role="group" aria-label="背景颜色"><button type="button" id="theme-dark">深色</button><button type="button" id="theme-light">白色</button><button type="button" id="theme-sage">灰绿</button><button type="button" id="theme-custom">自选</button><input type="color" id="setting-color" aria-label="自选背景颜色" value="#eee4cd"></div>
<div id="settings-controls"></div><div class="display-options"><button id="zh-button" type="button" aria-pressed="true">中文对照</button><button id="ruby-button" type="button" aria-pressed="true">日语假名</button></div>
<button class="reset" type="button" id="reset">恢复默认排版</button></div>
</dialog>
<script id="reader-data" type="application/json">{"sections":[{"id":"opening","label":"开场","kind":"flow","groups":[{"id":"opening","label":"问候和自我介绍","items":[{"id":"start-here","title":"开场先看对方怎么带","menuTitle":"面谈流程","page":"","blocks":[{"type":"note","ja":"","zh":"上线先打招呼。对方叫到你或请你介绍时，再讲自我介绍。对方先介绍成员或安排，听完回应一句。接下来按他的话走：请看作品就开作品；先提问就直接答；把话交给你再选一个想问的。"}]},{"id":"opening-1","title":"刚上线，先问候","menuTitle":"开场问候","page":"","blocks":[{"type":"speech","ja":"こんにちは。\u003cruby>本日\u003crt>ほんじつ\u003c/rt>\u003c/ruby>はお\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>をいただき、ありがとうございます。よろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"您好，谢谢两位今天抽时间。请多关照。"}]},{"id":"opening-2","title":"对方先问声音是否正常","menuTitle":"确认声音","page":"","blocks":[{"type":"speech","ja":"はい、\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>こえています。よろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"嗯，听得见。请多关照。"}]},{"id":"opening-3","title":"轮到你自我介绍","menuTitle":"自我介绍","page":"","blocks":[{"type":"note","ja":"","zh":"刚才已经互相问候过，就直接从学校和名字说起。"},{"type":"speech","ja":"\u003cruby>武蔵野美術大学\u003crt>むさしのびじゅつだいがく\u003c/rt>\u003c/ruby>\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>でデザイン\u003cruby>情報学\u003crt>じょうほうがく\u003c/rt>\u003c/ruby>を\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>んでいる、チョウ・シエと\u003cruby>申\u003crt>もう\u003c/rt>\u003c/ruby>します。\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>も\u003cruby>武蔵美\u003crt>むさび\u003c/rt>\u003c/ruby>で、グラフィックデザインを\u003cruby>中心\u003crt>ちゅうしん\u003c/rt>\u003c/ruby>に\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>びました。\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ってからは、\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>をしながらUI/UXの\u003cruby>勉強\u003crt>べんきょう\u003c/rt>\u003c/ruby>も\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めました。BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteでお\u003cruby>二人\u003crt>ふたり\u003c/rt>\u003c/ruby>のインタビューを\u003cruby>拝見\u003crt>はいけん\u003c/rt>\u003c/ruby>して、\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>こうしてお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しできるのを、すごく\u003cruby>楽\u003crt>たの\u003c/rt>\u003c/ruby>しみにしていました。どうぞよろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"我是 ZHANG ZIRUI，现在在武藏野美术大学大学院学设计信息学。本科也在武藏美，主要学平面设计。读研以后，我一边做研究，一边也开始学 UI/UX。我在 BASE 集团的官方 note 上读过两位的访谈，所以一直很期待今天能这样面对面聊聊。请多关照。"},{"type":"reply","ja":"はい、\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんが\u003cruby>参加\u003crt>さんか\u003c/rt>\u003c/ruby>されていた、PAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>したときの\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>です。\u003cruby>常連\u003crt>じょうれん\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>の\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いて、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>のページでそのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>だけを\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>できるようにした、というお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>が\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>もレコードを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すときはお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>から\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶので、よく\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"一篇是北村先生参与的访谈，讲团队当时为什么重新设计 PAY ID 的商品搜索。我记住的是，他们听到常客想在喜欢的店里找东西，就让买家可以在店铺页面里直接搜索这家店的商品。我挑唱片时也习惯先选店，读到那里特别有共鸣。","cue":"如果对方问「どの記事を読んでくださったんですか？」"},{"type":"reply","ja":"もう\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つは、\u003cruby>成原\u003crt>なりはら\u003c/rt>\u003c/ruby>さんが\u003cruby>参加\u003crt>さんか\u003c/rt>\u003c/ruby>されていた\u003cruby>新卒採用\u003crt>しんそつさいよう\u003c/rt>\u003c/ruby>の\u003cruby>座談会\u003crt>ざだんかい\u003c/rt>\u003c/ruby>です。\u003cruby>決算\u003crt>けっさん\u003c/rt>\u003c/ruby>\u003cruby>資料\u0 >、\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えますか。","zh":"谢谢，那我共享一下屏幕。能看见吗？"}]},{"id":"sharing-3","title":"在 P4 目录说今天分享哪两件作品","menuTitle":"P4 · 介绍两件作品","page":"","blocks":[{"type":"note","ja":"","zh":"如果对方已经指定作品或只给一件的时间，直接翻到那件。"},{"type":"speech","ja":"こちらが\u003cruby>目次\u003crt>もくじ\u003c/rt>\u003c/ruby>です。UI/UXとグラフィックデザインの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せています。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>は、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せているUI/UXの\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つ、MORIとTUCKを\u003cruby>簡単\u003crt>かんたん\u003c/rt>\u003c/ruby>にご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>します。","zh":"这是目录，里面有 UI/UX 和平面设计的作品。今天我想简单介绍排在前面的两件 UI/UX 作品，MORI 和 TUCK。"}]},{"id":"sharing-4","title":"如果对方已经看过作品集","menuTitle":"对方已经看过作品集","page":"","blocks":[{"type":"speech","ja":"もうご\u003cruby>覧\u003crt>らん\u003c/rt>\u003c/ruby>くださったんですね。ありがとうございます。もし\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になった\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>があれば、そこからお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しします。","zh":"原来您已经看过了，谢谢。如果有您想听的作品，我可以从那件讲起。"}]},{"id":"sharing-5","title":"如果对方说只够简单看一件","menuTitle":"MORI · 简短介绍","page":"","blocks":[{"type":"note","ja":"","zh":"直接打开P17。只讲一个设计选择。没法共享时也能单独讲。"},{"type":"speech","ja":"「MORI」は、ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するときの\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、クーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>って\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>って、\u003cruby>一着\u003crt>いっちゃく\u003c/rt>\u003c/ruby>だけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すと、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るのかって、すぐには\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりにくいんです。そこで、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、カードに\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>とポイント、それから\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すかどうか\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>められるようにしました。","zh":"MORI 是我为网购服装退货流程设计的 App 方案。比如用优惠券和积分买了两件衣服，只退一件时，很难一下算清能退多少。所以我把预计退回卡里的钱、返还的积分和退货运费都放在预约取件之前，让人看完再决定退不退。"}]},{"id":"sharing-6","title":"如果对方点名看 TUCK，打开 P34","menuTitle":"TUCK · 简短介绍","page":"","blocks":[{"type":"speech","ja":"「TUCK T10」は、\u003cruby>床\u003crt>ゆか\u003c/rt>\u003c/ruby>の\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>をアームで\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけるロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけるように\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んで、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>だけ「\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わりました」と\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たら、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>だったら「じゃあ、スリッパは？」と\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になります。そこで、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にはスリッパを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>して、\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だった\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりに、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せるようにしました。","zh":"TUCK T10 是带机械臂的扫地机器人 App 方案。比如我让它收拾地上的袜子和拖鞋，最后只收到袜子搬完的通知，我就会想「那拖鞋呢？」所以我在结果页把拖鞋放在前面，再给出它原先的位置和原定目的地，让人能自己去找。"}]}]},{"id":"main-presentation","label":"面谈主讲与备用作品","items":[{"id":"p17","title":"P17，先指出成品和退款预估","menuTitle":"MORI · P17 退货前先看退款","page":"P17","blocks":[{"type":"speech","ja":"\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>は「MORI」です。\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>をネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が、\u003cruby>一部\u003crt>いちぶ\u003c/rt>\u003c/ruby>だけ\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するときのアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、クーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってシャツとパンツを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>ったけれど、\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたシャツはサイズが\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わなかった。そこで、パンツは\u003cruby>手元\u003crt>てもと\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>して、シャツだけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>す\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"第一件叫 MORI，是我为网购买家只退部分衣服的情况设计的 App 方案。比如，有人用优惠券和积分一起买了衬衫和裤子，收到后发现衬衫尺码不合适。于是裤子留下，只退衬衫。"},{"type":"speech","ja":"このとき、シャツの\u003cruby>値段\u003crt>ねだん\u003c/rt>\u003c/ruby>だけ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ても、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るかは\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりません。\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったクーポンやポイントをどう\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けるかで\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わりますし、\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>もかかります。それで、こちらの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>では、カードにいくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>か、ポイントはいくつ\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るか、\u003cruby>送料\u003crt>そうりょう\u003c/rt>\u003c/ruby>はいくらかを、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようにしました。","zh":"这时光看衬衫的价格，很难知道究竟能退多少。两件衣服怎么分摊优惠券和积分，会影响退款额，寄回去还要付运费。所以在这张页面上，预约取件之前就能看到预计退回卡里多少钱、返还多少积分，以及退货运费是多少。"}]},{"id":"p21","title":"P21，包裹到店后在等什么","menuTitle":"MORI · P21 包裹到店后","page":"P21","blocks":[{"type":"speech","ja":"シャツを\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>した\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>は、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になることが\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>はもうお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いているのに、まだお\u003cruby>金\u003crt>かね\u003c/rt>\u003c/ruby>が\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ってこない。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>だったら「このまま\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っていていいのかな」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。そこで、この\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>には、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>がシャツを\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったことと、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>だということを\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>はいつまでに\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかも、ここで\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。","zh":"衬衫寄回去之后，关心的事情变了。包裹明明到店了，钱却还没退回来，换作是我就会想「我就这样等着可以吗？」所以在这张页面上，我把店铺已经收到衬衫、目前正在检查商品这两件事分开写了。下一次最晚什么时候会来消息，在这里也看得到。"}]},{"id":"p34","title":"P34，先指右边采用的方案","menuTitle":"TUCK · P34 收拾拖鞋的结果","page":"P34","blocks":[{"type":"speech","ja":"\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つ\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>は「TUCK T10」です。\u003cruby>床\u003crt>ゆか\u003c/rt>\u003c/ruby>にある\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>をアームで\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけてくれるロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、リビングで\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパが\u003cruby>床\u003crt>ゆか\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ていたら、アプリの\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>で\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、それぞれの\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>まで\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶように\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>みます。こちらはその\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>を\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>えたという\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>は\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たのに、スリッパの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>だけが\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いていません。","zh":"第二件叫 TUCK T10，是为带机械臂、能收拾地上小物的扫地机器人设计的 App。比如客厅地上放着袜子和拖鞋，我就在 App 的地图上选中它们，让机器人分别送到各自的位置。这是接下来的结果页。我收到了机器人搬完袜子的通知，拖鞋的结果却一直没传回来。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>だったら、ここで\u003cruby>一番\u003crt>いちばん\u003c/rt>\u003c/ruby>\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいのは「じゃあ、スリッパはどこにあるんだろう」ということです。\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>だと「\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>完了\u003crt>かんりょう\u003c/rt>\u003c/ruby>、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>要確認\u003crt>ようかくにん\u003c/rt>\u003c/ruby>」と\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>が\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>るんです。そこで\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>では、\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>は\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>の\u003cruby>一行\u003crt>いちぎょう\u003c/rt>\u003c/ruby>にまとめて、そのすぐ\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>に、\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめに\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>くスリッパを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"换作是我，这时最想知道的就是「那拖鞋现在在哪儿呢？」看左边这版，先注意到的是「一件完成，一件待确认」。所以到了右边这版，我把件数收在最上面的一行，下面突出显示需要去找的拖鞋。"}]},{"id":"p39","title":"P39，沿两处查找线索讲到最后的记录","menuTitle":"TUCK · P39 如何找回拖鞋","page":"P39","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、スリッパをどこから\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せばいいかです。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>は\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりませんが、ロボットが\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたのはソファの\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>で、\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だったのは\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>です。この\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>か\u003cruby>所\u003crt>しょ\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれば、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しに\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>けます。","zh":"接下来，该从哪里找拖鞋呢？现在还不知道它在哪儿，但机器人最初是在沙发前发现它的，原本打算送到放鞋的地方。知道了这两处，人就有地方去找了。"},{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたら、「\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>にあった」と\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>できます。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたのは\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>なので、「ロボットからの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>」は「\u003cruby>未\u003crt>み\u003c/rt>\u003c/ruby>\u003cruby>受信\u003crt>じゅしん\u003c/rt>\u003c/ruby>」のままです。\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>から\u003cruby>見返\u003crt>みかえ\u003c/rt>\u003c/ruby>したときにも、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したのかが\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるようにしました。","zh":"比如我在放鞋的地方找到了，就能记下「在预定位置找到」。是我自己找到的，所以「机器人传回的结果」这一栏仍然是「未收到」。这样以后再翻回来看，也能知道当时是谁确认的。"}]},{"id":"p77","title":"P77，四季の花綴り","menuTitle":"平面作品 · P77 四季の花綴り","page":"P77","blocks":[{"type":"speech","ja":"グラフィックの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>でしたら、\u003cruby>卒業制作\u003crt>そつぎょうせいさく\u003c/rt>\u003c/ruby>の「\u003cruby>四季\u003crt>しき\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>\u003cruby>綴\u003crt>つづ\u003c/rt>\u003c/ruby>り」をお\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せします。\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>を\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>にして、\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>と\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせた\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>です。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば\u003cruby>春\u003crt>はる\u003c/rt>\u003c/ruby>の\u003cruby>巻\u003crt>まき\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>くと、\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てくる\u003cruby>黄色\u003crt>きいろ\u003c/rt>\u003c/ruby>を、すぐ\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>びらで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようにしました。\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>から\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>を\u003cruby>想像\u003crt>そうぞう\u003c/rt>\u003c/ruby>して、ふと\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると\u003cruby>本物\u003crt>ほんもの\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>がある。そういう\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>ができたらと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>って\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"如果想看平面设计，我想给您看毕业作品《四季の花綴り》。我自己把四季的花做成压花，再和汉诗编成了四册书。比如翻开春天那册，诗里写到的黄色，在旁边那片花瓣上就能看到。我希望读者先从文字想象那个季节，再往旁边一看，真的有一朵花在那儿。"}]},{"id":"tuck-8","title":"介绍说完","menuTitle":"结束作品介绍","page":"","blocks":[{"type":"speech","ja":"ご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>したかったのは\u003cruby>以上\u003crt>いじょう\u003c/rt>\u003c/ruby>です。ありがとうございます。","zh":"我想介绍的作品就到这里，谢谢。"}]}]},{"id":"folio-intro-pages","label":"开场与目录｜P1–6","items":[{"id":"folio-p1","title":"封面｜接到介绍作品集的邀请后","page":"P1","blocks":[{"type":"speech","ja":"こちらが\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>のポートフォリオです。","zh":"这是我这次带来的作品集。"}]},{"id":"folio-p2","title":"自我介绍页","page":"P2","blocks":[{"type":"speech","ja":"こちらは\u003cruby>自己\u003crt>じこ\u003c/rt>\u003c/ruby>\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>のページです。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>んでいるUI/UXやグラフィック、\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>のデザインを\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>しています。\u003cruby>右側\u003crt>みぎがわ\u003c/rt>\u003c/ruby>には、\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>でよく\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うツールを\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せています。","zh":"这是我的自我介绍页。上面介绍了我平时做的 UI/UX、平面和书籍设计，右边是我做作品时常用的工具。"}]},{"id":"folio-p3","title":"学习和工作经历","page":"P3","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、これまでの\u003cruby>経歴\u003crt>けいれき\u003c/rt>\u003c/ruby>をまとめたページです。\u003cruby>左側\u003crt>ひだりがわ\u003c/rt>\u003c/ruby>に\u003cruby>大学\u003crt>だいがく\u003c/rt>\u003c/ruby>と\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>で\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>んできたことや\u003cruby>受賞\u003crt>じゅしょう\u003c/rt>\u003c/ruby>\u003cruby>歴\u003crt>れき\u003c/rt>\u003c/ruby>を、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>に\u003cruby>企業\u003crt>きぎょう\u003c/rt>\u003c/ruby>のレポート\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>など、\u003cruby>学外\u003crt>がくがい\u003c/rt>\u003c/ruby>で\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>んできた\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せています。","zh":"接下来这页是我的学习和工作经历。左边是本科和研究生阶段学的专业以及获奖经历，中间是我在校外做过的工作，比如为企业报告做设计。"}]},{"id":"folio-p4","title":"目录","page":"P4","blocks":[{"type":"note","ja":"","zh":"分享时从这一页直接翻到 P7 的 MORI。P5、P6 是目录续页，有需要再打开。"},{"type":"speech","ja":"こちらが\u003cruby>目次\u003crt>もくじ\u003c/rt>\u003c/ruby>です。\u003cruby>前半\u003crt>ぜんはん\u003c/rt>\u003c/ruby>はUI/UXの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>で、\u003cruby>後半\u003crt>こうはん\u003c/rt>\u003c/ruby>には\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>や\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>、3Dの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せています。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>は、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つ、MORIとTUCK T10を\u003cruby>簡単\u003crt>かんたん\u003c/rt>\u003c/ruby>にご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>します。","zh":"这是目录。前半是 UI/UX 作品，后半有书籍、摄影和 3D 作品。今天我想简单介绍最前面的两件，MORI 和 TUCK T10。"}]},{"id":"folio-p5","title":"目录 04–06｜AROUND、亚克力作品集、四季の花綴り","page":"P5","blocks":[{"type":"note","ja":"","zh":"目录续页。现场可以直接翻到 P7；需要介绍这页时再用下面这句。"},{"type":"speech","ja":"このページには、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>外\u003crt>そと\u003c/rt>\u003c/ruby>から\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>こえる\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>を\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>える「AROUND」と、\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>でパーツが\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>く\u003cruby>作品集\u003crt>さくひんしゅう\u003c/rt>\u003c/ruby>、それから\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>と\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>を\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>にまとめた\u003cruby>卒業制作\u003crt>そつぎょうせいさく\u003c/rt>\u003c/ruby>を\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せています。","zh":"这一页有三件作品：提示车外声音的 AROUND、封面里的零件会动的作品集，以及把压花和汉诗编成四册书的毕业作品。"}],"skipInPresentation":true,"menuTitle":"可略过 · 目录 04–06｜AROUND、亚克力作品集、四季の花綴り"},{"id":"folio-p6","title":"目录 07–10｜LING、隷書美学、东京夜景摄影集、空中小町","page":"P6","blocks":[{"type":"note","ja":"","zh":"目录续页。现场可以直接翻到 P7；需要介绍这页时再用下面这句。"},{"type":"speech","ja":"こちらは、みんなで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>った\u003cruby>雑誌\u003crt>ざっし\u003c/rt>\u003c/ruby>「LING」、\u003cruby>隷書\u003crt>れいしょ\u003c/rt>\u003c/ruby>の\u003cruby>字\u003crt>じ\u003c/rt>\u003c/ruby>\u003cruby>形\u003crt>けい\u003c/rt>\u003c/ruby>を\u003cruby>扱\u003crt>あつか\u003c/rt>\u003c/ruby>った\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>、\u003cruby>東京\u003crt>とうきょう\u003c/rt>\u003c/ruby>の\u003cruby>夜\u003crt>よる\u003c/rt>\u003c/ruby>を\u003cruby>撮\u003crt>と\u003c/rt>\u003c/ruby>った\u003cruby>写真集\u003crt>しゃしんしゅう\u003c/rt>\u003c/ruby>、そして\u003cruby>浮島\u003crt>うきしま\u003c/rt>\u003c/ruby>を\u003cruby>橋\u003crt>はし\u003c/rt>\u003c/ruby>でつないだ3Dの\u003cruby>街\u003crt>まち\u003c/rt>\u003c/ruby>「\u003cruby>空中\u003crt>くうちゅう\u003c/rt>\u003c/ruby>\u003cruby>小町\u003crt>こまち\u003c/rt>\u003c/ruby>」です。","zh":"这一页是一起制作的杂志 LING、研究隶书字形的书、记录东京夜色的摄影集，以及用桥连起浮岛的 3D 小镇《空中小町》。"}],"skipInPresentation":true,"menuTitle":"可略过 · 目录 07–10｜LING、隷書美学、东京夜景摄影集、空中小町"}],"shelf":"portfolio-pages"},{"id":"folio-intro-mori","label":"MORI｜P7–26","items":[{"id":"folio-p7","title":"MORI 封面｜购物 App 内的服装退货流程","page":"P7","blocks":[{"type":"speech","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>『MORI』では、\u003cruby>架空\u003crt>かくう\u003c/rt>\u003c/ruby>のショッピングアプリで\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するときの\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れをデザインしました。\u003cruby>私自身\u003crt>わたしじしん\u003c/rt>\u003c/ruby>、ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をするのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、それをきっかけにFigmaで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"第一件作品叫 MORI，我为一款假想的购物 App 设计了服装退货流程。我自己很喜欢网购，就以此为契机，用 Figma 做了这个作品。"}]},{"id":"folio-p8","title":"从现有退货说明里发现的问题","page":"P8","blocks":[{"type":"speech","ja":"まず、ユニクロとZARAの\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べました。\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>のことは\u003cruby>購入履歴\u003crt>こうにゅうりれき\u003c/rt>\u003c/ruby>やメール、お\u003cruby>金\u003crt>かね\u003c/rt>\u003c/ruby>が\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ったかどうかはカードの\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>と、\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれていたんです。","zh":"我先比较了优衣库和 ZARA 的退货说明。查包裹要看购物记录或邮件，确认钱有没有回来又要看银行卡账单，信息分散在好几个地方。"}]},{"id":"folio-p9","title":"平时会网购、很少退货的人","page":"P9","blocks":[{"type":"speech","ja":"ここで\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>したのは、\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>帰\u003crt>かえ\u003c/rt>\u003c/ruby>って、スマホでよく\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>です。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>の\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>には\u003cruby>慣\u003crt>な\u003c/rt>\u003c/ruby>れていても、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>はめったにしないので、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>から\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めればいいか\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>う\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"我设想的人下班后经常用手机买衣服。购物和操作手机都很熟练，只是很少退货，一旦要退就不知道从哪一步开始。"}]},{"id":"folio-p10","title":"买了两件，只想退衬衫","page":"P10","blocks":[{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、シャツとパンツを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>ってみたら、シャツだけサイズが\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わなかったとします。\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>にクーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っているので、シャツの\u003cruby>値段\u003crt>ねだん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ただけでは、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないんですね。","zh":"比如她一起买了衬衫和裤子，只有衬衫的尺码不合适。整单用过优惠券和积分，只看衬衫的标价，算不出这次会退多少。"}]},{"id":"folio-p11","title":"沿着买家要做的事安排顺序","page":"P11","blocks":[{"type":"speech","ja":"\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れを\u003cruby>順\u003crt>じゅん\u003c/rt>\u003c/ruby>にたどると、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は「どこから\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するの？」で、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあとは「もう\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたかな？」に\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。それで、\u003cruby>入口\u003crt>いりぐち\u003c/rt>\u003c/ruby>はその\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>の\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いて、\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあとは、いつ\u003cruby>更新\u003crt>こうしん\u003c/rt>\u003c/ruby>された\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>かも\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すことにしました。","zh":"沿着她的过程走，最初想的是「从哪儿办退货」，寄出后就变成「衣服到了吗」。所以我把入口设在这件衣服的订单详情里，寄出后也让她看到信息是什么时候更新的。"}]},{"id":"folio-p12","title":"谁在处理，找谁确认","page":"P12","blocks":[{"type":"speech","ja":"で、\u003cruby>裏側\u003crt>うらがわ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てみると、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>を\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶのは\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>するのはお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>、\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>を\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>に\u003cruby>反映\u003crt>はんえい\u003c/rt>\u003c/ruby>するのはカード\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>です。\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きの\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>ったときは、まずお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>できる\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れにしました。","zh":"再看背后，承运商负责运包裹，店家检查衣服，最后由卡公司把退款反映到账单。中间出了问题，买家可以先找店家确认。"}]},{"id":"folio-p13","title":"什么时候才改变状态","page":"P13","blocks":[{"type":"speech","ja":"\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>かを\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けたうえで、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>の\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたら\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えるかも\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めました。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>が\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>き\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>けたら「\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>」、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したら、そこで\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>\u003cruby>額\u003crt>がく\u003c/rt>\u003c/ruby>が\u003cruby>確定\u003crt>かくてい\u003c/rt>\u003c/ruby>します。","zh":"分清各方的责任之后，我又定了界面何时更新。比如承运商揽件后显示「退回途中」，等店家确认商品，退款金额才确定。"}]},{"id":"folio-p14","title":"为什么选中间的 B 案","page":"P14","blocks":[{"type":"speech","ja":"\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>がお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>着\u003crt>つ\u003c/rt>\u003c/ruby>いたところで、\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つの\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せ\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べました。\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>だと\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことだけ、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>だと「\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>」が\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ります。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>なら「ちゃんと\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いた。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ている」と、\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるので、この\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。","zh":"我比较了包裹到店时的三种呈现。左边只告诉人已经送到，右边最先看到的是「正在检查商品」。中间一眼就能看出「包裹到了，现在是店家在检查」，所以我选了它。"}]},{"id":"folio-p15","title":"图表里的数字怎么读","page":"P15","blocks":[{"type":"speech","ja":"このグラフは、\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つの\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>をどう\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたものです。\u003cruby>各案\u003crt>かくあん\u003c/rt>\u003c/ruby>に\u003cruby>50件\u003crt>ごじゅっけん\u003c/rt>\u003c/ruby>ずつ\u003cruby>仮\u003crt>かり\u003c/rt>\u003c/ruby>の\u003cruby>回答\u003crt>かいとう\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いて、\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きに\u003cruby>安心\u003crt>あんしん\u003c/rt>\u003c/ruby>できそうか、またこのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>いたいかを、\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>に\u003cruby>集計\u003crt>しゅうけい\u003c/rt>\u003c/ruby>しています。","zh":"这张图是我设计的比较方法。每案用了 50 条假设回答，把「是否能安心办理」和「是否愿意再来这家店购物」分开统计。"}]},{"id":"folio-p16","title":"界面的配色和图标","page":"P16","blocks":[{"type":"speech","ja":"\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>は\u003cruby>青\u003crt>あお\u003c/rt>\u003c/ruby>を\u003cruby>基調\u003crt>きちょう\u003c/rt>\u003c/ruby>にしています。\u003cruby>左下\u003crt>ひだりした\u003c/rt>\u003c/ruby>のアイコンは、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>箱\u003crt>はこ\u003c/rt>\u003c/ruby>や\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>状\u003crt>じょう\u003c/rt>\u003c/ruby>をもとに\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"退货界面以蓝色为主。左下角的图标取自寄回衣服时用到的包装箱和运单。"}]},{"id":"folio-p17","title":"预约取件之前先看到预计退款","page":"P17","blocks":[{"type":"speech","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>では、\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>からシャツを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、サイズが\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わなかったことを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びます。そこで、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、カードに\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>見込\u003crt>みこ\u003c/rt>\u003c/ruby>み\u003cruby>額\u003crt>がく\u003c/rt>\u003c/ruby>と、\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るポイントを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようにしました。\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>を\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>ってから、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するか\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>められます。","zh":"看实际界面，从左往右先选衬衫，再选尺码不合适。预约取件前就能分开看到预计退回卡里的钱和返还的积分，知道金额后再决定退不退。"}]},{"id":"folio-p18","title":"为什么卡里退 4,800 日元，积分另外退","page":"P18","blocks":[{"type":"speech","ja":"シャツは\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>の\u003cruby>合計額\u003crt>ごうけいがく\u003c/rt>\u003c/ruby>の\u003cruby>6割\u003crt>ろくわり\u003c/rt>\u003c/ruby>なので、クーポンもポイントも\u003cruby>6割\u003crt>ろくわり\u003c/rt>\u003c/ruby>をシャツの\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>にしました。\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>くと、カードには\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>、ポイントは\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>に\u003cruby>600ポイント\u003crt>ろっぴゃくぽいんと\u003c/rt>\u003c/ruby>\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>見込\u003crt>みこ\u003c/rt>\u003c/ruby>みです。","zh":"衬衫占两件衣服总价的六成，所以优惠券和积分也各按六成分给衬衫。再扣除退货运费，预计退到卡里 4,800 日元，另返 600 积分。"}]},{"id":"folio-p19","title":"选取件时间时再确认费用","page":"P19","blocks":[{"type":"speech","ja":"そこまで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>すると\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めたら、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>の\u003cruby>日時\u003crt>にちじ\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びます。この\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にも\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>と\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いたので、\u003cruby>予約\u003crt>よやく\u003c/rt>\u003c/ruby>する\u003cruby>直前\u003crt>ちょくぜん\u003c/rt>\u003c/ruby>に、いくらかかって、どこに\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りに\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかを\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめられます。","zh":"看完并决定退货后，再选择上门取件日期和时段。这里也放了退货运费和取件地址，预约前能再核对一次费用和地点。"}]},{"id":"folio-p20","title":"寄出后，先看这条记录是谁更新的","page":"P20","blocks":[{"type":"speech","ja":"\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>を\u003cruby>渡\u003crt>わた\u003c/rt>\u003c/ruby>したあとは、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>がこう\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。「ショップへ\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>かっています」のすぐ\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>に、\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>が\u003cruby>更新\u003crt>こうしん\u003c/rt>\u003c/ruby>した\u003cruby>時刻\u003crt>じこく\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>して、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>着\u003crt>つ\u003c/rt>\u003c/ruby>いたらここで\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせる、と\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えています。","zh":"把包裹交出去后，就变成这个界面。「正在运往店家」的下面有承运商更新时间，同时告诉买家，下次到店时可以在这里看到通知。"}]},{"id":"folio-p21","title":"这一步该等，还是该联系店家","page":"P21","blocks":[{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>着\u003crt>つ\u003c/rt>\u003c/ruby>いてからは、\u003cruby>二通\u003crt>ふたとお\u003c/rt>\u003c/ruby>りあります。\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>なので、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>をいつまでに\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すかを\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>します。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>のようにタグの\u003cruby>同梱\u003crt>どうこん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できないときは、タグを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が、\u003cruby>梱包\u003crt>こんぽう\u003c/rt>\u003c/ruby>したときの\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>を\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えられるように、\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>ボタンを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>します。","zh":"到店以后分两种情况。左边是店家正在检查，显示下次最晚何时通知。右边是店家没确认到吊牌，买家如果确实一起寄了，可以点按钮说明当时如何打包。"}]},{"id":"folio-p22","title":"店家办理退款和账单入账之间的时间差","page":"P22","blocks":[{"type":"speech","ja":"こちらは\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きが\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>んだ\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。この\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>だと、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きしたのは\u003cruby>9月\u003crt>くがつ\u003c/rt>\u003c/ruby>\u003cruby>19日\u003crt>じゅうくにち\u003c/rt>\u003c/ruby>で、\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>る\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>は\u003cruby>30日\u003crt>さんじゅうにち\u003c/rt>\u003c/ruby>ごろです。\u003cruby>日付\u003crt>ひづけ\u003c/rt>\u003c/ruby>を\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つに\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けると、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>カードを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ても\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>っていない\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。","zh":"这是店家办完退款后的界面。这里的例子是 9 月 19 日由店家办理，预计 30 日左右反映在账单上。把两个日期分开，人就能明白为什么现在去查可能还看不到。"}]},{"id":"folio-p23","title":"查不到物流和查不到退款，要做的事不同","page":"P23","blocks":[{"type":"speech","ja":"うまく\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できない\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>も\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>は\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しい\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>が\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>れなかったときで、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>れた\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>を\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>して、もう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>更新\u003crt>こうしん\u003c/rt>\u003c/ruby>できます。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>は\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>のほうで、\u003cruby>反映\u003crt>はんえい\u003c/rt>\u003c/ruby>の\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>を\u003cruby>過\u003crt>す\u003c/rt>\u003c/ruby>ぎても\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>に\u003cruby>見当\u003crt>みあ\u003c/rt>\u003c/ruby>たらなければ、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できます。","zh":"我也考虑了查不到的情况。左边是没取到最新物流，保留上次的记录，还能重新刷新。右边是退款，过了预计时间仍没在账单上找到，就可以请店家核查。"}]},{"id":"folio-p24","title":"发起咨询时自动带上记录","page":"P24","blocks":[{"type":"speech","ja":"そのまま\u003cruby>問\u003crt>と\u003c/rt>\u003c/ruby>い\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせに\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>むと、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>受付\u003crt>うけつけ\u003c/rt>\u003c/ruby>\u003cruby>番号\u003crt>ばんごう\u003c/rt>\u003c/ruby>と\u003cruby>直近\u003crt>ちょっきん\u003c/rt>\u003c/ruby>の\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>が\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>から\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>いてきます。あとは「\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたいか」だけ\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いて、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で、\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>る\u003cruby>内容\u003crt>ないよう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てから\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>れます。","zh":"接着进入咨询时，退货受理号和最近的记录已经附好了。买家只要写自己想确认什么，在中间这个界面看清一并发送的内容，就能发给店家。"}]},{"id":"folio-p25","title":"用同一个人对照设计前后的目标","page":"P25","blocks":[{"type":"speech","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ると、シャツを\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあと、\u003cruby>何度\u003crt>なんど\u003c/rt>\u003c/ruby>も\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたくなるかもしれません。\u003cruby>目指\u003crt>めざ\u003c/rt>\u003c/ruby>したのは、\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>れば「\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しているから、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>とう」と\u003cruby>判断\u003crt>はんだん\u003c/rt>\u003c/ruby>できる\u003cruby>状態\u003crt>じょうたい\u003c/rt>\u003c/ruby>です。","zh":"回到最初设定的买家，她寄出衬衫后，可能会反复查看退货进度。我希望她看一次就能判断「现在店家在检查，我等下次通知就好」。"}]},{"id":"folio-p26","title":"用最后一张主视觉收住","page":"P26","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>の\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>にスマホが\u003cruby>浮\u003crt>う\u003c/rt>\u003c/ruby>かぶビジュアルで\u003cruby>締\u003crt>し\u003c/rt>\u003c/ruby>めています。","zh":"最后用手机浮在手掌上方的主视觉来结束。"}]}],"shelf":"portfolio-pages"},{"id":"folio-intro-tuck","label":"TUCK T10｜P27–42","items":[{"id":"folio-p27","title":"TUCK T10 封面｜扫地机器人的 App 提案","page":"P27","blocks":[{"type":"speech","ja":"\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>いて、TUCK T10という、アームで\u003cruby>床\u003crt>ゆか\u003c/rt>\u003c/ruby>の\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>を\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけるロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>にはFigmaと、HTML、CSS、JavaScriptを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いました。","zh":"接下来是 TUCK T10，一款为能用机械臂收拾地面小物的扫地机器人设想的 App。制作时用了 Figma、HTML、CSS 和 JavaScript。"}]},{"id":"folio-p28","title":"为什么机器人要先移开东西","page":"P28","blocks":[{"type":"speech","ja":"そもそも、\u003cruby>床\u003crt>ゆか\u003c/rt>\u003c/ruby>に\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>があると、\u003cruby>避\u003crt>よ\u003c/rt>\u003c/ruby>けたところに\u003cruby>掃除\u003crt>そうじ\u003c/rt>\u003c/ruby>\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>しができたり、コードを\u003cruby>巻\u003crt>ま\u003c/rt>\u003c/ruby>き\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>んで\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>まったりします。そこで、\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べる\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>は\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>にどかして、\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>った\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>は\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる、という\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"地面有杂物时，机器人绕开就会漏扫，卷入电线也可能停下来。我设定的场景是能搬的先移开，剩下需要确认的再由人处理。"}]},{"id":"folio-p29","title":"聚焦「在地图上选物品」这一种操作","page":"P29","blocks":[{"type":"speech","ja":"\u003cruby>参考\u003crt>さんこう\u003c/rt>\u003c/ruby>にしたSaros Z70には、\u003cruby>自動\u003crt>じどう\u003c/rt>\u003c/ruby>で\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づける\u003cruby>方法\u003crt>ほうほう\u003c/rt>\u003c/ruby>や\u003cruby>遠隔操作\u003crt>えんかくそうさ\u003c/rt>\u003c/ruby>もあります。その\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>上\u003crt>あ\u003c/rt>\u003c/ruby>げたのは、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の「\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>で\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶ」\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>です。\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>んでほしい\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだあと、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>まで\u003cruby>追\u003crt>お\u003c/rt>\u003c/ruby>える\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"参考产品 Saros Z70 也支持自动整理和远程操控。我选了中间的「在地图上选择」，从人自己决定搬哪件东西，一直设计到事后确认。"}]},{"id":"folio-p30","title":"操作指南里的限制怎样影响界面","page":"P30","blocks":[{"type":"speech","ja":"\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>ガイドを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>むと、\u003cruby>重\u003crt>おも\u003c/rt>\u003c/ruby>さによって\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ち\u003cruby>上\u003crt>あ\u003c/rt>\u003c/ruby>げられなかったり、\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>に\u003cruby>段差\u003crt>だんさ\u003c/rt>\u003c/ruby>があると、\u003cruby>手前\u003crt>てまえ\u003c/rt>\u003c/ruby>で\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>下\u003crt>お\u003c/rt>\u003c/ruby>ろしたりするんです。なので、\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>が\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わっても、\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>が\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>どおりに\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたとは\u003cruby>限\u003crt>かぎ\u003c/rt>\u003c/ruby>らない。そこをアプリで\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えようと\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"操作指南里写到，物品太重可能拿不起来，途中有台阶也可能提前放下。所以整项工作结束，并不代表每件物品都到达了预定位置。这就是我想在 App 上区分的两件事。"}]},{"id":"folio-p31","title":"让袜子和拖鞋走一遍流程","page":"P31","blocks":[{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、リビングの\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、ロボットに\u003cruby>任\u003crt>まか\u003c/rt>\u003c/ruby>せたとします。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>は\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったと\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるけど、スリッパだけ\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>かない。このあと、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がどうやってスリッパの\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>き\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるかまでを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"比如在客厅选了袜子和拖鞋交给机器人。袜子已经收到搬运完成通知，只有拖鞋的结果没回来。我把人后面该怎么确认，也放在同一个场景里考虑。"}]},{"id":"folio-p32","title":"使用者的疑问会随时间改变","page":"P32","blocks":[{"type":"speech","ja":"\u003cruby>任\u003crt>まか\u003c/rt>\u003c/ruby>せる\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>は「どこに\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>かれるの？」、\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>き\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すまでは「ちゃんと\u003cruby>指示\u003crt>しじ\u003c/rt>\u003c/ruby>は\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いた？」、\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったら「どれを\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>に\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>けばいい？」ですよね。この\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つで、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すものを\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けました。","zh":"开始前想知道「要放到哪里」，动起来之前想知道「指令收到了吗」，结束后则是「我需要去看的是哪件」。我按这三个时刻来定画面分别要给什么信息。"}]},{"id":"folio-p33","title":"人、App 和机器人各自做什么","page":"P33","blocks":[{"type":"speech","ja":"この\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>の\u003cruby>矢印\u003crt>やじるし\u003c/rt>\u003c/ruby>は、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>から\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>に\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>が\u003cruby>渡\u003crt>わた\u003c/rt>\u003c/ruby>るかを\u003cruby>表\u003crt>あらわ\u003c/rt>\u003c/ruby>しています。\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶと、アプリが\u003cruby>指示\u003crt>しじ\u003c/rt>\u003c/ruby>を\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り、ロボットがつかんだり\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>んだりした\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>は、\u003cruby>逆向\u003crt>ぎゃくむ\u003c/rt>\u003c/ruby>きにアプリへ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>ってきます。","zh":"图里的箭头表示信息从谁传给谁。人选中物品后由 App 发出指令，机器人抓取、搬运等动作的状态则沿相反方向返回 App。"}]},{"id":"folio-p34","title":"为什么把没有结果的拖鞋放到最前面","page":"P34","blocks":[{"type":"speech","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>ったのが、\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>のように\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>を\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きく\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すか、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>のように\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すかです。「\u003cruby>要確認\u003crt>ようかくにん\u003c/rt>\u003c/ruby>が\u003cruby>1点\u003crt>いってん\u003c/rt>\u003c/ruby>」だけだと、\u003cruby>結局\u003crt>けっきょく\u003c/rt>\u003c/ruby>どれかを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しますよね。そこで、スリッパと「\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>する」ボタンを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>して、\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>は\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>の\u003cruby>一行\u003crt>いちぎょう\u003c/rt>\u003c/ruby>に\u003cruby>収\u003crt>おさ\u003c/rt>\u003c/ruby>めました。","zh":"做结果页时，我比较了左边突出件数和右边优先显示物品两案。只知道「有一件待确认」，还得继续找是哪件，所以先显示拖鞋和「确认」按钮，总数留在上方一行。"}]},{"id":"folio-p35","title":"从选物品到记录整理结果","page":"P35","blocks":[{"type":"speech","ja":"ホームから\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>へたどると、\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づける\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、ロボットの\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れです。\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わった\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>は\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>み、\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>まった\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>や\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>かなかった\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>は、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめに\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>きます。","zh":"从主页向右，依次是选要整理的物品、看机器人的动作、确认结果。搬完的物品进入记录，中途停止或没收到结果的物品则由人去现场确认。"}]},{"id":"folio-p36","title":"地图上可选和不可选的物品","page":"P36","blocks":[{"type":"speech","ja":"\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>を\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>はこの\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>です。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶと、\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>に「\u003cruby>布\u003crt>ぬの\u003c/rt>\u003c/ruby>\u003cruby>類\u003crt>るい\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>へ」と\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。\u003cruby>一方\u003crt>いっぽう\u003c/rt>\u003c/ruby>、この「？」は\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>の\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>か\u003cruby>判別\u003crt>はんべつ\u003c/rt>\u003c/ruby>できていないので、\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づける\u003cruby>対象\u003crt>たいしょう\u003c/rt>\u003c/ruby>には\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>べないようにしました。","zh":"逐步看操作，先从地图开始。选袜子以后，下面会显示「放到布类收纳处」。而问号表示没能辨认是什么，这种物品不能被选进整理任务。"}]},{"id":"folio-p37","title":"收到指令和实际开始搬运的区别","page":"P37","blocks":[{"type":"speech","ja":"\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>から\u003cruby>指示\u003crt>しじ\u003c/rt>\u003c/ruby>を\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ると、まずロボットの\u003cruby>返事\u003crt>へんじ\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>ちます。「\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けた」という\u003cruby>返事\u003crt>へんじ\u003c/rt>\u003c/ruby>のあと、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>き\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めた\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせが\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いて、\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を「\u003cruby>実行\u003crt>じっこう\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>」に\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>替\u003crt>か\u003c/rt>\u003c/ruby>えます。","zh":"从地图发送指令后，界面先等待机器人回复。收到「已接收」以后，还要等实际开始动作的通知到了，才会切换成「执行中」。"}]},{"id":"folio-p38","title":"中断和没收到结果是两种情况","page":"P38","blocks":[{"type":"speech","ja":"\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>は、スリッパを\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>まったと\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かっている\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>です。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>は\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いていないので、どこまで\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べたかはまだ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりません。","zh":"中间是已经知道拖鞋在搬运途中停下的情况。右边是结果通知没收到，所以还不知道拖鞋究竟搬到了哪里。"}]},{"id":"folio-p39","title":"人去哪里找，找到后怎么记","page":"P39","blocks":[{"type":"speech","ja":"じゃあ、どこを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せばいいか。この\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>では、\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>していた\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にスリッパが\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つかったソファの\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>を\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>します。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたら、「\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>にあった」と\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>できます。あとから\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ても、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたことだと\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。","zh":"那该去哪里找？这里给出原定的鞋子收纳处，以及最初发现拖鞋的沙发前。人如果自己在预定位置找到，就能记录「在预定位置」，之后回看也知道这是本人确认的。"}]},{"id":"folio-p40","title":"清扫和底座保养也放回日常使用里","page":"P40","blocks":[{"type":"speech","ja":"\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけ\u003cruby>以外\u003crt>いがい\u003c/rt>\u003c/ruby>には、\u003cruby>掃除\u003crt>そうじ\u003c/rt>\u003c/ruby>とドックのお\u003cruby>手入\u003crt>てい\u003c/rt>\u003c/ruby>れもあります。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、タンクの\u003cruby>水\u003crt>みず\u003c/rt>\u003c/ruby>は\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れ\u003cruby>替\u003crt>か\u003c/rt>\u003c/ruby>えるので、アプリでは\u003cruby>水\u003crt>みず\u003c/rt>\u003c/ruby>の\u003cruby>状態\u003crt>じょうたい\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できます。モップの\u003cruby>洗浄\u003crt>せんじょう\u003c/rt>\u003c/ruby>や\u003cruby>乾燥\u003crt>かんそう\u003c/rt>\u003c/ruby>は、ここから\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>められます。","zh":"整理小物之外，日常还有清扫和底座保养。比如水箱要由人加水、排水，所以 App 显示水箱状态。拖布清洗和烘干则可以在这里启动。"}]},{"id":"folio-p41","title":"品牌符号也来自「把物品归位」","page":"P41","blocks":[{"type":"speech","ja":"ロゴの\u003cruby>横\u003crt>よこ\u003c/rt>\u003c/ruby>の\u003cruby>小\u003crt>ちい\u003c/rt>\u003c/ruby>さなマークも、\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づける\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きから\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っています。\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>の\u003cruby>枠\u003crt>わく\u003c/rt>\u003c/ruby>が\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>で、\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>のひし\u003cruby>形\u003crt>がた\u003c/rt>\u003c/ruby>が、そこに\u003cruby>収\u003crt>おさ\u003c/rt>\u003c/ruby>まる\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>です。","zh":"标志旁边的小符号也来自收纳动作。下面的框代表放置位置，中间的菱形代表归位的小物。"}]},{"id":"folio-p42","title":"用可点击原型试暂停这一步","page":"P42","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に、\u003cruby>一時停止\u003crt>いちじていし\u003c/rt>\u003c/ruby>のところだけ、ブラウザーで\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>して\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>せるようにしました。\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>すと、いったんボタンが\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えなくなります。\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>したという\u003cruby>模擬\u003crt>もぎ\u003c/rt>\u003c/ruby>\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>くと、「\u003cruby>再開\u003crt>さいかい\u003c/rt>\u003c/ruby>する」に\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。\u003cruby>指示\u003crt>しじ\u003c/rt>\u003c/ruby>を\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>度\u003crt>ど\u003c/rt>\u003c/ruby>\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>らずに\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>むかを、この\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>替\u003crt>か\u003c/rt>\u003c/ruby>わりで\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめました。","zh":"最后，我把暂停这段做成了浏览器里可以点击的原型。按下后按钮先变成不可点，等收到模拟的停止通知，再切换为「继续」。我用这个切换过程确认等待期间不会重复发送同一个指令。"}]}],"shelf":"portfolio-pages"},{"id":"folio-intro-reframe","label":"Reframe｜P43–55","items":[{"id":"folio-p43","title":"Reframe 封面｜重做旧业务界面的工具提案","page":"P43","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>はReframeという、\u003cruby>古\u003crt>ふる\u003c/rt>\u003c/ruby>い\u003cruby>業務\u003crt>ぎょうむ\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>自社\u003crt>じしゃ\u003c/rt>\u003c/ruby>のUI\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>で\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すためのツール\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>にはFigmaを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いました。","zh":"接下来是 Reframe，一个用公司自己的 UI 组件重做旧业务界面的工具提案。用到的是 Figma。"}]},{"id":"folio-p44","title":"为什么要成批处理","page":"P44","blocks":[{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>や\u003cruby>在庫\u003crt>ざいこ\u003c/rt>\u003c/ruby>を\u003cruby>管理\u003crt>かんり\u003c/rt>\u003c/ruby>する\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>なら\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>せても、\u003cruby>似\u003crt>に\u003c/rt>\u003c/ruby>た\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>が\u003cruby>百\u003crt>ひゃく\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>以上\u003crt>いじょう\u003c/rt>\u003c/ruby>あって、\u003cruby>少人数\u003crt>しょうにんずう\u003c/rt>\u003c/ruby>で\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>い\u003cruby>期間\u003crt>きかん\u003c/rt>\u003c/ruby>に\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すとなると、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>を\u003cruby>何度\u003crt>なんど\u003c/rt>\u003c/ruby>もすることになります。","zh":"比如订单管理和库存管理。一张可以手动重做，但如果小团队要在短时间内重做一百多张相似的界面，就会反复做同样的事。"}]},{"id":"folio-p45","title":"先弄清元素的用途","page":"P45","blocks":[{"type":"speech","ja":"そこで、\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>から、まず\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いてあって、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>できるのかを\u003cruby>拾\u003crt>ひろ\u003c/rt>\u003c/ruby>います。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば「\u003cruby>承認待\u003crt>しょうにんま\u003c/rt>\u003c/ruby>ち」は\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>状態\u003crt>じょうたい\u003c/rt>\u003c/ruby>で、「\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>を\u003cruby>承認\u003crt>しょうにん\u003c/rt>\u003c/ruby>」は\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>すボタンですよね。この\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いを\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>して、\u003cruby>社内\u003crt>しゃない\u003c/rt>\u003c/ruby>の\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>を\u003cruby>当\u003crt>あ\u003c/rt>\u003c/ruby>てはめます。","zh":"所以先识别原界面上哪些是信息、哪些是操作。比如「等待审批」是现在的状态，「批准订单」才是能点的按钮。对应公司的组件时要保留这一区别。"}]},{"id":"folio-p46","title":"从图片到可编辑稿","page":"P46","blocks":[{"type":"speech","ja":"\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>の\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>から\u003cruby>旧\u003crt>きゅう\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>んで、AIが\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>の\u003cruby>候補\u003crt>こうほ\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>します。それをデザイナーが\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめて、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>はFigmaで\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れられる\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にする、という\u003cruby>構想\u003crt>こうそう\u003c/rt>\u003c/ruby>です。","zh":"从左到右，先导入旧界面，由 AI 提出组件候选，再由设计师核对。这个方案设想最后能得到可以在 Figma 里继续编辑的设计稿。"}]},{"id":"folio-p47","title":"已有组件怎么选","page":"P47","blocks":[{"type":"speech","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶところがこの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。\u003cruby>一覧\u0
