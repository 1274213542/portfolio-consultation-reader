03crt>いちらん\u003c/rt>\u003c/ruby>から\u003cruby>項目\u003crt>こうもく\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶと、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>に\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>役割\u003crt>やくわり\u003c/rt>\u003c/ruby>と、その\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>を\u003cruby>勧\u003crt>すす\u003c/rt>\u003c/ruby>める\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>や\u003cruby>余白\u003crt>よはく\u003c/rt>\u003c/ruby>も\u003cruby>社内\u003crt>しゃない\u003c/rt>\u003c/ruby>の\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>うか、ここで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てから\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>められます。","zh":"这页是实际选组件时看到的界面。点选一项，右边就会列出它原来的用途和候选组件的推荐理由，还可以核对颜色与间距是否符合公司规范，再决定是否采用。"}]},{"id":"folio-p48","title":"现有库里找不到时","page":"P48","blocks":[{"type":"speech","ja":"で、ちょうどいい\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>が\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つからない\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>もあります。ここでは、\u003cruby>複数\u003crt>ふくすう\u003c/rt>\u003c/ruby>の\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>をまとめて\u003cruby>承認\u003crt>しょうにん\u003c/rt>\u003c/ruby>するバーが\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>です。\u003cruby>一件\u003crt>いっけん\u003c/rt>\u003c/ruby>も\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んでいないときは\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>せないか、\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>候補\u003crt>こうほ\u003c/rt>\u003c/ruby>を\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>せます。","zh":"有时也找不到合适的现成组件。这里的例子是一条批量审批栏，可以检查没选订单时按钮是否禁用、选中件数是否清楚，再调整候选方案。"}]},{"id":"folio-p49","title":"一次更改可以影响哪些页","page":"P49","blocks":[{"type":"speech","ja":"\u003cruby>今度\u003crt>こんど\u003c/rt>\u003c/ruby>は、\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>をどこまでまとめて\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えるかです。\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>\u003cruby>一覧\u003crt>いちらん\u003c/rt>\u003c/ruby>と\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>の「\u003cruby>承認待\u003crt>しょうにんま\u003c/rt>\u003c/ruby>ち」はそろえたいんですが、\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>が\u003cruby>公開中\u003crt>こうかいちゅう\u003c/rt>\u003c/ruby>かどうかを\u003cruby>示\u003crt>しめ\u003c/rt>\u003c/ruby>すラベルまで\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わると\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>ります。そこで、\u003cruby>適用\u003crt>てきよう\u003c/rt>\u003c/ruby>する\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>対象\u003crt>たいしょう\u003c/rt>\u003c/ruby>から\u003cruby>外\u003crt>はず\u003c/rt>\u003c/ruby>せるようにしました。","zh":"接下来看同一改动应用到哪里。订单列表和详情里的「等待审批」要一致，但商品是否公开是另一回事，所以执行之前可以把那类页面排除。"}]},{"id":"folio-p50","title":"批量处理后先看哪几页","page":"P50","blocks":[{"type":"speech","ja":"\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>むと、\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>がすんなり\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>むわけでもありません。このデモでは\u003cruby>160画面\u003crt>ひゃくろくじゅうがめん\u003c/rt>\u003c/ruby>のうち、\u003cruby>六\u003crt>むっ\u003c/rt>\u003c/ruby>つはデザイナーが\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>するもの、\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つは\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>みからやり\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すものとして\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けています。","zh":"批量导入后也会有不同结果。这份演示假设一共 160 个界面，其中 6 个要人工判断，2 个要重新读取。"}]},{"id":"folio-p51","title":"例外页面里，具体要改哪一项","page":"P51","blocks":[{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、この\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>では「\u003cruby>承認待\u003crt>しょうにんま\u003c/rt>\u003c/ruby>ち」の\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>が\u003cruby>社内\u003crt>しゃない\u003c/rt>\u003c/ruby>のルールと\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っていません。\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>と\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べて、\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>の\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>だけ\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>び\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>せるようにしました。","zh":"比如这张订单详情里，「等待审批」的颜色不符合公司的规则。对照原界面后，可以单独重新选择颜色设置。"}]},{"id":"folio-p52","title":"做好的前后对照","page":"P52","blocks":[{"type":"speech","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がデザインした\u003cruby>見本\u003crt>みほん\u003c/rt>\u003c/ruby>がこちらです。\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>と\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>で\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いています。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>た\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>は\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わっても、\u003cruby>合計\u003crt>ごうけい\u003c/rt>\u003c/ruby>はどちらも\u003cruby>24,800円\u003crt>にまんよんせんはっぴゃくえん\u003c/rt>\u003c/ruby>で、「\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>を\u003cruby>承認\u003crt>しょうにん\u003c/rt>\u003c/ruby>」という\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>も\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。","zh":"这是我实际做的设计示例。左右是同一笔订单，界面变了，总额还是 24,800 日元，「批准订单」这个操作也保留下来。"}]},{"id":"folio-p53","title":"人检查得越久，结论越不同","page":"P53","blocks":[{"type":"speech","ja":"じゃあ、どれくらい\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>が\u003cruby>減\u003crt>へ\u003c/rt>\u003c/ruby>りそうか。デザイナーが\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>にかける\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えて\u003cruby>試算\u003crt>しさん\u003c/rt>\u003c/ruby>しました。\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>の\u003cruby>右端\u003crt>みぎはし\u003c/rt>\u003c/ruby>のように、\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>に\u003cruby>32分\u003crt>さんじゅうにふん\u003c/rt>\u003c/ruby>かかる\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>だと、\u003cruby>利用料\u003crt>りようりょう\u003c/rt>\u003c/ruby>まで\u003cruby>含\u003crt>ふく\u003c/rt>\u003c/ruby>めた\u003cruby>費用\u003crt>ひよう\u003c/rt>\u003c/ruby>は、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すほうが\u003cruby>安\u003crt>やす\u003c/rt>\u003c/ruby>くなります。","zh":"那它到底能省多少工？这里改变人工检查耗时做了试算。看右下角，假设每页要检查 32 分钟，算上工具费用，反而是手动重做更便宜。"}]},{"id":"folio-p54","title":"下一步怎么验证","page":"P54","blocks":[{"type":"speech","ja":"この\u003cruby>試算\u003crt>しさん\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるなら、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を、\u003cruby>手作業\u003crt>てさぎょう\u003c/rt>\u003c/ruby>とツールを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方法\u003crt>ほうほう\u003c/rt>\u003c/ruby>の\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>で\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>します。\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>と\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>が\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>って、\u003cruby>社内\u003crt>しゃない\u003c/rt>\u003c/ruby>のルールにも\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>ったところを\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>として、そこまでの\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>と\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>を\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べたいです。","zh":"要验证试算，我想让两种方法重做相同的订单界面。两边都保留原信息与操作，也都符合公司的设计规则，然后比较做到这一步的耗时和修改件数。"}]},{"id":"folio-p55","title":"项目自己的标志","page":"P55","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に、ツールのロゴも\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>共通\u003crt>きょうつう\u003c/rt>\u003c/ruby>のルールで\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>す\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じを、\u003cruby>幅\u003crt>はば\u003c/rt>\u003c/ruby>と\u003cruby>間隔\u003crt>かんかく\u003c/rt>\u003c/ruby>をそろえた\u003cruby>緑\u003crt>みどり\u003c/rt>\u003c/ruby>の\u003cruby>線\u003crt>せん\u003c/rt>\u003c/ruby>で\u003cruby>表\u003crt>あらわ\u003c/rt>\u003c/ruby>しています。","zh":"最后是给工具做的标志。绿色线条的宽度和间距都有规则，用来表现按统一规范重组界面的想法。"}]}],"shelf":"portfolio-pages"},{"id":"folio-intro-around","label":"AROUND｜P56–67","items":[{"id":"folio-p56","title":"AROUND 封面｜车外声音提醒","page":"P56","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>はAROUNDという、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>外\u003crt>そと\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>をシートの\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>と\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせる\u003cruby>車載\u003crt>しゃさい\u003c/rt>\u003c/ruby>システムの\u003cruby>提案\u003crt>ていあん\u003c/rt>\u003c/ruby>です。\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったツールはFigmaです。","zh":"接下来是 AROUND，一套通过座椅振动和屏幕提示，让驾驶员留意车外声音的车载系统提案。用到的工具是 Figma。"}]},{"id":"folio-p57","title":"已有做法分别告诉驾驶员什么","page":"P57","blocks":[{"type":"speech","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つの\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>を\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べました。CarPlayはクラクションなどの\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>を、トヨタの\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>は\u003cruby>緊急\u003crt>きんきゅう\u003c/rt>\u003c/ruby>\u003cruby>車両\u003crt>しゃりょう\u003c/rt>\u003c/ruby>の\u003cruby>接近\u003crt>せっきん\u003c/rt>\u003c/ruby>を\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせます。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>のヒョンデでは、ウインカーを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すと\u003cruby>死角\u003crt>しかく\u003c/rt>\u003c/ruby>が\u003cruby>映\u003crt>うつ\u003c/rt>\u003c/ruby>ります。そこから、\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>に\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づいたあと、「どこからだろう」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったときに\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"我比较了三种做法。CarPlay 提示声音，丰田的例子提示紧急车辆接近，现代的例子会在打转向灯时显示盲区。接下来我想的是，驾驶员留意到声音、想知道从哪里来时，可以怎样自己确认。"}]},{"id":"folio-p58","title":"提醒出现时，驾驶员正在做什么","page":"P58","blocks":[{"type":"speech","ja":"ただ、\u003cruby>車線\u003crt>しゃせん\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えようとしているときって、\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>や\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていますよね。そこで\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いたり、\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>を\u003cruby>閉\u003crt>と\u003c/rt>\u003c/ruby>じたりしなくても、\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>がしたと\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づけるようにしたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>と\u003cruby>音声\u003crt>おんせい\u003c/rt>\u003c/ruby>の\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>は、それぞれ\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>べます。","zh":"比如准备变道时，驾驶员的目光在前方和周围。我希望他不用点开画面或者关掉弹窗，也能留意到车外有声音。座椅振动和语音播报可以分别设置。"}]},{"id":"folio-p59","title":"什么情况下才发出这次提醒","page":"P59","blocks":[{"type":"speech","ja":"\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせるかどうかは、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>か、\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りの\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>とどれくらい\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うか、それから、どのくらい\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かに\u003cruby>識別\u003crt>しきべつ\u003c/rt>\u003c/ruby>できたかで\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めます。\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>が\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>くときは、\u003cruby>一件\u003crt>いっけん\u003c/rt>\u003c/ruby>にまとめます。","zh":"要不要提醒，会结合声音类型、它和背景音的差异，以及识别的把握来判断。同一声音持续响时，就合成一条提醒。"}]},{"id":"folio-p60","title":"座椅振动怎样传递方位","page":"P60","blocks":[{"type":"speech","ja":"\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>から\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>がしたなら、シートの\u003cruby>左側\u003crt>ひだりがわ\u003c/rt>\u003c/ruby>がトン、トンと\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>く\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>回\u003crt>かい\u003c/rt>\u003c/ruby>\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>します。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>なら\u003cruby>右側\u003crt>みぎがわ\u003c/rt>\u003c/ruby>です。\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>と\u003cruby>後\u003crt>うし\u003c/rt>\u003c/ruby>ろまで\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>のリズムにすると\u003cruby>覚\u003crt>おぼ\u003c/rt>\u003c/ruby>えることが\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えるので、\u003cruby>振動\u003crt>しんどう\u003c/rt>\u003c/ruby>では\u003cruby>左右\u003crt>さゆう\u003c/rt>\u003c/ruby>だけを\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えます。","zh":"声音来自左边，座椅左侧就轻轻短震两次，右边则是右侧。为了不让驾驶员另记一套前后节奏，振动只传达左右。"}]},{"id":"folio-p61","title":"三张图｜地图遮挡、方向已知、方向未知","page":"P61","blocks":[{"type":"speech","ja":"この\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つは、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じクラクションをどう\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せるかの\u003cruby>比較\u003crt>ひかく\u003c/rt>\u003c/ruby>です。\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>のように\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>に\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>ねると\u003cruby>経路\u003crt>けいろ\u003c/rt>\u003c/ruby>が\u003cruby>隠\u003crt>かく\u003c/rt>\u003c/ruby>れます。そこで\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>では、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>絵\u003crt>え\u003c/rt>\u003c/ruby>の\u003cruby>左後\u003crt>ひだりうし\u003c/rt>\u003c/ruby>ろに\u003cruby>波紋\u003crt>はもん\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>は\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からない\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>で、\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>を\u003cruby>点線\u003crt>てんせん\u003c/rt>\u003c/ruby>で\u003cruby>囲\u003crt>かこ\u003c/rt>\u003c/ruby>むだけにしています。","zh":"这三张是在比较怎样显示同一声喇叭。左图直接叠在地图上，会挡住路线。中图就把波纹画在小车的左后方。右图是方向不明的情况，只用虚线圈住车身。"}]},{"id":"folio-p62","title":"驾驶员要不要继续确认","page":"P62","blocks":[{"type":"speech","ja":"\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>だけで\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれば、ここで\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>は\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わりです。まだ\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>が\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になれば、「\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>、どっちから？」と\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>で\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けます。\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないときには、\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>は\u003cruby>捉\u003crt>とら\u003c/rt>\u003c/ruby>えたけれど\u003cruby>方向\u003crt>ほうこう\u003c/rt>\u003c/ruby>は\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からない、と\u003cruby>答\u003crt>こた\u003c/rt>\u003c/ruby>えます。","zh":"如果看提醒已经明白情况，就不用再操作了。还想知道方向的话，就开口问「刚才的声音从哪儿来？」判断不了时，系统会说检测到了声音，但方向不明。"}]},{"id":"folio-p63","title":"停车后｜刚才的录音和现在的影像","page":"P63","blocks":[{"type":"speech","ja":"で、\u003cruby>安全\u003crt>あんぜん\u003c/rt>\u003c/ruby>な\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>に\u003cruby>停\u003crt>と\u003c/rt>\u003c/ruby>めると、\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめられることが\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えます。「もう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>かせて」で\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れるのはさっきの\u003cruby>録音\u003crt>ろくおん\u003c/rt>\u003c/ruby>です。\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けて「\u003cruby>後\u003crt>うし\u003c/rt>\u003c/ruby>ろも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せて」と\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>うと、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>後方\u003crt>こうほう\u003c/rt>\u003c/ruby>カメラの\u003cruby>映像\u003crt>えいぞう\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。","zh":"在安全的地方停车以后，可以确认得更仔细。「再放一次」播放的是刚才的录音，接着说「也给我看看后面」，看到的是此刻的后视摄像画面。"}]},{"id":"folio-p64","title":"等系统回答时能看到什么","page":"P64","blocks":[{"type":"speech","ja":"\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>でやり\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りしていると、ちゃんと\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>き\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>れたかな、と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>う\u003cruby>間\u003crt>ま\u003c/rt>\u003c/ruby>があります。そこで、\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>き\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>、\u003cruby>答\u003crt>こた\u003c/rt>\u003c/ruby>えを\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>しているとき、\u003cruby>答\u003crt>こた\u003c/rt>\u003c/ruby>えているときで、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>光\u003crt>ひか\u003c/rt>\u003c/ruby>り\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えました。","zh":"语音交互中会有一小段等待，人会想「它听清了吗？」。所以系统正在听、正在准备回答和正在回答，这三种状态分别用了不同的光效。"}]},{"id":"folio-p65","title":"结束这次确认以后","page":"P65","blocks":[{"type":"speech","ja":"「\u003cruby>閉\u003crt>と\u003c/rt>\u003c/ruby>じて」と\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>うと、\u003cruby>録音\u003crt>ろくおん\u003c/rt>\u003c/ruby>や\u003cruby>映像\u003crt>えいぞう\u003c/rt>\u003c/ruby>を\u003cruby>閉\u003crt>と\u003c/rt>\u003c/ruby>じて、\u003cruby>音楽\u003crt>おんがく\u003c/rt>\u003c/ruby>も\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>音量\u003crt>おんりょう\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>します。そのあとも\u003cruby>車外\u003crt>しゃがい\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>は\u003cruby>検知\u003crt>けんち\u003c/rt>\u003c/ruby>します。\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>の\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で\u003cruby>車\u003crt>くるま\u003c/rt>\u003c/ruby>の\u003cruby>安全\u003crt>あんぜん\u003c/rt>\u003c/ruby>\u003cruby>警報\u003crt>けいほう\u003c/rt>\u003c/ruby>が\u003cruby>鳴\u003crt>な\u003c/rt>\u003c/ruby>ったら、\u003cruby>会話\u003crt>かいわ\u003c/rt>\u003c/ruby>と\u003cruby>録音\u003crt>ろくおん\u003c/rt>\u003c/ruby>の\u003cruby>再生\u003crt>さいせい\u003c/rt>\u003c/ruby>はいったん\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>めます。","zh":"说「关闭」后结束回放和摄像显示，音乐恢复原音量，车外声音仍继续检测。若确认过程中车辆安全警报响起，会暂停对话和录音播放。"}]},{"id":"folio-p66","title":"四张完成画面｜同一块屏幕如何分工","page":"P66","blocks":[{"type":"speech","ja":"\u003cruby>左上\u003crt>ひだりうえ\u003c/rt>\u003c/ruby>は\u003cruby>走行中\u003crt>そうこうちゅう\u003c/rt>\u003c/ruby>です。\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>き\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>った「\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>音\u003crt>おと\u003c/rt>\u003c/ruby>、どっちから？」という\u003cruby>質問\u003crt>しつもん\u003c/rt>\u003c/ruby>が\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>て、\u003cruby>返事\u003crt>へんじ\u003c/rt>\u003c/ruby>は\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>で\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けます。\u003cruby>下\u003crt>した\u003c/rt>\u003c/ruby>の\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>は\u003cruby>駐車\u003crt>ちゅうしゃ\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>で、\u003cruby>警報\u003crt>けいほう\u003c/rt>\u003c/ruby>が\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>って\u003cruby>再生\u003crt>さいせい\u003c/rt>\u003c/ruby>が\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>まっても、\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>していたカメラの\u003cruby>映像\u003crt>えいぞう\u003c/rt>\u003c/ruby>は\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>ります。","zh":"看左上这张，驾驶员说的「刚才的声音从哪儿来？」显示在屏幕下方，回答则可以直接听。右下是停车后，即使警报打断了回放，正在查看的摄像画面仍然保留。"}]},{"id":"folio-p67","title":"AROUND 展示｜车内效果","page":"P67","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は、AROUNDの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>車内\u003crt>しゃない\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いてみたイメージです。","zh":"最后是 AROUND 的界面放进车内的效果图。"}]}],"shelf":"portfolio-pages"},{"id":"folio-intro-acrylic","label":"会动的亚克力作品集｜P68–76","items":[{"id":"folio-p68","title":"书籍设计｜亚克力作品集封面","page":"P68","blocks":[{"type":"speech","ja":"ここからはブックデザインの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>です。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>は、\u003cruby>傾\u003crt>かたむ\u003c/rt>\u003c/ruby>けると\u003cruby>模様\u003crt>もよう\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わるアクリルの\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>をつけた\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>作品集\u003crt>さくひんしゅう\u003c/rt>\u003c/ruby>で、Illustratorを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い、\u003cruby>手作業\u003crt>てさぎょう\u003c/rt>\u003c/ruby>で\u003cruby>仕上\u003crt>しあ\u003c/rt>\u003c/ruby>げました。","zh":"接下来是书籍设计。第一本是我自己的作品集，倾斜书本时，亚克力封面的图案会变。制作时用了 Illustrator，最后手工完成。"}]},{"id":"folio-p69","title":"为什么把动感放在封面","page":"P69","blocks":[{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>まで\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ることが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>くて、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ってめくる\u003cruby>感覚\u003crt>かんかく\u003c/rt>\u003c/ruby>は\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>したかったんです。そこに\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きも\u003cruby>加\u003crt>くわ\u003c/rt>\u003c/ruby>えるなら、\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>く\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>の\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>で\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>かできないかな、というのが\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>まりです。","zh":"我以前做了不少纸本，很想保留拿在手里翻阅的感觉。当时就想，要再加一点动感，能不能从还没翻开书的封面做起？"}]},{"id":"folio-p70","title":"从零件开始做书","page":"P70","blocks":[{"type":"speech","ja":"それで、まず\u003cruby>金具\u003crt>かなぐ\u003c/rt>\u003c/ruby>やねじを\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>うところから\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めました。\u003cruby>実物\u003crt>じつぶつ\u003c/rt>\u003c/ruby>を\u003cruby>測\u003crt>はか\u003c/rt>\u003c/ruby>って\u003cruby>図面\u003crt>ずめん\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>いて、\u003cruby>加工\u003crt>かこう\u003c/rt>\u003c/ruby>\u003cruby>場\u003crt>じょう\u003c/rt>\u003c/ruby>で\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>板\u003crt>いた\u003c/rt>\u003c/ruby>を\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>のページを\u003cruby>綴\u003crt>と\u003c/rt>\u003c/ruby>じています。","zh":"所以我是从买五金件和螺丝开始的。先实测画图，再去工坊自己切板，最后装入纸质内页。"}]},{"id":"folio-p71","title":"铰链为何换成金属","page":"P71","blocks":[{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>くための\u003cruby>蝶番\u003crt>ちょうつがい\u003c/rt>\u003c/ruby>です。\u003cruby>透明\u003crt>とうめい\u003c/rt>\u003c/ruby>なものなら\u003cruby>板\u003crt>いた\u003c/rt>\u003c/ruby>になじむんですけど、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>ねてみると\u003cruby>厚\u003crt>あつ\u003c/rt>\u003c/ruby>すぎたので、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>薄\u003crt>うす\u003c/rt>\u003c/ruby>い\u003cruby>金属\u003crt>きんぞく\u003c/rt>\u003c/ruby>のものにしました。","zh":"比如用来开合封面的铰链。透明款看起来和板材很搭，实际叠起来却太厚，所以最后用了右边这款较薄的金属铰链。"}]},{"id":"folio-p72","title":"把实测结果放进草图","page":"P72","blocks":[{"type":"speech","ja":"\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>が、そのときに\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>いたスケッチです。\u003cruby>板\u003crt>いた\u003c/rt>\u003c/ruby>をどう\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>ねるかを\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>いてから、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>金具\u003crt>かなぐ\u003c/rt>\u003c/ruby>を\u003cruby>測\u003crt>はか\u003c/rt>\u003c/ruby>って、どこに\u003cruby>穴\u003crt>あな\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>ければ\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けられるかを\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めました。","zh":"左边是当时画的草图。我先画出板材的叠放关系，再测量五金件，确定孔开在哪里才能装上。"}]},{"id":"folio-p73","title":"彩色小片如何做出来","page":"P73","blocks":[{"type":"speech","ja":"\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>くハートや\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>は、\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>の\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うアクリル\u003cruby>板\u003crt>ばん\u003c/rt>\u003c/ruby>から\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>は\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いますが、\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きさと\u003cruby>厚\u003crt>あつ\u003c/rt>\u003c/ruby>みはそろえています。","zh":"封面里会动的爱心和花，是从不同颜色的亚克力板上切出来的。形状不同，但尺寸和厚度做得一致。"}]},{"id":"folio-p74","title":"拿在手里试才发现的缝隙","page":"P74","blocks":[{"type":"speech","ja":"で、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>傾\u003crt>かたむ\u003c/rt>\u003c/ruby>けてみたら、パーツがこぼれたんです。\u003cruby>四隅\u003crt>よすみ\u003c/rt>\u003c/ruby>だけを\u003cruby>留\u003crt>と\u003c/rt>\u003c/ruby>めた\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>だと、\u003cruby>辺\u003crt>へん\u003c/rt>\u003c/ruby>の\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>が\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>いてしまって。そこで\u003cruby>四辺\u003crt>しへん\u003c/rt>\u003c/ruby>の\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>にも\u003cruby>留\u003crt>と\u003c/rt>\u003c/ruby>め\u003cruby>具\u003crt>ぐ\u003c/rt>\u003c/ruby>を\u003cruby>足\u003crt>た\u003c/rt>\u003c/ruby>しました。","zh":"真正拿起来倾斜时，小片掉出来了。最初只固定四个角，板边的中段会张开一点，所以我在四条边的中央各加了一个固定点。"}]},{"id":"folio-p75","title":"打开后怎么找到作品","page":"P75","blocks":[{"type":"speech","ja":"\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>くと、\u003cruby>目次\u003crt>もくじ\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>た\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>が、そのまま\u003cruby>仕切\u003crt>しき\u003c/rt>\u003c/ruby>りと\u003cruby>章\u003crt>しょう\u003c/rt>\u003c/ruby>の\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>のページにつながります。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、UI/UXの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たいときは、ピンクの\u003cruby>仕切\u003crt>しき\u003c/rt>\u003c/ruby>りを\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>けば、その\u003cruby>章\u003crt>しょう\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れます。","zh":"打开以后，目录里的颜色和分隔页、章首页是一致的。比如想看 UI/UX 作品，翻到粉色分隔页就能进入那一章。"}]},{"id":"folio-p76","title":"成品侧面","page":"P76","blocks":[{"type":"speech","ja":"\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>が\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いたところです。\u003cruby>閉\u003crt>と\u003c/rt>\u003c/ruby>じると\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>の\u003cruby>模様\u003crt>もよう\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えますが、\u003cruby>横\u003crt>よこ\u003c/rt>\u003c/ruby>からは\u003cruby>透明\u003crt>とうめい\u003c/rt>\u003c/ruby>な\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>と、その\u003cruby>奥\u003crt>おく\u003c/rt>\u003c/ruby>の\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>の\u003cruby>仕切\u003crt>しき\u003c/rt>\u003c/ruby>りが\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>なって\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えます。","zh":"右边是书稍微打开的样子。合上时看到的是一幅图案，从侧面看，透明封面和里面的纸质分隔页就一层层显出来了。"}]}],"shelf":"portfolio-pages"},{"id":"folio-intro-seasons","label":"四季の花綴り｜P77–88","items":[{"id":"folio-p77","title":"《四季の花綴り》封面｜本科毕业作品","page":"P77","blocks":[{"type":"speech","ja":"\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>の\u003cruby>卒業制作\u003crt>そつぎょうせいさく\u003c/rt>\u003c/ruby>『\u003cruby>四季\u003crt>しき\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>\u003cruby>綴\u003crt>つづ\u003c/rt>\u003c/ruby>り』です。\u003cruby>子\u003crt>こ\u003c/rt>\u003c/ruby>どもの\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>から\u003cruby>親\u003crt>した\u003c/rt>\u003c/ruby>しんできた\u003cruby>二十四節気\u003crt>にじゅうしせっき\u003c/rt>\u003c/ruby>を、\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>と\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>でたどる\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>にして、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>製本\u003crt>せいほん\u003c/rt>\u003c/ruby>しました。","zh":"接下来是我的本科毕业作品《四季の花綴り》。我用押花和汉诗讲从小就熟悉的二十四节气，做成四册手工装订的书。"}]},{"id":"folio-p78","title":"立春的诗为什么配这一朵花","page":"P78","blocks":[{"type":"speech","ja":"\u003cruby>自然\u003crt>しぜん\u003c/rt>\u003c/ruby>と\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わりを\u003cruby>扱\u003crt>あつか\u003c/rt>\u003c/ruby>った\u003cruby>文献\u003crt>ぶんけん\u003c/rt>\u003c/ruby>や\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ながら、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に、\u003cruby>記憶\u003crt>きおく\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っている\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>の\u003cruby>景色\u003crt>けしき\u003c/rt>\u003c/ruby>を\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>い\u003cruby>浮\u003crt>う\u003c/rt>\u003c/ruby>かべてもらえたら、と\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば\u003cruby>立春\u003crt>りっしゅん\u003c/rt>\u003c/ruby>には、\u003cruby>迎春花\u003crt>げいしゅんか\u003c/rt>\u003c/ruby>を\u003cruby>詠\u003crt>よ\u003c/rt>\u003c/ruby>んだ\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、その\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てくる\u003cruby>黄色\u003crt>きいろ\u003c/rt>\u003c/ruby>を、\u003cruby>本物\u003crt>ほんもの\u003c/rt>\u003c/ruby>の\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>と\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べられるようにしています。","zh":"我看了讨论人与自然关系的文献和作品，想让读者联想到自己记忆里的季节景象。比如立春，我选了一首写迎春花的诗，读者可以把诗里写到的黄色跟真正的押花放在一起看。"}]},{"id":"folio-p79","title":"读者拿在手上怎么读","page":"P79","blocks":[{"type":"speech","ja":"\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>にすると、\u003cruby>布\u003crt>ぬの\u003c/rt>\u003c/ruby>や\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>の\u003cruby>手触\u003crt>てざわ\u003c/rt>\u003c/ruby>りがあって、\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>めくると\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てきます。\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>の\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>が\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったら、そこから\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>の\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>に\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>を\u003cruby>移\u003crt>うつ\u003c/rt>\u003c/ruby>せる、そんな\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"书拿在手上，能感觉到布和纸的质感，每翻一页又会出现下一种花。如果先被花的颜色吸引，也可以顺势读旁边的诗。"}]},{"id":"folio-p80","title":"原诗、日语和花怎么摆","page":"P80","blocks":[{"type":"speech","ja":"そこで、\u003cruby>古\u003crt>ふる\u003c/rt>\u003c/ruby>い\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>の\u003cruby>枠\u003crt>わく\u003c/rt>\u003c/ruby>や\u003cruby>縦\u003crt>たて\u003c/rt>\u003c/ruby>の\u003cruby>線\u003crt>せん\u003c/rt>\u003c/ruby>を\u003cruby>参考\u003crt>さんこう\u003c/rt>\u003c/ruby>にして、\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>に\u003cruby>共通\u003crt>きょうつう\u003c/rt>\u003c/ruby>する\u003cruby>紙面\u003crt>しめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>の\u003cruby>原文\u003crt>げんぶん\u003c/rt>\u003c/ruby>と、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>の\u003cruby>語順\u003crt>ごじゅん\u003c/rt>\u003c/ruby>で\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>める\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>き\u003cruby>下\u003crt>くだ\u003c/rt>\u003c/ruby>し\u003cruby>文\u003crt>ぶん\u003c/rt>\u003c/ruby>、それから\u003cruby>訳文\u003crt>やくぶん\u003c/rt>\u003c/ruby>を\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて、その\u003cruby>隣\u003crt>となり\u003c/rt>\u003c/ruby>に\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>を\u003cruby>収\u003crt>おさ\u003c/rt>\u003c/ruby>める\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>っています。","zh":"版式参考了古籍的外框和竖线，四册都用同一套规则。原诗、按日语语序写的训读文以及日译分区排版，旁边留出放押花的位置。"}]},{"id":"folio-p81","title":"二十四组是怎么分册的","page":"P81","blocks":[{"type":"speech","ja":"こうして\u003cruby>揃\u003crt>そろ\u003c/rt>\u003c/ruby>えた\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>と\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>が、\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>で\u003cruby>二十四\u003crt>にじゅうよん\u003c/rt>\u003c/ruby>\u003cruby>組\u003crt>くみ\u003c/rt>\u003c/ruby>です。\u003cruby>横\u003crt>よこ\u003c/rt>\u003c/ruby>\u003cruby>一列\u003crt>いちれつ\u003c/rt>\u003c/ruby>が\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つの\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>で、\u003cruby>春\u003crt>はる\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>なら、\u003cruby>左\u003crt>ひだり\u003c/rt>\u003c/ruby>の\u003cruby>立春\u003crt>りっしゅん\u003c/rt>\u003c/ruby>から\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>穀雨\u003crt>こくう\u003c/rt>\u003c/ruby>まで、\u003cruby>六\u003crt>むっ\u003c/rt>\u003c/ruby>つの\u003cruby>節気\u003crt>せっき\u003c/rt>\u003c/ruby>を\u003cruby>順\u003crt>じゅん\u003c/rt>\u003c/ruby>にめくれます。","zh":"这样配成了二十四组花和诗。横着一行就是一个季节。春册从左侧的立春排到右侧的谷雨，翻完正好经过六个节气。"}]},{"id":"folio-p82","title":"真花怎样经得起翻阅","page":"P82","blocks":[{"type":"speech","ja":"\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>は、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めたものです。\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>の\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>きを\u003cruby>整\u003crt>ととの\u003c/rt>\u003c/ruby>えて、\u003cruby>吸水\u003crt>きゅうすい\u003c/rt>\u003c/ruby>\u003cruby>紙\u003crt>し\u003c/rt>\u003c/ruby>に\u003cruby>挟\u003crt>はさ\u003c/rt>\u003c/ruby>んで\u003cruby>乾\u003crt>かわ\u003c/rt>\u003c/ruby>かしてから、\u003cruby>薄\u003crt>うす\u003c/rt>\u003c/ruby>い\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>びらをめくるときに\u003cruby>傷\u003crt>いた\u003c/rt>\u003c/ruby>めないよう、フィルムで\u003cruby>保護\u003crt>ほご\u003c/rt>\u003c/ruby>しました。","zh":"里面是真正由我采集的花。我先调整花的朝向，夹在吸水纸中压干，再用薄膜保护，让脆弱的花瓣在翻阅时不容易受损。"}]},{"id":"folio-p83","title":"内页纸色与外封的开窗","page":"P83","blocks":[{"type":"speech","ja":"\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>\u003cruby>見本\u003crt>みほん\u003c/rt>\u003c/ruby>を\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べてみて、\u003cruby>本文\u003crt>ほんぶん\u003c/rt>\u003c/ruby>の\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>は\u003cruby>春\u003crt>はる\u003c/rt>\u003c/ruby>から\u003cruby>冬\u003crt>ふゆ\u003c/rt>\u003c/ruby>に\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けて\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しずつ\u003cruby>黄\u003crt>き\u003c/rt>\u003c/ruby>みを\u003cruby>深\u003crt>ふか\u003c/rt>\u003c/ruby>くしました。カバーは\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>模様\u003crt>もよう\u003c/rt>\u003c/ruby>を\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>いて、インクを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>わずに\u003cruby>模様\u003crt>もよう\u003c/rt>\u003c/ruby>を\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>す\u003cruby>加工\u003crt>かこう\u003c/rt>\u003c/ruby>と、\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>の\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>に\u003cruby>抜\u003crt>ぬ\u003c/rt>\u003c/ruby>く\u003cruby>加工\u003crt>かこう\u003c/rt>\u003c/ruby>を\u003cruby>印刷\u003crt>いんさつ\u003c/rt>\u003c/ruby>\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>にお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いしています。","zh":"我把纸样摆在一起比较，让内页从春到冬逐渐加深黄色。外封纹样由我设计，没有上墨的压纹和花形镂空交给印刷公司加工。"}]},{"id":"folio-p84","title":"镂空处露出的是刺绣","page":"P84","blocks":[{"type":"speech","ja":"で、その\u003cruby>窓\u003crt>まど\u003c/rt>\u003c/ruby>から\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えているのが、この\u003cruby>刺繍\u003crt>ししゅう\u003c/rt>\u003c/ruby>です。\u003cruby>春\u003crt>はる\u003c/rt>\u003c/ruby>の\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>なら、\u003cruby>窓\u003crt>まど\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>に\u003cruby>鳥\u003crt>とり\u003c/rt>\u003c/ruby>と\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>がちょうど\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>るように\u003cruby>下絵\u003crt>したえ\u003c/rt>\u003c/ruby>を\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>いて、\u003cruby>布\u003crt>ぬの\u003c/rt>\u003c/ruby>に\u003cruby>写\u003crt>うつ\u003c/rt>\u003c/ruby>してから、\u003cruby>糸\u003crt>いと\u003c/rt>\u003c/ruby>の\u003cruby>色\u003crt>いろ\u003c/rt>\u003c/ruby>と\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>きを\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えながら\u003cruby>縫\u003crt>ぬ\u003c/rt>\u003c/ruby>いました。","zh":"从刚才那个开窗里露出来的是刺绣。以春册为例，我先在草图里确定鸟和花正好出现在窗口内的位置，再转印到布面，用不同颜色和方向的线来绣。"}]},{"id":"folio-p85","title":"押花怎么装进书页","page":"P85","blocks":[{"type":"speech","ja":"\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>にするときは、フィルムで\u003cruby>保護\u003crt>ほご\u003c/rt>\u003c/ruby>した\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>を\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つ\u003cruby>折\u003crt>お\u003c/rt>\u003c/ruby>りの\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>で\u003cruby>挟\u003crt>はさ\u003c/rt>\u003c/ruby>んで、\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>ずつ\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>綴\u003crt>と\u003c/rt>\u003c/ruby>じました。\u003cruby>背\u003crt>せ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、\u003cruby>上下\u003crt>じょうげ\u003c/rt>\u003c/ruby>には\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>と\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>布\u003crt>ぬの\u003c/rt>\u003c/ruby>があって、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>には\u003cruby>紙\u003crt>かみ\u003c/rt>\u003c/ruby>の\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>なりと\u003cruby>綴\u003crt>と\u003c/rt>\u003c/ruby>じ\u003cruby>糸\u003crt>いと\u003c/rt>\u003c/ruby>がそのまま\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えます。","zh":"装书时，我把用薄膜保护好的押花夹进对折的书页，再逐册手工缝订。看书脊，上下两端用了和封面一样的布，中间露出层叠的书页和装订线。"}]},{"id":"folio-p86","title":"花期决定制作日程","page":"P86","blocks":[{"type":"speech","ja":"\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>は\u003cruby>咲\u003crt>さ\u003c/rt>\u003c/ruby>く\u003cruby>時期\u003crt>じき\u003c/rt>\u003c/ruby>がそれぞれ\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うので、\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めるのに\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>年\u003crt>ねん\u003c/rt>\u003c/ruby>ほどかかりました。\u003cruby>印刷物\u003crt>いんさつぶつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いてからは\u003cruby>一\u003crt>いっ\u003c/rt>\u003c/ruby>か\u003cruby>月\u003crt>げつ\u003c/rt>\u003c/ruby>ほどで\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>を\u003cruby>仕上\u003crt>しあ\u003c/rt>\u003c/ruby>げて、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>のスケッチで、\u003cruby>展示\u003crt>てんじ\u003c/rt>\u003c/ruby>する\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>と\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きな\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>の\u003cruby>高\u003crt>たか\u003c/rt>\u003c/ruby>さも\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"每种花的花期不同，采集用了大约一年。印好的材料收到后，我又花了约一个月把四册手工完成，右边的草图则是我推敲书和大型花朵在展场里高度时画的。"}]},{"id":"folio-p87","title":"四册书与花在展场里怎么摆放","page":"P87","blocks":[{"type":"speech","ja":"こちらが\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>展示\u003crt>てんじ\u003c/rt>\u003c/ruby>です。\u003cruby>四\u003crt>よん\u003c/rt>\u003c/ruby>\u003cruby>冊\u003crt>さつ\u003c/rt>\u003c/ruby>を\u003cruby>高\u003crt>たか\u003c/rt>\u003c/ruby>さの\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>う\u003cruby>台\u003crt>だい\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いて、そのまわりに\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きな\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>を\u003cruby>飾\u003crt>かざ\u003c/rt>\u003c/ruby>りました。","zh":"这是实际的展场。我把四册书放在高低不同的展台上，在周围摆上了大型花朵。"}]},{"id":"folio-p88","title":"回到手里的这一册","page":"P88","blocks":[{"type":"speech","ja":"\u003cruby>右下\u003crt>みぎした\u003c/rt>\u003c/ruby>が、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>に\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>って\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いたときの\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きさです。\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>と\u003cruby>詩\u003crt>し\u003c/rt>\u003c/ruby>が、ちょうど\u003cruby>手元\u003crt>てもと\u003c/rt>\u003c/ruby>で\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られます。","zh":"右下角是这本书拿在手里翻开时的大小。花和诗正好可以一起收进手边的视野里。"}]}],"shelf":"portfolio-pages"},{"id":"folio-intro-ling","label":"LING 团队杂志｜P89–91","items":[{"id":"folio-p89","title":"《LING》封面｜团队制作的杂志","page":"P89","blocks":[{"type":"speech","ja":"こちらは、\u003cruby>大学\u003crt>だいがく\u003c/rt>\u003c/ruby>の\u003cruby>授業\u003crt>じゅぎょう\u003c/rt>\u003c/ruby>でチームで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>った、\u003cruby>三宅一生\u003crt>みやけいっせい\u003c/rt>\u003c/ruby>さんを\u003cruby>特集\u003crt>とくしゅう\u003c/rt>\u003c/ruby>した\u003cruby>雑誌\u003crt>ざっし\u003c/rt>\u003c/ruby>『LING』です。\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>にはInDesign、Illustrator、Photoshopを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いました。","zh":"这是大学课程中合作完成的杂志《LING》，这一期介绍三宅一生。制作时用了 InDesign、Illustrator 和 Photoshop。"}]},{"id":"folio-p90","title":"团队和我的分工","page":"P90","blocks":[{"type":"speech","ja":"\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めると、\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>が\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>なったり、\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>み\u003cruby>具合\u003crt>ぐあい\u003c/rt>\u003c/ruby>に\u003cruby>差\u003crt>さ\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>たりしたので、\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>なことに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>分担\u003crt>ぶんたん\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>そうと\u003cruby>提案\u003crt>ていあん\u003c/rt>\u003c/ruby>しました。\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>は\u003cruby>全員\u003crt>ぜんいん\u003c/rt>\u003c/ruby>で\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めて、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>全\u003crt>ぜん\u003c/rt>\u003c/ruby>ページのレイアウトと、\u003cruby>校正\u003crt>こうせい\u003c/rt>\u003c/ruby>\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>の\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>の\u003cruby>入稿\u003crt>にゅうこう\u003c/rt>\u003c/ruby>を\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>しました。","zh":"刚开始，有些工作被重复做，各部分的进度也不一样，我就提议按各自擅长的事重新分工。企划是大家一起定的，我负责整本排版、校对后的修改和最后交付印刷文件。"}]},{"id":"folio-p91","title":"同一本杂志，人物和产品为什么排得不一样","pag uby>のページでも\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たよ\u003c/rt>\u003c/ruby>りに\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>めます。","zh":"为了安排图和字，我参考了左边的古籍。图文沿着竖线对齐，书名和章节名归在中央的竖条上，这样翻到下一页也能从熟悉的位置继续读。"}]},{"id":"folio-p95","title":"一段长碑文需要换一种翻法","page":"P95","blocks":[{"type":"speech","ja":"\u003cruby>本文\u003crt>ほんぶん\u003c/rt>\u003c/ruby>は\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>ずつめくりますが、\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の『\u003cruby>曹全碑\u003crt>そうぜんぴ\u003c/rt>\u003c/ruby>』は、\u003cruby>長\u003crt>なが\u003c/rt>\u003c/ruby>い\u003cruby>碑文\u003crt>ひぶん\u003c/rt>\u003c/ruby>の\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>びをまとめて\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せたかったんです。そこで、ここだけは\u003cruby>折\u003crt>お\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>みにして、\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>で\u003cruby>広\u003crt>ひろ\u003c/rt>\u003c/ruby>げて\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>を\u003cruby>見渡\u003crt>みわた\u003c/rt>\u003c/ruby>せるようにしました。","zh":"正文是一页页翻的，而右边的《曹全碑》，我希望读者能看到长篇碑文的整体排列，所以单独设计成可以用手展开的折页。"}]},{"id":"folio-p96","title":"竹封面怎么装订和收纳","page":"P96","blocks":[{"type":"speech","ja":"\u003cruby>表紙\u003crt>ひょうし\u003c/rt>\u003c/ruby>に\u003cruby>竹\u003crt>たけ\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだのは、\u003cruby>昔\u003crt>むかし\u003c/rt>\u003c/ruby>、\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>を\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていた\u003cruby>竹簡\u003crt>ちくかん\u003c/rt>\u003c/ruby>がきっかけです。\u003cruby>書名\u003crt>しょめい\u003c/rt>\u003c/ruby>はレーザーで\u003cruby>刻\u003crt>きざ\u003c/rt>\u003c/ruby>んで、\u003cruby>穴\u003crt>あな\u003c/rt>\u003c/ruby>に\u003cruby>糸\u003crt>いと\u003c/rt>\u003c/ruby>を\u003cruby>通\u003crt>とお\u003c/rt>\u003c/ruby>して\u003cruby>本文\u003crt>ほんぶん\u003c/rt>\u003c/ruby>と\u003cruby>綴\u003crt>と\u003c/rt>\u003c/ruby>じました。しまうときに\u003cruby>竹\u003crt>たけ\u003c/rt>\u003c/ruby>を\u003cr uby>時刻\u003crt>じこく\u003c/rt>\u003c/ruby>を\u003cruby>添\u003crt>そ\u003c/rt>\u003c/ruby>えて、その\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>で\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べています。","zh":"内页从傍晚六点到次日早上六点，每三小时一章，共四章。先是天边还留着颜色，接着灯光从黑暗的街上浮现，最后晨光落到建筑上。我把拍摄时间也标出来，按这个次序编排。"}]}],"shelf":"portfolio-pages"},{"id":"folio-intro-3d","label":"空中小町｜P101–103","items":[{"id":"folio-p101","title":"《空中小町》封面｜浮岛连接起来的 3D 小镇","page":"P101","blocks":[{"type":"speech","ja":"\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は『\u003cruby>空中\u003crt>くうちゅう\u003c/rt>\u003c/ruby>\u003cruby>小町\u003crt>こまち\u003c/rt>\u003c/ruby>』という、\u003cruby>空\u003crt>そら\u003c/rt>\u003c/ruby>に\u003cruby>浮\u003crt>う\u003c/rt>\u003c/ruby>かぶ\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>を\u003cruby>橋\u003crt>はし\u003c/rt>\u003c/ruby>でつないだ3Dの\u003cruby>街\u003crt>まち\u003c/rt>\u003c/ruby>です。Cinema 4DとAfter Effectsを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いました。","zh":"最后是《空中小町》，一座用桥把浮岛连起来的 3D 小镇。制作时用了 Cinema 4D 和 After Effects。"}]},{"id":"folio-p102","title":"从静止的模型到会动的场景","page":"P102","blocks":[{"type":"speech","ja":"まず、\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>と\u003cruby>橋\u003crt>はし\u003c/rt>\u003c/ruby>のつながりがよく\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>える\u003cruby>位置\u003crt>いち\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>して、\u003cruby>光\u003crt>ひかり\u003c/rt>\u003c/ruby>とカメラを\u003cruby>調整\u003crt>ちょうせい\u003c/rt>\u003c/ruby>しました。そこから\u003cruby>雲\u003crt>くも\u003c/rt>\u003c/ruby>やカメラにも\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きを\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けて、\u003cruby>映像\u003crt>えいぞう\u003c/rt>\u003c/ruby>にしています。","zh":"我先找能看清岛和桥之间关系的角度，调整灯光和相机，再给云和相机加上运动，做成影像。"}]},{"id":"folio-p103","title":"靠近以后，每座岛各有什么","page":"P103","blocks":[{"type":"speech","ja":"\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>近\u003crt>ちか\u003c/rt>\u003c/ruby>くで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、\u003cruby>左上\u003crt>ひだりうえ\u003c/rt>\u003c/ruby>の\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>には\u003cruby>赤\u003crt>あか\u003c/rt>\u003c/ruby>い\u003cruby>観覧車\u003crt>かんらんしゃ\u003c/rt>\u003c/ruby>があって、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>島\u003crt>しま\u003c/rt>\u003c/ruby>には\u003cruby>風船\u003crt>ふうせん\u003c/rt>\u003c/ruby>が\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>まっています。\u003cruby>遠\u003crt>とお\u003c/rt>\u003c/ruby>くからは\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つの\u003cruby>街\u003crt>まち\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えて、\u003cruby>近\u003crt>ちか\u003c/rt>\u003c/ruby>づくと\u003cruby>看板\u003crt>かんばん\u003c/rt>\u003c/ruby>や\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>の\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つかるように\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。","zh":"靠近看每一座岛，左上的岛有红色摩天轮，中间的岛聚集了许多气球。远看是一座小镇，近看还可以发现每座岛的招牌和小物件各不相同。"}]}],"shelf":"portfolio-pages"},{"id":"folio-intro-end","label":"封底｜P104","items":[{"id":"folio-p104","title":"把话交还给对方","page":"P104","blocks":[{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>からのご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>は\u003cruby>以上\u003crt>いじょう\u003c/rt>\u003c/ruby>です。ここまで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていただいて、ありがとうございます。","zh":"我的作品介绍到这里。谢谢您看完这些作品。"}]}],"shelf":"portfolio-pages"}],"links":[{"id":"p17","label":"MORI · P17"},{"id":"p34","label":"TUCK · P34"},{"id":"p77","label":"平面设计 · P77"}]},{"id":"questions","label":"问答","kind":"flow","groups":[{"id":"answers","label":"轮到对方问你","items":[{"id":"answers-1","title":"「今日はどんなことを聞いてみたいですか。」","menuTitle":"今天最想了解什么","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>はどんなことを\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいですか。","zh":""},{"type":"note","ja":"","zh":"对方把话交给你时再用。刚才能听懂的部分就不必再请他们重讲。"},{"type":"speech","ja":"PAY IDのデザイナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>とどんなふうにお\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>をされているのか\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいです。","zh":"我想听听，平时做 PAY ID 的设计，会和哪些同事一起做事，大家是怎么配合的。"}]},{"id":"answers-2","title":"「どうしてUI/UXを始めたんですか。」","menuTitle":"为什么开始做 UI/UX","page":"","blocks":[{"type":"prompt","ja":"どうしてUI/UXを\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたんですか。","zh":""},{"type":"note","ja":"","zh":"先讲自己怎么动起手，最后说哪里好玩。"},{"type":"speech","ja":"\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>ではグラフィックデザインが\u003cruby>中心\u003crt>ちゅうしん\u003c/rt>\u003c/ruby>でしたが、プログラミングも\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しやっていました。\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ってから、バイブコーディングなら\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>でデザインした\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>も\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>かせるかも、と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>って\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してみたのがきっかけです。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>はWebページで、そのうちアプリの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>も\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るようになりました。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>触\u003crt>さわ\u003c/rt>\u003c/ruby>ってみると「ここ、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすくできそうだな」って、また\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>したくなるんです。\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>って、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>って、また\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すのが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>くて、だんだんUI/UXが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きになりました。","zh":"我本科主学平面设计，也学过一点编程。读研后我想，用 vibe coding，说不定我自己设计的界面也能跑起来，就动手试了试。最初做的是网页，后来也开始做 App 界面。自己一用，就会觉得「这里应该还能更顺手」，忍不住回去再改。做出来、用一用、再改一遍，这个过程很有意思，我就这样慢慢喜欢上了 UI/UX。"}]},{"id":"answers-3","title":"「BASEに興味を持ったきっかけは何ですか。」","menuTitle":"对 BASE 感兴趣的契机","page":"","blocks":[{"type":"prompt","ja":"BASEに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>を\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ったきっかけは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"如果刚才已经聊过北村的访谈，讲完 Scout 和约面谈这段，直接用「先ほどお話しした記事なんですが」接到这次改了什么。"},{"type":"speech","ja":"\u003cruby>以前\u003crt>いぜん\u003c/rt>\u003c/ruby>、ネットで\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>するときにPAY IDを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがあって、BASEのことはその\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>から\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>っていました。\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>、ReDesignerでスカウトをいただいたのが、もっと\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったきっかけです。\u003cruby>面談\u003crt>めんだん\u003c/rt>\u003c/ruby>が\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>まってから、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>どんな\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が、どうやってPAY IDを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っているのか\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になって、BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんたちが\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>の\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>し\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>したときの\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。","zh":"我以前在网上下单时用过 PAY ID，那时候就知道 BASE 了。这次在 ReDesigner 上收到 Scout，是我想进一步了解这家公司的契机。约好面谈后，我很好奇，平常是哪些人在做 PAY ID，他们又是怎么一起做的。于是我去 BASE 集团的官方 note，读了北村先生和同事们谈商品搜索改版的访谈。"},{"type":"speech","ja":"\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>ったのは、\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>したいという\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>です。\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>から\u003cruby>更新\u003crt>こうしん\u003c/rt>\u003c/ruby>のお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てみたら、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>にお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>のページでキーワード\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>ができて、\u003cruby>新\u003crt>しん\u003c/rt>\u003c/ruby>\u003cruby>着順\u003crt>ちゃくじゅん\u003c/rt>\u003c/ruby>にも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようになっていたんです。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>もよくネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をするんですが、レコードを\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めるのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、まずはお\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>りのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をのぞいて、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しく\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったかなって\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>るんです。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>もそういう\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>をするので、あの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>になるまでにチームでどんな\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>をされたのか、\u003cruby>直接\u003crt>ちょくせつ\u003c/rt>\u003c/ruby>\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってみたくなりました。","zh":"我印象很深的是，有买家想在自己喜欢的那家店里找东西。我顺着访谈点开更新说明，看到了团队怎么改店铺页面。现在进去就能用关键词搜这家店的商品，也能按上新顺序看。我平时也常网购，尤其喜欢收集唱片。买唱片时，我会先去常逛的店看看最近新到了什么。我平时就是这样逛的，所以特别想听参与设计的人聊聊，从听到这些声音，到最后做成现在的界面，大家中间都讨论了些什么。"}]},{"id":"answers-4","title":"「BASEのどこに魅力を感じましたか。」","menuTitle":"BASE 的什么地方吸引我","page":"","blocks":[{"type":"prompt","ja":"BASEのどこに\u003cruby>魅力\u003crt>みりょく\u003c/rt>\u003c/ruby>を\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じましたか。","zh":""},{"type":"note","ja":"","zh":"如果紧接上一题，出处已经说过，第二句从「先ほどの検索の記事なんですが、商品を細かく…」接即可。"},{"type":"speech","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>にとって\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>なものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るときに、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>無理\u003crt>むり\u003c/rt>\u003c/ruby>なく\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けてもらえるかまで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えているところです。BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>したチームの\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かく\u003cruby>絞\u003crt>しぼ\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>めるようにするには、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>分類\u003crt>ぶんるい\u003c/rt>\u003c/ruby>が\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>だったそうです。お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>全部\u003crt>ぜんぶ\u003c/rt>\u003c/ruby>\u003cruby>入力\u003crt>にゅうりょく\u003c/rt>\u003c/ruby>してもらうのは\u003cruby>大変\u003crt>たいへん\u003c/rt>\u003c/ruby>なので、チームでは、おすすめ\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すためにAIで\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けていた\u003cruby>分類\u003crt>ぶんるい\u003c/rt>\u003c/ruby>を、\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>にも\u003cruby>活用\u003crt>かつよう\u003c/rt>\u003c/ruby>したそうです。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をしていたときは、\u003cruby>絞\u003crt>しぼ\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>みが\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っても、その\u003cruby>分類\u003crt>ぶんるい\u003c/rt>\u003c/ruby>を\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>けるのかまでは\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていませんでした。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>も、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>こう\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>にいる\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>まで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるようになりたいです。","zh":"吸引我的是，做一个让买家更方便的东西时，你们也会想，店家能不能不费劲地一直用下去。我在 BASE 集团官方 note 读了 PAY ID 搜索改版团队的访谈。想让买家筛得更细，就要给每一件商品分类。让店家全部手填很费工夫，所以团队把原来为商品推荐自动加上的 AI 分类，也用到了商品搜索里。我自己购物时也会觉得筛选很方便，却很少想到是谁给商品分的类。我也想学会在做设计时，多想到屏幕另一头那个要负责这件事的人。"}]},{"id":"answers-5","title":"「PAY IDを使ってみて、どんなところがよかったですか。」","menuTitle":"用 PAY ID 逛唱片店，哪里方便","page":"","blocks":[{"type":"prompt","ja":"PAY IDを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってみて、どんなところがよかったですか。","zh":""},{"type":"note","ja":"","zh":"自己喜欢的是能回到同一家店，讲购物前后有什么变化。"},{"type":"speech","ja":"\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>ったお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>のときも\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>りやすいところです。レコードを\u003cruby>集\u003crt>あつ\u003c/rt>\u003c/ruby>めているので、\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>はそろそろ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったかなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うたびに、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>\u003cruby>軒\u003crt>けん\u003c/rt>\u003c/ruby>かのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>のサイトを\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>いていました。PAY IDだと、\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなレコード\u003cruby>店\u003crt>てん\u003c/rt>\u003c/ruby>をフォローしておけば、\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>\u003cruby>軒\u003crt>けん\u003c/rt>\u003c/ruby>\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>もの\u003cruby>新着\u003crt>しんちゃく\u003c/rt>\u003c/ruby>をアプリでまとめて\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるんです。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>\u003cruby>欲\u003crt>ほ\u003c/rt>\u003c/ruby>しい\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>がなくても、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>るか\u003cruby>楽\u003crt>たの\u003c/rt>\u003c/ruby>しみに\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>てるのが、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>には\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っています。","zh":"我喜欢的是，下次上新时，很容易再回到已经看中的那家店。我收集唱片，以前每次觉得差不多该进新货了，就得把几家店的网站挨个打开。现在在 PAY ID 里关注喜欢的唱片店，就能在一个 App 里看这几家的上新。这次没找到想要的那张，我也愿意等着看下次会进什么。这很合我的习惯。"},{"type":"reply","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をフォローして\u003cruby>新着\u003crt>しんちゃく\u003c/rt>\u003c/ruby>を\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>ることは、ShopifyのShopでもできますね。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がPAY IDで\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>っているのは、BASEを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っているレコード\u003cruby>店\u003crt>てん\u003c/rt>\u003c/ruby>を\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>\u003cruby>軒\u003crt>けん\u003c/rt>\u003c/ruby>かまとめて\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>回\u003crt>まわ\u003c/rt>\u003c/ruby>れるところです。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>いたい\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>が\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>まっていない\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>にも、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をのぞく\u003cruby>楽\u003crt>たの\u003c/rt>\u003c/ruby>しみがあるんです。","zh":"Shopify 的 Shop 也能关注店铺、看上新。我喜欢 PAY ID，是因为我能在里面一起逛几家用 BASE 开店的唱片店。即使当天还没决定要买哪张，光看看店里有什么也很有意思。","cue":"如果对方问「ほかの買い物アプリと比べて、どうですか？」"}]},{"id":"answers-6","title":"「UI/UXでは、今どんなことに興味がありますか。」","menuTitle":"现在对 UI/UX 的哪部分感兴趣","page":"","blocks":[{"type":"prompt","ja":"UI/UXでは、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どんなことに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>がありますか。","zh":""},{"type":"note","ja":"","zh":"先说现在想练习如何向使用者发问。对方想听 BASE 的具体案例时，再补搜索访谈。"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っている\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>くところに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>があります。「ここ、ちょっと\u003cruby>面倒\u003crt>めんどう\u003c/rt>\u003c/ruby>で」と\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>われたら、つい「じゃあ、こう\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えたらどうかな」と\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えてしまうんですけど、その\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に「\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>はどうされてるんですか」って\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいんです。その\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>なりに\u003cruby>工夫\u003crt>くふう\u003c/rt>\u003c/ruby>していることが\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれば、こちらが\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>って\u003cruby>足\u003crt>た\u003c/rt>\u003c/ruby>そうとしていたものも、\u003cruby>実\u003crt>じつ\u003c/rt>\u003c/ruby>は\u003cruby>要\u003crt>い\u003c/rt>\u003c/ruby>らないかもしれない。そういう\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いたうえで、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るか\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるようになりたいです。","zh":"我现在对怎么听用户聊自己的经历很感兴趣。有人说「这个地方有点麻烦」，我很容易马上就想「那改成这样会不会好一点？」但我想学着先多问一句，「您平时是怎么做的呢？」要是听到他自己已经有一套顺手的办法，那我原以为很方便、想加进去的东西，也许根本用不着。我想学的是，先听到这些，再决定要做什么。"}]},{"id":"answers-7","title":"「どんな仕事に関わってみたいですか。」","menuTitle":"入职后想做什么工作","page":"","blocks":[{"type":"prompt","ja":"どんな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>に\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わってみたいですか。","zh":""},{"type":"note","ja":"","zh":"想参与哪类工作先讲清，再讲入职初期准备怎么一步步学。"},{"type":"speech","ja":"PAY IDで、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>ったあとに\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>や\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いの\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ってみたいです。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>からすると、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どうなっているかを\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたい\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>ですけど、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>がいつ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しているかを\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>が\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らないと、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすく\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えられないと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。\u003cruby>新卒\u003crt>しんそつ\u003c/rt>\u003c/ruby>デザイナーの\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページで、\u003cruby>新人研修\u003crt>しんじんけんしゅう\u003c/rt>\u003c/ruby>のあと、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>半年\u003crt>はんとし\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>年\u003crt>ねん\u003c/rt>\u003c/ruby>ほどは\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>のもとで\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>学\u003crt>まな\u003c/rt>\u003c/ruby>んでいくと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。まずはそういう\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>通\u003crt>とお\u003c/rt>\u003c/ruby>して、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つの\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>が\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>とお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にそれぞれどう\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えているのかを\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいです。","zh":"我想参与 PAY ID 里买完东西后查看订单和付款情况的界面设计。买家当然想知道「现在到哪儿了」，但我自己要是都不清楚店家这时在确认什么，就很难跟买家讲清楚。我在新卒设计师招聘页读到，新人入职培训结束后，最初半年到一年左右会跟着前辈学实际工作。我想先借这些工作弄明白，同一笔订单，从买家和店家那边看分别是什么样的。"}]},{"id":"answers-8","title":"「買い物のあとの、どんなところが気になりますか。」","menuTitle":"购物之后最在意什么","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>のあとの、どんなところが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になりますか。","zh":""},{"type":"note","ja":"","zh":"上一题已经讲了订单。追问直接说明买家要作的一个判断。"},{"type":"speech","ja":"\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>したあと、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>がまだ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>かする\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>があるのかが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になります。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えばあと\u003cruby>払\u003crt>ばら\u003c/rt>\u003c/ruby>いを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだら、\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>はできていても\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いはこれからなので、いつまでに\u003cruby>払\u003crt>はら\u003c/rt>\u003c/ruby>えばいいのか、すぐに\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できると\u003cruby>安心\u003crt>あんしん\u003c/rt>\u003c/ruby>です。","zh":"我在意的是，下完单以后，我自己还有没有事情要做。比如选了后付，订单已经成立，但钱还要之后再付，如果能马上查到最晚哪天要付，我就放心了。"}]},{"id":"answers-9","title":"「大学院では、何を研究しているんですか。」","menuTitle":"大学院的研究","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>では、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>しているんですか。","zh":""},{"type":"note","ja":"","zh":"先讲希望谁看懂什么，再用一句日常说法解释题材，最后说你具体做的事。"},{"type":"speech","ja":"\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>で\u003cruby>昔\u003crt>むかし\u003c/rt>\u003c/ruby>、\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いごとや\u003cruby>厄\u003crt>やく\u003c/rt>\u003c/ruby>よけのために\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>われていた「\u003cruby>護符\u003crt>ごふ\u003c/rt>\u003c/ruby>」を\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>しています。\u003cruby>日本\u003crt>にっぽん\u003c/rt>\u003c/ruby>でいうお\u003cruby>守\u003crt>まも\u003c/rt>\u003c/ruby>りに\u003cruby>近\u003crt>ちか\u003c/rt>\u003c/ruby>いものです。もともと\u003cruby>昔\u003crt>むかし\u003c/rt>\u003c/ruby>の\u003cruby>文化\u003crt>ぶんか\u003c/rt>\u003c/ruby>や\u003cruby>歴史\u003crt>れきし\u003c/rt>\u003c/ruby>が\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、この\u003cruby>題材\u003crt>だいざい\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>護符\u003crt>ごふ\u003c/rt>\u003c/ruby>に\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>かれた\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>や\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べて、\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にどんな\u003cruby>特徴\u003crt>とくちょう\u003c/rt>\u003c/ruby>があるのかを\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べています。\u003cruby>最終的\u003crt>さいしゅうてき\u003c/rt>\u003c/ruby>には\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>の\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>にして、\u003cruby>日本\u003crt>にっぽん\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にも、\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>ではこういう\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>で\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いを\u003cruby>託\u003crt>たく\u003c/rt>\u003c/ruby>していたんだなと\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じてもらえたらと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っています。","zh":"我研究的是中国过去用来祈愿、避灾的护符，和日本的护身符有点像。我本来就喜欢历史和传统文化，所以选了这个题材。现在我会把护符上的字和图放在一起比较，看看它们在形态上有哪些特点。最后我想做成一本书，让日本读者翻看的时候，也能体会到中国人过去是怎样用这样的形式寄托心愿的。"},{"type":"reply","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がデザインとして\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えているのは、\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>にするときの\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せ\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>です。\u003cruby>護符\u003crt>ごふ\u003c/rt>\u003c/ruby>に\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>かれた\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>の\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いって、\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>だけで\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>しようとすると、かえって\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりにくいんです。だったら\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>を\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べて、\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んだ\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>がご\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いに\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づけるようにしたい。\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えて、どこを\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらうかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるのが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>いです。","zh":"我做这项研究时需要用到设计的地方，是怎么把它呈现在书里。护符上那些形状有什么不同，光用文字解释，有时越说越难懂。所以我想把图并排放，让读者自己也能看出差别。我觉得有意思的是，要判断哪里用语言讲，哪里让人亲眼看会更明白。","cue":"如果对方问「その研究は、デザインとどうつながるんですか。」"}]},{"id":"answers-10","title":"「学生時代に力を入れたことは何ですか。」","menuTitle":"学生时代投入最多的事","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>学生時代\u003crt>がくせいじだい\u003c/rt>\u003c/ruby>に\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れたことは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"讲自己主动承担了什么，为什么提议、怎么和同事做，以及团队持续运营的结果。"},{"type":"speech","ja":"\u003cruby>美大\u003crt>びだい\u003c/rt>\u003c/ruby>\u003cruby>受験\u003crt>じゅけん\u003c/rt>\u003c/ruby>の\u003cruby>予備校\u003crt>よびこう\u003c/rt>\u003c/ruby>で、SNSの\u003cruby>発信\u003crt>はっしん\u003c/rt>\u003c/ruby>を\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>したことです。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>広報\u003crt>こうほう\u003c/rt>\u003c/ruby>\u003cruby>用\u003crt>よう\u003c/rt>\u003c/ruby>の\u003cruby>画像\u003crt>がぞう\u003c/rt>\u003c/ruby>などを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っていたんですが、\u003cruby>学校\u003crt>がっこう\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>し\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めた\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>と、もう\u003cruby>出願\u003crt>しゅつがん\u003c/rt>\u003c/ruby>の\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>をしている\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>では、\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいことが\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うと\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じました。それで、\u003cruby>学校\u003crt>がっこう\u003c/rt>\u003c/ruby>\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びやポートフォリオの\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>など、\u003cruby>相手\u003crt>あいて\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>発信\u003crt>はっしん\u003c/rt>\u003c/ruby>する\u003cruby>内容\u003crt>ないよう\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えてみたいと、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>から\u003cruby>運営\u003crt>うんえい\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>に\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>しました。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>と\u003cruby>投稿\u003crt>とうこう\u003c/rt>\u003c/ruby>\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>の\u003cruby>振\u003crt>ふ\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>りを\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>して、\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>や\u003cruby>投稿\u003crt>とうこう\u003c/rt>\u003c/ruby>はチームで\u003cruby>分担\u003crt>ぶんたん\u003c/rt>\u003c/ruby>しました。\u003cruby>運用\u003crt>うんよう\u003c/rt>\u003c/ruby>を\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けるうちに、ゼロから\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたアカウントのフォロワーが\u003cruby>千\u003crt>せん\u003c/rt>\u003c/ruby>\u003cruby>人\u003crt>にん\u003c/rt>\u003c/ruby>ほどになり、\u003cruby>問\u003crt>と\u003c/rt>\u003c/ruby>い\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせも\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えました。","zh":"我投入最多的一件事，是在一家美术升学机构策划社媒内容。一开始我负责做宣传图，后来发现，刚开始选学校的人和正在准备出愿的人，关心的东西不一样。于是我主动去找负责人商量，能不能按学生现在需要什么，分别做选校、作品集准备之类的内容。我负责策划和发布后的复盘，制作和发布由团队分工。大家持续运营下来，账号从零涨到了大约一千个关注，咨询也多了起来。"},{"type":"reply","ja":"\u003cruby>難\u003crt>むずか\u003c/rt>\u003c/ruby>しかったのは、\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>める\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>える\u003cruby>投稿\u003crt>とうこう\u003c/rt>\u003c/ruby>なのかをチームで\u003cruby>揃\u003crt>そろ\u003c/rt>\u003c/ruby>えておくことでした。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>は、\u003cruby>反応\u003crt>はんのう\u003c/rt>\u003c/ruby>があまりなかった\u003cruby>投稿\u003crt>とうこう\u003c/rt>\u003c/ruby>を\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>から\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>私自身\u003crt>わたしじしん\u003c/rt>\u003c/ruby>も「これは\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>に\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んでほしかったんだろう」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うことがあって。それで、\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>める\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>けたい\u003cruby>相手\u003crt>あいて\u003c/rt>\u003c/ruby>と\u003cruby>内容\u003crt>ないよう\u003c/rt>\u003c/ruby>をチームで\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>してから\u003cruby>分担\u003crt>ぶんたん\u003c/rt>\u003c/ruby>を\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めるようにしました。","zh":"最难的是，在开始制作前，先和大家说清楚「这条内容要给谁看，想告诉他什么」。刚开始有些帖子反响不大，我自己回头看，也说不准原本最想让谁来读。后来我们就改成先一起聊清楚这一篇写给谁、要讲什么，再分头去做。","cue":"如果对方问「SNSを続ける中で、何が一番難しかったですか。」"}]},{"id":"answers-11","title":"「PAY IDは使ったことがありますか。」","menuTitle":"用 PAY ID 下单的体验","page":"","blocks":[{"type":"prompt","ja":"PAY IDは\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがありますか。","zh":""},{"type":"note","ja":"","zh":"先说自己在哪一步用过。对方若只想确认，用第一句就够。"},{"type":"speech","ja":"はい、ネットで\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>するときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがあります。\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うのは、PAY IDが\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>なら、\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>うときも、\u003cruby>登録\u003crt>とうろく\u003c/rt>\u003c/ruby>してある\u003cruby>住所\u003crt>じゅうしょ\u003c/rt>\u003c/ruby>をそのまま\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるところです。\u003cruby>欲\u003crt>ほ\u003c/rt>\u003c/ruby>しいものを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>び\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わって、そのまま\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めるのはありがたいです。","zh":"用过，我网购下单时用过。觉得方便的是，换到另一家支持 PAY ID 的店，也可以直接用已经存好的地址。东西都挑好了，接着就能下单，这一步对我挺省事的。"}]},{"id":"answers-12","title":"「買う側として、どういう使い方が自分に合っていると思いますか。」","menuTitle":"我平常怎么挑唱片","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>として、どういう\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>っていると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いますか。","zh":""},{"type":"note","ja":"","zh":"问你的购物习惯，从喜欢一家唱片店说到什么时候愿意再回来。如果刚讲过关注，直接说「そのお店の品ぞろえも気になるんです」。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>なら、\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなレコード\u003cruby>屋\u003crt>や\u003c/rt>\u003c/ruby>さんにどんなものが\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったかをのぞいて、その\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶ、という\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>ですね。レコードって、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>によって\u003cruby>品\u003crt>しな\u003c/rt>\u003c/ruby>ぞろえがかなり\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うんです。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>は\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>していた\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>がなくても、「このお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>仕入\u003crt>しい\u003c/rt>\u003c/ruby>れるんだろう」と\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になる。そうやってお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>ごとの\u003cruby>品\u003crt>しな\u003c/rt>\u003c/ruby>ぞろえを\u003cruby>楽\u003crt>たの\u003c/rt>\u003c/ruby>しみながら\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きです。","zh":"我喜欢看看常逛的几家唱片店最近进了什么，再从里面挑一张。唱片这东西，每家店的选品还真不一样。即使今天没碰上想找的那一张，我也会好奇「这家下次又会进什么呢？」逛的时候能看到每家店自己的眼光，这就是我喜欢的地方。"}]},{"id":"answers-13","title":"「お店の方にとっては、どう役に立つと思いましたか。」","menuTitle":"PAY ID 对店主的帮助","page":"","blocks":[{"type":"prompt","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にとっては、どう\u003cruby>役\u003crt>やく\u003c/rt>\u003c/ruby>に\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>つと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いましたか。","zh":""},{"type":"note","ja":"","zh":"换到店家的位置，讲一次店家确实用过的做法。"},{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にとっては、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しくいいものが\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ったときに、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cr
