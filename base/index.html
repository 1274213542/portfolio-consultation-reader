<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131715">
<title>BASE · カジュアル面談</title>
<style>
:root {
  color-scheme: dark;
  --bg: #131715; --panel: #1b211e; --raised: #26302a; --bound: #38433c;
  --ink: #f2f4ed; --soft: #c0c9c1; --muted: #a1b0a5; --accent: #a5ddba;
  --body-size: 20px; --leading: 2.05; --letters: .015em; --ruby-size: .42em; --ruby-gap: 1px;
  --shell-width: 790px; --bar-top: 62px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-top) + env(safe-area-inset-top) + 12px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","PingFang SC","Noto Sans CJK SC",sans-serif; }
button,input,output { font: inherit; }
button { color: inherit; cursor: pointer; }
a { color: var(--accent); }
button,summary,a,input { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button { border: 0; }
[hidden] { display: none !important; }
.shell,main { max-width: var(--shell-width); margin-inline: auto; }
.bar { position: sticky; top: 0; z-index: 3; padding-top: env(safe-area-inset-top); background: var(--bg); border-bottom: 1px solid var(--bound); }
.bar .shell { min-height: var(--bar-top); display: flex; align-items: center; gap: 16px; padding: 9px 20px; }
.brand-mark { width: 4px; height: 27px; background: var(--accent); border-radius: 3px; flex: none; }
.brand { flex: none; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .015em; }
.brand small { color: var(--muted); display: block; font: 600 10px/1.4 -apple-system,BlinkMacSystemFont,sans-serif; letter-spacing: .12em; }
.location { color: var(--soft); background: none; border-radius: 6px; font-size: 13px; margin-left: auto; padding: 8px 0 8px 8px; min-width: 0; display: flex; align-items: center; gap: 8px; }
.location .where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { display: inline-block; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin: -3px 3px 0 0; flex: none; }
main { padding: 20px 20px 108px; padding-bottom: calc(108px + env(safe-area-inset-bottom)); }
.section-head { margin: 0 0 13px; display: flex; align-items: baseline; gap: 12px; }
.section-head h2 { margin: 0; font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -.03em; }
.reader-section + .reader-section { margin-top: 42px; }
.group + .group { margin-top: 26px; }
.groupname { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 10px; }
.card { background: var(--panel); border: 1px solid var(--bound); border-radius: 12px; padding: 17px 20px 19px; }
.card + .card { margin-top: 12px; }
.card:focus { outline: none; }
.card:focus-visible { outline: 2px solid var(--accent); }
.card-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
.card-head h4 { font-size: 15px; line-height: 1.55; margin: 0; font-weight: 600; color: var(--soft); overflow-wrap: anywhere; }
.page { flex: none; color: var(--accent); font: 650 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; text-decoration: none; white-space: normal; max-width: 9em; }
.page a { color: inherit; text-decoration: none; border-bottom: 1px solid #698573; padding-block: 5px; }
.block + .block { margin-top: 12px; }
.block-page { display: block; margin-bottom: 6px; }
.jp { margin: 0; color: var(--ink); font-family: -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo","Noto Sans JP",sans-serif; font-size: var(--body-size); line-height: var(--leading); font-weight: 520; letter-spacing: var(--letters); overflow-wrap: anywhere; line-break: strict; }
ruby { ruby-align: center; ruby-position: over; }
rt { font-size: var(--ruby-size); letter-spacing: 0; font-weight: 550; color: var(--accent); line-height: 1; position: relative; top: calc(0px - var(--ruby-gap)); }
html.no-ruby rt,html.no-ruby rp { display: none; }
html.no-ruby ruby { display: inline; }
.zh { font-size: clamp(14px, .80em + 2px, 18px); line-height: 1.85; color: var(--soft); margin: 10px 0 0; border-left: 2px solid #587964; padding-left: 11px; overflow-wrap: anywhere; white-space: pre-line; }
.note { color: var(--muted); font-size: 14px; }
.article-source { display: inline-block; margin-top: 14px; padding-block: 5px; font-size: 14px; text-underline-offset: 3px; }
.note .zh:only-child { margin: 0; border-left: 0; padding-left: 0; }
.prompt .jp { color: #dbecdf; font-weight: 640; }
.prompt + .speech { margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--bound); }
html.no-zh .translation { display: none; }
.dock { position: fixed; z-index: 4; bottom: 0; inset-inline: 0; background: var(--panel); border-top: 1px solid var(--bound); padding-bottom: env(safe-area-inset-bottom); }
.dock .shell { height: 62px; padding-inline: 13px; display: grid; grid-template-columns: 1.15fr 1fr 1fr 1fr; align-items: center; gap: 6px; }
.dock button { min-height: 43px; min-width: 0; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; color: var(--soft); background: transparent; }
.dock button:first-child { background: #32483a; color: #def4e5; font-weight: 650; }
.dock button[aria-pressed="true"] { color: var(--accent); }
.dock button[aria-pressed="true"] .lamp { background: var(--accent); }
.lamp { width: 6px; height: 6px; display: inline-block; border: 1px solid currentColor; border-radius: 50%; }
.line-icon { font-size: 18px; line-height: 1; }
dialog { margin: auto auto 0; width: min(100%,640px); max-height: min(84vh,810px); max-height: min(84dvh,810px); color: var(--ink); background: var(--panel); border: 1px solid var(--bound); border-bottom: none; border-radius: 18px 18px 0 0; padding: 0; overflow: hidden; }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgb(3 6 4 / .66); }
body.modal-open { overflow: hidden; }
.sheet-top { display: flex; align-items: center; padding: 15px 19px 8px; gap: 8px; }
.sheet-top h2 { flex: 1; margin: 0; font-size: 20px; }
.dismiss { align-self: center; color: var(--soft); background: var(--raised); min-height: 39px; padding: 4px 13px; border-radius: 8px; }
.sheet-tools { padding: 0 18px; }
.tabs { display: flex; gap: 5px; margin: 8px 0; flex-wrap: wrap; }
.tab { margin: 0; padding: 6px 9px; min-height: 38px; font-size: 13px; line-height: 1.4; background: transparent; color: var(--soft); border-radius: 7px; border: 1px solid var(--bound); }
.tab[aria-pressed="true"] { background: #304237; color: #d0f1db; border-color: #709581; }
.search { display: block; width: 100%; border-radius: 8px; border: 1px solid var(--bound); padding: 9px 12px; color: var(--ink); background: var(--bg); font-size: 16px; appearance: none; }
.search::placeholder { color: var(--muted); opacity: 1; }
.sheet-scroll { overflow-y: auto; overscroll-behavior: contain; padding: 12px 18px max(20px, env(safe-area-inset-bottom)); min-height: 0; }
#contents .sheet-scroll { min-height: min(26vh,220px); }
.toc-group { border-bottom: 1px solid var(--bound); }
.toc-group summary { padding: 12px 2px; font-weight: 620; color: var(--ink); cursor: pointer; }
.toc-link { display: flex; align-items: baseline; text-decoration: none; min-height: 43px; gap: 12px; padding: 10px 10px; font-size: 14px; color: var(--soft); border-radius: 5px; overflow-wrap: anywhere; }
.toc-link .page { min-width: 3em; }
.toc-link[aria-current="location"] { background: #304237; color: var(--ink); }
.no-results { color: var(--muted); margin: 14px 0; }
.control { margin: 0 0 17px; }
.control label { display: flex; align-items: baseline; justify-content: space-between; color: var(--soft); font-weight: 550; }
.control output { color: var(--accent); font: 600 13px ui-monospace,monospace; }
.control input { display: block; width: 100%; accent-color: var(--accent); min-height: 35px; margin: 3px 0; }
.sample { padding: 9px 13px; border: 1px solid var(--bound); border-radius: 8px; background: var(--bg); margin: 8px 18px 0; }
.reset { padding: 8px 13px; min-height: 40px; color: var(--soft); background: var(--raised); border-radius: 7px; }
@media (min-width: 760px) {
 main { padding-top: 35px; } .card { padding: 21px 26px 23px; }
 dialog { margin: auto; max-height: min(82vh,780px); border-bottom: 1px solid var(--bound); border-radius: 15px; }
}
@media (max-width: 390px) {
 .bar .shell { gap: 9px; padding-inline: 12px; }
 main { padding-inline: 11px; } .card { padding: 13px; }
 .dock .shell { padding-inline: 7px; gap: 2px; } .dock button { gap: 4px; }
 .sheet-tools,.sheet-scroll { padding-inline: 12px; } .tab { padding-inline: 7px; }
}

.popup { display: none; flex: none; color: var(--soft); background: var(--raised); border: 1px solid var(--bound); border-radius: 7px; min-height: 40px; padding: 5px 12px; }
@media (min-width: 760px) { html:not(.compact) .popup { display: inline-block; } }
html.compact { --bar-top: 49px; }
html.compact .bar .shell { gap: 8px; padding: 6px 10px; }
html.compact .brand h1 { font-size: 14px; }
html.compact .brand small { font-size: 9px; }
html.compact main { padding: 11px 10px calc(66px + env(safe-area-inset-bottom)); }
html.compact .section-head h2 { font-size: 19px; }
html.compact .reader-section + .reader-section { margin-top: 24px; }
html.compact .card { padding: 11px 12px; border-radius: 8px; }
html.compact .dock .shell { height: 49px; }
html.compact .dock button { min-height: 42px; font-size: 13px; }
html.native-mini,html.native-mini body { background: transparent; }
html.native-mini .bar,html.native-mini .dock,html.native-mini .card { background: rgb(22 30 25 / .90); }
html.native-mini main { background: rgb(20 27 22 / .80); }
.card[data-reverse] .card-head { justify-content: space-between; }
.audience { flex: none; font-size: 12px; color: var(--accent); }
.basis .zh,.value .zh { margin-top: 0; border-left: none; padding: 0; }
.basis .zh::before { content: "已知 · "; color: var(--muted); }
.value .zh::before { content: "想确认 · "; color: var(--muted); }
.question-notes { margin-top: 12px; }
.question-notes summary { color: var(--muted); font-size: 13px; cursor: pointer; padding-block: 7px; }
.review-tools,.review-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.review-tools label { color: var(--soft); font-size: 13px; }
.review-tools select,.review-actions button,.review-tools button { font: inherit; color: var(--ink); border: 1px solid var(--bound); border-radius: 7px; background: var(--raised); min-height: 40px; padding: 5px 10px; }
.review-actions button { font-size: 13px; }
.review-actions button[aria-pressed="true"] { color: #def4e5; border-color: var(--accent); }
.review-status { margin: 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.toc-link .q-state { flex: none; margin-left: auto; color: var(--accent); font-size: 12px; }
</style>
</head>
<body>
<header class="bar"><div class="shell"><span class="brand-mark" aria-hidden="true"></span><div class="brand"><small>BASE · PAY ID</small><h1>面谈口述</h1></div><button class="location" id="location" type="button" aria-label="当前位置，打开目录" aria-haspopup="dialog" aria-controls="contents"><span class="where" id="where"></span><span class="chev" aria-hidden="true"></span></button><button id="popup" class="popup" type="button">小窗</button></div></header>
<main id="reader"></main>
<nav class="dock" aria-label="阅读工具"><div class="shell">
<button type="button" id="toc-button" aria-haspopup="dialog" aria-controls="contents"><span class="line-icon" aria-hidden="true">☰</span>目录</button>
<button type="button" id="zh-button" aria-pressed="true" aria-label="中文对照"><span class="lamp" aria-hidden="true"></span>中文</button>
<button type="button" id="ruby-button" aria-pressed="true" aria-label="日语假名"><span class="lamp" aria-hidden="true"></span>假名</button>
<button type="button" id="settings-button" aria-haspopup="dialog" aria-controls="settings"><b aria-hidden="true">Aa</b>排版</button>
</div></nav>
<dialog id="contents" aria-labelledby="contents-title">
<div class="sheet-top"><h2 id="contents-title">目录</h2><button class="dismiss" type="button" data-close>关闭</button></div>
<div class="sheet-tools"><div class="tabs" id="toc-tabs" aria-label="目录栏目"></div><input class="search" id="toc-search" type="search" placeholder="搜索当前栏目" aria-label="搜索当前栏目" autocomplete="off"><div class="review-tools" id="review-tools" hidden><label for="review-filter">审核：</label><select id="review-filter"><option value="all">全部</option><option value="priority">优先候选</option><option value="pending">待审</option><option value="keep">保留</option><option value="skip">跳过</option></select><button id="review-export" type="button">复制审核清单</button><p class="review-status" id="review-count" aria-live="polite"></p></div></div>
<div class="sheet-scroll" id="toc-list"></div>
</dialog>
<dialog id="settings" aria-labelledby="settings-title">
<div class="sheet-top"><h2 id="settings-title">阅读排版</h2><button class="dismiss" type="button" data-close>关闭</button></div>
<div class="sample" lang="ja"><p class="jp"><ruby>作品<rt>さくひん</rt></ruby>を<ruby>紹介<rt>しょうかい</rt></ruby>します。</p></div>
<div class="sheet-scroll"><div id="settings-controls"></div><button class="reset" type="button" id="reset">恢复默认排版</button></div>
</dialog>
<script id="reader-data" type="application/json">{"sections":[{"id":"opening","label":"开场","kind":"flow","groups":[{"id":"opening","label":"问候和自我介绍","items":[{"id":"opening-1","title":"刚上线","page":"","blocks":[{"type":"speech","ja":"\u003cruby>本日\u003crt>ほんじつ\u003c/rt>\u003c/ruby>はお\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>をいただき、ありがとうございます。よろしくお\u003cruby>願\u003crt>ねが\u003c/rt>\u003c/ruby>いします。","zh":"谢谢两位今天抽时间。请多关照。"}]},{"id":"opening-2","title":"对方请你自我介绍","page":"","blocks":[{"type":"speech","ja":"ZHANG ZIRUIです。\u003cruby>武蔵野美術大学\u003crt>むさしのびじゅつだいがく\u003c/rt>\u003c/ruby>の\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>に\u003cruby>通\u003crt>かよ\u003c/rt>\u003c/ruby>っています。\u003cruby>学部\u003crt>がくぶ\u003c/rt>\u003c/ruby>ではグラフィックデザインをやっていました。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>の\u003cruby>昔\u003crt>むかし\u003c/rt>\u003c/ruby>のお\u003cruby>札\u003crt>さつ\u003c/rt>\u003c/ruby>に\u003cruby>描\u003crt>えが\u003c/rt>\u003c/ruby>かれた\u003cruby>文字\u003crt>もじ\u003c/rt>\u003c/ruby>や\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>を\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>しています。UI/UXは\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>ってからで、YouTubeを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ながら、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>でも\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ってみたのが\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>まりです。","zh":"我叫ZHANG ZIRUI，在武藏野美术大学读研。本科学的是平面设计，现在研究中国古代符箓上的文字和图形。UI/UX是读研后开始接触的，一开始是看着YouTube，自己也试着做界面。"}]},{"id":"opening-3","title":"如果问今天最想了解什么","page":"","blocks":[{"type":"speech","ja":"PAY IDの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るときって、デザイナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>は\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>や\u003cruby>開発\u003crt>かいはつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>と、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にどんな\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>をするんだろうと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っていました。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>はそのあたりを\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいです。","zh":"我一直好奇做PAY ID界面的时候，设计师一开始会跟企划和开发同事聊些什么。今天就想听听这一块。"}]},{"id":"opening-4","title":"如果问为什么开始做UI/UX","page":"","blocks":[{"type":"speech","ja":"グラフィックをやっていた\u003cruby>頃\u003crt>ころ\u003c/rt>\u003c/ruby>は、どう\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せたら\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えることが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>かったです。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ってみると、「ここを\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>したら\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>るといいだろう」と、\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>がそのあと\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をするかまで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるんですよね。そこが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>くて、\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>けています。","zh":"做平面设计时，我想得比较多的是怎么呈现才看得懂。自己试着做界面以后，还能接着想“点了这里，下一个画面最好出现什么”，也就是看的人接下来会怎么做。我觉得这一点很有意思，所以就一直在做。"}]},{"id":"opening-5","title":"如果北村讲到会在做页面之前参与讨论，可以点出自己刚听懂的一件事，然后停下来","page":"","blocks":[{"type":"note","ja":"","zh":"如果北村讲到会在做页面之前参与讨论，可以点出自己刚听懂的一件事，然后停下来。"},{"type":"speech","ja":"ありがとうございます。デザイナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>も、どこを\u003cruby>改善\u003crt>かいぜん\u003c/rt>\u003c/ruby>するか\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるところから\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わるんですね。","zh":"谢谢。原来设计师从讨论应该先改哪里的阶段就已经参与了。"}]}]},{"id":"sharing","label":"共享与临场短讲","items":[{"id":"sharing-1","title":"共享与临场短讲","page":"","blocks":[{"type":"note","ja":"","zh":"聊到自己的制作、对方还没邀请展示时。"},{"type":"speech","ja":"よろしければ、ポートフォリオを\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>\u003cruby>共有\u003crt>きょうゆう\u003c/rt>\u003c/ruby>して、\u003cruby>簡単\u003crt>かんたん\u003c/rt>\u003c/ruby>にご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>してもいいですか。","zh":"方便的话，我可以共享一下作品集，简单介绍吗？"}]},{"id":"sharing-2","title":"对方已经邀请或者同意时","page":"","blocks":[{"type":"note","ja":"","zh":"对方已经邀请或者同意时。"},{"type":"speech","ja":"ありがとうございます。では、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>共有\u003crt>きょうゆう\u003c/rt>\u003c/ruby>しますね。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えていますか。","zh":"谢谢，那我共享一下屏幕。能看见吗？"}]},{"id":"sharing-3","title":"对方已经邀请或者同意时","page":"","blocks":[{"type":"note","ja":"","zh":"停在P4目录。"},{"type":"speech","ja":"こちらが\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>の\u003cruby>一覧\u003crt>いちらん\u003c/rt>\u003c/ruby>です。UI/UXとグラフィックデザインの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>をまとめています。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つを\u003cruby>簡単\u003crt>かんたん\u003c/rt>\u003c/ruby>にご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>します。","zh":"这里是作品目录，收录了UI/UX和平面设计的作品。我简单介绍一下前两件。"}]},{"id":"sharing-4","title":"如果对方已经看过作品集","page":"","blocks":[{"type":"speech","ja":"ご\u003cruby>覧\u003crt>らん\u003c/rt>\u003c/ruby>いただき、ありがとうございます。\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になった\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>があれば、そのページを\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>きます。","zh":"谢谢您提前看过。如果有您比较在意的作品，我可以打开那一页。"}]},{"id":"sharing-5","title":"如果对方说只够简单看一件","page":"","blocks":[{"type":"note","ja":"","zh":"直接打开P17。下面的介绍约半分钟，供练习用，尚未计时。临时没法共享屏幕时，这段也可单独讲。"},{"type":"speech","ja":"まず「MORI」です。ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>の\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えた\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>です。クーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>って\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>って、\u003cruby>一着\u003crt>いっちゃく\u003c/rt>\u003c/ruby>だけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すとしたら、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るんだろう、と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったんです。そこで、\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すと\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>める\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、カードに\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るお\u003cruby>金\u003crt>かね\u003c/rt>\u003c/ruby>とポイント、それから\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>が\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られるようにしました。","zh":"先讲MORI，是一个网购服装的退货方案。我想到，如果用优惠券和积分买了两件、只想退一件，实际会退多少呢？所以我让人先看到退回卡里的钱、返还的积分和退货运费，再决定退不退。"}]},{"id":"sharing-6","title":"如果他们点名看TUCK，打开P34","page":"","blocks":[{"type":"note","ja":"","zh":"如果他们点名看TUCK，打开P34。"},{"type":"speech","ja":"「TUCK T10」は、アームで\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>を\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>は\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べたと\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たけれど、スリッパの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>は\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からない。そんなときに、まず\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>す\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>があるスリッパを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>し、\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だった\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりとして\u003cruby>示\u003crt>しめ\u003c/rt>\u003c/ruby>しました。","zh":"TUCK T10是带机械臂的扫地机器人的App方案。比如，已经收到袜子搬完的通知，但拖鞋的结果还不知道。这时我先显示需要找的拖鞋，再把原来的位置和原本计划搬到的位置作为线索。"}]}]}]},{"id":"pages","label":"作品","kind":"pages","groups":[{"id":"mori","label":"第一件 MORI","items":[{"id":"p17","title":"P17，先指出成品和退款预估","page":"P17","blocks":[{"type":"speech","ja":"まず「MORI」です。ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>する\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。こちらが、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。カードにいくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るか、ポイントはいくつ\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るかを、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できます。\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>もここで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>られます。","zh":"先讲MORI。我做的是网购服装的退货界面。现在这张是预约取件前的页面，可以分开看到预计退回卡里的金额和返还的积分，退货运费也在这里。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>はネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をするのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えばクーポンとポイントを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってシャツとパンツを\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い、シャツだけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すとしたら、「\u003cruby>結局\u003crt>けっきょく\u003c/rt>\u003c/ruby>いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るんだろう？」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったんです。\u003cruby>費用\u003crt>ひよう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てから\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すか\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>められるよう、このタイミングで\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"我自己喜欢网购，于是想了个场景，比如用优惠券和积分买了衬衫和裤子，只退衬衫时，到底会退多少？所以我在这一步把预估显示出来，让人先看费用，再决定退不退。"}]},{"id":"p21","title":"P21，给对方看最终状态页","page":"P21","blocks":[{"type":"speech","ja":"こちらは、\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>したあとの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>です。\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>していることが、ここで\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>に\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っていればいいので、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>がいつ\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかも\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しています。","zh":"这张是寄回以后的界面，能分别看到包裹已到店和店铺正在检查衣服。这时候只要等，所以我也把下一次通知的时间放在这里。"},{"type":"speech","ja":"「\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>は\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたけど、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っているんだろう？」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うことがありそうだったので、\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことだけでなく、いま\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>の\u003cruby>対応\u003crt>たいおう\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っているかまで\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すようにしました。","zh":"我觉得用户即使知道包裹到了，可能还是会问「我现在在等什么？」所以，我也把正在等谁处理这件事说明了。"}]},{"id":"mori-3","title":"「このテーマを選んだきっかけは何ですか。」","page":"","blocks":[{"type":"prompt","ja":"このテーマを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだきっかけは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"问从哪里发现问题。用你实际查过的公开退货说明，交代它影响了哪项设计。"},{"type":"speech","ja":"\u003cruby>既存\u003crt>きそん\u003c/rt>\u003c/ruby>のサービスの\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べたとき、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>の\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>と\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>の\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>で、\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれることに\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づきました。そこで、シャツを\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>す\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>して、いつ、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かると\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めるかを\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>しました。","zh":"我查现有服务的退货说明时，发现包裹状态和退款进度有时要到不同地方查看。我就设定了只退一件衬衫的场景，梳理在每个阶段需要知道什么，才能决定下一步。"}]},{"id":"mori-4","title":"「この4,800円は、どう計算したんですか。」","page":"","blocks":[{"type":"prompt","ja":"この\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>は、どう\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>したんですか。","zh":""},{"type":"note","ja":"","zh":"问P17的退款额怎么得出。翻P18，先交代订单和分摊比例。"},{"type":"speech","ja":"この\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>では、\u003cruby>6,600円\u003crt>ろくせんろっぴゃくえん\u003c/rt>\u003c/ruby>のシャツと4,400\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>のパンツで、\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>代\u003crt>だい\u003c/rt>\u003c/ruby>が\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて11,000\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>です。シャツが\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>の60％なので、\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>った1,000\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>のクーポンと1,000ポイントも、それぞれ60％をシャツの\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>にしました。","zh":"这笔示例订单里，衬衫6,600日元，裤子4,400日元，商品合计11,000日元。衬衫占60%，所以把订单使用的1,000日元优惠券和1,000积分也分别按60%分给衬衫。"},{"type":"speech","ja":"シャツの\u003cruby>6,600円\u003crt>ろくせんろっぴゃくえん\u003c/rt>\u003c/ruby>から、クーポンの\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>、ポイントで\u003cruby>払\u003crt>はら\u003c/rt>\u003c/ruby>った\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>の\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>、\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>の\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>くと、カードに\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>見込\u003crt>みこ\u003c/rt>\u003c/ruby>みは\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>です。\u003cruby>600ポイント\u003crt>ろっぴゃくぽいんと\u003c/rt>\u003c/ruby>は\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ります。これはこの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>で\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>した\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>ルールで、\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>してから\u003cruby>確定\u003crt>かくてい\u003c/rt>\u003c/ruby>する\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>です。","zh":"从6,600日元里扣掉优惠券分摊的600日元、积分支付的600日元和600日元退货运费，预计退回卡里4,800日元，另外返还600积分。这是作品里设定的计算规则，最终金额以店铺检查完商品为准。"}]},{"id":"mori-5","title":"「どうして、この表示にしたんですか。」","page":"","blocks":[{"type":"prompt","ja":"どうして、この\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>にしたんですか。","zh":""},{"type":"note","ja":"","zh":"对方想看你如何比较方案。翻P14。"},{"type":"speech","ja":"\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>は「\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しています」と、いま\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をしているかを\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きく\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しています。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>なら、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことも\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>を\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたい\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>だと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったので、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>履歴\u003crt>りれき\u003c/rt>\u003c/ruby>や\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かい\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>は、\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なときだけ\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>けるようにしています。","zh":"右边的方案把「正在检查商品」做得很醒目。中间的方案还能一起看见包裹已到。我觉得在这里两件事都需要知道，所以选了中间的方案。物流记录和金额细节需要时再打开看。"}]},{"id":"mori-6","title":"「待つだけでいいと、どう伝えていますか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>つだけでいいと、どう\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えていますか。","zh":""},{"type":"note","ja":"","zh":"问用户下一步如何判断。P21给两个具体情境。"},{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>つときは、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>がいつ\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しています。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、タグが\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>っていたかお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できず、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>してほしい\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>は、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>してほしいかと、\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>ボタンを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"需要等待店铺检查时，我会显示下一次通知什么时候来。比如店铺没有确认到吊牌、需要买家联系时，就把要确认什么以及联系按钮放在前面。"}]},{"id":"mori-7","title":"「P15の数字は、実際に取ったアンケートですか。」","page":"","blocks":[{"type":"prompt","ja":"P15の\u003cruby>数字\u003crt>すうじ\u003c/rt>\u003c/ruby>は、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったアンケートですか。","zh":""},{"type":"note","ja":"","zh":"问数字的来源。第一句就交代假设数据。"},{"type":"speech","ja":"P15は、\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>比較\u003crt>ひかく\u003c/rt>\u003c/ruby>する\u003cruby>方法\u003crt>ほうほう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せるために、\u003cruby>各案\u003crt>かくあん\u003c/rt>\u003c/ruby>に\u003cruby>50件\u003crt>ごじゅっけん\u003c/rt>\u003c/ruby>ずつ\u003cruby>仮\u003crt>かり\u003c/rt>\u003c/ruby>の\u003cruby>回答\u003crt>かいとう\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いたページです。B\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだのは、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>であることを、\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたかったからです。","zh":"P15是为了展示比较方案的方法，每个方案放了50条假设回答。选B案的依据是，我想在同一个界面交代包裹已到和店铺正在检查这两件事。"}]},{"id":"mori-8","title":"「実際に使ってもらって、分かりやすいか確かめましたか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらって、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすいか\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめましたか。","zh":""},{"type":"note","ja":"","zh":"问验证做到哪一步。把下一步说成一个可观察的任务。"},{"type":"speech","ja":"\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらうところまでは、まだできていません。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、この\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>がいくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るか、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>てばいいのかを、ご\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>で\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>してもらいたいです。\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いがあれば、\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>の\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>や\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>します。","zh":"还没做到请用户实际试界面。下一步，我想请他们看界面，用自己的话说明会退回什么、各是多少，以及现在是不是只需要等。如果出现误读，我会回头调整展示顺序和用词。"}]}]},{"id":"tuck","label":"第二件 TUCK T10","items":[{"id":"p34","title":"P34，先指右边采用的方案","page":"P34","blocks":[{"type":"speech","ja":"\u003cruby>続\u003crt>つづ\u003c/rt>\u003c/ruby>いて「TUCK T10」です。アームで\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>を\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>のアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>です。こちらが\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>で、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>では、\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>が\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なスリッパが\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。","zh":"接下来是TUCK T10，是带机械臂的扫地机器人App方案。这是整理结果。我选了右边的方案，先显示需要确认的拖鞋。"},{"type":"speech","ja":"\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけてもらって、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>だけが\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>る。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>だったら、\u003cruby>何個\u003crt>なんこ\u003c/rt>\u003c/ruby>\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったかより、「で、スリッパはどこに\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>ったんだろう？」と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。それで、\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>は\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>の\u003cruby>一行\u003crt>いちぎょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>して、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すものを\u003cruby>目立\u003crt>めだ\u003c/rt>\u003c/ruby>たせました。","zh":"让机器人去整理袜子和拖鞋，但只收到了袜子的通知。换作是我，比起已经完成几件，我会先想「那拖鞋去哪儿了？」所以我把总件数留在上面一行，重点显示接下来要找的东西。"}]},{"id":"p39","title":"P39，沿两处查找线索讲到最后的记录","page":"P39","blocks":[{"type":"speech","ja":"じゃあ、どこから\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すか。ロボットが\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にスリッパを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたのは、ソファの\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>です。\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>っていく\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だったのは、\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>です。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どこにあるかは\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないので、その\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>か\u003cruby>所\u003crt>しょ\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりとして\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"那先去哪儿找呢？机器人一开始是在沙发前发现拖鞋的，原本打算搬到放鞋的地方。现在不知道拖鞋在哪儿，所以我把这两个地方列出来，作为寻找的线索。"},{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>靴\u003crt>くつ\u003c/rt>\u003c/ruby>の\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>にあったら、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>が\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめた\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>として「\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>にあった」と\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>できます。ロボットからの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>は、まだ「\u003cruby>未\u003crt>み\u003c/rt>\u003c/ruby>\u003cruby>受信\u003crt>じゅしん\u003c/rt>\u003c/ruby>」です。\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>で\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ても、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるように、\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>を\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けました。","zh":"比如在放鞋的地方找到了，用户可以在自己的确认记录里选“在预定位置找到”。机器人那一栏仍然是“未收到”。我把两条记录分开，这样后来再看也知道是谁确认的。"}]},{"id":"tuck-3","title":"「実際の製品を調べて作ったんですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>製品\u003crt>せいひん\u003c/rt>\u003c/ruby>を\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べて\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":""},{"type":"note","ja":"","zh":"问灵感和自制范围。P27、P29支持参考产品与自己的设计内容。"},{"type":"speech","ja":"アーム\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>きのロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>を\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べるときに、Roborock Saros Z70の\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>ガイドを\u003cruby>参考\u003crt>さんこう\u003c/rt>\u003c/ruby>にしました。そのうえで、\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>で\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだあと、\u003cruby>移動\u003crt>いどう\u003c/rt>\u003c/ruby>の\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なら\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるところまでを、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>として\u003cruby>設計\u003crt>せっけい\u003c/rt>\u003c/ruby>しました。","zh":"我研究带机械臂的扫地机器人时，参考了Roborock Saros Z70的操作指南。我的方案具体做的是从地图选中物品以后，怎样查看移动结果，必要时又怎样自己确认。"}]},{"id":"tuck-4","title":"「スリッパの移動に失敗したということですか。」","page":"","blocks":[{"type":"prompt","ja":"スリッパの\u003cruby>移動\u003crt>いどう\u003c/rt>\u003c/ruby>に\u003cruby>失敗\u003crt>しっぱい\u003c/rt>\u003c/ruby>したということですか。","zh":""},{"type":"note","ja":"","zh":"问“没有结果”和“失败”的区别。给出当前确知的信息。"},{"type":"speech","ja":"この\u003cruby>時点\u003crt>じてん\u003c/rt>\u003c/ruby>で\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かっているのは、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いていないことです。\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べたかどうかはまだ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないので、\u003cruby>失敗\u003crt>しっぱい\u003c/rt>\u003c/ruby>と\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>せず、\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>す\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"当时能确定的是，结果通知没有收到。搬运是否成功还未知，所以界面提示的是查找线索。"}]},{"id":"tuck-5","title":"「どこまで動くものを作ったんですか。」","page":"","blocks":[{"type":"prompt","ja":"どこまで\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>くものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":""},{"type":"note","ja":"","zh":"问实际做了什么。翻P42，说明试作的对象与确认范围。"},{"type":"speech","ja":"\u003cruby>一時停止\u003crt>いちじていし\u003c/rt>\u003c/ruby>の\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>は、ブラウザーでクリックして\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>せるように\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。ボタンを\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>すと、まず「ロボットの\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っています」と\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>したという\u003cruby>模擬\u003crt>もぎ\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>を\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ると、「\u003cruby>再開\u003crt>さいかい\u003c/rt>\u003c/ruby>する」ボタンが\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるようになります。この\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>替\u003crt>か\u003c/rt>\u003c/ruby>わりを、プロトタイプ\u003cruby>上\u003crt>じょう\u003c/rt>\u003c/ruby>で\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しました。","zh":"我把暂停操作做成了可以在浏览器里点击的原型。按下按钮，先显示“正在等待机器人停止”。收到一条模拟的停止通知后，“继续”按钮才可用。我在原型里确认了这个状态切换。"}]},{"id":"tuck-6","title":"「結果画面も、実際に使ってもらったんですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>も、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらったんですか。","zh":""},{"type":"note","ja":"","zh":"问P34与P39是否做过试用。先给实际状态，再说验证计划。"},{"type":"speech","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらうのは、これからです。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけの\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>で\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べて、どの\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>するかが\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たいです。そのあと、\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>す\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりから\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にどこへ\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>くか、\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したかを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>れるかも\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたいです。","zh":"结果界面还没请用户试过。下一步我想用同一个整理场景比较两个结果界面，看看用户能不能知道该确认哪件物品。接着再看他们能不能根据线索知道该先去哪里找，读记录时能不能看出是谁确认的。"}]},{"id":"p77","title":"P77，四季の花綴り","page":"P77","blocks":[{"type":"speech","ja":"グラフィックの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>でしたら、\u003cruby>卒業制作\u003crt>そつぎょうせいさく\u003c/rt>\u003c/ruby>の「\u003cruby>四季\u003crt>しき\u003c/rt>\u003c/ruby>の\u003cruby>花\u003crt>はな\u003c/rt>\u003c/ruby>\u003cruby>綴\u003crt>つづ\u003c/rt>\u003c/ruby>り」をご\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>します。\u003cruby>季節\u003crt>きせつ\u003c/rt>\u003c/ruby>ごとの\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>し\u003cruby>花\u003crt>ばな\u003c/rt>\u003c/ruby>と\u003cruby>漢詩\u003crt>かんし\u003c/rt>\u003c/ruby>を、ページをめくりながら\u003cruby>楽\u003crt>たの\u003c/rt>\u003c/ruby>しめる\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>です。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>とはまた\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>って、めくったときに\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>るか、という\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるのが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>かったです。","zh":"如果想看平面设计，我可以介绍毕业作品《四季の花綴り》。这是一本翻着看四季的压花和汉诗的书。做这本书时，我觉得有意思的是，读者翻开一页会先看到什么，接下来又会看到什么。"}]},{"id":"tuck-8","title":"介绍说完","page":"","blocks":[{"type":"speech","ja":"\u003cruby>以上\u003crt>いじょう\u003c/rt>\u003c/ruby>が、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>の\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>です。\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になるところがあれば、そのページをもう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>お\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せします。","zh":"以上是前两件作品。如果有想多看一眼的地方，我可以再翻回那页。"}]}]}]},{"id":"questions","label":"问答","kind":"flow","groups":[{"id":"answers","label":"轮到对方问你","items":[{"id":"answers-1","title":"「BASEに興味を持ったきっかけは何ですか。」","page":"","blocks":[{"type":"prompt","ja":"BASEに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>を\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ったきっかけは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"问为什么来聊BASE。开场被问到可直接接，用看过的一个具体判断连接自己的经历。"},{"type":"speech","ja":"BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDアプリの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>した\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んだのがきっかけです。\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>でもっと\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>したい\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>もいれば、そもそも\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>できると\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らなかった\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>もいた、という\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>が\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になりました。","zh":"契机是读了BASE集团官方note上的PAY ID App商品搜索改版。有人想在喜欢的店里继续找商品，也有人根本不知道可以搜索。这段特别让我在意。"},{"type":"speech","ja":"「\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しにくい」と\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>っても、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>に\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>っているかは\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>によってずいぶん\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うんだなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>って。そういう\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いたあと、どこから\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>をつけるかを、どう\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めているのか\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたかったです。","zh":"同样说「不好找」，每个人遇到的麻烦其实很不一样。我就想知道，你们听完这些不同的声音以后，会怎么决定从哪儿开始改。搜索改版采访"}]},{"id":"answers-2","title":"「UI/UXでは、今どんなことに興味がありますか。」","page":"","blocks":[{"type":"prompt","ja":"UI/UXでは、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>どんなことに\u003cruby>興味\u003crt>きょうみ\u003c/rt>\u003c/ruby>がありますか。","zh":""},{"type":"note","ja":"","zh":"问现在的设计兴趣。说明你关心的用户情境，对方感兴趣再展示作品。"},{"type":"speech","ja":"「\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っていればいいのかな」と\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>う\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>が\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になります。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>して、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>はもうお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたとします。あとは\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>てばいいのか、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>から\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いたほうがいいのか。そこが\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるようにするのが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>いです。","zh":"我挺在意那种会让人想“我现在等着就行吗？”的场景。比如寄回的衣服已经到店了，接下来是等店里通知，还是我要自己去问？我觉得，想办法让人看一眼界面就明白这件事，很有意思。"}]},{"id":"answers-3","title":"「どんな仕事に関わってみたいですか。」","page":"","blocks":[{"type":"prompt","ja":"どんな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>に\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わってみたいですか。","zh":""},{"type":"note","ja":"","zh":"问入职以后想参与什么。说清想解决的事情和希望参与的阶段，用PAY ID的场景回答也能独立成立。"},{"type":"speech","ja":"PAY IDなら、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>のあとの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>をやってみたいです。\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いの\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、「これ、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>ったときの\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>だっけ？」ってなることもあると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っている\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>がどこで\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>うのかを\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いて、その\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をもとに、チームで\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えられるか\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えてみたいです。","zh":"如果是PAY ID，我想做买完东西之后会用到的界面。看到一笔金额，有时会想：“这是上次买什么的那笔钱来着？”我想听听用户在哪一步会糊涂，再和团队一起想，根据这些反馈可以改哪里。"}]},{"id":"answers-4","title":"「大学院では、何を研究しているんですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>大学院\u003crt>だいがくいん\u003c/rt>\u003c/ruby>では、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>しているんですか。","zh":""},{"type":"note","ja":"","zh":"对方顺着自我介绍问研究。先用一句话解释研究对象。"},{"type":"speech","ja":"\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>の\u003cruby>昔\u003crt>むかし\u003c/rt>\u003c/ruby>のお\u003cruby>札\u003crt>さつ\u003c/rt>\u003c/ruby>を\u003cruby>研究\u003crt>けんきゅう\u003c/rt>\u003c/ruby>しています。お\u003cruby>祈\u003crt>いの\u003c/rt>\u003c/ruby>りや\u003cruby>厄\u003crt>やく\u003c/rt>\u003c/ruby>よけに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>われるものです。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>古\u003crt>ふる\u003c/rt>\u003c/ruby>い\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>にお\u003cruby>札\u003crt>さつ\u003c/rt>\u003c/ruby>の\u003cruby>一部\u003crt>いちぶ\u003c/rt>\u003c/ruby>を\u003cruby>抜\u003crt>ぬ\u003c/rt>\u003c/ruby>き\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>した\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>があって、その\u003cruby>横\u003crt>よこ\u003c/rt>\u003c/ruby>に\u003cruby>星\u003crt>ほし\u003c/rt>\u003c/ruby>の\u003cruby>名前\u003crt>なまえ\u003c/rt>\u003c/ruby>が\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>んでいるんです。\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>だけ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ていても\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないことが、\u003cruby>横\u003crt>よこ\u003c/rt>\u003c/ruby>の\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>と\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べると\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えてくる。そこが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>くて、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はその\u003cruby>関係\u003crt>かんけい\u003c/rt>\u003c/ruby>を\u003cruby>図\u003crt>ず\u003c/rt>\u003c/ruby>にまとめています。","zh":"我在研究中国古代的符箓，也就是用来祈愿或避邪的东西。比如古书里会把一张符的某一部分单独画出来，旁边还列着星名。光看图看不出来的东西，和旁边的说明一对照，就能看出一些线索。我觉得这个过程很有意思，现在在把这种关系整理成图。"}]},{"id":"answers-5","title":"「学生時代に力を入れたことは何ですか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>学生時代\u003crt>がくせいじだい\u003c/rt>\u003c/ruby>に\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れたことは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"问你主动做过什么。用已经准备过的长期实习经历，讲从制作到怎样推进团队工作。"},{"type":"speech","ja":"\u003cruby>美大\u003crt>びだい\u003c/rt>\u003c/ruby>を\u003cruby>目指\u003crt>めざ\u003c/rt>\u003c/ruby>す\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が\u003cruby>通\u003crt>かよ\u003c/rt>\u003c/ruby>う\u003cruby>塾\u003crt>じゅく\u003c/rt>\u003c/ruby>で、\u003cruby>広報\u003crt>こうほう\u003c/rt>\u003c/ruby>の\u003cruby>長期\u003crt>ちょうき\u003c/rt>\u003c/ruby>インターンをしていました。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>宣伝\u003crt>せんでん\u003c/rt>\u003c/ruby>\u003cruby>物\u003crt>ぶつ\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>っていたんですが、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>受験生\u003crt>じゅけんせい\u003c/rt>\u003c/ruby>でも、\u003cruby>学校\u003crt>がっこう\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>し\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたときと\u003cruby>出願\u003crt>しゅつがん\u003c/rt>\u003c/ruby>の\u003cruby>直前\u003crt>ちょくぜん\u003c/rt>\u003c/ruby>とでは、\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいことが\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うと\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づいたんです。それで、SNSに\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すかも\u003cruby>時期\u003crt>じき\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたいと、\u003cruby>塾\u003crt>じゅく\u003c/rt>\u003c/ruby>の\u003cruby>経営者\u003crt>けいえいしゃ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>に\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>しました。その\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>は、\u003cruby>投稿\u003crt>とうこう\u003c/rt>\u003c/ruby>を\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>して、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>って\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すかを\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めて、\u003cruby>反応\u003crt>はんのう\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ながら\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるところまで\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>しました。","zh":"我在一所帮助学生考美大的培训机构做过长期实习，负责宣传。一开始我做宣传物，后来发现，即使是同一个考生，刚开始选学校时和快要报名时，想知道的事也不一样。所以我去找机构负责人商量，想按学生所处的阶段来定社媒内容。后来我也负责想选题、安排谁做谁发，再看发出去的反应，决定下一轮做什么。"}]},{"id":"answers-6","title":"「PAY IDは使ったことがありますか。」","page":"","blocks":[{"type":"prompt","ja":"PAY IDは\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったことがありますか。","zh":""},{"type":"note","ja":"","zh":"问实际使用到哪一步。以下一句仅适用于当时确实还没有完成购买。若已经体验过，先如实说做了什么，再聊一处实际观察。"},{"type":"speech","ja":"\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>までは、まだ\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>せていません。BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteでPAY IDのあと\u003cruby>払\u003crt>ばら\u003c/rt>\u003c/ruby>いの\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んで、どのお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>で\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>ったかと、\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いの\u003cruby>内容\u003crt>ないよう\u003c/rt>\u003c/ruby>を\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できるところが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になりました。","zh":"我还没有试到下单这一步。我在BASE集团官方note读了PAY ID后付的介绍，比较在意的是，在哪家店买了什么可以和付款信息一起确认。PAY ID后付介绍"}]},{"id":"answers-7","title":"「今、会社を選ぶときに何を大事にしていますか。」","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶときに\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしていますか。","zh":""},{"type":"note","ja":"","zh":"问你怎样比较工作。说一条自己确实在意的工作条件。"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はUI/UXの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>中心\u003crt>ちゅうしん\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ています。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>る\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、「そもそも、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>はどこで\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>っているんだろう？」と\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるところが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなので、そこからデザイナーも\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れるかを\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしています。","zh":"我现在主要在看UI/UX的工作。我挺喜欢在做界面前先想一想“用户到底在哪儿遇到了困难？”所以选公司时，我比较看重设计师能不能从这一步就一起讨论。"}]},{"id":"answers-8","title":"还想整理一下再决定时","page":"","blocks":[{"type":"note","ja":"","zh":"还想整理一下再决定时："},{"type":"speech","ja":"\u003cruby>仕事内容\u003crt>しごとないよう\u003c/rt>\u003c/ruby>に\u003cruby>関心\u003crt>かんしん\u003c/rt>\u003c/ruby>があります。\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ったことを\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>して、\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>について\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っています。","zh":"我对工作内容感兴趣。我想先整理一下今天听到的内容，再考虑申请。"}]},{"id":"answers-9","title":"当天已经明确想进一步应募时","page":"","blocks":[{"type":"note","ja":"","zh":"当天已经明确想进一步应募时："},{"type":"speech","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>お\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>って、\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>したいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>から\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めればよいか\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えていただけますか。","zh":"听了今天的介绍，我想申请。请问接下来应该先做什么？"}]}]},{"id":"feedback","label":"听完反馈怎么接","items":[{"id":"feedback-1","title":"作品刚讲完、还没收到具体建议","page":"","blocks":[{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>で、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がなぜその\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にしたのか、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりにくかったところはありますか。","zh":"刚才的讲解里，有哪些地方是看得懂画面，但还不太清楚我为什么这样设计的？"}]},{"id":"feedback-2","title":"比如，对方说TUCK的场景讲得太快","page":"","blocks":[{"type":"speech","ja":"ありがとうございます。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>だけが\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>た\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>だと\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えると、なぜスリッパを\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>したかも\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすくなりそうですね。","zh":"谢谢。先说这是只收到袜子通知的场景，应该也就更容易明白我为什么把拖鞋放在最上面了。"}]},{"id":"feedback-3","title":"如果意见已经具体，到这里就可以停。如果只说「もう少しプロセスがあるといい」，还不清楚要补哪一段","page":"","blocks":[{"type":"note","ja":"","zh":"如果意见已经具体，到这里就可以停。如果只说「もう少しプロセスがあるといい」，还不清楚要补哪一段。"},{"type":"speech","ja":"\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたきっかけとか、どの\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>にするか\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>ったところとか、どのあたりをもう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>きたいですか。","zh":"比如一开始为什么会做这个，或者后来在哪两个方案之间犹豫，您比较想多听哪一块？"}]}]}]},{"id":"reverse","label":"逆質問 · 37 题","kind":"reverse","groups":[{"id":"bank-1","label":"PAY ID 产品","items":[{"id":"q01","title":"01 · 搜索分类名称","page":"","blocks":[{"type":"speech","ja":"BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDの\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>した\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すカテゴリーの\u003cruby>名前\u003crt>なまえ\u003c/rt>\u003c/ruby>が\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わるかは、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりに\u003cruby>判断\u003crt>はんだん\u003c/rt>\u003c/ruby>したんですか。","zh":"我读了BASE集团官方note上的PAY ID搜索改版文章，界面上的分类名称能不能让买家理解，当时是依据什么来判断的？"},{"type":"basis","ja":"","zh":"2026年11月5日的搜索采访说明，商品级分类数据被用于细化筛选，北村负责搜索画面的UI/UX。"},{"type":"value","ja":"","zh":"判断设计师怎样把商品分类转成购买者理解的语言；适合北村开始讲搜索UI时使用，问的是命名依据，不让他重复已公开的AI分类机制。"}],"source":"https://note.com/base_group/n/n39a643caaa7d","reverse":"01","audience":"北村","priority":true},{"id":"q02","title":"02 · 全站与店内搜索","page":"","blocks":[{"type":"speech","ja":"PAY IDの\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>アップデートのお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせで、\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>の\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>とショップ\u003cruby>内\u003crt>ない\u003c/rt>\u003c/ruby>の\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べたんですが、\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>を\u003cruby>揃\u003crt>そろ\u003c/rt>\u003c/ruby>える\u003cruby>部分\u003crt>ぶぶん\u003c/rt>\u003c/ruby>と\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>える\u003cruby>部分\u003crt>ぶぶん\u003c/rt>\u003c/ruby>は、どう\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めたんですか。","zh":"我对照看了PAY ID搜索更新公告中的全站搜索和店内搜索，两边哪些操作保持一致、哪些做得不同，是怎样决定的？"},{"type":"basis","ja":"","zh":"2026年9月的官方更新分别介绍跨店搜索与店内搜索，两处支持的筛选操作并非完全相同。"},{"type":"value","ja":"","zh":"判断同一产品如何兼顾跨店比较与熟悉店铺内深挖，适合聊到搜索范围或界面一致性时；不问公告已经列明的功能位置。"}],"source":"https://payid.jp/blog/search_update","reverse":"02","audience":"北村","priority":false},{"id":"q03","title":"03 · 筛选后的探路","page":"","blocks":[{"type":"speech","ja":"PAY IDの\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>\u003cruby>更新\u003crt>こうしん\u003c/rt>\u003c/ruby>で\u003cruby>絞\u003crt>しぼ\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>みが\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えたと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、もし\u003cruby>条件\u003crt>じょうけん\u003c/rt>\u003c/ruby>を\u003cruby>絞\u003crt>しぼ\u003c/rt>\u003c/ruby>って\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>なくなった\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>は、どんな\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>し\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>し\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>して\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるんですか。","zh":"我读到PAY ID搜索增加了筛选条件，如果用户筛得太细、没有商品出现，会设想他们怎样重新找，再据此设计界面呢？"},{"type":"basis","ja":"","zh":"2026年9月官方更新增加了细分类别、价格、促销和免运费等搜索条件；公告未说明零结果时的设计判断。"},{"type":"value","ja":"","zh":"判断设计是否考虑主流程之外的恢复路径，适合已聊到筛选交互时；这是条件场景，不声称实际产品存在零结果缺陷。"}],"source":"https://payid.jp/blog/search_update","reverse":"03","audience":"北村","priority":false},{"id":"q04","title":"04 · 搜索成功的含义","page":"","blocks":[{"type":"speech","ja":"BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、\u003cruby>絞\u003crt>しぼ\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>みを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>った\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>が\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えたと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>購入\u003crt>こうにゅう\u003c/rt>\u003c/ruby>せずに\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わった\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>でも、\u003cruby>欲\u003crt>ほ\u003c/rt>\u003c/ruby>しいものをうまく\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せたかは、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるんですか。","zh":"我在BASE集团官方note读到，使用筛选的搜索次数增加了。即便没有下单，你们会依据什么判断买家有没有成功找到想找的东西？"},{"type":"basis","ja":"","zh":"搜索改版采访中，宫地提到使用筛选的搜索次数增加。文章没有写团队怎样判断未下单的搜索是否也有价值。"},{"type":"value","ja":"","zh":"判断团队是否区分探索、比较和即时购买，适合聊到上线后效果时；不索要转化率、内部目标数值，也不预设他们只看购买。"}],"source":"https://note.com/base_group/n/n39a643caaa7d","reverse":"04","audience":"北村","priority":false},{"id":"q05","title":"05 · 首页发现与回访","page":"","blocks":[{"type":"speech","ja":"onigiriさんのPAY IDのホーム\u003cruby>改版\u003crt>かいはん\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んだんですが、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しい\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>との\u003cruby>出会\u003crt>であ\u003c/rt>\u003c/ruby>いを\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>やしたあとも、いつもの\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>りにくくなっていないかは、どんな\u003cruby>変化\u003crt>へんか\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>判断\u003crt>はんだん\u003c/rt>\u003c/ruby>していますか。","zh":"我读了onigiri写的PAY ID首页改版文章，增加新店发现之后，你们会观察什么变化，判断用户回到熟悉店铺有没有变得更困难？"},{"type":"basis","ja":"","zh":"onigiri的2024年首页回顾同时讨论新店推荐与既有关注店铺回访的便利性。"},{"type":"value","ja":"","zh":"判断新增推荐与老用户原有任务是否共同进入上线后评价，适合首页或复购话题；明确文章作者，向北村了解团队做法，不把该项目写成他独立完成。"}],"source":"https://note.com/base_designteam/n/nbafae405866b","reverse":"05","audience":"北村","priority":true},{"id":"q06","title":"06 · 外部试用的时机","page":"","blocks":[{"type":"speech","ja":"PAY IDのホーム\u003cruby>改版\u003crt>かいはん\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>には\u003cruby>社内\u003crt>しゃない\u003c/rt>\u003c/ruby>で\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>して\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたとありましたが、どんなときに、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>アプリを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っている\u003cruby>社外\u003crt>しゃがい\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にも\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらおうと\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるんですか。","zh":"PAY ID首页改版文章提到在公司内部试用验证，遇到什么情况时，你们会考虑也请平时使用App的外部用户来试一试？"},{"type":"basis","ja":"","zh":"onigiri的2024年首页文章记录了内部原型试用和上线前内部体验会，未据此证明当前所有验证都仅在内部开展。"},{"type":"value","ja":"","zh":"判断内部试用与实际使用者验证各自承担什么问题，适合原型或用户研究话题；不预设已存在固定外部测试制度，也不把内部员工等同外部用户。"}],"source":"https://note.com/base_designteam/n/nbafae405866b","reverse":"06","audience":"北村","priority":true},{"id":"q07","title":"07 · 推荐与界面的问题","page":"","blocks":[{"type":"speech","ja":"PAY IDのホーム\u003cruby>改版\u003crt>かいはん\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>でおすすめ\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>の\u003cruby>調整\u003crt>ちょうせい\u003c/rt>\u003c/ruby>が\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>になったと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、\u003cruby>反応\u003crt>はんのう\u003c/rt>\u003c/ruby>がよくないとき、\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せ\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>問題\u003crt>もんだい\u003c/rt>\u003c/ruby>か、\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>している\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>の\u003cruby>問題\u003crt>もんだい\u003c/rt>\u003c/ruby>かは、どう\u003cruby>見分\u003crt>みわ\u003c/rt>\u003c/ruby>けるんですか。","zh":"我在PAY ID首页改版文章里读到需要调整推荐商品，当反应不好时，怎样分辨是展示方式的问题，还是推荐出来的商品本身不合适？"},{"type":"basis","ja":"","zh":"2024年首页回顾写到新推荐逻辑的质量与更新频率影响发布决策。"},{"type":"value","ja":"","zh":"判断设计师与推荐相关职能怎样定位问题，适合对方谈到推荐质量时；不让其复述已公开的延期与分批发布结果，不索要模型或排序参数。"}],"source":"https://note.com/base_designteam/n/nbafae405866b","reverse":"07","audience":"北村","priority":false},{"id":"q08","title":"08 · 积分条件何时说","page":"","blocks":[{"type":"speech","ja":"onigiriさんのPAY IDポイントの\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>で、\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>い\u003cruby>方法\u003crt>ほうほう\u003c/rt>\u003c/ruby>の\u003cruby>変更\u003crt>へんこう\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>かない\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>への\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>も\u003cruby>課題\u003crt>かだい\u003c/rt>\u003c/ruby>だと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、こうした\u003cruby>条件\u003crt>じょうけん\u003c/rt>\u003c/ruby>をどの\u003cruby>段階\u003crt>だんかい\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えるかは、どう\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めていますか。","zh":"我在onigiri的PAY ID积分文章里读到，没有打开支付方式修改页的人也需要知道条件，这类条件在哪个阶段告诉用户，你们会怎样决定？"},{"type":"basis","ja":"","zh":"onigiri的2025年积分设计文指出，未进入支付方式修改页的用户也需要理解积分适用条件。"},{"type":"value","ja":"","zh":"判断购物顺畅与条件理解之间的信息安排，适合积分、结账或作品中的金额说明话题；问判断方法，不把2025年提出的课题断言为今天仍未解决。"}],"source":"https://note.com/base_designteam/n/n3e9418535862","reverse":"08","audience":"北村","priority":true},{"id":"q09","title":"09 · 结账确认的取舍","page":"","blocks":[{"type":"speech","ja":"BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDのあと\u003cruby>払\u003crt>ばら\u003c/rt>\u003c/ruby>いは\u003cruby>購入\u003crt>こうにゅう\u003c/rt>\u003c/ruby>\u003cruby>時\u003crt>じ\u003c/rt>\u003c/ruby>の\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>を\u003cruby>減\u003crt>へ\u003c/rt>\u003c/ruby>らしたと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>の\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>を\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>すか\u003cruby>省\u003crt>はぶ\u003c/rt>\u003c/ruby>くかは、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>基準\u003crt>きじゅん\u003c/rt>\u003c/ruby>に\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めているんですか。","zh":"我在BASE集团官方note里读到，PAY ID后付减少了购买时的操作，哪些确认操作保留、哪些可以省略，你们依据什么来决定？"},{"type":"basis","ja":"","zh":"2023年的官方后付介绍将减少从下单到付款的画面跳转和操作作为体验改进之一。"},{"type":"value","ja":"","zh":"判断团队怎样兼顾效率与购买者充分理解，适合结账流程话题；只问体验判断，不索要审查、防欺诈或风控细则。"}],"source":"https://note.com/base_group/n/n136a027d3389","reverse":"09","audience":"北村","priority":false},{"id":"q10","title":"10 · 未确定的账单","page":"","blocks":[{"type":"speech","ja":"PAY IDのヘルプで、\u003cruby>発送\u003crt>はっそう\u003c/rt>\u003c/ruby>の\u003cruby>時期\u003crt>じき\u003c/rt>\u003c/ruby>によってあと\u003cruby>払\u003crt>ばら\u003c/rt>\u003c/ruby>いの\u003cruby>請求\u003crt>せいきゅう\u003c/rt>\u003c/ruby>\u003cruby>月\u003crt>がつ\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わると\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、\u003cruby>請求額\u003crt>せいきゅうがく\u003c/rt>\u003c/ruby>がまだ\u003cruby>確定\u003crt>かくてい\u003c/rt>\u003c/ruby>していない\u003cruby>状態\u003crt>じょうたい\u003c/rt>\u003c/ruby>を、\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いが\u003cruby>不要\u003crt>ふよう\u003c/rt>\u003c/ruby>だと\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>られないように、\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>をつけていることはありますか。","zh":"我在PAY ID帮助中读到，发货时间可能改变后付的请款月份，为了不让“账单还没确定”被理解成“不用付款”，界面表达上有没有特别注意的地方？"},{"type":"basis","ja":"","zh":"官方支付帮助说明，发货跨月可能改变后付的请款月份，订单成立和账单确定并非同一时点。"},{"type":"value","ja":"","zh":"判断不同业务时点如何转成准确的等待状态说明，适合后付账单或MORI展示后；不声称已经发生普遍误解，也不向对方追问个人账务。"}],"source":"https://help.thebase.in/hc/ja/articles/16998211355545","reverse":"10","audience":"北村","priority":true},{"id":"q11","title":"11 · 核身后继续购买","page":"","blocks":[{"type":"speech","ja":"PAY IDの\u003cruby>本人確認\u003crt>ほんにんかくにん\u003c/rt>\u003c/ruby>の\u003cruby>更新\u003crt>こうしん\u003c/rt>\u003c/ruby>\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>で、\u003cruby>審査\u003crt>しんさ\u003c/rt>\u003c/ruby>に\u003cruby>通\u003crt>かよ\u003c/rt>\u003c/ruby>ったあとも\u003cruby>購入\u003crt>こうにゅう\u003c/rt>\u003c/ruby>\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きが\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>だと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、\u003cruby>審査\u003crt>しんさ\u003c/rt>\u003c/ruby>\u003cruby>完了\u003crt>かんりょう\u003c/rt>\u003c/ruby>と\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>\u003cruby>完了\u003crt>かんりょう\u003c/rt>\u003c/ruby>の\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いを\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えるとき、チームで\u003cruby>表現\u003crt>ひょうげん\u003c/rt>\u003c/ruby>に\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>ったところはありましたか。","zh":"我在PAY ID身份确认更新公告中读到，审核通过后还要继续完成购买，团队在表达“审核完成”和“订单完成”的区别时，有没有难以决定怎么说的地方？"},{"type":"basis","ja":"","zh":"2025年8月官方公告将三期后付改为可预先本人确认，通过后仍需另行完成购买。"},{"type":"value","ja":"","zh":"判断团队怎样说明服务阶段切换，适合本人确认或恢复购物流程话题；不问已公开的办理步骤，也不把审核完成当作购买成功。"}],"source":"https://payid.jp/blog/ekyc_update","reverse":"11","audience":"北村","priority":false},{"id":"q12","title":"12 · 购买后的反馈","page":"","blocks":[{"type":"speech","ja":"PAY IDのあと\u003cruby>払\u003crt>ばら\u003c/rt>\u003c/ruby>いの\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>で、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>ったものと\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>できると\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、これまでのアップデートで、\u003cruby>購入\u003crt>こうにゅう\u003c/rt>\u003c/ruby>\u003cruby>後\u003crt>ご\u003c/rt>\u003c/ruby>のお\u003cruby>問\u003crt>と\u003c/rt>\u003c/ruby>い\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせがきっかけになったものはありますか。","zh":"我在PAY ID后付文章里读到，可以一起确认买了什么和付款信息，在已经公开的界面改进中，有没有哪项是由购买后的咨询反馈促成的？"},{"type":"basis","ja":"","zh":"2023年后付介绍说明，App购买记录把订单内容和支付信息联系起来，覆盖购买后的查看体验。"},{"type":"value","ja":"","zh":"判断售后困难能否回到产品设计，以及客服与设计之间的实际联系；适合已聊到金额、订单或状态理解时，只问可公开的改善例，不要求客户原始记录。"}],"source":"https://note.com/base_group/n/n136a027d3389","reverse":"12","audience":"北村","priority":false}]},{"id":"bank-13","label":"设计团队与协作","items":[{"id":"q13","title":"13 · 原型先做到什么程度","page":"","blocks":[{"type":"speech","ja":"\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteのPAY ID\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>\u003cruby>改善\u003crt>かいぜん\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>で、\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>\u003cruby>形\u003crt>けい\u003c/rt>\u003c/ruby>のプロトタイプをもとに\u003cruby>開発\u003crt>かいはつ\u003c/rt>\u003c/ruby>チームと\u003cruby>相談\u003crt>そうだん\u003c/rt>\u003c/ruby>されたと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せる\u003cruby>段階\u003crt>だんかい\u003c/rt>\u003c/ruby>では、どこまで\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>きを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>込\u003crt>こ\u003c/rt>\u003c/ruby>んでいたんでしょうか。","zh":"我在官方note的PAY ID搜索改版文章中读到，你们用完整原型和开发团队讨论；第一次给团队看时，交互已经做到什么程度了？"},{"type":"basis","ja":"","zh":"2026年11月5日的搜索采访写到北村与宫地共同用AI制作完整原型，再与开发团队讨论如何分批实现。"},{"type":"value","ja":"","zh":"了解用于团队讨论的原型需要达到什么程度，帮助自己把时间花在关键交互上；适合北村讲到原型协作、尚未说明原型细节时。原文已经回答了共同制作与分批开发，本题只问原型的具体完成程度，不再请他复述流程。"}],"source":"https://note.com/base_group/n/n39a643caaa7d","reverse":"13","audience":"北村","priority":true},{"id":"q14","title":"14 · 搜索项目的AI工具","page":"","blocks":[{"type":"speech","ja":"\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteのPAY ID\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>\u003cruby>改善\u003crt>かいぜん\u003c/rt>\u003c/ruby>のインタビューで、\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんと\u003cruby>宮地\u003crt>みやじ\u003c/rt>\u003c/ruby>さんがAIでプロトタイプを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>られたと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、そのときはどんなAIツールを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>われたんでしょうか。","zh":"我在官方note的PAY ID搜索改版采访中读到，北村和宫地用AI制作了原型；那次具体用了什么AI工具呢？"},{"type":"basis","ja":"","zh":"2026年搜索采访明确提到AI原型，但未说明制作原型时使用的具体AI工具。"},{"type":"value","ja":"","zh":"把自己的工具学习与真实项目用途对齐；适合对方聊到原型制作时，工具名说清即可停，不接着索取内部提示词、文件或账号配置。若已在前文回答，直接跳过。"}],"source":"https://note.com/base_group/n/n39a643caaa7d","reverse":"14","audience":"北村","priority":false},{"id":"q15","title":"15 · AI原型的人为检查","page":"","blocks":[{"type":"speech","ja":"PAY IDの\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>\u003cruby>改善\u003crt>かいぜん\u003c/rt>\u003c/ruby>でAIのプロトタイプを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>われたという\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んだんですが、AIで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>った\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>をチームに\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せる\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、\u003cruby>特\u003crt>とく\u003c/rt>\u003c/ruby>にどんなところを\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>されていますか。","zh":"我读了PAY ID搜索改版中使用AI原型的文章；把AI做出的方案给团队看之前，您会特别检查哪些地方？"},{"type":"basis","ja":"","zh":"2026年搜索项目用AI原型共享完成形，但采访未展开设计师在共享前怎样检查生成结果。"},{"type":"value","ja":"","zh":"了解设计师怎样判断AI结果是否足以支持讨论，避免把生成得快等同于已符合需求；适合工具或原型话题。只问检查重点，不要求内部规范原文或未公开项目细节。"}],"source":"https://note.com/base_group/n/n39a643caaa7d","reverse":"15","audience":"北村","priority":true},{"id":"q16","title":"16 · 实际操作发现的新问题","page":"","blocks":[{"type":"speech","ja":"DeployGateで、\u003cruby>北川\u003crt>きたがわ\u003c/rt>\u003c/ruby>さんが\u003cruby>開発中\u003crt>かいはつちゅう\u003c/rt>\u003c/ruby>のアプリを\u003cruby>早\u003crt>はや\u003c/rt>\u003c/ruby>めに\u003cruby>触\u003crt>さわ\u003c/rt>\u003c/ruby>って\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>する\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んだんですが、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>触\u003crt>さわ\u003c/rt>\u003c/ruby>って\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づいた\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いにくさで、\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>せる\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>はありますか。","zh":"我在DeployGate对北川的采访中读到，设计师也会较早检查开发中的App；有没有实际操作后才发现的使用困难，可以举个例子？"},{"type":"basis","ja":"","zh":"DeployGate对北川的2025年采访介绍了从Figma原型到实际应用的早期检查，并说明实际操作仍可能发现新问题。"},{"type":"value","ja":"","zh":"了解Figma里的设计意图到实际触感、等待或状态变化之间，设计师还会关注什么；适合聊工程交接或验证时。来源受访者是北川，不是北村；问可分享的体验例子，不要求日志、代码或现行分发配置。"}],"source":"https://deploygate.com/interviews/base","reverse":"16","audience":"北村","priority":false},{"id":"q17","title":"17 · 何时扩展共用组件","page":"","blocks":[{"type":"speech","ja":"onigiriさんのPAY IDホーム\u003cruby>改修\u003crt>かいしゅう\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>で\u003cruby>共通\u003crt>きょうつう\u003c/rt>\u003c/ruby>のボタンなども\u003cruby>更新\u003crt>こうしん\u003c/rt>\u003c/ruby>したと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>は\u003cruby>既存\u003crt>きそん\u003c/rt>\u003c/ruby>の\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うか、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しい\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るかをどう\u003cruby>判断\u003crt>はんだん\u003
