c/rt>\u003c/ruby>されていますか。","zh":"我在onigiri的PAY ID首页改版文章里读到，共用按钮等也一起更新了；平时会怎样判断该用现有组件，还是做一种新的形式？"},{"type":"basis","ja":"","zh":"onigiri的2024年首页改版文章记录了颜色、按钮等共用组件更新，而影响并不限于首页。"},{"type":"value","ja":"","zh":"了解保持一致性与解决具体使用问题之间的取舍，适合聊Figma、组件或设计系统。文章已说明更新了什么，本题问的是平时作决定的依据，不要求对方复述更新清单。"}],"source":"https://note.com/base_designteam/n/nbafae405866b","reverse":"17","audience":"北村","priority":true},{"id":"q18","title":"18 · 让后来的人理解设计理由","page":"","blocks":[{"type":"speech","ja":"\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんの2022\u003cruby>年\u003crt>ねん\u003c/rt>\u003c/ruby>のチーム\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>で、\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>から\u003cruby>参加\u003crt>さんか\u003c/rt>\u003c/ruby>した\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>にも\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かる\u003cruby>資料\u003crt>しりょう\u003c/rt>\u003c/ruby>を\u003cruby>目指\u003crt>めざ\u003c/rt>\u003c/ruby>していると\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は「なぜこの\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にしたか」を、どう\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>して\u003cruby>共有\u003crt>きょうゆう\u003c/rt>\u003c/ruby>されていますか。","zh":"我在北村2022年的团队介绍里读到，希望资料能让后来加入项目的人也看懂；现在会怎样记录、分享“为什么做成这个形式”？"},{"type":"basis","ja":"","zh":"北村2022年的团队文章把Figma设计系统描述为也希望帮助后来参与项目者理解UX判断的资料。"},{"type":"value","ja":"","zh":"了解自己以后交付设计时需要保留哪些理由，以及团队如何避免只交成品；适合聊文件交接或跨职种协作。明确2022年是历史出处，不假设今天仍使用同一套文档、软件或组织方式。"}],"source":"https://note.com/naomi_kun/n/n371a828258d9","reverse":"18","audience":"北村","priority":false},{"id":"q19","title":"19 · 从客服声音选改进重点","page":"","blocks":[{"type":"speech","ja":"\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんの\u003cruby>以前\u003crt>いぜん\u003c/rt>\u003c/ruby>のチーム\u003cruby>紹介\u003crt>しょうかい\u003c/rt>\u003c/ruby>で、カスタマーサポートに\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いた\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をデザイン\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>につなげると\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>は、どの\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>から\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>むかをどう\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めていますか。","zh":"我在北村以前的团队介绍里读到，会把客服收到的用户反馈转成设计方案；现在怎样决定先处理哪些反馈？"},{"type":"basis","ja":"","zh":"北村2022年的团队文章记录了客服把用户声音放入改进列表、设计师据此准备改修方案的做法。"},{"type":"value","ja":"","zh":"了解零散用户声音如何进入日常设计优先顺序；适合对方主动提到客服、日常改善或backlog时。只问一般判断方法，不索投诉原文、用户身份或业务内部指标；若前面已讲优先级则跳过。"}],"source":"https://note.com/naomi_kun/n/n371a828258d9","reverse":"19","audience":"北村","priority":false},{"id":"q20","title":"20 · 评审和试用意见不同怎么办","page":"","blocks":[{"type":"speech","ja":"PAY IDのホーム\u003cruby>改版\u003crt>かいはん\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>で、\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらったり、\u003cruby>関係者\u003crt>かんけいしゃ\u003c/rt>\u003c/ruby>にレビューしてもらったりしたと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>した\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>の\u003cruby>反応\u003crt>はんのう\u003c/rt>\u003c/ruby>とレビューで\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>た\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>が\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>っていたら、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>から\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめ\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>しますか。","zh":"我在PAY ID首页改版的文章里读到，你们既请人试原型，也请相关同事评审。如果试用时的反应与评审意见不同，你们会先回头确认什么？"},{"type":"basis","ja":"","zh":"onigiri在首页改版文章里写到，方案会同时经过内部原型试用和项目相关人的评审，并据此反复调整。文章未讲两种反馈方向不同时怎样处理。"},{"type":"value","ja":"","zh":"知道两种反馈冲突时，团队怎样安排下一步验证。和第06题的「何时请外部用户」不同。现场已经讲过实际处理时可以跳过。"}],"source":"https://note.com/base_designteam/n/nbafae405866b","reverse":"20","audience":"北村","priority":false},{"id":"q21","title":"21 · 发现商品与理解支付的验证差别","page":"","blocks":[{"type":"speech","ja":"onigiriさんのPAY IDポイントの\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>で、\u003cruby>条件\u003crt>じょうけん\u003c/rt>\u003c/ruby>の\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>え\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>工夫\u003crt>くふう\u003c/rt>\u003c/ruby>されたと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>す\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>と\u003cruby>支払\u003crt>しはら\u003c/rt>\u003c/ruby>いの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>では、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすさを\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるときに\u003cruby>特\u003crt>とく\u003c/rt>\u003c/ruby>に\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えていることはありますか。","zh":"我在onigiri的PAY ID积分文章里读到，你们对条件的传达做了设计；商品搜索界面与支付界面在确认易用性时，有哪些会特别改变的做法？"},{"type":"basis","ja":"","zh":"onigiri的2025年积分文章特别处理适用支付方式与两种积分的混淆，说明购买时的规则理解也是设计议题。"},{"type":"value","ja":"","zh":"比较发现商品与金额、条件理解这两类工作的检查重点，帮助判断PAY ID日常设计的跨度；适合已聊过搜索或积分项目、想理解工作差别时。不是请北村认领积分项目，也不暗示两类画面只能使用不同方法；与第20题择一深入即可。"}],"source":"https://note.com/base_designteam/n/n3e9418535862","reverse":"21","audience":"北村","priority":false},{"id":"q22","title":"22 · 品牌在界面里何时突出","page":"","blocks":[{"type":"speech","ja":"PAY IDのロゴ\u003cruby>刷新\u003crt>さっしん\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>で、\u003cruby>主役\u003crt>しゅやく\u003c/rt>\u003c/ruby>はお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>と\u003cruby>購入者\u003crt>こうにゅうしゃ\u003c/rt>\u003c/ruby>だと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>では、PAY IDらしさを\u003cruby>強\u003crt>つよ\u003c/rt>\u003c/ruby>く\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>す\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>と\u003cruby>控\u003crt>ひか\u003c/rt>\u003c/ruby>える\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>をどう\u003cruby>判断\u003crt>はんだん\u003c/rt>\u003c/ruby>されていますか。","zh":"我在PAY ID标志更新的文章里读到，主角是店铺和购买者；落实到实际界面时，会怎样判断哪些场景应该突出PAY ID的特色，哪些应该收敛？"},{"type":"basis","ja":"","zh":"2026年PAY ID标志采访强调店铺和购买者是主角，同时PAY ID也需要在必要时被认出并获得信任。"},{"type":"value","ja":"","zh":"了解品牌立场如何变成具体界面判断，适合对方聊视觉、品牌或搜索与结账的不同。原文已经回答了品牌总体定位，本题只推进到场景上的应用，不再问为什么换颜色或为什么与外部设计师合作。"}],"source":"https://note.com/base_designteam/n/n7b73c9fc1785","reverse":"22","audience":"北村","priority":false},{"id":"q23","title":"23 · 意见不同时回到什么依据","page":"","blocks":[{"type":"speech","ja":"PAY IDのロゴ\u003cruby>刷新\u003crt>さっしん\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>で、チーム\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>が\u003cruby>判断\u003crt>はんだん\u003c/rt>\u003c/ruby>\u003cruby>軸\u003crt>じく\u003c/rt>\u003c/ruby>を\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>つことを\u003cruby>大切\u003crt>たいせつ\u003c/rt>\u003c/ruby>にされていると\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、デザイナー\u003cruby>同士\u003crt>どうし\u003c/rt>\u003c/ruby>で\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれたときは、どんな\u003cruby>材料\u003crt>ざいりょう\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>って\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>し\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>うことが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>いですか。","zh":"我在PAY ID标志更新的文章里读到，您重视让整个团队掌握判断依据；设计师之间意见不同时，通常会回到哪些材料上继续讨论？"},{"type":"basis","ja":"","zh":"2026年标志采访中，北村希望PAY ID的判断依据能够由团队共同掌握，而不只由一位设计师或经理持有。"},{"type":"value","ja":"","zh":"了解讨论怎样从个人偏好转向可共享的依据，适合聊评审、团队协作或设计师自主判断。问一般工作方法，不预设团队曾发生严重冲突，也不把文章的建设目标当作已经全部实现的制度。"}],"source":"https://note.com/base_designteam/n/n7b73c9fc1785","reverse":"23","audience":"北村","priority":true},{"id":"q24","title":"24 · App与Web的一致和差异","page":"","blocks":[{"type":"speech","ja":"PAY IDのロゴ\u003cruby>刷新\u003crt>さっしん\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>で、アプリとWebでもデザインの\u003cruby>本質\u003crt>ほんしつ\u003c/rt>\u003c/ruby>は\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わらないと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みましたが、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>機能\u003crt>きのう\u003c/rt>\u003c/ruby>を\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すとき、\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>の\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いをどこまで\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>たせるかはどう\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めていますか。","zh":"我在PAY ID标志更新的文章里读到，App与Web中的设计本质相通；同一功能需要在两端提供时，会怎样决定操作方式可以有哪些差异？"},{"type":"basis","ja":"","zh":"2026年标志采访中，北村说PAY ID涉及App、Web购买体验及管理画面，而理解用户等设计工作的核心相通。"},{"type":"value","ja":"","zh":"了解共通体验与各端使用习惯之间的设计取舍，适合对方谈App/Web职责或跨端组件时。问一般已有实践，不要求未公开功能计划；原文已说明共同的核心，本题不重复问两端是否相同。"}],"source":"https://note.com/base_designteam/n/n7b73c9fc1785","reverse":"24","audience":"北村","priority":false}]},{"id":"bank-25","label":"培养与选考","items":[{"id":"q25","title":"25 · 最初的具体任务","page":"","blocks":[{"type":"speech","ja":"\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページで、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>小\u003crt>ちい\u003c/rt>\u003c/ruby>さなデザインの\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>を\u003cruby>積\u003crt>つ\u003c/rt>\u003c/ruby>むと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んだのですが、PAY IDの\u003cruby>新卒\u003crt>しんそつ\u003c/rt>\u003c/ruby>デザイナーには、\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えばどんな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わってもらう\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>ですか。","zh":"招聘页写到，最初会从小规模设计工作开始积累经验；对于PAY ID的新卒设计师，计划让他们先参与哪些具体工作呢？"},{"type":"basis","ja":"","zh":"11月9日保存的28卒PAY ID职位正文写明，最初半年至一年在前辈指导下通过小规模设计任务学习实务，但没有列出入社后的具体首项任务。"},{"type":"value","ja":"","zh":"判断第一阶段的实际工作与自己的兴趣是否吻合；适合公司介绍或岗位介绍后优先问，不能把未来培养计划问成既有多届实绩。"}],"source":"https://open.talentio.com/r/1/c/binc/pages/128919","reverse":"25","audience":"成原","priority":true},{"id":"q26","title":"26 · 新人反馈频率","page":"","blocks":[{"type":"speech","ja":"\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページで、\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>に\u003cruby>教\u003crt>おそ\u003c/rt>\u003c/ruby>わりながら\u003cruby>仕事\u003crt>しごと\u0 003crt>まよ\u003c/rt>\u003c/ruby>うかを、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>どう\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめていますか。","zh":"我在BASE集团官方note读过介绍PAY ID后付的文章。里面说，在App里可以一起查在哪家店买了什么，以及付款金额和日期。刚才的退货作品也让我想过，怎么让人看懂一个金额具体指什么。你们平时怎样确认用户在这种界面里会在哪儿困惑？PAY ID后付介绍"}]},{"id":"kitamura-15","title":"如果对方说会看客服反馈，想知道如何接到改版时再问","page":"","blocks":[{"type":"note","ja":"","zh":"如果对方说会看客服反馈，想知道如何接到改版时再问。"},{"type":"speech","ja":"お\u003cruby>問\u003crt>と\u003c/rt>\u003c/ruby>い\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせがいくつかあるときは、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>から\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すかをどう\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めるんですか。","zh":"有好几类咨询反馈时，你们怎样决定先改什么？"}]},{"id":"kitamura-16","title":"设备","page":"","blocks":[{"type":"speech","ja":"\u003cruby>制作\u003crt>せいさく\u003c/rt>\u003c/ruby>\u003cruby>環境\u003crt>かんきょう\u003c/rt>\u003c/ruby>についても\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>っていいですか。デザイナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>は、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>Macを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っていますか。","zh":"也可以问一下制作环境吗？设计师平时用Mac吗？"}]}]},{"id":"narihara","label":"和成原聊招聘","items":[{"id":"narihara-1","title":"新人工作与学生阶段的准备","page":"","blocks":[{"type":"speech","ja":"PAY IDの28\u003cruby>卒\u003crt>そつ\u003c/rt>\u003c/ruby>デザイナーの\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページで、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>は\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>に\u003cruby>教\u003crt>おそ\u003c/rt>\u003c/ruby>わりながら、\u003cruby>小\u003crt>ちい\u003c/rt>\u003c/ruby>さな\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>を\u003cruby>積\u003crt>つ\u003c/rt>\u003c/ruby>むと\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>入社\u003crt>にゅうしゃ\u003c/rt>\u003c/ruby>して\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>のうちは、どういった\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>から\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わることが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>いですか。","zh":"我在PAY ID的28卒设计岗招聘页读到，入职初期会跟着前辈，从小任务积累经验。刚入职的时候，通常会先参与什么样的工作？11月9日保存的岗位正文"}]},{"id":"narihara-2","title":"如果对方举例说新人会先和前辈一起改已有界面，可以接","page":"","blocks":[{"type":"note","ja":"","zh":"如果对方举例说新人会先和前辈一起改已有界面，可以接："},{"type":"speech","ja":"\u003cruby>先輩\u003crt>せんぱい\u003c/rt>\u003c/ruby>と\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>ある\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>すところから\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めるんですね。そういう\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>に\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けて、\u003cruby>学生\u003crt>がくせい\u003c/rt>\u003c/ruby>のうちに\u003cruby>練習\u003crt>れんしゅう\u003c/rt>\u003c/ruby>しておくと\u003cruby>役立\u003crt>やくだ\u003c/rt>\u003c/ruby>つことはありますか。","zh":"原来会先和前辈一起看现有界面有哪些地方可以改。为了今后能做这样的工作，学生阶段练什么会有帮助？"}]},{"id":"narihara-3","title":"说明会","page":"","blocks":[{"type":"speech","ja":"ReDesigner for Studentのイベントページで、\u003cruby>来年\u003crt>らいねん\u003c/rt>\u003c/ruby>1\u003cruby>月\u003crt>がつ\u003c/rt>\u003c/ruby>のDesigner Career Jamに\u003cruby>御社\u003crt>おんしゃ\u003c/rt>\u003c/ruby>も\u003cruby>出展\u003crt>しゅってん\u003c/rt>\u003c/ruby>されると\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りました。ほかにも、\u003cruby>新卒\u003crt>しんそつ\u003c/rt>\u003c/ruby>のデザイン\u003cruby>職\u003crt>しょく\u003c/rt>\u003c/ruby>について\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>える\u003cruby>説明会\u003crt>せつめいかい\u003c/rt>\u003c/ruby>は\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>されていますか。","zh":"我在ReDesigner for Student的活动页看到，贵公司也会参加明年1月的Designer Career Jam。除此之外，还有能了解新卒设计岗的说明会吗？主办方活动页"}]},{"id":"narihara-4","title":"自己的本选考路径","page":"","blocks":[{"type":"speech","ja":"\u003cruby>御社\u003crt>おんしゃ\u003c/rt>\u003c/ruby>のインターンには\u003cruby>参加\u003crt>さんか\u003c/rt>\u003c/ruby>していないのですが、このあと28\u003cruby>卒\u003crt>そつ\u003c/rt>\u003c/ruby>のデザイナー\u003cruby>職\u003crt>しょく\u003c/rt>\u003c/ruby>に\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>する\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>は、どのように\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めればよいですか。","zh":"我没有参加过贵公司的实习。如果之后想申请28卒设计岗，请问接下来怎么走？"}]},{"id":"narihara-5","title":"如果对方说先准备作品集并从募集页面报名，流程已经答清楚，只确认自己尚未听到的一件事","page":"","blocks":[{"type":"note","ja":"","zh":"如果对方说先准备作品集并从募集页面报名，流程已经答清楚，只确认自己尚未听到的一件事。"},{"type":"speech","ja":"\u003cruby>募集\u003crt>ぼしゅう\u003c/rt>\u003c/ruby>ページから\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>するんですね。ありがとうございます。\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>はいつごろまで\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>ける\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>ですか。","zh":"原来是从招聘页申请。谢谢。预计会接受申请到什么时候？"}]},{"id":"narihara-6","title":"如果时间已讲过、材料还没讲","page":"","blocks":[{"type":"note","ja":"","zh":"如果时间已讲过、材料还没讲。"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>のうちに\u003cruby>準備\u003crt>じゅんび\u003c/rt>\u003c/ruby>しておいたほうがいいものはありますか。","zh":"现在有什么适合提前准备的吗？"}]},{"id":"narihara-7","title":"外国籍同事与日常沟通","page":"","blocks":[{"type":"speech","ja":"PAY IDのチームには、\u003cruby>外国籍\u003crt>がいこくせき\u003c/rt>\u003c/ruby>のメンバーもいらっしゃいますか。","zh":"PAY ID团队也有外国籍成员吗？"}]},{"id":"narihara-8","title":"如果工作语言还没讲","page":"","blocks":[{"type":"note","ja":"","zh":"如果工作语言还没讲。"},{"type":"speech","ja":"\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>の\u003cruby>打\u003crt>う\u003c/rt>\u003c/ruby>ち\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせやデザインレビューは、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>が\u003cruby>中心\u003crt>ちゅうしん\u003c/rt>\u003c/ruby>ですか。","zh":"平时开会和做设计评审，主要用日语吗？"}]},{"id":"narihara-9","title":"如果对方问有什么担心的事","page":"","blocks":[{"type":"note","ja":"","zh":"如果对方问有什么担心的事。"},{"type":"speech","ja":"\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>は\u003cruby>母語\u003crt>ぼご\u003c/rt>\u003c/ruby>ではないので、デザインレビューで、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>をどう\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたかをその\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えられるかは、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になっています。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>のレビューでは、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ながら\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>すことが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>いですか。","zh":"日语不是我的母语，所以我有一点在意，在设计评审时能不能当场说清我为什么这样做界面。你们平时评审会比较多一起看着界面讨论吗？"}]},{"id":"narihara-10","title":"2027年七八月的实习","page":"","blocks":[{"type":"speech","ja":"\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>のお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>ですが、\u003cruby>来年\u003crt>らいねん\u003c/rt>\u003c/ruby>の\u003cruby>夏\u003crt>なつ\u003c/rt>\u003c/ruby>もデザイン\u003cruby>職\u003crt>しょく\u003c/rt>\u003c/ruby>のインターンを\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>されていますか。","zh":"想问一下稍远一点的安排，明年夏天有计划开设计岗实习吗？"}]},{"id":"narihara-11","title":"对方说有、还没提届别时","page":"","blocks":[{"type":"note","ja":"","zh":"对方说有、还没提届别时。"},{"type":"speech","ja":"\u003cruby>対象\u003crt>たいしょう\u003c/rt>\u003c/ruby>は29\u003cruby>卒\u003crt>そつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が\u003cruby>中心\u003crt>ちゅうしん\u003c/rt>\u003c/ruby>になりますか。","zh":"主要对象会是29卒吗？"}]},{"id":"narihara-12","title":"确实想知道自己能否参加时","page":"","blocks":[{"type":"note","ja":"","zh":"确实想知道自己能否参加时。"},{"type":"speech","ja":"28\u003cruby>卒\u003crt>そつ\u003c/rt>\u003c/ruby>でも\u003cruby>参加\u003crt>さんか\u003c/rt>\u003c/ruby>できる\u003cruby>機会\u003crt>きかい\u003c/rt>\u003c/ruby>はありそうですか。","zh":"28卒也有可能参加吗？"}]}]},{"id":"closing","label":"临场和收尾","items":[{"id":"closing-1","title":"声音没听清","page":"","blocks":[{"type":"speech","ja":"すみません、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>のところを、もう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってもいいですか。","zh":"不好意思，最后那部分可以再说一遍吗？"}]},{"id":"closing-2","title":"听到了，但不确定对方问页面还是原型","page":"","blocks":[{"type":"speech","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>についてですか。それとも、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せている\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>のプロトタイプについてですか。","zh":"您问的是结果界面怎么做，还是最后展示的操作原型？"}]},{"id":"closing-3","title":"需要想一下","page":"","blocks":[{"type":"speech","ja":"\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えてもいいですか。","zh":"可以让我想一下吗？"}]},{"id":"closing-4","title":"快到时间、还有一个问题时","page":"","blocks":[{"type":"speech","ja":"お\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>が\u003cruby>近\u003crt>ちか\u003c/rt>\u003c/ruby>いので、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>に\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つだけ\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってもいいですか。","zh":"时间快到了，最后还可以问一个问题吗？"}]},{"id":"closing-5","title":"收尾。假如当天确实谈到用原型与开发沟通","page":"","blocks":[{"type":"speech","ja":"\u003cruby>今日\u003crt>きょう\u003c/rt>\u003c/ruby>は、プロトタイプを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ながら\u003cruby>開発\u003crt>かいはつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>とどんなことを\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>すのかを\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>えて、\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>のイメージが\u003cruby>具体的\u003crt>ぐたいてき\u003c/rt>\u003c/ruby>になりました。\u003cruby>本日\u003crt>ほんじつ\u003c/rt>\u003c/ruby>はお\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>をいただき、ありがとうございました。","zh":"今天听了你们怎样和开发同事看着原型讨论，我对具体工作有了更清楚的想象。谢谢两位抽时间。"}]}]}]},{"id":"guide","label":"聊法与准备","kind":"flow","groups":[{"id":"method","label":"聊法与准备","items":[{"id":"session-flow","title":"一小时怎么走","page":"","blocks":[{"type":"note","ja":"","zh":"先跟对方安排。准备节奏是开场与团队介绍约15分钟，作品段含翻页和短问答约5–7分钟，余下时间聊工作。收尾前留一个问题给成原。对方只想看一件就用半分钟版。"}]},{"id":"question-method","title":"怎么问才有内容","page":"","blocks":[{"type":"note","ja":"","zh":"说一个你确实看过的细节，再问文章没回答、对方又亲自知道的一件事。好的答案会帮你判断实际工作怎么做、自己想不想参与，或者还需要准备什么。"},{"type":"note","ja":"","zh":"北村适合聊设计取舍、协作和验证。成原适合问新人、申请及出社安排。先圈三到五题，实际问两三件。说过的就跳过。"}]},{"id":"listen-next","title":"听完怎么接","page":"","blocks":[{"type":"speech","ja":"\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>かしてみると、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ただけでは\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づかないこともありそうですね。","zh":"真动手试一下，应该也会看到一些光看界面看不出来的地方。"},{"type":"note","ja":"","zh":"仅在对方确实说到一起操作原型时使用。如果他已经讲了改了什么，到这里就能停。"}]},{"id":"polite-response","title":"没听清或还没想好","page":"","blocks":[{"type":"speech","ja":"すみません、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>のところをもう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってもいいですか。","zh":"不好意思，最后那一段可以再说一遍吗？"},{"type":"speech","ja":"\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えてもいいですか。","zh":"可以让我想一下吗？"}]},{"id":"jp-recruiter","title":"日本平台｜招聘方怎么准备","page":"","blocks":[{"type":"note","ja":"","zh":"ReDesigner 面向招聘方建议听候选人想问什么，并结合担当者的经历解释工作。用在这场就是请北村说一次自己做过的判断，成原补新人怎么加入。"}],"source":"https://lp.redesigner.jp/careers-business/resources/designer-recruitment-casual-interview"},{"id":"jp-designer","title":"日本平台｜设计团队被问过什么","page":"","blocks":[{"type":"note","ja":"","zh":"Gaji-Labo 自述设计师交流里经常聊具体工作、团队和用户参与。它是另一家团队的经验。这里借它提醒自己问工作实际如何发生。"}],"source":"https://www.gaji.jp/blog/2021/01/29/6421/"},{"id":"cn-experience","title":"小红书｜过往参考与本次覆盖","page":"","blocks":[{"type":"note","ja":"","zh":"此前记录的一位在日 UX 转职者经历过先听负责人介绍团队、再谈自己的经验。本次重新打开站内搜索和过往部分帖子，公开检索没有拿到足够的新正文，仍把此前笔记作为个人经历参考。"}],"source":"https://www.xiaohongshu.com/explore/67317465000000001b02ccb2"}]}]}],"revision":"2061b4027475"}</script>
<script>
'use strict';
const data = JSON.parse(document.getElementById('reader-data').textContent);
const byId = id => document.getElementById(id);
const make = (tag, cls, text) => {
  const element = document.createElement(tag);
  if (cls) element.className = cls;
  if (text !== undefined) element.textContent = text;
  return element;
};
const root = document.documentElement;
const contents = byId('contents');
const settings = byId('settings');
const sectionLabels = {opening:'开场', pages:'作品', questions:'问答', reverse:'逆質問', conversation:'接话', guide:'聊法'};
const params = new URLSearchParams(location.search);
root.classList.toggle('compact', params.get('compact') === '1');
root.classList.toggle('native-mini', params.get('nativeMini') === '1');
root.dataset.revision = data.revision;
const reviewKey = 'base-casual-question-review-v1';
let reviews = {};
try { reviews = JSON.parse(localStorage.getItem(reviewKey) || '{}') || {}; } catch {}
const settingsKey = 'base-casual-reader-settings-v1';
const settingsFields = [
  {key:'font', label:'日文字号', prop:'--body-size', min:13, max:30, step:1, value:root.classList.contains('compact') ? 16 : 20, unit:'px'},
  {key:'leading', label:'行距', prop:'--leading', min:1.40, max:2.50, step:.05, value:root.classList.contains('compact') ? 1.75 : 2.05, unit:''},
  {key:'space', label:'字间距', prop:'--letters', min:0, max:.15, step:.01, value:.02, unit:'em'},
  {key:'rubySize', label:'假名大小', prop:'--ruby-size', min:.28, max:.75, step:.01, value:.42, unit:'em'},
  {key:'rubyGap', label:'假名与汉字间距', prop:'--ruby-gap', min:0, max:6, step:1, value:1, unit:'px'}
];
let stored = {};
try { stored = JSON.parse(localStorage.getItem(settingsKey) || '{}') || {}; } catch {}
const prefs = {zh:stored.zh !== false, ruby:stored.ruby !== false};
const fields = new Map();
let current;
let activeTab;
let opener;
const indexed = [];
const itemsById = new Map();
let settingsPosition;

function persist() {
  try { localStorage.setItem(settingsKey, JSON.stringify(prefs)); } catch {}
}
function applyPrefs() {
  root.classList.toggle('no-zh', !prefs.zh);
  root.classList.toggle('no-ruby', !prefs.ruby);
  byId('zh-button').setAttribute('aria-pressed', String(prefs.zh));
  byId('ruby-button').setAttribute('aria-pressed', String(prefs.ruby));
  settingsFields.forEach(field => {
    const val = prefs[field.key];
    root.style.setProperty(field.prop, val + field.unit);
    const {input, output} = fields.get(field.key);
    input.value = String(val);
    output.value = field.key === 'rubySize' ? Math.round(val * 100) + '%' : field.key === 'leading' ? val + ' 倍' : val + ' ' + field.unit;
  });
}
function buildControls() {
  settingsFields.forEach(field => {
    const raw = stored[field.key];
    prefs[field.key] = Number.isFinite(raw) ? Math.min(field.max, Math.max(field.min, raw)) : field.value;
    const wrap = make('div', 'control');
    const label = make('label', '', field.label);
    const input = make('input');
    input.type = 'range';
    input.id = 'setting-' + field.key;
    for (const attr of ['min','max','step']) input[attr] = String(field[attr]);
    label.htmlFor = input.id;
    const output = make('output');
    output.setAttribute('for',input.id);
    label.append(output);
    wrap.append(label,input);
    byId('settings-controls').append(wrap);
    fields.set(field.key,{input,output});
    input.addEventListener('input', () => {
      prefs[field.key] = Number(input.value);
      applyPrefs(); persist();
    });
  });
  applyPrefs();
}
function pageLinks(value) {
  const label = make('span','page');
  for (const token of String(value).split(/(P?\s*\d+)/gi)) {
    const number = /^P?\s*(\d+)$/i.exec(token);
    if (!number) { label.append(token); continue; }
    const link = make('a','',token);
    link.href = '#p' + number[1];
    link.setAttribute('aria-label','跳到第 ' + number[1] + ' 页');
    label.append(link);
  }
  return label;
}
function drawReader() {
  const fragment = document.createDocumentFragment();
  data.sections.forEach(section => {
    const outer = make('section', 'reader-section');
    const head = make('div', 'section-head');
    head.append(make('h2','',section.label));
    outer.append(head);
    section.groups.forEach(group => {
      if (!group.items.length) return;
      const groupEl = make('div', 'group');
      if (section.groups.length > 1 || group.label !== section.label) groupEl.append(make('h3','groupname',group.label));
      group.items.forEach(item => {
        const article = make('article','card');
        article.id = item.id; article.tabIndex = -1;
        const itemHead = make('div','card-head');
        const isPage = section.kind === 'pages';
        const questionNotes = item.reverse ? make('details','question-notes') : null;
        if (questionNotes) {
          article.dataset.reverse = item.reverse;
          questionNotes.append(make('summary','','依据与使用时机'));
        }
        if (item.page) {
          itemHead.append(isPage ? make('span','page',item.page) : pageLinks(item.page));
        }
        itemHead.append(make('h4','',item.title));
        if (item.audience) itemHead.append(make('span','audience',item.audience));
        article.append(itemHead);
        item.blocks.forEach(block => {
          if (!block.ja && !block.zh) return;
          const row = make('div','block ' + block.type);
          if (block.page) {
            const cue = pageLinks(block.page);
            cue.classList.add('block-page');
            row.append(cue);
          }
          if (block.ja) {
            const ja = make('p','jp');
            ja.lang = 'ja';
            ja.innerHTML = block.ja;
            row.append(ja);
          }
          if (block.zh && (!block.ja || block.zh !== item.title)) {
            row.append(make('p','zh' + (block.ja ? ' translation':''),block.zh));
          }
          if (questionNotes && ['basis','value'].includes(block.type)) questionNotes.append(row);
          else article.append(row);
        });
        if (item.source) {
          const source = make('a','article-source','看原文');
          source.href = item.source;
          source.target = '_blank';
          source.rel = 'noopener noreferrer';
          (questionNotes || article).append(source);
        }
        if (questionNotes) {
          article.append(questionNotes);
          const controls = make('div','review-actions');
          controls.setAttribute('role','group');
          controls.setAttribute('aria-label','审核第 ' + item.reverse + ' 题');
          const choices = [['keep','保留'],['skip','跳过'],['pending','待审']];
          for (const [state,label] of choices) {
            const button = make('button','',label);
            button.type = 'button';
            button.dataset.review = state;
            button.setAttribute('aria-pressed',String((reviews[item.reverse] || 'pending') === state));
            button.addEventListener('click',() => {
              if (state === 'pending') delete reviews[item.reverse];
              else reviews[item.reverse] = state;
              controls.querySelectorAll('button').forEach(el => el.setAttribute('aria-pressed',String(el.dataset.review === state)));
              try { localStorage.setItem(reviewKey,JSON.stringify(reviews)); updateReviewCount(); }
              catch { byId('review-count').textContent = '此浏览器只保留本次选择。'; }
            });
            controls.append(button);
          }
          article.append(controls);
        }
        groupEl.append(article);
        const entry = {section,group,item,article};
        indexed.push(entry); itemsById.set(item.id,entry);
      });
      outer.append(groupEl);
    });
    fragment.append(outer);
  });
  byId('reader').append(fragment);
}
function identifyLocation(entry) {
  if (!entry || current === entry) return;
  current = entry;
  const sectionName = sectionLabels[entry.section.id] || entry.section.label;
  byId('where').textContent = entry.section.kind === 'pages' ? entry.item.page + ' · ' + entry.group.label : sectionName + ' · ' + entry.item.title;
}
let scrollQueued = false;
function track() {
  scrollQueued = false;
  if (!indexed.length || document.querySelector('dialog[open]')) return;
  const line = document.querySelector('.bar').getBoundingClientRect().bottom + 36;
  let lo = 0, hi = indexed.length;
  while (lo < hi) {
    const mid = (lo + hi) >>> 1;
    if (indexed[mid].article.getBoundingClientRect().top <= line) lo = mid + 1;
    else hi = mid;
  }
  const atEnd = Math.ceil(window.scrollY + window.innerHeight) >= document.documentElement.scrollHeight - 2;
  identifyLocation(indexed[atEnd ? indexed.length - 1 : Math.max(0, lo - 1)]);
}
function scheduleTrack() {
  if (!scrollQueued) { scrollQueued = true; requestAnimationFrame(track); }
}
function urlTarget() {
  try { return itemsById.get(decodeURIComponent(location.hash.slice(1))); } catch { return undefined; }
}
function goTo(entry, behavior='smooth', focus=true) {
  if (!entry) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (focus) entry.article.focus({preventScroll:true});
  entry.article.scrollIntoView({block:'start',behavior: reduce ? 'auto' : behavior});
  identifyLocation(entry);
}
function follow(id) {
  const entry = itemsById.get(id);
  if (!entry) return;
  if (contents.open) closeSheet(contents,false);
  if (urlTarget() !== entry) history.pushState(null,'','#' + encodeURIComponent(id));
  goTo(entry);
}
function openSheet(dialog, trigger) {
  opener = trigger;
  if (dialog === settings && current) settingsPosition = {entry:current, top:current.article.getBoundingClientRect().top};
  dialog.showModal();
  document.body.classList.add('modal-open');
  dialog.querySelector('[data-close]').focus({preventScroll:true});
}
function closeSheet(dialog, restore=true) {
  dialog.close();
  document.body.classList.remove('modal-open');
  if (dialog === settings && settingsPosition) {
    window.scrollBy(0, settingsPosition.entry.article.getBoundingClientRect().top - settingsPosition.top);
    settingsPosition = undefined;
  }
  if (restore && opener) opener.focus({preventScroll:true});
}
function drawToc() {
  const section = data.sections.find(s => s.id === activeTab) || data.sections[0];
  if (!section) return;
  const query = byId('toc-search').value.trim().toLowerCase();
  const reviewMode = byId('review-filter').value;
  byId('review-tools').hidden = section.id !== 'reverse';
  if (section.id === 'reverse') updateReviewCount();
  const list = byId('toc-list');
  list.replaceChildren();
  let matches = 0;
  section.groups.forEach((group, index) => {
    const visible = group.items.filter(item => {
      if (item.reverse && reviewMode !== 'all') {
        const state = reviews[item.reverse] || 'pending';
        if (reviewMode === 'priority' ? !item.priority : reviewMode !== state) return false;
      }
      const key = [group.label,item.page,item.title,item.audience,...item.blocks.map(b => b.zh)].join(' ').toLowerCase();
      return !query || key.includes(query);
    });
    if (!visible.length) return;
    const details = make('details','toc-group');
    const sameGroup = current && current.section.id === section.id && current.group.id === group.id;
    details.open = Boolean(query || sameGroup || section.groups.length === 1 || index === 0 && current?.section.id !== section.id);
    details.append(make('summary','',group.label));
    visible.forEach(item => {
      const a = make('a','toc-link');
      a.href = '#' + encodeURIComponent(item.id);
      if (item.id === current?.item.id) a.setAttribute('aria-current','location');
      if (item.page) a.append(make('span','page',item.page));
      a.append(make('span','',item.title));
      const state = item.reverse && reviews[item.reverse];
      if (state || item.priority) a.append(make('span','q-state',state === 'keep' ? '保留' : state === 'skip' ? '跳过' : '优先'));
      details.append(a); matches++;
    });
    list.append(details);
  });
  if (!matches) list.append(make('p','no-results','没有找到匹配的标题。'));
  list.scrollTop = 0;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed',String(b.dataset.section === section.id)));
}
function openContents(button) {
  activeTab = current?.section.id || data.sections[0]?.id;
  byId('toc-search').value = '';
  drawToc(); openSheet(contents,button);
  const selected = contents.querySelector('[aria-current="location"]');
  if (selected) {
    const list = byId('toc-list');
    const delta = selected.getBoundingClientRect().top - list.getBoundingClientRect().top;
    if (delta < 0 || delta + selected.offsetHeight > list.clientHeight) list.scrollTop += delta - 30;
  }
}
function updateReviewCount() {
  const count = data.sections.find(s => s.id === 'reverse').groups.flatMap(g => g.items).length;
  const marked = Object.values(reviews);
  byId('review-count').textContent = '保留 ' + marked.filter(x => x === 'keep').length +
      ' · 跳过 ' + marked.filter(x => x === 'skip').length + ' · 共 ' + count + ' 题（本设备）';
}
byId('review-filter').addEventListener('change', drawToc);
byId('review-export').addEventListener('click', async () => {
  const rows = data.sections.find(s => s.id === 'reverse').groups.flatMap(g => g.items)
    .filter(item => reviews[item.reverse])
    .map(item => item.title + '　' + (reviews[item.reverse] === 'keep' ? '保留' : '跳过'));
  if (!rows.length) { byId('review-count').textContent = '先给至少一题标记。'; return; }
  const summary = 'BASE 逆質問审核\n' + rows.join('\n');
  try {
    await navigator.clipboard.writeText(summary);
    byId('review-count').textContent = '已复制 ' + rows.length + ' 题的审核标记';
  } catch {
    const file = URL.createObjectURL(new Blob([summary], {type:'text/plain;charset=utf-8'}));
    const link = make('a');
    link.href = file; link.download = 'BASE-逆質問审核.txt'; link.click();
    setTimeout(() => URL.revokeObjectURL(file),1000);
    byId('review-count').textContent = '已导出 ' + rows.length + ' 题的审核标记';
  }
});
byId('popup').addEventListener('click', () => {
  const url = new URL(location.href);
  url.searchParams.set('compact','1');
  url.hash = (current?.item.id || '');
  window.open(url.href,'base-casual-mini','popup,width=410,height=630,resizable=yes,scrollbars=yes');
});
buildControls();
drawReader();
identifyLocation(indexed[0]);
data.sections.forEach(section => {
  const tab = make('button','tab',sectionLabels[section.id] || section.label);
  tab.type = 'button'; tab.dataset.section = section.id;
  tab.addEventListener('click', () => { activeTab = section.id; byId('toc-search').value = ''; drawToc(); });
  byId('toc-tabs').append(tab);
});
for (const id of ['location','toc-button']) byId(id).addEventListener('click',e => openContents(e.currentTarget));
byId('settings-button').addEventListener('click',e => openSheet(settings,e.currentTarget));
byId('toc-search').addEventListener('input',drawToc);
for (const [id,key] of [['zh-button','zh'],['ruby-button','ruby']]) {
  byId(id).addEventListener('click', () => {
    const entry = current;
    const before = entry?.article.getBoundingClientRect().top;
    prefs[key] = !prefs[key]; applyPrefs(); persist();
    if (entry) window.scrollBy(0,entry.article.getBoundingClientRect().top-before);
    scheduleTrack();
  });
}
byId('reset').addEventListener('click', () => {
  settingsFields.forEach(f => {prefs[f.key] = f.value;});
  applyPrefs(); persist();
});
for (const dialog of [contents,settings]) {
  dialog.querySelector('[data-close]').addEventListener('click',() => closeSheet(dialog));
  dialog.addEventListener('cancel', e => {e.preventDefault(); closeSheet(dialog);});
  dialog.addEventListener('click', e => {
    if (e.target !== dialog) return;
    const r = dialog.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeSheet(dialog);
  });
}
document.addEventListener('click',e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const id = decodeURIComponent(a.hash.slice(1));
  if (itemsById.has(id)) { e.preventDefault(); follow(id); }
});
window.addEventListener('scroll',scheduleTrack,{passive:true});
window.addEventListener('resize',scheduleTrack);
window.addEventListener('hashchange',() => {
  const entry = urlTarget();
  if (entry) goTo(entry,'auto');
  else if (!location.hash) window.scrollTo({top:0,behavior:'auto'});
});
requestAnimationFrame(() => {const entry=urlTarget(); if(entry) goTo(entry,'auto',false); else scheduleTrack();});
</script>
