uby>気\u003crt>き\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>ってくれた\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせられるのがいいなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。BASE Uで、PAY IDの\u003cruby>事業責任者\u003crt>じぎょうせきにんしゃ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>とショップオーナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、アプリの\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>している\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。あるお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>では\u003cruby>毎月\u003crt>まいつき\u003c/rt>\u003c/ruby>、\u003cruby>月末\u003crt>げつまつ\u003c/rt>\u003c/ruby>の\u003cruby>金曜日\u003crt>きんようび\u003c/rt>\u003c/ruby>が\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>で、その\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>に\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせてお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせを\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>っているそうです。いつも\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てくれる\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に「\u003cruby>今月\u003crt>こんげつ\u003c/rt>\u003c/ruby>も\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>りましたよ」と\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけるような\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>なんだなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"我觉得对店家来说，好处是有好东西上新时，可以告诉那些本来就喜欢自己店的人。我在 BASE U 读到一篇 PAY ID 业务负责人和店主聊 App 用法的文章。有一家店每月月底的周五进货，就趁那一天给关注的人发个通知。听起来很像是跟常来的客人打声招呼，说「这个月的新货也到了」。"}]},{"id":"answers-14","title":"「気になったところや、こうなったらいいと思うことは？」","menuTitle":"我希望 PAY ID 改进的地方","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったところや、こうなったらいいと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うことは？","zh":""},{"type":"note","ja":"","zh":"说你在意的一个瞬间，交代读到的买家经历与现有设置，再提一个小想法。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったのは、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をフォローするときに、どんなお\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>らせがどのくらい\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るのかというところです。そらたさんという\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がnoteの\u003cruby>日記\u003crt>にっき\u003c/rt>\u003c/ruby>で、レコード\u003cruby>店\u003crt>てん\u003c/rt>\u003c/ruby>の\u003cruby>入荷\u003crt>にゅうか\u003c/rt>\u003c/ruby>をまとめて\u003cruby>追\u003crt>お\u003c/rt>\u003c/ruby>えるのは\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>だけど、\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>は\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>く\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じると\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていました。\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>ヘルプを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>むと、マイページで\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>の\u003cruby>種類\u003crt>しゅるい\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>べるんですね。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>だったら、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>をフォローしたときに、あとからどこで\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>を\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えられるのかも\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるとうれしいです。","zh":"我有点在意的是，点关注一家店时，能不能大致知道会收到哪些消息、会有多频繁。我在 note 上读到一位叫そらた的买家写的日记，他觉得集中看唱片店上新挺方便，但也觉得通知多。我看了官方帮助，知道在「我的页面」里已经可以按类型开关通知了。换作我，在关注一家店的当下，如果也能看出来以后去哪里调整通知，就很方便。"}]},{"id":"answers-15","title":"「就活の軸を教えていただけますか。」","menuTitle":"就活の軸 · 选公司时看重什么","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>就活\u003crt>しゅうかつ\u003c/rt>\u003c/ruby>の\u003cruby>軸\u003crt>じく\u003c/rt>\u003c/ruby>を\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えていただけますか。","zh":""},{"type":"note","ja":"","zh":"「会社を選ぶときに何を大事にしていますか」也是同一道题。先讲自己挑工作的标准，问到 BASE 时再讲公司。"},{"type":"speech","ja":"\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ぶときは、デザイナーがサービスづくりにどう\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>われるかを\u003cruby>大事\u003crt>だいじ\u003c/rt>\u003c/ruby>にしています。\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るかを\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>める\u003cruby>段階\u003crt>だんかい\u003c/rt>\u003c/ruby>から、\u003cruby>企画\u003crt>きかく\u003c/rt>\u003c/ruby>や\u003cruby>開発\u003crt>かいはつ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>と\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたいですし、リリースしたあとも、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っている\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>きながら、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しずつ\u003cruby>良\u003crt>よ\u003c/rt>\u003c/ruby>くしていける\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>に\u003cruby>惹\u003crt>ひ\u003c/rt>\u003c/ruby>かれます。","zh":"我选公司时，看重的是设计师能怎样参与一个产品。我希望团队还在讨论要做什么时，就能跟企划和开发一起想；产品上线后，也能听听真正用过的人怎么说，接着把它一点点改好。这样的工作很吸引我。"},{"type":"reply","ja":"BASEグループの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、PAY IDの\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>したチームのインタビューを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。「\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>が\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いづらい」という\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>を\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>けて、エンジニアの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、\u003cruby>購入者\u003crt>こうにゅうしゃ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>に\u003cruby>直接\u003crt>ちょくせつ\u003c/rt>\u003c/ruby>\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみようと\u003cruby>提案\u003crt>ていあん\u003c/rt>\u003c/ruby>されたのが\u003cruby>印象的\u003crt>いんしょうてき\u003c/rt>\u003c/ruby>でした。そこから、\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>したいという\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>えてきて、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>検索\u003crt>けんさく\u003c/rt>\u003c/ruby>も\u003cruby>改善\u003crt>かいぜん\u003c/rt>\u003c/ruby>されたんですよね。いろんな\u003cruby>立場\u003crt>たちば\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が\u003cruby>疑問\u003crt>ぎもん\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>し\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>って、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>を\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>改善\u003crt>かいぜん\u003c/rt>\u003c/ruby>につなげているところに\u003cruby>惹\u003crt>ひ\u003c/rt>\u003c/ruby>かれました。","zh":"我在 BASE 集团官方 note 读了 PAY ID 团队改版搜索的访谈。收到「搜索不太好用」的评价时，是一位工程师先提议去问问实际购物的人，这一点让我印象很深。一问才发现，有人想在喜欢的那家店里找商品，后来团队也改进了店内搜索。不同岗位的人都能提出疑问，用户说的话最后也真的改变了产品。这就是吸引我的地方。","cue":"如果对方问「BASEのどんなところが、その軸に合うと感じましたか。」"}]},{"id":"answers-16","title":"「今後、選考に進むことは考えていますか。」","menuTitle":"已决定参加本选考","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>今後\u003crt>こんご\u003c/rt>\u003c/ruby>、\u003cruby>選考\u003crt>せんこう\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>むことは\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えていますか。","zh":""},{"type":"note","ja":"","zh":"直接说已经决定申请。如果对方只问意向，这一句就够。"},{"type":"speech","ja":"はい。\u003cruby>本\u003crt>ほん\u003c/rt>\u003c/ruby>\u003cruby>選考\u003crt>せんこう\u003c/rt>\u003c/ruby>には、PAY IDのデザイナー\u003cruby>職\u003crt>しょく\u003c/rt>\u003c/ruby>で\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>します。","zh":"是的，我已经决定申请 PAY ID 设计师的本选考。"},{"type":"reply","ja":"はい、ぜひ。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>もまた、お\u003cruby>二人\u003crt>ふたり\u003c/rt>\u003c/ruby>とデザインのお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>ができたらうれしいです。","zh":"好啊，我也很期待以后还有机会和两位聊设计。","cue":"如果对方说「またお話しできるといいですね。」"}]},{"id":"answers-17","title":"已经说过会申请，想问报名的第一步","menuTitle":"确认本选考的下一步","page":"","blocks":[{"type":"note","ja":"","zh":"对方刚说明过报名方法，就照着说明接下去。"},{"type":"speech","ja":"\u003cruby>応募\u003crt>おうぼ\u003c/rt>\u003c/ruby>の\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きについても、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つ\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>ってよろしいでしょうか。このあとは、まず\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をすればいいでしょうか。","zh":"我也想顺便确认一下报名手续。接下来我应该先做什么呢？"}]},{"id":"answers-18","title":"「ほかにも、使っている方の話で印象に残ったものはありますか。」","menuTitle":"印象深的买家使用案例","page":"","blocks":[{"type":"prompt","ja":"ほかにも、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っている\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>の\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>で\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>ったものはありますか。","zh":""},{"type":"note","ja":"","zh":"对方想听别人的购物体验时再讲。刚才说的是你的购物习惯，这里说的是一位店主自己购物时的经历。"},{"type":"speech","ja":"はい。M’s homelifeという\u003cruby>器\u003crt>うつわ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>のブログで、\u003cruby>店主\u003crt>てんしゅ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、ご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>の\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>について\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>いていました。Instagramで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけたお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にBASEを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っているところが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>くて、PAY IDがあれば、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わっても\u003cruby>何度\u003crt>なんど\u003c/rt>\u003c/ruby>も\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れずに\u003cruby>済\u003crt>す\u003c/rt>\u003c/ruby>むそうです。\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>のお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>回\u003crt>まわ\u003c/rt>\u003c/ruby>る\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>には、こういうところが\u003cruby>便利\u003crt>べんり\u003c/rt>\u003c/ruby>なんだなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いました。","zh":"有。我在一家叫 M’s homelife 的餐具店博客里，读到店主写自己当买家的经历。她在 Instagram 发现的店有不少都用 BASE，有 PAY ID 以后，换店购物也省得反复填同样的信息。对于本来就喜欢逛不同店的人，这点很实在。"}]},{"id":"answers-19","title":"「なぜ、デザインが好きなのですか。」","menuTitle":"为什么喜欢设计","page":"","blocks":[{"type":"prompt","ja":"なぜ、デザインが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなのですか。","zh":""},{"type":"note","ja":"","zh":"可以直接用 Goodpatch 小窗里已经熟悉的回答。问到设计本身，讲你的设计观就够了。"},{"type":"speech","ja":"そうですね。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>がデザインを\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>いと\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じるのは、すでにあるものを\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>分解\u003crt>ぶんかい\u003c/rt>\u003c/ruby>して、\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせ\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すことで、\u003cruby>新\u003crt>あたら\u003c/rt>\u003c/ruby>しい\u003cruby>価値\u003crt>かち\u003c/rt>\u003c/ruby>を\u003cruby>生\u003crt>う\u003c/rt>\u003c/ruby>み\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>せるところです。\u003cruby>世\u003crt>よ\u003c/rt>\u003c/ruby>の\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>には、\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>がかかっても\u003cruby>避\u003crt>さ\u003c/rt>\u003c/ruby>けられないことや、\u003cruby>複雑\u003crt>ふくざつ\u003c/rt>\u003c/ruby>な\u003cruby>仕組\u003crt>しく\u003c/rt>\u003c/ruby>みがあります。そうしたものも、デザインによって\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しでも\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れやすく、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>いやすい\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にできると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うんです。\u003cruby>手順\u003crt>てじゅん\u003c/rt>\u003c/ruby>の\u003cruby>効率\u003crt>こうりつ\u003c/rt>\u003c/ruby>や、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うときの\u003cruby>気持\u003crt>きも\u003c/rt>\u003c/ruby>ちまで\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるところに\u003cruby>魅力\u003crt>みりょく\u003c/rt>\u003c/ruby>を\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じています。","zh":"我觉得设计有意思，是因为可以把已有的东西拆开，再重新组合，从里面创造出新的价值。生活里有些事很麻烦，可我们总得去做，也有些东西本身就很复杂。我觉得，通过设计，可以让这些事变得容易接受一点，做起来也顺手一点。我喜欢的是，除了琢磨怎样让步骤更省事，还能顾及人在使用时是什么心情。"}]},{"id":"answers-20","title":"「うちのサービスで、そういう面白さを感じた例はありますか。」","menuTitle":"我喜欢的 BASE 设计案例","page":"","blocks":[{"type":"prompt","ja":"うちのサービスで、そういう\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>さを\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じた\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>はありますか。","zh":""},{"type":"note","ja":"","zh":"对方顺着平面到 UI 的话题，问你在 BASE 看到过什么时再说。这一例是店家用的 BASE 网店编辑器。"},{"type":"speech","ja":"\u003cruby>北村\u003crt>きたむら\u003c/rt>\u003c/ruby>さんがCocodaに\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>かれた、BASEのショップ\u003cruby>編集\u003crt>へんしゅう\u003c/rt>\u003c/ruby>\u003cruby>機能\u003crt>きのう\u003c/rt>\u003c/ruby>の\u003cruby>記事\u003crt>きじ\u003c/rt>\u003c/ruby>が\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っています。\u003cruby>以前\u003crt>いぜん\u003c/rt>\u003c/ruby>は、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>にバナーを\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>足\u003crt>た\u003c/rt>\u003c/ruby>すのにもHTMLを\u003cruby>編集\u003crt>へんしゅう\u003c/rt>\u003c/ruby>する\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>があったそうですね。それが、スマホでパーツを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>がご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>で\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えられるようになった。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は「バナーを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>る」ほうにはなじみがあるんですけど、「お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>が、\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せたいときに\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>載\u003crt>の\u003c/rt>\u003c/ruby>せられるようにする」ところもデザインできるんだ、というのが\u003cruby>面白\u003crt>おもしろ\u003c/rt>\u003c/ruby>かったです。","zh":"我印象很深的是，北村先生在 Cocoda 写的那篇 BASE 网店编辑器改版。以前店主想给自己店里加一张横幅，还得去改 HTML。改版以后，店主用手机选好组件，自己就能改。我熟悉的是「做一张横幅」，所以读到这儿觉得特别有意思。原来「让店主能在自己想放的时候亲手把它放上去」，也是设计师能做的事。"},{"type":"reply","ja":"そういうときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるんですね。ちょっと\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>したいところがあるたびにパソコンを\u003cruby>開\u003crt>ひら\u003c/rt>\u003c/ruby>かなくていいのは、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>にはありがたいですね。","zh":"原来那个时候就用得上。对店主来说，想改一个小地方时不用每次都打开电脑，确实方便。","cue":"如果对方接着说起店主什么时候会用手机改店铺"}]},{"id":"answers-21","title":"「日本語でのやり取りについては、どう感じていますか。」","menuTitle":"日语听说和日常沟通","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>でのやり\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りについては、どう\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じていますか。","zh":""},{"type":"note","ja":"","zh":"对方主动问到语言时用。如果刚刚问过外籍同事、聊过自己的情况，这段就已经答过了。"},{"type":"speech","ja":"\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>でお\u003cruby>話\u003crt>はなし\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>く\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>にはほとんど\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>らないんですけど、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えをその\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えようとすると、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>が\u003cruby>母語\u003crt>ぼご\u003c/rt>\u003c/ruby>の\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>ほどすっと\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>てこないことがあるんです。もちろん、\u003cruby>日本語\u003crt>にほんご\u003c/rt>\u003c/ruby>の\u003cruby>表現力\u003crt>ひょうげんりょく\u003c/rt>\u003c/ruby>はこれからも\u003cruby>磨\u003crt>みが\u003c/rt>\u003c/ruby>いていきますし、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>から\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りの\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけて、チームで\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>し\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>うときも、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>はまず\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>言葉\u003crt>ことば\u003c/rt>\u003c/ruby>で\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えるようにしています。それでも\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>い\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>ったときは、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はAIや\u003cruby>翻訳\u003crt>ほんやく\u003c/rt>\u003c/ruby>ツールも\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>えるので、\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたいニュアンスに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>う\u003cruby>表現\u003crt>ひょうげん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>して、きちんと\u003cruby>相手\u003crt>あいて\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたいです。","zh":"平时听大家说日语，我基本没什么困难，不过要当场表达自己的想法，有些话确实没法像日语母语者那样一下子说出来。当然，我也会继续练好日语表达。平时我会主动找人交流，团队讨论时只要有想法，我就会先试着用自己的话说出来。如果还是拿不准怎么说，现在也有 AI 和翻译工具可以用，我会借助它们找个更贴近本意的说法，把意思好好传达给对方。"}]},{"id":"answers-22","title":"「チームでどんな強みを生かしたいですか。」","menuTitle":"我想在团队发挥的设计强项","page":"","blocks":[{"type":"prompt","ja":"チームでどんな\u003cruby>強\u003crt>つよ\u003c/rt>\u003c/ruby>みを\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>かしたいですか。","zh":""},{"type":"note","ja":"","zh":"如果刚聊过外籍同事时已经答到了，顺着对方的下一句聊。"},{"type":"speech","ja":"\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かいところにも\u003cruby>目\u003crt>め\u003c/rt>\u003c/ruby>を\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けて、\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>を\u003cruby>整理\u003crt>せいり\u003c/rt>\u003c/ruby>しながら\u003cruby>筋道\u003crt>すじみち\u003c/rt>\u003c/ruby>を\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>てて\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えられるところが、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>持\u003crt>も\u003c/rt>\u003c/ruby>ち\u003cruby>味\u003crt>あじ\u003c/rt>\u003c/ruby>かなと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>っています。\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>課題\u003crt>かだい\u003c/rt>\u003c/ruby>があったときに、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>ち\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>って、そもそも\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>問題\u003crt>もんだい\u003c/rt>\u003c/ruby>なのかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えるのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きなんです。\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>かと\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>を\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めたり、チームで\u003cruby>課題\u003crt>かだい\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>んだりするときに、その\u003cruby>力\u003crt>ちから\u003c/rt>\u003c/ruby>を\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>かしたいです。","zh":"我觉得自己可能比较擅长留意细节，把信息理顺，再有条理地往下想。遇到课题的时候，我喜欢回到起点，先想清楚究竟是什么出了问题。以后和别人一起工作、在团队里解决课题的时候，我希望能把这份长处发挥出来。"}]},{"id":"answers-23","title":"「大学で、グループで何か作ったことはありますか。」","menuTitle":"小组制作时我负责什么","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>大学\u003crt>だいがく\u003c/rt>\u003c/ruby>で、グループで\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったことはありますか。","zh":""},{"type":"note","ja":"","zh":"先说一起做了什么、自己负责哪部分。等对方感兴趣再展开分工。"},{"type":"speech","ja":"はい。\u003cruby>大学\u003crt>だいがく\u003c/rt>\u003c/ruby>の\u003cruby>授業\u003crt>じゅぎょう\u003c/rt>\u003c/ruby>で、みんなで\u003cruby>一冊\u003crt>いっさつ\u003c/rt>\u003c/ruby>の\u003cruby>雑誌\u003crt>ざっし\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったことがあります。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>はメンバーから\u003cruby>原稿\u003crt>げんこう\u003c/rt>\u003c/ruby>や\u003cruby>写真\u003crt>しゃしん\u003c/rt>\u003c/ruby>を\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>って、\u003cruby>誌面\u003crt>しめん\u003c/rt>\u003c/ruby>\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>のレイアウトを\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>しました。\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>は\u003cruby>全員\u003crt>ぜんいん\u003c/rt>\u003c/ruby>で\u003cruby>校正\u003crt>こうせい\u003c/rt>\u003c/ruby>して、\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>して\u003cruby>印刷\u003crt>いんさつ\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>した\u003cruby>雑誌\u003crt>ざっし\u003c/rt>\u003c/ruby>は、\u003cruby>授業\u003crt>じゅぎょう\u003c/rt>\u003c/ruby>の\u003cruby>優秀\u003crt>ゆうしゅう\u003c/rt>\u003c/ruby>\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>に\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>ばれました。","zh":"有。大学有门课，我们小组一起做过一本杂志。组员把稿件和照片交给我，我负责整本杂志的版面。最后我们一起校对，由我改好后交印。做出来的杂志入选了这门课的优秀作品。"}]},{"id":"answers-24","title":"「一緒に進める中で、難しかったことはありましたか。」","menuTitle":"小组合作时遇到的困难","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>める\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>で、\u003cruby>難\u003crt>むずか\u003c/rt>\u003c/ruby>しかったことはありましたか。","zh":""},{"type":"note","ja":"","zh":"承接杂志项目，说清自己为什么注意到分工问题。"},{"type":"speech","ja":"\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>を\u003cruby>何人\u003crt>なんにん\u003c/rt>\u003c/ruby>かで\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めていたり、\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>によって\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>み\u003cruby>具合\u003crt>ぐあい\u003c/rt>\u003c/ruby>に\u003cruby>差\u003crt>さ\u003c/rt>\u003c/ruby>が\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>たりしたんです。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>原稿\u003crt>げんこう\u003c/rt>\u003c/ruby>を\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ってページを\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>む\u003cruby>役\u003crt>やく\u003c/rt>\u003c/ruby>だったので、そこが\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になって。「\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>、\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>なことに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせて\u003cruby>分担\u003crt>ぶんたん\u003c/rt>\u003c/ruby>を\u003cruby>見直\u003crt>みなお\u003c/rt>\u003c/ruby>しませんか」と\u003cruby>声\u003crt>こえ\u003c/rt>\u003c/ruby>をかけました。それで、\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をいつまでに\u003cruby>用意\u003crt>ようい\u003c/rt>\u003c/ruby>するか、みんなで\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>め\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>しました。","zh":"做了一阵子，有的工作好几个人都在做，各部分的进度也不太一样。我负责拿到稿件后排版，所以留意到了这个问题。我就跟大家提议，「我们要不要按各自擅长的事情，再看一下怎么分工？」后来大家一起重新定了谁负责什么、什么时候交。"}]},{"id":"answers-25","title":"「もう一度やるとしたら、何か変えたいことはありますか。」","menuTitle":"再做一次会怎么改进分工","page":"","blocks":[{"type":"prompt","ja":"もう\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>やるとしたら、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>か\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>えたいことはありますか。","zh":""},{"type":"note","ja":"","zh":"如果对方对合作过程有兴趣，补一句回头看学到了什么。"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>だったら、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にそれぞれ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>得意\u003crt>とくい\u003c/rt>\u003c/ruby>か、どれくらい\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>き\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>けられそうかを\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いておきたいです。あとは、\u003cruby>仕上\u003crt>しあ\u003c/rt>\u003c/ruby>げに\u003cruby>入\u003crt>はい\u003c/rt>\u003c/ruby>る\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>、\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>のものをみんなで\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ようと\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めておきます。そうすれば、\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>が\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>なっても\u003cruby>早\u003crt>はや\u003c/rt>\u003c/ruby>めに\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>づけると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うので。","zh":"现在再做的话，我会先问大家各自擅长什么、大概能承担多少工作。还会提前约一次，在进入最后收尾之前，大家一起看看各自手头做到哪里了。这样就算有工作重叠，也能早点发现。"}]},{"id":"answers-26","title":"「具体的に、中国と日本では、仕事の進め方にどんな違いがあると思いますか。」","menuTitle":"中日 UI/UX 行业 · 设计师从哪一步参与","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>具体的\u003crt>ぐたいてき\u003c/rt>\u003c/ruby>に、\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>と\u003cruby>日本\u003crt>にっぽん\u003c/rt>\u003c/ruby>では、\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>の\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>め\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>にどんな\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いがあると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いますか。","zh":""},{"type":"note","ja":"","zh":"如果聊到中日 UI/UX 业界，从设计师参与哪些决定讲起。"},{"type":"speech","ja":"\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>事例\u003crt>じれい\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んでいて\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いを\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じたのは、デザイナーがどの\u003cruby>段階\u003crt>だんかい\u003c/rt>\u003c/ruby>から\u003cruby>関\u003crt>かか\u003c/rt>\u003c/ruby>わるかです。チームラボの\u003cruby>公式\u003crt>こうしき\u003c/rt>\u003c/ruby>noteで、\u003cruby>以前\u003crt>いぜん\u003c/rt>\u003c/ruby>テンセントにいたデザイナーの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が、\u003cruby>当時\u003crt>とうじ\u003c/rt>\u003c/ruby>はすでに\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>まった\u003cruby>方針\u003crt>ほうしん\u003c/rt>\u003c/ruby>に\u003cruby>沿\u003crt>そ\u003c/rt>\u003c/ruby>ってUIを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ることが\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>かったと\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>されていました。\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>が\u003cruby>日本\u003crt>にっぽん\u003c/rt>\u003c/ruby>で\u003cruby>商業\u003crt>しょうぎょう\u003c/rt>\u003c/ruby>\u003cruby>施設\u003crt>しせつ\u003c/rt>\u003c/ruby>のアプリを\u003cruby>担当\u003crt>たんとう\u003c/rt>\u003c/ruby>したときは、まず\u003cruby>現地\u003crt>げんち\u003c/rt>\u003c/ruby>に\u003cruby>通\u003crt>かよ\u003c/rt>\u003c/ruby>って、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>にどう\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うかを\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べるところから\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたそうです。\u003cruby>国\u003crt>くに\u003c/rt>\u003c/ruby>の\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>いだけでなく、どんなサービスで\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>任\u003crt>まか\u003c/rt>\u003c/ruby>されるかによっても、\u003cruby>仕事\u003crt>しごと\u003c/rt>\u003c/ruby>の\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>め\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>はかなり\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わるんだなと\u003cruby>感\u003crt>かん\u003c/rt>\u003c/ruby>じました。","zh":"我读案例时，感受到的一个差别是设计师从哪一步参与。teamLab 的官方 note 采访过一位以前在腾讯工作的设计师。她说，当时自己更多是按照已经定下的方向做 UI。后来同一个人在日本负责商场 App，却是先到商场去，了解顾客逛街时会怎么用这个 App。从她的经历来看，做的是什么产品、团队把哪部分交给设计师，也会让工作方式有很大差别。"},{"type":"reply","ja":"はい、\u003cruby>中国\u003crt>ちゅうごく\u003c/rt>\u003c/ruby>にもそういうチームはあると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>日本\u003crt>にっぽん\u003c/rt>\u003c/ruby>で\u003cruby>働\u003crt>はたら\u003c/rt>\u003c/ruby>きたいのは、\u003cruby>大学\u003crt>だいがく\u003c/rt>\u003c/ruby>からここで\u003cruby>暮\u003crt>く\u003c/rt>\u003c/ruby>らしてきて、サービスを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>が\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>の\u003cruby>生活\u003crt>せいかつ\u003c/rt>\u003c/ruby>と\u003cruby>結\u003crt>むす\u003c/rt>\u003c/ruby>びついているからです。\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>がふと\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったことをきっかけに、ほかの\u003cruby>方\u003crt>ほう\u003c/rt>\u003c/ruby>はどう\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っているのかも\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いて、デザインに\u003cruby>生\u003crt>い\u003c/rt>\u003c/ruby>かしていきたいです。","zh":"是的，中国也有这样的团队。我想在日本工作，是因为从大学起就在这里生活，很多服务在什么场景下会被用到，我自己就有切身体会。我希望从日常里留意到的小事出发，也去听听别人是怎么用的，再把这些发现用到设计里。","cue":"如果对方问「中国にもそういう会社はありますよね。それでも、なぜ日本で働きたいのですか。」"}]}]},{"id":"feedback","label":"听完反馈怎么接","items":[{"id":"feedback-1","title":"作品刚讲完、还没收到具体建议","menuTitle":"请对方给作品提建议","page":"","blocks":[{"type":"speech","ja":"\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>の\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>え\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>についても、\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しご\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>をいただけたらうれしいです。\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>の\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>で、どうしてそのデザインにしたのか、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>を\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたかったところはありますか。","zh":"关于我刚才讲作品的方式，也想听听您的意见。有没有哪一处，您想再多听一点我为什么这么设计？"},{"type":"reply","ja":"ありがとうございます。\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がどんな\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>にいるのか、\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>にひと\u003cruby>言\u003crt>こと\u003c/rt>\u003c/ruby>あると、そのあとの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>も\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>やすくなりますね。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>にお\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せするときは、そこから\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>してみます。","zh":"谢谢。先交代一句使用者当时遇到了什么事，后面的界面就好理解多了。下次介绍时，我想从那里讲起。","cue":"如果对方建议先讲谁会在什么情况下用"},{"type":"reply","ja":"ありがとうございます。\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>ではどのページが\u003cruby>印象\u003crt>いんしょう\u003c/rt>\u003c/ruby>に\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>るか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないので、そう\u003cruby>言\u003crt>い\u003c/rt>\u003c/ruby>っていただけてうれしいです。","zh":"谢谢。我自己其实很难判断哪一页会给人留下印象，听您专门提到这一页，我很开心。","cue":"如果对方特意指出某一页讲得好"}]},{"id":"feedback-2","title":"比如，对方说TUCK的场景讲得太快","menuTitle":"听到场景讲得太快","page":"","blocks":[{"type":"speech","ja":"ありがとうございます。\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んだところを、もう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>しゆっくりお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>しするとよさそうですね。そうすると、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>だけが\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たときに、なぜスリッパのほうを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>したのかも\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりそうです。","zh":"谢谢。我可以把一开始袜子和拖鞋两样都交给机器人的那段，稍微讲慢一点。这样后面只收到袜子的通知时，为什么要把拖鞋放在前面，听起来应该也更容易理解。"}]},{"id":"feedback-3","title":"如果对方建议多讲设计过程，想请对方举一处","menuTitle":"想请对方举一处具体建议","page":"","blocks":[{"type":"speech","ja":"ありがとうございます。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えば、テーマを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>経緯\u003crt>けいい\u003c/rt>\u003c/ruby>と、\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>から\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>だと、どちらをもう\u003cruby>少\u003crt>すこ\u003c/rt>\u003c/ruby>し\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいですか。","zh":"谢谢。比如一开始怎么选定这个主题，以及后来为什么从两种界面方案里选了这一版，这两部分，您更想多听哪一块？"},{"type":"reply","ja":"お\u003cruby>二人\u003crt>ふたり\u003c/rt>\u003c/ruby>とも、\u003cruby>丁寧\u003crt>ていねい\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てくださってありがとうございます。いただいたアドバイスをもとに、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>にお\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せするときの\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>を\u003cruby>一度\u003crt>いちど\u003c/rt>\u003c/ruby>\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>してみます。","zh":"谢谢两位这么认真地看我的作品。我想按刚才的建议，再顺一遍下次介绍时怎么讲。","cue":"如果两位都给了具体建议"}]},{"id":"q37","title":"哪处值得把中途的方案也拿出来","menuTitle":"哪处值得把中途的方案也拿出来","page":"","blocks":[{"type":"speech","ja":"\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>ほどの\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>のことで、もう\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つだけご\u003cruby>意見\u003crt>いけん\u003c/rt>\u003c/ruby>を\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいです。\u003cruby>完成\u003crt>かんせい\u003c/rt>\u003c/ruby>した\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、「ここはほかにどんな\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>したんだろう」と\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になったところがあれば、\u003cruby>教\u003crt>おし\u003c/rt>\u003c/ruby>えていただけるとうれしいです。","zh":"关于刚才一起看的作品，我还想听听意见。看成品的时候，有没有哪一处让人好奇「这里是不是还试过别的方案」？如果有，我很想知道是哪一处。"},{"type":"reply","ja":"はい、14ページに\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べています。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>なら、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>がお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>していることが\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるので、この\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。","zh":"好，几个方案都放在第 14 页了。中间这版能同时看到包裹已经到店，以及店家正在检查衣服，所以最后选了它。","cue":"如果聊到想看 MORI 里包裹到店后的页面为什么定成这一版"}],"followups":[{"cue":"如果对方建议把犹豫过的两个方案并排展示","ja":"\u003cruby>二\u003crt>ふた\u003c/rt>\u003c/ruby>つ\u003cruby>並\u003crt>なら\u003c/rt>\u003c/ruby>べると、\u003cruby>最後\u003crt>さいご\u003c/rt>\u003c/ruby>になぜこちらを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだのかが\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>わりやすいんですね。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、どこが\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>め\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>になったかも\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>にお\u003cruby>話\u003crt>はな\u003c/rt>\u003c/ruby>ししてみます。","zh":"原来把两种方案并排放着看，别人会更容易明白最后为什么选这一版。下次我会把决定取舍的那一点也一起讲出来。"}],"audience":""}]},{"id":"mori-questions","label":"第一件 MORI · 追问","items":[{"id":"mori-3","title":"「このテーマを選んだきっかけは何ですか。」","menuTitle":"MORI · 为什么做退货","page":"","blocks":[{"type":"prompt","ja":"このテーマを\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだきっかけは\u003cruby>何\u003crt>なん\u003c/rt>\u003c/ruby>ですか。","zh":""},{"type":"note","ja":"","zh":"对方想知道你怎么会注意到退货。从买家寄出退货后遇到的疑问，讲到自己查过的退货说明。"},{"type":"speech","ja":"ネットで\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>をするのが\u003cruby>好\u003crt>す\u003c/rt>\u003c/ruby>きで、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>から\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>ると、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>した\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>に\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>がどこまで\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>んでいるかは\u003cruby>追\u003crt>お\u003c/rt>\u003c/ruby>いにくい、と\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったのがきっかけです。いくつかのサービスの\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>んでみると、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と、お\u003cruby>金\u003crt>かね\u003c/rt>\u003c/ruby>が\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ったかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>が\u003cruby>別々\u003crt>べつべつ\u003c/rt>\u003c/ruby>でした。それで、シャツを\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>枚\u003crt>まい\u003c/rt>\u003c/ruby>\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>す\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>立場\u003crt>たちば\u003c/rt>\u003c/ruby>で、\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ってから\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>されるまで、いつ\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かれば\u003cruby>安心\u003crt>あんしん\u003c/rt>\u003c/ruby>して\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>てるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"我自己喜欢网购，注意到站在买家这边，衣服寄回去后很难知道退款办到哪一步了，这是我选这个主题的起点。我读了几家服务的退货说明，发现确认包裹有没有到、钱有没有退回来，得去不同的地方看。所以我站在只退一件衬衫的人的角度，把寄回到退款这一段顺了一遍，想弄清每一步知道些什么，心里才有底。"}]},{"id":"mori-4","title":"「この4,800円は、どう計算したんですか。」","menuTitle":"MORI · 4,800 日元怎么算","page":"","blocks":[{"type":"prompt","ja":"この\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>は、どう\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>したんですか。","zh":""},{"type":"note","ja":"","zh":"打开P18，先说按商品价格分摊，再指着画面逐项算。"},{"type":"speech","ja":"これは、シャツだけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>した\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>にカードに\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>の\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>です。\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>うときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ったクーポンとポイントを、\u003cruby>二\u003crt>に\u003c/rt>\u003c/ruby>\u003cruby>着\u003crt>ちゃく\u003c/rt>\u003c/ruby>の\u003cruby>値段\u003crt>ねだん\u003c/rt>\u003c/ruby>に\u003cruby>応\u003crt>おう\u003c/rt>\u003c/ruby>じて\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>しました。シャツが\u003cruby>6,600円\u003crt>ろくせんろっぴゃくえん\u003c/rt>\u003c/ruby>、パンツが4,400\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>で、シャツが\u003cruby>合計\u003crt>ごうけい\u003c/rt>\u003c/ruby>11,000\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>の\u003cruby>6割\u003crt>ろくわり\u003c/rt>\u003c/ruby>です。なので、この\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>った1,000\u003cruby>円\u003crt>えん\u003c/rt>\u003c/ruby>のクーポンと1,000ポイントのうち、\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>と\u003cruby>600ポイント\u003crt>ろっぴゃくぽいんと\u003c/rt>\u003c/ruby>がシャツの\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>です。","zh":"这是只退衬衫时，预计能退回银行卡的金额。买这两件衣服时用掉的优惠券和积分，我按两件衣服各自的价格分摊。衬衫 6,600 日元，裤子 4,400 日元，合计 11,000 日元，衬衫占六成。所以这单用掉的 1,000 日元优惠券和 1,000 积分里，衬衫分到的是 600 日元优惠和 600 积分。"},{"type":"speech","ja":"シャツの\u003cruby>6,600円\u003crt>ろくせんろっぴゃくえん\u003c/rt>\u003c/ruby>から、クーポンで\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>いた\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>、ポイントで\u003cruby>払\u003crt>はら\u003c/rt>\u003c/ruby>った\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>\u003cruby>分\u003crt>ぶん\u003c/rt>\u003c/ruby>、それに\u003cruby>返送\u003crt>へんそう\u003c/rt>\u003c/ruby>\u003cruby>料\u003crt>りょう\u003c/rt>\u003c/ruby>の\u003cruby>600円\u003crt>ろっぴゃくえん\u003c/rt>\u003c/ruby>を\u003cruby>引\u003crt>ひ\u003c/rt>\u003c/ruby>くと、カードには\u003cruby>4,800円\u003crt>よんせんはっぴゃくえん\u003c/rt>\u003c/ruby>\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>る\u003cruby>計算\u003crt>けいさん\u003c/rt>\u003c/ruby>です。\u003cruby>600ポイント\u003crt>ろっぴゃくぽいんと\u003c/rt>\u003c/ruby>は\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>に\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>ります。この\u003cruby>作品\u003crt>さくひん\u003c/rt>\u003c/ruby>ではそういうルールにしていて、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>がシャツを\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したら\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>が\u003cruby>確定\u003crt>かくてい\u003c/rt>\u003c/ruby>します。","zh":"从 6,600 日元里扣掉优惠的 600 日元、积分支付的 600 日元，再扣 600 日元退货运费，预计退回卡里 4,800 日元，另退 600 积分。这是这个作品里设定的规则，等店铺检查过衬衫，金额才确定。"}]},{"id":"mori-5","title":"「どうして、この表示にしたんですか。」","menuTitle":"MORI · 为什么选这个方案","page":"","blocks":[{"type":"prompt","ja":"どうして、この\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>にしたんですか。","zh":""},{"type":"note","ja":"","zh":"翻P14。问的是为什么选中间这版，先说它解决了哪个疑问，再指旁边的方案。"},{"type":"speech","ja":"\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>がお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>はまだこれからだということを、\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えたくて、\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びました。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>は「\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しています」と\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きく\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>すので、\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>していることは\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>なら、その\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>にお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>受\u003crt>う\u003c/rt>\u003c/ruby>け\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったことまで\u003cruby>一目\u003crt>ひとめ\u003c/rt>\u003c/ruby>で\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>の\u003cruby>履歴\u003crt>りれき\u003c/rt>\u003c/ruby>や\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>の\u003cruby>内訳\u003crt>うちわけ\u003c/rt>\u003c/ruby>は、\u003cruby>詳\u003crt>くわ\u003c/rt>\u003c/ruby>しく\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいときに\u003cruby>開\u003crt>あ\u003c/rt>\u003c/ruby>けるようにしました。","zh":"我选中间这版，是想让人同时知道包裹已经到店、退款还在后面。右边这版把「正在检查商品」突出显示，能看明白店家正在做什么。中间这版则一眼就能看到，店家在这之前已经收到了衣服。物流记录和金额明细，需要时可以再打开。"}]},{"id":"mori-6","title":"「待つだけでいいと、どう伝えていますか。」","menuTitle":"MORI · 什么时候只要等待","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>つだけでいいと、どう\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えていますか。","zh":""},{"type":"note","ja":"","zh":"翻P21，先答正在等谁、要等到什么时候，再说明需要买家回应时会怎样。"},{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>していることと、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>がいつまでに\u003cruby>来\u003crt>く\u003c/rt>\u003c/ruby>るかを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しています。この\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>だと、シャツは\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>中\u003crt>ちゅう\u003c/rt>\u003c/ruby>で、21\u003cruby>日\u003crt>にち\u003c/rt>\u003c/ruby>までにお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>から\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>ます。もしお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>でタグが\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つからず、\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>った\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>にも\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>してほしいなら、\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>も\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わります。タグを\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れた\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>は、そのときの\u003cruby>様子\u003crt>ようす\u003c/rt>\u003c/ruby>をお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えられるよう、\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>ボタンを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。","zh":"我会写清店铺正在做什么，以及最晚什么时候会再联系。这个例子里，衬衫还在检查，店家会在 21 日前发消息。如果店家没找到吊牌，需要买家也确认一下，页面的内容就会变。如果买家记得自己把吊牌放进去了，可以点联系按钮，跟店家说明当时打包的情况。"}]},{"id":"mori-7","title":"「P15の数字は、実際に取ったアンケートですか。」","menuTitle":"MORI · 问卷数字的来源","page":"","blocks":[{"type":"prompt","ja":"P15の\u003cruby>数字\u003crt>すうじ\u003c/rt>\u003c/ruby>は、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>ったアンケートですか。","zh":""},{"type":"note","ja":"","zh":"直接说数据从哪里来、它在作品里用来做什么。"},{"type":"speech","ja":"いいえ。\u003cruby>各案\u003crt>かくあん\u003c/rt>\u003c/ruby>に\u003cruby>50件\u003crt>ごじゅっけん\u003c/rt>\u003c/ruby>ずつ、\u003cruby>仮\u003crt>かり\u003c/rt>\u003c/ruby>の\u003cruby>回答\u003crt>かいとう\u003c/rt>\u003c/ruby>を\u003cruby>入\u003crt>い\u003c/rt>\u003c/ruby>れています。\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せ\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うと、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たときの\u003cruby>安心感\u003crt>あんしんかん\u003c/rt>\u003c/ruby>がどう\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わるか。それを\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べる\u003cruby>方法\u003crt>ほうほう\u003c/rt>\u003c/ruby>を\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>したページです。\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>にB\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだ\u003cruby>理由\u003crt>りゆう\u003c/rt>\u003c/ruby>は、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>の\u003cruby>到着\u003crt>とうちゃく\u003c/rt>\u003c/ruby>とお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>を\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>せられるからです。","zh":"不是，每个方案的 50 份回答都是假设数据。这一页想说明，如果要了解不同的呈现方式会怎样影响人们看到退货指引时的安心感，可以怎样比较。我选 B 方案，实际依据是它能把包裹已经到店和店家目前的检查进度放在一起。"}]},{"id":"mori-8","title":"「実際に使ってもらって、分かりやすいか確かめましたか。」","menuTitle":"MORI · 用户试用情况","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらって、\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりやすいか\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめましたか。","zh":""},{"type":"note","ja":"","zh":"先说做到哪一步。对方想听下一步时，再讲你要观察的具体判断。"},{"type":"speech","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらうのは、これからです。まずは\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらって、「このシャツを\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>したら、カードにはいくら、ポイントはいくつ\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>りますか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいです。\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>り\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>した\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>なら、「\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>からお\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>に\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>しますか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>きます。どこを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てそう\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>ったかも\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>けると、\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>す\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かると\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>います。","zh":"还没请人实际试过。我想先让人看退款页面，问「这件衬衫退了的话，会退回卡里多少钱、返还多少积分？」换到寄回后的页面，再问「现在你会主动联系店家吗？」再听听他们是看了哪里才这么判断的，就比较容易找到需要改的地方。"}]}]},{"id":"tuck-questions","label":"第二件 TUCK T10 · 追问","items":[{"id":"tuck-3","title":"「実際の製品を調べて作ったんですか。」","menuTitle":"TUCK · 参考了什么产品","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>の\u003cruby>製品\u003crt>せいひん\u003c/rt>\u003c/ruby>を\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べて\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":""},{"type":"note","ja":"","zh":"对方在问参考过什么、你自己做了哪部分。P29–30有操作指南和提案范围。"},{"type":"speech","ja":"はい。RoborockのSaros Z70という、アーム\u003cruby>付\u003crt>つ\u003c/rt>\u003c/ruby>きのロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>の\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>ガイドを\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>みました。\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>の\u003cruby>重\u003crt>おも\u003c/rt>\u003c/ruby>さや\u003cruby>周\u003crt>まわ\u003c/rt>\u003c/ruby>りのスペースによっては、\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>の\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>まで\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べないことがあるんです。そこから、\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>で\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけを\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>んだ\u003cruby>後\u003crt>あと\u003c/rt>\u003c/ruby>、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からなかったら\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>がどう\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるか、というところまでをアプリ\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>にしました。","zh":"是的。我读了 Roborock 一款叫 Saros Z70 的机械臂扫地机器人的操作指南。物品的重量、旁边空间够不够，都可能影响它能不能把东西运到预定位置。所以我从人在地图上选好物品、交给机器人收拾，一直设计到之后没收到结果时，人可以怎样自己去确认。"}]},{"id":"tuck-4","title":"「スリッパの移動に失敗したということですか。」","menuTitle":"TUCK · 拖鞋是否搬运成功","page":"","blocks":[{"type":"prompt","ja":"スリッパの\u003cruby>移動\u003crt>いどう\u003c/rt>\u003c/ruby>に\u003cruby>失敗\u003crt>しっぱい\u003c/rt>\u003c/ruby>したということですか。","zh":""},{"type":"note","ja":"","zh":"对方在确认拖鞋是不是没搬成功。一句说明此刻知道什么，接上页面为什么这样显示。"},{"type":"speech","ja":"\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>べたかどうかは、まだ\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないんです。\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いていないのは\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>なので、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にもそう\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>きました。そのうえで、\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>しに\u003cruby>行\u003crt>い\u003c/rt>\u003c/ruby>く\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>の\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりになるように、もともとスリッパがあった\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と、\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だった\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>示\u003crt>しめ\u003c/rt>\u003c/ruby>しています。","zh":"现在还不知道有没有搬成功。能确定的是结果通知还没到，所以页面上也是这样写的。要自己去找的人需要线索，所以我标出了拖鞋原先在哪里、机器人原来要把它送去哪里。"}]},{"id":"tuck-5","title":"「どこまで動くものを作ったんですか。」","menuTitle":"TUCK · 原型能操作到哪一步","page":"","blocks":[{"type":"prompt","ja":"どこまで\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>くものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":""},{"type":"note","ja":"","zh":"翻P42。先说可点击的具体操作，再讲按下后能看到哪两个状态。"},{"type":"speech","ja":"ロボットが\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>んでいる\u003cruby>途中\u003crt>とちゅう\u003c/rt>\u003c/ruby>で、\u003cruby>一時停止\u003crt>いちじていし\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>むところを、ブラウザーで\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>できるようにしました。\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>した\u003cruby>直後\u003crt>ちょくご\u003c/rt>\u003c/ruby>は、まだ\u003cruby>本当\u003crt>ほんとう\u003c/rt>\u003c/ruby>に\u003cruby>止\u003crt>と\u003c/rt>\u003c/ruby>まったか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないので、「ロボットの\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っています」と\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>ます。\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>したという\u003cruby>模擬\u003crt>もぎ\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>くと、\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて「\u003cruby>再開\u003crt>さいかい\u003c/rt>\u003c/ruby>する」が\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>せます。この\u003cruby>切\u003crt>き\u003c/rt>\u003c/ruby>り\u003cruby>替\u003crt>か\u003c/rt>\u003c/ruby>わりまで\u003cruby>試作\u003crt>しさく\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめました。","zh":"我把机器人搬东西途中按暂停的这段，做成了可以在浏览器里操作的原型。刚按下去，还不知道机器是否已经停住，所以先显示「正在等待机器人停止」。等模拟的停止通知到了，才可以按「继续」。我在原型里确认了这段状态切换。"}]},{"id":"tuck-6","title":"「結果画面も、実際に使ってもらったんですか。」","menuTitle":"TUCK · 结果页的试用情况","page":"","blocks":[{"type":"prompt","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>も、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>ってもらったんですか。","zh":""},{"type":"note","ja":"","zh":"对方在问P34、P39的设计有没有找人试过。接着刚讲过的拖鞋场景说。"},{"type":"speech","ja":"\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>は、まだ\u003cruby>人\u003crt>ひと\u003c/rt>\u003c/ruby>に\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>してもらっていません。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>を\u003cruby>大\u003crt>おお\u003c/rt>\u003c/ruby>きく\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>す\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>と、\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>が\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なスリッパを\u003cruby>先\u003crt>さき\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>す\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>をそれぞれ\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらって、「この\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たら、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をしようと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>いますか」と\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>いてみたいです。そこからスリッパを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>そうと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>うか、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>でどこを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せばいいか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たいです。","zh":"结果页还没请人实际试过。下一步我想让人分别看看突出件数的版本和先显示待确认拖鞋的版本，问一句「接下来你会做什么？」看他们会不会想到去找拖鞋，再看到了下一张页面，知不知道可以从哪儿找起。"}]}]},{"id":"folio-qa-mori","label":"MORI｜购物 App 内的服装退货流程","items":[{"id":"folio-qa-mori-1","title":"你设想的使用者是什么样的人？","page":"P9","blocks":[{"type":"prompt","ja":"どんな\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>したんですか。","zh":"你设想的使用者是什么样的人？"},{"type":"speech","ja":"スマホでよく\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>うけれど、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>経験\u003crt>けいけん\u003c/rt>\u003c/ruby>は\u003cruby>少\u003crt>すく\u003c/rt>\u003c/ruby>ない\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>です。\u003cruby>通販\u003crt>つうはん\u003c/rt>\u003c/ruby>サイトの\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べるうちに、\u003cruby>普段\u003crt>ふだん\u003c/rt>\u003c/ruby>の\u003cruby>買\u003crt>か\u003c/rt>\u003c/ruby>い\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>には\u003cruby>慣\u003crt>な\u003c/rt>\u003c/ruby>れていても、\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>になると\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をどこで\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめればいいのか\u003cruby>迷\u003crt>まよ\u003c/rt>\u003c/ruby>いそうだと\u003cruby>思\u003crt>おも\u003c/rt>\u003c/ruby>い、この\u003cruby>設定\u003crt>せってい\u003c/rt>\u003c/ruby>にしました。","zh":"她经常用手机买衣服，但很少退货。我对比过网店的退货说明，设定这个用户是为了推演不熟悉流程的人会从哪里开始、需要看什么。"}]},{"id":"folio-qa-mori-2","title":"为什么把流程排成这个顺序？","page":"P11 → P17","blocks":[{"type":"prompt","ja":"どうしてこの\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>にしたんですか。","zh":"为什么把流程排成这个顺序？"},{"type":"speech","ja":"その\u003cruby>場\u003crt>ば\u003c/rt>\u003c/ruby>で\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>を\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えて、\u003cruby>順番\u003crt>じゅんばん\u003c/rt>\u003c/ruby>を\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>めました。まず、\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>したい\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>の\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>を\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すので、\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>の\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>に\u003cruby>入口\u003crt>いりぐち\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>きました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に、いくら\u003cruby>戻\u003crt>もど\u003c/rt>\u003c/ruby>るかで\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>すかどうかを\u003cruby>決\u003crt>き\u003c/rt>\u003c/ruby>められるよう、\u003cruby>集荷\u003crt>しゅうか\u003c/rt>\u003c/ruby>を\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>の\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあとは、どこまで\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>んでいるかを\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>します。","zh":"我按用户当时需要做的决定排序。她先找订单，所以入口放订单详情。要先知道预计退多少，才能决定是否预约取件。寄出后，再确认走到了哪一步。"}]},{"id":"folio-qa-mori-3","title":"为什么选了中间那个方案？","page":"P14","blocks":[{"type":"prompt","ja":"どうして\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだんですか。","zh":"为什么选了中间那个方案？"},{"type":"speech","ja":"\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>は「\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しています」がすぐ\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>めます。\u003cruby>真\u003crt>ま\u003c/rt>\u003c/ruby>ん\u003cruby>中\u003crt>なか\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>なら、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いたことと、お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>の\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>っていることが、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>で\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かります。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>は\u003cruby>両方\u003crt>りょうほう\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かることを\u003cruby>優先\u003crt>ゆうせん\u003c/rt>\u003c/ruby>して、\u003cruby>細\u003crt>こま\u003c/rt>\u003c/ruby>かい\u003cruby>配送\u003crt>はいそう\u003c/rt>\u003c/ruby>\u003cruby>履歴\u003crt>りれき\u003c/rt>\u003c/ruby>や\u003cruby>金額\u003crt>きんがく\u003c/rt>\u003c/ruby>の\u003cruby>内訳\u003crt>うちわけ\u003c/rt>\u003c/ruby>は\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>きました。","zh":"右案能马上读到店家正在确认。中间案还能让人知道包裹确实到了。我优先保留这两条状态，把详细物流和金额明细放到详情里。"}]},{"id":"folio-qa-mori-4","title":"你实际试到了哪一步？","page":"P15 → P21","blocks":[{"type":"prompt","ja":"\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>にどこまで\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>したんですか。","zh":"你实际试到了哪一步？"},{"type":"speech","ja":"\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>の\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>って、\u003cruby>三\u003crt>みっ\u003c/rt>\u003c/ruby>つの\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>をどう\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べるかを\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたところまでです。P15には、\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べ\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>示\u003crt>しめ\u003c/rt>\u003c/ruby>すために\u003cruby>各案\u003crt>かくあん\u003c/rt>\u003c/ruby>\u003cruby>50件\u003crt>ごじゅっけん\u003c/rt>\u003c/ruby>の\u003cruby>仮\u003crt>かり\u003c/rt>\u003c/ruby>の\u003cruby>回答\u003crt>かいとう\u003c/rt>\u003c/ruby>を\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>きました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は、\u003cruby>荷物\u003crt>にもつ\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いた\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てもらって、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>が\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>か、\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>ってよいかを\u003cruby>説明\u003crt>せつめい\u003c/rt>\u003c/ruby>できるか\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめたいです。","zh":"我完成了退货界面，并设计了三案的比较方式。P15 每案 50 条是用来演示比较方法的假设回答。下一步想让人看包裹到店后的界面，看看他能否解释自己该等、还是该联系店家。"}]},{"id":"folio-qa-mori-5","title":"在界面上展示退款进度时，你特别留意了什么？","page":"P22","blocks":[{"type":"prompt","ja":"\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>の\u003cruby>状況\u003crt>じょうきょう\u003c/rt>\u003c/ruby>を\u003cruby>伝\u003crt>つた\u003c/rt>\u003c/ruby>えるとき、どんなところに\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>をつけましたか。","zh":"在界面上展示退款进度时，你特别留意了什么？"},{"type":"speech","ja":"お\u003cruby>店\u003crt>みせ\u003c/rt>\u003c/ruby>が\u003cruby>返金\u003crt>へんきん\u003c/rt>\u003c/ruby>の\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きをしてから、カードの\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>るまでには\u003cruby>時間差\u003crt>じかんさ\u003c/rt>\u003c/ruby>があります。そこで\u003cruby>手続\u003crt>てつづ\u003c/rt>\u003c/ruby>きが\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わった\u003cruby>日\u003crt>ひ\u003c/rt>\u003c/ruby>と、\u003cruby>明細\u003crt>めいさい\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>で\u003c/rt>\u003c/ruby>る\u003cruby>目安\u003crt>めやす\u003c/rt>\u003c/ruby>を\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>けて\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>しました。","zh":"店家处理退款和银行卡账单显示退款之间有时间差，所以我分开显示店家处理的日期和预计入账时间。"}]},{"id":"folio-qa-mori-6","title":"你是怎么了解买家在退货时会遇到哪些困难的？","page":"P8 → P9","blocks":[{"type":"prompt","ja":"\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>するときにどんなことに\u003cruby>困\u003crt>こま\u003c/rt>\u003c/ruby>るか、どう\u003cruby>調\u003crt>しら\u003c/rt>\u003c/ruby>べましたか。","zh":"你是怎么了解买家在退货时会遇到哪些困难的？"},{"type":"speech","ja":"\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>は\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>き\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>りはしていません。\u003cruby>通販\u003crt>つうはん\u003c/rt>\u003c/ruby>サイトの\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>\u003cruby>案内\u003crt>あんない\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べて、\u003cruby>服\u003crt>ふく\u003c/rt>\u003c/ruby>を\u003cruby>一着\u003crt>いっちゃく\u003c/rt>\u003c/ruby>だけ\u003cruby>返\u003crt>かえ\u003c/rt>\u003c/ruby>す\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>組\u003crt>く\u003c/rt>\u003c/ruby>み\u003cruby>立\u003crt>た\u003c/rt>\u003c/ruby>てました。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>聞\u003crt>き\u003c/rt>\u003c/ruby>くなら、\u003cruby>送\u003crt>おく\u003c/rt>\u003c/ruby>ったあとに\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>が\u003cruby>気\u003crt>き\u003c/rt>\u003c/ruby>になって、どこを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>したかを、\u003cruby>実際\u003crt>じっさい\u003c/rt>\u003c/ruby>に\u003cruby>返品\u003crt>へんぴん\u003c/rt>\u003c/ruby>した\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>に\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いたいです。","zh":"这次没有做访谈。我比较了网店的退货说明，再设计只退一件衣服的情境。如果接下来访问实际退过货的人，我想问的是，寄出后最惦记什么，又去哪里确认。"}]}],"shelf":"portfolio-qa"},{"id":"folio-qa-tuck","label":"TUCK T10｜机器人整理小物","items":[{"id":"folio-qa-tuck-1","title":"谁会用它？在什么情况下用？","page":"P29–31","blocks":[{"type":"prompt","ja":"\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が、どんなときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うんですか。","zh":"谁会用它？在什么情况下用？"},{"type":"speech","ja":"\u003cruby>家\u003crt>いえ\u003c/rt>\u003c/ruby>でロボット\u003cruby>掃除機\u003crt>そうじき\u003c/rt>\u003c/ruby>を\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っていて、\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけたい\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>びたい\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>を\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>しました。\u003cruby>例\u003crt>たと\u003c/rt>\u003c/ruby>えばリビングで、\u003cruby>靴下\u003crt>くつした\u003c/rt>\u003c/ruby>とスリッパを\u003cruby>地図\u003crt>ちず\u003c/rt>\u003c/ruby>から\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んで\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけを\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>です。\u003cruby>今回\u003crt>こんかい\u003c/rt>\u003c/ruby>は、\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んだあとの\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>み\u003cruby>具合\u003crt>ぐあい\u003c/rt>\u003c/ruby>と、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からないときの\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>を\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"我设想的是想让机器人帮忙整理指定物品的人。比如在客厅从地图上选中袜子和拖鞋。本次重点是选完后怎样看进度，以及没收到结果时怎么查。"}]},{"id":"folio-qa-tuck-2","title":"你怎么设计确认结果的流程？","page":"P32、P39","blocks":[{"type":"prompt","ja":"どういう\u003cruby>流\u003crt>なが\u003c/rt>\u003c/ruby>れで\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>するようにしたんですか。","zh":"你怎么设计确认结果的流程？"},{"type":"speech","ja":"\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>は\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>き\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめられるようにし、\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>き\u003cruby>始\u003crt>はじ\u003c/rt>\u003c/ruby>めたら、どの\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>扱\u003crt>あつか\u003c/rt>\u003c/ruby>っているかを\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>作業\u003crt>さぎょう\u003c/rt>\u003c/ruby>が\u003cruby>終\u003crt>お\u003c/rt>\u003c/ruby>わったときには、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>からない\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>だけ、\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すための\u003cruby>手\u003crt>て\u003c/rt>\u003c/ruby>がかりへ\u003cruby>進\u003crt>すす\u003c/rt>\u003c/ruby>めます。ロボットに\u003cruby>任\u003crt>まか\u003c/rt>\u003c/ruby>せている\u003cruby>間\u003crt>あいだ\u003c/rt>\u003c/ruby>と、\u003cruby>自分\u003crt>じぶん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめる\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>で、\u003cruby>知\u003crt>し\u003c/rt>\u003c/ruby>りたいことが\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>うからです。","zh":"发出指令前先确认会搬去哪里，开始后看机器人正在处理哪件。结束后，只有结果未知的物品才需要进一步去找。因为委托期间和自己动手确认时，需要的信息不同。"}]},{"id":"folio-qa-tuck-3","title":"整理完成之后，你想让用户最先看到什么？","page":"P34 → P39","blocks":[{"type":"prompt","ja":"\u003cruby>片\u003crt>かた\u003c/rt>\u003c/ruby>づけの\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>は、\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をいちばん\u003cruby>目立\u003crt>めだ\u003c/rt>\u003c/ruby>たせようと\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えましたか。","zh":"整理完成之后，你想让用户最先看到什么？"},{"type":"speech","ja":"\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>で\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>は\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かりますが、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すのはスリッパなんですよね。\u003cruby>右\u003crt>みぎ\u003c/rt>\u003c/ruby>の\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>では、そのスリッパを\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>に\u003cruby>置\u003crt>お\u003c/rt>\u003c/ruby>いて、\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だった\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>ボタンも\u003cruby>一緒\u003crt>いっしょ\u003c/rt>\u003c/ruby>に\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しました。\u003cruby>全体\u003crt>ぜんたい\u003c/rt>\u003c/ruby>の\u003cruby>件数\u003crt>けんすう\u003c/rt>\u003c/ruby>も、\u003cruby>上\u003crt>うえ\u003c/rt>\u003c/ruby>の\u003cruby>一行\u003crt>いちぎょう\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめられます。","zh":"件数能概括整体，但下一步要找的是拖鞋。所以右案把拖鞋放前面，同卡显示预定位置和确认按钮。件数仍可以从上方一行读到。"}]},{"id":"folio-qa-tuck-4","title":"你把哪些部分做成了能实际操作的东西？","page":"P42","blocks":[{"type":"prompt","ja":"どこまで\u003cruby>動\u003crt>うご\u003c/rt>\u003c/ruby>くものを\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>ったんですか。","zh":"你把哪些部分做成了能实际操作的东西？"},{"type":"speech","ja":"\u003cruby>一時停止\u003crt>いちじていし\u003c/rt>\u003c/ruby>の\u003cruby>部分\u003crt>ぶぶん\u003c/rt>\u003c/ruby>を、ブラウザーでクリックして\u003cruby>試\u003crt>ため\u003c/rt>\u003c/ruby>せる\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>にしました。ボタンを\u003cruby>押\u003crt>お\u003c/rt>\u003c/ruby>した\u003cruby>直後\u003crt>ちょくご\u003c/rt>\u003c/ruby>は\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>を\u003cruby>待\u003crt>ま\u003c/rt>\u003c/ruby>つ\u003cruby>表示\u003crt>ひょうじ\u003c/rt>\u003c/ruby>にして、\u003cruby>停止\u003crt>ていし\u003c/rt>\u003c/ruby>したという\u003cruby>模擬\u003crt>もぎ\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>き\u003c/rt>\u003c/ruby>たら、\u003cruby>再開\u003crt>さいかい\u003c/rt>\u003c/ruby>できるようにしました。\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>については、\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>に、この\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>初\u003crt>はじ\u003c/rt>\u003c/ruby>めて\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>る\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>が、どの\u003cruby>物\u003crt>もの\u003c/rt>\u003c/ruby>を\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>しようとするか、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>にどこを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>すかを\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>てみたいです。","zh":"我把暂停部分做成了浏览器可点的原型。按下后先显示等待停止，收到模拟的停止通知后才可继续。结果界面下一步想看初次使用的人会先确认哪件、先去哪里找。"}]},{"id":"folio-qa-tuck-5","title":"没收到通知，就表示搬运失败了吗？","page":"P39","blocks":[{"type":"prompt","ja":"\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>来\u003crt>こ\u003c/rt>\u003c/ruby>ないのは、\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶのに\u003cruby>失敗\u003crt>しっぱい\u003c/rt>\u003c/ruby>したということですか。","zh":"没收到通知，就表示搬运失败了吗？"},{"type":"speech","ja":"この\u003cruby>時点\u003crt>じてん\u003c/rt>\u003c/ruby>で\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるのは、\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>の\u003cruby>通知\u003crt>つうち\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>いていないことです。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>では、\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>つけた\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>と\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>予定\u003crt>よてい\u003c/rt>\u003c/ruby>だった\u003cruby>場所\u003crt>ばしょ\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>して、\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>方\u003crt>かた\u003c/rt>\u003c/ruby>がご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>で\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめた\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>を\u003cruby>別\u003crt>べつ\u003c/rt>\u003c/ruby>に\u003cruby>記録\u003crt>きろく\u003c/rt>\u003c/ruby>できるようにしました。","zh":"当时只知道结果通知还没收到。界面给出初始发现点和预定放置点，让人自己确认，并单独留下确认记录。"}]},{"id":"folio-qa-tuck-6","title":"已有机器人的资料和你自己设计的部分，分别是什么？","page":"P30 → P31 → P39","blocks":[{"type":"prompt","ja":"ご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>で\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたのは、\u003cruby>製品\u003crt>せいひん\u003c/rt>\u003c/ruby>のどの\u003cruby>部分\u003crt>ぶぶん\u003c/rt>\u003c/ruby>ですか。","zh":"已有机器人的资料和你自己设计的部分，分别是什么？"},{"type":"speech","ja":"\u003cruby>小物\u003crt>こもの\u003c/rt>\u003c/ruby>をつかんで\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶ\u003cruby>機能\u003crt>きのう\u003c/rt>\u003c/ruby>は、\u003cruby>既存\u003crt>きそん\u003c/rt>\u003c/ruby>の\u003cruby>製品\u003crt>せいひん\u003c/rt>\u003c/ruby>を\u003cruby>参考\u003crt>さんこう\u003c/rt>\u003c/ruby>にしています。\u003cruby>私\u003crt>わたし\u003c/rt>\u003c/ruby>が\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えたのはアプリの\u003cruby>側\u003crt>がわ\u003c/rt>\u003c/ruby>です。\u003cruby>何\u003crt>なに\u003c/rt>\u003c/ruby>をどこへ\u003cruby>運\u003crt>はこ\u003c/rt>\u003c/ruby>ぶかを\u003cruby>頼\u003crt>たの\u003c/rt>\u003c/ruby>む\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめて、あとで\u003cruby>結果\u003crt>けっか\u003c/rt>\u003c/ruby>が\u003cruby>届\u003crt>とど\u003c/rt>\u003c/ruby>かなかったときに、ご\u003cruby>自身\u003crt>じしん\u003c/rt>\u003c/ruby>でどこを\u003cruby>探\u003crt>さが\u003c/rt>\u003c/ruby>せばいいか\u003cruby>分\u003crt>わ\u003c/rt>\u003c/ruby>かるところまでを\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>にしました。","zh":"抓取和搬运物体的功能参考了现有产品。我设计的是 App 这部分，从发出指令前核对物品和去向，到结果没传回来时人可以怎样寻找，都做成了界面。"}]}],"shelf":"portfolio-qa"},{"id":"folio-qa-reframe","label":"Reframe｜旧业务界面重做","items":[{"id":"folio-qa-reframe-1","title":"这个工具是给谁用的？","page":"P43–44","blocks":[{"type":"prompt","ja":"\u003cruby>誰\u003crt>だれ\u003c/rt>\u003c/ruby>が\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>うツールですか。","zh":"这个工具是给谁用的？"},{"type":"speech","ja":"\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>の\u003cruby>業務\u003crt>ぎょうむ\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>すデザイナー\u003cruby>向\u003crt>む\u003c/rt>\u003c/ruby>けです。\u003cruby>編集\u003crt>へんしゅう\u003c/rt>\u003c/ruby>できる\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>のデータが\u003cruby>残\u003crt>のこ\u003c/rt>\u003c/ruby>っておらず、\u003cruby>短\u003crt>みじか\u003c/rt>\u003c/ruby>い\u003cruby>期間\u003crt>きかん\u003c/rt>\u003c/ruby>に\u003cruby>多\u003crt>おお\u003c/rt>\u003c/ruby>くの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>をそろえる\u003cruby>場面\u003crt>ばめん\u003c/rt>\u003c/ruby>を\u003cruby>想定\u003crt>そうてい\u003c/rt>\u003c/ruby>しました。\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>るときに\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>う\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>は、\u003cruby>会社\u003crt>かいしゃ\u003c/rt>\u003c/ruby>のデザインルールに\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>わせることが\u003cruby>前提\u003crt>ぜんてい\u003c/rt>\u003c/ruby>です。","zh":"使用者是重做公司业务界面的设计师。他手里缺少可编辑源文件，又得在短期内处理很多页，组件还要符合公司的设计规则。"}]},{"id":"folio-qa-reframe-2","title":"为什么在导出之前安排人工确认？","page":"P45–47","blocks":[{"type":"prompt","ja":"なぜ\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>き\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>す\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、デザイナーが\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>するんですか。","zh":"为什么在导出之前安排人工确认？"},{"type":"speech","ja":"\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>画像\u003crt>がぞう\u003c/rt>\u003c/ruby>から\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>や\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>の\u003cruby>役割\u003crt>やくわり\u003c/rt>\u003c/ruby>を\u003cruby>読\u003crt>よ\u003c/rt>\u003c/ruby>み\u003cruby>取\u003crt>と\u003c/rt>\u003c/ruby>り、AIが\u003cruby>合\u003crt>あ\u003c/rt>\u003c/ruby>いそうな\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>を\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>します。「\u003cruby>承認待\u003crt>しょうにんま\u003c/rt>\u003c/ruby>ち」が\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>ボタンに\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わると、\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>の\u003cruby>意味\u003crt>いみ\u003c/rt>\u003c/ruby>まで\u003cruby>変\u003crt>か\u003c/rt>\u003c/ruby>わってしまいます。そこで\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>き\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>す\u003cruby>前\u003crt>まえ\u003c/rt>\u003c/ruby>に、デザイナーが\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>役割\u003crt>やくわり\u003c/rt>\u003c/ruby>と\u003cruby>候補\u003crt>こうほ\u003c/rt>\u003c/ruby>を\u003cruby>見比\u003crt>みくら\u003c/rt>\u003c/ruby>べ、\u003cruby>必要\u003crt>ひつよう\u003c/rt>\u003c/ruby>なところを\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>せるようにしました。","zh":"先从旧截图中判断信息和操作的作用，让 AI 出候选。如果「等待审批」被变成可按的按钮，意思就变了，所以在导出前让人核对原用途和候选，必要时先改。"}]},{"id":"folio-qa-reframe-3","title":"为什么让设计师选择要修改哪些页面？","page":"P49","blocks":[{"type":"prompt","ja":"なぜ\u003cruby>変更\u003crt>へんこう\u003c/rt>\u003c/ruby>する\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>べるようにしたんですか。","zh":"为什么让设计师选择要修改哪些页面？"},{"type":"speech","ja":"\u003cruby>注文\u003crt>ちゅうもん\u003c/rt>\u003c/ruby>の「\u003cruby>承認待\u003crt>しょうにんま\u003c/rt>\u003c/ruby>ち」は、\u003cruby>一覧\u003crt>いちらん\u003c/rt>\u003c/ruby>と\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>でまとめて\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>せます。\u003cruby>一方\u003crt>いっぽう\u003c/rt>\u003c/ruby>、\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>形\u003crt>かたち\u003c/rt>\u003c/ruby>のラベルでも、\u003cruby>商品\u003crt>しょうひん\u003c/rt>\u003c/ruby>の\u003cruby>公開\u003crt>こうかい\u003c/rt>\u003c/ruby>\u003cruby>状態\u003crt>じょうたい\u003c/rt>\u003c/ruby>を\u003cruby>示\u003crt>しめ\u003c/rt>\u003c/ruby>すものは\u003cruby>用途\u003crt>ようと\u003c/rt>\u003c/ruby>が\u003cruby>違\u003crt>ちが\u003c/rt>\u003c/ruby>います。\u003cruby>最初\u003crt>さいしょ\u003c/rt>\u003c/ruby>に\u003cruby>変更先\u003crt>へんこうさき\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>て、\u003cruby>対象\u003crt>たいしょう\u003c/rt>\u003c/ruby>を\u003cruby>選\u003crt>えら\u003c/rt>\u003c/ruby>んでから\u003cruby>適用\u003crt>てきよう\u003c/rt>\u003c/ruby>すれば、\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つの\u003cruby>変更\u003crt>へんこう\u003c/rt>\u003c/ruby>が\u003cruby>意図\u003crt>いと\u003c/rt>\u003c/ruby>しない\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>に\u003cruby>広\u003crt>ひろ\u003c/rt>\u003c/ruby>がるのを\u003cruby>防\u003crt>ふせ\u003c/rt>\u003c/ruby>げると\u003cruby>考\u003crt>かんが\u003c/rt>\u003c/ruby>えました。","zh":"订单的「等待审批」可以在列表和详情统一调整。外形一样的商品公开状态标签，用途却不同。所以先预览和选择适用页面，再批量修改，避免一次改动扩散到无关页面。"}]},{"id":"folio-qa-reframe-4","title":"你做到哪一步了？接下来怎么验证效果？","page":"P52 → P54","blocks":[{"type":"prompt","ja":"どこまで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>って、どう\u003cruby>効果\u003crt>こうか\u003c/rt>\u003c/ruby>を\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめますか。","zh":"你做到哪一步了？接下来怎么验证效果？"},{"type":"speech","ja":"\u003cruby>今\u003crt>いま\u003c/rt>\u003c/ruby>はツールの\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>と、\u003cruby>受注\u003crt>じゅちゅう\u003c/rt>\u003c/ruby>\u003cruby>詳細\u003crt>しょうさい\u003c/rt>\u003c/ruby>を\u003cruby>共通\u003crt>きょうつう\u003c/rt>\u003c/ruby>の\u003cruby>部品\u003crt>ぶひん\u003c/rt>\u003c/ruby>で\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>り\u003cruby>直\u003crt>なお\u003c/rt>\u003c/ruby>した\u003cruby>例\u003crt>れい\u003c/rt>\u003c/ruby>まで\u003cruby>作\u003crt>つく\u003c/rt>\u003c/ruby>りました。AIによる\u003cruby>変換\u003crt>へんかん\u003c/rt>\u003c/ruby>とFigmaへの\u003cruby>書\u003crt>か\u003c/rt>\u003c/ruby>き\u003cruby>出\u003crt>だ\u003c/rt>\u003c/ruby>しは、ツール\u003cruby>案\u003crt>あん\u003c/rt>\u003c/ruby>として\u003cruby>設計\u003crt>せっけい\u003c/rt>\u003c/ruby>した\u003cruby>部分\u003crt>ぶぶん\u003c/rt>\u003c/ruby>です。\u003cruby>次\u003crt>つぎ\u003c/rt>\u003c/ruby>は\u003cruby>同\u003crt>おな\u003c/rt>\u003c/ruby>じ\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>を\u003cruby>手作業\u003crt>てさぎょう\u003c/rt>\u003c/ruby>とツールで\u003cruby>比\u003crt>くら\u003c/rt>\u003c/ruby>べて、\u003cruby>元\u003crt>もと\u003c/rt>\u003c/ruby>の\u003cruby>情報\u003crt>じょうほう\u003c/rt>\u003c/ruby>や\u003cruby>操作\u003crt>そうさ\u003c/rt>\u003c/ruby>が\u003cruby>保\u003crt>たも\u003c/rt>\u003c/ruby>たれていることを\u003cruby>条件\u003crt>じょうけん\u003c/rt>\u003c/ruby>に、\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>と\u003cruby>修正\u003crt>しゅうせい\u003c/rt>\u003c/ruby>を\u003cruby>含\u003crt>ふく\u003c/rt>\u003c/ruby>めた\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>を\u003cruby>見\u003crt>み\u003c/rt>\u003c/ruby>たいです。","zh":"目前做了工具界面，以及用共用组件重做订单详情的示例。AI 转换和 Figma 导出是方案中设计的环节。下一步需要在同一批画面上比较两种做法，先保证原信息和操作保留，再看加上检查和修改之后的时间。"}]},{"id":"folio-qa-reframe-5","title":"什么情况下用了这个工具反而不划算？","page":"P53","blocks":[{"type":"prompt","ja":"ツールを\u003cruby>使\u003crt>つか\u003c/rt>\u003c/ruby>っても\u003cruby>手間\u003crt>てま\u003c/rt>\u003c/ruby>が\u003cruby>増\u003crt>ふ\u003c/rt>\u003c/ruby>えるのは、どんな\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>ですか。","zh":"什么情况下用了这个工具反而不划算？"},{"type":"speech","ja":"\u003cruby>候補\u003crt>こうほ\u003c/rt>\u003c/ruby>を\u003cruby>一\u003crt>ひと\u003c/rt>\u003c/ruby>つずつ\u003cruby>確\u003crt>たし\u003c/rt>\u003c/ruby>かめるのに\u003cruby>時間\u003crt>じかん\u003c/rt>\u003c/ruby>がかかる\u003cruby>場合\u003crt>ばあい\u003c/rt>\u003c/ruby>です。この\u003cruby>試算\u003crt>しさん\u003c/rt>\u003c/ruby>では、\u003cruby>確認\u003crt>かくにん\u003c/rt>\u003c/ruby>が\u003cruby>一\u003crt>いち\u003c/rt>\u003c/ruby>\u003cruby>画面\u003crt>がめん\u003c/rt>\u003c/ruby>\u003cruby>16分\u003crt>じゅうろっぷん\u003c/rt>\u003c/ruby>なら\u003cruby>費用\u003crt>ひよう\u003c/rt>\u003c/ruby>は\u003cruby>下\u003crt>さ\u003c/rt>\u003c/ruby>がりますが、\u003cruby>32分\u003crt>さんじゅうにふん\u003
